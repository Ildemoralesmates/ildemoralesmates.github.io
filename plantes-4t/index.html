<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La vida de les plantes · 4t de Primària</title>
<meta name="description" content="Resum il·lustrat i 11 activitats (fletxes, buits, etiquetes, sopa de lletres, encreuades, test i aventura) per a estudiar les plantes en 4t de Primària, amb estrelles.">

<style>
:root{--g:#2e7d4f;--g2:#e3f4e8;--ink:#1d3328;--y:#f5b301;--bad:#d64545;--ok:#2e9e4a;--bg:#f2f9ef;--card:#fff;--line:#cfe5d6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45}
#app{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0}
.btn{min-height:56px;padding:10px 22px;border-radius:16px;border:3px solid var(--g);background:#fff;color:var(--g);font-weight:700;touch-action:manipulation}
.btn.pri{background:var(--g);color:#fff}
.btn:active{transform:scale(.97)}
.btn[hidden]{display:none}
.hero{background:linear-gradient(135deg,#2e7d4f,#58b560);color:#fff;border-radius:24px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero h1{font-size:clamp(24px,5vw,36px)}
.hero p{margin:4px 0 0;opacity:.95}
.score{background:rgba(255,255,255,.2);border-radius:18px;padding:12px 18px;text-align:center;min-width:220px}
.score b{font-size:28px}
.bar{height:14px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--y);border-radius:9px;transition:width .5s}
.grp{margin:26px 4px 10px;font-size:22px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;gap:14px;align-items:center;min-height:100px;touch-action:manipulation}
.tile:hover{border-color:var(--g)}
.tile .ic{font-size:40px;line-height:1}
.tile h3{font-size:19px}
.tile p{margin:2px 0 4px;font-size:15px;color:#4a6355}
.tile .stars{font-size:22px;letter-spacing:2px;color:#cfd8d2}
.tile .stars .on{color:var(--y)}
.tile.done{border-color:#9ad2a8;background:#f7fdf8}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.top h2{font-size:clamp(22px,4vw,30px);color:var(--g)}
.body{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px}
.sub{font-weight:700;color:var(--g);margin:0 0 4px}
.hint{margin:0 0 12px;color:#4a6355;font-size:16px}
.msg{min-height:28px;margin:10px 0;font-weight:600}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bad)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.dots{display:flex;gap:6px;margin:0 0 12px}
.dots i{width:14px;height:14px;border-radius:50%;background:#d7e6dc}
.dots i.on{background:var(--g)}
/* unir */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 70px;margin:10px 0}
.match .col{display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
.match svg.lines{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.it{min-height:62px;padding:10px 14px;border-radius:14px;border:3px solid #9fbfae;background:#fff;text-align:left;font-weight:600;touch-action:manipulation}
.it.def{font-weight:500;font-size:16px}
.it.sel{border-color:var(--y);background:#fff6d8}
.it.done{border-color:var(--ok);background:#e2f7e7;cursor:default}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:560px){.match{gap:12px 36px}.it{font-size:15px;padding:8px}.it.def{font-size:14px}}
/* buits */
.fill{font-size:21px;line-height:2.3}
.blank{display:inline-block;min-width:110px;min-height:44px;padding:2px 10px;margin:0 4px;border:3px dashed #7aa88b;border-radius:12px;background:#f3faf5;font:inherit;font-weight:700;text-align:center;vertical-align:middle}
input.blank{width:auto;border-style:solid;outline:none}
.blank.ok{border:3px solid var(--ok);background:#e2f7e7}
.blank.bad{border:3px solid var(--bad);background:#fde7e7}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chip{min-height:50px;padding:6px 16px;border-radius:25px;border:3px solid var(--g);background:#fff;font-weight:700;touch-action:manipulation}
.chip.sel{background:var(--y);border-color:#c68f00}
.chip:disabled{opacity:.35;cursor:default}
/* diagrames */
.dg{width:100%;max-width:640px;display:block;margin:0 auto;border-radius:18px;border:2px solid var(--line);background:#fff}
.slot{cursor:pointer}
.slot .sr{fill:#fff;stroke:#2b7a78;stroke-width:2.5;stroke-dasharray:6 4}
.slot .st{font:700 14px system-ui,Arial,sans-serif;fill:#1f3d3a}
.slot.filled .sr{stroke-dasharray:none;fill:#e6f6f0}
.slot.ok .sr{stroke:var(--ok);fill:#d9f7e0;stroke-dasharray:none}
.slot.bad .sr{stroke:var(--bad);fill:#fde3e3;stroke-dasharray:none}
/* ordenar */
.slots{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:n}
.slot2{counter-increment:n;display:flex;align-items:center;gap:10px;min-height:62px;border:3px dashed #9fbfae;border-radius:14px;padding:6px 10px;background:#f7fcf8}
.slot2::before{content:counter(n);background:var(--g);color:#fff;border-radius:50%;min-width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.slot2.filled{border-style:solid;background:#fff}
.slot2.ok{border-color:var(--ok);background:#e2f7e7}
.slot2.bad{border-color:var(--bad);background:#fde7e7}
.slot2 .empty{color:#8aa093;font-size:16px}
.card2{border:3px solid #9fbfae;background:#fff;border-radius:12px;padding:10px 14px;text-align:left;font-weight:600;min-height:50px;width:100%;touch-action:manipulation}
.card2.pl{width:auto;background:#fffbe8;border-color:#e0c15a}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
/* classificar */
.big{font-size:26px;font-weight:800;text-align:center;margin:12px 0 18px;min-height:80px;display:grid;place-items:center}
.big svg{width:130px;height:130px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opt{min-height:64px;border-radius:16px;border:3px solid var(--g);background:#fff;font-weight:700;font-size:19px;touch-action:manipulation}
.opt.ok{background:#d9f7e0;border-color:var(--ok)}
.opt.bad{background:#fde3e3;border-color:var(--bad);opacity:.7}
/* parelles */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:700px;margin:10px auto}
.mc{aspect-ratio:1/.8;min-height:76px;border-radius:14px;border:3px solid var(--g);background:#58b560;font-weight:700;font-size:15px;padding:4px;display:grid;place-items:center;touch-action:manipulation}
.mc .back{font-size:34px}
.mc .front{display:none;color:var(--ink)}
.mc.flip,.mc.got{background:#fff}
.mc.flip .back,.mc.got .back{display:none}
.mc.flip .front,.mc.got .front{display:block;text-align:center}
.mc.got{border-color:var(--ok);background:#e2f7e7}
.mc .front.d{font-weight:500;font-size:14px}
/* sopa */
.soup{display:grid;gap:4px;max-width:560px;margin:10px auto;user-select:none;-webkit-user-select:none}
.sc{aspect-ratio:1;border-radius:8px;border:2px solid #cfe0d5;background:#fff;font-weight:800;font-size:clamp(14px,3.6vw,22px);padding:0;touch-action:manipulation}
.sc.start{background:var(--y)}
.sc.found{background:#bdeccb;border-color:var(--ok)}
.sc.hint{background:#ffd9a8;animation:pu .6s 3}
@keyframes pu{50%{transform:scale(1.15)}}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.words span{padding:4px 12px;border-radius:16px;background:#eef6f0;font-weight:700}
.words span.f{background:#bdeccb;text-decoration:line-through}
/* encreuades */
.cw{display:grid;gap:3px;margin:10px auto;max-width:640px;justify-content:center}
.cc{position:relative;width:clamp(26px,7.6vw,46px);height:clamp(26px,7.6vw,46px)}
.cc input{width:100%;height:100%;padding:0;text-align:center;font:800 clamp(14px,4vw,22px) system-ui;text-transform:uppercase;border:2px solid #6b8f7a;border-radius:6px;background:#fff;color:var(--ink)}
.cc input.ok{background:#d9f7e0;border-color:var(--ok)}
.cc input.bad{background:#fde3e3;border-color:var(--bad)}
.cc small{position:absolute;left:3px;top:0;font-size:10px;font-weight:700;color:var(--g);pointer-events:none}
.clues{columns:2 260px;margin:12px 0;font-size:16px}
.clues p{margin:0 0 6px;break-inside:avoid}
/* test */
.q{font-size:22px;font-weight:700;margin:6px 0 14px}
.qopts{display:grid;gap:10px}
.qo{min-height:60px;border-radius:14px;border:3px solid #9fbfae;background:#fff;text-align:left;padding:8px 14px;font-weight:600;touch-action:manipulation}
.qo.ok{background:#d9f7e0;border-color:var(--ok)}
.qo.bad{background:#fde3e3;border-color:var(--bad)}
/* aventura */
.adv{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px;align-items:start}
@media(max-width:700px){.adv{grid-template-columns:1fr}.adv svg{max-width:300px;margin:0 auto}}
.story{font-size:20px;margin:0 0 14px}
.box{border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:600}
.box.bad{background:#fde7e7;border:2px solid var(--bad)}
.box.ok{background:#e2f7e7;border:2px solid var(--ok)}
/* estudi */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{min-height:50px;padding:6px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:700;touch-action:manipulation}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.pts{padding-left:22px}
.pts li{margin:8px 0}
.leaves{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.leaves figure{margin:0;text-align:center;background:#f3faf5;border-radius:14px;padding:6px}
.leaves svg{width:90px;height:90px}
.leaves figcaption{font-weight:700;font-size:15px}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0}
.kind{border-radius:16px;padding:12px 14px;background:#f3faf5;border:2px solid var(--line)}
.kind h4{margin:0 0 4px;color:var(--g)}
/* resultat */
.ov{position:fixed;inset:0;background:rgba(20,40,28,.6);display:grid;place-items:center;padding:16px;z-index:50}
.res{background:#fff;border-radius:26px;padding:26px;max-width:460px;width:100%;text-align:center}
.bigstars{font-size:60px;letter-spacing:6px;color:#d7dfd9}
.bigstars .on{color:var(--y);animation:pop .5s both}
.bigstars span:nth-child(2){animation-delay:.2s}.bigstars span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.res .row{justify-content:center}
.new{color:var(--ok);font-weight:800}
.foot{text-align:center;margin-top:30px}
.small{font-size:14px;color:#5b7366}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

const SKY='<rect width="520" height="420" fill="#e9f6ff"/>';

  '<ellipse cx="265" cy="312" rx="23" ry="27" fill="#7bcf6a" stroke="#3f8f4a" stroke-width="3"/>'+

  '<path d="M265 335 L265 412" stroke="#3f8f4a" stroke-width="14"/>';
}
function sunSvg(){
  let r='';for(let a=0;a<360;a+=45){const c=Math.cos(a*Math.PI/180),s=Math.sin(a*Math.PI/180);r+=`<line x1="${60+30*c}" y1="${48+30*s}" x2="${60+40*c}" y2="${48+40*s}" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>`;}

const LAB=[
 {name:'La planta',svg:basePlant(true),t:[
  {label:'Flor',x:265,y:88,sx:385,sy:40},
  {label:'Fulla',x:332,y:152,sx:385,sy:125},

 {name:'La flor',svg:baseFlower(),t:[

 {name:'La fotosíntesi',svg:basePlant(true)+sunSvg()+

function diagram(R,mode){
  const W=130,H=36;
  let lines='',dots='',slots='';
  R.t.forEach((t,i)=>{
    let x1,y1;
    if(t.x>t.sx+W){x1=t.sx+W;y1=t.sy+H/2;}
    else if(t.x<t.sx){x1=t.sx;y1=t.sy+H/2;}

function leafSVG(kind){

  let body='';
  const poly=(mod)=>{const pts=[];const N=240;for(let i=0;i<N;i++){const th=i/N*2*Math.PI;let f=mod(th);let x=50+27*f*Math.cos(th),y=47+40*f*Math.sin(th);pts.push(x.toFixed(1)+','+y.toFixed(1));}return `<polygon points="${pts.join(' ')}" fill="${F}" stroke="${S}" stroke-width="2.5" stroke-linejoin="round"/>`;};
  switch(kind){

   case 'triangular':body=`<path d="M50 8 L90 80 L10 80Z" fill="${F}" stroke="${S}" stroke-width="2.5" stroke-linejoin="round"/>`;break;
   case 'palmada':body=[-52,-26,0,26,52].map(a=>`<ellipse cx="50" cy="56" rx="9" ry="30" fill="${F}" stroke="${S}" stroke-width="2" transform="rotate(${a} 50 85)"/>`).join('');break;

/* ============ 1. UNEIX ============ */
function runMatch(c){
  let err=0,r=0,drawFn=function(){};
  const rs=()=>drawFn();
  window.addEventListener('resize',rs);
  c.onCleanup(()=>window.removeEventListener('resize',rs));
  function round(){
    c.body.innerHTML='';
    const set=MATCH[r];
    const msg=h('div',{class:'msg'});
    const area=h('div',{class:'match'});
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','lines');
    const L=h('div',{class:'col'}),R=h('div',{class:'col'});
    const next=h('button',{class:'btn pri',onclick:()=>{r++;if(r<MATCH.length)round();else c.finish(starsFor(err,2,6),'Has fet '+err+(err===1?' errada.':' errades.'));}},r<MATCH.length-1?'Següent':'Acabar');
    next.hidden=true;
    let sel=null,done=0;const pairs=[],lb={},rb={};
    function draw(){
      const ar=area.getBoundingClientRect();
      svg.setAttribute('width',ar.width);svg.setAttribute('height',ar.height);
      svg.innerHTML='';
      pairs.forEach(p=>{
        const a=p[0].getBoundingClientRect(),d=p[1].getBoundingClientRect();
        const ln=document.createElementNS(NS,'line');
        ln.setAttribute('x1',a.right-ar.left);ln.setAttribute('y1',a.top+a.height/2-ar.top);
        ln.setAttribute('x2',d.left-ar.left);ln.setAttribute('y2',d.top+d.height/2-ar.top);
        ln.setAttribute('stroke','#2e9e4a');ln.setAttribute('stroke-width','5');ln.setAttribute('stroke-linecap','round');
        svg.append(ln);
      });
    }
    drawFn=draw;
    function click(side,i,b){
      if(b.classList.contains('done'))return;
      if(!sel||sel.side===side){if(sel)sel.b.classList.remove('sel');sel={side:side,i:i,b:b};b.classList.add('sel');return;}
      sel.b.classList.remove('sel');
      if(sel.i===i){
        lb[i].classList.add('done');rb[i].classList.add('done');pairs.push([lb[i],rb[i]]);sel=null;done++;draw();
        msg.textContent='Molt bé!';msg.className='msg ok';
        if(done===set.p.length){next.hidden=false;msg.textContent='Parella completada!';}
      }else{
        err++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);sel=null;
        msg.textContent='Eixa parella no és correcta. Torna-ho a provar.';msg.className='msg bad';
      }
    }
    set.p.forEach((p,i)=>{const b=h('button',{class:'it'},p[0]);b.addEventListener('click',()=>click('L',i,b));lb[i]=b;L.append(b);});
    shuffle(set.p.map((_,i)=>i)).forEach(i=>{const b=h('button',{class:'it def'},set.p[i][1]);b.addEventListener('click',()=>click('R',i,b));rb[i]=b;R.append(b);});
    area.append(svg,L,R);
    c.body.append(h('p',{class:'sub'},'Part '+(r+1)+' de '+MATCH.length+': '+set.t),h('p',{class:'hint'},'Toca un terme i després la seua definició.'),area,msg,h('div',{class:'row'},next));
  }
  round();
}

/* ============ 2. OMPLE EL BUIT ============ */
function runFill(c){
  let err=0,idx=0,mode='bank';
  function intro(){
    c.body.innerHTML='';
    c.body.append(h('p',{class:'sub'},'Tria com vols jugar'),
      h('div',{class:'row'},
        h('button',{class:'btn pri',onclick:()=>{mode='bank';show();}},'Amb banc de paraules (més fàcil)'),
        h('button',{class:'btn',onclick:()=>{mode='write';show();}},'Escric jo la paraula (repte)')));
  }
  function show(){
    const t=FILL[idx];c.body.innerHTML='';
    const msg=h('div',{class:'msg'});
    const blanks=[];let selChip=null;
    const p=h('p',{class:'fill'});
    t.txt.split(/(\{[^}]+\})/).forEach(s=>{
      if(s.charAt(0)==='{'){
        const ans=s.slice(1,-1);let node;
        if(mode==='bank'){
          node=h('button',{class:'blank'},'\u00a0');
          node.addEventListener('click',()=>{
            if(node.dataset.lock)return;
            const b=blanks.find(x=>x.node===node);
            if(b.chip&&!selChip){b.chip.btn.disabled=false;b.chip=null;node.textContent='\u00a0';node.classList.remove('bad');return;}
            if(selChip){
              if(b.chip)b.chip.btn.disabled=false;
              b.chip=selChip;selChip.btn.disabled=true;selChip.btn.classList.remove('sel');
              node.textContent=selChip.w;node.classList.remove('bad');selChip=null;
            }
          });
        }else{
          node=h('input',{class:'blank',size:Math.max(5,ans.length+1),autocomplete:'off',autocapitalize:'off',spellcheck:'false'});
        }
        blanks.push({node:node,ans:ans,chip:null});p.append(node);
      }else p.append(s);
    });
    const chips=h('div',{class:'chips'});
    if(mode==='bank'){
      shuffle(blanks.map(b=>b.ans).concat(t.extra)).forEach(w=>{
        const btn=h('button',{class:'chip'},w);const ch={w:w,btn:btn};
        btn.addEventListener('click',()=>{if(selChip)selChip.btn.classList.remove('sel');selChip=ch;btn.classList.add('sel');});
        chips.append(btn);
      });
    }
    const next=h('button',{class:'btn pri',onclick:()=>{idx++;if(idx<FILL.length)show();else c.finish(starsFor(err,2,6),'Has fet '+err+(err===1?' errada.':' errades.'));}},idx<FILL.length-1?'Següent text':'Acabar');
    next.hidden=true;
    const check=h('button',{class:'btn pri',onclick:()=>{
      let wrong=0,empty=0;
      blanks.forEach(b=>{
        const v=mode==='bank'?(b.chip?b.chip.w:''):b.node.value;
        if(!v.trim()){empty++;return;}
        const ok=norm(v)===norm(b.ans);
        b.node.classList.toggle('ok',ok);b.node.classList.toggle('bad',!ok);
        if(ok){b.node.dataset.lock='1';if(mode==='write')b.node.readOnly=true;}else wrong++;
      });
      err+=wrong;
      if(empty){msg.textContent='Encara et falten buits per omplir.';msg.className='msg bad';}
      else if(wrong){msg.textContent='Alguns buits no són correctes (en roig). Corregeix-los i torna a comprovar.';msg.className='msg bad';}
      else{msg.textContent='Perfecte! Tot correcte.';msg.className='msg ok';next.hidden=false;check.hidden=true;}
    }},'Comprova');
    c.body.append(h('p',{class:'sub'},'Text '+(idx+1)+' de '+FILL.length+': '+t.t),
      h('p',{class:'hint'},mode==='bank'?'Toca una paraula i després el buit. Toca un buit omplit per llevar-la.':'Escriu la paraula que falta (no importen els accents).'),
      p,chips,msg,h('div',{class:'row'},check,next));
  }
  intro();
}

function runLabel(c){
  let r=0,err=0;
  function round(){
    const R=LAB[r];c.body.innerHTML='';
    const wrap=h('div',{html:diagram(R,'quiz')});
    const slots=$$('.slot',wrap),vals=new Array(R.t.length).fill(null);
    let selChip=null;
    const msg=h('div',{class:'msg'});
    const chips=h('div',{class:'chips'});
    const setText=(i,t)=>{$('.st',slots[i]).textContent=t;};
    shuffle(R.t.map(t=>t.label)).forEach(l=>{
      const btn=h('button',{class:'chip'},l);const ch={label:l,btn:btn};
      btn.addEventListener('click',()=>{if(selChip)selChip.btn.classList.remove('sel');selChip=ch;btn.classList.add('sel');});
      chips.append(btn);
    });
    slots.forEach((g,i)=>g.addEventListener('click',()=>{
      if(g.classList.contains('ok'))return;
      if(vals[i]&&!selChip){vals[i].btn.disabled=false;vals[i]=null;setText(i,'?');g.classList.remove('filled','bad');return;}
      if(selChip){
        if(vals[i])vals[i].btn.disabled=false;
        vals[i]=selChip;selChip.btn.disabled=true;selChip.btn.classList.remove('sel');
        setText(i,selChip.label);g.classList.add('filled');g.classList.remove('bad');selChip=null;
      }
    }));
    const next=h('button',{class:'btn pri',onclick:()=>{r++;if(r<LAB.length)round();else c.finish(starsFor(err,2,5),'Has fet '+err+(err===1?' errada.':' errades.'));}},r<LAB.length-1?'Següent dibuix':'Acabar');
    next.hidden=true;
    const check=h('button',{class:'btn pri',onclick:()=>{
      if(vals.some(v=>!v)){msg.textContent='Posa una etiqueta a cada punt.';msg.className='msg bad';return;}
      let wrong=0;
      slots.forEach((g,i)=>{
        if(g.classList.contains('ok'))return;
        const ok=vals[i].label===R.t[i].label;
        g.classList.remove('filled');g.classList.toggle('ok',ok);g.classList.toggle('bad',!ok);
        if(!ok)wrong++;
      });
      err+=wrong;
      if(wrong){msg.textContent='Les marcades en roig no són correctes: toca-les per canviar-les.';msg.className='msg bad';}
      else{msg.textContent='Molt bé!';msg.className='msg ok';next.hidden=false;check.hidden=true;}
    }},'Comprova');
    c.body.append(h('p',{class:'sub'},'Dibuix '+(r+1)+' de '+LAB.length+': '+R.name),h('p',{class:'hint'},'Toca una etiqueta i després el requadre que li corresponga.'),wrap,chips,msg,h('div',{class:'row'},check,next));
  }
  round();
}

/* ============ 4. ORDENA ============ */
function runOrder(c){
  let r=0,err=0;
  function round(){
    const S=ORD[r],n=S.s.length;
    const pool=shuffle(S.s.map((_,i)=>i)),placed=new Array(n).fill(null),res=new Array(n).fill(null);
    const box=h('div'),msg=h('div',{class:'msg'});
    function render(){
      box.innerHTML='';
      const ol=h('ol',{class:'slots'});
      placed.forEach((v,i)=>{
        const li=h('li',{class:'slot2'+(v==null?'':' filled')+(res[i]?' '+res[i]:'')});
        if(v!=null)li.append(h('button',{class:'card2',onclick:()=>{if(res[i]==='ok')return;placed[i]=null;pool.push(v);res[i]=null;msg.textContent='';render();}},S.s[v]));
        else li.append(h('span',{class:'empty'},'Toca una targeta de sota…'));
        ol.append(li);
      });
      const pl=h('div',{class:'pool'});
      pool.forEach(v=>pl.append(h('button',{class:'card2 pl',onclick:()=>{const k=placed.indexOf(null);if(k<0)return;placed[k]=v;res[k]=null;pool.splice(pool.indexOf(v),1);render();}},S.s[v])));
      const allOk=res.every(x=>x==='ok');
      const check=h('button',{class:'btn pri',onclick:()=>{
        let wrong=0;
        placed.forEach((v,i)=>{if(res[i]==='ok')return;res[i]=(v===i)?'ok':'bad';if(v!==i)wrong++;});
        err+=wrong;
        if(wrong){msg.textContent='Les targetes en roig no van ací. Toca-les per tornar-les a baix.';msg.className='msg bad';}
        else{msg.textContent='Ordre perfecte!';msg.className='msg ok';}
        render();
      }},'Comprova');
      check.hidden=pool.length>0||allOk;
      const next=h('button',{class:'btn pri',onclick:()=>{r++;if(r<ORD.length)round();else c.finish(starsFor(err,2,5),'Has fet '+err+(err===1?' errada.':' errades.'));}},r<ORD.length-1?'Següent seqüència':'Acabar');
      next.hidden=!allOk;
      box.append(ol,pl,msg,h('div',{class:'row'},check,next));
    }
    c.body.innerHTML='';
    c.body.append(h('p',{class:'sub'},'Seqüència '+(r+1)+' de '+ORD.length+': '+S.t),h('p',{class:'hint'},'Toca les targetes en l\'ordre correcte.'),box);
    render();
  }
  round();
}

    c.body.innerHTML='';
    const q=Q[i],msg=h('div',{class:'box'});msg.hidden=true;
    const next=h('button',{class:'btn pri',onclick:()=>{i++;if(i<Q.length)show();else c.finish(starsFor(err,1,3),'Has fet '+err+(err===1?' errada.':' errades.'));}},i<Q.length-1?'Següent':'Acabar');
    next.hidden=true;
    const mk=(txt,val)=>{
      const b=h('button',{class:'opt'},txt);
      b.addEventListener('click',()=>{
        if(!next.hidden)return;
        const ok=(val===q[1]);
        if(!ok)err++;
        b.classList.add(ok?'ok':'bad');
        msg.hidden=false;msg.className='box '+(ok?'ok':'bad');
        msg.textContent=(ok?'Correcte! ':'Ui! La resposta era "'+(q[1]?'Vertader':'Fals')+'". ')+q[2];
        next.hidden=false;
      });
      return b;
    };
    c.body.append(h('div',{class:'dots'},Q.map((_,k)=>h('i',{class:k<=i?'on':''}))),
      h('p',{class:'q'},q[0]),h('div',{class:'opts'},mk('✔ Vertader',true),mk('✘ Fals',false)),msg,h('div',{class:'row'},next));
  }
  show();
}

/* ============ 7. PARELLES ============ */
function runMemory(c){
  const pairs=sample(MEM,8);
  const cards=shuffle(pairs.reduce((a,p,k)=>a.concat([{k:k,t:p[0],ty:'t'},{k:k,t:p[1],ty:'d'}]),[]));
  let first=null,lock=false,moves=0,found=0;
  const mv=h('p',{class:'hint'},'Moviments: 0');
  const grid=h('div',{class:'mem'});
  cards.forEach(cd=>{
    const b=h('button',{class:'mc'},h('span',{class:'back'},'🌿'),h('span',{class:'front '+cd.ty},cd.t));
    b.addEventListener('click',()=>{
      if(lock||b.classList.contains('flip')||b.classList.contains('got'))return;
      b.classList.add('flip');
      if(!first){first={b:b,cd:cd};return;}
      moves++;mv.textContent='Moviments: '+moves;
      if(first.cd.k===cd.k){
        first.b.classList.remove('flip');first.b.classList.add('got');b.classList.remove('flip');b.classList.add('got');first=null;found++;
        if(found===pairs.length)setTimeout(()=>c.finish(starsFor(moves,16,26),'Has trobat totes les parelles en '+moves+' moviments.'),500);
      }else{
        lock=true;const f=first;first=null;
        setTimeout(()=>{f.b.classList.remove('flip');b.classList.remove('flip');lock=false;},1100);
      }
    });
    grid.append(b);
  });
  c.body.append(h('p',{class:'hint'},'Gira dues cartes: has de trobar cada terme amb la seua definició.'),mv,grid);
}

/* ============ 8. SOPA ============ */
function runSoup(c){
  const N=11,DIRS=[[0,1],[1,0],[1,1]];
  let grid=null;
  for(let att=0;att<300&&!grid;att++){
    const g=[];for(let i=0;i<N;i++)g.push(new Array(N).fill(''));
    let ok=true;
    const ws=SOUP.map(s=>s[0]).sort((a,b)=>b.length-a.length);
    for(let wi=0;wi<ws.length&&ok;wi++){
      const w=ws[wi];let placed=false;
      for(let t=0;t<300&&!placed;t++){
        const d=DIRS[Math.floor(Math.random()*DIRS.length)];
        const r0=Math.floor(Math.random()*N),c0=Math.floor(Math.random()*N);
        const r1=r0+d[0]*(w.length-1),c1=c0+d[1]*(w.length-1);
        if(r1>=N||c1>=N)continue;
        let fit=true;
        for(let k=0;k<w.length;k++){const ch=g[r0+d[0]*k][c0+d[1]*k];if(ch&&ch!==w.charAt(k)){fit=false;break;}}
        if(!fit)continue;
        for(let k=0;k<w.length;k++)g[r0+d[0]*k][c0+d[1]*k]=w.charAt(k);
        placed=true;
      }
      if(!placed)ok=false;
    }
    if(ok){
      const L='AEIOULNRSTMCPDBGV';
      for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!g[i][j])g[i][j]=L.charAt(Math.floor(Math.random()*L.length));
      grid=g;
    }
  }
  const found={},cells=[];let start=null,hints=0,nFound=0;
  const msg=h('div',{class:'msg'});
  const board=h('div',{class:'soup',style:'grid-template-columns:repeat('+N+',1fr)'});
  const list=h('div',{class:'words'});
  const wEl={};
  SOUP.forEach(s=>{const e=h('span',null,s[1]);wEl[s[0]]=e;list.append(e);});
  for(let i=0;i<N;i++){cells.push([]);for(let j=0;j<N;j++){
    const b=h('button',{class:'sc'},grid[i][j]);
    b.addEventListener('click',()=>click(i,j));
    cells[i].push(b);board.append(b);
  }}
  function click(i,j){
    if(!start){start={i:i,j:j};cells[i][j].classList.add('start');return;}
    const s=start;start=null;cells[s.i][s.j].classList.remove('start');
    const di=i-s.i,dj=j-s.j;
    if(di===0&&dj===0)return;
    if(!(di===0||dj===0||Math.abs(di)===Math.abs(dj))){msg.textContent='Ha de ser en línia recta.';msg.className='msg bad';return;}
    const len=Math.max(Math.abs(di),Math.abs(dj))+1,si=Math.sign(di),sj=Math.sign(dj);
    let str='';const cs=[];
    for(let k=0;k<len;k++){str+=grid[s.i+si*k][s.j+sj*k];cs.push(cells[s.i+si*k][s.j+sj*k]);}
    const rev=str.split('').reverse().join('');
    const w=SOUP.map(x=>x[0]).find(x=>!found[x]&&(x===str||x===rev));
    if(w){
      found[w]=1;nFound++;cs.forEach(b=>b.classList.add('found'));wEl[w].classList.add('f');
      msg.textContent='Has trobat '+w+'!';msg.className='msg ok';
      if(nFound===SOUP.length)setTimeout(()=>c.finish(hints===0?3:(hints<=2?2:1),hints?'Has usat '+hints+(hints===1?' pista.':' pistes.'):'Sense cap pista!'),500);
    }else{msg.textContent='Ací no hi ha cap paraula de la llista.';msg.className='msg bad';}
  }
  function hint(){
    const left=SOUP.map(x=>x[0]).filter(x=>!found[x]);if(!left.length)return;
    const w=left[0];hints++;
    outer:for(let i=0;i<N;i++)for(let j=0;j<N;j++)for(let d=0;d<DIRS.length;d++){
      let s='';for(let k=0;k<w.length;k++){const a=i+DIRS[d][0]*k,b=j+DIRS[d][1]*k;if(a>=N||b>=N){s='';break;}s+=grid[a][b];}
      if(s===w){const e=cells[i][j];e.classList.add('hint');setTimeout(()=>e.classList.remove('hint'),2200);break outer;}
    }
    msg.textContent='Pista: mira la lletra que parpelleja (comença una paraula). Pistes usades: '+hints;msg.className='msg';
  }
  c.body.append(h('p',{class:'hint'},'Toca la primera i l\'última lletra de cada paraula. Pot anar en horitzontal, vertical o en diagonal.'),list,board,msg,h('div',{class:'row'},h('button',{class:'btn',onclick:hint},'💡 Una pista')));
}

/* ============ 9. ENCREUADES ============ */
function runCross(c){
  const R=10,C=11,map={},nums={};let bad=0;
  CW.forEach(w=>{
    for(let k=0;k<w.w.length;k++){const r=w.r+(w.d==='v'?k:0),cc=w.c+(w.d==='h'?k:0);map[r+','+cc]=w.w.charAt(k);}
    nums[w.r+','+w.c]=(nums[w.r+','+w.c]||'')||String(w.n);
  });
  const g=h('div',{class:'cw',style:'grid-template-columns:repeat('+C+',auto)'});
  const inputs={};
  for(let r=0;r<R;r++)for(let cc=0;cc<C;cc++){
    const k=r+','+cc;
    if(map[k]){
      const inp=h('input',{maxlength:'1',autocomplete:'off',autocapitalize:'characters',spellcheck:'false','aria-label':'fila '+(r+1)+' columna '+(cc+1)});
      inputs[k]=inp;
      const cell=h('div',{class:'cc'},inp);
      if(nums[k])cell.append(h('small',null,nums[k]));
      g.append(cell);
    }else g.append(h('div',{class:'cc'}));
  }
  const msg=h('div',{class:'msg'});
  const clues=h('div',{class:'clues'});
  CW.forEach(w=>clues.append(h('p',null,h('b',null,w.n+(w.d==='h'?' horitzontal':' vertical')+': '),w.cl)));
  const check=h('button',{class:'btn pri',onclick:()=>{
    let wrong=0,empty=0;
    Object.keys(inputs).forEach(k=>{
      const inp=inputs[k],v=norm(inp.value);
      inp.classList.remove('ok','bad');
      if(!v){empty++;return;}
      if(v===map[k].toLowerCase())inp.classList.add('ok');else{inp.classList.add('bad');wrong++;}
    });
    if(wrong){bad++;msg.textContent='Hi ha '+wrong+' lletres incorrectes (en roig).';msg.className='msg bad';}
    else if(empty){msg.textContent='Va bé de moment! Encara falten '+empty+' caselles.';msg.className='msg ok';}
    else{msg.textContent='Encreuades resolta!';msg.className='msg ok';setTimeout(()=>c.finish(3-Math.min(2,bad),bad?'Has comprovat amb errades '+bad+(bad===1?' vegada.':' vegades.'):'Sense errades!'),500);}
  }},'Comprova');
  const reveal=h('button',{class:'btn',onclick:()=>{if(!confirm('Vols veure la solució? Només guanyaràs 1 estrella.'))return;Object.keys(inputs).forEach(k=>{inputs[k].value=map[k];inputs[k].classList.add('ok');});setTimeout(()=>c.finish(1,'Has revelat la solució.'),600);}},'Mostra la solució');
  c.body.append(h('p',{class:'hint'},'Escriu una lletra per casella (sense accents). El 1 vertical comença en la F.'),g,clues,msg,h('div',{class:'row'},check,reveal));
}

/* ============ 10. TEST ============ */
function runTest(c){
  const Q=sample(QZ,10).map(q=>({q:q[0],a:q[1],w:[q[2],q[3],q[4]],e:q[5]}));
  const queue=Q.slice();let done=0,err=0;
  function show(){
    c.body.innerHTML='';
    const q=queue[0];
    const opts=shuffle([q.a].concat(q.w));
    const box=h('div',{class:'box'});box.hidden=true;
    const next=h('button',{class:'btn pri',onclick:()=>{
      if(q.right){queue.shift();done++;}else{queue.push(queue.shift());}
      if(!queue.length)c.finish(starsFor(err,1,3),'Has fallat '+err+(err===1?' pregunta.':' preguntes.'));else show();
    }},'Següent');
    next.hidden=true;
    const list=h('div',{class:'qopts'});
    let answered=false;
    opts.forEach(o=>{
      const b=h('button',{class:'qo'},o);
      b.addEventListener('click',()=>{
        if(answered)return;answered=true;
        const ok=o===q.a;
        b.classList.add(ok?'ok':'bad');
        if(!ok){err+=q.fail?0:1;q.fail=true;$$('.qo',list).forEach(x=>{if(x.textContent===q.a)x.classList.add('ok');});}
        q.right=ok;
        box.hidden=false;box.className='box '+(ok?'ok':'bad');
        box.textContent=(ok?'Correcte! ':'No és eixa. Tornarà a eixir al final. ')+q.e;
        next.hidden=false;
      });
      list.append(b);
    });
    c.body.append(h('p',{class:'sub'},'Encertades: '+done+' de '+Q.length+(queue.length>Q.length-done?'':'')),
      h('div',{class:'dots'},Q.map((x,k)=>h('i',{class:x.right&&queue.indexOf(x)<0?'on':''}))),
      h('p',{class:'q'},q.q),list,box,h('div',{class:'row'},next));
  }
  show();
}

/* ============ 11. AVENTURA ============ */
function runAdv(c){
  let s=0,err=0;
  function show(){
    c.body.innerHTML='';
    const sc=ADV[s];
    const box=h('div',{class:'box bad'});box.hidden=true;
    const list=h('div',{class:'qopts'});
    shuffle(sc.o).forEach(o=>{
      const b=h('button',{class:'qo'},o[0]);
      b.addEventListener('click',()=>{
        if(o[1]>=0){
          s=o[1];
          show();
        }else{err++;box.hidden=false;box.textContent='Mmm, no ho és. '+o[2]+' Prova una altra opció.';b.disabled=true;b.classList.add('bad');}
      });
      list.append(b);
    });
    // l'última opció correcta porta a la fi
    c.body.append(h('div',{class:'adv'},h('div',{html:plantMini(sc.pos[0],sc.pos[1])}),h('div',null,h('p',{class:'sub'},'Pas '+(s+1)+' de '+ADV.length),h('p',{class:'story'},sc.t),list,box)));
  }
  // la darrera escena porta a l'epíleg
  ADV[ADV.length-1].o[0][1]=ADV.length;
  const origShow=show;
  show=function(){
    if(s>=ADV.length){
      c.body.innerHTML='';
      c.body.append(h('div',{class:'adv'},h('div',{html:plantMini(265,92)}),h('div',null,h('p',{class:'sub'},'Fi del viatge'),h('p',{class:'story'},`Quin viatge! Has entrat per l'arrel, has pujat per la tija, has fet la fotosíntesi a la fulla i has repartit l'aliment per tota la planta. Ara la planta pot créixer, florir i fer fruits. Gràcies a tu!`),h('div',{class:'row'},h('button',{class:'btn pri',onclick:()=>c.finish(starsFor(err,1,3),err?'Has tingut '+err+(err===1?' tropecó':' tropecons')+' pel camí.':'Viatge perfecte, sense cap tropecó!')},'Acabar')))));
      return;
    }
    origShow();
  };
  show();
}

showMenu();
})();
