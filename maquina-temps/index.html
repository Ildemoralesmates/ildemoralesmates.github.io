<style>
:root {
  --bg: #faf6ef;
  --fg: #2a2520;
  --fg2: #5a5550;
  --accent: #c45a2d;
  --accent2: #e8a547;
  --card: #fff;
  --card-border: #e0d8cc;
  --btn-bg: #c45a2d;
  --btn-fg: #fff;
  --btn-alt-bg: #e8a547;
  --btn-alt-fg: #2a2520;
  --energy: #3ea86f;
  --energy-low: #d44;
  --gear-empty: #d0c8bb;
  --gear-full: #e8a547;
  --overlay-bg: rgba(42,37,32,.92);
  --hint-bg: #fff3cd;
  --hint-fg: #856404;
  --riddle-bg: #e3f0ff;
  --riddle-fg: #1a5276;
  --dialog-fg: #555;
  --ending-good: #2d8c5a;
  --ending-bad: #c45a2d;
  --ending-hero: #8b5cf6;
  --font-title: 'Grandstander', 'Comic Sans MS', cursive;
  --font-body: 'Atkinson Hyperlegible Next', 'Verdana', sans-serif;
  --font-mono: 'Courier Prime', 'Courier New', monospace;
  --radius: 12px;
  --max-w: 42rem;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1714;--fg:#e8e0d6;--fg2:#a09890;--accent:#e87040;
    --accent2:#f0b860;--card:#262220;--card-border:#3a3530;
    --btn-bg:#e87040;--btn-fg:#fff;--btn-alt-bg:#f0b860;--btn-alt-fg:#1a1714;
    --overlay-bg:rgba(10,8,6,.94);--hint-bg:#3a3020;--hint-fg:#f0c860;
    --riddle-bg:#1a2a3a;--riddle-fg:#7ab8e8;--dialog-fg:#bbb;
    --ending-good:#40c080;--ending-bad:#e87040;--ending-hero:#a78bfa;
    --energy:#50c880;--energy-low:#f06050;--gear-empty:#3a3530;--gear-full:#f0b860;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1714;--fg:#e8e0d6;--fg2:#a09890;--accent:#e87040;
  --accent2:#f0b860;--card:#262220;--card-border:#3a3530;
  --btn-bg:#e87040;--btn-fg:#fff;--btn-alt-bg:#f0b860;--btn-alt-fg:#1a1714;
  --overlay-bg:rgba(10,8,6,.94);--hint-bg:#3a3020;--hint-fg:#f0c860;
  --riddle-bg:#1a2a3a;--riddle-fg:#7ab8e8;--dialog-fg:#bbb;
  --ending-good:#40c080;--ending-bad:#e87040;--ending-hero:#a78bfa;
  --energy:#50c880;--energy-low:#f06050;--gear-empty:#3a3530;--gear-full:#f0b860;
}
[data-era="dino"]{--accent:#5a8c3a;--accent2:#8cc040;--btn-bg:#5a8c3a;--btn-alt-bg:#8cc040;}
[data-era="roma"]{--accent:#b8403a;--accent2:#d4a020;--btn-bg:#b8403a;--btn-alt-bg:#d4a020;}
[data-era="medieval"]{--accent:#6a4ca0;--accent2:#a080d0;--btn-bg:#6a4ca0;--btn-alt-bg:#a080d0;}
[hidden]{display:none!important}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);font-size:1.2rem;line-height:1.6;background:var(--bg);color:var(--fg);min-height:100dvh;padding:0 16px}
#app{max-width:var(--max-w);margin:0 auto;padding-bottom:3rem}
header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:2px solid var(--card-border);margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
h1{font-family:var(--font-title);font-size:1.4rem;color:var(--accent)}
.hud{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.energy-bar{display:flex;gap:4px;align-items:center}
.crystal{width:18px;height:24px;clip-path:polygon(50% 0%,100% 35%,80% 100%,20% 100%,0% 35%);transition:background .3s,opacity .3s}
.crystal.full{background:var(--energy)}
.crystal.empty{background:var(--gear-empty);opacity:.4}
.crystal.low{background:var(--energy-low);animation:pulse-low 1s infinite}
@keyframes pulse-low{0%,100%{opacity:1}50%{opacity:.5}}
.gears{display:flex;gap:6px;align-items:center}
.gear-slot{width:24px;height:24px;border-radius:50%;border:2px solid var(--gear-empty);display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .3s}
.gear-slot.found{background:var(--gear-full);border-color:var(--gear-full);color:#fff}
.backpack{font-family:var(--font-title);font-size:.85rem;cursor:pointer;background:var(--card);border:2px solid var(--card-border);border-radius:var(--radius);padding:4px 10px;color:var(--fg)}
.backpack-panel{background:var(--card);border:2px solid var(--card-border);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:1rem;font-size:.95rem}
.backpack-panel .item{display:inline-block;background:var(--accent2);color:var(--btn-alt-fg);padding:2px 10px;border-radius:20px;margin:4px;font-size:.85rem;font-family:var(--font-title)}
.era-plate{background:var(--card);border:2px solid var(--card-border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;text-align:center}
.era-plate h2{font-family:var(--font-title);color:var(--accent);font-size:1.3rem;margin-bottom:.3rem}
.era-plate .era-sub{font-size:.9rem;color:var(--fg2)}
.era-plate svg{max-width:200px;margin:.5rem auto;display:block}
#story{margin-bottom:1.5rem}
#story p{margin-bottom:.8rem}
#story .dialog{color:var(--dialog-fg);font-style:italic;padding-left:1rem;border-left:3px solid var(--accent2);margin-bottom:.8rem}
#story .hint{background:var(--hint-bg);color:var(--hint-fg);padding:.5rem .8rem;border-radius:8px;font-size:1rem;margin-bottom:.8rem}
#story .riddle{background:var(--riddle-bg);color:var(--riddle-fg);padding:.8rem 1rem;border-radius:8px;font-size:1.05rem;margin-bottom:.8rem;font-family:var(--font-mono)}
#choices{display:flex;flex-direction:column;gap:.6rem}
#choices button{font-family:var(--font-title);font-size:1.1rem;padding:.8rem 1.2rem;border:none;border-radius:var(--radius);cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s;line-height:1.3}
#choices button:active{transform:scale(.97)}
#choices button.main{background:var(--btn-bg);color:var(--btn-fg)}
#choices button.alt{background:var(--btn-alt-bg);color:var(--btn-alt-fg)}
#choices button:disabled{opacity:.5;cursor:not-allowed}
.ending-box{background:var(--card);border:3px solid var(--ending-bad);border-radius:var(--radius);padding:1.2rem;text-align:center;margin-top:1rem}
.ending-box.good{border-color:var(--ending-good)}
.ending-box.hero{border-color:var(--ending-hero)}
.ending-box h3{font-family:var(--font-title);font-size:1.3rem;margin-bottom:.5rem}
.ending-box .ending-count{font-size:.85rem;color:var(--fg2);margin-top:.8rem}
.ending-box button{margin-top:.8rem;font-family:var(--font-title);font-size:1rem;padding:.6rem 1.2rem;border:none;border-radius:var(--radius);cursor:pointer;margin-right:.5rem}
.ending-box .btn-undo{background:var(--btn-bg);color:var(--btn-fg)}
.ending-box .btn-restart{background:var(--card-border);color:var(--fg)}
.intro-screen{text-align:center;padding:1.5rem 0}
.intro-screen h2{font-family:var(--font-title);font-size:1.6rem;color:var(--accent);margin-bottom:1rem}
.intro-error{color:var(--energy-low);font-family:var(--font-title);font-size:1rem;margin-bottom:.8rem}
.intro-screen .desc{font-size:1rem;color:var(--fg2);margin-bottom:1.2rem;text-align:left}
.intro-screen input[type=text]{font-family:var(--font-body);font-size:1.2rem;padding:.6rem 1rem;border:2px solid var(--card-border);border-radius:var(--radius);width:100%;max-width:20rem;text-align:center;background:var(--card);color:var(--fg);margin-bottom:1rem;display:block;margin-left:auto;margin-right:auto}
.intro-screen button{font-family:var(--font-title);font-size:1.2rem;padding:.8rem 2rem;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:var(--radius);cursor:pointer}
.restart-hdr{font-size:.8rem;color:var(--fg2);cursor:pointer;user-select:none;padding:4px 8px;border-radius:6px}
.restart-hdr:active{background:var(--card-border)}
#overlay{position:fixed;inset:0;background:var(--overlay-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;font-family:var(--font-title);transition:opacity .3s}
#overlay .plof{font-size:3rem;margin-bottom:1rem;animation:plof-bounce .7s ease-out}
#overlay .era-name{font-size:1.4rem;opacity:.8}
@keyframes plof-bounce{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){
  #overlay .plof{animation:none}
  .crystal{transition:none}
}
.math-input{display:flex;gap:.5rem;align-items:center;margin:.8rem 0}
.math-input input{font-family:var(--font-mono);font-size:1.3rem;padding:.5rem;width:6rem;text-align:center;border:2px solid var(--card-border);border-radius:8px;background:var(--card);color:var(--fg)}
.math-input button{font-family:var(--font-title);font-size:1rem;padding:.5rem 1rem;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:8px;cursor:pointer}
.math-feedback{font-family:var(--font-title);font-size:1.1rem;margin:.5rem 0;padding:.4rem .8rem;border-radius:8px;display:inline-block}
.math-feedback.ok{background:#d4edda;color:#155724}
.math-feedback.ko{background:#f8d7da;color:#721c24}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .math-feedback.ok{background:#1a3a2a;color:#80e0a0}
  :root:not([data-theme="light"]) .math-feedback.ko{background:#3a1a1a;color:#f08080}
}
:root[data-theme="dark"] .math-feedback.ok{background:#1a3a2a;color:#80e0a0}
:root[data-theme="dark"] .math-feedback.ko{background:#3a1a1a;color:#f08080}
a.home-link{display:inline-block;font-family:var(--font-body);font-size:.85rem;color:var(--accent);text-decoration:none;padding:.35rem 0;opacity:.9}
a.home-link:hover{text-decoration:underline}
a.home-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<script data-goatcounter="https://ildemoralesmates.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<body>
<div id="app">
  <a class="home-link" id="home-link" href="/" title="Tornar a la portada">⌂ Portada</a>
  <header id="hdr" hidden>
    <h1>⚙️ La Màquina del Temps</h1>
    <div class="hud">
      <div class="energy-bar" id="energyBar"></div>
      <div class="gears" id="gearsBar"></div>
      <span class="backpack" id="backpackBtn">🎒 Motxilla</span>
      <span class="restart-hdr" id="restartBtn">↺</span>
    </div>
  </header>
  <div id="backpackPanel" class="backpack-panel" hidden></div>
  <div id="eraPlate" class="era-plate" hidden></div>
  <div id="story"></div>
  <div id="choices"></div>
  <div id="endingBox" hidden></div>
</div>
<div id="overlay" hidden></div>

<script>
'use strict';
const SAVE_KEY='maquina_temps_v1';
const ALL_ENDINGS=['tele','pantano','trex','gladiador','energia','drac','catapulta','cebes','bo','heroi'];
const ENDING_NAMES={
  tele:'Campió del sofà',pantano:'Fòssil del futur',trex:'La mascota del T-rex',
  gladiador:'Gladiador d\'esponges',energia:'El pelacebes reial',
  drac:'Parella de cartes del drac',catapulta:'Vol sense retorn',
  cebes:'300 cebes i comptant',bo:'Mestre del temps',heroi:'Heroi temporal'
};

let s={},scene='intro',hist=[],discovered=[];
try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.scene){s=d.s;scene=d.scene;hist=d.hist||[];discovered=d.discovered||[];}}catch(e){}

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({s,scene,hist,discovered}));}catch(e){}}
function discoverEnding(e){if(e&&!discovered.includes(e)){discovered.push(e);save();}}

function sanitize(v){return String(v).replace(/[<>&"']/g,'')}

/* hn: process text - name substitution + bold */
function hn(txt){
  // 1. Gender markers {m|f} - not used in this adventure but keep for safety
  txt=txt.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,(m,masc,fem)=>(s.gen==='f'?fem:masc));
  // 2. Name substitution with bold+uppercase
  if(s.nom) txt=txt.replace(/\{nom\}/g,'<b>'+s.nom.toUpperCase()+'</b>');
  // 3. Bold uppercase for companion name
  txt=txt.replace(/\bRoda\b/g,'<b>RODA</b>');
  return txt;
}

function renderText(lines){
  return lines.map(l=>{
    if(typeof l==='function') l=l(s);
    if(!l) return '';
    l=hn(l);
    if(l.startsWith('&gt;')||l.startsWith('>')) return '<p class="dialog">—'+l.slice(l.startsWith('&gt;')?4:1).replace(/^\s*—\s*/,'').trim()+'</p>';
    if(l.startsWith('?')) return '<div class="riddle">'+l.slice(1).trim()+'</div>';
    if(l.startsWith('!')) return '<div class="hint">💡 '+l.slice(1).trim()+'</div>';
    return '<p>'+l+'</p>';
  }).join('');
}

function renderEnergy(){
  const bar=document.getElementById('energyBar');
  if(!bar) return;
  let h='⚡';
  for(let i=0;i<5;i++){
    const cls=i<s.energia?(s.energia<=1?'crystal low':'crystal full'):'crystal empty';
    h+=`<div class="${cls}"></div>`;
  }
  bar.innerHTML=h;
}
function renderGears(){
  const bar=document.getElementById('gearsBar');
  if(!bar) return;
  let h='';
  for(let i=1;i<=3;i++){
    h+=`<div class="gear-slot ${s['gear'+i]?'found':''}">⚙</div>`;
  }
  bar.innerHTML=h;
}
function renderBackpack(){
  const panel=document.getElementById('backpackPanel');
  const items=[];
  if(s.llanterna) items.push('🔦 Llanterna');
  if(s.entrepa) items.push('🥪 Entrepa');
  if(s.mapa_fragment) items.push('🗺️ Fragment de mapa');
  if(s.dent) items.push('🦷 Dent de dinosaure');
  if(items.length===0) items.push('(buida)');
  panel.innerHTML='<strong>🎒 Motxilla:</strong> '+items.map(i=>'<span class="item">'+i+'</span>').join('');
}

let backpackOpen=false;
document.getElementById('backpackBtn').addEventListener('click',()=>{
  backpackOpen=!backpackOpen;
  const panel=document.getElementById('backpackPanel');
  if(backpackOpen){renderBackpack();panel.hidden=false;}
  else panel.hidden=true;
});

let restartTaps=0,restartTimer=null;
document.getElementById('restartBtn').addEventListener('click',()=>{
  restartTaps++;
  if(restartTaps===1){
    document.getElementById('restartBtn').textContent='↺ Segur?';
    restartTimer=setTimeout(()=>{restartTaps=0;document.getElementById('restartBtn').textContent='↺';},2000);
  } else if(restartTaps>=2){
    clearTimeout(restartTimer);
    restartTaps=0;
    document.getElementById('restartBtn').textContent='↺';
    doRestart();
  }
});

function doRestart(){
  s={};scene='intro';hist=[];save();render();
}

function showOverlay(text,eraName,cb){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="plof">${text}</div><div class="era-name">${eraName}</div>`;
  ov.hidden=false;
  // Block clicks
  const dur=window.matchMedia('(prefers-reduced-motion:reduce)').matches?200:1400;
  setTimeout(()=>{ov.hidden=true;if(cb)cb();},dur);
}

function choose(c){
  hist.push({scene:scene,s:JSON.parse(JSON.stringify(s))});
  if(c.set) c.set(s);
  let target=typeof c.go==='function'?c.go(s):c.go;
  // Check energy
  if(s.energia!==undefined && s.energia<=0 && !S[target]?.ending){
    target='final_energia';
  }
  const newScene=S[target];
  if(!newScene){console.error('Scene not found:',target);return;}
  // Check era change for transition
  const oldEra=S[scene]?.era;
  const newEra=newScene.era;
  if(newEra && oldEra!==newEra){
    const plofTexts={dino:'¡CRAC-PLOF!',roma:'¡ZUUUM-PLOF!',medieval:'¡BRUUM-PLOF!'};
    const eraNames={dino:'Era dels dinosaures',roma:'Valentia romana',medieval:'Castell medieval'};
    scene=target;
    showOverlay(plofTexts[newEra]||'¡PLOF!',eraNames[newEra]||'',()=>{
      if(newScene.onEnter && !s['_entered_'+target]){s['_entered_'+target]=true;newScene.onEnter(s);}
      render();save();
    });
    return;
  }
  scene=target;
  if(newScene.onEnter && !s['_entered_'+target]){s['_entered_'+target]=true;newScene.onEnter(s);}
  render();save();
}

function render(){
  const sc=S[scene];
  if(!sc){console.error('No scene:',scene);return;}
  const hdr=document.getElementById('hdr');
  const eraPlate=document.getElementById('eraPlate');
  const storyEl=document.getElementById('story');
  const choicesEl=document.getElementById('choices');
  const endingBox=document.getElementById('endingBox');

  // Set era on body
  if(sc.era) document.body.setAttribute('data-era',sc.era);
  else document.body.removeAttribute('data-era');

  // Show/hide HUD
  hdr.hidden=(scene==='intro');

  // Era plate
  if(sc.plate){
    eraPlate.hidden=false;
    eraPlate.innerHTML=`<h2>${sc.plate.title}</h2><div class="era-sub">${sc.plate.sub}</div>`;
  } else {
    eraPlate.hidden=true;
  }

  // Render text
  const lines=typeof sc.text==='function'?sc.text(s):sc.text;
  storyEl.innerHTML=lines?renderText(lines):'';

  // Render energy/gears
  if(scene!=='intro'){renderEnergy();renderGears();}
  if(backpackOpen) renderBackpack();

  // Ending?
  if(sc.ending){
    choicesEl.innerHTML='';
    const endType=typeof sc.ending==='function'?sc.ending(s):sc.ending;
    const endTitle=typeof sc.title==='function'?sc.title(s):sc.title;
    discoverEnding(endType);
    const cls=endType==='heroi'?'hero':(endType==='bo'?'good':'');
    const total=ALL_ENDINGS.length;
    const found=discovered.length;
    endingBox.hidden=false;
    endingBox.className='ending-box'+(cls?' '+cls:'');
    let btns='';
    if(endType!=='bo'&&endType!=='heroi'){
      btns+=`<button class="btn-undo" onclick="undo()">⟲ Tornar a l'última decisió</button>`;
    }
    btns+=`<button class="btn-restart" onclick="doRestart()">↺ Tornar a jugar</button>`;
    endingBox.innerHTML=`<h3>${endTitle||'Fi'}</h3><div class="ending-count">Finals descoberts: ${found} de ${total}</div>${btns}`;
  } else {
    endingBox.hidden=true;
    // Render choices
    if(sc.choices){
      choicesEl.innerHTML=sc.choices
        .filter(c=>!c.if||c.if(s))
        .map((c,i)=>{
          const cls=c.alt?'alt':'main';
          return `<button class="${cls}" onclick="choose(S['${scene}'].choices.filter(c=>!c.if||c.if(window.s))[${i}])">${hn(typeof c.t==='function'?c.t(s):c.t)}</button>`;
        }).join('');
    } else {
      choicesEl.innerHTML='';
    }
  }
  // Scroll to top
  window.scrollTo({top:0,behavior:'smooth'});
}

// Make s and choose globally accessible for inline handlers
window.s=s;window.choose=choose;window.doRestart=doRestart;
function undo(){
  if(hist.length){
    const prev=hist.pop();
    scene=prev.scene;
    s=prev.s;
    window.s=s;
    save();render();
  }
}
window.undo=undo;

/* Math puzzle renderer */
function mathPuzzle(questionText,answer,goodGo,badGo){
  const storyEl=document.getElementById('story');
  const choicesEl=document.getElementById('choices');
  const sc=S[scene];
  const lines=typeof sc.text==='function'?sc.text(s):sc.text;
  let h=lines?renderText(lines):'';
  h+=`<div class="riddle">${questionText}</div>`;
  h+=`<div class="math-input"><input type="number" id="mathAns" inputmode="numeric" placeholder="?"><button onclick="checkMath()">Comprovar</button></div>`;
  h+=`<div id="mathFeedback"></div>`;
  storyEl.innerHTML=h;
  choicesEl.innerHTML='';
  window._mathAnswer=answer;
  window._mathGoodGo=goodGo;
  window._mathBadGo=badGo;
  window._mathTries=0;
}
window.mathPuzzle=mathPuzzle;

function checkMath(){
  const input=document.getElementById('mathAns');
  const fb=document.getElementById('mathFeedback');
  if(!input) return;
  const val=parseInt(input.value,10);
  window._mathTries++;
  if(val===window._mathAnswer){
    fb.innerHTML='<span class="math-feedback ok">✓ Correcte!</span>';
    setTimeout(()=>{
      choose({go:window._mathGoodGo,set:s=>{s.mathOk=(s.mathOk||0)+1;}});
    },800);
  } else {
    if(window._mathTries>=3){
      fb.innerHTML=`<span class="math-feedback ko">La resposta era ${window._mathAnswer}. Endavant!</span>`;
      setTimeout(()=>{
        choose({go:window._mathBadGo,set:s=>{}});
      },1200);
    } else {
      fb.innerHTML=`<span class="math-feedback ko">No… Torna-ho a intentar! (intent ${window._mathTries}/3)</span>`;
      input.value='';input.focus();
    }
  }
}
window.checkMath=checkMath;

/* Dynamic choices for scenes with functions */
Object.keys(S).forEach(k=>{
  const sc=S[k];
  if(typeof sc.choices==='function'){
    const fn=sc.choices;
    Object.defineProperty(sc,'choices',{get(){return fn(s);}});
  }
});

/* ===== RENDER INTRO SCREEN ===== */
function renderIntro(){
  const storyEl=document.getElementById('story');
  const choicesEl=document.getElementById('choices');
  document.getElementById('hdr').hidden=true;
  document.getElementById('eraPlate').hidden=true;
  document.getElementById('endingBox').hidden=true;
  document.getElementById('backpackPanel').hidden=true;

  storyEl.innerHTML=`
    <div class="intro-screen">
      <h2>⚙️ La Màquina del Temps</h2>
      <div class="desc">
        <p>Estàs a punt de viure una aventura a través del temps! Algunes coses que has de saber:</p>
        <p>⚡ Tens <strong>5 cristalls d'energia</strong>. Algunes accions en gasten. Si et quedes sense energia… tindràs problemes.</p>
        <p>🎒 Portaràs una <strong>motxilla</strong> amb objectes que trobaràs pel camí. Alguns obrin camins que d'altra manera estan tancats.</p>
        <p>⚙️ Has de trobar <strong>3 engranatges</strong> per a reparar la màquina.</p>
        <p>🔢 Trobaràs <strong>candaus matemàtics</strong> que cal resoldre per a avançar. Si no els encertes, podràs continuar… però et costarà.</p>
        <p>Hi ha <strong>${ALL_ENDINGS.length} finals</strong> diferents. En alguns guanyes, en altres… bé, ja ho veuràs. Sempre pots tornar a l'última decisió!</p>
      </div>
      <label for="nameInput" style="font-family:var(--font-title);font-size:1.1rem;">Com et diuen?</label><br>
      <input type="text" id="nameInput" maxlength="20" placeholder="Escriu el teu nom" autocomplete="off" onkeydown="if(event.key==='Enter')startGame()"><br>
      <p id="nameErr" class="intro-error" hidden>Escriu el teu nom per a començar l'aventura</p>
      <button onclick="startGame()">Començar l'aventura!</button>
      ${discovered.length>0?`<p style="margin-top:1rem;font-size:.85rem;color:var(--fg2)">Finals descoberts: ${discovered.length} de ${ALL_ENDINGS.length}</p>`:''}
    </div>`;
  choicesEl.innerHTML='';
}

function startGame(){
  const input=document.getElementById('nameInput');
  const nom=input?sanitize(input.value.trim().slice(0,20)).trim():'';
  if(!nom){
    const err=document.getElementById('nameErr');
    if(err) err.hidden=false;
    if(input) input.focus();
    return;
  }
  s={nom:nom,energia:5,gear1:false,gear2:false,gear3:false,llanterna:false,entrepa:false,mapa_fragment:false,trici:false,gat:false,pagat:false,retornat:false,dent:false,mathOk:0};
  window.s=s;
  scene='proleg';
  hist=[];
  save();
  render();
}
window.startGame=startGame;

/* Override render for intro and math scenes */
const _render=render;
render=function(){
  if(scene==='intro'){renderIntro();return;}
  if(scene==='_dino_math'){
    _render();
    mathPuzzle(
      '7 triceratops. Cada un té 4 potes. <br>Quantes potes tenen <b>en total</b>?',
      28,'dino_math_ok','dino_math_ko'
    );
    return;
  }
  if(scene==='_roma_math'){
    _render();
    mathPuzzle(
      'Un legionari camina 12 km cada dia.<br>Quants dies necessita per a recórrer <b>84 km</b>?',
      7,'roma_math_ok','roma_math_ko'
    );
    return;
  }
  if(scene==='_medieval_math'){
    _render();
    mathPuzzle(
      'El castell té <b>4 torres</b>. Cada torre té <b>15 finestres</b>.<br>Quantes finestres hi ha <b>en total</b>?',
      60,'medieval_math_ok','medieval_math_ko'
    );
    return;
  }
  _render();
};

/* First render */
render();
