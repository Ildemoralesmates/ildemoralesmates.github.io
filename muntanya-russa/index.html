<script>
/* ================= FÍSICA Y PISTAS ================= */
const TRACKS={
  clasica:{kind:'spline',h:[50,30,10,18,33,24,8,14,26,12,20]},
  halfpipe:{kind:'spline',h:[50,36,22,12,6,4,6,12,22,36,50]},
  dificil:{kind:'spline',h:[50,30,12,6,10,28,44,30,14,8,12]},
  looping:{kind:'loop'}
};
const LOOP={x0:36,yb:2,R:9,a:3.2};
const SPAN=100;                 // longitud horizontal de las pistas (m)

/* Interpolación cúbica monótona (PCHIP): sin rebotes, cimas y valles planos en los nodos */
function pchipSlopes(xs,ys,m0,mn){
  const n=xs.length,h=[],d=[],m=new Array(n).fill(0);
  for(let i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(ys[i+1]-ys[i])/h[i];}
  for(let k=1;k<n-1;k++){
    if(d[k-1]*d[k]>0){const w1=2*h[k]+h[k-1],w2=h[k]+2*h[k-1];m[k]=(w1+w2)/(w1/d[k-1]+w2/d[k]);}
  }
  const end=(h0,h1,d0,d1)=>{
    let m=((2*h0+h1)*d0-h0*d1)/(h0+h1);
    if(Math.sign(m)!==Math.sign(d0))m=0;
    else if(Math.sign(d0)!==Math.sign(d1)&&Math.abs(m)>3*Math.abs(d0))m=3*d0;
    return m;
  };
  if(n===2){m[0]=m[1]=d[0];}
  else{m[0]=end(h[0],h[1],d[0],d[1]);m[n-1]=end(h[n-2],h[n-3],d[n-2],d[n-3]);}
  if(typeof m0==='number')m[0]=m0;
  if(typeof mn==='number')m[n-1]=mn;
  return {m,h};
}
function sampleSpline(xs,ys,m0,mn,dx){
  const {m,h}=pchipSlopes(xs,ys,m0,mn),pts=[];
  for(let k=0;k<xs.length-1;k++){
    const n=Math.max(2,Math.round(h[k]/dx));
    for(let j=0;j<n;j++){
      const t=j/n,t2=t*t,t3=t2*t;
      const y=(2*t3-3*t2+1)*ys[k]+(t3-2*t2+t)*h[k]*m[k]+(-2*t3+3*t2)*ys[k+1]+(t3-t2)*h[k]*m[k+1];
      pts.push([xs[k]+t*h[k],y]);
    }
  }
  pts.push([xs[xs.length-1],ys[ys.length-1]]);
  return pts;
}
/* Suavizado gaussiano en y (reflexión impar en los extremos) para que los valles no sean cerrados */
function smoothY(pts,sigma){
  const n=pts.length,dx=pts[1][0]-pts[0][0],r=Math.ceil(3*sigma/dx),w=[];
  let sw=0;
  for(let j=-r;j<=r;j++){const v=Math.exp(-0.5*Math.pow(j*dx/sigma,2));w.push(v);sw+=v;}
  const y=pts.map(p=>p[1]);
  const get=i=>i<0?2*y[0]-y[-i]:i>=n?2*y[n-1]-y[2*(n-1)-i]:y[i];
  return pts.map((p,i)=>{let a=0;for(let j=-r;j<=r;j++)a+=w[j+r]*get(i+j);return [p[0],a/sw];});
}
function rawPath(def){
  if(def.kind==='spline'){
    const xs=def.h.map((_,i)=>i*SPAN/(def.h.length-1));
    return {pts:smoothY(sampleSpline(xs,def.h,undefined,undefined,0.05),3.5),loop:null};
  }
  const {x0,yb,R,a}=LOOP;
  const A=sampleSpline([0,12,24,x0],[50,30,8,yb],undefined,0,0.05);
  const pts=A.slice(0,-1);
  const i0=pts.length;
  const n=900;
  for(let j=0;j<n;j++){
    const th=2*Math.PI*j/n;
    pts.push([x0+a*th+R*Math.sin(th),yb+R*(1-Math.cos(th))]);
  }
  const xe=x0+a*2*Math.PI,i1=pts.length;
  const C=sampleSpline([xe,78,SPAN],[yb,16,10],0,undefined,0.05);
  for(const p of C)pts.push(p);
  return {pts,loop:[i0,i1]};
}
/* Remuestreo a paso de arco uniforme y tabla de pendientes y curvatura */
function buildTrack(def,ds){
  ds=ds||0.1;
  const {pts,loop}=rawPath(def);
  const cum=[0];
  for(let i=1;i<pts.length;i++)cum[i]=cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const total=cum[cum.length-1],N=Math.floor(total/ds);
  const X=new Float64Array(N+1),Y=new Float64Array(N+1);
  let p=0;
  for(let k=0;k<=N;k++){
    const s=k*ds;
    while(p<pts.length-2&&cum[p+1]<s)p++;
    const seg=cum[p+1]-cum[p]||1,f=Math.min(1,Math.max(0,(s-cum[p])/seg));
    X[k]=pts[p][0]+(pts[p+1][0]-pts[p][0])*f;
    Y[k]=pts[p][1]+(pts[p+1][1]-pts[p][1])*f;
  }
  const SIN=new Float64Array(N+1),COS=new Float64Array(N+1),TH=new Float64Array(N+1),KAP=new Float64Array(N+1);
  for(let k=0;k<N;k++){
    const dx=X[k+1]-X[k],dy=Y[k+1]-Y[k],l=Math.hypot(dx,dy)||1;
    SIN[k]=dy/l;COS[k]=dx/l;TH[k]=Math.atan2(dy,dx);
  }
  SIN[N]=SIN[N-1];COS[N]=COS[N-1];TH[N]=TH[N-1];
  const raw=new Float64Array(N+1);
  for(let k=0;k<N-1;k++){
    let d=TH[k+1]-TH[k];
    while(d>Math.PI)d-=2*Math.PI;
    while(d<-Math.PI)d+=2*Math.PI;
    raw[k]=d/ds;
  }
  raw[N-1]=raw[N-2];raw[N]=raw[N-1];
  const W=5;
  for(let k=0;k<=N;k++){
    let s=0,c=0;
    for(let j=Math.max(0,k-W);j<=Math.min(N,k+W);j++){s+=raw[j];c++;}
    KAP[k]=s/c;
  }
  return {ds,N,L:N*ds,X,Y,SIN,COS,TH,KAP,loopS:loop?[cum[loop[0]],cum[loop[1]-1]]:null};
}
function seg(TR,s){const k=Math.floor(s/TR.ds);return k<0?0:k>=TR.N?TR.N-1:k;}
function hAt(TR,s){const k=seg(TR,s),f=s/TR.ds-k;return TR.Y[k]+(TR.Y[k+1]-TR.Y[k])*f;}
function xyAt(TR,s){const k=seg(TR,s),f=s/TR.ds-k;return [TR.X[k]+(TR.X[k+1]-TR.X[k])*f,TR.Y[k]+(TR.Y[k+1]-TR.Y[k])*f];}
function kapAt(TR,s){const k=seg(TR,s),f=s/TR.ds-k;return TR.KAP[k]+(TR.KAP[k+1]-TR.KAP[k])*f;}
function startS(TR,h0){
  if(h0>=TR.Y[0])return 0;
  for(let k=0;k<TR.N;k++){
    if(TR.Y[k]>h0&&TR.Y[k+1]<=h0)return (k+(TR.Y[k]-h0)/(TR.Y[k]-TR.Y[k+1]))*TR.ds;
  }
  return 0;
}
/* Peso aparente N/(m·g) (solo se usa en el looping): la vagoneta se apoya en el lado izquierdo de la tangente */
function normalRatio(TR,g,s,v){return (v*v*kapAt(TR,s)+g*TR.COS[seg(TR,s)])/g;}

/* Un paso de integración: Verlet para la gravedad + rozamiento cinético (μ·N) aparte */
function physStep(sim,P,TR,dt){
  const g=P.g;
  const k0=seg(TR,sim.s);
  const a0=-g*TR.SIN[k0];
  if(sim.v===0&&Math.abs(a0)<=P.mu*g*Math.max(TR.COS[k0],0))return 0;   // rozamiento estático: se queda quieta
  let s=sim.s+sim.v*dt+0.5*a0*dt*dt,v=sim.v,bounce=0;
  if(s<0){s=-s;v=-v;bounce=1;}
  else if(s>TR.L){s=2*TR.L-s;v=-v;bounce=1;}
  const a1=-g*TR.SIN[seg(TR,s)];
  v+=0.5*(a0+a1)*dt;
  if(P.mu>0){
    const Nm=g*Math.max(0,TR.COS[seg(TR,s)]);   // N = m·g·cosθ (el resto del cálculo no depende de m)
    const av=Math.abs(v),dv=Math.min(av,P.mu*Nm*dt);
    sim.Q+=0.5*P.m*(av*av-(av-dv)*(av-dv));
    v=Math.sign(v)*(av-dv);
  }
  sim.s=s;sim.v=v;
  return bounce;
}

  const h=hAt(TR,sim.s),ep=P.m*P.g*h,ec=0.5*P.m*sim.v*sim.v;

}

function resetSim(quipKey,keepPlay){
  const was=S.playing||Q.wasPlaying&&!!Q.active;
  closeQ(true);
  sim.s=startS(TR,P.h0);sim.v=P.v0;sim.Q=0;sim.t=0;sim.hs=0;sim.vs=0;sim.stopT=0;sim.bounced=0;sim.dir=1;

  hist=[];histAcc=0;particles.length=0;flags={};Q.last=-99;Q.pend=null;
  S.playing=!!(keepPlay&&was&&!S.editing);S.started=S.playing;
  pushHist();

  updatePlay();
}
function updatePlay(){

}

function control(host,cfg){
  const w=document.createElement('div');w.className='ctl';
  w.innerHTML=`<label for="${cfg.id}" data-i="${cfg.key}"></label><input type="range" id="${cfg.id}" min="0" max="1000" step="1"><input type="number" id="${cfg.id}-n" step="${cfg.step}" aria-label="${cfg.id}"><span class="unit">${cfg.unit}</span>`;
  host.appendChild(w);
  const r=w.querySelector('input[type=range]'),n=w.querySelector('input[type=number]');
  const dec=(String(cfg.step).split('.')[1]||'').length;
  const rnd=v=>clamp(Math.round(v/cfg.step)*cfg.step,cfg.min,cfg.max);
  const to=v=>cfg.log?1000*Math.log(v/cfg.min)/Math.log(cfg.max/cfg.min):1000*(v-cfg.min)/(cfg.max-cfg.min);
  const from=u=>cfg.log?cfg.min*Math.pow(cfg.max/cfg.min,u/1000):cfg.min+(cfg.max-cfg.min)*u/1000;
  const set=v=>{v=rnd(v);r.value=to(v);n.min=cfg.min;n.max=cfg.max;n.value=(+v).toFixed(dec);return v;};
  r.addEventListener('input',()=>{const v=rnd(from(+r.value));n.value=v.toFixed(dec);cfg.on(v);});
  n.addEventListener('change',()=>{let v=parseFloat(String(n.value).replace(',','.'));if(!Number.isFinite(v))v=cfg.get();v=set(v);cfg.on(v);});
  set(cfg.get());
  return {set,setMax(m){cfg.max=m;set(cfg.get());}};
}

function loopMinH(){
  if(!TR.loopS)return 0;
  let need=0;
  const k0=Math.floor(TR.loopS[0]/TR.ds),k1=Math.floor(TR.loopS[1]/TR.ds);
  for(let k=k0;k<=k1;k++){const c=TR.COS[k],ka=TR.KAP[k];if(c<0&&ka>1e-4)need=Math.max(need,TR.Y[k]+(-c)/(2*ka));}
  return need;
}

  else n.hidden=true;
}

}

  S.track=id;
  rebuildTrack();syncTracks();
  if(TR.loopS&&S.editing)setEdit(false);
  resetSim('start',true);
  trackNote();
  if(id==='custom'&&!S.editing)setEdit(true);
}

}

const qcard=$('qcard');
function cartScreenY(){const p=xyAt(TR,sim.s);return V.oy-p[1]*V.S;}
function offer(type){
  if(!S.qOn||S.editing||Q.active||sim.t<2.5)return;
  if(sim.t-Q.last<10){if(type==='friction'||type==='stop')Q.pend=type;return;}
  ask(type);
}
function ask(type){
  const pool=QB.filter(q=>q.types.includes(type)&&q.ok());
  if(!pool.length)return;
  pool.sort((a,b)=>(Q.seen[a.id]||0)-(Q.seen[b.id]||0)+(Math.random()-0.5)*0.5);
  const q=pool[0];Q.seen[q.id]=(Q.seen[q.id]||0)+1;
  Q.active={q,ctx:q.ctx(),perm:shuffle([0,1,2]),picked:-1};
  Q.wasPlaying=S.playing;S.playing=false;
  const topPos=cartScreenY()>V.h*0.5;qcard.className='qcard '+(topPos?'top':'bot');qcard.style.top=topPos?($('stage').offsetTop+10)+'px':'';
  renderQ();updatePlay();
  if(matchMedia('(max-width:640px)').matches)qcard.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function renderQ(){
  const a=Q.active;if(!a){qcard.hidden=true;return;}
  const d=a.q.build(a.ctx,lang);
  qcard.hidden=false;qcard.innerHTML='';
  const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
  qcard.appendChild(mk('div','qh',tr('qHead')));
  qcard.appendChild(mk('p','qt',d.text));
  const box=mk('div','opts');
  a.perm.forEach(oi=>{
    const o=d.opts[oi],b=mk('button','opt',o.t);b.type='button';
    if(a.picked>=0){b.disabled=true;if(o.ok)b.classList.add('ok');else if(oi===a.picked)b.classList.add('no');}
    else b.addEventListener('click',()=>{a.picked=oi;renderQ();});
    box.appendChild(b);
  });
  qcard.appendChild(box);
  if(a.picked>=0){
    const p=mk('p','fb',d.opts[a.picked].fb);
    if(d.num)p.appendChild(mk('span','num',d.num));
    qcard.appendChild(p);
    const foot=mk('div','qfoot');
    const nx=mk('button','btn primary',tr('qNext'));nx.type='button';nx.addEventListener('click',()=>closeQ(false));
    foot.appendChild(nx);qcard.appendChild(foot);
    nx.focus({preventScroll:true});
  }else{
    const foot=mk('div','qfoot');

    foot.appendChild(sk);qcard.appendChild(foot);

}
function closeQ(silent){
  if(!Q.active){qcard.hidden=true;return;}
  Q.active=null;qcard.hidden=true;Q.last=sim.t;
  if(!silent){S.playing=Q.wasPlaying;updatePlay();}
}

/* ---------- eventos de la trayectoria ---------- */
function detect(dts){
  const k=seg(TR,sim.s),hd=sim.v*TR.SIN[k];
  const vs=Math.abs(sim.v)<1e-9?0:Math.sign(sim.v),hs=Math.abs(hd)<1e-3?0:Math.sign(hd);
  let ev=null;
  if(sim.bounced){quip('bounce');sim.bounced=0;if(vs)sim.vs=vs;if(hs)sim.hs=hs;}
  else{
    if(vs!==0){if(sim.vs!==0&&vs!==sim.vs)ev='turn';sim.vs=vs;}
    if(hs!==0){
      if(!ev&&sim.hs>0&&hs<0)ev='top';
      else if(!ev&&sim.hs<0&&hs>0)ev='bottom';
      sim.hs=hs;
    }
  }
  if(vs!==0)sim.dir=vs;
  if(ev){
    if(ev==='bottom'||ev==='top'||ev==='turn')quip(ev==='bottom'?'bottom':(ev==='turn'?'turn':'top'));
    offer(ev);
  }
  if(TR.loopS&&sim.s>TR.loopS[0]&&sim.s<TR.loopS[1]&&TR.COS[k]<-0.3&&!flags.inv){flags.inv=1;quip('inv',true);}
  const e=energies();
  if(P.mu>0&&e.q/sim.E0>0.08&&!flags.heat){flags.heat=1;quip('heat');}
  if(P.mu>0&&e.q/sim.E0>0.12&&!flags.fq){flags.fq=1;offer('friction');}
  if(Math.abs(sim.v)>0.5)flags.moved=1;
  if(Math.abs(sim.v)<1e-12){sim.stopT+=dts;if(sim.stopT>0.8&&flags.moved&&!flags.stop&&sim.t>1){flags.stop=1;quip('stop',true);offer('stop');}}
  else sim.stopT=0;
  if(Q.pend&&!Q.active&&sim.t-Q.last>=10){const p=Q.pend;Q.pend=null;ask(p);}
}

  return {w:r.width,h:r.height};
}
function colors(){

  ['panel','ink','muted','line','sky1','sky2','ground','grid','track','rail','support','ep','ec','em','q','cart','cartEdge','skin','f-body','f-num'].forEach(k=>{
    const v=st.getPropertyValue('--'+k).trim();if(C[k]!==v){C[k]=v;dirty=true;}});

function layout(w,h){
  const sc=Math.min((w-20)/(WIN.x1-WIN.x0),(h-14)/(WIN.y1-WIN.y0));
  V.S=sc;V.w=w;V.h=h;
  V.ox=(w-(WIN.x1-WIN.x0)*sc)/2-WIN.x0*sc;
  const top=(h-(WIN.y1-WIN.y0)*sc)/2;V.oy=top+WIN.y1*sc;

function label(g,t,x,y,col,align='left',size=12,weight=''){g.font=`${weight} ${size}px ${C['f-body']}`;g.fillStyle=col;g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y);}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function renderBG(){
  const w=V.w,h=V.h;
  bg.width=Math.round(w*DPR);bg.height=Math.round(h*DPR);
  const g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const gr=g.createLinearGradient(0,0,0,Yy(0));gr.addColorStop(0,C.sky1);gr.addColorStop(1,C.sky2);
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.lineWidth=1;
  for(let y=10;y<=50;y+=10){
    g.strokeStyle=C.grid;g.beginPath();g.moveTo(0,Yy(y));g.lineTo(w,Yy(y));g.stroke();
    label(g,y+' m',6,Yy(y)-8,C.muted,'left',11);
  }
  g.fillStyle=C.ground;g.fillRect(0,Yy(0),w,h-Yy(0));
  g.strokeStyle=C.muted;g.lineWidth=1.5;g.beginPath();g.moveTo(0,Yy(0));g.lineTo(w,Yy(0));g.stroke();
  label(g,tr('ground'),6,Yy(0)+12,C.muted,'left',11);
  // soportes (cada 4 m en horizontal)
  let prev=null,nextX=0;
  g.strokeStyle=C.support;g.lineWidth=1.2;
  for(let k=0;k<=TR.N;k++){
    const s=k*TR.ds;
    if(TR.loopS&&s>TR.loopS[0]-1&&s<TR.loopS[1]+1){prev=null;continue;}
    if(TR.X[k]<nextX-1e-6)continue;
    nextX=TR.X[k]+4;
    const x=X(TR.X[k]),y=Yy(TR.Y[k]),y0=Yy(0);
    g.beginPath();g.moveTo(x,y);g.lineTo(x,y0);g.stroke();
    if(prev){g.beginPath();if(prev.up){g.moveTo(prev.x,prev.y);g.lineTo(x,y0);}else{g.moveTo(prev.x,y0);g.lineTo(x,y);}g.stroke();}
    prev={x,y,up:prev?!prev.up:true};
  }
  // carril
  g.lineJoin='round';g.lineCap='round';
  g.beginPath();
  for(let k=0;k<=TR.N;k+=2){const x=X(TR.X[k]),y=Yy(TR.Y[k]);k?g.lineTo(x,y):g.moveTo(x,y);}
  g.strokeStyle=C.rail;g.lineWidth=7;g.stroke();
  g.strokeStyle=C.track;g.lineWidth=3;g.stroke();
  // traviesas
  g.strokeStyle=C.rail;g.lineWidth=1.2;g.lineCap='butt';
  const ts=Math.round(1.6/TR.ds);
  g.beginPath();
  for(let k=0;k<=TR.N;k+=ts){const x=X(TR.X[k]),y=Yy(TR.Y[k]),sn=TR.SIN[Math.min(k,TR.N-1)],cs=TR.COS[Math.min(k,TR.N-1)];
    g.moveTo(x-sn*5,y-cs*5);g.lineTo(x+sn*5,y+cs*5);}
  g.stroke();
  // topes
  g.strokeStyle=C.muted;g.lineWidth=4;g.lineCap='round';
  for(const k of [0,TR.N]){const x=X(TR.X[k]),y=Yy(TR.Y[k]),sn=TR.SIN[Math.min(k,TR.N-1)],cs=TR.COS[Math.min(k,TR.N-1)];
    g.beginPath();g.moveTo(x,y);g.lineTo(x-sn*16,y-cs*16);g.stroke();}
}

function drawCart(px,py,th,e){
  const u=Math.max(8,Math.min(15,V.S*1.5)),r=0.5*u;
  const vmax=Math.sqrt(2*sim.E0/P.m),ratio=vmax>0?Math.abs(sim.v)/vmax:0;
  const scared=ratio>0.55,still=Math.abs(sim.v)<0.05;
  // líneas de velocidad
  if(ratio>0.3&&S.playing){
    const dx=Math.cos(th)*sim.dir,dy=-Math.sin(th)*sim.dir;
    ctx.strokeStyle=C.muted;ctx.globalAlpha=0.55;ctx.lineWidth=1.5;ctx.lineCap='round';
    for(let i=-1;i<=1;i++){
      const ox=px-dx*3*u+(-dy)*i*u*0.9,oy=py-dy*3*u+dx*i*u*0.9-u*1.2;
      ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox-dx*ratio*u*3,oy-dy*ratio*u*3);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.save();ctx.translate(px,py);ctx.rotate(-th);ctx.scale(sim.dir,1);
  ctx.lineJoin='round';
  ctx.fillStyle=C.cartEdge;
  for(const wx of [-1.7*u,1.7*u]){ctx.beginPath();ctx.arc(wx,-r,r,0,TAU);ctx.fill();}
  const bt=-r-0.2*u-1.6*u;
  rrect(ctx,-2.7*u,bt,5.4*u,1.6*u,0.5*u);ctx.fillStyle=C.cart;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=C.cartEdge;ctx.stroke();
  ctx.fillStyle=C.cartEdge;ctx.globalAlpha=0.55;ctx.fillRect(-2.2*u,bt+0.55*u,4.4*u,0.28*u);ctx.globalAlpha=1;
  // pasajero
  const hx=0.1*u,hy=bt-0.55*u,hr=0.9*u;
  ctx.fillStyle=C.skin;ctx.strokeStyle=C.cartEdge;ctx.lineWidth=1.3;
  ctx.beginPath();ctx.arc(hx,hy,hr,0,TAU);ctx.fill();ctx.stroke();
  // pelo hacia atrás
  const hl=Math.min(2.2*u,ratio*3*u);
  ctx.strokeStyle=C.cartEdge;ctx.lineWidth=1.6;ctx.lineCap='round';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(hx-hr*0.7,hy-hr*(0.55-i*0.35));ctx.lineTo(hx-hr*0.7-0.5*u-hl,hy-hr*(0.55-i*0.35)-hl*0.15);ctx.stroke();}
  // ojo
  ctx.fillStyle='#fff';ctx.lineWidth=1;
  if(still){ctx.strokeStyle=C.cartEdge;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(hx+0.05*u,hy-0.2*u);ctx.lineTo(hx+0.6*u,hy-0.2*u);ctx.stroke();}
  else{
    const er=scared?0.36*u:0.28*u;
    ctx.beginPath();ctx.arc(hx+0.38*u,hy-0.2*u,er,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=C.cartEdge;ctx.beginPath();ctx.arc(hx+0.48*u,hy-0.2*u,er*0.42,0,TAU);ctx.fill();
  }
  // boca
  ctx.strokeStyle=C.cartEdge;ctx.fillStyle=C.cartEdge;ctx.lineWidth=1.4;
  if(scared){ctx.beginPath();ctx.ellipse(hx+0.45*u,hy+0.42*u,0.2*u,0.3*u,0,0,TAU);ctx.fill();}
  else if(still){ctx.beginPath();ctx.moveTo(hx+0.1*u,hy+0.5*u);ctx.quadraticCurveTo(hx+0.4*u,hy+0.35*u,hx+0.7*u,hy+0.5*u);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(hx+0.4*u,hy+0.25*u,0.32*u,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}

}
function wrapText(t,max){

  ctx.fillStyle=C.panel;ctx.fill();ctx.strokeStyle=C.line;ctx.stroke();
  ctx.fillStyle=C.panel;ctx.fillRect(tx-5,below?by-1:by+bh-1.5,10,2.5);
  ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.textBaseline='middle';
  lines.forEach((l,i)=>ctx.fillText(l,bx+10,by+6+lh*(i+0.5)));
  ctx.globalAlpha=1;
}
/* manejadores de edición: sobre la pista, en los nodos */
function knotXY(i){
  const n=defs[S.track].h.length,x=i*SPAN/(n-1);
  let lo=0,hi=TR.N;
  while(lo<hi){const m=(lo+hi)>>1;if(TR.X[m]<x)lo=m+1;else hi=m;}
  return [x,TR.Y[lo]];
}
let drag=null,hover=-1;
function drawHandles(){
  const n=defs[S.track].h.length;
  for(let i=0;i<n;i++){
    const [x,y]=knotXY(i),big=drag?drag.i===i:hover===i;
    ctx.beginPath();ctx.arc(X(x),Yy(y),big?10:8,0,TAU);ctx.fillStyle=C.panel;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=C.ep;ctx.stroke();
    ctx.beginPath();ctx.moveTo(X(x),Yy(y)-3.5);ctx.lineTo(X(x),Yy(y)+3.5);ctx.lineWidth=1.5;ctx.stroke();
  }
}

let lastT=performance.now();
function draw(now,dtReal){
  const {w,h}=fit(cv);
  if(w!==V.w||h!==V.h||dirty){layout(w,h);renderBG();dirty=false;}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,w,h);ctx.drawImage(bg,0,0,w,h);
  const e=energies(),mg=P.m*P.g;
  // niveles de energía
  if(S.level&&!S.editing){
    const yE=e.em/mg,y0=sim.E0/mg;
    const lineAt=(y,dash,alpha)=>{const yy=Math.max(Yy(y),4);ctx.setLineDash(dash);ctx.globalAlpha=alpha;ctx.strokeStyle=C.em;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;return yy;};
    const yy=lineAt(yE,[7,5],0.7);
    label(ctx,tr('lvlNow')+(yE>WIN.y1?' ('+fmt(yE,0)+' m)':''),w-8,Math.max(yy-9,12),C.em,'right',12,'600');
    if(Math.abs(y0-yE)*V.S>22){const y2=lineAt(y0,[2,4],0.4);label(ctx,tr('lvl0'),w-8,Math.max(y2-9,12),C.muted,'right',11);}
  }
  const k=seg(TR,sim.s),[wx,wy]=xyAt(TR,sim.s),th=Math.atan2(TR.SIN[k],TR.COS[k]);
  const px=X(wx),py=Yy(wy);
  if(!S.editing){
    // altura sobre el suelo
    ctx.setLineDash([3,4]);ctx.strokeStyle=C.ep;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,Yy(0));ctx.stroke();ctx.setLineDash([]);
    if(py<Yy(0)-26)label(ctx,'h = '+fmt(e.h,1)+' m',px+6,(py+Yy(0))/2,C.ep,'left',12,'600');
  }
  // partículas de calor
  if(S.playing&&P.mu>0&&Math.abs(sim.v)>0.5){
    const rate=60*Math.min(1,P.mu*8)*Math.min(1,Math.abs(sim.v)/10)*dtReal;
    let nn=Math.floor(rate)+(Math.random()<rate%1?1:0);
    while(nn-->0&&particles.length<80)particles.push({x:px+(Math.random()-0.5)*14,y:py-2,vx:(Math.random()-0.5)*14,vy:-(14+Math.random()*26),l:1});
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dtReal;p.y+=p.vy*dtReal;p.l-=dtReal*1.1;
    if(p.l<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.l*0.8;ctx.fillStyle=C.q;ctx.beginPath();ctx.arc(p.x,p.y,2.4*p.l+0.8,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawCart(px,py,th,e);
  if(S.editing)drawHandles();else drawBubble(px,py,now);
}

/* ---------- barras ---------- */
function drawBars(){
  const {w,h}=fit(bc),g=bctx;
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,w,h);
  const e=energies(),Emax=sim.E0*1.06,L=6,R=6,Tp=22,B=30;
  const bh=h-Tp-B,sc=bh/Emax,cw=(w-L-R)/4,bw=Math.min(52,cw*0.62),base=h-B;
  g.strokeStyle=C.line;g.lineWidth=1;g.beginPath();g.moveTo(L,base+0.5);g.lineTo(w-R,base+0.5);g.stroke();
  const y0=base-sim.E0*sc;
  g.setLineDash([5,4]);g.strokeStyle=C.muted;g.beginPath();g.moveTo(L,y0);g.lineTo(w-R,y0);g.stroke();g.setLineDash([]);
  label(g,'E₀ = '+fmt(sim.E0,0)+' J',w-R,y0-8,C.muted,'right',11);
  const cols=[['Ep',e.ep],['Ec',e.ec],['Em',e.em],['Q',e.q]];
  cols.forEach(([n,v],i)=>{
    const cx=L+cw*(i+0.5),x=cx-bw/2;
    if(n==='Em'){
      const hp=e.ep*sc,hc=e.ec*sc;
      g.fillStyle=C.ep;g.fillRect(x,base-hp,bw,hp);
      g.fillStyle=C.ec;g.fillRect(x,base-hp-hc,bw,hc);
      g.strokeStyle=C.em;g.lineWidth=1.5;g.strokeRect(x,base-hp-hc,bw,hp+hc);
    }else{
      g.fillStyle=n==='Ep'?C.ep:n==='Ec'?C.ec:C.q;g.fillRect(x,base-v*sc,bw,v*sc);
    }
    label(g,fmt(v,0),cx,Math.max(base-v*sc-9,Tp-2),C.ink,'center',11);
    label(g,n,cx,base+14,C.ink,'center',13,'600');
  });
  label(g,'J',w-R,Tp-12,C.muted,'right',11);
}
/* ---------- gráfica ---------- */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;}
function drawGraph(){
  const {w,h}=fit(gc),g=gctx;
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,w,h);
  const L=54,R=10,Tp=10,B=30,pw=w-L-R,ph=h-Tp-B;
  const W=20,t1=Math.max(W,sim.t),t0=t1-W;
  const st=niceStep(sim.E0*1.05/4),ymax=Math.ceil(sim.E0*1.05/st)*st;
  const px=t=>L+(t-t0)/W*pw,py=v=>Tp+(1-v/ymax)*ph;
  g.font=`11px ${C['f-num']}`;g.lineWidth=1;g.strokeStyle=C.line;g.fillStyle=C.muted;
  for(let v=0;v<=ymax+1e-6;v+=st){const y=py(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.textAlign='right';g.textBaseline='middle';g.fillText(fmt(v,0),L-5,y);}
  for(let t=Math.ceil(t0/5)*5;t<=t1+1e-6;t+=5){const x=px(t);g.beginPath();g.moveTo(x,Tp);g.lineTo(x,Tp+ph);g.stroke();g.textAlign='center';g.textBaseline='top';g.fillText(fmt(t,0),x,Tp+ph+4);}
  g.textAlign='right';g.textBaseline='bottom';g.fillText(tr('axT'),L+pw,h-1);
  g.save();g.beginPath();g.rect(L,Tp-2,pw+2,ph+4);g.clip();
  const line=(idx,col,wd,dash)=>{
    g.setLineDash(dash||[]);g.strokeStyle=col;g.lineWidth=wd;g.lineJoin='round';g.beginPath();let first=true;
    for(const r of hist){if(r[0]<t0-0.1)continue;const v=idx<0?r[1]+r[2]:r[idx];const x=px(r[0]),y=py(v);if(first){g.moveTo(x,y);first=false;}else g.lineTo(x,y);}
    g.stroke();g.setLineDash([]);
  };
  line(-1,C.em,1.6,[6,4]);line(1,C.ep,2.2);line(2,C.ec,2.2);
  g.restore();
  // leyenda
  let lx=L+8;g.textAlign='left';g.textBaseline='middle';
  for(const [n,c] of [['Ep',C.ep],['Ec',C.ec],['Em',C.em]]){g.fillStyle=c;g.fillRect(lx,Tp+6,12,3);g.fillStyle=C.ink;g.font=`600 12px ${C['f-body']}`;g.fillText(n,lx+16,Tp+8);lx+=46;}
}

/* ---------- lecturas ---------- */
const out={};
function put(id,v){if(out[id]!==v){out[id]=v;$(id).textContent=v;}}
function readouts(){
  const e=energies(),av=Math.abs(sim.v);
  put('r-h',fmt(e.h,1)+' m');put('r-v',fmt(av,1)+' m/s · '+fmt(av*3.6,0)+' km/h');put('r-e0',fmt(sim.E0,0)+' J');
  put('e-ep',`${fmt(P.m,0)} · ${fmt(P.g,2)} · ${fmt(e.h,1)} = ${fmt(e.ep,0)} J`);
  put('e-ec',`½ · ${fmt(P.m,0)} · ${fmt(av,1)}² = ${fmt(e.ec,0)} J`);
  put('e-em',`${fmt(e.ep,0)} + ${fmt(e.ec,0)} = ${fmt(e.em,0)} J`);
  put('e-q',`${fmt(sim.E0,0)} − ${fmt(e.em,0)} = ${fmt(e.q,0)} J`);
  put('clock','t = '+fmt(sim.t,1)+' s');
  const lp=!!TR.loopS;$('r-gl').hidden=!lp;$('r-g').hidden=!lp;
  if(lp){
    const inLoop=sim.s>TR.loopS[0]&&sim.s<TR.loopS[1],G=normalRatio(TR,P.g,sim.s,sim.v);
    const neg=inLoop&&G<0;
    put('r-g',!inLoop?'—':fmt(G,2)+' g'+(neg?' · '+tr('warnLoop'):''));
    $('r-g').className=neg?'warn':'';
  }
}

/* ---------- bucle ---------- */
let tickN=0;
function frame(now){
  const dtReal=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(S.playing&&!Q.active){
    const dts=dtReal*S.speed*(S.slow?0.25:1);
    sim.t+=dts;
    const n=Math.min(600,Math.max(1,Math.ceil(dts/(1/600)))),st=dts/n;
    for(let i=0;i<n;i++)if(physStep(sim,P,TR,st))sim.bounced=1;
    histAcc+=dts;if(histAcc>=0.05){histAcc=0;pushHist();}
    detect(dts);
  }
  if(tickN++%30===0)colors();
  draw(now,dtReal);drawBars();drawGraph();readouts();
  requestAnimationFrame(frame);
}

/* ---------- eventos de interfaz ---------- */
$('play').addEventListener('click',togglePlay);
$('reset').addEventListener('click',()=>{resetSim('start',false);});
$('slow').addEventListener('click',()=>{S.slow=!S.slow;updatePlay();});
$('edit').addEventListener('click',()=>setEdit(!S.editing));
$('chkQ').addEventListener('change',e=>{S.qOn=e.target.checked;if(!S.qOn&&Q.active)closeQ(false);});
$('chkTalk').addEventListener('change',e=>{S.talk=e.target.checked;if(!S.talk)bubble=null;});
$('chkLvl').addEventListener('change',e=>{S.level=e.target.checked;});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|BUTTON|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();togglePlay();}
  if(e.key==='Escape'&&Q.active)closeQ(false);
});
function setLang(l){
  lang=l;try{localStorage.setItem('mr-lang',l);}catch(e){}
  applyLang();
}
function applyLang(){
  document.documentElement.lang=lang==='va'?'ca':'es';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[lang][el.dataset.i];if(typeof v==='string')el.innerHTML=v;});
  $('lgEs').setAttribute('aria-pressed',lang==='es');$('lgVa').setAttribute('aria-pressed',lang==='va');
  labelChips();updatePlay();trackNote();dirty=true;
  if(Q.active)renderQ();
}
$('lgEs').addEventListener('click',()=>setLang('es'));
$('lgVa').addEventListener('click',()=>setLang('va'));

/* edición de pista con el puntero */
const ptr=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
function hitKnot(x,y){
  const n=defs[S.track].h.length;let best=-1,bd=18;
  for(let i=0;i<n;i++){const [kx,ky]=knotXY(i),d=Math.hypot(X(kx)-x,Yy(ky)-y);if(d<bd){bd=d;best=i;}}
  return best;
}
cv.addEventListener('pointerdown',e=>{
  if(!S.editing)return;
  const [x,y]=ptr(e),i=hitKnot(x,y);if(i<0)return;
  const [,ty]=knotXY(i);
  drag={i,off:ty-(V.oy-y)/V.S};
  cv.setPointerCapture(e.pointerId);e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!S.editing)return;
  const [x,y]=ptr(e);
  if(!drag){hover=hitKnot(x,y);return;}
  if(S.track!=='custom'){
    defs.custom={kind:'spline',h:defs[S.track].h.slice()};S.track='custom';syncTracks();
  }
  const def=defs.custom,target=(V.oy-y)/V.S+drag.off,cur=knotXY(drag.i)[1];
  def.h[drag.i]=clamp(Math.round((def.h[drag.i]+1.25*(target-cur))*10)/10,2,58);
  rebuildTrack();resetSim(null,false);
});
const endDrag=()=>{drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- arranque ---------- */
colors();
rebuildTrack();syncTracks();syncPlanets();syncFric();
applyLang();
resetSim('start',false);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',colors);}catch(e){}
new MutationObserver(colors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',()=>{dirty=true;});
requestAnimationFrame(frame);
})();

</script>
