const W=640,H=420,COLS=9,ROWS=6,SPX=66,OX=56,OY=62;
const nodeXY=i=>[OX+(i%COLS)*SPX,OY+Math.floor(i/COLS)*SPX];
const EDGES=[],EID={};
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  if(c<COLS-1)EDGES.push({id:'h'+r+'_'+c,a:r*COLS+c,b:r*COLS+c+1,o:'h'});
  if(r<ROWS-1)EDGES.push({id:'v'+r+'_'+c,a:r*COLS+c,b:(r+1)*COLS+c,o:'v'});
}
EDGES.forEach(e=>{[e.x1,e.y1]=nodeXY(e.a);[e.x2,e.y2]=nodeXY(e.b);EID[e.id]=e;e.I=0;e.dV=0;e.ph=0;});
const comp={};
const S={tool:'hand',V:6,hover:null,short:false,blownNow:0,vals:[]};
const RES=[10,47,100,220],RB=30,PBLOW=2.4;
const CT=$('#ctls');
const sv=slider(CT,{id:'V',key:'V',min:3,max:12,step:1.5,val:6,fmtv:v=>fmt(v,1)+' V',on:v=>{S.V=v;solve();}});
const f3=x=>fmt(+x.toPrecision(3),3).replace(/,?0+$/,'').replace(/,$/,'');
const defPol=e=>e.o==='h'?1:-1;
const resOf=c=>c.t==='wire'?0.01:c.t==='bulb'?(c.blown?1e7:RB):c.t==='res'?c.v:(c.t==='sw'||c.t==='push')?(c.closed?0.01:1e7):1e7;

function solve(){
  const N=COLS*ROWS;let Ib=0,hasBat=false,short=false,again=true,guard=0;
  while(again&&guard++<6){
    again=false;Ib=0;hasBat=false;
    const A=Array.from({length:N},()=>new Float64Array(N+1));
    for(let i=0;i<N;i++)A[i][i]+=1e-9;
    const st=(a,b,g)=>{A[a][a]+=g;A[b][b]+=g;A[a][b]-=g;A[b][a]-=g;};
    EDGES.forEach(e=>{const c=comp[e.id];if(!c)return;
      if(c.t==='bat'){const pol=(c.flip?-1:1)*defPol(e),p=pol>0?e.b:e.a,n=pol>0?e.a:e.b;st(p,n,2);A[p][N]+=S.V/0.5;A[n][N]-=S.V/0.5;}
      else st(e.a,e.b,1/resOf(c));});
    /* eliminació de Gauss */
    for(let i=0;i<N;i++){
      let p=i;for(let r=i+1;r<N;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
      [A[i],A[p]]=[A[p],A[i]];
      const d=A[i][i];for(let r=i+1;r<N;r++){const f=A[r][i]/d;if(f===0)continue;for(let k=i;k<=N;k++)A[r][k]-=f*A[i][k];}
    }
    const Vn=new Float64Array(N);
    for(let i=N-1;i>=0;i--){let s=A[i][N];for(let k=i+1;k<N;k++)s-=A[i][k]*Vn[k];Vn[i]=s/A[i][i];}
    EDGES.forEach(e=>{const c=comp[e.id];e.I=0;e.dV=Vn[e.a]-Vn[e.b];if(!c)return;
      if(c.t==='bat'){const pol=(c.flip?-1:1)*defPol(e),p=pol>0?e.b:e.a,n=pol>0?e.a:e.b;const ib=S.V/0.5-2*(Vn[p]-Vn[n]);e.I=pol>0?ib:-ib;e.dV=Vn[p]-Vn[n];if(Math.abs(ib)>Math.abs(Ib))Ib=ib;hasBat=true;}
      else{e.I=e.dV/resOf(c);}
      if(c.t==='bulb'&&!c.blown&&e.I*e.I*RB>PBLOW){c.blown=true;again=true;S.blownNow=performance.now();}
    });
  }
  S.hasBat=hasBat;S.Ib=Ib;S.short=hasBat&&Math.abs(Ib)>3;
  report();
}
function anyBlown(){return EDGES.some(e=>comp[e.id]&&comp[e.id].blown);}
function report(){
  const m=$('#msg');let k='m_ok',cls='msg good';
  const lit=EDGES.some(e=>comp[e.id]&&comp[e.id].t==='bulb'&&!comp[e.id].blown&&e.I*e.I*RB>0.02);
  if(!S.hasBat){k='m_nobat';cls='msg';}
  else if(S.short){k='m_short';cls='msg bad';}
  else if(anyBlown()){k='m_blown';cls='msg bad';}
  else if(Math.abs(S.Ib)<0.002){k='m_open';cls='msg';}
  else if(lit)k='m_lit';
  m.className=cls;m.textContent=t(k);
  const ib=S.hasBat?Math.abs(S.Ib):0;
  $('#kv').innerHTML='<dt>'+t('k_V')+'</dt><dd>'+fmt(S.V,1)+' V</dd><dt>'+t('k_I')+'</dt><dd class="hb">'+(ib>=1?f3(ib)+' A':f3(ib*1000)+' mA')+'</dd><dt>'+t('k_P')+'</dt><dd>'+f3(ib*S.V)+' W</dd>';
  hoverInfo();
}
function hoverInfo(){
  const e=S.hover&&EID[S.hover],c=e&&comp[S.hover],box=$('#info');
  if(!c){box.innerHTML=t('i_empty');return;}
  const R=resOf(c),I=Math.abs(e.I),V=Math.abs(e.dV);
  let extra='';if(c.t==='bulb')extra=c.blown?' · '+t('blownlbl'):'';else if(c.t==='res')extra=' · '+c.v+' Ω';else if(c.t==='sw'||c.t==='push')extra=' · '+t(c.closed?'closed':'open');
  box.innerHTML='<b>'+t('n_'+c.t)+extra+'</b><br>'+t('i_V')+': '+f3(V)+' V · '+t('i_I')+': '+(I>=1?f3(I)+' A':f3(I*1000)+' mA')+' · '+t('i_P')+': '+f3(V*I)+' W';
}

/* ---- peces i exemples ---- */
function setC(id,o){comp[id]=Object.assign({},o);}
function rect(r0,c0,r1,c1){for(let c=c0;c<c1;c++){setC('h'+r0+'_'+c,{t:'wire'});setC('h'+r1+'_'+c,{t:'wire'});}for(let r=r0;r<r1;r++){setC('v'+r+'_'+c0,{t:'wire'});setC('v'+r+'_'+c1,{t:'wire'});}}
const PRESETS={
 simple(){rect(1,1,4,5);setC('v2_1',{t:'bat'});setC('h1_2',{t:'sw',closed:true});setC('h1_3',{t:'bulb'});},
 series(){rect(1,1,4,5);setC('v2_1',{t:'bat'});setC('h1_2',{t:'bulb'});setC('h1_3',{t:'bulb'});setC('h4_3',{t:'sw',closed:true});},
 par(){rect(1,1,4,7);setC('v2_1',{t:'bat'});setC('h1_2',{t:'sw',closed:true});setC('v1_4',{t:'wire'});setC('v2_4',{t:'bulb'});setC('v3_4',{t:'wire'});setC('v2_7',{t:'bulb'});},
 short(){rect(1,1,4,5);setC('v2_1',{t:'bat'});setC('h1_3',{t:'sw',closed:false});}
};
function loadPreset(k){Object.keys(comp).forEach(i=>delete comp[i]);PRESETS[k]();solve();}
function buildChips(){
  const h=$('#presets');h.innerHTML='';
  ['simple','series','par','short'].forEach(k=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t('p_'+(k==='simple'?'simple':k==='series'?'series':k==='par'?'par':'short'));b.onclick=()=>loadPreset(k);h.appendChild(b);});
}
$('#fixb').onclick=()=>{EDGES.forEach(e=>{if(comp[e.id])delete comp[e.id].blown;});solve();};
$('#clear').onclick=()=>{Object.keys(comp).forEach(i=>delete comp[i]);solve();};
function buildTools(){
  const L=['hand','wire','bat','bulb','res','sw','push','erase'].map(v=>({v,key:'t_'+v}));
  TEC.seg($('#tools'),L,S.tool,v=>{S.tool=v;});
}
function apply(e,paint){
  const id=e.id,c=comp[id],tl=S.tool;
  if(tl==='hand')return;
  if(tl==='erase'){delete comp[id];}
  else if(tl==='wire'){if(c&&c.t==='wire'){if(!paint)delete comp[id];}else setC(id,{t:'wire'});}
  else if(paint)return;
  else if(c&&c.t===tl){
    if(tl==='bat')c.flip=!c.flip;
    else if(tl==='res')c.v=RES[(RES.indexOf(c.v)+1)%RES.length];
    else delete comp[id];
  }else{
    if(tl==='bat')setC(id,{t:'bat'});else if(tl==='res')setC(id,{t:'res',v:100});else if(tl==='sw'||tl==='push')setC(id,{t:tl,closed:false});else setC(id,{t:tl});
  }
  solve();
}
function nearEdge(p){
  let best=null,bd=24;
  EDGES.forEach(e=>{
    const dx=e.x2-e.x1,dy=e.y2-e.y1,l2=dx*dx+dy*dy;let u=((p.x-e.x1)*dx+(p.y-e.y1)*dy)/l2;u=Math.max(0,Math.min(1,u));
    const d=Math.hypot(p.x-(e.x1+u*dx),p.y-(e.y1+u*dy));
    if(d<bd){bd=d;best=e;}
  });
  return best;
}
let lastPaint=null;
const cvo=TEC.cv('#cv',W,H,draw);
TEC.drag(cvo,{
  down(p){const e=nearEdge(p);if(!e)return false;
    if(S.tool==='hand'){const c=comp[e.id];if(c&&c.t==='sw'){c.closed=!c.closed;solve();}else if(c&&c.t==='push'){c.closed=true;solve();return true;}return false;}
    lastPaint=e.id;apply(e,false);return S.tool==='wire'||S.tool==='erase';},
  move(p){const e=nearEdge(p);if(e&&e.id!==lastPaint&&(S.tool==='wire'||S.tool==='erase')){lastPaint=e.id;apply(e,true);}},
  up(){let ch=false;EDGES.forEach(e=>{const c=comp[e.id];if(c&&c.t==='push'&&c.closed){c.closed=false;ch=true;}});lastPaint=null;if(ch)solve();},
  hover(p){const e=nearEdge(p);const id=e&&comp[e.id]?e.id:null;if(id!==S.hover){S.hover=id;hoverInfo();}}
});
cvo.cv.addEventListener('pointerleave',()=>{if(S.hover){S.hover=null;hoverInfo();}});

/* ---- dibuix ---- */
function glyph(c,k,e,cm){
  const L=Math.hypot(e.x2-e.x1,e.y2-e.y1),ang=Math.atan2(e.y2-e.y1,e.x2-e.x1),mx=(e.x1+e.x2)/2,my=(e.y1+e.y2)/2;
  c.save();c.translate(mx,my);c.rotate(ang);
  const wire=(a,b,col,w)=>{c.beginPath();c.moveTo(a,0);c.lineTo(b,0);c.strokeStyle=col||k.ink;c.lineWidth=w||4;c.lineCap='round';c.stroke();};
  const hl=L/2;
  if(cm.t==='wire'){wire(-hl,hl,k.ink,4.5);}
  else{
    wire(-hl,-18,k.ink,4.5);wire(18,hl,k.ink,4.5);
    if(cm.t==='bulb'){
      const P=e.I*e.I*RB,b=cm.blown?0:Math.max(0,Math.min(1,Math.sqrt(P/1.4)));
      if(b>0){const g=c.createRadialGradient(0,0,3,0,0,46);g.addColorStop(0,'rgba(255,214,70,'+(.8*b)+')');g.addColorStop(1,'rgba(255,214,70,0)');c.fillStyle=g;c.fillRect(-48,-48,96,96);}
      c.beginPath();c.arc(0,0,16,0,TAU);c.fillStyle=b>0?'rgba(255,225,110,'+(.35+.65*b)+')':k.panel;c.fill();c.strokeStyle=cm.blown?k.warn:k.ink;c.lineWidth=2.5;c.stroke();
      c.beginPath();c.moveTo(-9,8);c.lineTo(-4,-3);c.lineTo(0,5);c.lineTo(4,-3);c.lineTo(9,8);c.strokeStyle=cm.blown?k.warn:k.ink;c.lineWidth=2;c.stroke();
      if(cm.blown){c.beginPath();c.moveTo(-10,-10);c.lineTo(10,10);c.moveTo(10,-10);c.lineTo(-10,10);c.strokeStyle=k.warn;c.lineWidth=3;c.stroke();}
    }else if(cm.t==='res'){
      c.beginPath();c.rect(-18,-7,36,14);c.fillStyle=k.panel;c.fill();c.strokeStyle=k.ink;c.lineWidth=2.5;c.stroke();
      c.save();c.rotate(-ang);c.fillStyle=k.ink;c.font='bold 11.5px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(cm.v+' Ω',0,-17);c.restore();
    }else if(cm.t==='bat'){
      const pol=(cm.flip?-1:1)*defPol(e);
      c.beginPath();c.rect(-18,-14,36,28);c.fillStyle=k.panel;c.fill();c.strokeStyle=k.muted;c.lineWidth=1.5;c.stroke();
      const plate=(x,h,w,col)=>{c.beginPath();c.moveTo(x,-h);c.lineTo(x,h);c.strokeStyle=col;c.lineWidth=w;c.stroke();};
      plate(pol*-5,12,5,k.pa);plate(pol*6,7,5,k.pb);
      c.save();c.rotate(-ang);const qx=Math.cos(ang)*pol*14,qy=Math.sin(ang)*pol*14;c.fillStyle=k.pb;c.font='bold 13px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('+',qx*1.0+Math.sin(ang)*-0,qy-(e.o==='h'?19:0));c.restore();
    }else if(cm.t==='sw'||cm.t==='push'){
      c.beginPath();c.arc(-14,0,3.5,0,TAU);c.arc(14,0,3.5,0,TAU);c.fillStyle=k.ink;c.fill();
      if(cm.t==='sw'){c.beginPath();c.moveTo(-14,0);c.lineTo(cm.closed?14:11,cm.closed?0:-16);c.strokeStyle=cm.closed?k.ink:k.warn;c.lineWidth=4;c.lineCap='round';c.stroke();}
      else{const y=cm.closed?-3:-14;c.beginPath();c.moveTo(-14,y);c.lineTo(14,y);c.strokeStyle=k.pb;c.lineWidth=4;c.stroke();c.beginPath();c.moveTo(0,y);c.lineTo(0,y-10);c.strokeStyle=k.pb;c.lineWidth=3;c.stroke();c.beginPath();c.rect(-7,y-14,14,5);c.fillStyle=k.pb;c.fill();}
    }
  }
  c.restore();
}
function draw(o){
  const c=o.ctx,k=C();
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  /* quadrícula guia */
  EDGES.forEach(e=>{if(comp[e.id])return;c.beginPath();c.moveTo(e.x1,e.y1);c.lineTo(e.x2,e.y2);c.strokeStyle=k.line;c.globalAlpha=e.id===S.hoverEdge?1:.55;c.lineWidth=1.2;c.setLineDash([3,5]);c.stroke();c.setLineDash([]);c.globalAlpha=1;});
  for(let i=0;i<COLS*ROWS;i++){const [x,y]=nodeXY(i);c.beginPath();c.arc(x,y,2.8,0,TAU);c.fillStyle=k.line;c.fill();}
  EDGES.forEach(e=>{const cm=comp[e.id];if(cm)glyph(c,k,e,cm);});
  /* electrons: només en peces amb corrent */
  EDGES.forEach(e=>{
    if(!comp[e.id]||Math.abs(e.I)<0.003)return;
    const L=Math.hypot(e.x2-e.x1,e.y2-e.y1),dir=e.I>0?-1:1;/* electrons en sentit contrari al corrent convencional */
    for(let d=e.ph%16;d<L;d+=16){
      const u=dir>0?d/L:1-d/L,x=e.x1+(e.x2-e.x1)*u,y=e.y1+(e.y2-e.y1)*u;
      if(comp[e.id].t==='bulb'||comp[e.id].t==='res'||comp[e.id].t==='bat'||comp[e.id].t==='sw'||comp[e.id].t==='push'){if(Math.abs(u-.5)<.3)continue;}
      c.beginPath();c.arc(x,y,3.4,0,TAU);c.fillStyle=k.pa;c.fill();
    }
  });
  if(!Object.keys(comp).length)TEC.txt(c,t('hint'),W/2,H/2,{font:'15px system-ui',col:k.muted});
  if(S.short){c.fillStyle='rgba(220,40,40,'+(.12+.1*Math.sin(performance.now()/120))+')';c.fillRect(0,0,W,H);TEC.txt(c,'⚠ '+t('m_short').split('!')[0]+'!',W/2,24,{font:'bold 18px system-ui',col:k.warn});}
}
TEC.loop(dt=>{
  if(!REDUCE)EDGES.forEach(e=>{if(Math.abs(e.I)>=0.003)e.ph=(e.ph+Math.min(180,30+Math.abs(e.I)*300)*dt)%16;});
  draw(cvo);
});

/* ---- Raona-ho ---- */
const ld=(k,V,fn)=>{S.V=V;sv.set(V);loadPreset(k);if(fn){fn();solve();}};
RZ.init({
 sim:()=>{},
 M:[
  {id:'m1',f:[{l:'l_V',u:'V'}],sim:([v])=>ld('simple',Math.max(3,Math.min(12,Math.round(v/1.5)*1.5))),ok:()=>({k:'m1_ok'}),
   chk:([v])=>{if(v===7.5)return null;if(v<3||v>12)return {k:'rng'};const i=v/30.64,P=i*i*30;return {k:'m1_f',p:[v,fmt(i*1000,0),fmt(P,2),t(P>2.4?'m1_bad_lbl':'m1_ok_lbl')]};}},
  {id:'m2',f:[{l:'l_Vf',u:'V'}],sim:()=>ld('series',9),ok:()=>({k:'m2_ok'}),
   chk:([v])=>Math.abs(v-4.4)<=.35?null:{k:'m2_f'}},
  {id:'m3',f:[{l:'l_mA',u:'mA'}],sim:()=>ld('par',6),ok:()=>({k:'m3_ok'}),
   chk:([v])=>v>=360&&v<=440?null:{k:'m3_f'}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>ld('series',9,()=>{comp['h4_3'].closed=false;})},
  {id:'s2',ans:'S',sim:()=>ld('short',6)},
  {id:'s3',ans:'M',sim:()=>ld('simple',6,()=>setC('h4_3',{t:'res',v:100}))}
 ],
 E:[{id:'e1',who:1,sim:()=>ld('simple',6,()=>{comp['v2_1'].flip=true;})}]
});

const QDATA=[{"id":"q1","lvl":"all","type":"num","num":200,"tol":0.01,"u":1},{"id":"q2","lvl":"all","type":"mc","n":4,"ans":0},{"id":"q4","lvl":"basic","type":"mc","n":4,"ans":0},{"id":"q5","lvl":"basic","type":"mc","n":4,"ans":0},{"id":"q3","lvl":"adv","type":"mc","n":4,"ans":1},{"id":"q6","lvl":"adv","type":"num","num":100,"tol":0.01,"u":1}];
App.hooks.push(()=>{buildTools();buildChips();report();});
initQuiz(QDATA);
loadPreset('simple');
initLang();applyLang();
