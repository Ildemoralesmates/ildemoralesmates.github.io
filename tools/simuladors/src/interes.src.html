/*@QUIZ_CSS@*/

.numin{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}

.side .tbl td,.side .tbl th{font-size:13px}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:5px;vertical-align:-1px}
.big{font-family:var(--f-num);font-size:15px;color:var(--ink);margin:0}
</style>

    let f=y<=kf?1:(y===kf+1?fr:0);if(y===0)f=1;if(f<=0)break;

    const s=y===0?C0:lerp(simpleV(y-1),simpleV(y),e),c=y===0?C0:lerp(compV(y-1),compV(y),e);
    ptsS.push([xc-bw/2-gap,yy(s)]);ptsC.push([xc+bw/2+gap,yy(c)]);
    /* simple */
    cx.fillStyle=ok;cx.globalAlpha=.7;cx.fillRect(xc-bw-gap,yy(C0),bw,Y0-yy(C0));cx.globalAlpha=1;
    if(s>C0){cx.fillStyle=pa;cx.globalAlpha=.85;cx.fillRect(xc-bw-gap,yy(s),bw,yy(C0)-yy(s));cx.globalAlpha=1;}
    /* compost */
    if(lay&&y>0){const L=layers(y),sc=c/compV(y);let acc=0;
      L.forEach((v,i)=>{const v2=i===0?v:v*sc;const a=acc,b=acc+v2;acc=b;if(v2<=0)return;cx.fillStyle=colL[i];cx.globalAlpha=i===0?.7:.88;cx.fillRect(xc+gap,yy(b),bw,yy(a)-yy(b));cx.globalAlpha=1;});}
    else{cx.fillStyle=ok;cx.globalAlpha=.7;cx.fillRect(xc+gap,yy(C0),bw,Y0-yy(C0));cx.globalAlpha=1;if(c>C0){cx.fillStyle=pb;cx.globalAlpha=.88;cx.fillRect(xc+gap,yy(c),bw,yy(C0)-yy(c));cx.globalAlpha=1;}}
  }
  /* línies */
  const pl=(pts,col,dash)=>{if(pts.length<2)return;cx.strokeStyle=col;cx.lineWidth=2.2;cx.setLineDash(dash);cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();cx.setLineDash([]);};
  pl(ptsS,pa,[6,4]);pl(ptsC,pb,[]);
  /* eix x */
  cx.strokeStyle=mut;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(X0,Y0);cx.lineTo(X1,Y0);cx.stroke();
  const ev=T<=12?1:T<=24?2:5;cx.fillStyle=mut;cx.font='12px system-ui';cx.textAlign='center';
  for(let y=0;y<=T;y+=ev)cx.fillText(String(y),X0+sw*(y+.5),Y0+16);
  cx.fillText(t('lb_year'),X1-14,Y0+32);
  /* valors finals */
  if(ptsS.length>1){const ls=ptsS[ptsS.length-1],lc=ptsC[ptsC.length-1],yv=ptsS.length-1,ve=kf>=T;
    cx.font='bold 13px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='right';
    const ys=Math.max(ls[1]-8,lc[1]+30);
    cx.fillStyle=pb;cx.fillText(eur(ve?compV(T):compV(Math.min(T,kf))),Math.min(X1,lc[0]+bw),lc[1]-8);
    cx.fillStyle=pa;cx.fillText(eur(ve?simpleV(T):simpleV(Math.min(T,kf))),Math.min(X1,lc[0]+bw),Math.min(Y0-6,ys));}
  /* llegenda */
  const items=[[ok,t('lg_cap')],[pa,t('lb_simple')+': '+t('lg_int')]].concat(lay?[[pa,t('lg_l1')],[pb,t('lg_l2')],[l3,t('lg_l3')]]:[[pb,t('lb_comp')+': '+t('lg_int')]]);
  cx.font='12.5px system-ui';cx.textAlign='left';let lx=X0,ly=20;
  items.forEach(([c,s],i)=>{if(i===2&&lay){lx=X0;ly=40;cx.fillStyle=ink;cx.font='bold 12.5px system-ui';cx.fillText(t('lb_comp')+':',lx,ly+10);lx+=cx.measureText(t('lb_comp')+': ').width+6;cx.font='12.5px system-ui';}
    cx.fillStyle=c;cx.fillRect(lx,ly,12,12);cx.fillStyle=ink;cx.fillText(s,lx+17,ly+10);lx+=cx.measureText(s).width+34;});
  cx.fillStyle=mut;cx.font='11.5px system-ui';cx.textAlign='right';cx.fillText(t('lb_s')+' | '+t('lb_c'),X1,20);
}
function drawFreq(){
  const ink=css('--ink'),mut=css('--muted'),pa=css('--pa'),pb=css('--pb'),ok=css('--ok'),line=css('--line');
  const r=TIN/100,top=C0*Math.exp(r),X0=80,X1=W-150,Y0=H-50,Y1=40,lo=C0,hi=C0+(top-C0)*1.08,yy=v=>Y0-(Y0-Y1)*(v-lo)/(hi-lo),xx=s=>X0+(X1-X0)*s;
  const st=niceStep(hi-lo,6);cx.font='12px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='right';
  for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){cx.strokeStyle=line;cx.lineWidth=1;cx.beginPath();cx.moveTo(X0,yy(v));cx.lineTo(X1,yy(v));cx.stroke();cx.fillStyle=mut;cx.fillText(kfmt(v),X0-6,yy(v)+4);}
  cx.strokeStyle=mut;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(X0,Y0);cx.lineTo(X1,Y0);cx.stroke();
  cx.fillStyle=mut;cx.font='12px system-ui';cx.textAlign='center';
  const ML=LANG==='es'?['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']:['gen','febr','març','abr','maig','juny','jul','ag','set','oct','nov','des'];
  for(let i=0;i<12;i++)cx.fillText(ML[i],xx((i+.5)/12),Y0+16);
  const kf=Math.floor(phase),fr=phase-kf;
  const stair=(n,f,col,lw,alpha)=>{cx.strokeStyle=col;cx.lineWidth=lw;cx.globalAlpha=alpha;cx.beginPath();
    if(n===Infinity){const N=200;for(let i=0;i<=N*f;i++){const s=i/N;const v=C0*Math.exp(r*s);i?cx.lineTo(xx(s),yy(v)):cx.moveTo(xx(s),yy(v));}}
    else{let v=C0;cx.moveTo(xx(0),yy(v));const m=Math.ceil(n*f);for(let i=1;i<=m;i++){const s=Math.min(i/n,f);cx.lineTo(xx(s),yy(v));if(i/n<=f+1e-9){v*=1+r/n;cx.lineTo(xx(s),yy(v));}}}
    cx.stroke();cx.globalAlpha=1;};
  const col=[ok,pa,'#7a7a7a',pb,'#7a7a7a','#7a7a7a',ink];
  for(let i=0;i<=Math.min(kf,NS.length-1);i++){const cur=i===Math.min(kf,NS.length-1)&&phase>=target-1e-9;
    stair(NS[i],1,i===NS.length-1?css('--ok'):(i===0?pb:pa),cur?3:1.4,cur?1:.35);}
  if(kf+1<NS.length&&fr>0)stair(NS[kf+1],REDUCE?1:fr,pa,3,1);
  /* etiquetes a la dreta */
  cx.font='12.5px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='left';let lastY=-99;
  for(let i=0;i<=Math.min(kf,NS.length-1);i++){const v=fV(i);let y=yy(v)+4;if(Math.abs(y-lastY)<14)y=lastY-14;lastY=y;
    cx.fillStyle=i===Math.min(kf,NS.length-1)?ink:mut;cx.fillText(t('f_n'+(NS[i]===Infinity?'inf':NS[i]))+' '+pct((v/C0-1)*100,2)+'%',X1+8,y);}
  /* límit */
  cx.strokeStyle=ok;cx.setLineDash([3,4]);cx.lineWidth=1.2;cx.beginPath();cx.moveTo(X0,yy(top));cx.lineTo(X1,yy(top));cx.stroke();cx.setLineDash([]);
  cx.fillStyle=ok;cx.font='bold 12px system-ui';cx.textAlign='left';cx.fillText('C₀·e^r',X0+4,yy(top)-5);
}
function draw(){cx.fillStyle=css('--stage');cx.fillRect(0,0,W,H);if(!valid)return;if(mode==='race')drawRace();else drawFreq();}
function loop(){
  if(phase<target){const prev=phase,sp=mode==='race'?(target-phase>3?1/14:1/40):1/70;phase=REDUCE?target:Math.min(target,phase+sp);
    if(Math.floor(prev)!==Math.floor(phase)||phase>=target)texts();
    if(phase>=target&&target===steps())finish();}
  draw();requestAnimationFrame(loop);
}
