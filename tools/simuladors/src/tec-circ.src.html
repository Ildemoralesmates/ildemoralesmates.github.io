const W=640,H=380;
const S={cfg:'s',closed:true,blown:false,conv:false};
const CT=$('#ctls'),SL={};
SL.V=slider(CT,{id:'V',key:'V',min:3,max:12,step:1.5,val:9,fmtv:v=>fmt(v,1)+' V',on:upd});
SL.R1=slider(CT,{id:'R1',key:'R1',min:10,max:100,step:5,val:40,fmtv:v=>v+' Ω',on:upd});
SL.R2=slider(CT,{id:'R2',key:'R2',min:10,max:100,step:5,val:60,fmtv:v=>v+' Ω',on:upd});
const f3=x=>fmt(+x.toPrecision(3),3).replace(/,?0+$/,'').replace(/,$/,'');
function calc(){
  const V=SL.V.get(),R1=SL.R1.get(),R2=SL.R2.get(),on=S.closed,b1=S.blown;
  let I=0,I1=0,I2=0,V1=0,V2=0,Rt;
  if(S.cfg==='s'){
    Rt=R1+R2;
    if(on&&!b1){I=V/Rt;I1=I2=I;V1=I*R1;V2=I*R2;}
    else if(on&&b1){V1=V;V2=0;}
  }else{
    Rt=b1?R2:R1*R2/(R1+R2);
    if(on){I1=b1?0:V/R1;I2=V/R2;I=I1+I2;V1=b1?0:V;V2=V;}
  }
  return {V,R1,R2,Rt,I,I1,I2,V1,V2,P:V*I};
}
function upd(){
  const c=calc();
  $('#sw').textContent=t(S.closed?'sw_open':'sw_close');
  $('#blow').textContent=t(S.blown?'fix':'blow');
  const rows=[['k_V',fmt(c.V,1)+' V',''],['k_req',(isFinite(c.Rt)?f3(c.Rt):'∞')+' Ω',''],['k_I',f3(c.I*1000)+' mA','hb'],['k_I1',f3(c.I1*1000)+' mA',''],['k_I2',f3(c.I2*1000)+' mA',''],['k_V1',f3(c.V1)+' V','hl'],['k_V2',f3(c.V2)+' V','hl'],['k_P',f3(c.P)+' W','']];
  $('#kv').innerHTML=rows.map(r=>'<dt>'+t(r[0])+'</dt><dd class="'+r[2]+'">'+r[1]+'</dd>').join('');
  let f;
  if(S.cfg==='s')f=tt('f_s1',c.R1,c.R2,c.R1+c.R2)+'<br>'+tt('f_I',fmt(c.V,1),c.R1+c.R2,f3(c.V/(c.R1+c.R2)))+'<br>'+tt('f_s3',f3(c.V/(c.R1+c.R2)*c.R1),f3(c.V/(c.R1+c.R2)*c.R2));
  else f=tt('f_p1',c.R1,c.R2,f3(c.R1*c.R2/(c.R1+c.R2)))+'<br>'+tt('f_p3',f3(c.V/c.R1),f3(c.V/c.R2))+'<br>'+tt('f_I',fmt(c.V,1),f3(c.R1*c.R2/(c.R1+c.R2)),f3(c.V/c.R1+c.V/c.R2));
  $('#formula').innerHTML=f;
  const m=$('#msg');
  if(!m.classList.contains('guessmsg')){
    m.className='msg';
    m.textContent=!S.closed?t('msg_open'):S.blown?t(S.cfg==='s'?'msg_s_blown':'msg_p_blown'):t('msg_ok');
  }
}
function setCfg(v){S.cfg=v;$('#msg').className='msg';upd();}
function buildSeg(){TEC.seg($('#cfgsw'),[{v:'s',key:'c_s'},{v:'p',key:'c_p'}],S.cfg,setCfg);}
$('#sw').addEventListener('click',()=>{S.closed=!S.closed;$('#msg').className='msg';upd();});
$('#blow').addEventListener('click',()=>{S.blown=!S.blown;$('#msg').className='msg';upd();});
$('#conv').addEventListener('change',e=>{S.conv=e.target.checked;});
['V','R1','R2'].forEach(k=>SL[k].inp.addEventListener('input',()=>{$('#msg').className='msg';upd();}));
$('#checkg').addEventListener('click',()=>{
  const v=parseNum($('#guess').value),m=$('#msg'),c=calc(),need=c.I*1000;
  if(!isFinite(v)||$('#guess').value.trim()===''){m.className='msg bad guessmsg';m.textContent=t('g_bad');return;}
  if(Math.abs(v-need)<=need*.03+1e-9){m.className='msg good guessmsg';m.textContent=tt('g_ok',f3(need));}
  else{m.className='msg bad guessmsg';m.innerHTML=tt('g_no',f3(v),f3(need));}
});

/* ---- geometria del circuit ---- */
const TOP=84,BOT=300,XL=70;
function edges(c){
  const sw=c.I>0;
  if(S.cfg==='s'){
    const pts=[[XL,150],[XL,TOP],[560,TOP],[560,BOT],[XL,BOT],[XL,230]];
    return [{pts,I:c.I}];
  }
  return [
    {pts:[[XL,150],[XL,TOP],[300,TOP]],I:c.I},
    {pts:[[300,TOP],[480,TOP]],I:c.I2},
    {pts:[[300,TOP],[300,BOT]],I:c.I1},
    {pts:[[480,TOP],[480,BOT]],I:c.I2},
    {pts:[[480,BOT],[300,BOT]],I:c.I2},
    {pts:[[300,BOT],[XL,BOT],[XL,230]],I:c.I}
  ];
}
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
function at(p,d){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(d<=l){const f=d/l;return [p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f,Math.atan2(p[i][1]-p[i-1][1],p[i][0]-p[i-1][0])];}d-=l;}const q=p[p.length-1];return [q[0],q[1],0];}
const SP=24;let phase=[0,0,0,0,0,0];

let hitSw={x:150,y:TOP};
const cvo=TEC.cv('#cv',W,H,draw);
function draw(o){
  const c=o.ctx,k=C(),m=calc(),E=edges(m);
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  /* cables */
  E.forEach(e=>TEC.line(c,e.pts,k.muted,4));
  /* pila */
  c.fillStyle=k.stage;c.fillRect(XL-26,160,52,60);
  TEC.line(c,[[XL-22,168],[XL+22,168]],k.pb,4);TEC.line(c,[[XL-12,182],[XL+12,182]],k.ink,6);TEC.line(c,[[XL-22,198],[XL+22,198]],k.pb,4);TEC.line(c,[[XL-12,212],[XL+12,212]],k.ink,6);
  TEC.txt(c,'+',XL+36,150,{font:'bold 18px system-ui',col:k.pb});TEC.txt(c,'−',XL+36,238,{font:'bold 18px system-ui',col:k.pa});
  TEC.txt(c,fmt(m.V,1)+' V',XL-30,190,{font:'bold 14px system-ui'});
  /* interruptor */
  c.fillStyle=k.stage;c.fillRect(hitSw.x-24,TOP-8,48,16);
  TEC.line(c,[[hitSw.x-24,TOP],[hitSw.x-14,TOP]],k.muted,4);TEC.line(c,[[hitSw.x+14,TOP],[hitSw.x+24,TOP]],k.muted,4);
  TEC.line(c,S.closed?[[hitSw.x-14,TOP],[hitSw.x+14,TOP]]:[[hitSw.x-14,TOP],[hitSw.x+10,TOP-24]],S.closed?k.ink:k.warn,5);
  [[hitSw.x-14,TOP],[hitSw.x+14,TOP]].forEach(q=>{c.beginPath();c.arc(q[0],q[1],4,0,TAU);c.fillStyle=k.ink;c.fill();});
  TEC.txt(c,S.closed?'ON':'OFF',hitSw.x,TOP-34,{font:'bold 12px system-ui',col:S.closed?k.ok:k.warn});
  /* bombetes */
  const b1=S.cfg==='s'?[300,TOP]:[300,190],b2=S.cfg==='s'?[430,TOP]:[480,190];
  const P1=m.I1*m.I1*m.R1,P2=m.I2*m.I2*m.R2;
  bulb(c,k,b1[0],b1[1],P1,S.blown,'1');bulb(c,k,b2[0],b2[1],P2,false,'2');
  /* mesures */
  const vo=(x,y,v,l,al)=>{TEC.txt(c,l+' '+f3(v)+' V',x,y,{font:'bold 13px system-ui',col:k.pa,al:al||'center'});};
  if(S.cfg==='s'){vo(b1[0],b1[1]+44,m.V1,'V₁');vo(b2[0],b2[1]+44,m.V2,'V₂');}
  else{vo(b1[0]+14,b1[1]+44,m.V1,'V₁','left');vo(b2[0]+14,b2[1]+44,m.V2,'V₂','left');
       TEC.txt(c,'I₁ = '+f3(m.I1*1000)+' mA',b1[0]-70,b1[1],{font:'12.5px system-ui',col:k.muted});TEC.txt(c,'I₂ = '+f3(m.I2*1000)+' mA',b2[0]+72,b2[1],{font:'12.5px system-ui',col:k.muted});}
  /* amperímetre */
  const ax=XL+110,ay=BOT;
  c.beginPath();c.arc(ax,ay,19,0,TAU);c.fillStyle=k.panel;c.fill();c.strokeStyle=k.pb;c.lineWidth=3;c.stroke();
  TEC.txt(c,'A',ax,ay,{font:'bold 17px system-ui',col:k.pb});TEC.txt(c,f3(m.I*1000)+' mA',ax,ay+34,{font:'bold 13.5px system-ui',col:k.pb});
  /* electrons / corrent convencional */
  E.forEach((e,i)=>{
    const L=plen(e.pts);if(!(e.I>0))return;
    for(let d=phase[i]%SP;d<L;d+=SP){
      const q=at(e.pts,S.conv?d:L-d),dirA=q[2]+(S.conv?0:Math.PI);
      if(S.conv){c.save();c.translate(q[0],q[1]);c.rotate(q[2]);c.beginPath();c.moveTo(6,0);c.lineTo(-4,-5);c.lineTo(-4,5);c.closePath();c.fillStyle=k.pb;c.fill();c.restore();}
      else{c.beginPath();c.arc(q[0],q[1],5,0,TAU);c.fillStyle=k.pa;c.fill();c.fillStyle='#fff';c.fillRect(q[0]-3,q[1]-.8,6,1.6);}
    }
  });
  TEC.txt(c,t(S.cfg==='s'?'c_s':'c_p'),W/2,22,{font:'bold 15px system-ui'});
}
function bulb(c,k,x,y,P,blown,lab){
  const b=blown?0:Math.max(0,Math.min(1,Math.sqrt(P/2.2)));
  if(b>0){const g=c.createRadialGradient(x,y,4,x,y,56);g.addColorStop(0,'rgba(255,214,70,'+(.75*b)+')');g.addColorStop(1,'rgba(255,214,70,0)');c.fillStyle=g;c.fillRect(x-60,y-60,120,120);}
  c.beginPath();c.arc(x,y,22,0,TAU);c.fillStyle=b>0?'rgba(255,225,110,'+(.35+.65*b)+')':k.panel;c.fill();c.strokeStyle=k.ink;c.lineWidth=2.5;c.stroke();
  TEC.line(c,[[x-12,y+12],[x-6,y-4],[x,y+8],[x+6,y-4],[x+12,y+12]],blown?k.warn:k.ink,2);
  if(blown){TEC.line(c,[[x-9,y-9],[x+9,y+9]],k.warn,3);TEC.line(c,[[x+9,y-9],[x-9,y+9]],k.warn,3);}
  TEC.txt(c,lab,x,y-34,{font:'bold 13px system-ui',col:k.muted});
}
TEC.drag(cvo,{down(p){if(Math.hypot(p.x-hitSw.x,p.y-hitSw.y)<34){S.closed=!S.closed;$('#msg').className='msg';upd();}return false;}});
TEC.loop(dt=>{
  const m=calc(),E=edges(m);
  E.forEach((e,i)=>{if(e.I>0&&!REDUCE)phase[i]=(phase[i]+(Math.min(250,40+e.I*320))*dt)%SP;});
  draw(cvo);
});

App.hooks.push(()=>{upd();buildSeg();});
initQuiz(QDATA);
initLang();applyLang();
