<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codi de colors de les resistències</title>
<meta name="description" content="Aprén el codi de colors de les resistències: tria el color de cada banda i mira el valor i la tolerància, escriu un valor i comprova quines bandes té, o resol reptes aleatoris. Resistències de 4 i 5 bandes. Per a Tecnologia de 2n i 3r d'ESO, amb test autocorregit.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@TEC_CSS@*/
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{font:inherit;font-size:11.5px;border:2px solid var(--line);border-radius:8px;padding:14px 2px 4px;cursor:pointer;color:var(--ink);background:var(--panel);position:relative;line-height:1.1}
.sw::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:10px;border-radius:3px;background:var(--c);border:1px solid rgba(0,0,0,.35)}
.sw:disabled{opacity:.28;cursor:default}
.sw:focus-visible{outline:2px solid var(--pa);outline-offset:2px}
.sw[aria-pressed=true]{border-color:var(--pa)}
.sw b{display:block;font-family:var(--f-num);font-size:12.5px}
.bandrow{display:flex;flex-wrap:wrap;gap:4px}
.bandrow .chip{font-size:12.5px}
.sol{font-family:var(--f-num);font-size:14px;line-height:1.7}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <!--@LVLSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<div class="simgrid">
<div class="simcv"><canvas id="cv"></canvas><p data-i18n-html="story" style="margin-top:8px"></p></div>
<div class="side">
<div class="seg" id="modesw" role="group" data-i18n-aria="aria.mode" aria-label=""></div>
<div class="seg" id="nsw" role="group" data-i18n-aria="aria.n" aria-label=""></div>
<div id="bandsel" class="bandrow" role="group" data-i18n-aria="aria.band" aria-label=""></div>
<div class="pal" id="pal" role="group" data-i18n-aria="aria.pal" aria-label=""></div>
<div id="vbox" hidden>
<div class="predict"><label for="vin" data-i18n="vin_l"></label><input type="text" id="vin" autocomplete="off" placeholder="4k7" style="width:6.5em"><button class="btn" id="vgo" type="button" data-i18n="vgo"></button></div>
</div>
<div id="cbox" hidden>
<div class="predict"><label for="cin" data-i18n="cin_l"></label><input type="text" id="cin" autocomplete="off" style="width:6.5em"><button class="btn" id="cgo" type="button" data-i18n="check"></button>
<button class="btn" id="cnext" type="button" data-i18n="cnext"></button><button class="btn" id="cshow" type="button" data-i18n="cshow"></button></div>
<p class="note" id="score"></p>
</div>
<p class="msg" id="msg" aria-live="polite"></p>
<h3 data-i18n="out_h"></h3>
<dl class="kv" id="kv"></dl>
<div class="formula sol" id="sol"></div>
</div>
</div>
<div class="idea" data-lvl="basic" data-i18n-html="idea_basic"></div>
<div class="idea" data-lvl="adv" data-i18n-html="idea_adv"></div>
</section>

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@TEC_JS@*/

const W=640,H=275;
const HEX=['#151515','#7b4a22','#d62d2d','#f08a1c','#f2d21c','#2f9e44','#2f6fd6','#7d3cc4','#8c8c8c','#f4f4f4','#c9a227','#bdbdbd'];
const TOL={1:1,2:2,5:.5,6:.25,7:.1,8:.05,10:5,11:10};
const S={mode:'read',n:4,sel:0,bands:[4,7,2,10],chal:null,ok:0,tot:0,shown:false};
let selBand=0;
const f3=x=>fmt(+x.toPrecision(4),4).replace(/,?0+$/,'').replace(/,$/,'');
const mulOf=i=>i<=9?Math.pow(10,i):i===10?0.1:0.01;
function slots(){return S.n===4?['b_d1','b_d2','b_mul','b_tol']:['b_d1','b_d2','b_d3','b_mul','b_tol'];}
function allowed(slot){const k=slots()[slot];if(k==='b_mul')return [...Array(12).keys()];if(k==='b_tol')return Object.keys(TOL).map(Number);return [...Array(10).keys()];}
function val(b,n){
  const nd=n-2,d=b.slice(0,nd).reduce((a,x)=>a*10+x,0),m=mulOf(b[nd]);
  return {R:d*m,tol:TOL[b[nd+1]],d,m,nd};
}
function convert(n){
  const v=val(S.bands,S.bands.length),tol=S.bands[S.bands.length-1];
  const r=toBands(v.R,n)||{b:n===4?[1,0,0]:[1,0,0,0]};
  S.n=n;S.bands=[...r.b,tol];
  if(S.sel>=slots().length)S.sel=slots().length-1;
}
function setN(n){convert(n);rebuild();}
function fmtR(R){return TEC.si(R,'Ω');}
function lbl(i){return t('c_'+i);}
function buildBandSel(){
  const h=$('#bandsel');h.innerHTML='';
  slots().forEach((k,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t(k);b.setAttribute('aria-pressed',String(i===S.sel));b.onclick=()=>{S.sel=i;rebuild();};h.appendChild(b);});
}
function buildPal(){
  const h=$('#pal');h.innerHTML='';const ok=allowed(S.sel);
  for(let i=0;i<12;i++){
    const b=document.createElement('button');b.type='button';b.className='sw';b.style.setProperty('--c',HEX[i]);
    const slotKey=slots()[S.sel];
    let sub=i<=9?String(i):'';
    if(slotKey==='b_mul')sub='×'+(i<=9?'10'+(i?'<sup>'+i+'</sup>':'⁰'):(i===10?'0,1':'0,01'));
    if(slotKey==='b_tol')sub='±'+TOL[i]+' %';
    b.innerHTML=lbl(i)+'<b>'+sub+'</b>';b.disabled=!ok.includes(i)||(S.mode==='chal');
    b.setAttribute('aria-pressed',String(S.bands[S.sel]===i));
    b.onclick=()=>{S.bands[S.sel]=i;rebuild();};
    h.appendChild(b);
  }
}
function rebuild(){buildBandSel();buildPal();$('#pal').hidden=$('#bandsel').hidden=S.mode==='chal';out();draw(cvo);}
function out(){
  const v=val(S.bands,S.n);
  const chalHide=S.mode==='chal'&&!S.shown;
  const bandNames=S.bands.map(lbl).join(' · ');
  if(chalHide){$('#kv').innerHTML='<dt>'+t('k_val')+'</dt><dd>?</dd>';$('#sol').innerHTML='';return;}
  const dig=S.bands.slice(0,v.nd).join('');
  $('#kv').innerHTML='<dt>'+t('k_val')+'</dt><dd class="hl">'+fmtR(v.R)+'</dd><dt>'+t('k_tol')+'</dt><dd>±'+fmt(v.tol,v.tol<1?2:0).replace(/,00$/,'')+' %</dd><dt>'+t('k_rng')+'</dt><dd>'+fmtR(v.R*(1-v.tol/100))+' – '+fmtR(v.R*(1+v.tol/100))+'</dd>';
  const mi=S.bands[v.nd];
  $('#sol').innerHTML=bandNames+'<br>'+dig.split('').map((d,i)=>'<span class="'+(i%2?'kb':'ka')+'">'+d+'</span>').join(' ')+' → '+v.d+'<br>'+tt('s_mul',(mi<=9?'10<sup>'+mi+'</sup>':mulOf(mi).toString().replace('.',',')))+'<br>'+tt('s_res',v.d,'× '+f3(v.m),f3(v.R));
}
/* ---- mode: escriu un valor ---- */
function toBands(R,n){
  const nd=n-2;if(!(R>=0.1&&R<9.9e10))return null;
  let e=Math.floor(Math.log10(R)+1e-12)-(nd-1),m=Math.round(R/Math.pow(10,e));
  if(m>=Math.pow(10,nd)){e++;m=Math.round(R/Math.pow(10,e));}
  if(e<-2||e>9)return null;
  if(m<Math.pow(10,nd-1)&&e>-2&&R>=Math.pow(10,nd-1)*0.01){/* de vegades cal baixar l'exponent */}
  const digs=String(m).padStart(nd,'0').split('').map(Number);
  const mi=e>=0?e:(e===-1?10:11);
  const real=m*Math.pow(10,e);
  return {b:[...digs,mi],real,exact:Math.abs(real-R)/R<1e-9};
}
$('#vgo').onclick=()=>{
  const R=TEC.parse($('#vin').value),m=$('#msg');
  if(!isFinite(R)||R<=0){m.className='msg bad';m.textContent=t('w_bad');return;}
  const r=toBands(R,S.n);if(!r){m.className='msg bad';m.textContent=t('w_rng');return;}
  const tol=S.bands[S.bands.length-1];S.bands=[...r.b,tol];
  m.className=r.exact?'msg good':'msg';m.textContent=r.exact?tt('w_ok',fmtR(R)):tt('w_round',fmtR(R),S.n-2,fmtR(r.real));
  rebuild();
};
$('#vin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#vgo').click();});
/* ---- mode: repte ---- */
const E12=[10,12,15,18,22,27,33,39,47,56,68,82];
function newChal(){
  const b=E12[Math.floor(Math.random()*12)],e=Math.floor(Math.random()*5)-(Math.random()<.25?1:0);
  const R=b*Math.pow(10,Math.max(e,-1)),r=toBands(R,4)||toBands(R*10,4);
  S.bands=[...r.b,[10,11,1][Math.floor(Math.random()*3)]];S.n=4;S.chal=val(S.bands,4).R;S.shown=false;
  $('#cin').value='';$('#msg').textContent='';
}
$('#cgo').onclick=()=>{
  const v=TEC.parse($('#cin').value),m=$('#msg');
  if(!isFinite(v)){m.className='msg bad';m.textContent=t('g_bad');return;}
  S.tot++;const R=S.chal,ok=Math.abs(v-R)<=R*.005;
  if(ok){S.ok++;S.shown=true;m.className='msg good';m.textContent=tt('g_ok',fmtR(R));}
  else{S.shown=true;m.className='msg bad';m.textContent=tt('g_no',fmtR(v),fmtR(R),S.bands.slice(0,2).join('')+' × '+f3(mulOf(S.bands[2])));}
  rebuild();score();
};
$('#cin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#cgo').click();});
$('#cnext').onclick=()=>{newChal();rebuild();};
$('#cshow').onclick=()=>{S.shown=true;$('#msg').className='msg';$('#msg').textContent=tt('g_show',fmtR(S.chal));rebuild();};
function score(){$('#score').textContent=tt('chscore',S.ok,S.tot);}
function setMode(m){
  S.mode=m;S.shown=false;$('#msg').textContent='';
  $('#vbox').hidden=m!=='write';$('#cbox').hidden=m!=='chal';
  if(m==='chal'){S.n=4;newChal();}
  buildSegs();rebuild();score();
}
function buildSegs(){
  TEC.seg($('#modesw'),[{v:'read',key:'m_read'},{v:'write',key:'m_write'},{v:'chal',key:'m_chal'}],S.mode,setMode);
  const o=[{v:'4',key:'n4'}];if(App.level==='adv'&&S.mode!=='chal')o.push({v:'5',key:'n5'});
  if(App.level!=='adv'&&S.n===5)convert(4);
  TEC.seg($('#nsw'),o,String(S.n),v=>setN(+v));
  $('#nsw').hidden=o.length<2;
}

/* ---- dibuix ---- */
let bx=[];
const cvo=TEC.cv('#cv',W,H,draw);
function draw(o){
  const c=o.ctx,k=C(),n=S.n,cy=118;
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  TEC.line(c,[[30,cy],[600,cy]],k.muted,6);
  /* cos */
  const x0=170,x1=470;
  c.beginPath();c.moveTo(x0+16,cy-44);c.lineTo(x1-16,cy-44);c.quadraticCurveTo(x1+4,cy-44,x1,cy-26);c.lineTo(x1,cy+26);c.quadraticCurveTo(x1+4,cy+44,x1-16,cy+44);c.lineTo(x0+16,cy+44);c.quadraticCurveTo(x0-4,cy+44,x0,cy+26);c.lineTo(x0,cy-26);c.quadraticCurveTo(x0-4,cy-44,x0+16,cy-44);c.closePath();
  c.fillStyle=k.dark?'#c9a878':'#e6cfa0';c.fill();c.strokeStyle=k.ink;c.lineWidth=2;c.stroke();
  /* bandes */
  const xs=n===4?[212,256,300,422]:[208,240,272,304,422];
  bx=xs;
  const hide=S.mode==='chal'&&false;
  xs.forEach((x,i)=>{
    const col=HEX[S.bands[i]];
    c.fillStyle=col;c.fillRect(x-9,cy-44,18,88);
    c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=1;c.strokeRect(x-9,cy-44,18,88);
    if(i===S.sel&&S.mode!=='chal'){c.strokeStyle=k.pa;c.lineWidth=3;c.strokeRect(x-14,cy-52,28,104);}
    if(!(S.mode==='chal'&&!S.shown&&i<n-1))TEC.txt(c,i===n-1?'±'+TOL[S.bands[i]]+'%':S.bands[i]<=9?String(S.bands[i]):(S.bands[i]===10?'0,1':'0,01'),x,cy+72,{font:'bold 14px system-ui',col:i===S.sel&&S.mode!=='chal'?k.pa:k.ink});
    TEC.txt(c,lbl(S.bands[i]),x,cy+92,{font:'12px system-ui',col:k.muted});
    TEC.txt(c,i<n-2?(n===4?['1','2'][i]:['1','2','3'][i]):(i===n-2?'×':'±'),x,cy-64,{font:'bold 13px system-ui',col:k.muted});
  });
  const v=val(S.bands,n),hid=S.mode==='chal'&&!S.shown;
  TEC.txt(c,hid?'? Ω':fmtR(v.R)+'  ±'+(v.tol)+' %',W/2,H-22,{font:'bold 22px system-ui',col:k.ink});
}
