<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrons amb mistos</title>
<meta name="description" content="Patrons amb mistos: construeix figures que creixen, omple la taula, prediu figures llunyanes i troba l'expressió general en n. Iniciació a l'àlgebra per a 1r i 2n d'ESO.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
/* Patrons amb mistos: escenari de paper quadriculat a l'esquerra, quadern (taula, predicció, fórmula) a la dreta */
:root{--grid:rgba(35,80,200,.09); --head:#c8321f; --wood:#c4955a; --wood-edge:#94683a;
  --c1:#2350c8; --c2:#c77d0a; --c3:#1d8a4e; --bad:#b3261e}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --grid:rgba(118,162,255,.09); --head:#ff5b3d; --wood:#d6a868; --wood-edge:#a87b3f;
  --c1:#76a2ff; --c2:#f0b24a; --c3:#4cd08a; --bad:#ff8a7d }}
.pats{display:flex;flex-wrap:wrap;gap:8px}
.pats button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.pats button:hover{border-color:var(--muted)}
.pats button[aria-pressed="true"]{border-color:var(--pa);background:var(--pa);color:var(--panel)}
.pats button:focus-visible{outline:2px solid var(--pa);outline-offset:2px}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--head);color:#fff;border-radius:4px;padding:1px 6px}
.board{position:relative;padding:12px;background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.board svg{display:block;width:100%;height:clamp(220px,42vh,400px)}
.count{position:absolute;top:10px;left:14px;display:flex;align-items:baseline;gap:8px;pointer-events:none}
.count b{font-family:var(--f-display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums;color:var(--head)}
.count span{color:var(--muted);font-weight:600}
.figlabel{position:absolute;top:14px;right:16px;font-family:var(--f-display);font-size:22px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .k{font-weight:600;color:var(--muted);margin-right:2px}
.stepper button{width:40px;height:40px;font-size:20px;font-weight:700;padding:0}
.stepper output{min-width:2.4ch;text-align:center;font-family:var(--f-num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px;border-top:1px dashed var(--line);font-size:17px;font-variant-numeric:tabular-nums;min-height:56px}
.sum .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.mc{display:inline-block;min-width:1.9em;text-align:center;padding:1px 7px;border-radius:6px;font-weight:700;color:#fff}
.mc.g0{background:var(--wood-edge)} .mc.m1{background:var(--c1)} .mc.m2{background:var(--c2)} .mc.m3{background:var(--c3)}
.mc.plain{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sum .eq{font-weight:700}
.side{display:grid;gap:16px;min-width:0;background:none;border:0;padding:0;border-radius:0}
.tw{overflow-x:auto}
.ptab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.ptab th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.ptab td{text-align:center;padding:5px 6px;border-bottom:1px solid var(--line);font-family:var(--f-num)}
.ptab tr.cur td{background:var(--chip);font-weight:700}
.ptab tr.next td{color:var(--muted)}
.ptab td.diff{color:var(--c1);font-weight:700}
.irow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.irow input{font:inherit;font-size:17px;font-weight:600;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--stage);color:var(--ink);min-width:0;flex:1 1 130px}
.fb{font-weight:600;min-height:1.4em;margin:0}
.card p.fb.ok{color:var(--ok)} .card p.fb.bad{color:var(--bad)}
.sol{border-left:4px solid var(--head);padding:6px 10px;background:var(--stage);border-radius:0 8px 8px 0;display:grid;gap:4px}
.sol[hidden]{display:none}
.sol .f{font-family:var(--f-display);font-size:24px;line-height:1.15}
.m-in{transform-box:fill-box;transform-origin:center}
.m-in.anim{opacity:0;animation:drop .38s cubic-bezier(.2,.8,.3,1.2) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-18px) rotate(-8deg) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.m-in.anim{animation:none;opacity:1}}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <nav class="pats" id="pats" data-i18n-aria="aria_pats" aria-label="">
    <button type="button" data-p="squares"><span data-i18n="p_squares"></span></button>
    <button type="button" data-p="triangles"><span data-i18n="p_triangles"></span></button>
    <button type="button" data-p="houses"><span data-i18n="p_houses"></span></button>
    <button type="button" data-p="double"><span data-i18n="p_double"></span></button>
    <button type="button" data-p="loose"><span data-i18n="p_loose"></span></button>
    <button type="button" data-p="grid"><span data-i18n="p_grid"></span> <span class="tag" data-i18n="challenge"></span></button>
  </nav>

  <main class="app">
    <section class="stage-card">
      <div class="bar">
        <div class="stepper">
          <span class="k" data-i18n="figure"></span>
          <button type="button" class="btn" id="minus" aria-label="−1">−</button>
          <output id="nOut">3</output>
          <button type="button" class="btn" id="plus" aria-label="+1">+</button>
        </div>
        <button type="button" class="btn primary" id="build" data-i18n="build"></button>
        <label class="check sp"><input type="checkbox" id="struct" checked><span data-i18n="structure"></span></label>
      </div>
      <div class="board" aria-live="polite">
        <div class="count"><b id="count">10</b><span data-i18n="matches"></span></div>
        <div class="figlabel" id="figlabel"></div>
        <svg id="svg" preserveAspectRatio="xMidYMid meet" role="img"></svg>
      </div>
      <div class="sum" id="sum"></div>
    </section>

    <aside class="side">
      <section class="card">
        <h2><small data-i18n="s1"></small><span data-i18n="tableT"></span></h2>
        <div class="tw"><table class="ptab" id="table"></table></div>
      </section>
      <section class="card">
        <h2><small data-i18n="s2"></small><span data-i18n="predictT"></span></h2>
        <p id="predQ"></p>
        <div class="irow">
          <input type="number" id="predIn" inputmode="numeric" data-i18n-aria="aria_pred" aria-label="">
          <button type="button" class="btn primary" id="predCheck" data-i18n="check"></button>
          <button type="button" class="btn" id="predNew" data-i18n="another"></button>
        </div>
        <p class="fb" id="predFb"></p>
      </section>
      <section class="card">
        <h2><small data-i18n="s3"></small><span data-i18n="formulaT"></span></h2>
        <p data-i18n="formulaQ"></p>
        <div class="irow">
          <input type="text" id="formIn" autocomplete="off" spellcheck="false" aria-label="f(n)">
          <button type="button" class="btn primary" id="formCheck" data-i18n="check"></button>
        </div>
        <p class="fb" id="formFb"></p>
        <div><button type="button" class="btn" id="reveal" data-i18n="reveal"></button></div>
        <div class="sol" id="sol" hidden><div class="f" id="solF"></div><p id="solE"></p></div>
      </section>
      <p class="note" data-i18n="foot"></p>
    </aside>
  </main>

  <!--@RAONA@-->
  <!--@FOOTER@-->
</div>

const E=id=>document.getElementById(id);
const H3=Math.sqrt(3)/2;
const PAT={
  squares:{f:n=>3*n+1, formula:'3n + 1', lin:[1,3],
    seg(n){const s=[{a:[0,1],b:[0,0],g:0}];for(let k=1;k<=n;k++)s.push({a:[k-1,0],b:[k,0],g:k},{a:[k,0],b:[k,1],g:k},{a:[k,1],b:[k-1,1],g:k});return s;}},
  triangles:{f:n=>2*n+1, formula:'2n + 1', lin:[1,2],
    seg(n){const s=[{a:[0,H3],b:[0.5,0],g:0}];for(let k=1;k<=n;k++){const i=Math.floor((k-1)/2);
      if(k%2)s.push({a:[i,H3],b:[i+1,H3],g:k},{a:[i+1,H3],b:[i+0.5,0],g:k});
      else s.push({a:[i+0.5,0],b:[i+1.5,0],g:k},{a:[i+1.5,0],b:[i+1,H3],g:k});}return s;}},
  houses:{f:n=>5*n+1, formula:'5n + 1', lin:[1,5],
    seg(n){const y1=H3,y2=H3+1,s=[{a:[0,y2],b:[0,y1],g:0}];for(let k=1;k<=n;k++)
      s.push({a:[k-1,y2],b:[k,y2],g:k},{a:[k,y2],b:[k,y1],g:k},{a:[k,y1],b:[k-1,y1],g:k},{a:[k-1,y1],b:[k-0.5,0],g:k},{a:[k-0.5,0],b:[k,y1],g:k});return s;}},
  double:{f:n=>5*n+2, formula:'5n + 2', lin:[2,5],
    seg(n){const s=[{a:[0,1],b:[0,0],g:0},{a:[0,2],b:[0,1],g:0}];for(let k=1;k<=n;k++)
      s.push({a:[k-1,0],b:[k,0],g:k},{a:[k,0],b:[k,1],g:k},{a:[k-1,1],b:[k,1],g:k},{a:[k,1],b:[k,2],g:k},{a:[k,2],b:[k-1,2],g:k});return s;}},
  loose:{f:n=>4*n, formula:'4n', lin:[0,4],
    seg(n){const s=[];for(let k=1;k<=n;k++){const x=(k-1)*1.35;
      s.push({a:[x,0],b:[x+1,0],g:k},{a:[x+1,0],b:[x+1,1],g:k},{a:[x+1,1],b:[x,1],g:k},{a:[x,1],b:[x,0],g:k});}return s;}},
  grid:{f:n=>2*n*(n+1), formula:'2n(n + 1) = 2n² + 2n', lin:null,
    seg(n){const s=[];for(let j=0;j<=n;j++)for(let i=0;i<n;i++)s.push({a:[i,j],b:[i+1,j],g:Math.max(i+1,j)});
      for(let i=0;i<=n;i++)for(let j=0;j<n;j++)s.push({a:[i,j+1],b:[i,j],g:Math.max(i,j+1)});
      s.sort((p,q)=>p.g-q.g);return s;}}
};
const NMAX=10, NMIN=1, NS='http://www.w3.org/2000/svg';
let pid='squares', n=3, structure=true, timers=[], predN=10, solShown=false;
const pat=()=>PAT[pid];
const modCls=g=>g===0?'g0':'m'+(((g-1)%3)+1);
const colorOf=g=>!structure||g===0?'var(--wood)':'var(--c'+(((g-1)%3)+1)+')';

function draw(mode,prevN){
  timers.forEach(clearTimeout); timers=[];
  const segs=pat().seg(n), svg=E('svg'), U=100;
  const xs=[],ys=[]; segs.forEach(s=>{xs.push(s.a[0],s.b[0]);ys.push(s.a[1],s.b[1]);});
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=Math.max(x1-x0,4),cx=(x0+x1)/2; x0=cx-w/2; x1=cx+w/2;
  const h=Math.max(y1-y0,2.4),cy=(y0+y1)/2; y0=cy-h/2; y1=cy+h/2;
  const pad=0.45;
  svg.setAttribute('viewBox',[(x0-pad)*U,(y0-pad*1.6)*U,(x1-x0+2*pad)*U,(y1-y0+pad*2.2)*U].join(' '));
  svg.textContent='';
  const anim=[]; segs.forEach((s,i)=>{if(mode==='build'||(mode==='grow'&&s.g>prevN))anim.push(i);});
  const step=anim.length?Math.min(120,3600/anim.length):0, order=new Map(anim.map((i,k)=>[i,k]));
  segs.forEach((s,i)=>{
    const ax=s.a[0]*U,ay=s.a[1]*U,bx=s.b[0]*U,by=s.b[1]*U,len=Math.hypot(bx-ax,by-ay),ang=Math.atan2(by-ay,bx-ax)*180/Math.PI,gap=7;
    const g=document.createElementNS(NS,'g'); g.setAttribute('transform',`translate(${ax} ${ay}) rotate(${ang})`);
    const inner=document.createElementNS(NS,'g'); inner.setAttribute('class','m-in');
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',gap);r.setAttribute('y',-4.5);r.setAttribute('width',len-2*gap);r.setAttribute('height',9);r.setAttribute('rx',2.5);
    r.setAttribute('style',`fill:${colorOf(s.g)};stroke:var(--wood-edge);stroke-width:1`);
    const hd=document.createElementNS(NS,'ellipse');
    hd.setAttribute('cx',len-gap-6);hd.setAttribute('cy',0);hd.setAttribute('rx',10);hd.setAttribute('ry',7.5);hd.setAttribute('style','fill:var(--head)');
    inner.append(r,hd); g.appendChild(inner); svg.appendChild(g);
    if(order.has(i)){inner.classList.add('anim');inner.style.animationDelay=(order.get(i)*step)+'ms';}
  });
  const total=segs.length, already=total-anim.length, cEl=E('count');
  svg.setAttribute('aria-label',t('figAria',{n,v:total}));
  if(REDUCE||!anim.length) cEl.textContent=total;
  else{cEl.textContent=already; anim.forEach((_,k)=>timers.push(setTimeout(()=>{cEl.textContent=already+k+1;},k*step+180)));}
  renderInfo();
}

function renderInfo(){
  const P=pat();
  E('nOut').textContent=n; E('figlabel').textContent=t('figure')+' '+n;
  E('minus').disabled=n<=NMIN; E('plus').disabled=n>=NMAX;
  const cnt={}; P.seg(n).forEach(s=>{cnt[s.g]=(cnt[s.g]||0)+1;});
  const sum=E('sum'); sum.textContent='';
  const add=(cls,txt)=>{const e=document.createElement('span'); if(cls)e.className=cls; e.textContent=txt; sum.appendChild(e);};
  add('k',t('count'));
  const mods=Object.keys(cnt).map(Number).filter(g=>g>0).sort((a,b)=>a-b);
  let first=true;
  if(cnt[0]){add('mc '+(structure?'g0':'plain'),cnt[0]);first=false;}
  const show=mods.length<=6?mods:[mods[0],mods[1],null,mods[mods.length-1]];
  show.forEach(g=>{if(!first)add('','+');first=false; if(g===null)add('','…'); else add('mc '+(structure?modCls(g):'plain'),cnt[g]);});
  add('eq', P.lin ? ' = '+(P.lin[0]?P.lin[0]+' + ':'')+P.lin[1]+'·'+n+' = '+P.f(n) : ' = '+P.f(n));
  const tb=E('table'); tb.textContent='';
  const hr=tb.insertRow(); [t('colN'),t('colV'),t('colD')].forEach(x=>{const th=document.createElement('th');th.textContent=x;hr.appendChild(th);});
  for(let i=Math.max(1,n-6);i<=n+1;i++){const r=tb.insertRow(); if(i===n)r.className='cur'; if(i===n+1)r.className='next';
    r.insertCell().textContent=i;
    r.insertCell().textContent=i<=n?P.f(i):'?';
    const c=r.insertCell(); c.className='diff'; c.textContent=(i>1&&i<=n)?'+'+(P.f(i)-P.f(i-1)):(i===n+1?'?':'—');}
  $$('#pats button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===pid)));
  E('predQ').textContent=t('predQ',{N:predN});
  E('reveal').textContent=solShown?t('hide'):t('reveal'); E('sol').hidden=!solShown;
  E('solF').textContent='f(n) = '+P.formula; E('solE').textContent=t('e_'+pid);
}

function newPred(){const o=[10,12,15,20,25,30,50,100];let v;do{v=o[Math.floor(Math.random()*o.length)];}while(v===predN);predN=v;E('predIn').value='';E('predFb').textContent='';renderInfo();}
function checkPred(){
  const fb=E('predFb'),v=E('predIn').value.trim();
  if(v===''){fb.className='fb bad';fb.textContent=t('predEmpty');return;}
  const ok=Number(v)===pat().f(predN);
  fb.className='fb '+(ok?'ok':'bad'); fb.textContent=ok?t('predOk',{N:predN,V:pat().f(predN)}):t('predBad');
}
function parse(str){
  let s=str.toLowerCase().replace(/\s+/g,'').replace(/[·×]/g,'*').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.');
  if(!s||!/^[0-9n+\-*\/^().]+$/.test(s))return null;
  s=s.replace(/(\d|\)|n)(?=n|\()/g,'$1*').replace(/n(?=\d)/g,'n*').replace(/\)(?=\d)/g,')*').replace(/\^/g,'**');
  try{const fn=new Function('n','"use strict";return ('+s+');');const v=fn(2);if(typeof v!=='number'||!isFinite(v))return null;return fn;}catch(e){return null;}
}
function checkForm(){
  const fb=E('formFb'),fn=parse(E('formIn').value);
  if(!fn){fb.className='fb bad';fb.textContent=t('formSyntax');return;}
  for(let i=1;i<=12;i++){const g=fn(i),v=pat().f(i);
    if(!isFinite(g)||Math.abs(g-v)>1e-9){fb.className='fb bad';fb.textContent=t('formBad',{n:i,g:Math.round(g*1000)/1000,v});return;}}
  fb.className='fb ok';fb.textContent=t('formOk');
}

E('formCheck').addEventListener('click',checkForm); E('formIn').addEventListener('keydown',e=>{if(e.key==='Enter')checkForm();});
