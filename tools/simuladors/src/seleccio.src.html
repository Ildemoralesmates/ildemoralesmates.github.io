<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selecció natural</title>
<meta name="description" content="Simulador de selecció natural: una població d'escarabats amb color heretable, depredadors que veuen millor els menys camuflats, i generacions que s'adapten a l'entorn.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:8px;align-items:start;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--muted);transition:background .2s,border-color .2s}
.steps li b{display:block;color:var(--ink);font-weight:600}
.steps li i{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--chip);font-style:normal;font-weight:700;font-size:13px;color:var(--ink)}
.steps li.on{border-color:var(--pa);background:color-mix(in srgb,var(--pa) 10%,var(--panel))}
.steps li.on i{background:var(--pa);color:var(--panel)}
.cap{font-family:var(--f-num);font-size:13px}
.pill:empty{display:none}
.stage canvas.manual{cursor:crosshair}
ol.q{margin:0;padding-left:1.2em;color:var(--muted);font-size:14px;display:grid;gap:5px}
ol.q b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main class="app">
    <section class="stage-card" data-i18n-aria="aria.sim" aria-label="">
      <div class="bar">
        <button id="next" class="btn primary" type="button" data-i18n="next"></button>
        <button id="auto" class="btn" type="button"></button>
        <button id="reset" class="btn" type="button" data-i18n="reset"></button>
        <span class="pill" id="genPill"></span>
        <span class="pill sp cap" id="capPill"></span>
      </div>
      <div class="stage"><canvas id="cv" data-i18n-aria="aria.cv" aria-label=""></canvas></div>
    </section>

    <aside class="panel" data-i18n-aria="aria.ctl" aria-label="">
      <fieldset>
        <legend data-i18n="f.env"></legend>
        <div class="chips" id="envChips"></div>
        <div id="ctlEnv" style="display:grid;gap:10px"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="f.pred"></legend>
        <div class="seg" id="modeSeg" role="group">
          <button type="button" data-m="auto" data-i18n="m.auto"></button>
          <button type="button" data-m="manual" data-i18n="m.manual"></button>
        </div>
        <div id="ctlPred" style="display:grid;gap:10px"></div>
        <p class="note" id="predHelp"></p>
      </fieldset>
      <fieldset>
        <legend data-i18n="f.pop"></legend>
        <div id="ctlPop" style="display:grid;gap:10px"></div>
      </fieldset>
    </aside>
  </main>

  <section class="cards">
    <article class="card">
      <h2><small data-i18n="c1.s"></small><span data-i18n="c1.h"></span></h2>
      <ol class="steps" id="steps">
        <li data-s="1"><i>1</i><span><b data-i18n="st1.h"></b><span data-i18n="st1.p"></span></span></li>
        <li data-s="2"><i>2</i><span><b data-i18n="st2.h"></b><span data-i18n="st2.p"></span></span></li>
        <li data-s="3"><i>3</i><span><b data-i18n="st3.h"></b><span data-i18n="st3.p"></span></span></li>
      </ol>
      <dl>
        <dt data-i18n="d.gen"></dt><dd id="dGen" class="hl"></dd>
        <dt data-i18n="d.mean"></dt><dd id="dMean"></dd>
        <dt data-i18n="d.sd"></dt><dd id="dSd"></dd>
        <dt data-i18n="d.cap"></dt><dd id="dCap"></dd>
        <dt data-i18n="d.sur"></dt><dd id="dSur"></dd>
      </dl>
    </article>

    <article class="card">
      <h2><small data-i18n="c2.s"></small><span data-i18n="c2.h"></span></h2>
      <div class="plot"><canvas id="hist" data-i18n-aria="c2.aria" aria-label=""></canvas></div>
      <div class="legend"><span><i class="sw" style="background:var(--pa)"></i><span data-i18n="lg.bg"></span></span><span><i class="sw" style="background:var(--pb)"></i><span data-i18n="lg.mean"></span></span></div>
    </article>

    <article class="card">
      <h2><small data-i18n="c3.s"></small><span data-i18n="c3.h"></span></h2>
      <div class="plot"><canvas id="evo" data-i18n-aria="c3.aria" aria-label=""></canvas></div>
      <p class="note" data-i18n="c3.note"></p>
    </article>

    <article class="card">
      <h2><small data-i18n="c4.s"></small><span data-i18n="c4.h"></span></h2>
      <ol class="q" data-i18n-html="c4.l"></ol>
      <p class="note" data-i18n="c4.note"></p>
    </article>
  </section>

  <!--@RAONA@-->
  <!--@FOOTER@-->
</div>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@RAONA_JS@*/

var READY=false;
const W=760,H=420;
const cvo=makeCanvas($('#cv'),W,H,()=>{if(READY)draw();}),ctx=cvo.ctx;
const hio=makeCanvas($('#hist'),460,250,()=>{if(READY)drawHist();}),hc=hio.ctx;
const evo=makeCanvas($('#evo'),460,250,()=>{if(READY)drawEvo();}),ec=evo.ctx;

/* ---------- estado ---------- */
const E={N:100,bg:.85,press:.4,mut:.03,speed:1,mode:'auto',gen:0,pop:[],phase:'idle',t:0,hist:[],sel:null,need:0,got:0,auto:false,wait:0,birds:null};
const Lm=v=>10+80*clamp(v,0,1);
const colOf=(v,d=0,a=1)=>'hsla(28,22%,'+clamp(Lm(v)+d,2,96)+'%,'+a+')';
function mean(a){return a.reduce((s,x)=>s+x,0)/(a.length||1);}
function sd(a){const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))));}

/* ---------- escorça (capa en caché) ---------- */
const bark=document.createElement('canvas');bark.width=W*2;bark.height=H*2;
const bkc=bark.getContext('2d');bkc.scale(2,2);
let TEX=null;
function makeTex(){
  const rnd=(()=>{let s=12345;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};})();
  TEX={blobs:[],furr:[]};
  for(let i=0;i<650;i++)TEX.blobs.push({x:rnd()*W,y:rnd()*H,r:3+rnd()*13,dv:(rnd()-.5)*.14});
  for(let i=0;i<16;i++){const pts=[];let x=rnd()*W;for(let y=-10;y<=H+10;y+=14){x+=(rnd()-.5)*9;pts.push([x,y]);}TEX.furr.push({pts,dv:-.05-rnd()*.08});}
}
function renderBark(){
  if(!TEX)makeTex();
  const c=bkc;c.fillStyle=colOf(E.bg);c.fillRect(0,0,W,H);
  TEX.blobs.forEach(b=>{c.fillStyle=colOf(E.bg+b.dv,0,.55);c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill();});
  c.lineCap='round';
  TEX.furr.forEach(f=>{c.strokeStyle=colOf(E.bg+f.dv,0,.7);c.lineWidth=2.4;c.beginPath();f.pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();});
}

/* ---------- población ---------- */
function place(n){
  const pts=[];
  for(let i=0;i<n;i++){
    let best=null,bd=-1;
    for(let k=0;k<14;k++){
      const q={x:22+Math.random()*(W-44),y:22+Math.random()*(H-44)};
      let d=1e9;for(const p of pts){const dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<d)d=dd;if(d<bd)break;}
      if(d>bd){bd=d;best=q;}
      if(bd>26)break;
    }
    best.a=Math.random()*TAU;pts.push(best);
  }
  return pts;
}
function makePop(cs){
  const pts=place(cs.length);
  return cs.map((c,i)=>({c,x:pts[i].x,y:pts[i].y,a:pts[i].a,fade:1,state:'ok',d:0}));
}
function initPop(){
  const cs=[];for(let i=0;i<E.N;i++)cs.push(clamp(.5+randn()*.17,0,1));
  E.pop=makePop(cs);E.gen=0;E.phase='idle';E.t=0;E.hist=[];E.sel=null;E.need=0;E.got=0;E.wait=0;E.birds=null;
  pushHist();
}
function pushHist(){const cs=E.pop.map(p=>p.c);E.hist.push({g:E.gen,m:mean(cs),s:sd(cs),bg:E.bg});}
function quota(){return Math.min(Math.round(E.press*E.N),E.N-2);}

/* ---------- ciclo ---------- */
function startGen(){
  if(E.phase!=='idle')return;
  const K=quota();E.need=K;E.got=0;E.sel={cap:[],sur:[],K};
  if(K<=0){E.phase='eat';E.t=0;E.eatTotal=0;return;}
  if(E.mode==='manual'){E.phase='manual';return;}
  /* muestreo ponderado sin reemplazo (Efraimidis–Spirakis) */
  const keys=E.pop.map((p,i)=>({i,k:Math.pow(Math.random(),1/(.03+Math.pow(Math.abs(p.c-E.bg),2)))}));
  keys.sort((a,b)=>b.k-a.k);
  keys.slice(0,K).forEach((o,j)=>{const p=E.pop[o.i];p.state='eating';p.d=j*.035/E.speed;p.fade=1;});
  E.phase='eat';E.t=0;E.eatTotal=K;
  E.birds={t:0};
}
function eatOne(p){
  p.state='eating';p.d=0;E.got++;
}
function reproduce(){
  const cap=E.pop.filter(p=>p.state==='eating'||p.state==='dead'),sur=E.pop.filter(p=>p.state==='ok');
  E.sel={cap:cap.map(p=>p.c),sur:sur.map(p=>p.c),K:E.sel?E.sel.K:0};
  const cs=[];
  for(let i=0;i<E.N;i++){const par=sur[Math.floor(Math.random()*sur.length)];cs.push(clamp(par.c+randn()*E.mut,0,1));}
  E.pop=makePop(cs);E.pop.forEach(p=>{p.fade=0;p.state='born';});
  E.phase='born';E.t=0;E.birds=null;
}
function tick(dt){
  const sp=E.speed;
  E.t+=dt;
  if(E.birds)E.birds.t+=dt;
  if(E.phase==='eat'||E.phase==='manual'){
    let anyEating=false;
    E.pop.forEach(p=>{
      if(p.state==='eating'){
        if(p.d>0)p.d-=dt;else{p.fade-=dt*2.2*sp;if(p.fade<=0){p.fade=0;p.state='dead';}}
        anyEating=anyEating||p.state==='eating';
      }
    });
    if(E.phase==='manual'&&E.got>=E.need&&!anyEating){E.phase='eat';E.t=0;}
    else if(E.phase==='eat'&&!anyEating&&E.t>.35/sp){reproduce();}
  }else if(E.phase==='born'){
    E.pop.forEach(p=>{p.fade=Math.min(1,p.fade+dt*1.8*sp);});
    if(E.t>.7/sp){E.pop.forEach(p=>{p.state='ok';p.fade=1;});E.gen++;pushHist();E.phase='idle';E.t=0;E.wait=0;renderStats();drawHist();drawEvo();}
  }else if(E.phase==='idle'&&E.auto){
    E.wait+=dt;if(E.wait>.55/sp)startGen();
  }
}

/* ---------- dibujo ---------- */
function beetle(c,x,y,a,v,al,sc){
  c.save();c.translate(x,y);c.rotate(a);c.scale(sc,sc);c.globalAlpha=al;
  const dk=colOf(v,-16,.9);
  c.strokeStyle=dk;c.lineWidth=1.3;c.lineCap='round';
  for(const dx of [-4,0,4]){c.beginPath();c.moveTo(dx,-4);c.lineTo(dx+1.5,-10);c.moveTo(dx,4);c.lineTo(dx+1.5,10);c.stroke();}
  c.fillStyle=colOf(v);c.strokeStyle=colOf(v,-14,.9);c.lineWidth=1;
  c.beginPath();c.ellipse(0,0,10.5,6.3,0,0,TAU);c.fill();c.stroke();
  c.beginPath();c.arc(10,0,3.6,0,TAU);c.fill();c.stroke();
  c.strokeStyle=colOf(v,-12,.7);c.beginPath();c.moveTo(-9,0);c.lineTo(8,0);c.stroke();
  c.restore();
}
function bird(c,x,y,s,col){
  c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.beginPath();
  c.moveTo(-26,-6);c.quadraticCurveTo(-12,-18,0,0);c.quadraticCurveTo(12,-18,26,-6);c.quadraticCurveTo(12,-3,3,6);c.lineTo(0,14);c.lineTo(-3,6);c.quadraticCurveTo(-12,-3,-26,-6);c.fill();c.restore();
}
function draw(){
  const c=ctx,col=C();
  c.drawImage(bark,0,0,W,H);
  const manual=E.phase==='manual';
  E.pop.forEach(p=>{
    const al=p.state==='born'?p.fade:p.state==='eating'?Math.max(p.fade,0):1;
    if(p.state==='dead')return;
    beetle(c,p.x,p.y,p.a,p.c,al,1);
    if(p.state==='eating'&&p.d<=0){
      c.strokeStyle='rgba(214,58,74,'+(.9*p.fade)+')';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,10+(1-p.fade)*14,0,TAU);c.stroke();
    }
  });
  if(E.birds&&E.phase==='eat'){
    const u=clamp(E.birds.t/1.2,0,1.4);
    bird(c,lerp(-40,W+60,u/1.4),lerp(40,200,Math.sin(u*2))+Math.sin(E.birds.t*14)*4,1,'rgba(20,24,40,.55)');
  }
  if(manual){c.fillStyle='rgba(20,24,40,.62)';rrect(c,10,H-34,250,24,6);c.fill();c.fillStyle='#fff';c.font='600 12.5px system-ui';c.textAlign='left';c.fillText(t('cap',{a:E.got,k:E.need}),20,H-17);}
  $('#cv').classList.toggle('manual',manual);
}
function axes(c,w,h,m,xl,yl,yt,xt){
  const col=C();c.strokeStyle=col.line;c.lineWidth=1;c.fillStyle=col.muted;c.font='11px ui-monospace,Menlo,monospace';
  c.textAlign='right';yt.forEach(([v,y])=>{c.beginPath();c.moveTo(m.l,y);c.lineTo(w-m.r,y);c.stroke();c.fillText(v,m.l-5,y+4);});
  c.textAlign='center';xt.forEach(([v,x])=>c.fillText(v,x,h-m.b+14));
  c.strokeStyle=col.ink;c.lineWidth=1.5;c.beginPath();c.moveTo(m.l,m.t);c.lineTo(m.l,h-m.b);c.lineTo(w-m.r,h-m.b);c.stroke();
  c.fillStyle=col.ink;c.font='12px system-ui';c.textAlign='center';c.fillText(xl,(m.l+w-m.r)/2,h-4);
  c.save();c.translate(11,(m.t+h-m.b)/2);c.rotate(-Math.PI/2);c.fillText(yl,0,0);c.restore();
}
function drawHist(){
  const c=hc,w=460,h=250,m={l:52,r:10,t:12,b:38},col=C();
  c.fillStyle=col.panel;c.fillRect(0,0,w,h);
  const B=20,cnt=new Array(B).fill(0);E.pop.forEach(p=>{cnt[Math.min(B-1,Math.floor(p.c*B))]++;});
  const fr=cnt.map(x=>x/Math.max(1,E.pop.length)),ymax=Math.max(.2,Math.ceil(Math.max(...fr)*12)/10);
  const X=v=>m.l+v*(w-m.l-m.r),Y=f=>h-m.b-f/ymax*(h-m.t-m.b);
  axes(c,w,h,m,'color (0 = '+(LANG==='ca'?'fosc':'oscuro')+' · 1 = '+(LANG==='ca'?'clar':'claro')+')',(LANG==='ca'?'fracció':'fracción'),
    [0,.25,.5,.75,1].map(k=>[fmt(k*ymax,2),Y(k*ymax)]),[0,.25,.5,.75,1].map(v=>[fmt(v,2),X(v)]));
  fr.forEach((f,i)=>{c.fillStyle=colOf((i+.5)/B);c.strokeStyle=col.muted;c.lineWidth=.8;const x=X(i/B),bw=(w-m.l-m.r)/B-1;c.fillRect(x+.5,Y(f),bw,h-m.b-Y(f));c.strokeRect(x+.5,Y(f),bw,h-m.b-Y(f));});
  c.lineWidth=2.4;c.strokeStyle=col.pa;c.beginPath();c.moveTo(X(E.bg),m.t);c.lineTo(X(E.bg),h-m.b);c.stroke();
  const mu=mean(E.pop.map(p=>p.c));c.setLineDash([5,4]);c.strokeStyle=col.pb;c.beginPath();c.moveTo(X(mu),m.t);c.lineTo(X(mu),h-m.b);c.stroke();c.setLineDash([]);
}
function drawEvo(){
  const c=ec,w=460,h=250,m={l:52,r:12,t:12,b:38},col=C();
  c.fillStyle=col.panel;c.fillRect(0,0,w,h);
  const gmax=Math.max(20,E.gen),X=g=>m.l+g/gmax*(w-m.l-m.r),Y=v=>h-m.b-v*(h-m.t-m.b);
  const step=gmax<=25?5:gmax<=60?10:gmax<=150?25:50,xt=[];for(let g=0;g<=gmax;g+=step)xt.push([g,X(g)]);
  axes(c,w,h,m,(LANG==='ca'?'generació':'generación'),'color',[0,.25,.5,.75,1].map(v=>[fmt(v,2),Y(v)]),xt);
  const hs=E.hist;
  c.fillStyle=col.dark?'rgba(118,162,255,.2)':'rgba(35,80,200,.14)';c.beginPath();
  hs.forEach((p,i)=>i?c.lineTo(X(p.g),Y(clamp(p.m+p.s,0,1))):c.moveTo(X(p.g),Y(clamp(p.m+p.s,0,1))));
  for(let i=hs.length-1;i>=0;i--)c.lineTo(X(hs[i].g),Y(clamp(hs[i].m-hs[i].s,0,1)));c.closePath();c.fill();
  c.setLineDash([5,4]);c.strokeStyle=col.pb;c.lineWidth=2;c.beginPath();
  hs.forEach((p,i)=>{if(i){c.lineTo(X(p.g),Y(hs[i-1].bg));}else c.moveTo(X(p.g),Y(p.bg));c.lineTo(X(p.g),Y(p.bg));});
  c.lineTo(X(E.gen),Y(E.bg));c.stroke();c.setLineDash([]);
  c.strokeStyle=col.pa;c.lineWidth=2.4;c.beginPath();hs.forEach((p,i)=>i?c.lineTo(X(p.g),Y(p.m)):c.moveTo(X(p.g),Y(p.m)));c.stroke();
  const l=hs[hs.length-1];c.fillStyle=col.pa;c.beginPath();c.arc(X(l.g),Y(l.m),4,0,TAU);c.fill();
}
function renderStats(){
  const cs=E.pop.map(p=>p.c);
  $('#dGen').textContent=E.gen;$('#dMean').textContent=fmt(mean(cs),2);$('#dSd').textContent=fmt(sd(cs),3);
  $('#dCap').textContent=E.sel&&E.sel.cap.length?fmt(mean(E.sel.cap),2)+' ('+E.sel.cap.length+')':'—';
  $('#dSur').textContent=E.sel&&E.sel.sur.length?fmt(mean(E.sel.sur),2)+' ('+E.sel.sur.length+')':'—';
  $('#genPill').textContent=t('gen',{g:E.gen});
  $$('#steps li').forEach(li=>{const s=+li.dataset.s,ph=E.phase;li.classList.toggle('on',(s===1&&ph==='idle')||(s===2&&(ph==='eat'||ph==='manual'))||(s===3&&ph==='born'));});
  $('#capPill').textContent=(E.phase==='manual'||E.phase==='eat')&&E.need?t('cap',{a:E.mode==='manual'?E.got:Math.min(E.need,E.pop.filter(p=>p.state!=='ok').length),k:E.need}):'';
}

/* ---------- interfaz ---------- */
const sE=$('#ctlEnv'),sP=$('#ctlPred'),sN=$('#ctlPop');
const SL={};
SL.bg=slider(sE,{id:'sBg',key:'bg',min:0,max:1,step:.01,val:E.bg,fmtv:v=>fmt(v,2),on:v=>{E.bg=v;renderBark();draw();drawHist();syncEnv();}});
SL.press=slider(sP,{id:'sPr',key:'press',min:0,max:70,step:1,val:40,fmtv:v=>v+' %',on:v=>{E.press=v/100;}});
SL.N=slider(sN,{id:'sN',key:'N',min:20,max:300,step:10,val:E.N,on:v=>{E.N=v;initPop();refresh();}});
SL.mut=slider(sN,{id:'sMu',key:'mut',min:0,max:.15,step:.005,val:E.mut,fmtv:v=>fmt(v,3),on:v=>{E.mut=v;}});
SL.speed=slider(sN,{id:'sSp',key:'speed',min:.5,max:4,step:.25,val:1,fmtv:v=>'×'+fmt(v,2),on:v=>{E.speed=v;}});
const ENVS=[['env.clean',.85],['env.dirty',.15]];
function buildEnv(){
  const h=$('#envChips');h.innerHTML='';
  ENVS.forEach(([k,v])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.v=v;b.textContent=t(k);
    b.addEventListener('click',()=>{E.bg=v;SL.bg.set(v);renderBark();draw();drawHist();syncEnv();});h.appendChild(b);});
  syncEnv();
}
function syncEnv(){$$('#envChips .chip').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(+b.dataset.v-E.bg)<.005)));}
$$('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{
  if(E.phase!=='idle')return;E.mode=b.dataset.m;
  $$('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  $('#predHelp').textContent=t('help.'+E.mode);
}));
$('#next').addEventListener('click',()=>startGen());
$('#auto').addEventListener('click',()=>{E.auto=!E.auto;E.wait=0;setAuto();});
$('#reset').addEventListener('click',()=>{initPop();refresh();});
function setAuto(){$('#auto').textContent=E.auto?t('pause'):t('auto');$('#auto').setAttribute('aria-pressed',String(E.auto));}
$('#cv').addEventListener('pointerdown',ev=>{
  if(E.phase!=='manual')return;
  const q=cvo.pt(ev);let best=null,bd=17;
  E.pop.forEach(p=>{if(p.state!=='ok')return;const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best=p;}});
  if(best&&E.got<E.need)eatOne(best);
});
function refresh(){renderBark();renderStats();draw();drawHist();drawEvo();}
document.addEventListener('langchange',()=>{Object.values(SL).forEach(s=>s.refresh());buildEnv();setAuto();$('#predHelp').textContent=t('help.'+E.mode);renderStats();drawHist();drawEvo();});
document.addEventListener('themechange',()=>{draw();drawHist();drawEvo();});

let last=performance.now(),sc=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  tick(dt);draw();
  sc+=dt;if(sc>.12){sc=0;renderStats();}
  requestAnimationFrame(frame);
}
/* ===== Raona-ho ===== */
function load(bg,pr,mu,n){
  E.auto=false;setAuto();E.mode='auto';
  $$('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m==='auto')));
  $('#predHelp').textContent=t('help.auto');
  E.bg=bg;SL.bg.set(bg);E.press=pr/100;SL.press.set(pr);E.mut=mu;SL.mut.set(mu);E.N=n;SL.N.set(n);
  initPop();syncEnv();refresh();RZ.show($('#cv'));}
const okP=p=>Number.isInteger(p)&&p>=0&&p<=70;
RZ.init({
 F:{mean:{l:'l_mean'},cap:{l:'l_cap'},sur:{l:'l_sur'},gens:{l:'l_gens'},press:{l:'l_press',u:'%'}},
 sim:v=>load(v[0],v[1],v[2],v[3]),
 M:[
  {id:'m1',f:['mean'],sim:()=>load(.85,40,.03,100),ok:()=>({k:'m1_ok'}),
   chk:([v])=>(v>=.78&&v<=.92)?null:(v>=.4&&v<=.6)?{k:'m1_ini'}:{k:'m1_f'}},
  {id:'m2',f:['cap','sur'],sim:()=>load(.85,30,.03,200),ok:()=>({k:'m2_ok'}),
   chk:([c,sv])=>c===60&&sv===140?null:(c===140&&sv===60)?{k:'m2_sw'}:{k:'m2_f'}},
  {id:'m3',f:['gens'],sim:()=>load(.85,40,.03,100),ok:()=>({k:'m3_ok'}),
   chk:([g])=>(Number.isInteger(g)&&g>=3&&g<=15)?null:{k:'m3_f'}}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>load(.15,40,.03,100)},
  {id:'s2',ans:'D',f:['cap'],sim:()=>load(.85,40,.03,100),cxsim:()=>load(.85,0,.03,300),cxok:()=>({k:'s2.cx'}),
   cx:([v])=>v===0?null:{k:'s_cx_no'}},
  {id:'s3',ans:'S',sim:()=>load(.85,40,.03,100)},
  {id:'s4',ans:'M',sim:()=>load(.15,40,0,100)},
  {id:'s5',ans:'S',sim:()=>load(.85,40,.03,100)},
  {id:'s6',ans:'M',sim:()=>load(.85,0,.03,20)}
 ],
 E:[{id:'e1',who:1,args:[.15,40,.03,100]},{id:'e2',who:3,args:[.85,40,.03,100]},{id:'e3',who:2,args:[.85,0,.03,20]}],
 D:[
  {id:'d1',f:['press'],sim:([p])=>load(.85,okP(p)?p:40,.03,150),ok:()=>({k:'d1_ok'}),
   chk:([p])=>!okP(p)?{k:'rng'}:p===20?null:{k:'d1_no',p:[p,Math.round(p*1.5)]}},
  {id:'d2',f:['press'],sim:([p])=>load(.85,okP(p)?p:40,.03,200),ok:()=>({k:'d2_ok'}),
   chk:([p])=>!okP(p)?{k:'rng'}:p===50?null:p>50?{k:'d2_hi',p:[p,200-Math.round(p*2)]}:{k:'d2_lo',p:[p,200-Math.round(p*2)]}},
  {id:'d3',chips:{vals:[0,20,40],fmt:x=>x+' %'},sim:([p])=>load(.85,p,.03,20),ok:()=>({k:'d3_ok'}),
   chk:([p])=>p===0?null:{k:'d3_no',p:[p]}}
 ]
});
initQuiz([]);

initPop();
READY=true;
initLang();applyLang();
$$('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===E.mode)));
refresh();
requestAnimationFrame(frame);
window.__e={E,startGen,tick,reproduce,quota,initPop,refresh,eatOne};
</script>
</body>
</html>
