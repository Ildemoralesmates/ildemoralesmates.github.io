const CT=[

const gcd=(p,q)=>q?gcd(q,p%q):p,lcm=(p,q)=>p/gcd(p,q)*q;
function calc(){
  const L=inv?a.reduce(lcm,1):1,w=inv?a.map(v=>L/v):a.slice(),N=w.reduce((p,q)=>p+q,0),u=T/N;
  return {L,w,N,u,sh:w.map(v=>v*u),cells:N<=60&&Math.max(...w)<=24&&Math.max(...a)<=24};
}

function draw(){
  const ink=css('--ink'),mut=css('--muted'),line=css('--line'),PC=PCV.map(c=>css(c));
  const k=calc(),g=LG(),ut=t(cur.ut),up=t(cur.up),n=a.length;
  cx.fillStyle=css('--stage');cx.fillRect(0,0,W,H);

  const cnt=conv?k.w:a,mx=Math.max(...cnt),sq=Math.min(NARROW?16:22,(W-lw-(NARROW?70:120))/Math.max(mx,6)-3);
  a.forEach((v,i)=>{const y=y0+i*rh;

    cx.fillText(pname(i)+': '+v+(up?' '+up:''),NARROW?8:18,y+rh*0.62);

        if(inv&&!conv){cx.strokeStyle=PC[i];cx.lineWidth=1.5;cx.strokeRect(x+1,y+(rh-sq)/2,sq-2,sq-2);}
        else{cx.fillStyle=PC[i];cx.globalAlpha=.85;cx.fillRect(x,y+(rh-sq)/2,sq,sq);cx.globalAlpha=1;}}}
    if(g>=(inv?1:2)){cx.fillStyle=mut;cx.font=(NARROW?12:13.5)+'px system-ui';
      const tx=(conv?'1/'+v+' → ':'')+k.w[i]+' '+t('parts_w');
      cx.fillText(tx,k.cells?lw+cnt[i]*(sq+3)+8:lw,y+rh*0.62);}
  });
  /* la barra del total */
  const bx=NARROW?12:30,bw=W-2*bx,by=NARROW?178:206,bh=NARROW?44:52;
  cx.fillStyle=ink;cx.font='bold '+(NARROW?14:16)+'px system-ui';cx.textAlign='left';

  else{cx.fillStyle=mut;cx.globalAlpha=.28;cx.fillRect(bx,by,bw,bh);cx.globalAlpha=1;}
  if(g===3){cx.fillStyle=css('--pa');cx.globalAlpha=.8;cx.fillRect(bx,by,bw/k.N,bh);cx.globalAlpha=1;}
  if(g>=2&&k.cells){cx.strokeStyle=css('--stage');cx.lineWidth=2;cx.beginPath();for(let j=1;j<k.N;j++){const x=bx+bw*j/k.N;cx.moveTo(x,by);cx.lineTo(x,by+bh);}cx.stroke();}
  cx.strokeStyle=ink;cx.lineWidth=2;cx.strokeRect(bx,by,bw,bh);
  if(g===2||g===3){cx.fillStyle=mut;cx.font='bold '+(NARROW?13:15)+'px system-ui';cx.textAlign='right';cx.fillText(k.N+' '+t('parts_w'),bx+bw,by-10);}
  if(g===3){cx.fillStyle=css('--pa');cx.font='bold '+(NARROW?14:16)+'px system-ui';cx.textAlign='left';
    cx.fillText('↑ '+t('one_part')+' = '+nf(T,2)+' : '+k.N+' = '+nf(k.u,2)+' '+ut,bx,by+bh+24);}
  if(g>=4){let x=bx;const tight=k.w.some(v=>bw*v/k.N<(NARROW?92:120));
    k.w.forEach((v,i)=>{const w=bw*v/k.N,m=clamp(x+w/2,bx+46,bx+bw-46),yy=by+bh+(tight&&i%2?(NARROW?58:62):20);
      cx.strokeStyle=PC[i];cx.lineWidth=1.5;if(tight&&i%2){cx.beginPath();cx.moveTo(x+w/2,by+bh+2);cx.lineTo(x+w/2,yy-14);cx.stroke();}
      cx.fillStyle=PC[i];cx.textAlign='center';cx.font='bold '+(NARROW?12.5:14)+'px system-ui';cx.fillText(pname(i),m,yy);
      cx.font='bold '+(NARROW?14:17)+'px system-ui';cx.fillText(nf(k.sh[i],2)+' '+ut,m,yy+(NARROW?17:20));x+=w;});}
  if(g>=5){cx.fillStyle=css('--ok');cx.font='bold '+(NARROW?13:16)+'px system-ui';cx.textAlign='center';
    cx.fillText(k.sh.map(v=>nf(v,2)).join(' + ')+' = '+nf(T,2)+' '+ut+' ✔',W/2,H-16);}
}
