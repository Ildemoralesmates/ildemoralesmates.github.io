"m3.more":"Quin volum té el cilindre? I l'esfera? Quina fracció del cilindre queda buida?",
"m4.q":"Una <b>piràmide de base quadrada</b> té aresta de la base <b>6 cm</b> i volum <b>48 cm³</b>. Quina és la seua altura?",
"m4_f":"6 · 6 · {0} ÷ 3 = {1}, no 48.","m4_ok":"✔ Missió complida! 36 · 4 ÷ 3 = 48 cm³.",
"m4.more":"Quin volum tindria el prisma amb la mateixa base i la mateixa altura?",
"s1.q":"«Si dobles l'altura d'un cilindre (sense canviar el radi), el seu volum es dobla.»",
"s1.h":"Mira la fórmula V = πr² · h: què passa si canvies h per 2h?",
"s1.e":"Sempre: V = πr² · h és proporcional a l'altura. Amb el doble de capes, el doble de volum.",
"s2.q":"«Si dobles el radi d'un cilindre (sense canviar l'altura), el seu volum es dobla.»",
"s2.h":"Prova amb r = 2 i després amb r = 4, i compara els volums.",
"s2.e":"Mai: el radi està elevat al quadrat, així que el volum es multiplica per 4, no per 2.",
"s3.q":"«Un con té menys volum que un cilindre.»",
"s3.h":"Sempre? I si el con és molt gran i el cilindre molt xicotet?",
"s3.e":"De vegades: és cert si tenen la mateixa base i la mateixa altura (el con és un terç), però un con gran pot tindre més volum que un cilindre xicotet.",
"s3.l0":"radi del con","s3.l1":"altura del con","s3.l2":"radi del cilindre","s3.l3":"altura del cilindre",
"s3_f":"El teu con té volum {0}π i el cilindre {1}π: el con continua sent més xicotet.",
"s4.q":"«Dos prismes de base quadrada amb el mateix volum tenen la mateixa àrea total.»",
"s4.h":"Compara un prisma d'aresta 2 i altura 8 amb un d'aresta 4 i altura 2.",
"s4.e":"De vegades: només si són iguals. Amb aresta 2 i altura 8 (V = 32, A = 72) i amb aresta 4 i altura 2 (V = 32, A = 64) el volum coincideix, però l'àrea no. El mateix volum es pot «embolicar» amb més o menys paper.",
"s4.l0":"aresta 1","s4.l1":"altura 1","s4.l2":"aresta 2","s4.l3":"altura 2",
"s4_v":"Els volums són {0} i {1}: han de ser iguals.","s4_same":"Tenen la mateixa àrea total ({0}). Busca dos prismes diferents amb el mateix volum.",
"s5.q":"«La superfície lateral d'un con, estesa damunt la taula, és un triangle.»",
"s5.h":"Desplega el con al simulador i fixa't en la vora.",
"s5.e":"Mai: és un sector circular. Vist de costat el con sembla un triangle, però la seua vora és corba i, en estendre'l, es converteix en un arc.",
"e1.ctx":"Un con té <b>radi 3 cm</b> i <b>altura 4 cm</b>. Quina és la seua àrea lateral?",
"e1.n0":"Marta","e1.n1":"Pau",
"e1.s0":"π · 3 · 4 = 12π cm².","e1.s1":"La generatriu fa 5 cm: π · 3 · 5 = 15π cm².",
"e1.w0":"L'àrea lateral és π · r · g, amb la <b>generatriu</b> g i no amb l'altura. Per Pitàgores, g = 5 cm.",
"e1.w1":"Perquè l'àrea lateral sempre és més gran que 12π.",
"e1.w2":"Perquè cal multiplicar el radi per la suma de l'altura i el radi.",
"e1.frame":"Marta, l'àrea lateral no és 12π perquè…",
"e1.model":"Marta, el sector que forma la superfície lateral té de radi la generatriu, no l'altura: la generatriu baixa inclinada per la superfície i l'altura baixa recta pel centre. Amb r = 3 i h = 4, g = √(9 + 16) = 5, i l'àrea és π · 3 · 5 = 15π cm².",
"e2.ctx":"Una piràmide de base quadrada té <b>aresta de la base 6 cm</b> i <b>altura 4 cm</b>. Quin és el seu volum?",
"e2.n0":"Àlex","e2.n1":"Laia",
"e2.s0":"6 · 6 · 4 = 144 cm³.","e2.s1":"6 · 6 · 4 ÷ 3 = 48 cm³.",
"e2.w0":"144 cm³ és el volum del prisma amb la mateixa base i la mateixa altura; la piràmide n'ocupa només un terç.",
"e2.w1":"Perquè en les piràmides sempre es divideix entre 2.",
"e2.w2":"Perquè l'altura d'una piràmide es mesura per la cara.",
"e2.frame":"Àlex, el volum no és 144 perquè…",
"e2.model":"Àlex, 6 · 6 · 4 = 144 cm³ és el volum del prisma que envolta la piràmide. Si omplires la piràmide d'aigua i l'abocares dins del prisma, en necessitaries tres: la piràmide és un terç, 144 ÷ 3 = 48 cm³.",
"e3.ctx":"Un cilindre té <b>radi 2 cm</b> i <b>altura 5 cm</b>. Quina és la seua <b>àrea total</b>?",
"e3.n0":"Rita","e3.n1":"Joan",
"e3.s0":"2 · π · 2 · 5 = 20π cm².","e3.s1":"π · 2² · 5 = 20π cm².",
"e3.w0":"Rita només ha calculat l'àrea lateral i Joan ha calculat el volum. L'àrea total és 20π + 2 · 4π = 28π cm².",
"e3.w1":"Perquè tots dos han oblidat multiplicar per 2.",
"e3.w2":"Perquè l'àrea total d'un cilindre és 2πr²h.",
"e3.frame":"Rita i Joan, l'àrea total no és 20π perquè…",
"e3.model":"Rita, 2π · 2 · 5 = 20π és només el rectangle lateral: hi falten els dos cercles de les bases, 2 · π · 2² = 8π. Joan, π · 2² · 5 és la fórmula del volum (i es mesura en cm³, no en cm²). L'àrea total és 20π + 8π = 28π cm².",
"d1.q":"Un cucurutxo de gelat té forma de con: <b>radi 3 cm</b> i <b>altura 12 cm</b>. Quin volum de gelat hi cap, a ras? (usa π ≈ 3,14). I quants cucurutxos plens caldrien per a omplir un got cilíndric amb el mateix radi i la mateixa altura?",
"d1.l0":"Volum","d1.l1":"Cucurutxos",
"d1_cyl":"339,12 cm³ és el volum del got cilíndric. El con n'és un terç.","d1_v":"π · 3² · 12 ÷ 3 no val {0}. Torna-ho a calcular.",
"d1_n":"El volum és correcte. Mira la pestanya «💧 Aigua»: quants cons omplin el cilindre?",
"d1_ok":"✔ Ben decidit! 3,14 · 9 · 12 ÷ 3 = 113,04 cm³, i en calen 3.",
"d1.more":"Si el cucurutxo fora el doble d'ample (radi 6 cm) amb la mateixa altura, quant de gelat hi cabria?",
"d2.q":"Vols embolicar una capsa amb forma de prisma de base quadrada: <b>aresta de la base 5 cm</b> i <b>altura 12 cm</b>. Quant de paper necessites com a mínim (àrea total)? I quin volum té la capsa?",
"d2.l0":"Paper","d2.l1":"Volum",
"d2_lat":"240 cm² és només l'àrea lateral: hi falten les dues bases.","d2_a":"L'àrea total és P · h + 2 · A<sub>b</sub> = 20 · 12 + 2 · 25. No val {0}.",
"d2_v":"L'àrea és correcta. El volum és A<sub>b</sub> · h = 25 · 12, no {0}.",
"d2_ok":"✔ Ben decidit! 240 + 50 = 290 cm² de paper i 25 · 12 = 300 cm³.",
"d2.more":"Una altra capsa té el mateix volum, però és més baixa i més ampla. Necessitarà la mateixa quantitat de paper?",
"d3.q":"Un dipòsit cilíndric té <b>radi 1 m</b> i <b>altura 2 m</b>. Quants <b>litres</b> d'aigua hi caben? (usa π ≈ 3,14; 1 m³ = 1000 L)",
"d3.l0":"Capacitat",
"d3_m3":"6,28 és el volum en m³. Passa'l a litres: 1 m³ = 1000 L.","d3_f":"π · 1² · 2 = 6,28 m³. En litres no són {0}.",
"d3_ok":"✔ Ben decidit! 6,28 m³ = 6280 L.",
"d3.more":"I si el dipòsit fora una esfera de radi 1 m? Hi cabrien més litres o menys?"

es:{
"title":"Cuerpos geométricos y volúmenes",
"eyebrow":"Matemáticas · 2.º y 3.º ESO · Geometría",
"h1":"Cuerpos geométricos y volúmenes",
"lede":"Despliega prismas, cilindros, pirámides y conos para ver de dónde salen las fórmulas del área, y llena un cilindro con el agua de un cono: hacen falta exactamente tres.",
"aria.shape":"Cuerpo geométrico","aria.pair":"Recipientes","aria.cv":"Dibujo del cuerpo geométrico, de su desarrollo plano o de los recipientes con agua",
"shape_pri":"Prisma","shape_cil":"Cilindro","shape_pir":"Pirámide","shape_con":"Cono","shape_esf":"Esfera","shape_aig":"💧 Agua",
"pair_con":"Cono → cilindro","pair_pir":"Pirámide → prisma","pair_esf":"Esfera → cilindro",
"idea":"<b>Para la clase:</b> arrastra el dibujo para girar el cuerpo. Antes de pulsar «Siguiente», decid en voz alta qué creéis que va a pasar.",
"l_n":"Lados de la base n","l_a":"Arista de la base a (cm)","l_r":"Radio r (cm)","l_h":"Altura h (cm)",
"f_a":"arista a","f_h":"altura h","f_r":"radio r",
"k_n":"Lados de la base","k_a":"Arista de la base","k_r":"Radio","k_h":"Altura","k_P":"Perímetro de la base","k_w":"Anchura del rectángulo",
"k_Ab":"Área de la base","k_Al":"Área lateral","k_At":"Área total","k_V":"Volumen","k_apb":"Apotema de la base","k_ap":"Apotema de la pirámide",
"k_g":"Generatriz g","k_ang":"Ángulo del sector","k_Acl":"Área lateral del cilindro","k_A":"Área de la esfera","k_hc":"Altura del cilindro",
"k_Vcil":"Volumen del cilindro","k_Vcon":"Volumen del cono","k_Vpri":"Volumen del prisma","k_Vpir":"Volumen de la pirámide","k_Vesf":"Volumen de la esfera","k_lvl":"Nivel del agua",
"rng":"Escribe números enteros dentro de los límites del simulador (arista de 2 a 8, radio de 1 a 6 y altura de 1 a 12).",
"p0.title":"Un prisma recto",
"p0.text":"<p>Un prisma tiene <b>dos bases iguales</b> y paralelas (aquí, polígonos regulares de n lados) y tantas <b>caras laterales</b> como lados tiene la base.</p>",
"p0.q":"Predice: si lo abrimos y lo extendemos sobre la mesa, ¿qué forma tendrán todas las caras laterales juntas?",
"p0.o0":"Un rectángulo grande","p0.o1":"Un triángulo","p0.o2":"Un círculo",
"p0.why":"Cada cara lateral es un rectángulo de altura h, y todas juntas forman uno solo, tan ancho como el perímetro de la base.",
"p1.title":"El desarrollo plano",
"p1.text":"<p>Abrimos las dos bases y desenrollamos las caras laterales: queda un <b>rectángulo</b> de altura <b>h</b> y anchura igual al <b>perímetro P</b> de la base, más los dos polígonos de las bases.</p>",
"p1.tq":"Cambia el número de lados n. ¿Qué le pasa al rectángulo lateral? ¿Y a las bases?",
"p1.th":"El rectángulo siempre es un rectángulo: solo cambia la anchura, que es n · a. Las bases sí cambian de forma: triángulo, cuadrado, pentágono…",
"p2.title":"El área: sumamos las piezas",
"p2.text":"<p>El área total es la del rectángulo lateral, <b>P · h</b>, más la de las dos bases: <b>A = P · h + 2 · A<sub>b</sub></b>.</p>",
"p2.q":"Un prisma de base cuadrada tiene a = 3 cm y h = 5 cm. ¿Cuál es su área lateral?",
"p2.o0":"15 cm²","p2.o1":"60 cm²","p2.o2":"45 cm²",
"p2.why":"El perímetro es 4 · 3 = 12 cm y el área lateral 12 · 5 = 60 cm². 15 cm² es solo una cara, y 45 es el volumen (en cm³).",
"p3.title":"El volumen: capas apiladas",
"p3.text":"<p>Volvemos a cerrarlo. Una capa de 1 cm de altura contiene tantos cm³ como cm² tiene la base. Con h capas: <b>V = A<sub>b</sub> · h</b>.</p>",
"p3.tq":"Dos prismas tienen la misma base y la misma altura, pero uno está inclinado, como una pila de monedas torcida. ¿Tienen el mismo volumen?",
"p3.th":"Sí: las capas son las mismas, solo están desplazadas (principio de Cavalieri). El volumen depende del área de la base y de la altura, no de la inclinación.",
"c0.title":"Un cilindro",
"c0.text":"<p>Un cilindro es como un prisma con una base de «infinitos lados»: dos <b>bases circulares</b> de radio <b>r</b> y una superficie lateral curva de altura <b>h</b>.</p>",
"c0.q":"Predice: si cortamos la superficie lateral de arriba abajo y la desenrollamos, ¿qué figura queda?",
"c0.o0":"Un rectángulo","c0.o1":"Un círculo","c0.o2":"Un trapecio",
"c0.why":"Piensa en la etiqueta de una lata de conservas: cuando la despegas, es un rectángulo.",
"c1.title":"El desarrollo plano",
"c1.text":"<p>La superficie lateral es un <b>rectángulo</b> de altura <b>h</b>. Su anchura tiene que dar la vuelta entera a la base: mide <b>2πr</b>, la longitud de la circunferencia.</p>",
"c1.tq":"¿Por qué la anchura del rectángulo es 2πr y no el diámetro, 2r?",
"c1.th":"Porque el rectángulo se enrolla alrededor del círculo: su lado tiene que coincidir con toda la circunferencia, que mide π veces el diámetro (algo más del triple).",
"c2.title":"El área: un rectángulo y dos círculos",
"c2.text":"<p>Área lateral: <b>2πr · h</b>. Cada base: <b>πr²</b>. En total: <b>A = 2πrh + 2πr²</b>.</p>",
"c2.q":"Si duplicas la altura de un cilindro sin tocar el radio, ¿qué le pasa al área lateral?",
"c2.o0":"Se duplica","c2.o1":"Se multiplica por 4","c2.o2":"No cambia",
"c2.why":"El rectángulo lateral se hace el doble de alto e igual de ancho: 2πr · 2h = 2 · (2πrh). Las bases no cambian.",
"c3.title":"El volumen: capas circulares",
"c3.text":"<p>Igual que en el prisma, apilamos capas: <b>V = A<sub>b</sub> · h = πr² · h</b>.</p>",
"c3.tq":"¿Qué hace crecer más el volumen: duplicar el radio o duplicar la altura? Pruébalo con los deslizadores.",
"c3.th":"Duplicar la altura duplica el volumen, pero duplicar el radio lo multiplica por 4, porque el radio está elevado al cuadrado.",
"y0.title":"Una pirámide regular",
"y0.text":"<p>Una pirámide tiene <b>una sola base</b> (un polígono) y caras laterales que son <b>triángulos</b> que se juntan en un punto, el <b>vértice</b>. La altura <b>h</b> va del vértice al centro de la base.</p>",
"y0.q":"Predice: la altura de uno de los triángulos laterales (la apotema de la pirámide), ¿es igual a la altura h de la pirámide?",
"y0.o0":"Sí, es la misma","y0.o1":"No, es más larga","y0.o2":"No, es más corta",
"y0.why":"La apotema baja inclinada por la cara, mientras que la altura baja recta por el centro. La apotema es la hipotenusa de un triángulo rectángulo que tiene la altura como cateto.",
"y1.title":"El desarrollo plano",
"y1.text":"<p>Cada triángulo lateral se abre alrededor de su arista de la base. Queda una <b>estrella</b>: el polígono de la base y n triángulos isósceles iguales, de altura <b>ap</b> (la apotema de la pirámide).</p>",
"y1.tq":"¿Cómo se calcula la apotema ap si conoces la altura h y la apotema de la base?",
"y1.th":"Con el teorema de Pitágoras: ap² = h² + (apotema de la base)². En una base cuadrada, la apotema de la base es la mitad de la arista.",
"y2.title":"El área: la base y los triángulos",
"y2.text":"<p>Cada triángulo tiene área a · ap ÷ 2, y hay n: el área lateral es <b>P · ap ÷ 2</b>. Con la base: <b>A = A<sub>b</sub> + P · ap ÷ 2</b>.</p>",
"y3.title":"El volumen: un tercio del prisma",
"y3.text":"<p>Encerramos la pirámide en el prisma que tiene la misma base y la misma altura. La pirámide ocupa exactamente <b>la tercera parte</b>: <b>V = A<sub>b</sub> · h ÷ 3</b>.</p>",
"y3.q":"Una pirámide de base cuadrada tiene a = 6 cm y h = 5 cm. ¿Cuál es su volumen?",
"y3.o0":"180 cm³","y3.o1":"90 cm³","y3.o2":"60 cm³",
"y3.why":"El área de la base es 36 cm², el prisma tendría 36 · 5 = 180 cm³ y la pirámide es un tercio: 60 cm³.",
"y3.tq":"¿Cómo podrías comprobar en clase que es un tercio y no la mitad?",
"y3.th":"Llenando la pirámide de agua o de arroz y vertiéndola en el prisma: hacen falta tres. Míralo en la pestaña «💧 Agua».",
"k0.title":"Un cono",
"k0.text":"<p>Un cono tiene una <b>base circular</b> de radio <b>r</b> y una superficie lateral curva que acaba en el <b>vértice</b>. La <b>generatriz g</b> es el segmento que va del vértice al borde de la base.</p>",
"k0.q":"Predice: si cortamos la superficie lateral por una generatriz y la extendemos, ¿qué figura queda?",
"k0.o0":"Un triángulo","k0.o1":"Un sector circular","k0.o2":"Un círculo entero",
"k0.why":"Todos los puntos del borde están a la misma distancia g del vértice: al extenderla, el borde se convierte en un arco de circunferencia de radio g.",
"k1.title":"El desarrollo plano",
"k1.text":"<p>La superficie lateral es un <b>sector circular</b> de radio <b>g</b>. Su arco tiene que dar la vuelta entera a la base: mide <b>2πr</b>.</p>",
"k1.tq":"Haz el cono más alto sin cambiar el radio. ¿Qué le pasa al ángulo del sector? ¿Por qué?",
"k1.th":"Se hace más pequeño: el arco sigue midiendo 2πr, pero el radio del sector (g) es mayor, así que ese arco es una parte más pequeña de la circunferencia entera. Ángulo = 360° · r ÷ g.",
"k2.title":"El área: un sector y un círculo",
"k2.text":"<p>El sector es la fracción r ÷ g de un círculo de radio g: su área es πg² · r ÷ g = <b>πrg</b>. Con la base: <b>A = πr² + πrg</b>.</p>",
"k2.q":"Un cono tiene r = 3 cm y h = 4 cm. ¿Cuánto mide la generatriz?",
"k2.o0":"7 cm","k2.o1":"5 cm","k2.o2":"12 cm",
"k2.why":"El radio, la altura y la generatriz forman un triángulo rectángulo: g² = 3² + 4² = 25, así que g = 5 cm.",
"k3.title":"El volumen: un tercio del cilindro",
"k3.text":"<p>Encerramos el cono en el cilindro que tiene la misma base y la misma altura. El cono ocupa exactamente <b>la tercera parte</b>: <b>V = πr² · h ÷ 3</b>.</p>",
"k3.tq":"A ojo, parece que el cono ocupa la mitad del cilindro. ¿Cómo lo comprobarías?",
"k3.th":"Llenando el cono de agua y vertiéndolo en el cilindro: hacen falta tres, no dos. Míralo en la pestaña «💧 Agua».",
"f0.title":"Una esfera",
"f0.text":"<p>Todos los puntos de la superficie de una esfera están a la misma distancia <b>r</b> del centro. No tiene caras, ni aristas, ni vértices.</p>",
"f0.q":"Predice: ¿se puede hacer un desarrollo plano exacto de una esfera, como hemos hecho con el cilindro o con el cono?",
"f0.o0":"Sí, es un círculo grande","f0.o1":"Sí, es un rectángulo","f0.o2":"No, es imposible sin deformarla",
"f0.why":"Una esfera no se puede aplanar sin estirarla o arrugarla. Por eso todos los mapas del mundo deforman algo: las áreas, las formas o las distancias.",
"f1.title":"El área: la del cilindro que la envuelve",
"f1.text":"<p>Metemos la esfera en un cilindro ajustado: radio <b>r</b> y altura <b>2r</b>. Arquímedes demostró que la esfera tiene la misma área que la superficie lateral de ese cilindro: 2πr · 2r = <b>4πr²</b>.</p>",
"f1.tq":"4πr² es exactamente el área de ¿cuántos círculos de radio r?",
"f1.th":"De cuatro círculos máximos. Pela una naranja y rellena con la cáscara círculos de su diámetro: llenarás cuatro.",
"f2.title":"El volumen: dos tercios del cilindro",
"f2.text":"<p>El cilindro ajustado tiene volumen πr² · 2r = 2πr³. La esfera ocupa <b>dos tercios</b>: <b>V = <sup>4</sup>⁄<sub>3</sub> πr³</b>.</p>",
"f2.q":"Si duplicas el radio de una esfera, ¿por cuánto se multiplica su volumen?",
"f2.o0":"Por 2","f2.o1":"Por 4","f2.o2":"Por 8",
"f2.why":"El radio está elevado al cubo: 2³ = 8. El área, en cambio, se multiplica por 2² = 4.",
"a0.title":"Un cono lleno de agua",
"a0.text":"<p>El cono y el cilindro tienen <b>la misma base</b> y <b>la misma altura</b>. El cono está lleno de agua hasta arriba.</p>",
"a0.q":"Predice: ¿cuántos conos llenos hacen falta para llenar el cilindro?",
"a0.o0":"2","a0.o1":"3","a0.o2":"4",
"a0.why":"Mucha gente dice 2, porque visto de lado el cono es un triángulo que ocupa la mitad del rectángulo. Pero el cono se estrecha en todas las direcciones: hacen falta 3. Compruébalo.",
"a1.title":"Primer cono",
"a1.text":"<p>Vertemos el primer cono. El agua llega a <b>un tercio</b> de la altura del cilindro.</p>",
"a1.tq":"Cuando el cono ha perdido la mitad del agua, ¿el nivel está a la mitad de su altura?",
"a1.th":"No. El cono es estrecho abajo y ancho arriba, así que la mayor parte del agua está en la parte alta: el nivel baja despacio al principio y deprisa al final.",
"a2.title":"Segundo cono",
"a2.text":"<p>Volvemos a llenar el cono y lo vertemos. El agua llega a <b>dos tercios</b>.</p>",
"a3.title":"Tercer cono: ¡lleno!",
"a3.text":"<p>Con el tercer cono, el cilindro queda lleno exactamente. Por tanto, el volumen del cono es <b>la tercera parte</b> del volumen del cilindro: <b>V = πr² · h ÷ 3</b>.</p>",
"a3.tq":"Cambia el radio y la altura y repite el experimento. ¿Siguen haciendo falta tres conos?",
"a3.th":"Sí, siempre: mientras el cono y el cilindro tengan la misma base y la misma altura, la relación es de 1 a 3, sean altos, bajos, anchos o estrechos.",
"b0.title":"Una pirámide llena de agua",
"b0.text":"<p>La pirámide y el prisma tienen <b>la misma base</b> y <b>la misma altura</b>. La pirámide está llena de agua.</p>",

/* ===== geometria 3D: x a la dreta, y cap al fons, z cap amunt ===== */
function ngon(n,a){const R=a/(2*Math.sin(PI/n)),v=[];for(let i=0;i<n;i++){const g=-PI/2-PI/n+i*TAU/n;v.push([R*Math.cos(g),R*Math.sin(g)]);}return v;}
/* prisma (o cilindre, amb molts costats): les bases s'obrin i les cares laterals es desenrotllen */
function prismFaces(n,a,h,u,smooth){
  const ul=ease(clamp(u/0.45,0,1)),us=ease(clamp((u-0.3)/0.7,0,1));
  const th=(1-us)*TAU/n,al=ul*PI/2,v=ngon(n,a),y0=v[0][1];
  const omin=-Math.floor((n-1)/2),omax=n-1+omin,Q={};
  Q[0]=[v[0][0],y0];Q[1]=[v[1][0],y0];
  for(let o=1;o<=omax;o++)Q[o+1]=[Q[o][0]+a*Math.cos(o*th),Q[o][1]+a*Math.sin(o*th)];
  for(let o=-1;o>=omin;o--)Q[o]=[Q[o+1][0]-a*Math.cos(o*th),Q[o+1][1]-a*Math.sin(o*th)];
  const F=[];
  for(let o=omin;o<=omax;o++)F.push({k:'lat',smooth,ia:0,ib:1,ta:3,tb:2,end:us>0&&(o===omin||o===omax),
    p:[[Q[o][0],Q[o][1],0],[Q[o+1][0],Q[o+1][1],0],[Q[o+1][0],Q[o+1][1],h],[Q[o][0],Q[o][1],h]]});
  const ca=Math.cos(al),sa=Math.sin(al);
  F.push({k:'base',top:true,surf:true,p:v.map(q=>[q[0],y0+(q[1]-y0)*ca,h+(q[1]-y0)*sa])});
  F.push({k:'base',p:v.slice().reverse().map(q=>[q[0],y0+(q[1]-y0)*ca,-(q[1]-y0)*sa])});
  return F;
}
/* piràmide: cada triangle s'obri al voltant de la seua aresta de la base */
function pyrFaces(n,a,h,u){
  const e=ease(u),v=ngon(n,a),ap=a/(2*Math.tan(PI/n)),s=Math.hypot(h,ap),g=(PI-Math.atan2(h,ap))*(1-e),F=[];
  for(let i=0;i<n;i++){const A=v[i],B=v[(i+1)%n],M=[(A[0]+B[0])/2,(A[1]+B[1])/2],m=Math.hypot(M[0],M[1]);
    F.push({k:'lat',ia:0,ib:1,p:[[A[0],A[1],0],[B[0],B[1],0],[M[0]+s*Math.cos(g)*M[0]/m,M[1]+s*Math.cos(g)*M[1]/m,s*Math.sin(g)]]});}
  F.push({k:'base',p:v.slice().reverse().map(q=>[q[0],q[1],0])});
  return F;
}
/* con: la superfície lateral s'obri com un paraigua fins a quedar plana (sector de radi g) */
function coneFaces(r,h,u){
  const el=ease(clamp(u/0.5,0,1)),e=ease(clamp((u-0.25)/0.75,0,1)),g=Math.hypot(r,h),rho=lerp(r,g,e);
  const zA=h*(1-e),zr=zA-Math.sqrt(Math.max(0,g*g-rho*rho)),Ph=TAU*r/rho,F=[],rim=[];
  for(let k=0;k<=NS;k++){const an=-PI/2-Ph/2+k*Ph/NS;rim.push([rho*Math.cos(an),rho*Math.sin(an),zr]);}
  for(let k=0;k<NS;k++)F.push({k:'lat',smooth:true,ia:0,ib:1,end:e>0&&(k===0||k===NS-1),p:[rim[k],rim[k+1],[0,0,zA]]});
  const ps=PI*el,cy=-rho+r*Math.cos(ps),cz=zr-r*Math.sin(ps),d=[];
  for(let k=0;k<NS;k++){const tt_=-k*TAU/NS;d.push([r*Math.cos(tt_),cy+r*Math.sin(tt_)*Math.cos(ps),cz-r*Math.sin(tt_)*Math.sin(ps)]);}
  F.push({k:'base',p:d});
  return F;
}
/* con o piràmide invertits (recipient amb el vèrtex baix) */
function invFaces(n,a,h,smooth,top){
  const v=ngon(n,a),F=[];
  for(let i=0;i<n;i++){const A=v[i],B=v[(i+1)%n];F.push({k:'lat',smooth,ia:1,ib:0,p:[[B[0],B[1],h],[A[0],A[1],h],[0,0,0]]});}
  if(top)F.push({k:'base',surf:true,p:v.map(q=>[q[0],q[1],h])});
  return F;
}
/* projecció */
function raw(yaw,pitch,ox){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  return p=>{const x1=p[0]*cy-p[1]*sy+(ox||0),y1=p[0]*sy+p[1]*cy;return [x1,p[2]*cp+y1*sp,y1*cp-p[2]*sp];};}

    if(!open&&runs.length>1&&runs[0].front===runs[runs.length-1].front){const last=runs.pop();runs[0].fs=last.fs.concat(runs[0].fs);}
    runs.forEach(r=>{const fs=r.fs,q=fs[0].s.length===4,f0=fs[0],f1=fs[fs.length-1];
      const rim=[f0.s[f0.ia]];fs.forEach(f=>rim.push(f.s[f.ib]));

  c.font=(o.b?'700 ':'600 ')+(o.sz||13)+'px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
  c.textAlign=o.al||'center';c.textBaseline='middle';c.lineWidth=4;c.lineJoin='round';c.strokeStyle=col.stage;c.strokeText(s,x,y);
  c.fillStyle=o.c||col.ink;c.fillText(s,x,y);c.restore();
}
function geo(){const {n,a,r,h}=ST,per=n*a,apb=a/(2*Math.tan(PI/n));return {per,apb,Ab:per*apb/2,ap:Math.hypot(h,apb),g:Math.hypot(r,h),Rp:a/(2*Math.sin(PI/n))};}
function bodyFaces(u){
  const {shape,n,a,r,h}=ST;
  if(shape==='pri')return prismFaces(n,a,h,u,false);
  if(shape==='cil')return prismFaces(NS,2*r*Math.sin(PI/NS),h,u,true);
  if(shape==='pir')return pyrFaces(n,a,h,u);
  return coneFaces(r,h,u);
}
function drawBody(){
  const c=K.ctx,col=C(),{shape,n,a,r,h}=ST,G=geo(),flat=shape==='pri'||shape==='cil',poly=shape==='pri'||shape==='pir';
  const u=P<=2?clamp(P,0,1):1-clamp((P-2)/0.6,0,1),ev=ease(u);
  const la=clamp((u-0.9)/0.1,0,1),la2=la*clamp(P-1,0,1),fv=P>2?clamp((P-2.6)/0.4,0,1):0;
  const Rb=poly?G.Rp:r,Rs=Math.hypot(Rb,h/2),p1=flat?0:PI/2;
  const rw=raw(ST.yaw*(1-ev),lerp(PITCH,p1,ev)),s0=Math.min(62,(Math.min(W,H)-56)/(2*Rs));
  const rw1=raw(0,p1);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  bodyFaces(1).forEach(f=>f.p.forEach(q=>{const w=rw1(q);x0=Math.min(x0,w[0]);x1=Math.max(x1,w[0]);y0=Math.min(y0,w[1]);y1=Math.max(y1,w[1]);}));
  const s1=Math.min(62,(W-(flat?130:50))/(x1-x0),(H-44)/(y1-y0));
  const c0=rw([0,0,h/2]),sc=lerp(s0,s1,ev),pr=fit(rw,sc,lerp(c0[0],(x0+x1)/2,ev),lerp(c0[1],(y0+y1)/2,ev));
  const F=bodyFaces(u);
  paint(F,pr,{cl:col.pa,cb:col.pb,al:.32,ab:.34});
  const mid=f=>{let x=0,y=0;f.s.forEach(q=>{x+=q[0];y+=q[1];});return [x/f.s.length,y/f.s.length];};
  if(la>0){
    if(flat){
      const nl=F.length-2,A=F[0].s[0],B=F[nl-1].s[1],T=F[0].s[3],xm=(A[0]+B[0])/2,ym=(A[1]+T[1])/2;
      txt(shape==='pri'?'P = '+n+' · '+a+' = '+f2(G.per)+' cm':'2πr = '+f2(2*PI*r)+' cm',xm,ym-(la2>0?10*la2:0),{a:la});
      txt('h = '+h,A[0]-8,ym,{a:la,al:'right'});
      if(la2>0){
        txt(shape==='pri'?'P · h = '+f2(G.per*h)+' cm²':'2πr · h = '+f2(2*PI*r*h)+' cm²',xm,ym+10,{a:la2,c:col.pa,b:1});
        [F[nl],F[nl+1]].forEach(f=>{const m=mid(f);txt((shape==='pri'?'Ab = ':'πr² = ')+f2(shape==='pri'?G.Ab:PI*r*r),m[0],m[1],{a:la2,c:col.pb,b:1});});
      }
    }else if(shape==='pir'){
      const s=F[0].s,M=[(s[0][0]+s[1][0])/2,(s[0][1]+s[1][1])/2];
      c.save();c.globalAlpha=la;c.strokeStyle=col.ok;c.lineWidth=2;c.setLineDash([5,4]);path(c,[M,s[2]]);c.stroke();c.restore();
      txt('ap = '+f2(G.ap),(M[0]+s[2][0])/2+7,(M[1]+s[2][1])/2,{a:la,al:'left',c:col.ok,b:1});
      if(la2>0){
        const o=pr([0,0,0]);txt('Ab = '+f2(G.Ab),o[0],o[1],{a:la2,c:col.pb,b:1});
        const m=mid(F[1]);txt('a·ap÷2 = '+f2(a*G.ap/2),m[0],m[1],{a:la2,c:col.pa,b:1});
      }
    }else{
      const g=G.g,ap=F[0].s[2],r0=F[0].s[0],q=y=>pr([0,-g*y,0]);
      txt('g = '+f2(g),(ap[0]+r0[0])/2-7,(ap[1]+r0[1])/2,{a:la,al:'right',c:col.ok,b:1});
      let w=q(0.8);txt('2πr = '+f2(2*PI*r)+' cm',w[0],w[1],{a:la});
      w=q(0.26);txt(nf(360*r/g,1)+'°',w[0],w[1],{a:la});
      if(la2>0){
        w=q(0.54);txt('πrg = '+f2(PI*r*g)+' cm²',w[0],w[1],{a:la2,c:col.pa,b:1});
        w=q(1+r/g);txt('πr² = '+f2(PI*r*r),w[0],w[1],{a:la2,c:col.pb,b:1});
      }
    }
  }
  if(fv>0){
    const ring=ngon(poly?n:NS,poly?a:2*r*Math.sin(PI/NS));
    c.save();c.globalAlpha=fv*.9;c.lineJoin='round';
    if(flat){
      c.strokeStyle=col.ok;c.lineWidth=1.3;
      for(let z=1;z<=h;z++){path(c,ring.map(q=>pr([q[0],q[1],z])),true);c.stroke();}
    }else{
      c.strokeStyle=col.pb;c.lineWidth=1.6;c.setLineDash([6,4]);
      const top=ring.map(q=>pr([q[0],q[1],h])),bot=ring.map(q=>pr([q[0],q[1],0]));
      path(c,top,true);c.stroke();
      let idx=ring.map((q,i)=>i);
      if(!poly){let lo=0,hi=0;top.forEach((q,i)=>{if(q[0]<top[lo][0])lo=i;if(q[0]>top[hi][0])hi=i;});idx=[lo,hi];}
      idx.forEach(i=>{path(c,[bot[i],top[i]]);c.stroke();});
    }
    c.restore();
  }
}
function drawSphere(){
  const c=K.ctx,col=C(),r=ST.r,ca=clamp(P,0,1),rw=raw(0,PITCH),sc=Math.min(62,(Math.min(W,H)-70)/(2*Math.hypot(r,r)));
  const c0=rw([0,0,r]),pr=fit(rw,sc,c0[0],c0[1]),o=pr([0,0,r]),R=r*sc,sq=Math.sin(PITCH);
  c.beginPath();c.arc(o[0],o[1],R,0,TAU);c.fillStyle=col.stage;c.fill();c.globalAlpha=.32;c.fillStyle=col.pa;c.fill();c.globalAlpha=1;
  c.strokeStyle=col.ink;c.lineWidth=1.5;c.stroke();
  c.beginPath();c.ellipse(o[0],o[1],R,R*sq,0,0,PI);c.stroke();
  c.save();c.setLineDash([4,4]);c.globalAlpha=.6;c.beginPath();c.ellipse(o[0],o[1],R,R*sq,0,PI,TAU);c.stroke();c.restore();
  c.save();c.strokeStyle=col.ok;c.lineWidth=2;path(c,[[o[0],o[1]],[o[0]+R,o[1]]]);c.stroke();c.restore();
  c.beginPath();c.arc(o[0],o[1],3,0,TAU);c.fillStyle=col.ink;c.fill();
  txt('r = '+r,o[0]+R/2,o[1]-10,{c:col.ok,b:1});
  if(ca>0){
    paint(prismFaces(NS,2*r*Math.sin(PI/NS),2*r,0,true),pr,{glass:true,sa:ca,sc:col.pb,lw:1.6});
    txt('2r = '+(2*r),o[0]+R+9,o[1],{a:ca,al:'left',c:col.pb,b:1});
  }
}
function drawWater(){
  const c=K.ctx,col=C(),{pair,n,a,r,h}=ST,rnd=pair!=='pir',G=geo();
  const nn=rnd?NS:n,aa=rnd?2*r*Math.sin(PI/NS):a,R=rnd?r:G.Rp,Hh=pair==='esf'?2*r:h,d=R+0.9,cp=Math.cos(PITCH),sp=Math.sin(PITCH);
  const sc=Math.min(58,(W-96)/(2*d+2*R),(H-96)/(Hh*cp+2*R*sp)),yaw=rnd?0:ST.yaw;
  const c0=raw(0,PITCH)([0,0,Hh/2]),prL=fit(raw(yaw,PITCH,-d),sc,c0[0],c0[1]-10/sc),prR=fit(raw(yaw,PITCH,d),sc,c0[0],c0[1]-10/sc);
  let fl,fr,pour;
  if(pair==='esf'){const q=clamp(P/0.8,0,1);fl=1-q;fr=2/3*q;pour=P>0&&P<0.8;}
  else{const k=Math.min(Math.floor(P+1e-9),2),q=Math.min(P-k,1),w=Math.min(q/0.8,1);fr=(k+w)/3;fl=q<0.8?1-w:(k<2?(q-0.8)/0.2:0);pour=q>0&&q<0.8;}
  const wo={water:true,cl:col.pa,al:.42,ab:.55};
  /* aigua del recipient gran */
  if(fr>0.002)paint(prismFaces(nn,aa,fr*Hh,0,rnd),prR,wo);
  /* recipient xicotet */
  let S;
  if(pair==='esf'){
    const o=prL([0,0,r]),Rp=r*sc;
    if(fl>0.002){
      let lo=0,hi=2*r;for(let i=0;i<32;i++){const m=(lo+hi)/2;if(m*m*(3*r-m)/(4*r*r*r)<fl)lo=m;else hi=m;}
      const z=lo-r,ys=o[1]-z*cp*sc,rad=Math.sqrt(Math.max(0,r*r-z*z))*sc;
      c.save();c.beginPath();c.arc(o[0],o[1],Rp,0,TAU);c.clip();c.globalAlpha=.42;c.fillStyle=col.pa;c.fillRect(o[0]-Rp,ys,2*Rp,2*Rp);c.restore();
      c.beginPath();c.ellipse(o[0],ys,rad,rad*sp,0,0,TAU);c.globalAlpha=.5;c.fillStyle=col.pa;c.fill();c.globalAlpha=.9;c.strokeStyle=col.pa;c.lineWidth=1.2;c.stroke();c.globalAlpha=1;
    }
    c.beginPath();c.arc(o[0],o[1],Rp,0,TAU);c.strokeStyle=col.ink;c.lineWidth=1.5;c.stroke();
    c.save();c.globalAlpha=.45;c.setLineDash([4,4]);c.beginPath();c.ellipse(o[0],o[1],Rp,Rp*sp,0,0,TAU);c.stroke();c.restore();
    S=[o[0]+Rp*0.72,o[1]-Rp*0.72];
  }else{
    if(fl>0.002){const s=Math.cbrt(fl);paint(invFaces(nn,aa*s,h*s,rnd,true),prL,wo);}
    paint(invFaces(nn,aa,h,rnd,false),prL,{glass:true});
    S=prL([R*0.92,0,h]);
  }
  /* recipient gran i marques de nivell */
  const big=prismFaces(nn,aa,Hh,0,rnd).filter(f=>!f.top);
  paint(big,prR,{glass:true});
  const ring=ngon(nn,aa),marks=pair==='esf'?[[2/3,'⅔']]:[[1/3,'⅓'],[2/3,'⅔'],[1,'1']];
  marks.forEach(m=>{if(fr<m[0]-1e-4)return;const pts=ring.map(q=>prR([q[0],q[1],m[0]*Hh]));let hi=0;pts.forEach((q,i)=>{if(q[0]>pts[hi][0])hi=i;});
    txt(m[1],pts[hi][0]+8,pts[hi][1],{al:'left',c:col.ok,b:1,sz:15});});
  /* raig d'aigua */
  if(pour&&fl>0.002){
    const E=prR([-R*0.35,0,fr*Hh]);
    c.save();c.globalAlpha=.62;c.strokeStyle=col.pa;c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(S[0],S[1]);
    c.quadraticCurveTo((S[0]+E[0])/2+10,Math.min(S[1],E[1])-52,E[0],E[1]);c.stroke();c.restore();
  }
  const bl=prL([0,0,0]),br=prR([0,0,0]),dy=R*sp*sc+18;
  txt(t(pair==='con'?'shape_con':pair==='pir'?'shape_pir':'shape_esf'),bl[0],bl[1]+dy,{c:col.muted});
  txt(t(pair==='pir'?'shape_pri':'shape_cil'),br[0],br[1]+dy,{c:col.muted});
}
function draw(){
  if(!K)return;
  K.ctx.clearRect(0,0,W,H);
  if(ST.shape==='aig')drawWater();else if(ST.shape==='esf')drawSphere();else drawBody();

function statsFor(i){
  const {shape,pair,n,a,r,h}=ST,G=geo(),Ab='A<sub>b</sub>',cm=' cm',c2=' cm²',c3=' cm³';
  if(shape==='pri'){
    if(i===0)return [['k_n',n],['k_a',a+cm],['k_h',h+cm]];
    if(i===1)return [['k_P','n · a = '+n+' · '+a+' = '+f2(G.per)+cm],['k_h',h+cm]];
    if(i===2)return [['k_Ab',f2(G.Ab)+c2],['k_Al','P · h = '+f2(G.per)+' · '+h+' = '+f2(G.per*h)+c2],['k_At',f2(G.per*h)+' + 2 · '+f2(G.Ab)+' = '+f2(G.per*h+2*G.Ab)+c2]];
    return [['k_Ab',f2(G.Ab)+c2],['k_V',Ab+' · h = '+f2(G.Ab)+' · '+h+' = '+f2(G.Ab*h)+c3]];
  }
  if(shape==='cil'){
    const B=PI*r*r,L=2*PI*r*h;
    if(i===0)return [['k_r',r+cm],['k_h',h+cm]];
    if(i===1)return [['k_w','2πr = 2 · π · '+r+' = '+f2(2*PI*r)+cm],['k_h',h+cm]];
    if(i===2)return [['k_Ab','πr² = '+f2(B)+c2],['k_Al','2πr · h = '+f2(L)+c2],['k_At',f2(L)+' + 2 · '+f2(B)+' = '+f2(L+2*B)+c2]];
    return [['k_Ab','πr² = '+f2(B)+c2],['k_V','πr² · h = '+f2(B)+' · '+h+' = '+f2(B*h)+c3]];
  }
  if(shape==='pir'){
    const L=G.per*G.ap/2;
    if(i===0)return [['k_n',n],['k_a',a+cm],['k_h',h+cm]];
    if(i===1)return [['k_apb',f2(G.apb)+cm],['k_ap','√('+h+'² + '+f2(G.apb)+'²) = '+f2(G.ap)+cm]];
    if(i===2)return [['k_Ab',f2(G.Ab)+c2],['k_Al','P · ap ÷ 2 = '+f2(G.per)+' · '+f2(G.ap)+' ÷ 2 = '+f2(L)+c2],['k_At',f2(G.Ab)+' + '+f2(L)+' = '+f2(G.Ab+L)+c2]];
    return [['k_Vpri',Ab+' · h = '+f2(G.Ab)+' · '+h+' = '+f2(G.Ab*h)+c3],['k_V',f2(G.Ab*h)+' ÷ 3 = '+f2(G.Ab*h/3)+c3]];
  }
  if(shape==='con'){
    const B=PI*r*r,L=PI*r*G.g;
    if(i===0)return [['k_r',r+cm],['k_h',h+cm]];
    if(i===1)return [['k_g','√('+r+'² + '+h+'²) = '+f2(G.g)+cm],['k_ang','360° · r ÷ g = '+nf(360*r/G.g,1)+'°']];
    if(i===2)return [['k_Ab','πr² = '+f2(B)+c2],['k_Al','π · r · g = '+f2(L)+c2],['k_At',f2(B)+' + '+f2(L)+' = '+f2(B+L)+c2]];
    return [['k_Vcil','πr² · h = '+f2(B*h)+c3],['k_V',f2(B*h)+' ÷ 3 = '+f2(B*h/3)+c3]];
  }
  const Vc=2*PI*r*r*r;
  if(shape==='esf'){
    if(i===0)return [['k_r',r+cm]];
    if(i===1)return [['k_Acl','2πr · 2r = '+f2(4*PI*r*r)+c2],['k_A','4πr² = '+f2(4*PI*r*r)+c2]];
    return [['k_Vcil','2πr³ = '+f2(Vc)+c3],['k_V','⅔ · '+f2(Vc)+' = '+f2(Vc*2/3)+c3]];
  }
  if(pair==='esf'){
    if(i===0)return [['k_r',r+cm],['k_hc','2r = '+(2*r)+cm]];
    if(i===1)return [['k_lvl','⅔ · '+(2*r)+' = '+f2(4*r/3)+cm]];
    return [['k_Vcon','⅓ · '+f2(Vc)+' = '+f2(Vc/3)+c3],['k_Vesf','⅔ · '+f2(Vc)+' = '+f2(Vc*2/3)+c3],['k_Vcil','2πr³ = '+f2(Vc)+c3]];
  }
  const cone=pair==='con',Vb=cone?PI*r*r*h:G.Ab*h;
  if(i===0)return cone?[['k_r',r+cm],['k_h',h+cm]]:[['k_n',n],['k_a',a+cm],['k_h',h+cm]];
  if(i<3)return [['k_lvl',(i===1?'⅓':'⅔')+' · '+h+' = '+f2(i*h/3)+cm]];
  return [[cone?'k_Vcil':'k_Vpri',(cone?'πr² · h = ':Ab+' · h = ')+f2(Vb)+c3],[cone?'k_Vcon':'k_Vpir',f2(Vb)+' ÷ 3 = '+f2(Vb/3)+c3]];
}
function refresh(){
  SE.steps.forEach((s,i)=>{s.stats=statsFor(i).map(p=>[p[0],String(p[1])]);});
  stepRender();draw();
}
/* animació entre passos */
function animateTo(i){
  cancelAnimationFrame(raf);
  const from=P,to=i;
  if(REDUCE||Math.abs(to-from)<1e-6){P=to;draw();return;}
  const dur=(ST.shape==='aig'?2400:1500)*Math.max(0.5,Math.abs(to-from)),t0=performance.now();
  function step(now){
    const p=Math.min(1,(now-t0)/dur);
    P=from+(to-from)*(ST.shape==='aig'?p:ease(p));draw();
    if(p<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
function rebuildStepper(){
  const sp=$('#stepper');sp.innerHTML='';
  SE.steps.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.textContent=k+1;b.onclick=()=>stepGo(k);sp.appendChild(b);});
}

function ld(shape,v,step){
  const c=(x,a,z)=>clamp(Math.round(x),a,z);v=v||{};
  if(v.n!==undefined){ST.n=c(v.n,3,8);sN.set(ST.n);}
  if(v.a!==undefined){ST.a=c(v.a,2,8);sA.set(ST.a);}
  if(v.r!==undefined){ST.r=c(v.r,1,6);sR.set(ST.r);}
  if(v.h!==undefined){ST.h=c(v.h,1,12);sH.set(ST.h);}
  setShape(shape,v.pair);
  const i=Math.min(step||0,SE.steps.length-1);
  P=i;SE.i=i;refresh();
  RZ.show(cv);
}
