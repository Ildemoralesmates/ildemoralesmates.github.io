<title>Robot en el laberint: programació per blocs</title>
<meta name="description" content="Programa un robot amb blocs (avança, gira, repeteix, mentre, si-sinó) perquè arribe a la meta del laberint. Cinc nivells que introdueixen seqüències, bucles, sensors i condicionals, amb recompte de blocs. Per a Tecnologia de 2n i 3r d'ESO, amb test autocorregit.">

<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@TEC_CSS@*/
.pal2{display:flex;flex-wrap:wrap;gap:6px}
.pal2 .btn{font-size:13px;padding:5px 9px}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:5.5em;max-height:19rem;overflow:auto}
.blist{display:grid;gap:4px;padding:3px;border-radius:6px;border:2px dashed transparent;min-height:1.6em}
.blist.active{border-color:var(--pa)}
.blist .em{color:var(--muted);font-size:12.5px;padding:2px 6px}
.blk{display:grid;gap:3px}
.blk .hd{display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-left:5px solid var(--pa);border-radius:6px;padding:3px 6px;font-size:13.5px}
.blk.cont>.hd{border-left-color:var(--pb)}
.blk.run>.hd{background:var(--ok);color:var(--panel);border-color:var(--ok)}
.blk .hd select,.blk .hd input{font:inherit;font-size:12.5px;padding:1px 3px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.blk .hd input{width:3.2em}
.blk .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.blk .x:hover{color:var(--warn)}
.blk .kid{margin-left:14px}
.blk .lbl{font-size:12px;color:var(--muted);margin-left:14px}
.lv{display:flex;flex-wrap:wrap;gap:6px}
.task{font-size:13.5px;margin:0;color:var(--muted)}
.task b{color:var(--ink)}
.stars{font-size:20px;color:var(--warn)}
</style>
<!--@GC@-->
</head>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@TEC_JS@*/

const W=640,H=420;
const D=[[0,1],[1,0],[0,-1],[-1,0]];
const LV=[
 {rows:["#####","#S..#","###.#","#G..#","#####"],opt:8,allow:['F','L','R']},
 {rows:["#########","#S......#","#######.#","#G......#","#########"],opt:8,allow:['F','L','R','rep']},
 {rows:["#######","#S.####","##..###","###..##","####..#","#####G#","#######"],opt:5,allow:['F','L','R','rep']},
 {rows:["#########","#S......#","#######.#","#######G#","#########"],opt:5,allow:['F','L','R','rep','while']},
 {rows:["#########","#S....#.#","#####.#.#","#...#...#","#.#####.#","#......G#","#########"],opt:7,allow:['F','L','R','rep','while','if']}
];
const S={lv:0,run:false,done:false,acts:0,crash:0,bid:0};
let PROG=[],ACTIVE=PROG,cur=null,gen=null,timer=0,speedDelay=500;
const rob={r:1,c:1,d:0,x:0,y:0,a:0};
let MAP=LV[0].rows.map(r=>r.split(""));S.sr=1;S.sc=1;
function loadLevel(i){
  S.lv=i;const L=LV[i];MAP=L.rows.map(r=>r.split(''));
  PROG=[];ACTIVE=PROG;
  for(let r=0;r<MAP.length;r++)for(let c=0;c<MAP[0].length;c++)if(MAP[r][c]==='S'){S.sr=r;S.sc=c;}
  resetRun();buildPal();renderProg();task();
}
function resetRun(){
  S.run=false;S.done=false;S.acts=0;S.crash=0;gen=null;cur=null;
  rob.r=S.sr;rob.c=S.sc;rob.d=0;rob.x=rob.c;rob.y=rob.r;rob.a=0;
  const m=$('#msg');m.className='msg';m.textContent=t('m_ready');setRunBtn();info();
}
function task(){$('#task').innerHTML=t('task'+(S.lv+1));}
function free(r,c){return MAP[r]&&MAP[r][c]!==undefined&&MAP[r][c]!=='#';}
function cond(b){
  const [dr,dc]=D[rob.d];let v;
  if(b.c==='front')v=free(rob.r+dr,rob.c+dc);
  else if(b.c==='right'){const d=(rob.d+1)%4;v=free(rob.r+D[d][0],rob.c+D[d][1]);}
  else if(b.c==='left'){const d=(rob.d+3)%4;v=free(rob.r+D[d][0],rob.c+D[d][1]);}
  else v=MAP[rob.r][rob.c]==='G';
  return b.neg?!v:v;
}
/* intèrpret amb generador: cada acció és un yield */
function* exec(list){for(const b of list)yield* runB(b);}
function* runB(b){
  if(b.t==='F'||b.t==='L'||b.t==='R'){yield b;}
  else if(b.t==='rep'){for(let i=0;i<b.n;i++)yield* exec(b.body);}
  else if(b.t==='while'){let g=0;while(cond(b)){if(++g>300)throw 'loop';const before=S.acts;yield* exec(b.body);if(S.acts===before&&g>50)throw 'loop';}}
  else if(b.t==='if'){yield* exec(cond(b)?b.body:b.els);}
}
function count(list){return list.reduce((n,b)=>n+1+(b.body?count(b.body):0)+(b.els?count(b.els):0),0);}
function info(){$('#vB').textContent=count(PROG);$('#vM').textContent=LV[S.lv].opt;$('#vA').textContent=S.acts;}
/* un pas del programa */
function stepOnce(){
  if(S.done)return;
  if(!gen){if(!PROG.length){msg('m_empty','msg bad');return;}gen=exec(PROG);}
  let nx;
  try{nx=gen.next();}catch(e){S.done=true;S.run=false;msg('m_loop','msg bad');setRunBtn();return;}
  if(nx.done){S.done=true;S.run=false;cur=null;
    if(MAP[rob.r][rob.c]!=='G')msg('m_end','msg bad');setRunBtn();render();return;}
  cur=nx.value.id;S.acts++;
  const b=nx.value;
  if(b.t==='L')rob.d=(rob.d+3)%4;else if(b.t==='R')rob.d=(rob.d+1)%4;
  else{const nr=rob.r+D[rob.d][0],nc=rob.c+D[rob.d][1];
    if(!free(nr,nc)){S.crash=1;S.done=true;S.run=false;msg('m_crash','msg bad');setRunBtn();render();info();return;}
    rob.r=nr;rob.c=nc;}
  if(MAP[rob.r][rob.c]==='G'){win();}
  render();info();
}
function win(){
  S.done=true;S.run=false;const n=count(PROG),opt=LV[S.lv].opt,st=n<=opt?3:n<=opt+2?2:1;
  const m=$('#msg');m.className='msg good';m.innerHTML=tt('m_win',n)+' <span class="stars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</span><br>'+t('m_stars'+st);setRunBtn();
}
function msg(k,c){const m=$('#msg');m.className=c||'msg';m.textContent=t(k);}
function setRunBtn(){$('#run').textContent=t(S.run?'pause':'run');}
/* ---- editor de blocs ---- */
const NAMES={F:'b_F',L:'b_L',R:'b_R'};
function buildPal(){
  const h=$('#pal2');h.innerHTML='';
  LV[S.lv].allow.forEach(k=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=t(k==='rep'?'b_rep':k==='while'?'b_while':k==='if'?'b_if':NAMES[k]);b.onclick=()=>add(k);h.appendChild(b);});
}
function add(k){
  if(count(PROG)>=40)return;
  const b={t:k,id:++S.bid};
  if(k==='rep'){b.n=3;b.body=[];}
  if(k==='while'){b.c=S.lv===4?'goal':'front';b.neg=S.lv===4;b.body=[];}
  if(k==='if'){b.c='right';b.neg=false;b.body=[];b.els=[];}
  ACTIVE.push(b);
  if(b.body)ACTIVE=b.body;
  resetRunSoft();renderProg();
}
function resetRunSoft(){const s=$('#msg');gen=null;S.done=false;S.run=false;S.acts=0;rob.r=S.sr;rob.c=S.sc;rob.d=0;cur=null;s.className='msg';s.textContent=t('m_ready');setRunBtn();info();render();}
function del(list,i){const b=list[i];list.splice(i,1);if(ACTIVE===b.body||ACTIVE===b.els)ACTIVE=list;resetRunSoft();renderProg();}
function condSel(b){
  const s=document.createElement('select');
  [['front',0],['front',1],['right',0],['right',1],['left',0],['left',1],['goal',0],['goal',1]].forEach(([c,n])=>{const o=document.createElement('option');o.value=c+'|'+n;o.textContent=(n?t('c_no'):'')+t('c_'+c);if(b.c===c&&!!b.neg===!!n)o.selected=true;s.appendChild(o);});
  s.onclick=e=>e.stopPropagation();s.onchange=()=>{const [c,n]=s.value.split('|');b.c=c;b.neg=n==='1';resetRunSoft();};return s;
}
function renderList(list){
  const d=document.createElement('div');d.className='blist'+(list===ACTIVE?' active':'');
  d.onclick=e=>{e.stopPropagation();ACTIVE=list;renderProg();};
  if(!list.length){const em=document.createElement('div');em.className='em';em.textContent=t('empty');d.appendChild(em);}
  list.forEach((b,i)=>d.appendChild(renderBlock(b,list,i)));return d;
}
function renderBlock(b,list,i){
  const w=document.createElement('div');w.className='blk'+(b.body?' cont':'')+(cur===b.id?' run':'');w.dataset.id=b.id;
  const hd=document.createElement('div');hd.className='hd';
  const label=document.createElement('span');
  if(b.t==='F'||b.t==='L'||b.t==='R')label.textContent=t(NAMES[b.t]);
  else if(b.t==='rep'){label.textContent=t('b_rep');hd.appendChild(label);const inp=document.createElement('input');inp.type='number';inp.min=1;inp.max=20;inp.value=b.n;inp.onclick=e=>e.stopPropagation();inp.onchange=()=>{b.n=Math.max(1,Math.min(20,+inp.value||1));resetRunSoft();};hd.appendChild(inp);const tm=document.createElement('span');tm.textContent=t('times');hd.appendChild(tm);}
  else if(b.t==='while'){label.textContent=t('b_while');hd.appendChild(label);hd.appendChild(condSel(b));}
  else{label.textContent=t('b_if');hd.appendChild(label);hd.appendChild(condSel(b));}
  if(!hd.contains(label))hd.appendChild(label);
  const x=document.createElement('button');x.type='button';x.className='x';x.textContent='✕';x.setAttribute('aria-label','×');x.onclick=e=>{e.stopPropagation();del(list,i);};hd.appendChild(x);
  w.appendChild(hd);
  if(b.body){const k=document.createElement('div');k.className='kid';k.appendChild(renderList(b.body));w.appendChild(k);}
  if(b.els){const l=document.createElement('div');l.className='lbl';l.textContent=t('else');w.appendChild(l);const k=document.createElement('div');k.className='kid';k.appendChild(renderList(b.els));w.appendChild(k);}
  return w;
}
function renderProg(){const h=$('#prog');h.innerHTML='';h.appendChild(renderList(PROG));info();}
function render(){draw(cvo);renderProgHL();}
function renderProgHL(){$$('#prog .blk').forEach(e=>e.classList.toggle('run',+e.dataset.id===cur));}

/* ---- dibuix ---- */
const cvo=TEC.cv('#cv',W,H,draw);
function draw(o){
  const c=o.ctx,k=C(),R=MAP.length,Cn=MAP[0].length,s=Math.min((W-20)/Cn,(H-20)/R),ox=(W-s*Cn)/2,oy=(H-s*R)/2;
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  for(let r=0;r<R;r++)for(let q=0;q<Cn;q++){
    const x=ox+q*s,y=oy+r*s,ch=MAP[r][q];
    if(ch==='#'){c.fillStyle=k.dark?'#2a3550':'#8892a8';c.fillRect(x,y,s,s);c.strokeStyle=k.dark?'#1a2338':'#6a7488';c.lineWidth=1;c.strokeRect(x+.5,y+.5,s-1,s-1);}
    else{c.fillStyle=k.panel;c.fillRect(x,y,s,s);c.strokeStyle=k.line;c.lineWidth=1;c.strokeRect(x+.5,y+.5,s-1,s-1);}
    if(ch==='G'){c.fillStyle=k.ok;c.globalAlpha=.25;c.fillRect(x,y,s,s);c.globalAlpha=1;TEC.line(c,[[x+s*.35,y+s*.8],[x+s*.35,y+s*.2]],k.ink,3);c.beginPath();c.moveTo(x+s*.35,y+s*.2);c.lineTo(x+s*.8,y+s*.35);c.lineTo(x+s*.35,y+s*.5);c.closePath();c.fillStyle=k.ok;c.fill();}
    if(ch==='S'){c.fillStyle=k.pa;c.globalAlpha=.15;c.fillRect(x,y,s,s);c.globalAlpha=1;}
  }
  /* robot suau */
  const tx=rob.c,ty=rob.r;rob.x+=(tx-rob.x)*(REDUCE?1:.3);rob.y+=(ty-rob.y)*(REDUCE?1:.3);
  const ta=rob.d*Math.PI/2;let da=ta-rob.a;da=Math.atan2(Math.sin(da),Math.cos(da));rob.a+=da*(REDUCE?1:.35);
  const cx=ox+(rob.x+.5)*s,cy=oy+(rob.y+.5)*s;
  c.save();c.translate(cx,cy);c.rotate(rob.a);
  c.beginPath();c.rect(-s*.32,-s*.28,s*.64,s*.56);c.fillStyle=S.crash?k.warn:k.pa;c.fill();c.strokeStyle=k.ink;c.lineWidth=2;c.stroke();
  c.beginPath();c.moveTo(s*.42,0);c.lineTo(s*.2,-s*.14);c.lineTo(s*.2,s*.14);c.closePath();c.fillStyle='#fff';c.fill();
  c.beginPath();c.arc(s*.02,-s*.14,s*.06,0,TAU);c.arc(s*.02,s*.14,s*.06,0,TAU);c.fillStyle='#fff';c.fill();
  c.restore();
}

$('#run').onclick=()=>{
  if(S.done){resetRun();}
  S.run=!S.run;setRunBtn();if(S.run&&!gen&&!PROG.length){S.run=false;msg('m_empty','msg bad');setRunBtn();}
};
$('#stepb').onclick=()=>{if(S.done)resetRun();S.run=false;setRunBtn();stepOnce();};
$('#rst').onclick=()=>{resetRun();renderProgHL();};
$('#clr').onclick=()=>{PROG=[];ACTIVE=PROG;resetRun();renderProg();};
const spd=$('#spd');const spdUpd=()=>{speedDelay=1100-spd.value*100;$('#spd-o').textContent=spd.value;};spd.oninput=spdUpd;spdUpd();
let acc=0;
TEC.loop(dt=>{
  if(S.run){acc+=dt*1000;if(acc>=speedDelay){acc=0;stepOnce();}}
  draw(cvo);
});
function buildLv(){TEC.seg($('#lvsw'),[0,1,2,3,4].map(i=>({v:String(i),key:'lv'+(i+1)})),String(S.lv),v=>loadLevel(+v));}
const QDATA=[{"id":"q1","lvl":"all","type":"mc","n":4,"ans":1},{"id":"q2","lvl":"all","type":"mc","n":4,"ans":1},{"id":"q3","lvl":"basic","type":"num","num":2,"tol":0,"u":1},{"id":"q5","lvl":"basic","type":"mc","n":4,"ans":0},{"id":"q4","lvl":"adv","type":"mc","n":4,"ans":2},{"id":"q6","lvl":"adv","type":"mc","n":4,"ans":1}];
App.hooks.push(()=>{buildLv();buildPal();renderProg();task();setRunBtn();const m=$('#msg');if(!S.done&&!S.run&&!S.acts)m.textContent=t('m_ready');});
initQuiz(QDATA);
loadLevel(0);
initLang();applyLang();
