];
EV.forEach(e=>e.e=elOf(e.a));

/* barres */
const X0=60,XW=900;
const ROWS=[
 {k:'yr',t0:0,t1:SPY,y:46},
 {k:'dec',t0:334*86400,t1:SPY,y:118},
 {k:'day',t0:364*86400,t1:SPY,y:190},
 {k:'min',t0:SPY-60,t1:SPY,y:262}
];
const xo=(r,e)=>X0+XW*(e-r.t0)/(r.t1-r.t0);
const SM='style="fill:var(--muted)"',SI='style="fill:#1f2933"',SL='style="stroke:var(--muted)"';
let dotEls=[],mkEls={};
function seg(r,e0,e1,fill,label){
  const a=Math.max(e0,r.t0),b=Math.min(e1,r.t1);if(b<=a)return'';
  const x=xo(r,a),w=xo(r,b)-x;
  return '<rect x="'+x.toFixed(1)+'" y="'+r.y+'" width="'+w.toFixed(1)+'" height="26" fill="'+fill+'"/>'+(label&&w>58?'<text x="'+(x+w/2).toFixed(1)+'" y="'+(r.y+17)+'" text-anchor="middle" font-size="12" '+SI+'>'+label+'</text>':'');
}
function buildBars(){
  let s='';dotEls=[];mkEls={};
  const bd=[0,elOf(4000),elOf(2500),elOf(539),SPY],bdE=[0,elOf(252),elOf(66),SPY];
  const ecol=['#e7c9b8','#d9d2a6','#bcd9c6','#cfe8d5'],pcol=['#cfe8d5','#bfdcf0','#f3dcb0'];
  ROWS.forEach(r=>{
    s+='<text x="'+X0+'" y="'+(r.y-12)+'" font-size="13" font-weight="700" style="fill:var(--ink)">'+t(r.k)+'</text>';
    if(r.k==='yr'){for(let i=0;i<4;i++)s+=seg(r,bd[i],bd[i+1],ecol[i],EONS[LANG][i]);}
    else if(r.k==='dec'){
      s+=seg(r,r.t0,bdE[1],pcol[0],'')+seg(r,bdE[1],bdE[2],pcol[1],ERAS[LANG][1])+seg(r,bdE[2],bdE[3],pcol[2],ERAS[LANG][2]);
      s+='<text x="'+(X0+3)+'" y="'+(r.y+17)+'" font-size="12" '+SI+'>'+ERAS[LANG][0]+'</text>';
    }else s+='<rect x="'+X0+'" y="'+r.y+'" width="'+XW+'" height="26" fill="#cfe8d5"/>';
    s+='<rect x="'+X0+'" y="'+r.y+'" width="'+XW+'" height="26" fill="none" '+SL+'/>';
    const tk=(x,lab,dx)=>'<line x1="'+x+'" x2="'+x+'" y1="'+(r.y+26)+'" y2="'+(r.y+32)+'" '+SL+'/><text x="'+(x+dx)+'" y="'+(r.y+44)+'" font-size="11" '+SM+'>'+lab+'</text>';
    if(r.k==='yr'){let c=0;for(let m=0;m<12;m++){s+=tk(xo(r,c*86400),SH[LANG][m],2);c+=ML[m]}}
    if(r.k==='dec'){for(let d=1;d<=31;d+=5)s+=tk(xo(r,(333+d)*86400),d,2)}
    if(r.k==='day'){for(let h=0;h<=24;h+=3)s+=tk(xo(r,r.t0+h*3600),p2(h)+'h',-8)}
    if(r.k==='min'){for(let q=0;q<=60;q+=10)s+=tk(xo(r,r.t0+q),'23:59:'+(q===60?'60':p2(q)),-14)}
  });
  EV.forEach((ev,i)=>{
    ROWS.forEach(r=>{
      if(ev.e>=r.t0&&ev.e<=r.t1){
        const x=xo(r,ev.e);
        s+='<circle data-i="'+i+'" data-r="'+r.k+'" cx="'+x.toFixed(1)+'" cy="'+(r.y+13)+'" r="6" stroke-width="1.6" style="cursor:pointer"><title>'+ev.i+' '+L(ev.n)+'</title></circle>';
      }
    });
  });
  ROWS.forEach(r=>{s+='<g id="mk_'+r.k+'"><line x1="0" x2="0" y1="'+(r.y-6)+'" y2="'+(r.y+32)+'" stroke="#c0392b" stroke-width="2.4"/><path d="M-6,'+(r.y-8)+' L6,'+(r.y-8)+' L0,'+(r.y)+' Z" fill="#c0392b"/></g>'});
  $('#bars').innerHTML=s;
  dotEls=$$('circle',$('#bars'));
  ROWS.forEach(r=>mkEls[r.k]=$('#mk_'+r.k));
}
$('#bars').addEventListener('click',e=>{const c=e.target.closest('circle');if(c)goto(+c.dataset.i)});
function updBars(){
  const ink=C().ink;
  ROWS.forEach(r=>{
    const inside=curE>=r.t0;
    mkEls[r.k].setAttribute('transform','translate('+xo(r,Math.max(curE,r.t0)).toFixed(1)+',0)');
    mkEls[r.k].setAttribute('opacity',inside?1:.25);
  });
  dotEls.forEach(c=>{
    const i=+c.dataset.i,reached=EV[i].e<=curE+1e-6,isCur=(i===idx&&!tween);
    c.setAttribute('fill',reached?ink:C().stage);
    c.setAttribute('r',isCur?9:6);
    c.setAttribute('stroke',isCur?'#c0392b':ink);
  });
}
document.addEventListener('themechange',()=>{updBars()});

/* animació */
let idx=0,curE=EV[0].e,tween=null,playing=false,holdUntil=0;
const DUR=1700,HOLD=3600;
const spd=()=>parseFloat($('#spd').value);
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function goto(i){
  if(i<0||i>=EV.length)return;
  if(i===idx&&!tween)return;
  tween={from:curE,to:EV[i].e,t0:performance.now(),dur:(REDUCE?1:DUR)/spd(),toIdx:i};
  $('#card').classList.add('dim');
}
function frame(ts){
  if(tween){
    const p=Math.min(1,(ts-tween.t0)/tween.dur);
    curE=tween.from+(tween.to-tween.from)*ease(p);
    if(p>=1){curE=tween.to;idx=tween.toIdx;tween=null;holdUntil=ts+HOLD/spd();$('#card').classList.remove('dim');renderCard()}
  }else if(playing&&ts>=holdUntil){
    if(idx<EV.length-1)goto(idx+1);else{playing=false}
  }
  renderClock();updBars();renderBtn();
  requestAnimationFrame(frame);
}
function renderClock(){
  const o=dt(curE);
  $('#cdate').textContent=dateStr(o);
  $('#ctime').textContent=timeStr(o);
  $('#cago').textContent=fmtAge(ageOf(curE));
}
function renderCard(){
  const ev=EV[idx],o=dt(ev.e);
  let delta='';
  if(idx>0)delta='<br>'+t('since')+' <b>'+fmtDelta(ev.e-EV[idx-1].e)+'</b>';
  $('#card').innerHTML='<div class="ic">'+ev.i+'</div><h3>'+L(ev.n)+'</h3><div>'+L(ev.f)+'</div><div class="meta">'+dateStr(o)+' · '+timeStr(o)+' · '+fmtAge(ev.a)+delta+'</div>';
}
function renderBtn(){
  const k=playing?'pause':(idx>=EV.length-1&&!tween?'again':'play'),b=$('#bPlay');
  if(b.dataset.i18n!==k){b.dataset.i18n=k;b.textContent=t(k)}
}
$('#bPlay').onclick=()=>{
  if(!playing&&idx>=EV.length-1&&!tween){idx=0;curE=EV[0].e;renderCard()}
  playing=!playing;holdUntil=0;
};
$('#bNext').onclick=()=>{playing=false;goto((tween?tween.toIdx:idx)+1)};
$('#bPrev').onclick=()=>{playing=false;goto((tween?tween.toIdx:idx)-1)};
$('#bReset').onclick=()=>{playing=false;tween=null;idx=0;curE=EV[0].e;$('#card').classList.remove('dim');renderCard()};

/* convertidors i taula */
function conv1(){
  const v=parseFloat($('#v1').value),u=parseFloat($('#u1').value);
  if(!(v>=0)){$('#r1').textContent='';return}
  const a=v*u/1e6;
  if(a>TA){$('#r1').textContent=t('tooold');return}
  const o=dt(elOf(a));
  $('#r1').textContent=dateStr(o)+' · '+timeStr(o);
}
function conv2(){
  const v=parseFloat($('#v2').value),u=parseFloat($('#u2').value);
  if(!(v>=0)){$('#r2').textContent='';return}
  $('#r2').textContent='≈ '+fmtYears(v*u*TA*1e6/SPY);
}
['v1','u1'].forEach(i=>$('#'+i).addEventListener('input',conv1));
['v2','u2'].forEach(i=>$('#'+i).addEventListener('input',conv2));
function renderTab(){
  $('#tab').innerHTML='<tr><th>'+t('tev')+'</th><th>'+t('twhen')+'</th><th>'+t('tago')+'</th></tr>'+EV.map((e,i)=>{const o=dt(e.e);return'<tr class="row" data-i="'+i+'"><td>'+e.i+' '+L(e.n)+'</td><td>'+dateStr(o)+' · '+timeStr(o)+'</td><td>'+fmtAge(e.a)+'</td></tr>'}).join('');
}
$('#tab').addEventListener('click',e=>{const r=e.target.closest('tr.row');if(!r)return;playing=false;goto(+r.dataset.i);window.scrollTo({top:0,behavior:REDUCE?'auto':'smooth'})});
function renderScale(){
  const yps=TA*1e6/SPY;
  $('#scale').innerHTML='<b>'+t('eq')+':</b> '+t('m1')+' ≈ '+nfo(TA/12,{maximumFractionDigits:0})+' Ma · '+t('d1')+' ≈ '+nfo(yps*86400/1e6,{maximumFractionDigits:1})+' Ma · '+t('h1x')+' ≈ '+nfo(yps*3600/1e6,{maximumFractionDigits:2})+' Ma · '+t('n1')+' ≈ '+nfo(Math.round(yps*60))+' '+t('anys')+' · '+t('s1x')+' ≈ '+nfo(Math.round(yps))+' '+t('anys');
}
function refresh(){buildBars();renderCard();renderBtn();renderTab();renderScale();conv1();conv2()}
document.addEventListener('langchange',refresh);

const QDATA=[{"id":"m5","lvl":"all","type":"num","num":144,"tol":0.03,"u":1},
{"id":"m1","lvl":"all","type":"mc","n":3,"ans":1},
{"id":"m2","lvl":"all","type":"mc","n":3,"ans":1},
{"id":"m3","lvl":"all","type":"mc","n":3,"ans":1},
{"id":"m4","lvl":"all","type":"mc","n":3,"ans":0}];
initQuiz(QDATA);
initLang();applyLang();
requestAnimationFrame(frame);
</script>
