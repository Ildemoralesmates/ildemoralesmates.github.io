/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/

.duel{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.cmp{font-family:var(--f-num);font-size:15px;line-height:1.8}

</head>

    </div>
    <div class="topr">

      <p class="lede" data-i18n="lede"></p>

<p data-i18n-html="story"></p>

<div class="simgrid">
<div class="simcv"><canvas id="cv"></canvas></div>
<div class="side">
<p class="level" id="level" aria-live="polite"></p>
<div class="cmp" id="cmp"></div>
</div>
</div>
<div class="idea" data-lvl="basic" data-i18n-html="idea_basic"></div>
<div class="idea" data-lvl="adv" data-i18n-html="idea_adv"></div>
</section>

<!--@RAONA@-->

<p class="msg" id="cmsg" aria-live="polite"></p>

</section>

<!--@QUIZ@-->
  </main>

/* ===== Zoom a la recta ===== */
const W=900,H=250,cx=fitCanvas($('#cv'),W,H);
const HOME={c:0.5,span:1.2},MINS=1.2e-6,MAXS=24;
let view={...HOME},anim=null,hiSeg=null,pts=[{v:0.15,cls:'a'},{v:0.2,cls:'b'}];
const LY=150;
const pow10=e=>e>=0?Math.pow(10,e):1/Math.pow(10,-e);
const val=(i,e)=>e>=0?i*Math.pow(10,e):i/Math.pow(10,-e);
const fmtD=(v,d)=>{let s=Math.abs(v)<1e-12?(0).toFixed(d):v.toFixed(d);return s.replace('-','−').replace('.',',');};
function decs(v){for(let d=0;d<=6;d++){if(Math.abs(Math.round(v*pow10(d))-v*pow10(d))<1e-7)return d;}return 6;}
function labelLevel(span){let e=Math.floor(Math.log10(span))-3;while(pow10(e)/span*W<52)e++;return e;}
function goTo(c,span,seg){span=clamp(span,MINS,MAXS);anim={c0:view.c,s0:view.span,c1:c,s1:span,t:0};hiSeg=seg||null;if(REDUCE){view={c,span};anim=null;hiSeg=null;}}
$('#zin').onclick=()=>{const e=labelLevel(view.span),st=pow10(e),k=Math.floor(view.c/st+1e-9);goTo((k+.5)*st,st*1.25,[k*st,(k+1)*st]);};
$('#zout').onclick=()=>goTo(view.c,view.span*10);
$('#home').onclick=()=>goTo(HOME.c,HOME.span);
$('#left').onclick=()=>goTo(view.c-view.span*0.4,view.span);
$('#right').onclick=()=>goTo(view.c+view.span*0.4,view.span);
$('#cv').addEventListener('click',ev=>{
  const r=$('#cv').getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width;
  const v=view.c+(x-W/2)/W*view.span,e=labelLevel(view.span),st=pow10(e),k=Math.floor(v/st);
  goTo((k+.5)*st,st*1.25,[k*st,(k+1)*st]);
});
function fitPair(a,b){const lo=Math.min(a,b),hi=Math.max(a,b),dd=hi-lo;
  const span=dd>0?Math.max(dd*2.6,MINS):0.12;goTo((lo+hi)/2,span);}
function readPts(){
  const a=parseNum($('#na').value),b=parseNum($('#nb').value);
  if(![a,b].every(x=>Number.isFinite(x)&&Math.abs(x)<=10)||$('#na').value.trim()===''||$('#nb').value.trim()===''){$('#cmp').innerHTML='<span class="msg bad">'+t('bad_num')+'</span>';return false;}
  pts=[{v:a,cls:'a'},{v:b,cls:'b'}];cmpText();fitPair(a,b);return true;
}
$('#place').onclick=readPts;
['na','nb'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')readPts();}));
function cmpText(){
  const [A,B]=pts,d=Math.max(decs(A.v),decs(B.v)),sa=fmtD(A.v,d),sb=fmtD(B.v,d);
  let h=tt('cmp_eq',sa,sb)+'<br>';
  if(Math.abs(A.v-B.v)<1e-12) h+=tt('cmp_same',sa,sb);
  else{const lo=A.v<B.v?A:B,hi=A.v<B.v?B:A;
    h+=tt('cmp_lt',fmtD(lo.v,d),fmtD(hi.v,d),lo.cls,hi.cls);
    if(d>=1&&d<=6&&A.v>=0&&B.v>=0&&Math.floor(A.v)===Math.floor(B.v)){
      const ia=Math.round((A.v-Math.floor(A.v))*pow10(d)),ib=Math.round((B.v-Math.floor(B.v))*pow10(d));
      h+='<br>'+tt('cmp_units',t('u'+d),'<span class="a">'+ia+'</span>',ia<ib?'&lt;':'&gt;','<span class="b">'+ib+'</span>');}
  }
  $('#cmp').innerHTML=h;
}
function levelText(){const e=labelLevel(view.span);const k=e>=1?'lvlbig':'lvl'+clamp(-e,0,6);$('#level').innerHTML=t(k);}
let lastLvl=null;
function draw(){
  const ink=css('--ink'),mut=css('--muted'),pa=css('--pa'),pb=css('--pb');
  cx.fillStyle=css('--stage');cx.fillRect(0,0,W,H);
  const {c,span}=view,L=c-span/2,R=c+span/2,X=v=>(v-L)/span*W;
  if(hiSeg){cx.fillStyle=css('--warn');cx.globalAlpha=.15;cx.fillRect(X(hiSeg[0]),LY-60,X(hiSeg[1])-X(hiSeg[0]),95);cx.globalAlpha=1;}
  cx.strokeStyle=ink;cx.lineWidth=2;cx.beginPath();cx.moveTo(0,LY);cx.lineTo(W,LY);cx.stroke();
  const le=labelLevel(span);
  for(let e=Math.floor(Math.log10(span))-3;e<=Math.ceil(Math.log10(span))+1;e++){
    const st=pow10(e),px=st/span*W;if(px<4)continue;
    const hgt=clamp(5+9*Math.log10(px/4),4,34),al=clamp((px-4)/30,0,1);
    const i0=Math.ceil(L/st-1e-9),i1=Math.floor(R/st+1e-9);
    if(i1-i0>400)continue;
    cx.strokeStyle=ink;cx.globalAlpha=al;cx.lineWidth=e>=le+1?2.4:1.4;cx.beginPath();
    for(let i=i0;i<=i1;i++){const x=X(val(i,e));cx.moveTo(x,LY-hgt);cx.lineTo(x,LY+hgt*0.4);}
    cx.stroke();cx.globalAlpha=1;
    if(e===le||e===le+1){
      const dd=Math.max(0,-le);
      for(let i=i0;i<=i1;i++){
        if(e===le&&i%10===0)continue;
        const v=val(i,e),x=X(v);if(x<26||x>W-26)continue;
        cx.fillStyle=e===le+1?ink:mut;cx.font=(e===le+1?'bold 17px ':'14px ')+'ui-monospace,Menlo,Consolas,monospace';
        cx.textAlign='center';cx.fillText(fmtD(v,e===le+1?Math.max(0,-e):dd),x,LY+(e===le+1?40:30));
      }
    }
  }
  /* punts */
  pts.forEach((p,j)=>{const x=X(p.v);if(x<-40||x>W+40)return;const col=p.cls==='a'?pa:pb;
    const y=LY-50-j*26;
    cx.strokeStyle=col;cx.lineWidth=2;cx.setLineDash([3,3]);cx.beginPath();cx.moveTo(x,y+8);cx.lineTo(x,LY);cx.stroke();cx.setLineDash([]);
    cx.beginPath();cx.arc(x,LY,6,0,TAU);cx.fillStyle=col;cx.fill();
    const s=fmtD(p.v,decs(p.v));cx.font='bold 16px ui-monospace,Menlo,Consolas,monospace';const w=cx.measureText(s).width+14;
    cx.fillStyle=col;rrect(cx,x-w/2,y-12,w,22,6);cx.fill();cx.fillStyle=css('--panel');cx.textAlign='center';cx.textBaseline='middle';cx.fillText(s,x,y);cx.textBaseline='alphabetic';});
  /* fletxes si estan fora */
  pts.forEach((p,j)=>{const x=X(p.v);if(x>=-40&&x<=W+40)return;const col=p.cls==='a'?pa:pb;cx.fillStyle=col;cx.font='bold 14px system-ui';
    cx.textAlign=x<0?'left':'right';cx.fillText((x<0?'◀ ':'')+fmtD(p.v,decs(p.v))+(x>W?' ▶':''),x<0?8:W-8,24+j*20);});
  const lv=labelLevel(view.span);if(lv!==lastLvl){lastLvl=lv;levelText();}
}
function loop(){
  if(anim){anim.t=Math.min(1,anim.t+1/48);const k=anim.t<.5?2*anim.t*anim.t:1-Math.pow(-2*anim.t+2,2)/2;
    const ls=lerp(Math.log(anim.s0),Math.log(anim.s1),k);view={c:lerp(anim.c0,anim.c1,k),span:Math.exp(ls)};
    if(anim.t>=1){view={c:anim.c1,span:anim.s1};anim=null;setTimeout(()=>{if(!anim)hiSeg=null;},700);}}
  draw();requestAnimationFrame(loop);
}
