</div>
</section>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@RAONA_JS@*/
(function(){
/* ===== Pla inclinat ===== */
const g=9.8,RL=480,A={x:110,y:500},BW=64,BH=42,PXM=100,W=900,H=540;
const S0=400,SMIN=BW/2+4;
const cx=fitCanvas($('#cv'),W,H);
let s=S0,v=0,running=false,last=null;
const f1=(x,d=1)=>fmt(x,d);
const fa=x=>f1(x,1).replace(/,0$/,'');   /* angle o μ sense decimals de més */
const fm=x=>f1(x,2).replace(/,?0+$/,'');
const rad=d=>d*Math.PI/180;
const slidesAt=(th,mu)=>th>0&&Math.tan(rad(th))>mu+1e-9;
const accAt=(th,mu)=>slidesAt(th,mu)?g*(Math.sin(rad(th))-mu*Math.cos(rad(th))):0;
function pal(){return C().dark?
  {wedge:'#222a3b',edge:'#6b7590',block:'#4a7fb5',bedge:'#9db8d8',P:'#ff6b5b',Px:'#f0b24a',Py:'#b58cff',N:'#4cd08a',Fr:'#aab2c5',ang:'#76a2ff',dash:'#7d869b'}:
  {wedge:'#e6e2d6',edge:'#8a8570',block:'#4a7fb5',bedge:'#1f3f66',P:'#c0392b',Px:'#d68910',Py:'#7d3c98',N:'#1e8449',Fr:'#555555',ang:'#2b6cb0',dash:'#999999'};}
function state(){
  const th=parseFloat($('#th').value)*Math.PI/180,m=parseFloat($('#m').value),mu=parseFloat($('#mu').value);
  const P=m*g,Px=P*Math.sin(th),Py=P*Math.cos(th),N=Py;
  const slides=Math.tan(th)>mu+1e-9&&th>0;
  const Fr=slides?mu*N:Px,a=slides?g*(Math.sin(th)-mu*Math.cos(th)):0;
  return {th,m,mu,P,Px,Py,N,Fr,a,slides};
}
function arrow(x0,y0,dx,dy,color,label,o){
  o=o||{};const len=Math.hypot(dx,dy);if(len<3)return;
  const x1=x0+dx,y1=y0+dy,ang=Math.atan2(dy,dx),h=11;
  cx.save();cx.strokeStyle=color;cx.fillStyle=color;cx.lineWidth=o.w||3;
  cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1-Math.cos(ang)*h*.6,y1-Math.sin(ang)*h*.6);cx.stroke();
  cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x1-h*Math.cos(ang-.4),y1-h*Math.sin(ang-.4));cx.lineTo(x1-h*Math.cos(ang+.4),y1-h*Math.sin(ang+.4));cx.closePath();cx.fill();
  if(label){cx.font='bold 16px system-ui';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(label,x1+Math.cos(ang)*16+(o.lx||0),y1+Math.sin(ang)*16+(o.ly||0));}
  cx.restore();
}
const setTxt=(el,x)=>{if(el.textContent!==x)el.textContent=x;};
function draw(){
  const st=state(),th=st.th,cs=Math.cos(th),sn=Math.sin(th),K=pal();
  cx.clearRect(0,0,W,H);
  const B={x:A.x+RL*cs,y:A.y},Cc={x:A.x+RL*cs,y:A.y-RL*sn};
  cx.fillStyle=K.wedge;cx.strokeStyle=K.edge;cx.lineWidth=2;
  cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.lineTo(Cc.x,Cc.y);cx.closePath();cx.fill();cx.stroke();
  cx.beginPath();cx.moveTo(A.x-40,A.y);cx.lineTo(B.x+40,B.y);cx.stroke();
  if($('#ang').checked&&th>.01){
    cx.strokeStyle=K.ang;cx.lineWidth=2;cx.beginPath();cx.arc(A.x,A.y,70,-th,0);cx.stroke();
    cx.fillStyle=K.ang;cx.font='bold 17px system-ui';cx.textAlign='left';cx.textBaseline='middle';
    cx.fillText('θ',A.x+80,A.y-Math.max(10,Math.min(th*30,25))+(th<.3?-6:0));
  }
  const cx0=A.x+s*cs,cy0=A.y-s*sn;
  cx.save();cx.translate(cx0,cy0);cx.rotate(-th);
  cx.fillStyle=K.block;cx.strokeStyle=K.bedge;cx.lineWidth=2;cx.fillRect(-BW/2,-BH,BW,BH);cx.strokeRect(-BW/2,-BH,BW,BH);
  cx.fillStyle='#fff';cx.font='bold 15px system-ui';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(f1(st.m,1).replace(',0','')+' kg',0,-BH/2);cx.restore();
  const n={x:-sn,y:-cs},u={x:cs,y:-sn},G={x:cx0+n.x*BH/2,y:cy0+n.y*BH/2},k=150/st.P;
  arrow(G.x,G.y,0,st.P*k,K.P,'P',{w:4,ly:6});
  if($('#comp').checked&&th>.01){
    const pxv={x:-u.x*st.Px*k,y:-u.y*st.Px*k},pyv={x:-n.x*st.Py*k,y:-n.y*st.Py*k};
    cx.save();cx.strokeStyle=K.dash;cx.setLineDash([5,5]);cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(G.x+pxv.x,G.y+pxv.y);cx.lineTo(G.x,G.y+st.P*k);cx.moveTo(G.x+pyv.x,G.y+pyv.y);cx.lineTo(G.x,G.y+st.P*k);cx.stroke();cx.restore();
    arrow(G.x,G.y,pxv.x,pxv.y,K.Px,'P∥',{w:3.5,lx:-8,ly:8});
    arrow(G.x,G.y,pyv.x,pyv.y,K.Py,'P⊥',{w:3.5,lx:-10,ly:10});
  }
  if($('#n').checked)arrow(G.x,G.y,n.x*st.N*k,n.y*st.N*k,K.N,'N',{w:3.5,lx:-10,ly:-6});
  if($('#fr').checked&&st.mu>0&&th>.01)arrow(G.x,G.y,u.x*st.Fr*k,u.y*st.Fr*k,K.Fr,'Fr',{w:3,lx:8,ly:-8});
  if($('#ang').checked&&th>.01){
    cx.strokeStyle=K.ang;cx.lineWidth=2;cx.beginPath();cx.arc(G.x,G.y,42,Math.PI/2-th,Math.PI/2);cx.stroke();
    const am=Math.PI/2-th/2;cx.fillStyle=K.ang;cx.font='bold 15px system-ui';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('θ',G.x+Math.cos(am)*58,G.y+Math.sin(am)*58);
  }
  setTxt($('#vth'),f1(th*180/Math.PI,1)+'°');setTxt($('#vm'),f1(st.m,1)+' kg');setTxt($('#vmu'),f1(st.mu,2));
  setTxt($('#oP'),f1(st.P)+' N');setTxt($('#oPx'),f1(st.Px)+' N');setTxt($('#oPy'),f1(st.Py)+' N');setTxt($('#oN'),f1(st.N)+' N');
  setTxt($('#oFr'),st.mu>0?f1(st.Fr)+' N':'—');setTxt($('#oA'),f1(st.a,2)+' m/s²');
  const key=th<.01?'pla':!st.slides?'eq':st.mu===0?'lliure':'llisca';
  setTxt($('#msg'),t('msg_'+key));
}
function setGo(){setTxt($('#go'),t(running?'pause':'go'));}
function toggleGo(){
  if(running){running=false;setGo();return;}
  if(s<=SMIN+.5){s=S0;v=0;}
  running=true;setGo();
}
function loop(ts){
  if(last===null)last=ts;
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  if(running){const st=state();
    if(st.slides){v+=st.a*dt;s-=v*dt*PXM;if(s<=SMIN){s=SMIN;v=0;running=false;setGo();}}
    else v=0;}
  draw();requestAnimationFrame(loop);
}
$('#go').addEventListener('click',toggleGo);
$('#reset').addEventListener('click',()=>{running=false;s=S0;v=0;setGo();});
['th','m','mu'].forEach(id=>$('#'+id).addEventListener('input',()=>{v=0;}));
document.addEventListener('themechange',draw);
App.hooks.push(setGo);

/* ===== Raona-ho ===== */
function load(th,m,mu,run){
  $('#th').value=clamp(+th,0,80);$('#m').value=clamp(+m,1,10);$('#mu').value=clamp(+mu,0,1);
  ['comp','n','fr','ang'].forEach(k=>{$('#'+k).checked=true;});
  running=false;s=S0;v=0;setGo();if(run)toggleGo();
  RZ.show($('#cv'));
}
const inTh=a=>a>=0&&a<=80, inMu=x=>x>=0&&x<=1;
const ckTh=f=>([a])=>inTh(a)?f(a):{k:'rng'};
const cos=a=>Math.cos(rad(a)), sin=a=>Math.sin(rad(a)), tan=a=>Math.tan(rad(a));
const THF={l:'l_th',u:'°'}, MUF={l:'l_mu'};
RZ.init({
 sim:([a,b,c,d])=>load(a,b,c,d),
 M:[
  {id:'m1',f:[THF],sim:([a])=>load(a,5,0),ok:()=>({k:'m1_ok'}),
   chk:ckTh(a=>Math.abs(a-60)<1e-6?null:{k:'m1_f',p:[fa(a),f1(5*g*cos(a),1),f1(100*cos(a),0)]})},
  {id:'m2',f:[THF],sim:([a])=>load(a,5,0,true),ok:()=>({k:'m2_ok'}),
   chk:ckTh(a=>Math.abs(g*sin(a)-4.9)<.05?null:{k:'m2_f',p:[fa(a),f1(g*sin(a),2)]})},
  {id:'m3',f:[MUF],sim:([x])=>load(30,5,x),ok:()=>({k:'m3_ok'}),
   chk:([x])=>!inMu(x)?{k:'rng'}:x<.575?{k:'m3_lli',p:[fm(x),f1(accAt(30,x),2)]}:x>.585?{k:'m3_mes',p:[fm(x)]}:null},
  {id:'m4',f:[THF],sim:([a])=>load(a,5,1),ok:()=>({k:'m4_ok'}),
   chk:ckTh(a=>a===45?null:a>45?{k:'m4_lli',p:[fa(a),f1(accAt(a,1),2)]}:{k:'m4_poc',p:[fa(a)]})}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>load(30,10,0,true)},
  {id:'s2',ans:'M',sim:()=>load(20,5,0)},
  {id:'s3',ans:'D',f:[THF],cxsim:([a])=>load(a,5,0),
   cxok:([a])=>({k:'s3_cx',p:[fa(a),f1(5*g*cos(a),1),f1(5*g,1)]}),
   cx:ckTh(a=>a>0?null:{k:'s3_cx_no'})},
  {id:'s4',ans:'D',f:[THF,MUF],cxsim:([a,x])=>load(a,5,x),
   cxok:([a,x])=>({k:'s4_cx',p:[fa(a),fm(x),f1(5*g*sin(a),1),f1(x*5*g*cos(a),1)]}),
   cx:([a,x])=>!inTh(a)||!inMu(x)?{k:'rng'}:(a<=0||x<=0)?{k:'s4_cx_zero'}:!(tan(a)<x-1e-9)?{k:'s4_cx_slide',p:[fa(a),fm(x)]}:null},
  {id:'s5',ans:'S',sim:()=>load(25,5,.6)},
  {id:'s6',ans:'S',sim:()=>load(40,5,.3,true)}
 ],
 E:[{id:'e1',who:1,args:[30,8,0,true]},{id:'e2',who:0,args:[40,5,0]},{id:'e3',who:3,args:[20,10,.6]}],
 D:[
  {id:'d1',chips:{vals:[10,15,20,25],fmt:x=>x+'°'},f:[{l:'d1.l0',u:'m/s²'}],sim:()=>load(20,8,.3,true),ok:()=>({k:'d1_ok'}),
   chk:([p,a])=>p<20?{k:'d1_poc',p:[p,f1(tan(p),2)]}:p>20?{k:'d1_mes',p:[p]}:Math.abs(a-.59)>.03?{k:'d1_a'}:null},
  {id:'d2',chips:{vals:[.4,.6,.8,1]},f:[{l:'d2.l0',u:'N'}],sim:()=>load(35,5,.8),ok:()=>({k:'d2_ok'}),
   chk:([p,fr])=>p<.8?{k:'d2_lli',p:[fm(p)]}:p>.8?{k:'d2_mes',p:[fm(p)]}:Math.abs(fr-28.1)<=.3?null:Math.abs(fr-32.1)<=.3?{k:'d2_naive'}:{k:'d2_fr'}}
 ]
});
initQuiz([]);
initLang();applyLang();
requestAnimationFrame(loop);
})();
</script>
