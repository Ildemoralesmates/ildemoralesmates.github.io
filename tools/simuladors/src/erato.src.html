<title>Garbell d'Eratòstenes</title>

/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
:root{--tint-s:68%;--tint-l:83%;--ring-l:36%;--cols:20}

@media (max-width:640px){:root{--cols:10}}
@media (max-width:820px){.side{order:-1}}
.board{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.c{position:relative;aspect-ratio:1.1/1;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(9px,1.2vw,13px);color:var(--ink);transition:background .25s,color .25s;user-select:none}
@media (max-width:640px){.c{font-size:13px;aspect-ratio:1.3/1}}
.c::after{content:"";position:absolute;left:14%;right:14%;top:50%;height:2px;background:hsl(var(--h,0) 60% var(--ring-l));border-radius:2px;transform:rotate(-32deg) scaleX(0);transform-origin:left center;transition:transform .25s ease-out}
.c.one{color:var(--muted)}
.c.x{background:hsl(var(--h) var(--tint-s) var(--tint-l));color:var(--muted);transition-delay:var(--d,0ms)}
.c.x::after{transform:rotate(-32deg) scaleX(1);transition-delay:var(--d,0ms)}
.c.p{font-weight:600;box-shadow:inset 0 0 0 2px hsl(var(--h) 62% var(--ring-l));border-radius:50%}
.c.hl{outline:3px solid var(--pb);outline-offset:-3px;z-index:1;font-weight:700}
.grid.done .c:not(.x):not(.one){font-weight:600;color:var(--pa);background:color-mix(in srgb,var(--pa) 12%,transparent)}
.primes{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{font:inherit;cursor:pointer;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;min-width:58px;padding:5px 10px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1;transition:background .2s,border-color .2s,transform .1s}
.pbtn .n{font-family:var(--f-num);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}
.pbtn .s{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:3px}
.pbtn .sw{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 65% 52%);display:inline-block}
.pbtn:hover{border-color:hsl(var(--h) 60% 50%)}
.pbtn:active{transform:scale(.96)}
.pbtn[aria-pressed="true"]{background:hsl(var(--h) var(--tint-s) var(--tint-l));border-color:hsl(var(--h) 62% var(--ring-l))}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.status{font-size:14px}
.status b{font-family:var(--f-num)}
code{font-family:var(--f-num)}
@media (prefers-reduced-motion:reduce){.c,.c::after,.pbtn{transition:none!important}}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>
<div class="simgrid">
<div class="simcv"><div class="board"><div class="grid" id="grid" role="group" data-i18n-aria="aria.grid" aria-label=""></div></div></div>
<div class="side">
<fieldset>
<legend data-i18n="plabel"></legend>
<div class="primes" id="primes"></div>
<div class="btns">
<button class="btn primary" id="play" type="button" data-i18n="play"></button>
<button class="btn" id="reset" type="button" data-i18n="reset"></button>
</div>
<div class="status" id="status" aria-live="polite"></div>
</fieldset>
<p class="note" data-i18n-html="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->

  </main>
  <!--@FOOTER@-->
</div>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@RAONA_JS@*/
/* ===== Garbell d'Eratòstenes ===== */
const N=500,PR=[2,3,5,7,11,13,17,19];
const HUE={2:8,3:212,5:135,7:275,11:335,13:45,17:180,19:95};
let active=[],owner=new Array(N+1).fill(0),stat={k:'hint0',p:[]},doneTimer=null,playToken=0;
const grid=$('#grid'),primesEl=$('#primes'),statusEl=$('#status'),playBtn=$('#play');
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cells=[],btns={};
for(let n=1;n<=N;n++){
  const d=document.createElement('div');d.className='c'+(n===1?' one':'');d.textContent=n;
  grid.appendChild(d);cells[n]=d;
}
cells[1].style.setProperty('--h',0);
PR.forEach(p=>{
  const b=document.createElement('button');b.type='button';b.className='pbtn';
  b.style.setProperty('--h',HUE[p]);b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="n">'+p+'</span><span class="s"><i class="sw"></i>×'+p+'</span>';
  b.addEventListener('click',()=>{playToken++;toggle(p);});
  primesEl.appendChild(b);btns[p]=b;
});
const ownerOf=(m,act)=>{for(const p of act)if(m!==p&&m%p===0)return p;return 0;};
function setStat(k,p){stat={k:k,p:p||[]};showStat();}
function showStat(){
  if(stat.k==='newmleft')statusEl.innerHTML=tt('newm',stat.p[0],stat.p[1])+tt('left',stat.p[2]);
  else statusEl.innerHTML=tt(stat.k,...stat.p);
}
function refresh(focus,mark){
  const fresh=[],next=new Array(N+1).fill(0);
  for(let m=2;m<=N;m++){next[m]=ownerOf(m,active);if(next[m]&&!owner[m])fresh.push(m);}
  const step=reduce?0:Math.min(30,1500/Math.max(fresh.length,1)),fi={};
  fresh.forEach((v,i)=>{fi[v]=i;});
  for(let k=2;k<=N;k++){
    const el=cells[k],o=next[k];
    if(o){el.style.setProperty('--h',HUE[o]);el.style.setProperty('--d',(fi[k]!==undefined?Math.round(fi[k]*step):0)+'ms');el.classList.add('x');el.title=k+' = '+o+' × '+(k/o);}
    else{el.classList.remove('x');el.style.removeProperty('--d');el.removeAttribute('title');}
    if(active.indexOf(k)!==-1){el.style.setProperty('--h',HUE[k]);el.classList.add('p');}else el.classList.remove('p');
    el.classList.toggle('hl',k===mark);
  }
  owner=next;
  PR.forEach(p=>btns[p].setAttribute('aria-pressed',active.indexOf(p)!==-1?'true':'false'));
  const total=Math.round(fresh.length*step)+350;
  let left=0;for(let m=2;m<=N;m++)if(!owner[m])left++;
  clearTimeout(doneTimer);
  if(active.length===PR.length){doneTimer=setTimeout(()=>grid.classList.add('done'),total);setStat('all',[left]);}
  else{
    grid.classList.remove('done');
    if(focus&&active.indexOf(focus)!==-1)setStat('newmleft',[focus,fresh.length,left]);
    else setStat('left',[left]);
  }
  return total;
}
function toggle(p){const i=active.indexOf(p);if(i===-1)active.push(p);else active.splice(i,1);return refresh(p);}
function reset(){playToken++;active=[];grid.classList.remove('done');refresh(0);playBtn.disabled=false;setStat('hint0');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){
  reset();const my=++playToken;playBtn.disabled=true;await sleep(300);
  for(const p of PR){if(my!==playToken)return;const t0=toggle(p);await sleep(t0+(reduce?300:500));}
  if(my===playToken)playBtn.disabled=false;
}
playBtn.addEventListener('click',play);$('#reset').addEventListener('click',reset);
active=[2,3];refresh(0);setStat('init');
App.hooks.push(showStat);
/* ===== Raona-ho ===== */
function show(act,mark){
  playToken++;active=act.slice();owner=new Array(N+1).fill(0);grid.classList.remove('done');
  refresh(0,mark);RZ.show($('#grid'));
}
const ALL=PR;
const isI=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;
const sp=n=>{for(let p=2;p*p<=n;p++)if(n%p===0)return p;return n;};
const isPrime=n=>n>1&&sp(n)===n;
const RNG={k:'rng'};
const unstruck=act=>{let c=0;for(let m=2;m<=N;m++)if(!ownerOf(m,act))c++;return c;};
RZ.init({
 F:{n:{l:'f_n'}},
 sim:v=>show(...v),
 M:[
  {id:'m1',f:['n'],sim:([n])=>show(ALL,isI(n,2,499)?n:121),ok:([n])=>({k:'m1_ok',p:()=>[n,sp(n),n/sp(n)]}),
   chk:([n])=>!isI(n,2,499)?RNG:isPrime(n)?{k:'m1_prime',p:[n]}:[2,3,5,7].some(p=>n%p===0)?{k:'m1_small',p:()=>[n,sp(n),n/sp(n)]}:null},
  {id:'m2',f:['n'],sim:()=>show([7]),ok:()=>({k:'m2_ok'}),
   chk:([n])=>!isI(n,0,500)?RNG:n===71?{k:'m2_inc'}:n===70?null:{k:'m2_f'}},
  {id:'m3',f:['n'],sim:()=>show([2,3,5,7,11,13],169),ok:()=>({k:'m3_ok'}),
   chk:([n])=>!isI(n,2,499)?RNG:n%13!==0?{k:'m3_f',p:[n]}:n===169?null:{k:'m3_small',p:()=>{const q=sp(n);return [n,q,n/q];}}},
  {id:'m4',f:['n'],sim:()=>show(ALL,499),ok:()=>({k:'m4_ok'}),
   chk:([n])=>!isI(n,2,499)?RNG:!isPrime(n)?{k:'m4_comp',p:()=>{const q=sp(n);return [n,q,n/q];}}:n===499?null:{k:'m4_less',p:[n]}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>show(ALL)},
  {id:'s2',ans:'M',sim:()=>show([],1)},
  {id:'s3',ans:'D',f:['n'],cxsim:([n])=>show([2,3],isI(n,2,499)?n:25),
   cx:([n])=>!isI(n,2,499)?RNG:n%2===0||n%3===0?{k:'s3_cx_no',p:[n]}:isPrime(n)?{k:'s3_cx_prime',p:[n]}:null,
   sim:()=>show([2,3],25)},
  {id:'s4',ans:'S',sim:()=>show(ALL)},
  {id:'s5',ans:'S',sim:()=>show([2,3,5,7],49)},
  {id:'s6',ans:'M',sim:()=>show(ALL)}
 ],
 E:[{id:'e1',who:1,args:[ALL,23]},{id:'e2',who:0,args:[[7],91]},{id:'e3',who:3,args:[[2,3,5,7,11,13,17,19],20]},{id:'e4',who:2,args:[[],1]}],
 D:[
  {id:'d1',f:[{l:'d1.l0'}],sim:()=>show([2,3]),ok:()=>({k:'d1_ok'}),
   chk:([n])=>n!==unstruck([2,3])?{k:'d1_n'}:null},
  {id:'d2',chips:{vals:[2,3,5,7]},sim:()=>show([7],49),ok:()=>({k:'d2_ok'}),
   chk:([p])=>p===7?null:{k:'d2_no',p:[p]}},
  {id:'d3',chips:{vals:[7,11,13,17]},sim:null,ok:()=>({k:'d3_ok'}),
   chk:([p])=>p===13?null:p>13?{k:'d3_big',p:[p,p*p]}:{k:'d3_small',p:()=>{const nx=p===7?11:13;return [p,nx,nx*nx];}}}
 ]
});
initQuiz([]);
initLang();applyLang();
</script>
