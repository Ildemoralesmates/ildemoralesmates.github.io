<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llegir gràfiques: cada història té la seua gràfica — simulador interactiu</title>
<meta name="description" content="Interpretar gràfiques amb situacions reals: una bici que va i torna, un depòsit que s’omple, una banyera, una sopa que bull, la bateria del mòbil… Mira com cada tram de la història es converteix en un tram de la gràfica, tria la gràfica correcta o construeix-la tu. Amb activitats per a raonar.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
.stage canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.ctls{display:grid;gap:8px;padding:2px 4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
.story{margin:0;padding-left:1.4em;display:grid;gap:5px;font-size:14px;color:var(--muted)}
.story li{padding:2px 6px;margin-left:-6px;border-radius:6px}
.story li.done{color:var(--ink)}
.story li.done::marker{color:var(--ok);font-weight:700}
.story li.cur{color:var(--ink);font-weight:600;background:var(--chip);box-shadow:inset 3px 0 0 var(--pa)}
#pA,#pB,#pC,#roBox{display:grid;gap:8px;align-content:start}
.side .idea{margin:0}
.optgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.optgrid .opt{text-align:center;font-weight:700}
.opt.right{border-color:var(--ok);border-width:2px;color:var(--ok)}
.opt.wrong{border-color:var(--warn);border-width:2px;color:var(--warn)}
.side .msg{margin:0;font-size:14px;color:var(--ink)}
.side .msg:empty{display:none}
.side .msg.good{color:var(--ok);font-weight:600}
.side .msg.bad{color:var(--warn);font-weight:600}
.tramc{display:grid;gap:5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.tramc:last-child{border-bottom:0}
.tramc p{margin:0;font-size:13.5px;color:var(--ink)}
.tramc .chips .chip{font-size:13px}
.tramc .mk{font-weight:700;margin-left:4px}
.tramc .mk.good{color:var(--ok)}.tramc .mk.bad{color:var(--warn)}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="seg tabs" id="modes" role="group" data-i18n-aria="aria.mode" aria-label="">
<button type="button" data-m="A" aria-pressed="true" data-i18n="mode_A"></button><button type="button" data-m="B" aria-pressed="false" data-i18n="mode_B"></button><button type="button" data-m="C" aria-pressed="false" data-i18n="mode_C"></button>
</div>
<div class="stage"><canvas id="cv" role="img" data-i18n-aria="aria.cv" aria-label=""></canvas></div>
<div class="ctls">
<div class="btns"><button class="btn primary" id="btnStep" type="button"></button><button class="btn" id="btnReset" type="button" data-i18n="reset"></button><button class="btn" id="btnRnd" type="button" data-i18n="rnd"></button></div>
<div class="ctl"><label for="tsl" data-i18n="l_t"></label><output id="tslL"></output><input type="range" id="tsl" min="0" max="50" step="0.1" value="0"></div>
<label class="check"><input type="checkbox" id="ghost"><span data-i18n="c_ghost"></span></label>
<p class="sh" data-i18n="l_sc"></p>
<div class="chips" id="scs" role="group" data-i18n-aria="aria.sc" aria-label=""></div>
</div>
</div>
<div class="side">
<div id="pA">
<p class="sh" data-i18n="s_story"></p>
<ol class="story" id="storyA"></ol>
<p class="sh" data-i18n="s_graph"></p>
<p class="idea" id="expl"></p>
</div>
<div id="pB" hidden>
<p class="note" data-i18n="b_intro"></p>
<ol class="story" id="storyB"></ol>
<div class="optgrid" id="optsB"></div>
<p class="msg" id="msgB" aria-live="polite"></p>
<p class="score" id="scB"></p>
</div>
<div id="pC" hidden>
<p class="note" data-i18n="c_intro"></p>
<div id="tramsC"></div>
<div class="row"><button class="btn primary" id="btnCheck" type="button" data-i18n="c_check"></button></div>
<p class="msg" id="msgC" aria-live="polite"></p>
<p class="score" id="scC"></p>
</div>
<div id="roBox">
<p class="sh" data-i18n="s_now"></p>
<dl class="vals" id="ro"></dl>
</div>
<p class="note" data-i18n="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

  const p=pts(sc,segs);ctx.beginPath();ctx.moveTo(M.X(0),M.Y(sc.y0));
  for(let k=1;k<p.length;k++){if(p[k][0]<=upto+1e-9)ctx.lineTo(M.X(p[k][0]),M.Y(p[k][1]));else{ctx.lineTo(M.X(upto),M.Y(valAt(sc,segs,upto)));break;}}
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.setLineDash([]);
}
function tramLabels(M,sc,segs,upto,color,fixY){
  const st=starts(segs),c=C();
  segs.forEach((s,i)=>{if(st[i]>upto-1e-9&&!(upto>=tot(segs)))return;
    const tm=(st[i]+st[i+1])/2,ym=(y0Of(sc,segs,i)+s.y)/2,x=M.X(tm),y=M.Y(ym)-16;
    const yy=fixY?GB.y+GB.h-12:clamp(y,GB.y+10,GB.y+GB.h-10);
    ctx.fillStyle=c.panel;ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,yy,9,0,TAU);ctx.fill();ctx.stroke();
    label(String(i+1),x,yy+4,{font:'700 11px '+getComputedStyle(document.body).fontFamily,color:color,align:'center'});});
}
function legend(items){let x=GB.x+GB.w-6;ctx.save();ctx.font='12px '+getComputedStyle(document.body).fontFamily;
  items.slice().reverse().forEach(([txt,col,dash])=>{const w=ctx.measureText(txt).width;label(txt,x,GB.y-9,{align:'right'});x-=w+8;
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x-22,GB.y-13);ctx.lineTo(x,GB.y-13);ctx.stroke();ctx.setLineDash([]);x-=34;});ctx.restore();}
function cursor(M,sc,segs){
  const c=C(),v=valAt(sc,segs,tcur),x=M.X(tcur),y=M.Y(v);
  ctx.strokeStyle=c.muted;ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(x,GB.y+GB.h);ctx.lineTo(x,y);ctx.lineTo(GB.x,y);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=c.pa;ctx.beginPath();ctx.arc(x,y,5.5,0,TAU);ctx.fill();ctx.strokeStyle=c.panel;ctx.lineWidth=2;ctx.stroke();
}
function band(M,sc,i){const st=starts(sc.segs);ctx.save();ctx.fillStyle=C().pa;ctx.globalAlpha=.08;ctx.fillRect(M.X(st[i]),GB.y,Math.max(2,M.X(st[i+1])-M.X(st[i])),GB.h);ctx.restore();}
function gridBoxes(){const g=14,w=(GB.w+GB.x-24-g)/2,h=(H-GB.y+12-10-g)/2;return [0,1,2,3].map(k=>({x:24+(k%2)*(w+g),y:GB.y-12+Math.floor(k/2)*(h+g),w,h}));}
function draw(){
  const c=C(),sc=SC[cur],R=sc.segs;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=c.panel;ctx.fillRect(0,0,W,H);
  drawScene(sc,tcur);
  if(mode==='B'&&B&&B.pick===null){
    gridBoxes().forEach((bx,k)=>{
      const inner={x:bx.x+28,y:bx.y+8,w:bx.w-36,h:bx.h-22};
      ctx.strokeStyle=c.line;ctx.lineWidth=1;rrect(ctx,bx.x,bx.y,bx.w,bx.h,8);ctx.stroke();
      const M=axes(inner,sc,true);poly(M,sc,B.opts[k],Infinity,c.ink,2.5);
      label('ABCD'[k],bx.x+10,bx.y+20,{font:'700 15px '+getComputedStyle(document.body).fontFamily,color:c.ink});
      label(t(sc.id+'.y').replace(/\s*\(.*/,'')+' ↑',inner.x+4,inner.y+12,{font:'11px '+getComputedStyle(document.body).fontFamily});
      label(t(sc.id+'.x').replace(/\s*\(.*/,'')+' →',inner.x+inner.w-2,inner.y+inner.h+13,{font:'11px '+getComputedStyle(document.body).fontFamily,align:'right'});
    });
    return;
  }
  const M=axes(GB,sc,false);
  const ci=curTram();
  if(ci>=0&&(mode==='A'||checked()))band(M,sc,ci);
  if(mode==='A'){
    if(ghostEl.checked){ctx.globalAlpha=.35;poly(M,sc,R,Infinity,c.muted,2,[5,5]);ctx.globalAlpha=1;}
    poly(M,sc,R,tcur,c.pa,3.2);tramLabels(M,sc,R,tcur,c.pa);
  }else if(mode==='B'){
    const S=B.opts[B.pick];
    if(!B.ok)poly(M,sc,S,Infinity,c.pb,2.6,[7,5]);
    if(ghostEl.checked){ctx.globalAlpha=.35;poly(M,sc,R,Infinity,c.muted,2,[5,5]);ctx.globalAlpha=1;}
    poly(M,sc,R,tcur,c.pa,3.2);tramLabels(M,sc,R,tcur,c.pa);
    legend(B.ok?[[t('lg_real'),c.pa]]:[[t('lg_real'),c.pa],[t('lg_pick')+' ('+'ABCD'[B.pick]+')',c.pb,[7,5]]]);
  }else{
    const U=userSegs();
    if(U.length)poly(M,sc,U,Infinity,c.pb,2.8,Cst.checked?[7,5]:[]);
    if(Cst.checked){poly(M,sc,R,tcur,c.pa,3.2);tramLabels(M,sc,R,tcur,c.pa);legend([[t('lg_real'),c.pa],[t('lg_pick'),c.pb,[7,5]]]);}
    else{tramLabels(M,sc,R,Infinity,c.muted,true);}
  }
  if(mode==='A'||checked())cursor(M,sc,R);
}
const checked=()=>mode==='B'?(B&&B.pick!==null):mode==='C'?(Cst&&Cst.checked):true;
function curTram(){const R=SC[cur].segs;if(anim)return anim.i;if(tcur<=1e-9)return -1;return tramAt(R,tcur-1e-6);}

/* ---------- construcció (mode C) ---------- */
function userSegs(){
  const sc=SC[cur],R=sc.segs,out=[];let y=sc.y0;
  for(let i=0;i<R.length;i++){const ch=Cst.ch[i];if(ch==null)break;
    const mag=Math.abs(R[i].y-y0Of(sc,R,i))||0.25*(sc.ymax-sc.ymin);
    y=clamp(y+(ch==='up'?mag:ch==='down'?-mag:0),sc.ymin,sc.ymax);out.push({d:R[i].d,y});}
  return out;
}
const realDir=(sc,i)=>{const s=shape(sc,sc.segs,i);return s==='flat'?'flat':dir(sc,sc.segs,i)>0?'up':'down';};

/* ---------- animació pas a pas ---------- */
function stepOnce(){
  const R=SC[cur].segs,st=starts(R);
  if(anim){finishAnim();return;}
  if(stepI>=R.length){stepI=0;tcur=0;refresh();return;}
  const i=stepI,a=st[i],b=st[i+1],dur=REDUCE?0:(R[i].d/SC[cur].tmax<0.02?600:1700);
  tcur=a;anim={i,a,b,t0:performance.now(),dur};
  if(!dur){finishAnim();return;}
  refresh();requestAnimationFrame(tick);
}
function tick(now){if(!anim)return;const f=clamp((now-anim.t0)/anim.dur,0,1);tcur=lerp(anim.a,anim.b,f);if(f>=1){finishAnim();return;}refresh(true);requestAnimationFrame(tick);}
function finishAnim(){if(!anim)return;tcur=anim.b;stepI=anim.i+1;anim=null;refresh();}
function stopAnim(){anim=null;}

/* ---------- panell ---------- */
function storyHTML(sc,ci,doneUpTo){return sc.segs.map((s,i)=>'<li class="'+(i===ci?'cur':i<doneUpTo?'done':'')+'">'+t(sc.id+'.s'+i)+'</li>').join('');}
function explain(sc,ci){
  const R=sc.segs;
  if(ci<0)return t('g_start');
  const sh=shape(sc,R,ci),v=t(sc.id+'.v'),r=rate(sc,R,ci);
  let s=sh==='flat'?tt('g_flat',v,nf(R[ci].d,2)+' '+unitX(sc.id)):sh==='jump'?tt('g_jump',v):tt(sh==='up'?'g_up':'g_down',v,sgn(r,Math.abs(r)<10?1:0)+' '+sc.ru);
  if(steepest(sc)===ci)s+=t('g_fast');
  if(!anim&&tcur>=tot(R)-1e-9)s+='<br><br>'+t('g_end');
  return s;
}
function readout(sc){
  const R=sc.segs,ci=curTram(),v=valAt(sc,R,tcur);
  const rows=[[t('r_t'),nf(tcur,sc.tmax<=10?2:1)+' '+unitX(sc.id)],[t(sc.id+'.y').replace(/\s*\(.*/,''),fy(sc,v)],[t('r_tram'),ci>=0?String(ci+1):'—']];
  if(ci>=0){const sh=shape(sc,R,ci),r=rate(sc,R,ci);rows.push([t('r_shape'),t('sh_'+sh)],[t('r_rate'),sh==='flat'?'0 '+sc.ru:sgn(r,Math.abs(r)<10?1:0)+' '+sc.ru]);}
  $('#ro').innerHTML=rows.map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join('');
}
function btnLabel(){
  const n=SC[cur].segs.length;
  if(!checked()){btnStep.textContent=t(mode==='B'?'pick_first':'build_first');btnStep.disabled=true;return;}
  btnStep.disabled=false;btnStep.textContent=anim?tt('step',anim.i+1):stepI>=n?t('again'):tt('step',stepI+1);
}
function renderPanel(){
  const sc=SC[cur],R=sc.segs,ci=curTram();
  $('#pA').hidden=mode!=='A';$('#pB').hidden=mode!=='B';$('#pC').hidden=mode!=='C';
  $('#roBox').hidden=!checked();
  if(mode==='A'){$('#storyA').innerHTML=storyHTML(sc,ci,tcur>=tot(R)-1e-9?R.length:Math.max(ci,0));$('#expl').innerHTML=explain(sc,ci);}
  if(mode==='B'){
    $('#storyB').innerHTML=storyHTML(sc,B.pick!==null?ci:-1,B.pick!==null?(tcur>=tot(R)-1e-9?R.length:Math.max(ci,0)):0);
    $('#optsB').innerHTML='ABCD'.split('').map((L,k)=>{let cl='opt';if(B.pick!==null){if(k===B.right)cl+=' right';else if(k===B.pick)cl+=' wrong';}
      return '<button type="button" class="'+cl+'" data-k="'+k+'" aria-pressed="'+(B.pick===k)+'"'+(B.pick!==null?' disabled':'')+'>'+L+'</button>';}).join('');
    $$('#optsB [data-k]').forEach(b=>b.onclick=()=>pickB(+b.dataset.k));
    const m=$('#msgB');m.className='msg'+(B.msg?(B.ok?' good':' bad'):'');m.innerHTML=B.msg?tt(B.msg.k,...B.msg.p):'';
    $('#scB').textContent=tt('b_score',SCORE.B[0],SCORE.B[1]);
  }
  if(mode==='C'){
    $('#tramsC').innerHTML=R.map((s,i)=>{const ch=Cst.ch[i],ok=Cst.checked?ch===realDir(sc,i):null;
      return '<div class="tramc"><p><b>'+tt('tram_n',i+1)+'.</b> '+t(sc.id+'.s'+i)+(Cst.checked?'<span class="mk '+(ok?'good':'bad')+'">'+(ok?'✔':'✘ → '+t('ch_'+realDir(sc,i)))+'</span>':'')+'</p>'+
        '<div class="chips">'+['up','flat','down'].map(o=>'<button type="button" class="chip" data-i="'+i+'" data-o="'+o+'" aria-pressed="'+(ch===o)+'"'+(Cst.checked?' disabled':'')+'>'+t('ch_'+o)+'</button>').join('')+'</div></div>';}).join('');
    $$('#tramsC [data-o]').forEach(b=>b.onclick=()=>{Cst.ch[+b.dataset.i]=b.dataset.o;Cst.msg=null;refresh();});
    $('#btnCheck').disabled=Cst.checked;
    const m=$('#msgC');m.className='msg'+(Cst.msg?(Cst.msg.good?' good':' bad'):'');m.innerHTML=Cst.msg?tt(Cst.msg.k,...(Cst.msg.p||[])):'';
    $('#scC').textContent=tt('c_score',SCORE.C[0],SCORE.C[1]);
  }
  readout(sc);btnLabel();
  tEl.disabled=!checked();tOut.textContent=nf(tcur,sc.tmax<=10?2:1)+' '+unitX(sc.id);
}
function refresh(fast){if(!fast||!anim){} tEl.max=SC[cur].tmax;tEl.step=SC[cur].tmax/300;tEl.value=tcur;draw();renderPanel();}

/* ---------- modes ---------- */
function newB(){const sc=SC[cur],opts=distractors(sc);opts.push(sc.segs);const order=shuffle([0,1,2,3].slice(0,opts.length));
  B={opts:order.map(k=>opts[k]),right:order.indexOf(opts.length-1),pick:null,ok:false,msg:null};}
function pickB(k){
  if(B.pick!==null)return;const sc=SC[cur],R=sc.segs,S=B.opts[k];B.pick=k;B.ok=k===B.right;SCORE.B[1]++;
  if(B.ok){SCORE.B[0]++;B.msg={k:'b_ok',p:['ABCD'[k]]};}
  else{let i=0;for(;i<R.length;i++){if(!S[i]||Math.abs(S[i].d-R[i].d)>1e-9||Math.abs(S[i].y-R[i].y)>1e-9||Math.abs(y0Of(sc,S,i)-y0Of(sc,R,i))>1e-9)break;}
    i=Math.min(i,R.length-1);const a=realDir(sc,i),bs=shape(sc,S,i),b=bs==='flat'?'flat':dir(sc,S,i)>0?'up':'down';
    B.msg=a!==b?{k:'b_ko_sh',p:['ABCD'[k],i+1,tt('hp_'+a,t(sc.id+'.v')),t('gp_'+(bs==='jump'?'jump':b)),'ABCD'[B.right]]}:{k:'b_ko_rt',p:['ABCD'[k],i+1,'ABCD'[B.right]]};}
  stepI=0;tcur=0;stopAnim();refresh();
}
function newC(){Cst={ch:SC[cur].segs.map(()=>null),checked:false,msg:null};}
$('#btnCheck').addEventListener('click',()=>{
  const sc=SC[cur];if(Cst.ch.some(x=>x==null)){Cst.msg={k:'c_need'};refresh();return;}
  Cst.checked=true;const ok=Cst.ch.filter((x,i)=>x===realDir(sc,i)).length,n=sc.segs.length;SCORE.C[1]++;if(ok===n)SCORE.C[0]++;
  Cst.msg=ok===n?{k:'c_all',good:true}:{k:'c_res',p:[ok,n]};stepI=0;tcur=0;refresh();
});
function setScenario(id){cur=id;stopAnim();stepI=0;tcur=0;if(mode==='B')newB();if(mode==='C')newC();renderChips();refresh();}
function setMode(m){mode=m;$$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));setScenario(cur);}
function renderChips(){$('#scs').innerHTML=IDS.map(id=>'<button type="button" class="chip" data-id="'+id+'" aria-pressed="'+(id===cur)+'">'+t(id+'.name')+'</button>').join('');
  $$('#scs .chip').forEach(b=>b.onclick=()=>setScenario(b.dataset.id));}
$$('#modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
btnStep.addEventListener('click',stepOnce);
$('#btnReset').addEventListener('click',()=>{stopAnim();stepI=0;tcur=0;if(mode==='B')newB();if(mode==='C')newC();refresh();});
$('#btnRnd').addEventListener('click',()=>{const o=IDS.filter(x=>x!==cur);setScenario(o[Math.floor(Math.random()*o.length)]);});
tEl.addEventListener('input',()=>{stopAnim();tcur=+tEl.value;const st=starts(SC[cur].segs);stepI=st.filter((s,k)=>k>0&&s<=tcur+1e-9).length;refresh();});
ghostEl.addEventListener('change',()=>draw());
cv.addEventListener('click',ev=>{if(!(mode==='B'&&B&&B.pick===null))return;const p=cvO.pt(ev);
  gridBoxes().forEach((bx,k)=>{if(p.x>=bx.x&&p.x<=bx.x+bx.w&&p.y>=bx.y&&p.y<=bx.y+bx.h)pickB(k);});});
document.addEventListener('langchange',()=>{renderChips();refresh();});
document.addEventListener('themechange',()=>draw());
App.hooks.push(()=>refresh());

/* ===== Raona-ho ===== */
/* carrega una història al mode «Mira» amb els k primers trams ja recorreguts (k omés: sencera) */
function load(id,k){
  if(mode!=='A'){mode='A';$$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m==='A')));}
  cur=id;stopAnim();const R=SC[id].segs,n=k===undefined?R.length:clamp(k,0,R.length);
  stepI=n;tcur=starts(R)[n];ghostEl.checked=true;renderChips();refresh();RZ.show(cv);
}
const near=(a,b,e)=>Math.abs(a-b)<=(e||1e-6);
RZ.init({
 sim:()=>load(cur),
 M:[
  {id:'m1',f:[{l:'l_vel',u:'km/h'}],sim:()=>load('bici',3),ok:()=>({k:'m1_ok'}),
   chk:([v])=>near(v,24,.05)?null:near(v,0.4,.02)?{k:'m1_u',p:[nf(v,2)]}:{k:'m1_f',p:[nf(v,2),nf(v*10/60,2)]}},
  {id:'m2',f:[{l:'l_cab',u:'L/min'}],sim:()=>load('diposit',2),ok:()=>({k:'m2_ok'}),
   chk:([q])=>near(q,20,.05)?null:near(q,30,.05)?{k:'m2_both'}:{k:'m2_f',p:[nf(q,1),nf(q+10,1)]}},
  {id:'m3',f:[{l:'l_temps',u:'min'}],sim:()=>load('sopa',2),ok:()=>({k:'m3_ok'}),
   chk:([m])=>near(m,6,.05)?null:{k:'m3_f',p:[nf(m,1)]}},
  {id:'m4',f:[{l:'l_bat',u:'%'}],sim:()=>load('mobil',2),ok:()=>({k:'m4_ok'}),
   chk:([p])=>near(Math.abs(p),30,.05)?null:{k:'m4_f',p:[nf(p,1)]}},
  {id:'m5',f:[{l:'l_desn',u:'m/h'}],sim:()=>load('excursio',5),ok:()=>({k:'m5_ok'}),
   chk:([r])=>near(Math.abs(r),400,1)?null:{k:'m5_f',p:[nf(r,0),nf(Math.abs(r)*1.5,0)]}},
  {id:'m6',f:[{l:'l_alt',u:'cm'}],sim:()=>load('banyera',2),ok:()=>({k:'m6_ok'}),
   chk:([c])=>near(c,10,.05)?null:{k:'m6_f',p:[nf(c,1),nf(30+c,1)]}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load('bici',2)},
  {id:'s2',ans:'D',f:[{l:'l_vel',u:'km/h'}],sim:()=>load('cotxe',2),cxsim:()=>load('cotxe',2),
   cxok:([v])=>({k:'s2_cx',p:[nf(v,1)]}),cx:([v])=>v!==0?null:{k:'s2_cx_no',p:[nf(v,1)]}},
  {id:'s3',ans:'M',sim:()=>load('bici')},
  {id:'s4',ans:'M',sim:()=>load('banyera',2)},
  {id:'s5',ans:'S',sim:()=>load('diposit',2)},
  {id:'s6',ans:'M',sim:()=>load('bici',3)}
 ],
 E:[
  {id:'e1',who:1,sim:()=>load('bici',2)},
  {id:'e2',who:0,sim:()=>load('cotxe',3)},
  {id:'e3',who:1,sim:()=>load('banyera',2)},
  {id:'e4',who:1,sim:()=>load('sopa',2)}
 ],
 D:[
  {id:'d1',chips:{vals:[1,2,3],fmt:x=>tt('tram_n',x)},f:[{l:'d1.l0',u:'km/h'}],sim:()=>load('bici',3),ok:()=>({k:'d1_ok'}),
   chk:([p,v])=>p!==3?{k:'d1_t',p:[p]}:near(v,24,.05)?null:{k:'d1_v'}},
  {id:'d2',f:[{l:'d2.l0',u:'%'}],sim:()=>load('mobil',3),ok:()=>({k:'d2_ok'}),
   chk:([p])=>near(p,60,.05)?null:{k:'d2_f'}},
  {id:'d3',chips:{vals:[1,2,3,4,5],fmt:x=>tt('tram_n',x)},f:[{l:'d3.l0',u:'s'}],sim:()=>load('cotxe',4),ok:()=>({k:'d3_ok'}),
   chk:([p,s])=>p===2?{k:'d3_t2'}:p!==4?{k:'d3_t',p:[p]}:near(s,10,.05)?null:{k:'d3_s'}},
  {id:'d4',f:[{l:'d4.l0',u:'min'}],sim:()=>load('diposit',1),ok:()=>({k:'d4_ok'}),
   chk:([m])=>near(m,40,.05)?null:{k:'d4_f',p:[nf(m,1),nf(m*10,0)]}}
 ]
});
initQuiz([]);
ready=true;
initLang();applyLang();
renderChips();refresh();
})();
</script>
