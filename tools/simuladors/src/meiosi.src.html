"es":{
"title":"Meiosis: de la célula diploide a los cuatro gametos",
"lede":"Célula con 2n = 4 (dos pares de homólogos), con crossing-over y orientación al azar de los pares. Responde las preguntas antes de pasar al paso siguiente.",
"m0.title":"Interfase: antes de empezar",
"m0.text":"<p>La célula es <b>diploide</b>: 2n = 4 cromosomas, que forman <b>2 pares de homólogos</b> (un cromosoma de cada progenitor). Rojo = origen materno, azul = origen paterno. El par largo y el corto son cromosomas distintos.</p><p>Ahora cada cromosoma tiene <b>una sola cromátida</b> y el material genético está descondensado dentro del núcleo.</p>",
"m0.q":"Antes de dividirse, la célula tiene que prepararse. ¿Qué crees que le pasa al ADN?",
"m0.o0":"Se reduce a la mitad",
"m0.o1":"Se duplica",
"m0.o2":"Se reparte directamente, sin cambios",
"m0.why":"El ADN se duplica en la fase S de la interfase: cada cromosoma pasa a tener dos cromátidas hermanas idénticas. La reducción a la mitad vendrá después, porque habrá <b>una sola duplicación y dos divisiones seguidas</b>.",
"m1.title":"Interfase (fase S): el ADN se duplica",
"m1.text":"<p>Cada cromosoma se ha copiado: ahora tiene <b>2 cromátidas hermanas idénticas</b> unidas por el centrómero. Seguimos teniendo 4 cromosomas (se cuentan por los centrómeros), pero la cantidad de ADN se ha doblado: de 2C a 4C.</p>",
"m1.tq":"Si contamos cromosomas hay 4. ¿Y si contamos cromátidas?",
"m1.th":"Cada cromosoma duplicado tiene 2 cromátidas: 4 × 2 = 8. Ojo: duplicar el ADN no duplica el número de cromosomas.",
"m2.title":"Profase I: los homólogos se emparejan",
"m2.text":"<p>Los cromosomas se condensan y cada uno se empareja con su homólogo (<b>sinapsis</b>), formando un <b>bivalente o tétrada</b> de 4 cromátidas. La envoltura nuclear todavía está.</p>",
"m2.q":"Los homólogos están juntos, cromátida contra cromátida. ¿Qué crees que puede pasar entre cromátidas de homólogos?",
"m2.o0":"Nada: solo están cerca",
"m2.o1":"Se fusionan en un solo cromosoma",
"m2.o2":"Intercambian fragmentos de ADN",
"m2.why":"Se produce el <b>crossing-over</b> (entrecruzamiento): cromátidas no hermanas intercambian fragmentos. Es la primera fuente de variabilidad genética.",
"m2.sv1":"4 (2 pares)",
"m3.title":"Profase I: crossing-over",
"m3.text":"<p>Entre cromátidas <b>no hermanas</b> de homólogos se cruzan e intercambian trozos (<b>quiasmas</b>). Fíjate en las puntas: ahora hay cromátidas mitad rojas y mitad azules, que ya no son ni totalmente maternas ni totalmente paternas.</p><p>Al final de la profase I desaparece la envoltura nuclear.</p>",
"m3.tq":"¿Por qué intercambian fragmentos las cromátidas no hermanas y no las hermanas?",
"m3.th":"Las hermanas son copias idénticas: intercambiar trozos entre ellas no cambiaría nada. Entre homólogos, en cambio, los alelos pueden ser distintos (uno de cada progenitor).",
"m4.title":"Metafase I: los pares en el ecuador",
"m4.text":"<p>Los bivalentes se alinean en el plano ecuatorial y el huso los sujeta por los centrómeros. Cada par se orienta <b>al azar</b>: el cromosoma materno puede quedar a la izquierda o a la derecha, independientemente del otro par.</p><p><b>Pruébalo:</b> pulsa sobre un par para girarlo.</p>",
"m4.q":"En la anafase I, ¿qué se va a separar?",
"m4.o0":"Las cromátidas hermanas de cada cromosoma",
"m4.o1":"Nada: la célula todavía no se divide",
"m4.o2":"Los cromosomas homólogos de cada par",
"m4.why":"Se separan los <b>homólogos enteros</b> (cada uno con dos cromátidas). Por eso la meiosis I es <b>reduccional</b>: pasamos de 2n a n. Las cromátidas hermanas no se separan hasta la anafase II.",
"m5.title":"Anafase I: se separan los homólogos",
"m5.text":"<p>Cada cromosoma (todavía con 2 cromátidas) viaja hacia un polo; las cromátidas hermanas siguen unidas. A cada polo llega <b>un cromosoma de cada par</b>: el reparto ya es n = 2.</p>",
"m5.tq":"Vuelve a la metafase I, orienta los pares de formas distintas y mira la anafase. ¿Cuántas combinaciones distintas pueden llegar a un polo con 2 pares? ¿Y con 23 pares (como los humanos)?",
"m5.th":"Cada par tiene 2 orientaciones independientes: 2 × 2 = 4 con 2 pares; 2<sup>23</sup> ≈ 8,4 millones con 23 pares. Y sin contar el crossing-over.",
"m5.sv0":"1 (dividiéndose)",
"m6.title":"Telofase I y citocinesis",
"m6.text":"<p>La célula se divide en dos. Cada célula hija es <b>haploide</b> (n = 2 cromosomas), pero cada cromosoma todavía tiene 2 cromátidas. Hay una interfase breve <b>sin duplicar el ADN</b>.</p>",
"m6.q":"Antes de la meiosis II, ¿el material genético se vuelve a duplicar?",
"m6.o0":"Sí, igual que antes de la meiosis I",
"m6.o1":"Solo en una de las dos células",
"m6.o2":"No: no hay fase S entre las dos divisiones",
"m6.why":"No hay duplicación. <b>Una sola duplicación y dos divisiones</b> consecutivas es lo que hace que el número de cromosomas se reduzca a la mitad.",
"m7.title":"Profase II y metafase II",
"m7.text":"<p>Cada célula empieza la segunda división, que se parece a una mitosis: los cromosomas se alinean en el ecuador y el huso se orienta <b>perpendicularmente</b> al de la división I. Observa que las cromátidas ya no son idénticas (efecto del crossing-over).</p>",
"m7.q":"En la anafase II, ¿qué se va a separar?",
"m7.o0":"Los cromosomas homólogos",
"m7.o1":"Las cromátidas hermanas",
"m7.o2":"Las células hijas se vuelven a fusionar",
"m7.why":"Los homólogos ya están en células distintas desde la meiosis I. Ahora se separan las cromátidas hermanas, como en una mitosis.",
"m8.title":"Anafase II: se separan las cromátidas",
"m8.text":"<p>Los centrómeros se dividen y las cromátidas hermanas (que ya no son idénticas) viajan a polos opuestos. Cada cromátida pasa a ser un <b>cromosoma independiente</b>.</p>",
"m9.title":"Telofase II: cuatro gametos haploides",
"m9.text":"<p>Resultado: <b>4 células haploides</b> (n = 2), cada una con un cromosoma de cada par y con una combinación genética distinta de las otras. Compáralas: las cuatro son únicas gracias al crossing-over y a la orientación al azar de los pares.</p>",
"m9.tq":"¿Hay dos gametos iguales? Vuelve atrás, cambia la orientación de los pares en la metafase I y compara los resultados.",
"m9.th":"No hay ninguno igual. Con crossing-over, las 4 cromátidas de cada par son distintas y cada gameto recibe una de cada par, siempre distinta.",
"mq1.q":"Una célula tiene 2n = 8. ¿Cuántos cromosomas tendrá cada gameto?",

"mq2.q":"¿Cuál de estos procesos NO es una fuente de variabilidad genética?",
"mq2.o0":"Crossing-over",
"mq2.o1":"Orientación al azar de los pares en la metafase I",
"mq2.o2":"Fecundación entre gametos distintos",
"mq2.o3":"La duplicación del ADN en la fase S",
"mq2.e":"La duplicación genera copias idénticas (cromátidas hermanas): por sí sola no crea variabilidad. Las otras tres sí.",
"mq3.q":"¿Cuál es la diferencia fundamental entre la meiosis I y la meiosis II?",
"mq3.o0":"En la I se separan cromátidas; en la II, homólogos",

"mq3.o3":"Ninguna: son idénticas",
"mq3.e":"La meiosis I es reduccional (separa homólogos, 2n → n); la II es ecuacional, como una mitosis (separa cromátidas).",
"mq4.q":"Un humano tiene 2n = 46. Sin contar el crossing-over, ¿cuántas combinaciones distintas de gametos puede producir una persona?",
"mq4.o0":"46",

"mq4.o3":"2<sup>23</sup> ≈ 8,4 millones",

      c.x=sc[0];c.y=sc[1];c.rot=sc[2];c.sx=(ph===0)?0.45:0.5;c.op=(ph===0)?0.8:0.9;c.single=(ph===0);
    }else if(ph===2||ph===3||ph===4){c.x=400+s*13;}
    else if(ph===5){c.x=400+s*120;}
    else if(ph===6){c.x=400+s*165;}
    else if(ph===7||ph===8){const cx=400+s*165;c.x=cx+(k?40:-45);c.y=210;c.rot=90;if(ph===8)c.sep=130;}
    else if(ph===9){c.x=400+s*165;}
    cr.push({x:c.x,y:c.y,k:k,par:par,s:s});
    for(let j=0;j<2;j++){
      const dx=c.single?0:(j?c.sep/2:-c.sep/2);
      const r=c.rot*Math.PI/180;
      const o2={x:c.x+dx*Math.cos(r),y:c.y+dx*Math.sin(r),rot:c.rot,sx:c.sx,op:c.op};
      if(c.single&&j===1)o2.op=0;
      if(ph===9){const gy=j?300:120;o2.x=400+s*165+(k?30:-30);o2.y=gy;o2.rot=0;o2.sx=0.9;o2.op=1;}
      ch.push(o2);
    }
  }
  return {ch:ch,cr:cr};
}
function tipColor(c,ph){
  const base=c.par?COL.p:COL.m;
  if(ph>=3){
    const inner=(c.par===0)?(MS.o[c.k]?0:1):(MS.o[c.k]?1:0);
    if(c.j===inner)return c.par?COL.m:COL.p;
  }
  return base;
}
function buildSvg(){
  msvg=$('#msvg');
  const gc=el('g',{},msvg);
  cells.c0=el('ellipse',{cx:400,cy:210,rx:335,ry:190,'class':'cell'},gc);
  cells.c1=[el('ellipse',{cx:235,cy:210,rx:158,ry:176,'class':'cell'},gc),el('ellipse',{cx:565,cy:210,rx:158,ry:176,'class':'cell'},gc)];
  cells.c2=[[235,120],[235,300],[565,120],[565,300]].map(p=>el('ellipse',{cx:p[0],cy:p[1],rx:105,ry:80,'class':'cell'},gc));
  nuc=el('ellipse',{cx:400,cy:210,rx:150,ry:138,'class':'nuc'},msvg);
  nuc2=[[235,120],[235,300],[565,120],[565,300]].map(p=>el('ellipse',{cx:p[0],cy:p[1],rx:78,ry:62,'class':'nuc'},msvg));
  spG=el('g',{'class':'spi'},msvg);
  chiG=el('g',{'class':'chi'},msvg);
  [0,1].forEach(k=>{el('circle',{cx:400,cy:(k?270:150)+0.14*LEN[k],r:15,fill:'none',stroke:'#e0a100','stroke-width':2.5,'stroke-dasharray':'4 3'},chiG);});
  chiLabel=el('text',{x:432,y:158,'class':'cl'},chiG);
  const layer=el('g',{},msvg);
  for(let k=0;k<2;k++)for(let par=0;par<2;par++)for(let j=0;j<2;j++){
    const Ln=LEN[k];
    const g=el('g',{'class':'cht'},layer);
    const body=el('rect',{x:-4.5,y:-Ln/2,width:9,height:Ln,rx:4.5,stroke:'rgba(0,0,0,.35)','stroke-width':0.8},g);
    const y0=0.14*Ln,yb=Ln/2-4.5;
    const tip=el('path',{d:'M-4.5 '+y0+' H4.5 V'+yb+' A4.5 4.5 0 0 1 -4.5 '+yb+' Z',stroke:'rgba(0,0,0,.35)','stroke-width':0.8},g);
    el('ellipse',{cx:0,cy:0,rx:6,ry:3.4,fill:'#8a8aa0','fill-opacity':0.75},g);
    const obj={g,body,tip,k,par,j};
    g.addEventListener('click',()=>{if(curPh===4){MS.o[obj.k]^=1;render(4);}});
    chr.push(obj);
  }
  msvg.appendChild(chiG);
  paintText();
}
function paintText(){
  if(!chiLabel)return;
  chiLabel.textContent=t('chi');
  $('#mhint').textContent=(curPh===4)?t('hint4'):'';
}
function drawSpindle(ph,Lo){
  while(spG.firstChild)spG.removeChild(spG.firstChild);
  const pole=(x,y)=>el('circle',{cx:x,cy:y,r:5},spG);
  const line=(x1,y1,x2,y2)=>el('line',{x1,y1,x2,y2,'stroke-width':1.2,'stroke-opacity':0.75},spG);
  if(ph===4){
    pole(70,210);pole(730,210);
    Lo.cr.forEach(c=>{line(70,210,c.x,c.y);line(730,210,c.x,c.y);});
  }else if(ph===5){
    pole(70,210);pole(730,210);
    Lo.cr.forEach(c=>{line(c.s<0?70:730,210,c.x,c.y);});
  }else if(ph===7||ph===8){
    [235,565].forEach(cx=>{pole(cx,48);pole(cx,372);});
    if(ph===7){Lo.cr.forEach(c=>{const cx=400+c.s*165;line(cx,48,c.x,c.y);line(cx,372,c.x,c.y);});}
    else{chr.forEach((c,i)=>{const p=Lo.ch[i];const cx=400+Lo.cr[Math.floor(i/2)].s*165;line(cx,c.j?372:48,p.x,p.y);});}
  }
  spG.style.animation=REDUCE?'none':'mfade .6s .6s both';
}
function render(ph){
  curPh=ph;
  const Lo=layout(ph);
  chr.forEach((c,i)=>{
    const l=Lo.ch[i];
    c.g.style.transform='translate('+l.x.toFixed(2)+'px,'+l.y.toFixed(2)+'px) rotate('+l.rot+'deg) scale('+l.sx+',1)';
    c.g.style.opacity=l.op;
    c.g.style.cursor=(ph===4)?'pointer':'default';
    c.body.style.fill=c.par?COL.p:COL.m;
    c.tip.style.fill=tipColor(c,ph);
  });
  cells.c0.style.opacity=(ph<=5)?1:0;
  cells.c1.forEach(e=>{e.style.opacity=(ph>=6&&ph<=8)?1:0;});
  cells.c2.forEach(e=>{e.style.opacity=(ph===9)?1:0;});
  nuc.style.opacity=(ph<=3)?1:0;
  nuc2.forEach(e=>{e.style.opacity=(ph===9)?1:0;});
  chiG.style.opacity=(ph===3)?1:0;
  drawSpindle(ph,Lo);
  paintText();
}
/* ===== Raona-ho ===== */
function load(i){stepGo(i);RZ.show($('#msvg'));}
const pw=n=>Math.pow(2,n);
RZ.init({
 F:{chrom:{l:'l_chrom'},chromat:{l:'l_chromat'},biv:{l:'l_biv'},p2:{l:'l_p2'},p3:{l:'l_p3'},p4:{l:'l_p4'},gam:{l:'l_gam'},adn:{l:'l_adn',u:'C'},step:{l:'l_step'},par:{l:'l_par'}},
 sim:v=>load(v[0]),
 M:[
  {id:'m1',f:['chrom','chromat'],sim:()=>load(1),ok:()=>({k:'m1_ok'}),
   chk:([c,a])=>c===4&&a===8?null:c===8?{k:'m1_8'}:{k:'m1_f'}},
  {id:'m2',f:['biv','chromat'],sim:()=>load(4),ok:()=>({k:'m2_ok'}),
   chk:([b,a])=>b===4&&a===16?null:b===8?{k:'m2_biv'}:{k:'m2_f'}},
  {id:'m3',f:['p2','p3','p4'],sim:()=>load(4),ok:()=>({k:'m3_ok'}),
   chk:([a,b,c])=>a===4&&b===8&&c===16?null:{k:'m3_f'}},
  {id:'m4',f:['gam','adn'],sim:()=>load(9),ok:()=>({k:'m4_ok'}),
   chk:([g,d])=>g===4&&d===1?null:g===2?{k:'m4_2'}:{k:'m4_f'}}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>load(1)},
  {id:'s2',ans:'D',f:['step'],sim:()=>load(1),cxsim:()=>load(6),cxok:([v])=>({k:'s2.cx',p:[v]}),
   cx:([v])=>(Number.isInteger(v)&&v>=4&&v<=10)?null:{k:'s_cx_no'}},
  {id:'s3',ans:'S',sim:()=>load(8)},
  {id:'s4',ans:'S',sim:()=>load(9)},
  {id:'s5',ans:'D',f:['step'],sim:()=>load(0),cxsim:()=>load(9),cxok:([v])=>({k:'s5.cx',p:[v]}),
   cx:([v])=>(Number.isInteger(v)&&v>=7&&v<=10)?null:{k:'s_cx_no'}},
  {id:'s6',ans:'M',sim:()=>load(5)}
 ],
 E:[{id:'e1',who:1,args:[1]},{id:'e2',who:3,args:[6]},{id:'e3',who:2,args:[3]}],
 D:[
  {id:'d1',chips:{vals:[6,7,9,10],fmt:x=>t('n'+x)},sim:([p])=>load(p-1),ok:()=>({k:'d1_ok'}),
   chk:([p])=>p===9?null:{k:'d1_'+p}},
  {id:'d2',f:['par'],sim:()=>load(4),ok:()=>({k:'d2_ok'}),
   chk:([n])=>(!Number.isInteger(n)||n<1||n>30)?{k:'rng'}:n<10?{k:'d2_lo',p:[n,nf(pw(n),0)]}:n>10?{k:'d2_hi',p:[n,nf(pw(n),0)]}:null}
 ]
});
initQuiz(QDATA);
initLang();applyLang();
buildSvg();
document.addEventListener('langchange',paintText);
stepsInit(STEPS,(i)=>{if(i===0)MS.o=[0,0];render(i);});
