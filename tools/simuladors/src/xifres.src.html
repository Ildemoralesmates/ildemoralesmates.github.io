<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xifres i lletres</title>
<meta name="description" content="Joc de classe «Xifres i lletres»: prova de lletres i prova de xifres amb rellotge, equips, marcador i solució pas a pas. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d'uns altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
:root{--tile:#fff4d6;--tile-v:#ffe39a;--tile-ink:#1b2742;--tile-edge:#cdbb8a;--gold:#f0b429;--gold-ink:#3a2a00;--gold-edge:#b98a14;--led:#ff9f1a}
.bar .pill b{color:var(--ink)}
.bar .sp{margin-left:auto}
.tabsx{display:flex;gap:6px}
.tabsx button{flex:1;font:inherit;font-weight:600;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--ink);cursor:pointer}
.tabsx button[aria-pressed=true]{background:var(--pa);border-color:var(--pa);color:var(--panel)}
.stagebox{display:grid;gap:12px;padding:14px;background:var(--stage);border-radius:0 0 10px 10px;min-width:0}
.hintp{margin:0;font-size:13.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.tiles.nums{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;border-radius:9px;font-weight:800;font-size:clamp(1.3rem,4vw,2.9rem);background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge),0 7px 12px rgba(0,0,0,.25);font-family:var(--f-body)}
.tile.v{background:var(--tile-v)}
.tile.empty{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--muted);font-weight:400}
.tile.num{aspect-ratio:1/1;font-size:clamp(1.2rem,3.4vw,2.6rem)}
.tile.big{background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-edge),0 7px 12px rgba(0,0,0,.25)}
.tile.pop{animation:pop .4s ease-out backwards}
@keyframes pop{from{transform:rotateX(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.rowc{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.rowc .lab{font-size:13.5px;color:var(--muted)}
.target{display:flex;gap:6px;justify-content:center}
.digit{background:#05080f;color:var(--led);font-family:var(--f-num);font-weight:800;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.1;padding:.04em .26em;border-radius:9px;border:2px solid #000;min-width:1.1em;text-align:center;text-shadow:0 0 12px rgba(255,159,26,.5)}
.clockbox{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;border-top:1px solid var(--line);padding-top:12px}
.clk{position:relative;width:104px;height:104px;flex:none}
.clk svg{width:100%;height:100%;transform:rotate(-90deg)}
.clk .bgc{fill:none;stroke:var(--line);stroke-width:9}
.clk .fgc{fill:none;stroke:var(--pa);stroke-width:9;stroke-linecap:round}
.clk .fgc.warn{stroke:var(--warn)}
.clk .fgc.late{stroke:var(--pb)}
.clk .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.clkctl{display:grid;gap:8px;justify-items:start}
.side .msg{min-height:2.6em;margin:0;font-size:14px;border-left:4px solid var(--pa);background:var(--chip);border-radius:0 8px 8px 0;padding:7px 10px}
.side .msg.ok{border-color:var(--ok)}
.side .msg.bad{border-color:var(--warn)}
.side .msg.warn{border-color:var(--warn)}
.side h3{margin:2px 0 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.teams{display:grid;gap:8px}
.team{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.team .tname{min-width:0;font:inherit;font-weight:600;font-size:14px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--stage);color:var(--ink)}
.team .sc{display:flex;align-items:center;gap:6px}
.team .score{font-size:1.7rem;font-weight:800;min-width:1.6em;text-align:center;color:var(--pa);font-variant-numeric:tabular-nums;line-height:1}
.team .adj{padding:2px 8px;font-size:13px}
.team .ans{display:flex;gap:6px;align-items:center;grid-column:1/-1;flex-wrap:wrap}
.team .tin{flex:1 1 7rem;min-width:0;font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--stage);color:var(--ink)}
.team .sug{grid-column:1/-1;font-size:12.5px;color:var(--muted);min-height:1.3em}
.team .sug.ok{color:var(--ok)}
.team .sug.bad{color:var(--warn)}
.nteams{font-size:13px;color:var(--muted)}
.nchips{display:flex;flex-wrap:wrap;gap:6px;min-height:2.8rem;align-items:center}
.nchip{min-width:2.9rem;padding:6px 10px;border-radius:9px;background:var(--tile);color:var(--tile-ink);font:inherit;font-weight:800;font-size:1.15rem;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 0 var(--tile-edge);animation:pop .3s ease-out}
.nchip.sel{border-color:var(--pa)}
.nchip.hl{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.45)}
.nchip.hit{background:var(--ok);color:#fff;box-shadow:none}
.ops{display:flex;gap:6px}
.ops button{width:2.8rem;font:inherit;font-size:1.25rem;font-weight:800;padding:3px 0;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.ops button[aria-pressed=true]{background:var(--pa);border-color:var(--pa);color:var(--panel)}
ol.hist{margin:0;padding-left:1.4em;font-family:var(--f-num);font-size:13.5px;font-variant-numeric:tabular-nums}
.stat{font-size:13px;color:var(--muted);margin:0}
.rules ul{margin:6px 0 0;padding-left:1.2em;color:var(--muted);font-size:13.5px}
details.rules summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){.tile.pop,.nchip{animation:none}}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">

    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>

      <p class="lede" data-i18n="lede"></p>

  <main style="display:grid;gap:16px">

</div>

<div id="viewN" class="stagebox" style="padding:0;background:none" hidden>
<p class="hintp" data-i18n="hint_n"></p>
<div class="tiles nums" id="nTiles"></div>

<button class="btn" type="button" data-k="0">0</button><button class="btn" type="button" data-k="1">1</button><button class="btn" type="button" data-k="2">2</button><button class="btn" type="button" data-k="3">3</button><button class="btn" type="button" data-k="4">4</button>
</div>
<div class="target" id="target" role="img" data-i18n-aria="aria.target" aria-label=""></div>
<div class="rowc" style="justify-content:center">
<button class="btn primary" id="genT" type="button" data-i18n="gen_target"></button>
<label class="check"><input type="checkbox" id="onlySol" checked> <span data-i18n="only_solv"></span></label>
</div>
</div>

<div class="clockbox">
<div class="clk"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgc" cx="60" cy="60" r="54"/><circle class="fgc" id="clkFg" cx="60" cy="60" r="54"/></svg><div class="tm" id="clkT" aria-live="off">30</div></div>
<div class="clkctl">
<div class="rowc">
<button class="btn primary" id="clkGo" type="button" data-i18n="start"></button>
<button class="btn" id="clkReset" type="button" data-i18n="reset_clock"></button>
</div>
<label class="rowc"><span class="lab" data-i18n="dur_lbl"></span> <select id="dur"><option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option><option value="90">90 s</option></select></label>
<span class="note" data-i18n="space_hint"></span>
</div>
</div>
</div>
</div>
</div>

<div class="side">
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<h3 data-i18n="teams_h"></h3>
<div class="teams" id="teams"></div>
<label class="nteams"><span data-i18n="n_teams"></span> <select id="nTeams"><option>2</option><option>3</option><option>4</option></select></label>
<div id="calcBox" hidden>
<h3 data-i18n="calc_h"></h3>
<p class="note" data-i18n="calc_hint"></p>
<div class="nchips" id="chips"></div>
<div class="ops" id="ops" role="group" data-i18n-aria="aria.ops" aria-label="">
<button type="button" data-op="+" aria-pressed="false">+</button><button type="button" data-op="−" aria-pressed="false">−</button><button type="button" data-op="×" aria-pressed="false">×</button><button type="button" data-op="÷" aria-pressed="false">÷</button>
</div>
<ol class="hist" id="hist"></ol>
<p class="note" id="status"></p>
<div class="rowc">
<button class="btn" id="undo" type="button" data-i18n="undo"></button>
<button class="btn" id="resetCalc" type="button" data-i18n="reset_calc"></button>
<button class="btn primary" id="stepBtn" type="button" data-i18n="step_btn"></button>
<button class="btn" id="allBtn" type="button" data-i18n="all_btn"></button>
</div>
<p class="stat" id="stat"></p>
</div>
</div>
</div>
<p data-i18n-html="story"></p>
<details class="rules"><summary data-i18n="rules_h"></summary>
<ul><li data-i18n="rules_l"></li><li data-i18n="rules_n"></li><li data-i18n="rules_ops"></li></ul>
</details>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

(function(){

const G=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const x=a[i];a[i]=a[j];a[j]=x}return a}

/* ---------- bosses de lletres (segons l'idioma de la pàgina) ---------- */
const BAGS={
  ca:{V:{A:12,E:12,I:6,O:5,U:3},C:{B:2,C:3,'Ç':1,D:3,F:1,G:2,H:1,J:1,L:5,M:3,N:6,P:3,Q:1,R:6,S:8,T:5,V:2,X:1,Z:1}},
  es:{V:{A:12,E:12,I:6,O:9,U:5},C:{B:2,C:4,D:5,F:1,G:2,H:2,J:1,L:4,M:2,N:5,'Ñ':1,P:2,Q:1,R:5,S:6,T:4,V:1,X:1,Y:1,Z:1}}
};
function bagFor(kind){const c=BAGS[LANG][kind],arr=[];for(const k in c)for(let i=0;i<c[k];i++)arr.push(k);return shuffle(arr)}

/* ---------- solucionador (en un Worker) ---------- */
function solveAll(nums){
  const best=new Map(),seen=new Set(),sa=[],so=[],sb=[],sr=[];
  nums.forEach(v=>{if(v<=999&&!best.has(v))best.set(v,[])});
  function rec(arr,d){
    const n=arr.length;
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const x=arr[i],y=arr[j],hi=x>y?x:y,lo=x>y?y:x;
        const rest=[];
        for(let k=0;k<n;k++)if(k!==i&&k!==j)rest.push(arr[k]);
        for(let c=0;c<4;c++){
          let r,op;
          if(c===0){op='+';r=hi+lo}
          else if(c===1){if(lo===1)continue;op='×';r=hi*lo}
          else if(c===2){if(hi===lo)continue;op='−';r=hi-lo}
          else{if(lo===1||hi%lo!==0)continue;op='÷';r=hi/lo}
          sa[d]=hi;so[d]=op;sb[d]=lo;sr[d]=r;
          if(r<=999){
            const cur=best.get(r);
            if(cur===undefined||cur.length>d+1){
              const p=[];for(let q=0;q<=d;q++)p.push([sa[q],so[q],sb[q],sr[q]]);
              best.set(r,p);
            }
          }
          if(n>2){
            const nx=rest.concat([r]).sort((a,b)=>a-b);
            const key=nx.join(',');
            if(!seen.has(key)){seen.add(key);rec(nx,d+1)}
          }
        }
      }
    }
  }
  rec(nums.slice().sort((a,b)=>a-b),0);
  return Array.from(best.entries());
}

/* ---------- estat ---------- */
const S={mode:'L',round:1,letters:[],bags:null,nums:[],target:null,solMap:null,solving:false,pendingTarget:false,

/* ---------- missatges ---------- */
function setMsg(key,kind,p){S.msgKey=[key,p];const m=G('msg');m.textContent=key?t(key,p):'';m.className='msg'+(kind?' '+kind:'')}

/* ---------- so ---------- */
let ac=null;
function beep(f,d,type){
  if(S.muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=0.12;
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

/* ---------- rellotge ---------- */
const CIRC=2*Math.PI*54;
function drawClock(){
  const fg=G('clkFg');
  fg.style.strokeDasharray=CIRC;
  fg.style.strokeDashoffset=CIRC*(1-Math.max(0,S.left)/S.dur);
  fg.setAttribute('class','fgc'+(S.left<=5?' late':S.left<=10?' warn':''));
  G('clkT').textContent=Math.ceil(Math.max(0,S.left));
  G('clkGo').textContent=t(S.running?'pause':(S.left<S.dur&&S.left>0?'resume':'start'));
}
const boardReady=()=>S.mode==='L'?S.letters.length===9:S.target!==null;
function clockToggle(){
  if(S.running){S.left=Math.max(0,(S.end-performance.now())/1000);clearInterval(S.timer);S.running=false;drawClock();return}
  if(!boardReady()){setMsg(S.mode==='L'?'need_letters':'need_target','warn');return}
  if(S.left<=0)S.left=S.dur;
  S.running=true;S.end=performance.now()+S.left*1000;S.lastSec=Math.ceil(S.left);
  S.timer=setInterval(tick,100);beep(660,.12);drawClock();
}
function tick(){
  const left=(S.end-performance.now())/1000;
  if(left<=0){clearInterval(S.timer);S.running=false;S.left=0;drawClock();beep(220,.9,'sawtooth');setMsg('time_up','bad');return}
  S.left=left;
  const c=Math.ceil(left);
  if(c!==S.lastSec){S.lastSec=c;if(c<=5)beep(880,.08)}
  drawClock();
}
function clockReset(){clearInterval(S.timer);S.running=false;S.left=S.dur;drawClock()}

/* ---------- LLETRES ---------- */
function counts(){let v=0,c=0;S.letters.forEach(l=>{if(l.k==='V')v++;else c++});return{v,c}}
function canAdd(kind){
  const n=S.letters.length;if(n>=9)return false;
  const k=counts(),v=k.v+(kind==='V'?1:0),c=k.c+(kind==='C'?1:0);
  return(9-n-1)>=Math.max(0,3-v)+Math.max(0,3-c);
}
function draw1(kind){
  if(!S.bags)S.bags={V:bagFor('V'),C:bagFor('C')};
  if(!S.bags[kind].length)S.bags[kind]=bagFor(kind);
  S.letters.push({ch:S.bags[kind].pop(),k:kind});
}
function addLetter(kind){if(!canAdd(kind))return;draw1(kind);renderLetters(S.letters.length-1);afterLetters()}
function fillLetters(){
  let guard=0;
  while(S.letters.length<9&&guard++<20){
    const okV=canAdd('V'),okC=canAdd('C');
    if(!okV&&!okC)break;
    draw1(okV&&okC?(Math.random()<0.42?'V':'C'):(okV?'V':'C'));
  }
  renderLetters(-2);afterLetters();
}
function clearLetters(){S.letters=[];S.bags=null;S.teams.forEach(x=>{x.vL='';x.aL=false});renderLetters(-1);afterLetters();clockReset()}
function afterLetters(){
  if(S.letters.length===9)setMsg('letters_ready','ok');
  else{const k=counts();setMsg('letters_progress','',{n:S.letters.length,v:k.v,c:k.c})}
  refreshTeamInputs();
}
function renderLetters(pop){
  let h='';
  for(let i=0;i<9;i++){
    const l=S.letters[i];
    if(l){
      const p=(pop===i||pop===-2)?' pop':'';
      const d=pop===-2?' style="animation-delay:'+(i*70)+'ms"':'';
      h+='<div class="tile'+(l.k==='V'?' v':'')+p+'"'+d+'>'+l.ch+'</div>';
    }else h+='<div class="tile empty">·</div>';
  }
  G('lTiles').innerHTML=h;
  G('addV').disabled=!canAdd('V');G('addC').disabled=!canAdd('C');G('fillL').disabled=S.letters.length>=9;
}
function norm(s){
  return s.toUpperCase().replace(/Ñ/g,'\u0001').replace(/Ç/g,'\u0002').normalize('NFD')
    .replace(/[̀-ͯ]/g,'').replace(/[^A-Z\u0001\u0002]/g,'')
    .replace(/\u0001/g,'Ñ').replace(/\u0002/g,'Ç');
}
function checkWord(w){
  const pool={};S.letters.forEach(l=>{pool[l.ch]=(pool[l.ch]||0)+1});
  const bad=[];
  for(const ch of w){if(pool[ch]>0)pool[ch]--;else if(bad.indexOf(ch)<0)bad.push(ch)}
  return{ok:bad.length===0,bad};
}

  for(let i=0;i<6;i++){
    const n=S.nums[i];
    if(n)h+='<div class="tile num'+(n.big?' big':'')+(pop?' pop':'')+'"'+(pop?' style="animation-delay:'+(i*90)+'ms"':'')+'>'+n.v+'</div>';
    else h+='<div class="tile num empty">·</div>';
  }
  G('nTiles').innerHTML=h;
}
function renderTarget(v){
  const s=v===null?'···':String(v);
  G('target').innerHTML=s.split('').map(c=>'<div class="digit">'+c+'</div>').join('');
  G('target').setAttribute('aria-label',t('aria.target')+(v===null?'':': '+v));
}
function startSolve(){
  S.solving=true;const token=++S.token;
  const nums=S.nums.map(n=>n.v);
  const done=entries=>{
    if(token!==S.token)return;
    S.solMap=new Map(entries);S.solving=false;
    let reach=0;S.solMap.forEach((st,v)=>{if(v>=100&&v<=999)reach++});
    G('stat').textContent=t('stat',{n:reach});
    if(S.pendingTarget){S.pendingTarget=false;genTarget()}
    if(S.onSolved){const f=S.onSolved;S.onSolved=null;f()}
  };
  try{
    if(S.worker){S.worker.terminate();S.worker=null}
    const src=solveAll.toString()+';self.onmessage=function(e){self.postMessage(solveAll(e.data))};';
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    S.worker=w;
    w.onmessage=e=>done(e.data);
    w.onerror=()=>{w.terminate();S.worker=null;setTimeout(()=>done(solveAll(nums)),20)};
    w.postMessage(nums);
  }catch(e){setTimeout(()=>done(solveAll(nums)),20)}
}
function pickTarget(){
  if(G('onlySol').checked&&S.solMap){
    const keys=[];S.solMap.forEach((st,v)=>{if(v>=100&&v<=999)keys.push(v)});
    if(keys.length)return keys[rnd(keys.length)];
  }
  return 100+rnd(900);
}
function genTarget(){
  if(!S.nums.length){setMsg('need_numbers','warn');return}
  if(S.rolling)return;
  if(S.solving&&G('onlySol').checked){S.pendingTarget=true;setMsg('solving','warn');return}
  const fin=pickTarget();S.rolling=true;
  const t0=performance.now();
  const iv=setInterval(()=>{
    if(performance.now()-t0>(REDUCE?0:1500)){
      clearInterval(iv);S.rolling=false;S.target=fin;renderTarget(fin);beep(784,.15);
      setMsg('target_ready','ok');S.teams.forEach(x=>{x.aN=false});
      refreshTeamInputs();renderCalc();
    }else{renderTarget(100+rnd(900));beep(300+rnd(300),.03)}
  },70);
}
function bestSolution(){
  const tg=S.target;
  if(S.solMap.has(tg))return{v:tg,steps:S.solMap.get(tg),exact:true,diff:0};
  let bv=null,bd=1e9;
  S.solMap.forEach((st,v)=>{
    const d=Math.abs(v-tg);
    if(d<bd||(d===bd&&st.length<S.solMap.get(bv).length)){bd=d;bv=v}
  });
  return{v:bv,steps:S.solMap.get(bv),exact:false,diff:bd};
}

/* ---------- Taller de càlcul ---------- */
function resetPool(){
  S.pool=S.nums.map(n=>({id:S.nextId++,v:n.v,used:false}));
  S.hist=[];S.selA=null;S.selOp=null;S.sol=null;S.solStep=0;S.busy=false;
  renderCalc();
}
const active=()=>S.pool.filter(c=>!c.used);
function renderCalc(hl){
  G('calcBox').hidden=S.mode!=='N';
  G('chips').innerHTML=active().map(c=>'<button type="button" class="nchip'+(S.selA===c.id?' sel':'')+(hl&&hl.indexOf(c.id)>=0?' hl':'')+(S.target!==null&&c.v===S.target?' hit':'')+'" data-id="'+c.id+'">'+c.v+'</button>').join('');
  Array.prototype.forEach.call(G('ops').children,b=>b.setAttribute('aria-pressed',String(S.selOp===b.dataset.op)));
  G('hist').innerHTML=S.hist.map(s=>'<li>'+s.a+' '+s.op+' '+s.b+' = <b>'+s.r+'</b></li>').join('');
  let st='';
  if(S.target!==null&&S.hist.length){
    let bd=1e9;active().forEach(c=>{bd=Math.min(bd,Math.abs(c.v-S.target))});
    st=bd===0?t('status_hit'):t('status_best',{d:bd});
  }
  G('status').textContent=st;
  const total=S.sol?S.sol.steps.length:0;
  G('stepBtn').textContent=S.sol&&S.solStep<total?t('step_next',{k:S.solStep+1,n:total}):t('step_btn');
  const fin=!!S.sol&&S.solStep>=total;
  G('stepBtn').disabled=S.busy||fin;G('allBtn').disabled=S.busy||fin;G('undo').disabled=S.busy||!S.hist.length;
}
function doOp(idA,op,idB){
  const A=S.pool.filter(c=>c.id===idA)[0],B=S.pool.filter(c=>c.id===idB)[0];
  if(!A||!B||A===B)return false;
  let a=A.v,b=B.v,ia=idA,ib=idB;
  if((op==='−'||op==='÷')&&a<b){let x=a;a=b;b=x;x=ia;ia=ib;ib=x}
  let r;
  if(op==='+')r=a+b;
  else if(op==='×')r=a*b;
  else if(op==='−'){r=a-b;if(r<=0){setMsg('err_zero','bad');return false}}
  else{if(b===0||a%b!==0){setMsg('err_div','bad');return false}r=a/b}
  A.used=true;B.used=true;
  const Cn={id:S.nextId++,v:r,used:false};S.pool.push(Cn);
  S.hist.push({a,op,b,r,ia,ib,ir:Cn.id});
  S.selA=null;S.selOp=null;
  if(S.target!==null&&r===S.target)setMsg('status_hit','ok');
  return true;
}
function undo(){
  const s=S.hist.pop();if(!s)return;
  S.pool.forEach(c=>{if(c.id===s.ia||c.id===s.ib)c.used=false});
  S.pool=S.pool.filter(c=>c.id!==s.ir);
  S.selA=null;S.selOp=null;
  if(S.sol&&S.solStep>0)S.solStep--;
  renderCalc();
}
function ensureSolution(){
  if(S.target===null||!S.solMap){setMsg(S.solving?'solving':'need_target','warn');return false}
  if(S.sol)return true;
  resetPool();
  S.sol=bestSolution();S.solStep=0;
  if(!S.sol.steps.length)setMsg('sol_trivial','ok');
  else if(S.sol.exact)setMsg('sol_exact','ok',{n:S.sol.steps.length});
  else setMsg('sol_near','warn',{v:S.sol.v,d:S.sol.diff});
  renderCalc();
  return true;
}
function stepOnce(done){
  const st=S.sol.steps[S.solStep];
  const A=active().filter(c=>c.v===st[0])[0];
  const B=active().filter(c=>c.v===st[2]&&c!==A)[0];
  if(!A||!B){S.busy=false;renderCalc();return}
  S.busy=true;renderCalc([A.id,B.id]);
  setTimeout(()=>{
    doOp(A.id,st[1],B.id);S.solStep++;S.busy=false;renderCalc();beep(520,.08);
    if(S.solStep>=S.sol.steps.length)S.sol.exact?setMsg('sol_done_exact','ok'):setMsg('sol_done_near','warn',{v:S.sol.v});
    if(done)done();
  },REDUCE?0:650);
}
function stepBtn(){if(S.busy)return;if(!ensureSolution())return;if(S.solStep<S.sol.steps.length)stepOnce()}
function allBtn(){
  if(S.busy)return;if(!ensureSolution())return;
  const go=()=>{if(S.solStep<S.sol.steps.length)stepOnce(go)};go();
}

/* ---------- Equips ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function renderTeams(){
  G('teams').innerHTML=S.teams.map((x,i)=>
    '<div class="team" data-i="'+i+'">'+
    '<input type="text" class="tname" maxlength="30" value="'+esc(x.name)+'" placeholder="'+esc(t('team_default',{n:i+1}))+'" aria-label="'+esc(t('team_name'))+'">'+
    '<div class="sc"><button type="button" class="btn adj" data-a="minus" aria-label="−1">−1</button><span class="score">'+x.score+'</span><button type="button" class="btn adj" data-a="plus" aria-label="+1">+1</button></div>'+
    '<div class="ans"><input type="text" class="tin" autocomplete="off" spellcheck="false"><button type="button" class="btn primary" data-a="apply" disabled></button></div>'+
    '<div class="sug"></div></div>').join('');
  G('nTeams').value=String(S.teams.length);
  refreshTeamInputs();
}
function refreshTeamInputs(){
  document.querySelectorAll('.team').forEach((card,i)=>{
    const x=S.teams[i],inp=card.querySelector('.tin');
    inp.placeholder=t(S.mode==='L'?'ph_word':'ph_num');inp.inputMode=S.mode==='L'?'text':'numeric';
    inp.setAttribute('aria-label',inp.placeholder);
    if(inp.value!==x['v'+S.mode])inp.value=x['v'+S.mode];
    updateSug(i);
  });
}
function evalTeam(i){
  const x=S.teams[i],v=x['v'+S.mode].trim();
  if(S.mode==='L'){
    if(S.letters.length<9)return{st:'wait',txt:t('sug_wait_letters')};
    if(!v)return{st:'empty',txt:t('sug_type_word')};
    const w=norm(v);
    if(!w)return{st:'bad',txt:t('word_bad_empty')};
    if(w.length>9)return{st:'bad',txt:t('word_too_long',{n:w.length})};
    const r=checkWord(w);
    if(!r.ok)return{st:'bad',txt:t('word_bad',{c:r.bad.join(' ')})};
    const p=w.length===9?18:w.length;
    return{st:'ok',p,txt:t('word_ok',{n:w.length,p})};
  }
  if(S.target===null)return{st:'wait',txt:t('sug_wait_target')};
  if(!v)return{st:'empty',txt:t('sug_type_num')};
  const n=parseInt(v,10);
  if(isNaN(n)||n<=0)return{st:'bad',txt:t('num_bad')};
  const d=Math.abs(n-S.target),p=d===0?10:d<=5?7:d<=10?5:0;
  return{st:'ok',p,txt:t('num_ok',{d,p})};
}
function updateSug(i){
  const card=document.querySelector('.team[data-i="'+i+'"]');if(!card)return;
  const ev=evalTeam(i),x=S.teams[i],sug=card.querySelector('.sug'),btn=card.querySelector('[data-a="apply"]');
  sug.textContent=ev.txt;sug.className='sug'+(ev.st==='ok'?' ok':ev.st==='bad'?' bad':'');
  if(x['a'+S.mode]){btn.textContent=t('applied');btn.disabled=true}
  else{btn.textContent=ev.st==='ok'?t('apply',{p:ev.p}):t('apply0');btn.disabled=ev.st!=='ok'}
}
function setScore(i,delta){
  S.teams[i].score+=delta;
  const el=document.querySelector('.team[data-i="'+i+'"] .score');if(el)el.textContent=S.teams[i].score;
  save();
}

/* ---------- Ronda / mode ---------- */
function setMode(m){
  if(S.mode===m)return;
  S.mode=m;
  G('tabL').setAttribute('aria-pressed',String(m==='L'));G('tabN').setAttribute('aria-pressed',String(m==='N'));
  G('viewL').hidden=m!=='L';G('viewN').hidden=m!=='N';
  S.dur=m==='L'?30:45;G('dur').value=String(S.dur);clockReset();
  setMsg(m==='L'?'hint_l':'hint_n');
  refreshTeamInputs();renderCalc();
}
function newRound(){
  S.round++;G('roundNum').textContent=S.round;
  S.letters=[];S.bags=null;S.nums=[];S.target=null;S.solMap=null;S.pendingTarget=false;S.token++;
  if(S.worker){S.worker.terminate();S.worker=null}
  S.teams.forEach(x=>{x.vL='';x.vN='';x.aL=false;x.aN=false});
  renderLetters(-1);renderNums(false);renderTarget(null);resetPool();clockReset();
  G('stat').textContent='';
  setMsg('new_round_msg');refreshTeamInputs();save();
}
let resetArm=0;
function resetGame(){
  const b=G('resetGame');
  if(!resetArm){resetArm=1;b.textContent=t('reset_sure');setTimeout(()=>{resetArm=0;b.textContent=t('reset_game')},3000);return}
  resetArm=0;b.textContent=t('reset_game');
  S.round=0;S.teams.forEach(x=>{x.score=0});
  renderTeams();newRound();
}

/* ---------- càrrega d'un cas des de Raona-ho ---------- */
function load(o){
  o=o||{};
  if(S.mode!=='N')setMode('N');
  clockReset();setMsg('');
  const nums=(o.nums&&o.nums.length===6)?o.nums:[100,25,3,2,7,10];
  setNums(nums);S.target=o.target||null;S.solMap=null;S.pendingTarget=false;
  S.teams.forEach(x=>{x.vN='';x.aN=false});
  renderNums(false);renderTarget(S.target);resetPool();
  G('stat').textContent=t('stat_wait');
  startSolve();refreshTeamInputs();
  (o.steps||[]).forEach(s=>{
    const A=active().filter(c=>c.v===s[0])[0];
    const B=active().filter(c=>c.v===s[2]&&c!==A)[0];
    if(A&&B)doOp(A.id,s[1],B.id);
  });
  renderCalc();
  RZ.show(G('nTiles'));
}

/* ---------- Raona-ho ---------- */
const C1=[100,25,3,2,7,10];
const SETS=[[25,50,75,100,3,7],[1,2,3,4,5,6],[4,5,6,7,8,9],[50,7,3,2,1,1]];
const SETC=[860,442,895,770];
const D2EXP=[[100,'+',10],[100,'×',10],[10,'×',9],[100,'−',10]];
const usable=(vals,set)=>{const pool=set.slice();for(const v of vals){const k=pool.indexOf(v);if(k<0)return false;pool.splice(k,1)}return true};
const posInt=v=>v.every(x=>Number.isInteger(x)&&x>0);
const FA={l:'f_a'},FB={l:'f_b'},FC={l:'f_c'};
RZ.init({
 sim:([o])=>load(o),
 M:[
  {id:'m1',f:[FA,FB],sim:()=>load({nums:C1,target:107}),
   chk:([a,b])=>!posInt([a,b])?{k:'rng'}:!usable([a,b],C1)?{k:'m_notin'}:a+b!==107?{k:'m1_f',p:[a,b,a+b]}:null,ok:()=>({k:'m1_ok'})},
  {id:'m2',f:[FA,FB,FC],sim:()=>load({nums:C1,target:270}),
   chk:([a,b,c])=>!posInt([a,b,c])?{k:'rng'}:!usable([a,b,c],C1)?{k:'m_notin'}:(a+b)*c!==270?{k:'m2_f',p:[a,b,c,(a+b)*c]}:null,ok:()=>({k:'m2_ok'})},
  {id:'m3',f:[{l:'f_n'}],sim:()=>load({nums:C1,target:977}),
   chk:([n])=>!posInt([n])?{k:'rng'}:n<3?{k:'m3_poc',p:[n]}:n>3?{k:'m3_molt',p:[n]}:null,ok:()=>({k:'m3_ok'})}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load({nums:C1})},
  {id:'s2',ans:'D',f:[FA,FB],sim:()=>load({nums:C1}),
   cxsim:([a,b])=>load({nums:[a||1,b||7,25,100,3,10],steps:a&&b?[[a,'×',b]]:[]}),
   cxok:([a,b])=>({k:'s2_cx',p:[a,b,a*b]}),
   cx:([a,b])=>!posInt([a,b])?{k:'rng'}:a*b>Math.max(a,b)?{k:'s2_nocx',p:[a,b,a*b]}:null},
  {id:'s3',ans:'S',sim:()=>load({nums:[4,7,3,10,25,2],steps:[[4,'×',7]]})},
  {id:'s4',ans:'M',sim:()=>load({nums:[3,5,2,10,25,100],steps:[[3,'+',5]]})},
  {id:'s5',ans:'M',sim:()=>load({nums:C1,steps:[[7,'×',3]]})},
  {id:'s6',ans:'D',f:[FA,FB],sim:()=>load({nums:[10,5,3,2,7,25],steps:[[10,'÷',5]]}),
   cxsim:([a,b])=>load({nums:[a||3,b||3,25,100,2,10],steps:a&&b&&a%b===0?[[a,'÷',b]]:[]}),
   cxok:([a,b])=>({k:'s6_cx',p:[a,b]}),
   cx:([a,b])=>!posInt([a,b])?{k:'rng'}:a%b!==0?{k:'s6_nodiv',p:[a,b]}:a/b>1?{k:'s6_nocx',p:[a,b,a/b]}:null}
 ],
 E:[
  {id:'e1',who:0,args:[{nums:[7,5,10,25,3,1],steps:[[5,'−',7]]}]},
  {id:'e2',who:1,args:[{nums:[20,8,10,25,3,1],steps:[[20,'÷',8]]}]},
  {id:'e3',who:1,args:[{nums:[3,4,5,10,25,2],steps:[[3,'+',4],[7,'×',5]]}]}
 ],
 D:[
  {id:'d1',chips:{vals:[0,1,2,3],fmt:i=>SETS[i].join(' · ')},f:[{l:'d1.l0'}],
   sim:([p])=>load({nums:SETS[p]||SETS[2]}),ok:()=>({k:'d1_ok'}),
   chk:([p,n])=>p!==2?{k:'d1_f',p:[SETS[p].join(', '),SETC[p]]}:!Number.isFinite(n)||Math.abs(n-SETC[2])>15?{k:'d1_n'}:null},
  {id:'d2',chips:{vals:[0,1,2,3],fmt:i=>D2EXP[i].join(' ')},f:[{l:'d2.l0'}],
   sim:([p])=>load({nums:[100,10,9,3,2,1],target:999,steps:(p===undefined||p===null)?[]:[D2EXP[p]]}),ok:()=>({k:'d2_ok'}),
   chk:([p,d])=>{
     const e=D2EXP[p],r=e[1]==='+'?e[0]+e[2]:e[1]==='×'?e[0]*e[2]:e[0]-e[2],dd=Math.abs(r-999);
     return p!==1?{k:'d2_f',p:[e.join(' '),r,dd]}:d!==1?{k:'d2_d'}:null;}}
 ]
});

/* ---------- arrencada ---------- */
function init(){
  load0();
  G('roundNum').textContent=S.round;
  renderTeams();renderLetters(-1);renderNums(false);renderTarget(null);
  S.dur=30;S.left=30;
  G('tabL').onclick=()=>setMode('L');G('tabN').onclick=()=>setMode('N');
  G('addV').onclick=()=>addLetter('V');G('addC').onclick=()=>addLetter('C');
  G('fillL').onclick=fillLetters;G('clearL').onclick=clearLetters;
  G('bigRow').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.k!==undefined)drawNumbers(+b.dataset.k)};
  G('genT').onclick=genTarget;
  G('clkGo').onclick=clockToggle;G('clkReset').onclick=clockReset;
  G('dur').onchange=function(){S.dur=+this.value;clockReset()};
  G('newRound').onclick=newRound;G('resetGame').onclick=resetGame;
  G('mute').onclick=function(){S.muted=!S.muted;this.textContent=S.muted?'🔇':'🔊'};
  G('nTeams').onchange=function(){
    const n=+this.value;
    while(S.teams.length<n)S.teams.push(newTeam());
    S.teams=S.teams.slice(0,n);renderTeams();save();
  };
  G('teams').addEventListener('input',e=>{
    const el=e.target,card=el.closest('.team');if(!card)return;
    const i=+card.dataset.i;
    if(el.classList.contains('tname')){S.teams[i].name=el.value;save()}
    else if(el.classList.contains('tin')){S.teams[i]['v'+S.mode]=el.value;updateSug(i)}
  });
  G('teams').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const card=b.closest('.team'),i=+card.dataset.i,a=b.dataset.a;
    if(a==='plus')setScore(i,1);
    else if(a==='minus')setScore(i,-1);
    else if(a==='apply'){
      const ev=evalTeam(i);
      if(ev.st==='ok'&&!S.teams[i]['a'+S.mode]){S.teams[i]['a'+S.mode]=true;setScore(i,ev.p);updateSug(i);beep(700,.1)}
    }
  });
  G('chips').addEventListener('click',e=>{
    const b=e.target.closest('.nchip');if(!b||S.busy)return;
    const id=+b.dataset.id;
    if(S.selA===null||S.selOp===null){S.selA=S.selA===id?null:id;renderCalc();return}
    if(id===S.selA){S.selA=null;S.selOp=null;renderCalc();return}
    doOp(S.selA,S.selOp,id);renderCalc();
  });
  G('ops').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||S.busy)return;
    if(S.selA===null){setMsg('pick_first','warn');return}
    S.selOp=S.selOp===b.dataset.op?null:b.dataset.op;renderCalc();
  });
  G('undo').onclick=undo;G('resetCalc').onclick=()=>resetPool();
  G('stepBtn').onclick=stepBtn;G('allBtn').onclick=allBtn;
  document.addEventListener('keydown',e=>{
    const tg=e.target&&e.target.tagName;
    if(e.code==='Space'&&tg!=='INPUT'&&tg!=='TEXTAREA'&&tg!=='SELECT'&&tg!=='BUTTON'){e.preventDefault();clockToggle()}
  });
  document.addEventListener('langchange',()=>{
    drawClock();renderTeams();renderTarget(S.target);renderCalc();
    G('resetGame').textContent=t('reset_game');
    G('mute').title=t('sound_title');
    if(S.msgKey&&S.msgKey[0])setMsg(S.msgKey[0],'',S.msgKey[1]);else setMsg('msg_welcome');
  });
  setMsg('msg_welcome');
}
init();
initQuiz([]);
initLang();applyLang();
})();
