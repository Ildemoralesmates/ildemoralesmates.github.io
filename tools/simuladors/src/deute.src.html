/* ===== Inflació i deute revolving ===== */
const W=900,H=470,cx=fitCanvas($('#cv'),W,H);
const MAXM=360,MINQ=15;
const PRE={infl:[['pr_i1',1000,3,0,20],['pr_i2',1000,3,2,20],['pr_i3',1000,10,0,20],['pr_i4',1000,3,5,20]],
 card:[['pr_c1',3000,24,'fix',100],['pr_c2',3000,24,'fix',60],['pr_c3',3000,24,'pct',3],['pr_c4',3000,8,'fix',100]]};
let mode='infl',C0=1000,INF=3,ACC=0,T=20,D0=3000,TIN=24,PT='fix',Q=100,QP=3,phase=0,target=0,guess=null,msgFn=null,valid=true,SIM=null;
const fx=(v,d)=>v.toFixed(d).replace('.',',');
const eur=v=>{const r=Math.round(v*100)/100;let [a,b]=Math.abs(r).toFixed(2).split('.');if(a.length>4)a=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (r<0?'−':'')+a+(b==='00'?'':','+b)+' €';};
const pct=(v,d=2)=>{const m=Math.pow(10,d),r=Math.round(v*m)/m;let o=(Object.is(r,-0)?0:r).toFixed(d);if(d>0)o=o.replace(/\.?0+$/,'');return o.replace('.',',');};
const fI=x=>{let s=x.toFixed(4).replace(/0+$/,'');if(!s.split('.')[1]||s.split('.')[1].length<2)s=x.toFixed(2);return s.replace('.',',');};
/* ---- models ---- */
const priceIdx=t=>Math.pow(1+INF/100,t), nomV=t=>C0*Math.pow(1+ACC/100,t), realV=t=>nomV(t)/priceIdx(t);
function simCard(d0,tin,pt,q){const r=tin/1200,debt=[d0],intr=[0],pay=[0],cP=[0],cI=[0];let d=d0,m=0;
  while(d>0.005&&m<MAXM){m++;const it=Math.round(d*r*100)/100;let p=pt==='fix'?q:Math.max(MINQ,(d+it)*q/100);p=Math.min(p,d+it);p=Math.round(p*100)/100;
    d=Math.round((d+it-p)*100)/100;debt.push(d);intr.push(it);pay.push(p);cP.push(cP[m-1]+p);cI.push(cI[m-1]+it);}
  return {debt,intr,pay,cP,cI,M:m,done:d<=0.005,never:pt==='fix'&&q<=d0*r+1e-9};}
/* ---- controls ---- */
function inField(id,key,val,on){const d=document.createElement('div');d.className='c0in';
  d.innerHTML='<label for="'+id+'">'+t(key)+'</label><input type="text" inputmode="decimal" id="'+id+'" autocomplete="off">';
  $('input',d).value=String(val).replace('.',',');$('input',d).oninput=()=>{const v=parseNum($('input',d).value);on(Number.isFinite(v)?v:NaN);};return d;}
function buildCtls(){const box=$('#ctls');box.innerHTML='';
  if(mode==='infl'){
    box.appendChild(inField('c0','c0',C0,v=>{C0=v;reset();}));
    slider(box,{id:'si',key:'infl',min:0,max:15,step:0.5,val:INF,fmtv:v=>pct(v,1)+' %',on:v=>{INF=v;reset();}});
    slider(box,{id:'sa',key:'acc',min:0,max:10,step:0.5,val:ACC,fmtv:v=>pct(v,1)+' %',on:v=>{ACC=v;reset();}});
    slider(box,{id:'st',key:'years',min:1,max:40,step:1,val:T,fmtv:v=>String(v),on:v=>{T=v;reset();}});
  }else{
    box.appendChild(inField('d0','d0',D0,v=>{D0=v;reset();}));
    slider(box,{id:'stin',key:'tin',min:5,max:30,step:0.5,val:TIN,fmtv:v=>pct(v,1)+' %',on:v=>{TIN=v;reset();}});
    const sg=document.createElement('div');sg.className='seg';sg.setAttribute('role','group');sg.setAttribute('aria-label',t('aria.ptype'));
    sg.innerHTML='<button type="button" data-p="fix">'+t('ptype_fix')+'</button><button type="button" data-p="pct">'+t('ptype_pct')+'</button>';
    $$('button',sg).forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.p===PT));b.onclick=()=>{PT=b.dataset.p;buildCtls();reset();};});
    const w=document.createElement('div');w.className='c0in';w.appendChild(sg);box.appendChild(w);
    if(PT==='fix')slider(box,{id:'sq',key:'q_fix',min:10,max:500,step:1,val:Q,fmtv:v=>v+' €',on:v=>{Q=v;reset();}});
    else slider(box,{id:'sqp',key:'q_pct',min:1,max:10,step:0.5,val:QP,fmtv:v=>pct(v,1)+' % (min. '+MINQ+' €)',on:v=>{QP=v;reset();}});
  }
  $$('#ctls [data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));}
function buildPresets(){const box=$('#presets');box.innerHTML='';
  PRE[mode].forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t(p[0]);
    const on=mode==='infl'?(p[1]===C0&&p[2]===INF&&p[3]===ACC&&p[4]===T):(p[1]===D0&&p[2]===TIN&&p[3]===PT&&(p[3]==='fix'?p[4]===Q:p[4]===QP));
    b.setAttribute('aria-pressed',String(on));b.onclick=()=>{if(mode==='infl')setInfl(...p.slice(1));else setCard(...p.slice(1));};box.appendChild(b);});}
function setMode(m){mode=m;$$('#modesw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
  $('#ideaI').hidden=m!=='infl';$('#ideaC').hidden=m==='infl';$('#go12').hidden=m==='infl';
  const k=m==='infl'?'guess_infl':'guess_card';$('#guessLab').dataset.i18n=k;$('#guessLab').textContent=t(k);$('#guessU').textContent=m==='infl'?'€':t('u_mes');}
function setInfl(c,i,a,y){setMode('infl');C0=c;INF=i;ACC=a;T=y;buildCtls();$('#guess').value='';guess=null;reset();}
function setCard(d,r,pt,q){setMode('card');D0=d;TIN=r;PT=pt;if(pt==='fix')Q=q;else QP=q;buildCtls();$('#guess').value='';guess=null;reset();}
const steps=()=>mode==='infl'?T:(SIM?SIM.M:0);
function reset(){phase=0;target=0;msgFn=null;$('#msg').innerHTML='';$('#msg').className='msg';
  valid=mode==='infl'?(Number.isFinite(C0)&&C0>0&&C0<=1e9):(Number.isFinite(D0)&&D0>0&&D0<=1e7);
  SIM=valid&&mode==='card'?simCard(D0,TIN,PT,PT==='fix'?Q:QP):null;buildPresets();texts();}
$$('#modesw button').forEach(b=>b.onclick=()=>{if(b.dataset.m===mode)return;const p=PRE[b.dataset.m][0];if(b.dataset.m==='infl')setInfl(...p.slice(1));else setCard(...p.slice(1));});
function start(){if(target===0){const g=parseNum($('#guess').value);guess=$('#guess').value.trim()!==''&&Number.isFinite(g)?g:null;}}
$('#go').onclick=()=>{if(!valid||target>=steps())return;start();target=Math.min(steps(),Math.round(target)+1);};
$('#go12').onclick=()=>{if(!valid||target>=steps())return;start();target=Math.min(steps(),Math.round(target)+12);};
$('#fast').onclick=()=>{if(!valid||target>=steps())return;start();target=steps();};
$('#again').onclick=()=>{$('#guess').value='';guess=null;reset();};
function setBtns(){const g=$('#go'),k=Math.round(target),S=steps(),off=!valid||k>=S;
  g.disabled=$('#go12').disabled=$('#fast').disabled=off;g.textContent=off&&valid?t('go_done'):t(mode==='infl'?'go_infl':'go_card');}
const ym=m=>tt('c_ym',Math.floor(m/12),m%12);
function texts(){
  setBtns();const P=$('#panel'),ms=$('#msg');
  if(!valid){P.innerHTML='';ms.className='msg bad';ms.textContent=t('bad_in');return;}
  if(ms.textContent===t('bad_in')){ms.textContent='';ms.className='msg';}
  const k=Math.floor(phase+1e-9);
  if(mode==='infl'){
    const y=k,pi=priceIdx(y),re=realV(y),ch=(re/C0-1)*100;
    let h='<p class="big">'+tt('i_year',y)+'</p><div class="ticket">'+tt('i_price',eur(100*pi),fI(pi))+'<br>'+tt('i_nom',eur(nomV(y)))+'<br>'+tt('i_real',eur(re))+'<br>'+
      (ch<=0?tt('i_lost',pct(-ch,1)):tt('i_gain',pct(ch,1)))+'</div>';
    if(INF>0){let d2=null;for(let t2=1;t2<=400;t2++)if(priceIdx(t2)>=2){d2=t2;break;}if(d2!==null&&d2<=y)h+='<p class="big" style="font-size:13.5px">'+tt('i_half',d2)+'</p>';}
    P.innerHTML=h;
  }else{
    const S=SIM,m=Math.min(k,S.M);
    let h='<div class="ticket">'+tt('c_tae',pct(TIN,1),pct(TIN/12,3),pct((Math.pow(1+TIN/1200,12)-1)*100,2))+'</div>';
    h+='<p class="big">'+tt('c_month',m,ym(m))+'</p><div class="ticket">'+tt('c_debt',eur(S.debt[m]));
    if(m>=1)h+='<br>'+tt('c_split',eur(S.pay[m]),eur(Math.min(S.intr[m],S.pay[m])),eur(Math.max(0,S.pay[m]-S.intr[m])));
    h+='<br>'+tt('c_paid',eur(S.cP[m]),eur(S.cI[m]))+'</div>';
    if(k>=S.M){if(S.done)h+='<div class="alert">'+tt('c_end',S.M,ym(S.M),eur(S.cP[S.M]),eur(D0),fx(S.cP[S.M]/D0,2))+'</div>';
      else h+='<div class="alert">'+tt(S.never?'c_never':'c_slow',eur(S.debt[S.M]),eur(S.cP[S.M]))+'</div>';}
    P.innerHTML=h;
  }
  if(msgFn)msgFn();
}
function finish(){
  msgFn=()=>{const m=$('#msg');if(guess===null){m.className='msg';m.innerHTML='';return;}
    if(mode==='infl'){const re=realV(T),lin=C0*(1-INF/100*T),near=(a,b)=>Math.abs(a-b)<=0.011+Math.abs(b)*0.005;
      if(near(guess,re)){m.className='msg good';m.innerHTML=tt('g_ok',eur(re));}
      else if(near(guess,lin)&&INF>0&&ACC===0){m.className='msg bad';m.innerHTML=tt('g_lin_i',eur(guess),pct(INF,1),eur(re));}
      else{m.className='msg bad';m.innerHTML=tt('g_ko_i',eur(guess),eur(re));}}
    else{const S=SIM;
      if(!S.done){m.className=Math.round(guess)>=MAXM?'msg good':'msg bad';m.innerHTML=t('g_never');return;}
      const lin=PT==='fix'?Math.ceil(D0/Q):null;
      if(Math.round(guess)===S.M){m.className='msg good';m.innerHTML=tt('g_ok',S.M+' '+t('u_mes'));}
      else if(lin!==null&&Math.round(guess)===lin){m.className='msg bad';m.innerHTML=tt('g_lin_c',pct(guess,0),S.M);}
      else{m.className='msg bad';m.innerHTML=tt('g_ko_c',pct(guess,1),S.M);}}};
  texts();}
/* ---- dibuix ---- */
function niceStep(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function kfmt(v){return v>=1e6?pct(v/1e6,1)+' M':v>=1e4?pct(v/1e3,0)+' k':pct(v,0);}
function hatch(x,y,w,h,col){if(w<=0||h<=0)return;cx.save();cx.beginPath();cx.rect(x,y,w,h);cx.clip();cx.strokeStyle=col;cx.lineWidth=1.6;cx.beginPath();
  for(let k=-h;k<w+h;k+=7){cx.moveTo(x+k,y+h);cx.lineTo(x+k+h,y);}cx.stroke();cx.restore();}
function grid(X0,X1,Y0,Y1,mx,yy){const line=css('--line'),mut=css('--muted'),st=niceStep(mx,6);cx.font='12px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='right';
  for(let v=0;v<=mx;v+=st){cx.strokeStyle=line;cx.lineWidth=1;cx.beginPath();cx.moveTo(X0,yy(v));cx.lineTo(X1,yy(v));cx.stroke();cx.fillStyle=mut;cx.fillText(kfmt(v),X0-6,yy(v)+4);}
  cx.strokeStyle=mut;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(X0,Y0);cx.lineTo(X1,Y0);cx.stroke();}
function legend(items,x,y){cx.font='12.5px system-ui';cx.textAlign='left';const ink=css('--ink');
  items.forEach(([c,s,hat])=>{if(hat)hatch(x,y,12,12,c);else{cx.fillStyle=c;cx.fillRect(x,y,12,12);}cx.fillStyle=ink;cx.fillText(s,x+17,y+10);x+=cx.measureText(s).width+34;});}
function drawInfl(){
  const ok=css('--ok'),wn=css('--warn'),pa=css('--pa'),pb=css('--pb'),mut=css('--muted'),ink=css('--ink');
  const X0=70,X1=W-20,Y0=H-46,Y1=60,mx=Math.max(nomV(T),C0,100*priceIdx(T)*C0/100)*1.08,yy=v=>Y0-(Y0-Y1)*v/mx;
  grid(X0,X1,Y0,Y1,mx,yy);
  const sw=(X1-X0)/(T+1),bw=Math.max(3,Math.min(30,sw*.62));
  const kf=Math.floor(phase),fr=phase-kf,pts=[];
  for(let y=0;y<=T;y++){let f=y<=kf?1:(y===kf+1?fr:0);if(y===0)f=1;if(f<=0)break;const e=REDUCE?1:f*f*(3-2*f);
    const xc=X0+sw*(y+.5),n=y===0?C0:lerp(nomV(y-1),nomV(y),e),r=y===0?C0:lerp(realV(y-1),realV(y),e);
    cx.fillStyle=ok;cx.globalAlpha=.75;cx.fillRect(xc-bw/2,yy(Math.min(n,r)),bw,Y0-yy(Math.min(n,r)));cx.globalAlpha=1;
    if(n>r)hatch(xc-bw/2,yy(n),bw,yy(r)-yy(n),wn);
    else if(r>n){cx.fillStyle=ok;cx.globalAlpha=.75;cx.fillRect(xc-bw/2,yy(r),bw,yy(n)-yy(r));cx.globalAlpha=1;}
    cx.strokeStyle=pa;cx.lineWidth=1.6;cx.strokeRect(xc-bw/2,yy(n),bw,Y0-yy(n));
    pts.push([xc,yy(100*lerp(y?priceIdx(y-1):1,priceIdx(y),y?e:1)*C0/100)]);}
  /* preu de la cistella que avui val C0 */
  if(pts.length>1){cx.strokeStyle=pb;cx.lineWidth=2.2;cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();
    const l=pts[pts.length-1];cx.fillStyle=pb;cx.font='bold 13px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='right';cx.fillText(eur(C0*priceIdx(Math.min(kf,T))),Math.min(X1,l[0]+14),l[1]-8);}
  /* C0 */
  cx.strokeStyle=mut;cx.setLineDash([5,4]);cx.lineWidth=1.2;cx.beginPath();cx.moveTo(X0,yy(C0));cx.lineTo(X1,yy(C0));cx.stroke();cx.setLineDash([]);
  const ev=T<=12?1:T<=24?2:5;cx.fillStyle=mut;cx.font='12px system-ui';cx.textAlign='center';
  for(let y=0;y<=T;y+=ev)cx.fillText(String(y),X0+sw*(y+.5),Y0+16);cx.fillText(t('lb_year'),X1-14,Y0+32);
  legend([[ok,t('lg_real')],[wn,t('lg_lost'),1],[pb,tt('lg_bask',eur(C0))]],X0,16);
  cx.strokeStyle=pa;cx.lineWidth=1.6;cx.strokeRect(X0,38,12,12);cx.fillStyle=ink;cx.font='12.5px system-ui';cx.textAlign='left';cx.fillText(t('lg_nom'),X0+17,48);
}
function drawCard(){
  const S=SIM,ok=css('--ok'),pa=css('--pa'),pb=css('--pb'),mut=css('--muted'),ink=css('--ink'),wn=css('--warn');
  const M=Math.max(12,S.M),X0=70,X1=W-20,Y0=H-46,Y1=60,mx=Math.max(...S.debt,S.cP[S.M])*1.06,yy=v=>Y0-(Y0-Y1)*v/mx,xx=m=>X0+(X1-X0)*m/M;
  grid(X0,X1,Y0,Y1,mx,yy);
  const pm=Math.min(phase,S.M),kf=Math.floor(pm),fr=pm-kf;
  const val=(arr,m)=>{const a=Math.floor(m),f=m-a;return a>=S.M?arr[S.M]:lerp(arr[a],arr[a+1],f);};
  const path=(arr)=>{cx.beginPath();cx.moveTo(xx(0),yy(arr[0]));for(let m=1;m<=kf;m++)cx.lineTo(xx(m),yy(arr[m]));if(fr>0&&kf<S.M)cx.lineTo(xx(pm),yy(val(arr,pm)));};
  /* interessos acumulats (àrea) */
  cx.beginPath();cx.moveTo(xx(0),Y0);for(let m=0;m<=kf;m++)cx.lineTo(xx(m),yy(S.cI[m]));if(fr>0&&kf<S.M)cx.lineTo(xx(pm),yy(val(S.cI,pm)));cx.lineTo(xx(pm),Y0);cx.closePath();
  cx.fillStyle=pb;cx.globalAlpha=.35;cx.fill();cx.globalAlpha=1;
  /* deute (àrea) */
  cx.beginPath();cx.moveTo(xx(0),Y0);for(let m=0;m<=kf;m++)cx.lineTo(xx(m),yy(S.debt[m]));if(fr>0&&kf<S.M)cx.lineTo(xx(pm),yy(val(S.debt,pm)));cx.lineTo(xx(pm),Y0);cx.closePath();
  cx.fillStyle=pa;cx.globalAlpha=.18;cx.fill();cx.globalAlpha=1;
  path(S.debt);cx.strokeStyle=pa;cx.lineWidth=2.4;cx.stroke();
  path(S.cP);cx.strokeStyle=ok;cx.lineWidth=2.4;cx.stroke();
  path(S.cI);cx.strokeStyle=pb;cx.lineWidth=1.6;cx.stroke();
  /* D0 */
  cx.strokeStyle=mut;cx.setLineDash([5,4]);cx.lineWidth=1.2;cx.beginPath();cx.moveTo(X0,yy(D0));cx.lineTo(X1,yy(D0));cx.stroke();cx.setLineDash([]);
  /* marcador */
  cx.strokeStyle=mut;cx.lineWidth=1;cx.beginPath();cx.moveTo(xx(pm),Y1);cx.lineTo(xx(pm),Y0);cx.stroke();
  /* eix x en anys */
  cx.fillStyle=mut;cx.font='12px system-ui';cx.textAlign='center';const yrs=M/12,ev=yrs<=6?1:yrs<=15?2:5;
  for(let y=0;y*12<=M;y+=ev)cx.fillText(String(y*12),xx(y*12),Y0+16);cx.fillText(t('lb_month'),X1-14,Y0+32);
  legend([[pa,t('lg_debt')],[ok,t('lg_paid')],[pb,t('lg_int')]],X0,16);
  /* mini: repartiment de la quota d'aquest mes */
  const m=Math.max(1,Math.min(S.M,kf));if(pm>0){
    const bx=X1-250,by=42,bwid=230,p=S.pay[m],it=Math.min(S.intr[m],p);
    cx.fillStyle=css('--panel');cx.globalAlpha=.92;cx.fillRect(bx-8,by-6,bwid+16,58);cx.globalAlpha=1;cx.strokeStyle=css('--line');cx.strokeRect(bx-8,by-6,bwid+16,58);
    cx.fillStyle=ink;cx.font='bold 12.5px system-ui';cx.textAlign='left';cx.fillText(t('mini_title')+' ('+t('lb_month')+' '+m+'): '+eur(p),bx,by+8);
    const wI=p>0?bwid*it/p:0;cx.fillStyle=pb;cx.fillRect(bx,by+16,wI,16);cx.fillStyle=ok;cx.fillRect(bx+wI,by+16,bwid-wI,16);
    cx.font='11.5px system-ui';cx.fillStyle=pb;cx.fillText(t('mini_int')+' '+pct(p>0?it/p*100:0,0)+' %',bx,by+46);
    cx.fillStyle=ok;cx.textAlign='right';cx.fillText(t('mini_amort')+' '+pct(p>0?(p-it)/p*100:0,0)+' %',bx+bwid,by+46);}
  if(phase>=S.M&&!S.done){cx.fillStyle=wn;cx.font='bold 15px system-ui';cx.textAlign='center';cx.fillText('∞',xx(S.M)-14,yy(S.debt[S.M])-10);}
}
function draw(){cx.fillStyle=css('--stage');cx.fillRect(0,0,W,H);if(!valid)return;if(mode==='infl')drawInfl();else drawCard();}
function loop(){
  if(phase<target){const prev=phase,sp=mode==='infl'?(target-phase>3?1/14:1/40):(target-phase>13?Math.max(1/4,(target-phase)/90):1/16);phase=REDUCE?target:Math.min(target,phase+sp);
    if(Math.floor(prev)!==Math.floor(phase)||phase>=target)texts();
    if(phase>=target&&target===steps())finish();}
  draw();requestAnimationFrame(loop);
}
App.hooks.push(()=>{buildCtls();setMode(mode);buildPresets();texts();});
document.addEventListener('themechange',draw);

function ldC(d,r,pt,q){guess=null;setCard(d,r,pt,q);phase=target=SIM.M;finish();RZ.show($('#cv'));}

   ok:()=>({k:'rz_dec_ok'})},
  {id:'d2',f:[{l:'d2.l0',u:'€'}],sim:()=>ldI(5000,3,1,5),ok:()=>({k:'d2_ok',p:()=>[eur(D2)]}),
   chk:([x])=>!(x>0)?{k:'rz_bad'}:Math.abs(x-D2)<=0.5?null:{k:'d2_no'}},
  {id:'d3',f:[{l:'d3.l0',u:'€'}],sim:()=>ldC(3000,24,'fix',150),
   ok:()=>({k:'d3_ok',p:()=>[eur(P100.cI[P100.M]),eur(P150.cI[P150.M]),eur(P100.cI[P100.M]-P150.cI[P150.M])]}),
   chk:([x])=>!(x>0)?{k:'rz_bad'}:Math.abs(x-(P100.cI[P100.M]-P150.cI[P150.M]))<=0.5?null:{k:'d3_no'}}
 ]
});
