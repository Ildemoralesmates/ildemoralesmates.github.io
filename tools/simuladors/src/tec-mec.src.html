const W=640,H=400,K=1.6;
const S={mode:'bm',cam:'ex',th:0,play:true};
const CT=$('#ctls'),SL={};
SL.rpm=slider(CT,{id:'rpm',key:'rpm',min:10,max:120,step:10,val:40,on:upd});
SL.r=slider(CT,{id:'r',key:'r',min:20,max:60,step:5,val:40,on:upd});
SL.L=slider(CT,{id:'L',key:'L',min:100,max:180,step:10,val:140,on:upd});
SL.z=slider(CT,{id:'z',key:'z',min:8,max:30,step:1,val:12,on:upd});
SL.zw=slider(CT,{id:'zw',key:'zw',min:10,max:60,step:1,val:30,on:upd});
const SHOW={bm:['rpm','r','L'],ll:['rpm'],pc:['rpm','z'],sf:['rpm','zw']};
const MOD=3;
const f1=(x,d)=>fmt(x,d===undefined?1:d);
const g=k=>SL[k].get();

/* funcions de moviment de sortida (θ en rad); tornen mm */
function bmX(th){const r=g('r'),L=g('L');return r*Math.cos(th)+Math.sqrt(L*L-r*r*Math.sin(th)**2);}
const PROF={
  ex:f=>{const e=12,R=30;return e*Math.cos(f)+Math.sqrt(R*R-e*e*Math.sin(f)**2);},
  ov:f=>{const a=38,b=26;return a*b/Math.sqrt((b*Math.cos(f))**2+(a*Math.sin(f))**2);},
  co:f=>20+20*((1+Math.cos(f))/2)**3
};
const camH=th=>PROF[S.cam](-Math.PI/2-th)-camMin();
function camMin(){let m=1e9;for(let i=0;i<360;i++)m=Math.min(m,PROF[S.cam](i*Math.PI/180));return m;}
function camMax(){let m=-1e9;for(let i=0;i<360;i++)m=Math.max(m,PROF[S.cam](i*Math.PI/180));return m;}
function outFn(th){
  if(S.mode==='bm')return bmX(th)-(g('L')-g('r'));
  if(S.mode==='ll')return camH(th);
  if(S.mode==='pc')return (MOD*g('z')/2)*(th%TAU);
  return 0;
}
function plotMax(){
  if(S.mode==='bm')return 2*g('r');
  if(S.mode==='ll')return camMax()-camMin();
  if(S.mode==='pc')return Math.PI*MOD*g('z');
  return 1;
}
function upd(){
  Object.keys(SL).forEach(k=>SL[k].el.hidden=!SHOW[S.mode].includes(k));
  $('#camsw').hidden=S.mode!=='ll';
  $('#what').innerHTML=t('what_'+S.mode);
  const kv=[],rpm=g('rpm'),w=rpm*TAU/60;
  if(S.mode==='bm'){kv.push(['k_stroke',f1(2*g('r'),0)+' mm','hl'],['k_pos',f1(outFn(S.th))+' mm','hb'],['k_cyc',rpm+' ','']);}
  else if(S.mode==='ll'){kv.push(['k_lift',f1(camMax()-camMin())+' mm','hl'],['k_h',f1(camH(S.th))+' mm','hb'],['k_cyc',rpm+' ','']);}
  else if(S.mode==='pc'){const R=MOD*g('z')/2;kv.push(['k_R',f1(R)+' mm',''],['k_adv',f1(Math.PI*MOD*g('z'),0)+' mm','hl'],['k_v',f1(w*R,0)+' mm/s','hb']);}
  else{const z=g('zw');kv.push(['k_z',z,''],['k_i','1 / '+z,'hl'],['k_n',f1(rpm/z,2)+' rpm','hb'],['k_turns',z,'']);}
  $('#kv').innerHTML=kv.map(r=>'<dt>'+t(r[0])+'</dt><dd class="'+r[2]+'">'+r[1]+'</dd>').join('');
  plotO&&drawPlot(plotO);
}
function setMode(m){S.mode=m;upd();}
function setCam(c){S.cam=c;upd();}
function buildSeg(){
  TEC.seg($('#modesw'),[{v:'bm',key:'m_bm'},{v:'ll',key:'m_ll'},{v:'pc',key:'m_pc'},{v:'sf',key:'m_sf'}],S.mode,setMode);
  TEC.seg($('#camsw'),[{v:'ex',key:'c_ex'},{v:'ov',key:'c_ov'},{v:'co',key:'c_co'}],S.cam,setCam);
}
$('#play').addEventListener('click',()=>{S.play=!S.play;setPlay();});
function setPlay(){$('#play').textContent=t(S.play?'pause':'play');}
I18N.ca.play='▶ Gira';I18N.ca.pause='❚❚ Pausa';I18N.es.play='▶ Gira';I18N.es.pause='❚❚ Pausa';

/* ---- dibuix principal ---- */
const cvo=TEC.cv('#cv',W,H,draw);
function draw(o){
  const c=o.ctx,k=C(),th=S.th;
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  if(S.mode==='bm')dBM(c,k,th);else if(S.mode==='ll')dLL(c,k,th);else if(S.mode==='pc')dPC(c,k,th);else dSF(c,k,th);
}
function dBM(c,k,th){
  const r=g('r')*K,L=g('L')*K,cx=130,cy=210;
  const px=cx+r*Math.cos(th),py=cy+r*Math.sin(th),sx=cx+bmX(th)*K;
  c.fillStyle=k.chip;c.fillRect(cx+L-r-30,cy-34,2*r+60+80,12);c.fillRect(cx+L-r-30,cy+22,2*r+60+80,12);
  TEC.line(c,[[cx-r-30,cy+r+46],[cx+L+r+90,cy+r+46]],k.line,2);
  c.beginPath();c.arc(cx,cy,r,0,TAU);c.strokeStyle=k.muted;c.setLineDash([4,5]);c.lineWidth=1.2;c.stroke();c.setLineDash([]);
  c.fillStyle=k.pb;c.globalAlpha=.9;c.fillRect(sx-18,cy-22,48,44);c.globalAlpha=1;c.strokeStyle=k.panel;c.lineWidth=2;c.strokeRect(sx-18,cy-22,48,44);
  TEC.line(c,[[px,py],[sx,cy]],k.ink,7);TEC.line(c,[[cx,cy],[px,py]],k.pa,9);
  [[cx,cy,k.pa],[px,py,k.ink],[sx,cy,k.ink]].forEach(([x,y,col])=>{c.beginPath();c.arc(x,y,7,0,TAU);c.fillStyle=k.panel;c.fill();c.strokeStyle=col;c.lineWidth=3;c.stroke();});
  TEC.txt(c,t('m_bm'),W/2,24,{font:'bold 15px system-ui'});
  /* cursa */
  const x0=cx+g('L')*K-r,x1=cx+g('L')*K+r;
  TEC.arrow(c,x0,cy+r+30,x1,cy+r+30,k.pb,2);TEC.arrow(c,x1,cy+r+30,x0,cy+r+30,k.pb,2);
  TEC.txt(c,t('k_stroke')+' = 2r',(x0+x1)/2,cy+r+16,{col:k.pb,font:'bold 13px system-ui'});
  TEC.txt(c,'r',(cx+px)/2-10,(cy+py)/2-12,{col:k.pa,font:'bold 14px system-ui'});TEC.txt(c,'L',(px+sx)/2,(py+cy)/2-14,{col:k.ink,font:'bold 14px system-ui'});
}
function dLL(c,k,th){
  const cx=240,cy=262,u=2.6,prof=PROF[S.cam],mn=camMin();
  const hS=camH(th);
  c.beginPath();
  for(let i=0;i<=180;i++){const f=i/180*TAU,rho=prof(f)*u,a=f+th;const x=cx+rho*Math.cos(a),y=cy+rho*Math.sin(a);i?c.lineTo(x,y):c.moveTo(x,y);}
  c.closePath();c.fillStyle=k.panel;c.fill();c.globalAlpha=.25;c.fillStyle=k.pa;c.fill();c.globalAlpha=1;c.strokeStyle=k.pa;c.lineWidth=3;c.stroke();
  c.beginPath();c.arc(cx,cy,6,0,TAU);c.fillStyle=k.pa;c.fill();
  /* marca de la lleva */
  const mf=Math.PI/2*0,ma=mf+th;TEC.line(c,[[cx,cy],[cx+prof(0)*u*0.8*Math.cos(ma),cy+prof(0)*u*0.8*Math.sin(ma)]],k.pa,2,[3,4]);
  const tipY=cy-(hS+mn)*u;
  c.fillStyle=k.chip;c.fillRect(cx-30,50,60,14);c.fillRect(cx-30,92,60,14);
  c.fillStyle=k.pb;c.fillRect(cx-6,40,12,tipY-40);
  c.fillStyle=k.pb;c.beginPath();c.moveTo(cx-10,tipY);c.lineTo(cx+10,tipY);c.lineTo(cx,tipY+14);c.fill();
  /* ressort */
  c.strokeStyle=k.muted;c.lineWidth=2;c.beginPath();const y0=66,y1=90;c.moveTo(cx-18,y0);for(let i=0;i<=8;i++)c.lineTo(cx+(i%2?18:-18),y0+(y1-y0)*i/8);c.stroke();
  /* regla */
  TEC.line(c,[[cx+110,cy-mn*u],[cx+110,cy-(camMax())*u]],k.muted,2);TEC.arrow(c,cx+110,cy-mn*u,cx+110,tipY,k.pb,2.5);
  TEC.txt(c,f1(hS)+' mm',cx+150,(tipY+cy-mn*u)/2,{col:k.pb,font:'bold 14px system-ui'});
  TEC.txt(c,t('m_ll')+' · '+t('c_'+S.cam),W/2,24,{font:'bold 15px system-ui'});
}
function dPC(c,k,th){
  const z=g('z'),m=Math.min(11,150/z*1),R=m*z/2,cx=W/2,cy=170,p=TAU*R/z;
  const ang=th+Math.PI/2;
  /* cremallera */
  const yTop=cy+R,off=-R*th;
  c.fillStyle=k.panel;c.fillRect(20,yTop+m*1.0,W-40,38);c.strokeStyle=k.pb;c.lineWidth=2;c.strokeRect(20,yTop+m*1.0,W-40,38);
  c.beginPath();
  const x0=20,x1=W-20;let first=true;
  const n0=Math.floor((x0-cx-p/2-off)/p)-1,n1=Math.ceil((x1-cx-p/2-off)/p)+1;
  for(let n=n0;n<=n1;n++){
    const tc=cx+p/2+n*p+off+p/2*0,hw=p*.17,ww=p*.33;
    /* dent trapezoïdal centrada a tc (el buit queda a cx quan th=0) */
    const pts=[[tc-ww,yTop+m*1.0],[tc-hw,yTop-m*0.9],[tc+hw,yTop-m*0.9],[tc+ww,yTop+m*1.0]];
    pts.forEach((q,i)=>{const X=Math.min(x1,Math.max(x0,q[0]));first&&i===0?c.moveTo(X,q[1]):c.lineTo(X,q[1]);first=false;});
  }
  c.lineTo(x1,yTop+m*1.0);c.lineTo(x0,yTop+m*1.0);c.closePath();c.fillStyle=k.pb;c.globalAlpha=.25;c.fill();c.globalAlpha=1;c.strokeStyle=k.pb;c.lineWidth=2;c.stroke();
  TEC.gear(c,cx,cy,z,m,ang,k.pa,ang,.25);
  TEC.arrow(c,W-70,yTop+m+19,W-130,yTop+m+19,k.pb,3);
  TEC.txt(c,t('m_pc'),W/2,24,{font:'bold 15px system-ui'});
  TEC.txt(c,'z = '+z+' · m = '+MOD+' mm',cx,cy-R-m*2.4,{col:k.pa,font:'bold 13px system-ui'});
}
function dSF(c,k,th){
  const z=g('zw'),m=Math.min(9,160/z*1),R=m*z/2,cx=W/2,cy=250,wr=Math.max(14,Math.min(28,R*.22));
  const ang=-Math.PI/2+th/z*(-1)+0;           /* la roda avança una dent per volta del cargol */
  TEC.gear(c,cx,cy,Math.min(z,60),m*Math.min(1,60/Math.max(z,1)),th/z+Math.PI/2*0,k.pb,th/z,.25);
  /* cargol */
  const Rr=R*0+m*Math.min(z,60)/2*Math.min(1,60/Math.max(z,1)),yc=cy-Rr-wr+4;
  const x0=cx-130,x1=cx+130;
  c.fillStyle=k.panel;c.fillRect(x0,yc-wr,x1-x0,wr*2);c.globalAlpha=.25;c.fillStyle=k.pa;c.fillRect(x0,yc-wr,x1-x0,wr*2);c.globalAlpha=1;
  const pitch=26,ph=(th/TAU)*pitch;
  c.save();c.beginPath();c.rect(x0,yc-wr,x1-x0,wr*2);c.clip();
  for(let x=x0-pitch*2+(ph%pitch);x<x1+pitch;x+=pitch){TEC.line(c,[[x-wr*.8,yc+wr],[x+wr*.8,yc-wr]],k.pa,3);}
  c.restore();c.strokeStyle=k.pa;c.lineWidth=2.5;c.strokeRect(x0,yc-wr,x1-x0,wr*2);
  TEC.line(c,[[x0-26,yc],[x0,yc]],k.pa,5);TEC.line(c,[[x1,yc],[x1+26,yc]],k.pa,5);
  TEC.txt(c,t('m_sf'),W/2,24,{font:'bold 15px system-ui'});
  TEC.txt(c,'z = '+z,cx,cy+Rr+30,{col:k.pb,font:'bold 14px system-ui'});
  TEC.txt(c,t('sf_lbl'),cx,yc-wr-22,{col:k.muted,font:'13px system-ui'});
}

/* ---- gràfica ---- */
const plotO=TEC.cv('#plot',300,150,drawPlot);
function drawPlot(o){
  const c=o.ctx,k=C(),Wp=300,Hp=150,l=34,r=10,tp=12,b=24;
  c.fillStyle=k.stage;c.fillRect(0,0,Wp,Hp);
  if(S.mode==='sf'){TEC.txt(c,'1 / '+g('zw'),Wp/2,Hp/2,{font:'bold 28px system-ui',col:k.pb});TEC.txt(c,t('k_i'),Wp/2,Hp/2+28,{col:k.muted});return;}
  const ymax=plotMax(),X=a=>l+(Wp-l-r)*a/TAU,Y=v=>Hp-b-(Hp-b-tp)*v/ymax;
  c.strokeStyle=k.line;c.lineWidth=1;for(let i=0;i<=4;i++){const y=Y(ymax*i/4);c.beginPath();c.moveTo(l,y);c.lineTo(Wp-r,y);c.stroke();TEC.txt(c,String(Math.round(ymax*i/4)),l-4,y,{al:'right',font:'11px system-ui',col:k.muted});}
  [0,90,180,270,360].forEach(d=>TEC.txt(c,d+'°',X(d*Math.PI/180),Hp-b+11,{font:'11px system-ui',col:k.muted}));
  c.beginPath();for(let i=0;i<=360;i++){const a=i*Math.PI/180,v=S.mode==='pc'?outFn(a===TAU?TAU-1e-9:a):outFn(a);i?c.lineTo(X(a),Y(v)):c.moveTo(X(a),Y(v));}
  c.strokeStyle=k.pb;c.lineWidth=2.5;c.stroke();
  const a=S.th%TAU,v=outFn(a);c.beginPath();c.arc(X(a),Y(v),5,0,TAU);c.fillStyle=k.pa;c.fill();c.strokeStyle=k.panel;c.lineWidth=2;c.stroke();
  TEC.txt(c,t('ax_y'),l+4,tp-3,{al:'left',font:'11px system-ui',col:k.muted});
}
TEC.loop(dt=>{
  if(S.play&&!REDUCE){S.th+=g('rpm')/60*TAU*0.2*dt;}
  draw(cvo);drawPlot(plotO);
  if(S.mode==='bm'||S.mode==='ll'){const el=$('#kv dd.hb');if(el)el.textContent=f1(outFn(S.th))+' mm';}
});

const cl=(v,a,b,s)=>Math.max(a,Math.min(b,Math.round(v/(s||1))*(s||1)));

 ],
 S:[

 E:[{id:'e1',who:1,sim:()=>ld('sf',{zw:30,rpm:120})}]
});
