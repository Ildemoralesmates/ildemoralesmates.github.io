<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De la gràfica a la història: quina situació hi encaixa? — simulador interactiu</title>
<meta name="description" content="Interpretar gràfiques al revés: tens una gràfica i quatre històries semblants (bici, depòsit, congelador, mòbil, cotxe, excursió). Tria la que encaixa i justifica en quin tram fallen les altres. I amb una mateixa història, distingeix la gràfica de la distància de la de la velocitat. Amb activitats per a raonar.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
.stage canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.ctls{display:grid;gap:8px;padding:2px 4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
#pA,#pB,#roBox,#why{display:grid;gap:8px;align-content:start}
.cards{display:grid;gap:6px}
.scard{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;text-align:left;font:inherit;font-size:13.5px;line-height:1.4;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.scard:hover:not(:disabled){border-color:var(--pa)}
.scard:disabled{cursor:default}
.scard .L{font-weight:700;font-size:15px;color:var(--muted)}
.scard.right{border-color:var(--ok);border-width:2px;box-shadow:inset 4px 0 0 var(--ok)}
.scard.right .L{color:var(--ok)}
.scard.wrong{border-color:var(--warn);border-style:dashed}
.scard.wrong .L{color:var(--warn)}
.scard .snt{border-radius:4px;padding:0 2px}
.scard .snt.cur{background:var(--chip);box-shadow:inset 0 -2px 0 var(--pa);font-weight:600}
.side .msg{margin:0;font-size:14px;color:var(--ink)}
.side .msg:empty{display:none}
.side .msg.good{color:var(--ok);font-weight:600}
.side .msg.bad{color:var(--warn);font-weight:600}
.whyrow{display:grid;gap:4px;padding:6px 0;border-bottom:1px dashed var(--line)}
.whyrow:last-child{border-bottom:0}
.whyrow p{margin:0;font-size:13.5px;color:var(--ink)}
.whyrow .mk{font-weight:700;margin-left:6px}
.whyrow .mk.good{color:var(--ok)}.whyrow .mk.bad{color:var(--warn)}
.story{margin:0;padding-left:1.4em;display:grid;gap:5px;font-size:14px;color:var(--muted)}
.story li{padding:2px 6px;margin-left:-6px;border-radius:6px}
.story li.done{color:var(--ink)}
.story li.done::marker{color:var(--ok);font-weight:700}
.story li.cur{color:var(--ink);font-weight:600;background:var(--chip);box-shadow:inset 3px 0 0 var(--pa)}
.bopts{display:grid;gap:6px}
.bopts .opt{text-align:center}
.opt.right{border-color:var(--ok);border-width:2px;color:var(--ok)}
.opt.wrong{border-color:var(--warn);border-width:2px;color:var(--warn)}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="seg tabs" id="modes" role="group" data-i18n-aria="aria.mode" aria-label="">
<button type="button" data-m="A" aria-pressed="true" data-i18n="mode_A"></button><button type="button" data-m="B" aria-pressed="false" data-i18n="mode_B"></button>
</div>
<div class="stage"><canvas id="cv" role="img" data-i18n-aria="aria.cv" aria-label=""></canvas></div>
<div class="ctls">
<div class="btns"><button class="btn primary" id="btnStep" type="button"></button><button class="btn" id="btnReset" type="button" data-i18n="reset"></button><button class="btn" id="btnRnd" type="button" data-i18n="rnd"></button></div>

<p class="sh" data-i18n="l_sc"></p>
<div class="chips" id="scs" role="group" data-i18n-aria="aria.sc" aria-label=""></div>
</div>
</div>
<div class="side">
<div id="pA">
<p class="note" data-i18n="a_intro"></p>
<div class="cards" id="cardsA"></div>
<p class="msg" id="msgA" aria-live="polite"></p>
<div id="why" hidden>
<p class="sh" data-i18n="why_t"></p>
<p class="note" data-i18n="why_intro"></p>
<div id="whyRows"></div>
</div>
<p class="score" id="scA"></p>
</div>
<div id="pB" hidden>
<p class="note" data-i18n="b_intro"></p>
<ol class="story" id="storyB"></ol>
<div class="bopts" id="optsB"></div>
<p class="msg" id="msgB" aria-live="polite"></p>
<p class="score" id="scB"></p>
</div>
<div id="roBox">
<p class="sh" data-i18n="s_now"></p>
<dl class="vals" id="ro"></dl>
</div>
<p class="note" id="noteS"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

function distAt(sc,tm){const p=pts(sc,sc.segs);let s=0;for(let k=1;k<p.length;k++){const [ta,va]=p[k-1],[tb,vb]=p[k];if(tm<=ta)break;const te=Math.min(tm,tb),ve=va+(vb-va)*(tb>ta?(te-ta)/(tb-ta):1);s+=(va+ve)/2*(te-ta)/3.6;}return s;}

function axes(box,R,lab,small){

function line(M,P,upto,color,w,dash){

function bandAt(M,box,a,b){ctx.save();ctx.fillStyle=C().pa;ctx.globalAlpha=.08;ctx.fillRect(M.X(a),box.y,Math.max(2,M.X(b)-M.X(a)),box.h);ctx.restore();}
function dot(M,box,x,y){const c=C();ctx.strokeStyle=c.muted;ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(M.X(x),box.y+box.h);ctx.lineTo(M.X(x),M.Y(y));ctx.lineTo(box.x,M.Y(y));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=c.pa;ctx.beginPath();ctx.arc(M.X(x),M.Y(y),5.5,0,TAU);ctx.fill();ctx.strokeStyle=c.panel;ctx.lineWidth=2;ctx.stroke();}

function draw(){
  const c=C();ctx.clearRect(0,0,W,H);ctx.fillStyle=c.panel;ctx.fillRect(0,0,W,H);
  if(mode==='A')drawA();else drawB();
}
function drawA(){
  const c=C(),sc=scA(),R=sc.segs,solved=A.solved;
  drawScene(sc,solved?tcur:0,!solved);
  const M=axes(GB,sc,{y:t(fam+'.y'),x:t(fam+'.x'),xt:true}),st=starts(R);
  const ci=curTram();if(solved&&ci>=0)bandAt(M,GB,st[ci],st[ci+1]);
  if(A.over!==null&&A.over!==A.target)line(M,pts(sc,FAM[fam].V[A.over].segs),Infinity,c.pb,2.6,[7,5]);
  line(M,pts(sc,R),Infinity,c.pa,3.2);
  tramLabels(M,GB,st,i=>M.Y((y0Of(sc,R,i)+R[i].y)/2),c.pa);
  if(A.over!==null&&A.over!==A.target)legend(GB,[[t('lg_real'),c.pa],[tt('lg_other',A.letters[A.over]),c.pb,[7,5]]]);
  if(solved&&(tcur>0||stepI>0))dot(M,GB,tcur,valAt(sc,R,tcur));
}
function boxesB(){const g=30,h=(GB.h-g)/2;return [{x:GB.x,y:GB.y,w:GB.w,h},{x:GB.x,y:GB.y+h+g,w:GB.w,h}];}
function drawB(){
  const c=C(),M0=MOT[mot],done=B.ans!==null,st=starts(M0.segs.map(s=>({d:s.d}))),T=M0.tmax;
  /* escena: carretera amb el mòbil */
  ctx.fillStyle=c.stage;ctx.fillRect(SCN.x,SCN.y,SCN.w,SCN.h);
  label(t('mb.'+mot+'.name'),12,20,{font:'600 13px '+BF(),color:c.ink});
  const tm=done?tcur:0,i=tramAt(M0.segs,Math.max(0,tm-1e-6)),seg=M0.segs[i],v=motV(M0,tm),x=motX(M0,tm);
  const dr=done&&tm>1e-9&&tm<motTot(M0)-1e-9&&v>1e-9?seg.dir:0;
  if(mot==='cotxe'){const D=motX(M0,motTot(M0));road('',x,Math.ceil(D/100)*100,'m',M0.em,'',0,dr);
    const li=M0.segs.findIndex(s=>s.e==='🚦');const x0=86,x1=W-56,X=q=>x0+q/(Math.ceil(D/100)*100)*(x1-x0);emoji('🚦',X(motX(M0,st[li]))+24,52,22);}
  else road('',x,M0.dmax,unitOf('mb.'+mot+'.d'),(done&&tm>1e-9&&seg.e)||M0.em,M0.dest,M0.dd,dr);
  if(done)label(nf(v,v%1?1:0)+' '+unitOf('mb.'+mot+'.v'),W-14,20,{font:'600 13px '+NF(),color:c.ink,align:'right'});
  /* dues gràfiques: distància i velocitat (ordre de B.top) */
  const N=160,PD=[],PV=[];for(let k=0;k<=N;k++){const q=k/N*motTot(M0);PD.push([q,motX(M0,q)]);PV.push([q,motV(M0,q)]);}
  /* la velocitat té salts: hi afegim els extrems de cada tram */
  const PVx=[];let t0=0;M0.segs.forEach(s=>{PVx.push([t0,s.v0]);PVx.push([t0+s.d,s.v1]);t0+=s.d;});
  const G={d:{P:PD,R:{tmax:T,ymin:0,ymax:M0.dmax},y:t('mb.'+mot+'.d')},v:{P:PVx,R:{tmax:T,ymin:0,ymax:M0.vmax},y:t('mb.'+mot+'.v')}};
  const order=B.top==='d'?['d','v']:['v','d'];
  boxesB().forEach((box,k)=>{const g=G[order[k]],lab={y:done?g.y:tt('g_q',k+1),xt:k===1,x:k===1?t('mb.'+mot+'.x'):''};
    const M=axes(box,g.R,lab,true);
    const ci=curTram();if(done&&ci>=0)bandAt(M,box,st[ci],st[ci+1]);
    line(M,g.P,Infinity,done?c.muted:c.ink,done?1.6:2.6,done?[5,5]:[]);
    if(done){line(M,g.P,tcur,order[k]==='d'?c.pa:c.ok,3.2);
      const yv=order[k]==='d'?motX(M0,tcur):motV(M0,tcur);if(tcur>0||stepI>0)dot(M,box,tcur,yv);}
  });
}
function curTram(){const segs=mode==='A'?scA().segs:MOT[mot].segs;if(anim)return anim.i;if(tcur<=1e-9)return -1;return tramAt(segs,tcur-1e-6);}
function nSegs(){return mode==='A'?scA().segs.length:MOT[mot].segs.length;}
function stList(){return mode==='A'?starts(scA().segs):starts(MOT[mot].segs);}
const unlocked=()=>mode==='A'?A.solved:B.ans!==null;

/* ---------- animació pas a pas ---------- */
function stepOnce(){
  const st=stList(),n=nSegs();
  if(anim){finishAnim();return;}
  if(stepI>=n){stepI=0;tcur=0;refresh();return;}
  const i=stepI,a=st[i],b=st[i+1],dur=REDUCE?0:1700;
  tcur=a;anim={i,a,b,t0:performance.now(),dur};
  if(!dur){finishAnim();return;}
  refresh();requestAnimationFrame(tick);
}
function tick(now){if(!anim)return;const f=clamp((now-anim.t0)/anim.dur,0,1);tcur=lerp(anim.a,anim.b,f);if(f>=1){finishAnim();return;}draw();renderNow();requestAnimationFrame(tick);}
function finishAnim(){if(!anim)return;tcur=anim.b;stepI=anim.i+1;anim=null;refresh();}

/* ---------- panell ---------- */
function cardHTML(k,ci){
  const F=FAM[fam],V=F.V[k],sol=A.solved&&k===A.target;
  let cl='scard';if(sol)cl+=' right';else if(A.tried.includes(k))cl+=' wrong';
  const txt=V.s.map((s,i)=>'<span class="snt'+(sol&&i===ci?' cur':'')+'">'+t(fam+'.'+s)+'</span>').join(' ');
  return '<button type="button" class="'+cl+'" data-k="'+k+'"'+(A.solved||A.tried.includes(k)?' disabled':'')+'><span class="L">'+A.letters[k]+'</span><span>'+txt+'</span></button>';
}
function renderNow(){
  const ci=curTram();
  if(mode==='A'){$$('#cardsA .scard.right .snt').forEach((e,i)=>e.classList.toggle('cur',i===ci));}
  if(mode==='B'){$$('#storyB li').forEach((e,i)=>{e.className=i===ci?'cur':(i<ci||(!anim&&tcur>=motTot(MOT[mot])-1e-9))?'done':'';});}
  const n=nSegs(),u=mode==='A'?unitOf(fam+'.x'):unitOf('mb.'+mot+'.x');
  $('#ro').innerHTML='<dt>'+t('r_t')+'</dt><dd>'+nf(tcur,2)+' '+u+'</dd><dt>'+t('r_tram')+'</dt><dd>'+(ci>=0?(ci+1)+' / '+n:'—')+'</dd>';
  tOut.textContent=nf(tcur,2)+' '+u;tEl.value=tcur;
  btnStep.disabled=!unlocked();
  btnStep.textContent=!unlocked()?t(mode==='A'?'locked_A':'locked_B'):anim?tt('step',anim.i+1):stepI>=n?t('again'):tt('step',stepI+1);
}
function renderPanel(){
  $('#pA').hidden=mode!=='A';$('#pB').hidden=mode!=='B';$('#roBox').hidden=!unlocked();
  $('#noteS').textContent=t(mode==='A'?'note_A':'note_B');
  if(mode==='A'){
    const ci=curTram();
    $('#cardsA').innerHTML=A.order.map(k=>cardHTML(k,ci)).join('');
    $$('#cardsA .scard').forEach(b=>b.onclick=()=>pickA(+b.dataset.k));
    const m=$('#msgA');m.className='msg'+(A.msg?(A.msg.good?' good':' bad'):'');m.innerHTML=A.msg?tt(A.msg.k,...A.msg.p):'';
    $('#why').hidden=!A.solved;
    if(A.solved){const sc=scA(),n=sc.segs.length,others=A.order.filter(k=>k!==A.target);
      $('#whyRows').innerHTML=others.map(k=>{const st=A.why[k],ok=st!=null&&diffTrams(sc,sc.segs,FAM[fam].V[k].segs).includes(st);
        return '<div class="whyrow"><p><b>'+A.letters[k]+'.</b> '+(st!=null?'<span class="mk '+(ok?'good':'bad')+'">'+(ok?t('why_ok')+' '+tt('tram_n',st+1):t('why_ko'))+'</span>':'')+'</p><div class="chips">'+
          Array.from({length:n},(_,i)=>'<button type="button" class="chip" data-o="'+k+'" data-i="'+i+'" aria-pressed="'+(st===i)+'">'+tt('tram_n',i+1)+'</button>').join('')+'</div></div>';}).join('')+
        (others.every(k=>A.why[k]!=null&&diffTrams(sc,sc.segs,FAM[fam].V[k].segs).includes(A.why[k]))?'<p class="msg good">'+t('why_all')+'</p>':'');
      $$('#whyRows [data-o]').forEach(b=>b.onclick=()=>{A.why[+b.dataset.o]=+b.dataset.i;A.over=+b.dataset.o;refresh();});}
    $('#scA').textContent=tt('a_score',SCORE.A[0],SCORE.A[1]);
  }else{
    $('#storyB').innerHTML=MOT[mot].segs.map((s,i)=>'<li>'+t('mb.'+mot+'.s'+i)+'</li>').join('');
    const right=B.top==='d'?0:1;
    $('#optsB').innerHTML=[0,1].map(k=>{let cl='opt';if(B.ans!==null){if(k===right)cl+=' right';else if(k===B.ans)cl+=' wrong';}
      return '<button type="button" class="'+cl+'" data-k="'+k+'"'+(B.ans!==null?' disabled':'')+'>'+t('b_o'+(k+1))+'</button>';}).join('');
    $$('#optsB [data-k]').forEach(b=>b.onclick=()=>pickB(+b.dataset.k));
    const m=$('#msgB'),ok=B.ans===right;m.className='msg'+(B.ans!==null?(ok?' good':' bad'):'');
    m.innerHTML=B.ans!==null?t(ok?'b_ok':'b_ko')+'<br><span style="font-weight:400;color:var(--ink)">'+t('b_why')+'</span>':'';
    $('#scB').textContent=tt('b_score',SCORE.B[0],SCORE.B[1]);
  }
  tEl.disabled=!unlocked();
  renderNow();
}
function refresh(){tEl.max=mode==='A'?FAM[fam].tmax:MOT[mot].tmax;tEl.step=(+tEl.max)/300;draw();renderPanel();}

/* ---------- jugades ---------- */
function newA(v){const F=FAM[fam],order=shuffle([0,1,2,3]);const letters={};order.forEach((k,i)=>letters[k]='ABCD'[i]);
  A={target:v===undefined?Math.floor(Math.random()*F.V.length):v,order,letters,tried:[],solved:false,first:true,msg:null,over:null,why:{}};}
function pickA(k){
  if(A.solved)return;const sc=scA();
  if(A.first){SCORE.A[1]++;}
  if(k===A.target){if(A.first)SCORE.A[0]++;A.solved=true;A.over=null;A.msg={k:A.first?'a_ok':'a_ok2',p:[A.letters[k]],good:true};}
  else{A.tried.push(k);A.over=k;const d=diffTrams(sc,sc.segs,FAM[fam].V[k].segs);A.msg={k:'a_ko',p:[A.letters[k],(d[0]||0)+1]};}
  A.first=false;stepI=0;tcur=0;anim=null;refresh();
}
function newB(){B={top:Math.random()<.5?'d':'v',ans:null};}
function pickB(k){if(B.ans!==null)return;B.ans=k;SCORE.B[1]++;if(k===(B.top==='d'?0:1))SCORE.B[0]++;stepI=0;tcur=0;anim=null;refresh();}
function setCtx(id){anim=null;stepI=0;tcur=0;if(mode==='A'){fam=id;newA();}else{mot=id;newB();}renderChips();refresh();}
function setMode(m){mode=m;$$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));setCtx(m==='A'?fam:mot);}
function renderChips(){const L=mode==='A'?FIDS:MIDS,cur=mode==='A'?fam:mot,pre=mode==='A'?'':'mb.';
  $('#scs').innerHTML=L.map(id=>'<button type="button" class="chip" data-id="'+id+'" aria-pressed="'+(id===cur)+'">'+t(pre+id+'.name')+'</button>').join('');
  $$('#scs .chip').forEach(b=>b.onclick=()=>setCtx(b.dataset.id));}
$$('#modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
btnStep.addEventListener('click',stepOnce);
$('#btnReset').addEventListener('click',()=>setCtx(mode==='A'?fam:mot));
$('#btnRnd').addEventListener('click',()=>{if(mode==='A'){const o=FIDS.filter(x=>x!==fam);fam=o[Math.floor(Math.random()*o.length)];setCtx(fam);}else{const o=MIDS.filter(x=>x!==mot);setCtx(o[Math.floor(Math.random()*o.length)]);}});
tEl.addEventListener('input',()=>{anim=null;tcur=+tEl.value;stepI=stList().filter((s,k)=>k>0&&s<=tcur+1e-9).length;draw();renderNow();});
document.addEventListener('langchange',()=>{renderChips();refresh();});
document.addEventListener('themechange',()=>draw());
App.hooks.push(()=>refresh());

/* ===== Raona-ho ===== */
/* carrega un cas resolt: mode A (família, història, trams recorreguts) o mode B (moviment, trams recorreguts) */
function setModeQuiet(m){mode=m;$$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));}
function loadA(f,v,k){setModeQuiet('A');fam=f;newA(v);A.solved=true;A.first=false;A.msg={k:'a_ok2',p:[A.letters[v]],good:true};
  const R=FAM[f].V[v].segs,n=k===undefined?R.length:clamp(k,0,R.length);anim=null;stepI=n;tcur=starts(R)[n];renderChips();refresh();RZ.show(cv);}
function loadB(m,k){setModeQuiet('B');mot=m;B={top:'d',ans:0};const R=MOT[m].segs,n=k===undefined?R.length:clamp(k,0,R.length);anim=null;stepI=n;tcur=starts(R)[n];renderChips();refresh();RZ.show(cv);}
const near=(a,b,e)=>Math.abs(a-b)<=(e||1e-6);
RZ.init({
 sim:()=>mode==='A'?loadA(fam,A.target):loadB(mot),
 M:[
  {id:'m1',f:[{l:'l_km',u:'km'}],sim:()=>loadA('bici',0),ok:()=>({k:'m1_ok'}),
   chk:([x])=>near(x,8,.01)?null:near(x,4,.01)?{k:'m1_half'}:{k:'m1_f',p:[nf(x,2)]}},
  {id:'m2',f:[{l:'l_vel',u:'m/min'}],sim:()=>loadB('claus',2),ok:()=>({k:'m2_ok'}),
   chk:([v])=>near(v,150,.5)?null:near(v,300,.5)?{k:'m2_d'}:{k:'m2_f',p:[nf(v,1),nf(v*2,0)]}},
  {id:'m3',f:[{l:'l_temps',u:'min'}],sim:()=>loadA('gel',0,2),ok:()=>({k:'m3_ok'}),
   chk:([m])=>near(m,40,.05)?null:{k:'m3_f',p:[nf(m,1)]}},
  {id:'m4',f:[{l:'l_desn',u:'m/h'}],sim:()=>loadA('excursio',1,1),ok:()=>({k:'m4_ok'}),
   chk:([r])=>near(r,200,.5)?null:{k:'m4_f',p:[nf(r,0),nf(r*3,0)]}},
  {id:'m5',f:[{l:'l_acc',u:'(km/h)/s'}],sim:()=>loadA('cotxe',2,1),ok:()=>({k:'m5_ok'}),
   chk:([a])=>near(a,2.5,.01)?null:{k:'m5_f',p:[nf(a,2),nf(a*20,1)]}}
 ],
 S:[
  {id:'s1',ans:'D',f:[{l:'l_vel',u:'km/h'}],sim:()=>loadB('bici',1),cxsim:()=>loadB('bici',1),
   cxok:([v])=>({k:'s1_cx',p:[nf(v,1)]}),cx:([v])=>v!==0?null:{k:'s1_cx_no',p:[nf(v,1)]}},
  {id:'s2',ans:'S',sim:()=>loadB('claus',2)},
  {id:'s3',ans:'S',sim:()=>loadB('escola',2)},
  {id:'s4',ans:'M',sim:()=>loadA('excursio',0)},
  {id:'s5',ans:'S',sim:()=>loadB('bici')}
 ],
 E:[
  {id:'e1',who:1,sim:()=>loadA('gel',0,2)},
  {id:'e2',who:1,sim:()=>loadB('bici')},
  {id:'e3',who:1,sim:()=>loadA('cotxe',0,1)}
 ],
 D:[
  {id:'d1',f:[{l:'d1.l0',u:'%'}],sim:()=>loadA('mobil',0,1),ok:()=>({k:'d1_ok'}),
   chk:([p])=>near(p,60,.05)?null:{k:'d1_f'}},
  {id:'d2',chips:{vals:[1,2],fmt:x=>t('d2.c'+x)},f:[{l:'d2.l0',u:'min'}],sim:()=>loadA('diposit',0,1),ok:()=>({k:'d2_ok'}),
   chk:([p,m])=>p===2?{k:'d2_slow'}:near(m,15,.05)?null:{k:'d2_f'}},
  {id:'d3',f:[{l:'d3.l0',u:'m'}],sim:()=>loadB('cotxe',2),ok:()=>({k:'d3_ok'}),
   chk:([d])=>near(d,277.8,4)?null:{k:'d3_f',p:[nf(d,0)]}}
 ]
});
initQuiz([]);
newA();newB();
ready=true;
initLang();applyLang();
renderChips();refresh();
})();
</script>
