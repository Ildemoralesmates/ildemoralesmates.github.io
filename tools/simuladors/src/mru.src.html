<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRU i MRUA: gràfiques sincronitzades — simulador interactiu</title>
<meta name="description" content="Un mòbil, tres gràfiques: mou un cotxe amb MRU o MRUA i mira com es dibuixen alhora x–t, v–t i a–t. Tangent, àrea sota v–t, segon mòbil i punt de trobada. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d’altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
:root{--gx:var(--pa);--gv:var(--ok);--ga:#7c3aed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ga:#b794f6}}
.stage svg{display:block;width:100%;height:auto}
.stage svg text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:14px;height:3px;display:inline-block;border-radius:2px}
.ctls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;padding:2px 4px}
@media (max-width:620px){.ctls{grid-template-columns:1fr}}
.ctls .span{grid-column:1/-1}
.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:4px 18px}
.cmp{grid-column:1/-1;display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;border-top:1px dashed var(--line);padding-top:6px}
.cmp.show{display:grid}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp output{color:var(--pb)}
.btns{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
.vals dd.b,.vals dt.b{color:var(--pb)}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="stage"><svg id="svg" viewBox="0 0 600 352" role="img" data-i18n-aria="aria.svg" aria-label=""></svg></div>
<div class="legend">
<span><span class="swatch" style="background:var(--gx)"></span><span data-i18n="lg_x"></span></span>
<span><span class="swatch" style="background:var(--gv)"></span><span data-i18n="lg_v"></span></span>
<span><span class="swatch" style="background:var(--ga)"></span><span data-i18n="lg_acc"></span></span>
<span data-i18n="lg_ab"></span>
</div>
<div class="ctls">
<div class="btns"><button class="btn primary" id="btnPlay" type="button"></button><button class="btn" id="btnReset" type="button" data-i18n="reset"></button>
<select id="speed" aria-label="Velocitat"><option value="0.5" data-i18n="sp_slow"></option><option value="1" selected data-i18n="sp_norm"></option><option value="2" data-i18n="sp_fast"></option></select></div>
<div class="chips span" id="presets"></div>
<div class="ctl"><label for="xa" data-i18n="l_x0"></label><output id="xaL"></output><input type="range" id="xa" min="-50" max="100" step="1" value="0"></div>
<div class="ctl"><label for="va" data-i18n="l_v0"></label><output id="vaL"></output><input type="range" id="va" min="-20" max="20" step="1" value="5"></div>
<div class="ctl"><label for="aa" data-i18n="l_a"></label><output id="aaL"></output><input type="range" id="aa" min="-5" max="5" step="0.5" value="0"></div>
<div class="cmp" id="cmpBlock">
<div class="ctl"><label for="xb" data-i18n="l_x0b"></label><output id="xbL"></output><input type="range" id="xb" min="-50" max="100" step="1" value="60"></div>
<div class="ctl"><label for="vb" data-i18n="l_v0b"></label><output id="vbL"></output><input type="range" id="vb" min="-20" max="20" step="1" value="-3"></div>
<div class="ctl"><label for="ab" data-i18n="l_ab"></label><output id="abL"></output><input type="range" id="ab" min="-5" max="5" step="0.5" value="0"></div>
</div>
<div class="ctl span"><label for="tsl" data-i18n="l_t"></label><output id="tslL"></output><input type="range" id="tsl" min="0" max="10" step="0.1" value="0"></div>
<div class="checks">
<label class="check"><input type="checkbox" id="cmp"><span data-i18n="c_cmp"></span></label>
<label class="check"><input type="checkbox" id="dots" checked><span data-i18n="c_dots"></span></label>
<label class="check"><input type="checkbox" id="tan"><span data-i18n="c_tan"></span></label>
<label class="check"><input type="checkbox" id="area"><span data-i18n="c_area"></span></label>
</div>
</div>
</div>
<div class="side">
<p class="sh" data-i18n="s_live"></p>
<dl class="vals" id="readout"></dl>
<p class="sh" data-i18n="s_res"></p>
<dl class="vals" id="results"></dl>
<p class="note" data-i18n="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

(function(){
/* ===== MRU i MRUA: gràfiques sincronitzades ===== */
const VW=600,VH=352,L=46,R=24,PW=VW-L-R,T=10;
const svg=$('#svg');
const xaEl=$('#xa'),vaEl=$('#va'),aaEl=$('#aa'),xbEl=$('#xb'),vbEl=$('#vb'),abEl=$('#ab'),tEl=$('#tsl');
const cmpEl=$('#cmp'),tanEl=$('#tan'),areaEl=$('#area'),dotsEl=$('#dots'),speedEl=$('#speed');
const btnPlay=$('#btnPlay'),btnReset=$('#btnReset'),cmpBlock=$('#cmpBlock'),readout=$('#readout'),results=$('#results');
const X=(p,s)=>p.x+p.v*s+.5*p.a*s*s, V=(p,s)=>p.v+p.a*s;
const pA=()=>({x:+xaEl.value,v:+vaEl.value,a:+aaEl.value});
const pB=()=>cmpEl.checked?{x:+xbEl.value,v:+vbEl.value,a:+abEl.value}:null;
let tcur=0,playing=false,last=null;
const PAN=[{k:'x',y0:124,h:54,u:'x (m)',c:'var(--gx)'},{k:'v',y0:196,h:54,u:'v (m/s)',c:'var(--gv)'},{k:'a',y0:268,h:54,u:'a (m/s²)',c:'var(--ga)'}];
const LANE={A:46,B:80},AXY=92;
function nice(span,n){const rough=span/n,mag=Math.pow(10,Math.floor(Math.log10(rough))),norm=rough/mag;return (norm<1.5?1:norm<3.5?2:norm<7.5?5:10)*mag;}
function rngOf(vals,minSpan){
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);
  if(hi-lo<minSpan){const c=(hi+lo)/2;lo=Math.min(lo,c-minSpan/2);hi=Math.max(hi,c+minSpan/2);}
  const p=(hi-lo)*.08; if(hi>0)hi+=p; if(lo<0)lo-=p; return [lo,hi];
}
const tl=g=>Math.abs(g)<1e-9?'0':String(+g.toFixed(2)).replace('.',',');
const mapT=s=>L+s/T*PW;
const f1=n=>n.toFixed(1);
function car(cx,base,color){
  return '<g transform="translate('+f1(cx)+','+base+')"><rect x="-13" y="-13" width="26" height="9" rx="2" fill="'+color+'"/><rect x="-7" y="-19" width="13" height="7" rx="2" fill="'+color+'"/><circle cx="-8" cy="-3" r="3.2" fill="var(--ink)"/><circle cx="8" cy="-3" r="3.2" fill="var(--ink)"/></g>';
}
function arrow(x,y,len,color){
  if(Math.abs(len)<1.5)return '';
  const d=len>0?1:-1,x2=x+len;
  return '<line x1="'+f1(x)+'" y1="'+y+'" x2="'+f1(x2)+'" y2="'+y+'" stroke="'+color+'" stroke-width="2.4"/><polygon points="'+f1(x2)+','+y+' '+f1(x2-d*6)+','+(y-3.5)+' '+f1(x2-d*6)+','+(y+3.5)+'" fill="'+color+'"/>';
}
function meetings(A,B){
  const qa=.5*(A.a-B.a),qb=A.v-B.v,qc=A.x-B.x,out=[];
  if(Math.abs(qa)<1e-9){
    if(Math.abs(qb)<1e-9)return Math.abs(qc)<1e-9?'always':out;
    out.push(-qc/qb);
  }else{
    const d=qb*qb-4*qa*qc;
    if(d>=0){const s=Math.sqrt(d);out.push((-qb-s)/(2*qa),(-qb+s)/(2*qa));}
  }
  return out.filter(s=>s>=-1e-9&&s<=T+1e-9).map(s=>({t:Math.max(0,s),x:X(A,Math.max(0,s))})).sort((p,q)=>p.t-q.t);
}
function moveType(A,s){
  const v=V(A,s);
  if(A.a===0)return t(A.v===0?'mv_rest':'mv_mru');
  if(Math.abs(v)<1e-9)return t('mv_turn');
  return t(v*A.a>0?'mv_acc':'mv_dec');
}
function draw(){
  const A=pA(),B=pB(),s=tcur;
  const xs=[],vs=[],as=[A.a];if(B)as.push(B.a);
  for(let i=0;i<=40;i++){const q=i*T/40;xs.push(X(A,q));vs.push(V(A,q));if(B){xs.push(X(B,q));vs.push(V(B,q));}}
  const R3={x:rngOf(xs,10),v:rngOf(vs,4),a:rngOf(as,2)};
  const mapY=(k,val)=>{const P=PAN.find(p=>p.k===k),[lo,hi]=R3[k];return P.y0+P.h-(val-lo)/(hi-lo)*P.h;};
  const rx=R3.x,mapX=val=>L+(val-rx[0])/(rx[1]-rx[0])*PW;
  let o='<defs>'+PAN.map(P=>'<clipPath id="c'+P.k+'"><rect x="'+L+'" y="'+P.y0+'" width="'+PW+'" height="'+P.h+'"/></clipPath>').join('')+'</defs>';
  /* carretera i eix de posicions */
  const lane=(p,base,color)=>{
    let q='<line x1="'+L+'" y1="'+base+'" x2="'+(L+PW)+'" y2="'+base+'" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>';
    if(dotsEl.checked)for(let k=0;k<=Math.floor(s+1e-9);k++)q+='<circle cx="'+f1(mapX(X(p,k)))+'" cy="'+base+'" r="3" fill="'+color+'" opacity=".75"/>';
    const cx=mapX(X(p,s));
    q+=car(cx,base-3,color);
    q+=arrow(cx,base-26,V(p,s)*3,'var(--gv)')+arrow(cx,base-33,p.a*10,'var(--ga)');
    return q;
  };
  o+=lane(A,LANE.A,'var(--pa)');
  if(B)o+=lane(B,LANE.B,'var(--pb)');
  const sx=nice(rx[1]-rx[0],6);
  for(let g=Math.ceil(rx[0]/sx)*sx;g<=rx[1]+1e-9;g+=sx){const gx=mapX(g);
    o+='<line x1="'+f1(gx)+'" y1="'+AXY+'" x2="'+f1(gx)+'" y2="'+(AXY+4)+'" stroke="var(--muted)"/><text x="'+f1(gx)+'" y="'+(AXY+15)+'" text-anchor="middle">'+tl(g)+'</text>';}
  o+='<text x="'+(L-6)+'" y="'+(AXY+15)+'" text-anchor="end">x (m)</text>';
  /* tres gràfiques */
  PAN.forEach((P,idx)=>{
    const [lo,hi]=R3[P.k];
    o+='<rect x="'+L+'" y="'+P.y0+'" width="'+PW+'" height="'+P.h+'" fill="var(--stage)"/><rect x="'+L+'" y="'+P.y0+'" width="'+PW+'" height="'+P.h+'" fill="'+P.c+'" fill-opacity=".13" stroke="'+P.c+'" stroke-opacity=".6"/>';
    for(let g=0;g<=T;g++){const gx=mapT(g);o+='<line x1="'+f1(gx)+'" y1="'+P.y0+'" x2="'+f1(gx)+'" y2="'+(P.y0+P.h)+'" stroke="var(--line)" opacity="'+(g%2?'.35':'.8')+'"/>';}
    const st=nice(hi-lo,3);
    for(let g=Math.ceil(lo/st-1e-9)*st;g<=hi+1e-9;g+=st){const gy=mapY(P.k,g);
      o+='<line x1="'+L+'" y1="'+f1(gy)+'" x2="'+(L+PW)+'" y2="'+f1(gy)+'" stroke="'+(Math.abs(g)<1e-9?'var(--muted)':'var(--line)')+'" opacity="'+(Math.abs(g)<1e-9?'.9':'.7')+'"/><text x="'+(L-5)+'" y="'+f1(gy+3)+'" text-anchor="end">'+tl(g)+'</text>';}
    o+='<text x="'+(L+3)+'" y="'+(P.y0-4)+'" style="font-weight:700;fill:'+P.c+'">'+P.u+'</text>';
    if(idx===2){for(let g=0;g<=T;g+=2)o+='<text x="'+f1(mapT(g))+'" y="'+(P.y0+P.h+13)+'" text-anchor="middle">'+g+'</text>';
      o+='<text x="'+(L+PW)+'" y="'+(P.y0+P.h+25)+'" text-anchor="end">t (s)</text>';}
  });
  const curve=(p,dash)=>{
    const da=dash?' stroke-dasharray="7 4"':'';
    const fx=[];for(let i=0;i<=60;i++){const q=i*T/60;fx.push(f1(mapT(q))+','+f1(mapY('x',X(p,q))));}
    const fv=f1(mapT(0))+','+f1(mapY('v',V(p,0)))+' '+f1(mapT(T))+','+f1(mapY('v',V(p,T)));
    const fa=f1(mapT(0))+','+f1(mapY('a',p.a))+' '+f1(mapT(T))+','+f1(mapY('a',p.a));
    return '<g clip-path="url(#cx)"><polyline fill="none" stroke="var(--gx)" stroke-width="2.6"'+da+' points="'+fx.join(' ')+'"/></g>'+
      '<polyline fill="none" stroke="var(--gv)" stroke-width="2.6"'+da+' points="'+fv+'"/><polyline fill="none" stroke="var(--ga)" stroke-width="2.6"'+da+' points="'+fa+'"/>';
  };
  /* àrea sota v–t i tangent (mòbil A) */
  if(areaEl.checked){
    const z=mapY('v',0);let pts=f1(mapT(0))+','+f1(z);
    const N=Math.max(2,Math.round(s*6));for(let i=0;i<=N;i++){const q=s*i/N;pts+=' '+f1(mapT(q))+','+f1(mapY('v',V(A,q)));}
    pts+=' '+f1(mapT(s))+','+f1(z);
    o+='<polygon points="'+pts+'" fill="var(--gv)" fill-opacity=".3" stroke="none" clip-path="url(#cv)"/>';
    o+='<text x="'+(L+PW-4)+'" y="'+(PAN[1].y0+11)+'" text-anchor="end" style="fill:var(--gv);font-weight:700">'+t('ann_area',{0:fmt(X(A,s)-A.x,1)})+'</text>';
  }
  o+=curve(A,false);if(B)o+=curve(B,true);
  if(tanEl.checked){
    const ypm=PAN[0].h/(R3.x[1]-R3.x[0]),xps=PW/T,dx=PW*.16,cxp=mapT(s),cyp=mapY('x',X(A,s)),sl=-A.v*ypm/xps;
    o+='<line clip-path="url(#cx)" x1="'+f1(cxp-dx)+'" y1="'+f1(cyp-sl*dx)+'" x2="'+f1(cxp+dx)+'" y2="'+f1(cyp+sl*dx)+'" stroke="var(--warn)" stroke-width="2.2"/>';
    o+='<text x="'+(L+PW-4)+'" y="'+(PAN[0].y0+11)+'" text-anchor="end" style="fill:var(--warn);font-weight:700">'+t('ann_tan',{0:fmt(A.v+A.a*s,1)})+'</text>';
  }
  /* cursor de temps i punts */
  const cxp=mapT(s);
  o+='<line x1="'+f1(cxp)+'" y1="'+(PAN[0].y0-2)+'" x2="'+f1(cxp)+'" y2="'+(PAN[2].y0+PAN[2].h)+'" stroke="var(--ink)" stroke-dasharray="3 3" opacity=".7"/>';
  const dot=(k,val,color,hol)=>'<circle cx="'+f1(cxp)+'" cy="'+f1(mapY(k,val))+'" r="4.2" fill="'+(hol?'var(--panel)':color)+'" stroke="'+(hol?color:'var(--panel)')+'" stroke-width="'+(hol?2.2:1.5)+'"/>';
  o+=dot('x',X(A,s),'var(--gx)')+dot('v',V(A,s),'var(--gv)')+dot('a',A.a,'var(--ga)');
  if(B)o+=dot('x',X(B,s),'var(--gx)',1)+dot('v',V(B,s),'var(--gv)',1)+dot('a',B.a,'var(--ga)',1);
  svg.innerHTML=o;
}
function panels(){
  const A=pA(),B=pB(),s=tcur;
  const row=(k,v,c)=>'<dt'+(c?' class="'+c+'"':'')+'>'+k+'</dt><dd'+(c?' class="'+c+'"':'')+'>'+v+'</dd>';
  let h=row('t',fmt(s,1)+' s')+row('x',fmt(X(A,s))+' m')+row('v',fmt(V(A,s))+' m/s')+row('a',fmt(A.a)+' m/s²')+row('Δx',fmt(X(A,s)-A.x)+' m')+row(t('r_type'),moveType(A,s));
  if(B)h+=row('x (B)',fmt(X(B,s))+' m','b')+row('v (B)',fmt(V(B,s))+' m/s','b')+row(t('r_gap'),fmt(Math.abs(X(A,s)-X(B,s)))+' m');
  readout.innerHTML=h;
  let r=row(t('r_xf'),fmt(X(A,T))+' m')+row(t('r_dx'),'<b>'+fmt(X(A,T)-A.x)+' m</b>')+row(t('r_vf'),fmt(V(A,T))+' m/s')+row(t('r_vm'),fmt((X(A,T)-A.x)/T)+' m/s');
  if(B){const m=meetings(A,B);
    r+=row(t('r_meet'),m==='always'?t('r_always'):m.length?m.map(q=>'t = '+fmt(q.t)+' s · x = '+fmt(q.x,1)+' m').join('<br>'):t('r_nomeet'),'hl');}
  results.innerHTML=r;
}
function labels(){
  $('#xaL').textContent=xaEl.value+' m';$('#vaL').textContent=vaEl.value+' m/s';$('#aaL').textContent=fmt(+aaEl.value,1)+' m/s²';
  $('#xbL').textContent=xbEl.value+' m';$('#vbL').textContent=vbEl.value+' m/s';$('#abL').textContent=fmt(+abEl.value,1)+' m/s²';
  $('#tslL').textContent=fmt(tcur,1)+' s';tEl.value=tcur;
}
function setPlay(){const k=playing?'pause':(tcur>0&&tcur<T?'resume':'launch');if(btnPlay.textContent!==t(k))btnPlay.textContent=t(k);}
function refresh(){labels();draw();panels();setPlay();}
function tick(ts){
  if(!playing)return;
  if(last===null)last=ts;
  tcur+=(ts-last)/1000*(+speedEl.value);last=ts;
  if(tcur>=T){tcur=T;playing=false;last=null;}
  refresh();
  if(playing)requestAnimationFrame(tick);
}
function play(){
  if(playing){playing=false;last=null;setPlay();return;}
  if(tcur>=T)tcur=0;
  playing=true;last=null;setPlay();requestAnimationFrame(tick);
}
[xaEl,vaEl,aaEl,xbEl,vbEl,abEl,tanEl,areaEl,dotsEl].forEach(e=>e.addEventListener('input',refresh));
cmpEl.addEventListener('change',()=>{cmpBlock.classList.toggle('show',cmpEl.checked);refresh();});
tEl.addEventListener('input',()=>{tcur=+tEl.value;playing=false;last=null;refresh();});
btnPlay.addEventListener('click',play);
btnReset.addEventListener('click',()=>{playing=false;last=null;tcur=0;refresh();});
[['pre_mru',0,5,0],['pre_start',0,0,2],['pre_brake',0,20,-2]].forEach(([k,x,v,a])=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.i18n=k;
  b.addEventListener('click',()=>{xaEl.value=x;vaEl.value=v;aaEl.value=a;refresh();});$('#presets').appendChild(b);
});
App.hooks.push(refresh);

/* ===== Raona-ho ===== */
const dv=(x,d)=>x===undefined?d:x;
function load(o){
  o=o||{};
  xaEl.value=dv(o.x,0);vaEl.value=dv(o.v,5);aaEl.value=dv(o.a,0);
  if(o.b){cmpEl.checked=true;xbEl.value=dv(o.b.x,60);vbEl.value=dv(o.b.v,-3);abEl.value=dv(o.b.a,0);}else cmpEl.checked=false;
  cmpBlock.classList.toggle('show',cmpEl.checked);
  tanEl.checked=!!o.tan;areaEl.checked=!!o.area;dotsEl.checked=o.dots!==false;
  speedEl.value=o.slow?'0.5':'1';
  playing=false;last=null;tcur=clamp(dv(o.t,0),0,T);
  refresh();
  if(o.run)play();
  RZ.show($('#svg'));
}
const P=(x,v,a)=>({x,v,a});
const inX=x=>x>=-50&&x<=100,inV=v=>v>=-20&&v<=20,inAc=a=>a>=-5&&a<=5,inT=s=>s>=0&&s<=T;
const AF={l:'l_af',u:'m/s²'},VF={l:'l_v0f',u:'m/s'};
RZ.init({
 sim:()=>load(),
 M:[
  {id:'m1',f:[{l:'l_v0f',u:'m/s'}],sim:([v])=>load({v:clamp(v,-20,20)}),ok:()=>({k:'m1_ok'}),
   chk:([v])=>!inV(v)?{k:'rng'}:Math.abs(v-6)<1e-6?null:{k:'m1_f',p:[v,fmt(X(P(0,v,0),T),1)]}},
  {id:'m2',f:[AF],sim:([a])=>load({x:20,v:2,a:clamp(a,-5,5)}),ok:()=>({k:'m2_ok'}),
   chk:([a])=>!inAc(a)?{k:'rng'}:Math.abs(a-2)<1e-6?null:{k:'m2_f',p:[a,fmt(X(P(20,2,a),T),1)]}},
  {id:'m3',f:[AF],sim:([a])=>load({v:20,a:clamp(a,-5,5),area:true}),ok:()=>({k:'m3_ok'}),
   chk:([a])=>!inAc(a)?{k:'rng'}:Math.abs(a+2)<1e-6?null:a>=0?{k:'m3_pos',p:[a]}:{k:'m3_f',p:[a,fmt(V(P(0,20,a),T),1)]}},
  {id:'m4',f:[{l:'l_tf',u:'s'}],sim:([s])=>load({x:0,v:6,b:{x:60,v:-4},t:clamp(s,0,T)}),ok:()=>({k:'m4_ok'}),
   chk:([s])=>!inT(s)?{k:'rng'}:Math.abs(s-6)<.05?null:{k:'m4_f',p:[s,fmt(X(P(0,6,0),s),1),fmt(X(P(60,-4,0),s),1)]}}
 ],
 S:[
  {id:'s1',ans:'D',f:[VF,AF],cxsim:([v,a])=>load({v,a}),
   cxok:([v,a])=>({k:'s1_cx',p:[v,a]}),
   cx:([v,a])=>!inV(v)||!inAc(a)?{k:'rng'}:(v===0&&a!==0)?null:{k:'s1_cx_no',p:[v,a]}},
  {id:'s2',ans:'S',sim:()=>load({v:8,a:0})},
  {id:'s3',ans:'D',f:[VF,AF],cxsim:([v,a])=>load({x:60,v,a}),
   cxok:([v,a])=>({k:'s3_cx',p:[v,a]}),
   cx:([v,a])=>!inV(v)||!inAc(a)?{k:'rng'}:(v<0&&a<0)?null:{k:'s3_cx_no',p:[v,a]}},
  {id:'s4',ans:'M',sim:()=>load({v:0,a:2})},
  {id:'s5',ans:'M',sim:()=>load({v:0,a:2,dots:true,t:6})},
  {id:'s6',ans:'S',sim:()=>load({v:4,a:1,area:true,t:6})}
 ],
 E:[
  {id:'e1',who:1,sim:()=>load({v:0,a:2,t:4,area:true})},
  {id:'e2',who:1,sim:()=>load({x:50,v:-6,a:-2,t:3})},
  {id:'e3',who:3,sim:()=>load({x:0,v:0,a:0,b:{x:0,v:5,a:0}})}
 ],
 D:[
  {id:'d1',chips:{vals:[-3,-1.5,-1,1.5],fmt:x=>fmt(x,1)+' m/s²'},f:[{l:'d1.l0',u:'m'}],
   sim:(args)=>load({v:15,a:Number.isFinite(args[0])?args[0]:0,area:true}),ok:()=>({k:'d1_ok'}),
   chk:([p,x])=>p!==-1.5?{k:'d1_a',p:[fmt(p,1),fmt(V(P(0,15,p),T),1)]}:Math.abs(x-75)>.5?{k:'d1_x'}:null},
  {id:'d2',chips:{vals:[20,22,25,30],fmt:x=>x+' m/s'},f:[{l:'d2.l0',u:'s'}],
   sim:(args)=>load({x:0,v:Number.isFinite(args[0])?args[0]:25,b:{x:40,v:20}}),ok:()=>({k:'d2_ok'}),
   chk:([p,s])=>p<=24?{k:'d2_v',p:[p,fmt(X(P(0,p,0),T),1),fmt(X(P(40,20,0),T),1)]}:Math.abs(s-40/(p-20))<.06?null:{k:'d2_t',p:[p]}},
  {id:'d3',f:[{l:'d3.l0',u:'m/s²'},{l:'d3.l1',u:'m/s'}],sim:([a])=>load({x:0,v:0,a:Number.isFinite(a)?clamp(a,-5,5):0}),ok:()=>({k:'d3_ok'}),
   chk:([a,v])=>!inAc(a)||!inV(v)?{k:'rng'}:Math.abs(a-1)>1e-6?{k:'d3_a',p:[a,fmt(X(P(0,0,a),T),1)]}:Math.abs(v-10)>.05?{k:'d3_v'}:null}
 ]
});
initQuiz([]);
initLang();applyLang();
refresh();
})();
