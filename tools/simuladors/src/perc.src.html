 inv:[['pr_i1',68,[[-1,15]]],['pr_i2',121,[[1,21]]],['pr_i3',72,[[-1,20],[-1,10]]],['pr_i4',50,[[1,25]]]]};

const pct=v=>{const r=Math.round(v*100)/100;return (Object.is(r,-0)?0:r).toFixed(2).replace(/\.?0+$/,'').replace('.',',');};
const fI=x=>{let s=x.toFixed(4).replace(/0+$/,'');if(s.split('.')[1]===undefined||s.split('.')[1].length<2)s=x.toFixed(2);return s.replace('.',',');};

function V(){ /* valors reals C0..Cn */

const Itot=()=>ST.reduce((a,s)=>a*idx(s),1);

function buildSteps(){const box=$('#stps');box.innerHTML='';
  ST.forEach((s,i)=>{const d=document.createElement('div');d.className='stp';
    d.innerHTML='<b>'+tt('st_lab',i+1)+'</b><select data-i="'+i+'" aria-label="'+tt('st_lab',i+1)+'"><option value="1">'+t('up')+'</option><option value="-1">'+t('down')+'</option></select>'+
      '<input type="text" inputmode="decimal" autocomplete="off" data-p="'+i+'" aria-label="'+tt('aria.pct',i+1)+'" value="'+String(s[1]).replace('.',',')+'"><span>%</span><output></output>';
    $('select',d).value=String(s[0]);
    $('select',d).oninput=()=>{ST[i][0]=+$('select',d).value;reset();};
    $('input',d).oninput=()=>{const v=parseNum($('input',d).value);ST[i][1]=Number.isFinite(v)?v:NaN;reset();};
    box.appendChild(d);});}
function check(){valid=Number.isFinite(VAL)&&VAL>0&&VAL<=1e7&&ST.every(s=>Number.isFinite(s[1])&&s[1]>=0&&(s[0]>0?s[1]<=1000:s[1]<100));
  $$('#stps .stp').forEach((d,i)=>{const s=ST[i],ok=Number.isFinite(s[1])&&s[1]>=0&&(s[0]>0?s[1]<=1000:s[1]<100);d.classList.toggle('bad',!ok);$('output',d).textContent=ok?'× '+fI(idx(s)):'';});
  return valid;}
function setMode(m){mode=m;$$('#modesw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
  $('#valLab').textContent=t(m==='fw'?'val_fw':'val_inv');$('#valLab').dataset.i18n=m==='fw'?'val_fw':'val_inv';
  $('#guessLab').textContent=t(m==='fw'?'guess_fw':'guess_inv');$('#guessLab').dataset.i18n=m==='fw'?'guess_fw':'guess_inv';}
function setCase(m,c,s){setMode(m);VAL=c;ST=s.map(x=>x.slice());$('#val').value=String(c).replace('.',',');$('#nst').value=String(ST.length);
  $('#guess').value='';guess=null;buildSteps();reset();}
function reset(){phase=0;target=0;msgFn=null;$('#msg').innerHTML='';$('#msg').className='msg';check();buildPresets();texts();}
$$('#modesw button').forEach(b=>b.onclick=()=>{if(b.dataset.m===mode)return;setCase(b.dataset.m,PRE[b.dataset.m][0][1],PRE[b.dataset.m][0][2]);});
$('#val').addEventListener('input',()=>{const v=parseNum($('#val').value);VAL=Number.isFinite(v)?v:NaN;reset();});
$('#nst').addEventListener('input',()=>{const k=+$('#nst').value;while(ST.length<k)ST.push([-1,10]);ST.length=k;buildSteps();reset();});
$('#again').onclick=()=>{$('#guess').value='';guess=null;reset();};
$('#go').onclick=()=>{if(!valid||target>n())return;
  if(target===0){const g=parseNum($('#guess').value);guess=$('#guess').value.trim()!==''&&Number.isFinite(g)?g:null;msgFn=null;$('#msg').innerHTML='';$('#msg').className='msg';}
  target=Math.min(n()+1,Math.round(target)+1);};
function setGo(){const b=$('#go'),k=Math.round(target),N=n();
  if(!valid){b.textContent=t(mode==='fw'?'go_fw':'go_inv').replace('{0}','1');b.disabled=true;return;}
  b.disabled=k>N;
  if(k>N)b.textContent=t('go_done');
  else if(k===N)b.textContent=t(mode==='fw'?'go_cmp':'go_err');

function texts(){
  setGo();
  if(!valid){$('#idx').innerHTML='';$('#ticket').innerHTML='';$('#msg').className='msg bad';$('#msg').textContent=t('bad_in');return;}
  if($('#msg').textContent===t('bad_in')){$('#msg').textContent='';$('#msg').className='msg';}
  const N=n(),v=V(),I=Itot(),done=Math.floor(phase+1e-9);
  $('#idx').innerHTML=ST.map((s,i)=>tt('i_line',i+1,t(s[0]>0?'p_up':'p_down'),pct(s[1]),fI(idx(s)))).join('<br>');
  const L=[];
  if(mode==='fw')for(let i=1;i<=N;i++)L.push(tt('t_fw',SUB[i],SUB[i-1],fI(idx(ST[i-1])),eur(v[i]),ST[i-1][0]>0?'b':'a'));
  else for(let i=N;i>=1;i--)L.push(tt('t_inv',SUB[i-1],SUB[i],fI(idx(ST[i-1])),eur(v[i-1]),ST[i-1][0]>0?'b':'a'));
  let h=L.slice(0,Math.min(done,N)).join('<br>');
  if(done>=N){h+='<br>'+tt('t_tot',ST.map(s=>fI(idx(s))).join(' · '),fI(I))+'<br>'+tt('t_var',(I>=1?'+ ':'− ')+pct(Math.abs(I-1)*100));}
  if(done>N){
    if(mode==='fw'){const sum=ST.reduce((a,s)=>a+s[0]*s[1],0);
      h+='<br>'+(N===1?t('t_same'):tt('t_naive',(sum>=0?'+':'−')+pct(Math.abs(sum)),eur(naive()),eur(Math.abs(naive()-v[N]))));}
    else h+='<br>'+tt('t_err',eur(naive()),eur(v[0]));}
  $('#ticket').innerHTML=h;
  if(msgFn)msgFn();
}
function finish(){
  const v=V(),ans=mode==='fw'?v[n()]:v[0],nv=naive(),near=(a,b)=>Math.abs(a-b)<=0.011+Math.abs(b)*0.0005;
  msgFn=()=>{const m=$('#msg');
    if(guess===null){m.className='msg';m.innerHTML='';return;}
    if(near(guess,ans)){m.className='msg good';m.innerHTML=tt('g_ok',eur(ans));}
    else if(near(guess,nv)&&!near(nv,ans)){m.className='msg bad';m.innerHTML=tt(mode==='fw'?'g_naive':'g_err',eur(guess),eur(ans));}
    else{m.className='msg bad';m.innerHTML=tt('g_ko',eur(guess),eur(ans));}};
  texts();
}

    cx.globalAlpha=1;}
