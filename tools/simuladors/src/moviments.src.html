/* ===== Moviments en el pla ===== */
const svg=$('#svg'),PI=Math.PI,VW=400,GM=9,U=(VW-28)/(2*GM),X=x=>VW/2+x*U,Y=y=>VW/2-y*U,NM='ABCDEFGH';
const STEPDEF={
 tra:[{id:'t0',ask:{n:3,ok:0}},{id:'t1',think:true},{id:'t2',think:true}],
 gir:[{id:'g0',ask:{n:3,ok:0}},{id:'g1',think:true},{id:'g2',think:true}],
 axi:[{id:'x0',ask:{n:3,ok:1}},{id:'x1',think:true},{id:'x2',think:true}],
 cen:[{id:'z0',ask:{n:3,ok:0}},{id:'z1',think:true},{id:'z2',think:true}]
};
const FIGS={tri:[[1,1],[4,1],[2,3]],quad:[[1,1],[4,1],[5,3],[2,4]],L:[[1,1],[4,1],[4,2],[2,2],[2,4],[1,4]]};
const ST={type:'tra',fig:'tri',pts:FIGS.tri.map(p=>p.slice()),a:4,b:2,ang:90,cx:0,cy:0,axis:'y',k:2};
let P=0,raf=0;
const ease=x=>x*x*(3-2*x);
const fc=v=>{const r=Math.round(v),i=Math.abs(v-r)<1e-6;return (i?String(r):v.toFixed(1).replace('.',',')).replace('-','−');};
const pt=p=>{const i=Math.abs(p[0]-Math.round(p[0]))<1e-6&&Math.abs(p[1]-Math.round(p[1]))<1e-6;return '('+fc(p[0])+(i?', ':'; ')+fc(p[1])+')';};
/* imatge exacta d'un punt i posició intermèdia (e de 0 a 1) */
function img(p){
  const x=p[0],y=p[1],{type,a,b,ang,cx,cy,axis,k}=ST;
  if(type==='tra')return [x+a,y+b];
  if(type==='cen')return [2*cx-x,2*cy-y];
  if(type==='gir'){const dx=x-cx,dy=y-cy;return ang===90?[cx-dy,cy+dx]:ang===180?[cx-dx,cy-dy]:[cx+dy,cy-dx];}
  return axis==='x'?[x,-y]:axis==='y'?[-x,y]:axis==='d1'?[y,x]:axis==='d2'?[-y,-x]:axis==='v'?[2*k-x,y]:[x,2*k-y];
}
function mov(p,e){
  const {type,ang,cx,cy}=ST;
  if(e>=1)return img(p);
  if(type==='gir'||type==='cen'){const A=(type==='cen'?PI:ang*PI/180)*e,dx=p[0]-cx,dy=p[1]-cy,c=Math.cos(A),s=Math.sin(A);return [cx+dx*c-dy*s,cy+dx*s+dy*c];}
  const q=img(p);return [lerp(p[0],q[0],e),lerp(p[1],q[1],e)];
}
const sg=v=>v===0?'':v>0?' + '+v:' − '+(-v),tm=(s,v,c)=>(s<0?'−':'')+v+sg(c);
function rule(){
  const {type,a,b,ang,cx,cy,axis,k}=ST;let A,B;
  if(type==='tra'){A=tm(1,'x',a);B=tm(1,'y',b);}
  else if(type==='cen'||(type==='gir'&&ang===180)){A=tm(-1,'x',2*cx);B=tm(-1,'y',2*cy);}
  else if(type==='gir'){if(ang===90){A=tm(-1,'y',cx+cy);B=tm(1,'x',cy-cx);}else{A=tm(1,'y',cx-cy);B=tm(-1,'x',cx+cy);}}
  else if(axis==='x'){A='x';B='−y';}else if(axis==='y'){A='−x';B='y';}else if(axis==='d1'){A='y';B='x';}else if(axis==='d2'){A='−y';B='−x';}
  else if(axis==='v'){A=tm(-1,'x',2*k);B='y';}else{A='x';B=tm(-1,'y',2*k);}
  return '(x, y) → ('+A+', '+B+')';
}
function axisName(){const {axis,k}=ST;return axis==='x'?t('ax_x')+' (y = 0)':axis==='y'?t('ax_y')+' (x = 0)':axis==='d1'?'y = x':axis==='d2'?'y = −x':axis==='v'?'x = '+fc(k):'y = '+fc(k);}

const sK=slider(ctrl,{id:'sk',key:'l_k',min:-6,max:6,step:1,val:2,fmtv:fc,on:v=>{ST.k=v;refresh();}});
function showCtl(){
  const tp=ST.type,rot=tp==='gir'||tp==='cen';
  sA.el.hidden=sB.el.hidden=tp!=='tra';sCx.el.hidden=sCy.el.hidden=!rot;
  $('#angsw').hidden=tp!=='gir';$('#axsw').hidden=tp!=='axi';
  sK.el.hidden=!(tp==='axi'&&(ST.axis==='v'||ST.axis==='h'));
  $$('#figsw .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.fig===ST.fig)));
  $$('#angsw .chip').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.ang===ST.ang)));
  $$('#axsw .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.axis===ST.axis)));
  $$('#typesw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===tp)));
  $('#chain').disabled=SE.i===0;
}
/* dibuix */
function draw(){
  const e=clamp(P,0,1),{type,pts,a,b,cx,cy,axis,k}=ST,n=pts.length;
  const f=v=>v.toFixed(1),op=o=>o===undefined||o>=1?'':' style="opacity:'+Math.max(0,o).toFixed(3)+'"';
  const ln=(x1,y1,x2,y2,cls,o)=>'<line x1="'+f(X(x1))+'" y1="'+f(Y(y1))+'" x2="'+f(X(x2))+'" y2="'+f(Y(y2))+'" class="'+cls+'"'+op(o)+'/>';
  const pl=(q,cls,o)=>'<polygon points="'+q.map(p=>f(X(p[0]))+','+f(Y(p[1]))).join(' ')+'" class="'+cls+'"'+op(o)+'/>';
  const tx=(px,py,str,cls,an)=>'<text x="'+f(px)+'" y="'+f(py)+'" class="'+cls+'" text-anchor="'+(an||'middle')+'" dominant-baseline="central">'+str+'</text>';
  const arrow=(p,q,o)=>{const x1=X(p[0]),y1=Y(p[1]),x2=X(q[0]),y2=Y(q[1]),d=Math.hypot(x2-x1,y2-y1);if(d<6)return '';
    const ux=(x2-x1)/d,uy=(y2-y1)/d,bx=x2-ux*9,by=y2-uy*9;
    return '<g'+op(o)+'><line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(bx)+'" y2="'+f(by)+'" class="vec"/><polygon class="vech" points="'+f(x2)+','+f(y2)+' '+f(bx-uy*4.5)+','+f(by+ux*4.5)+' '+f(bx+uy*4.5)+','+f(by-ux*4.5)+'"/></g>';};
  let s='<rect x="0" y="0" width="'+VW+'" height="'+VW+'" fill="none"/>';
  for(let i=-GM;i<=GM;i++){if(i){s+=ln(i,-GM,i,GM,'gr')+ln(-GM,i,GM,i,'gr');}}
  s+=ln(-GM,0,GM,0,'ax')+ln(0,-GM,0,GM,'ax');
  for(let i=-GM;i<=GM;i++){if(!i)continue;s+=tx(X(i),Y(0)+8,fc(i),'num')+tx(X(0)-4,Y(i),fc(i),'num','end');}
  s+=tx(X(GM)+7,Y(0)-9,'x','axn')+tx(X(0)+9,Y(GM)-6,'y','axn');
  /* elements del moviment */
  const cur=pts.map(p=>mov(p,e));
  if(type==='axi'){
    const L=axis==='x'?[-GM,0,GM,0]:axis==='y'?[0,-GM,0,GM]:axis==='d1'?[-GM,-GM,GM,GM]:axis==='d2'?[-GM,GM,GM,-GM]:axis==='v'?[k,-GM,k,GM]:[-GM,k,GM,k];
    s+=ln(L[0],L[1],L[2],L[3],'axl');
    if(e>0)pts.forEach((p,i)=>{s+=ln(p[0],p[1],cur[i][0],cur[i][1],'tr');});
  }else if(type==='tra'){
    if(e>0)pts.forEach((p,i)=>{if(i)s+=arrow(p,cur[i],.55);});
  }else{
    const A=(type==='cen'?PI:ST.ang*PI/180)*e;
    if(e>0)pts.forEach((p,i)=>{
      const dx=p[0]-cx,dy=p[1]-cy,m=Math.max(2,Math.ceil(A*10));let d='';
      for(let j=0;j<=m;j++){const g=A*j/m,c=Math.cos(g),sn=Math.sin(g);d+=(j?'L':'M')+f(X(cx+dx*c-dy*sn))+','+f(Y(cy+dx*sn+dy*c));}
      s+='<path d="'+d+'" class="tr"/>';
      if(type==='cen'||i===0)s+=ln(cx,cy,p[0],p[1],'tr',.7)+ln(cx,cy,cur[i][0],cur[i][1],'tr',.7);
    });
  }
  /* figura original i imatge */
  let gx=0,gy=0;pts.forEach(p=>{gx+=p[0]/n;gy+=p[1]/n;});
  const lab=(p,c,name,cls)=>{const dx=p[0]-c[0],dy=p[1]-c[1],d=Math.hypot(dx,dy)||1;return tx(X(p[0])+dx/d*14,Y(p[1])-dy/d*14,name,cls);};
  s+=pl(pts,'f1');
  if(e>0){
    s+=pl(cur,'f2');
    const gc=mov([gx,gy],e);
    cur.forEach((p,i)=>{s+='<circle cx="'+f(X(p[0]))+'" cy="'+f(Y(p[1]))+'" r="3.6" class="v2"/>';if(e>=1)s+=lab(p,gc,NM[i]+'′','labi');});
  }
  pts.forEach((p,i)=>{s+='<circle cx="'+f(X(p[0]))+'" cy="'+f(Y(p[1]))+'" r="4.2" class="v1"/>'+lab(p,[gx,gy],NM[i],'lab');});
  if(type==='tra'){
    s+=arrow(pts[0],e>0?cur[0]:[pts[0][0]+a,pts[0][1]+b]);
    if(e===0&&(a||b)){
      s+=tx(X(pts[0][0]+a)+(a>=0?9:-9),Y(pts[0][1]+b)+(b>=0?-8:8),'v = ('+fc(a)+', '+fc(b)+')','labk',a>=0?'start':'end');
    }
  }
  if(type==='gir'||type==='cen')s+='<circle cx="'+f(X(cx))+'" cy="'+f(Y(cy))+'" r="5" class="ctr"/>'+tx(X(cx)-11,Y(cy)+12,cx===0&&cy===0?'O':'C','labk');
  /* agafadors per a arrossegar */
  pts.forEach((p,i)=>{s+='<circle cx="'+f(X(p[0]))+'" cy="'+f(Y(p[1]))+'" r="12" class="hd" data-h="'+i+'"/>';});
  if(type==='gir'||type==='cen')s+='<circle cx="'+f(X(cx))+'" cy="'+f(Y(cy))+'" r="12" class="hd" data-h="c"/>';
  svg.innerHTML=s;
  /* taula de coordenades */
  let h='<table class="tbl"><thead><tr><th>'+t('th_v')+'</th><th>'+t('th_o')+'</th><th>'+t('th_i')+'</th></tr></thead><tbody>';
  pts.forEach((p,i)=>{h+='<tr><td>'+NM[i]+' → '+NM[i]+'′</td><td>'+pt(p)+'</td><td class="im">'+(e>0?pt(cur[i]):'?')+'</td></tr>';});
  $('#coords').innerHTML=h+'</tbody></table>';
}
function statsFor(i){
  const {type,a,b,ang,cx,cy}=ST;
  const L=type==='tra'?[['k_vec','('+fc(a)+', '+fc(b)+')']]:type==='gir'?[['k_ctr',pt([cx,cy])],['k_ang',ang+'°']]:type==='axi'?[['k_axis',axisName()]]:[['k_ctr',pt([cx,cy])]];
  if(i>=2)L.push(['k_rule','<b>'+rule()+'</b>']);
  return L;
}
function refresh(){
  SE.steps.forEach((s,i)=>{s.stats=statsFor(i);});
  stepRender();showCtl();draw();
}
function animateTo(i){
  cancelAnimationFrame(raf);showCtl();
  const from=P,to=i;
  if(REDUCE||Math.abs(to-from)<1e-6||(from>=1&&to>=1)){P=to;draw();return;}
  const dur=1500*Math.max(0.5,Math.abs(Math.min(to,1)-Math.min(from,1))),t0=performance.now();
  function step(now){
    const p=Math.min(1,(now-t0)/dur);
    P=from+(to-from)*ease(p);draw();
    if(p<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
function rebuildStepper(){
  const sp=$('#stepper');sp.innerHTML='';
  SE.steps.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.textContent=k+1;b.onclick=()=>stepGo(k);sp.appendChild(b);});
}
function setType(tp){
  cancelAnimationFrame(raf);
  ST.type=tp;
  SE.steps=STEPDEF[tp].map(x=>Object.assign({},x));SE.ans={};SE.hint={};SE.i=0;P=0;
  rebuildStepper();refresh();
}
$$('#typesw button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.type!==ST.type)setType(b.dataset.type);}));
$$('#figsw .chip').forEach(b=>b.addEventListener('click',()=>{ST.fig=b.dataset.fig;ST.pts=FIGS[ST.fig].map(p=>p.slice());refresh();}));
$$('#angsw .chip').forEach(b=>b.addEventListener('click',()=>{ST.ang=+b.dataset.ang;refresh();}));
$$('#axsw .chip').forEach(b=>b.addEventListener('click',()=>{ST.axis=b.dataset.axis;refresh();}));
/* la imatge passa a ser la figura: per a encadenar moviments */
$('#chain').addEventListener('click',()=>{
  if(SE.i===0)return;
  cancelAnimationFrame(raf);
  ST.pts=ST.pts.map(img);ST.fig='';SE.i=0;P=0;refresh();
});
/* arrossegar vèrtexs i centre */
let drag=null;
function gpos(ev){const m=svg.getScreenCTM();if(!m)return null;const q=svg.createSVGPoint();q.x=ev.clientX;q.y=ev.clientY;const w=q.matrixTransform(m.inverse());return [(w.x-VW/2)/U,(VW/2-w.y)/U];}
svg.addEventListener('pointerdown',ev=>{const h=ev.target&&ev.target.dataset?ev.target.dataset.h:undefined;if(h===undefined)return;drag=h;try{svg.setPointerCapture(ev.pointerId);}catch(e){}ev.preventDefault();});
svg.addEventListener('pointermove',ev=>{
  if(drag===null)return;const g=gpos(ev);if(!g)return;
  if(drag==='c'){const x=clamp(Math.round(g[0]),-6,6),y=clamp(Math.round(g[1]),-6,6);if(x===ST.cx&&y===ST.cy)return;ST.cx=x;ST.cy=y;sCx.set(x);sCy.set(y);}
  else{const x=clamp(Math.round(g[0]),-8,8),y=clamp(Math.round(g[1]),-8,8),p=ST.pts[+drag];if(!p||(p[0]===x&&p[1]===y))return;p[0]=x;p[1]=y;ST.fig='';}
  refresh();
});
['pointerup','pointercancel'].forEach(n=>svg.addEventListener(n,()=>{drag=null;}));
/* càrrega d'un cas des de les activitats: es mostra el moviment ja fet */
function ld(type,v){
  const c=(x,m)=>clamp(Math.round(Number.isFinite(x)?x:0),-m,m);v=v||{};
  if(v.fig){ST.fig=v.fig;ST.pts=FIGS[v.fig].map(p=>p.slice());}
  if(v.pts){ST.fig='';ST.pts=v.pts.map(p=>[c(p[0],8),c(p[1],8)]);}
  if(v.a!==undefined){ST.a=c(v.a,8);sA.set(ST.a);}
  if(v.b!==undefined){ST.b=c(v.b,8);sB.set(ST.b);}
  if(v.ang!==undefined)ST.ang=[90,180,270].includes(v.ang)?v.ang:90;
  if(v.cx!==undefined){ST.cx=c(v.cx,6);sCx.set(ST.cx);}
  if(v.cy!==undefined){ST.cy=c(v.cy,6);sCy.set(ST.cy);}
  if(v.axis)ST.axis=v.axis;
  if(v.k!==undefined){ST.k=c(v.k,6);sK.set(ST.k);}
  setType(type);
  P=2;SE.i=2;refresh();
  RZ.show(svg);
}
App.hooks.push(()=>{if(!SE.steps.length)return;refresh();});
/* ===== Raona-ho ===== */
const isI=Number.isInteger,inG=x=>isI(x)&&Math.abs(x)<=8;
RZ.init({
 F:{a:{l:'f_a'},b:{l:'f_b'},ang:{l:'f_ang',u:'°'},k:{l:'f_k'},x:{l:'f_x'},y:{l:'f_y'},cx:{l:'f_cx'},cy:{l:'f_cy'}},
 sim:()=>{},
 M:[
  {id:'m1',f:['a','b'],sim:([a,b])=>ld('tra',{fig:'tri',a,b}),ok:()=>({k:'m1_ok'}),
   chk:([a,b])=>(!inG(a)||!inG(b))?{k:'rng'}:(a!==-4||b!==3)?{k:'m1_f',p:[fc(a),fc(b),fc(1+a),fc(1+b)]}:null},
  {id:'m2',f:['ang'],sim:([g])=>ld('gir',{pts:[[3,1],[5,1],[3,2]],ang:g===-90?270:g,cx:0,cy:0}),ok:()=>({k:'m2_ok'}),
   chk:([g])=>{if(g===-90)g=270;return ![90,180,270].includes(g)?{k:'m2_bad'}:g!==270?{k:'m2_f',p:g===90?[90,'−1','3']:[180,'−3','−1']}:null;}},
  {id:'m3',f:['k'],sim:([k])=>ld('axi',{fig:'tri',axis:'v',k}),ok:()=>({k:'m3_ok'}),
   chk:([k])=>!inG(k)?{k:'rng'}:k!==4?{k:'m3_f',p:[fc(k),fc(2*k-1)]}:null},
  {id:'m4',f:['cx','cy'],sim:([x,y])=>ld('cen',{pts:[[2,1],[4,1],[2,2]],cx:x,cy:y}),ok:()=>({k:'m4_ok'}),
   chk:([x,y])=>(!inG(x)||!inG(y))?{k:'rng'}:(x!==-1||y!==3)?{k:'m4_f',p:[fc(x),fc(y),fc(2*x-2),fc(2*y-1)]}:null}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>ld('tra',{fig:'L',a:-5,b:-4})},
  {id:'s2',ans:'D',f:['x','y'],sim:()=>ld('axi',{fig:'tri',axis:'y'}),cxsim:([x,y])=>ld('axi',{pts:[[x,y],[x+2,y],[x,y+2]],axis:'y'}),
   cx:([x,y])=>(!inG(x)||!inG(y))?{k:'rng'}:x!==0?{k:'s2_f',p:[fc(x),fc(y),fc(-x)]}:null},
  {id:'s3',ans:'S',sim:()=>ld('axi',{fig:'L',axis:'x'})},
  {id:'s4',ans:'S',sim:()=>ld('gir',{fig:'L',ang:180,cx:0,cy:0})},
  {id:'s5',ans:'M',sim:()=>ld('axi',{fig:'tri',axis:'d1'})}
 ],
 E:[
  {id:'e1',who:0,args:[],sim:()=>ld('gir',{pts:[[4,1],[6,1],[4,2]],ang:90,cx:0,cy:0})},
  {id:'e2',who:1,args:[],sim:()=>ld('axi',{pts:[[2,5],[4,5],[2,6]],axis:'x'})},
  {id:'e3',who:3,args:[],sim:()=>ld('tra',{pts:[[1,4],[3,4],[1,5]],a:-3,b:2})}
 ],
 D:[
  {id:'d1',f:[{l:'d1.l0'},{l:'d1.l1'},{l:'d1.l2'}],sim:v=>ld('tra',{pts:[[-5,-2],[-4,-2],[-5,-1]],a:v.length?v[0]:8,b:v.length?v[1]:6}),ok:()=>({k:'d1_ok'}),
   chk:([a,b,d])=>(a!==8||b!==6)?{k:'d1_v',p:[fc(a),fc(b),fc(a-5),fc(b-2)]}:d!==10?{k:'d1_d'}:null},
  {id:'d2',f:[{l:'d2.l0'},{l:'d2.l1'}],sim:()=>ld('gir',{pts:[[2,3],[4,3],[2,4]],ang:180,cx:0,cy:0}),ok:()=>({k:'d2_ok'}),
   chk:([x,y])=>(x===2&&y===-3)?null:(x===-2&&y===-3)?{k:'d2_half'}:{k:'d2_f',p:[fc(x),fc(y)]}}
 ]
});
initQuiz([]);
initLang();applyLang();
stepsInit(STEPDEF.tra.map(x=>Object.assign({},x)),i=>animateTo(i));
refresh();
</script>
