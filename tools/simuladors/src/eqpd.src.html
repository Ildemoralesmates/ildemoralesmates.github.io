<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equacions amb parèntesis i denominadors</title>
<meta name="description" content="Treu parèntesis, lleva denominadors i aïlla la x. Cada costat de l'equació és un plat de la balança: si un pas canvia la solució, la balança es tomba. Amb demostració pas a pas i activitats per a raonar.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
#svg{display:block;width:100%;height:auto}
#svg .beam{stroke:var(--ink);stroke-width:9;stroke-linecap:round}
#svg .pivot{fill:var(--panel);stroke:var(--ink);stroke-width:4}
#svg .stand{fill:var(--ink)}
#svg .rope{stroke:var(--muted);stroke-width:2}
#svg .plate{fill:var(--ink)}
#svg .wt{fill:var(--muted);font:600 17px var(--f-num)}
#svg .wt.off{fill:var(--warn)}
#svg .tag{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
#svg .ex text{fill:var(--ink);font-family:var(--f-num);font-weight:600}
#svg .ex line{stroke:var(--ink)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .1em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em .05em}
.fr>span:last-child{padding:.05em .22em 0}
.o{padding:0 .32em}
.eqs{padding:0 .4em}
.eqbig{font:700 clamp(1.25rem,3.2vw,1.8rem)/1.7 var(--f-num);letter-spacing:-.01em;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.eqbig.off{color:var(--warn)}
.read{display:grid;gap:8px;font-size:15px}
.read .ok{color:var(--ok);font-weight:700;margin:0}
.read .bad{color:var(--warn);font-weight:700;margin:0}
.read p{margin:0}
.read .step{margin:0;color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.opr{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px}
.opr input[type=text]{font:inherit;font-size:15px;width:4.2em;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.opr select{font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn .m{font-family:var(--f-num)}
.btn .fr{font-size:.9em}
.qd{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:300px;overflow:auto}
.qd li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 14px;padding:3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.qd li.cur{border-color:var(--pa);box-shadow:inset 3px 0 0 var(--pa)}
.qd li.bad{border-color:var(--warn)}
.qe{font:600 16px/1.6 var(--f-num)}
.ql{font-size:12.5px;color:var(--muted)}
</style>
<!--@GC@-->
</head>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>

<div class="simcv">

<div class="side">
<div class="read">

<div class="note" id="orig"></div>

<fieldset>
<legend data-i18n="gt_demo"></legend>

<button class="btn" type="button" id="undo" data-i18n="undo"></button>
</div>
<div class="btns">
<div class="seg" role="group" id="lvsw" data-i18n-aria="aria.lv" aria-label="">
<button type="button" data-lv="p" aria-pressed="true" data-i18n="lv_p"></button>
<button type="button" data-lv="d" aria-pressed="false" data-i18n="lv_d"></button>
<button type="button" data-lv="pd" aria-pressed="false" data-i18n="lv_pd"></button>

<button class="btn" type="button" id="new" data-i18n="new"></button>
</div>
</fieldset>
<fieldset>
<legend data-i18n="gt_own"></legend>

<div class="btns" id="pbtns"></div>
<div class="opr"><span data-i18n="l_mul"></span><input type="text" inputmode="numeric" autocomplete="off" id="mulm" data-i18n-aria="aria.mul" aria-label=""><button class="btn small" type="button" id="mulgo" data-i18n="b_apply"></button></div>
<div class="opr"><button class="btn small" type="button" id="redgo" data-i18n="b_red"></button></div>
<div class="opr"><span data-i18n="l_add"></span>
<select id="addsg" data-i18n-aria="aria.sg" aria-label=""><option value="1">+</option><option value="-1">−</option></select>
<input type="text" inputmode="numeric" autocomplete="off" id="addn" data-i18n-aria="aria.num" aria-label="">
<select id="addk" data-i18n-aria="aria.kind" aria-label=""><option value="x">x</option><option value="n" data-i18n="o_units"></option></select>
<button class="btn small" type="button" id="addgo" data-i18n="b_apply"></button></div>
<div class="opr"><span data-i18n="l_div"></span><input type="text" inputmode="numeric" autocomplete="off" id="divk" data-i18n-aria="aria.num" aria-label=""><button class="btn small" type="button" id="divgo" data-i18n="b_apply"></button></div>
</fieldset>
</div>
</div>
<div class="idea" data-i18n-html="idea"></div>
</section>

<!--@RAONA@-->

  </main>
  <!--@FOOTER@-->
</div>

/* ===== motor algebraic: fraccions racionals i termes ===== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const r=a%b;a=b;b=r;}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const Fr=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return {n:n/g,d:d/g};};
const fa=(p,q)=>Fr(p.n*q.d+q.n*p.d,p.d*q.d);
const fm=(p,q)=>Fr(p.n*q.n,p.d*q.d);
const fdv=(p,q)=>Fr(p.n*q.d,p.d*q.n);
const fe=(p,q)=>p.n===q.n&&p.d===q.d;
const fi=p=>p.d===1;
const F0=Fr(0),F1=Fr(1),FM=Fr(-1);
const fnum=p=>p.n/p.d;
const MIN='−';
const sg=n=>n<0?MIN+(-n):String(n);
const fstr=p=>fi(p)?sg(p.n):sg(p.n)+'/'+p.d;
/* termes: n (v) · x (v·x) · p m(ax+b) · f s(ax+b)/d */
const N=v=>({k:'n',v:Fr(v)}),X=v=>({k:'x',v:Fr(v)}),P=(m,a,b)=>({k:'p',m:m,a:a,b:b}),Q=(s,a,b,d)=>({k:'f',s:s,a:a,b:b,d:d});
function tv(t,x){
  if(t.k==='n')return t.v;
  if(t.k==='x')return fm(t.v,x);
  if(t.k==='p')return fm(Fr(t.m),fa(fm(Fr(t.a),x),Fr(t.b)));
  return fm(Fr(t.s),fdv(fa(fm(Fr(t.a),x),Fr(t.b)),Fr(t.d)));
}
const sv=(side,x)=>side.reduce((s,t)=>fa(s,tv(t,x)),F0);
function solve(L,R){
  const g0=fa(sv(L,F0),fm(FM,sv(R,F0))),g1=fa(sv(L,F1),fm(FM,sv(R,F1))),al=fa(g1,fm(FM,g0));
  return al.n===0?null:fm(FM,fdv(g0,al));
}
const cps=side=>side.map(t=>Object.assign({},t));
const cp=s=>({L:cps(s.L),R:cps(s.R)});
function norm(side){
  const o=[];
  side.forEach(t=>{
    if(t.k==='n'||t.k==='x'){if(t.v.n!==0)o.push(t);}
    else if(t.k==='p'&&t.m===1){if(t.a!==0)o.push(X(t.a));if(t.b!==0)o.push(N(t.b));}
    else if(t.k==='p'&&(t.m===0||t.a===0||t.b===0)){if(t.m*t.a!==0)o.push(X(t.m*t.a));if(t.m*t.b!==0)o.push(N(t.m*t.b));}
    else o.push(t);
  });
  return o;
}
/* moviments: cadascun torna un estat nou o null si no es pot */
function mExpand(s,sd,i){
  const r=cp(s),t=r[sd][i],rep=[];
  if(t.m*t.a!==0)rep.push(X(t.m*t.a));
  if(t.m*t.b!==0)rep.push(N(t.m*t.b));
  r[sd].splice(i,1,...rep);return r;
}
function mulSide(side,M){
  const o=[];
  for(const t of side){
    if(t.k==='n'||t.k==='x')o.push({k:t.k,v:fm(t.v,Fr(M))});
    else if(t.k==='p')o.push(P(t.m*M,t.a,t.b));
    else{
      if(M%t.d)return null;
      const c=t.s*M/t.d;
      if(t.a===0)o.push(N(c*t.b));else if(t.b===0)o.push(X(c*t.a));else o.push(P(c,t.a,t.b));
    }
  }
  return norm(o);
}
function mClear(s,M,onlyLeft){
  const L=mulSide(s.L,M),R=onlyLeft?cps(s.R):mulSide(s.R,M);
  return (!L||!R)?null:{L:L,R:R};
}
function redSide(side){
  let nx=0,nn=0,sx=F0,sn=F0;const rest=[];
  side.forEach(t=>{if(t.k==='x'){nx++;sx=fa(sx,t.v);}else if(t.k==='n'){nn++;sn=fa(sn,t.v);}else rest.push(t);});
  if(nx<2&&nn<2)return null;
  const o=rest.slice();if(sx.n)o.push({k:'x',v:sx});if(sn.n)o.push({k:'n',v:sn});return o;
}
function mReduce(s){
  const L=redSide(s.L),R=redSide(s.R);
  return (!L&&!R)?null:{L:L||cps(s.L),R:R||cps(s.R)};
}
function addSide(side,kind,v){
  const o=cps(side),i=o.findIndex(t=>t.k===kind);
  if(i>=0)o[i].v=fa(o[i].v,v);else o.push({k:kind,v:v});
  return norm(o);
}
function mAdd(s,kind,v,onlyLeft){return {L:addSide(s.L,kind,v),R:onlyLeft?cps(s.R):addSide(s.R,kind,v)};}
const simple=side=>side.every(t=>t.k==='x'||t.k==='n')&&side.filter(t=>t.k==='x').length<2&&side.filter(t=>t.k==='n').length<2;
const isSimple=s=>simple(s.L)&&simple(s.R);
const divSide=(side,k)=>side.map(t=>({k:t.k,v:fdv(t.v,k)}));
function mDiv(s,k,onlyLeft){
  if(!isSimple(s)||k.n===0)return null;
  return {L:divSide(s.L,k),R:onlyLeft?cps(s.R):divSide(s.R,k)};
}
function solvedVal(s){
  const sx=side=>side.length===1&&side[0].k==='x'&&fe(side[0].v,F1);
  const cs=side=>side.length===0||(side.length===1&&side[0].k==='n');
  const cv=side=>side.length?side[0].v:F0;
  if(sx(s.L)&&cs(s.R))return cv(s.R);
  if(sx(s.R)&&cs(s.L))return cv(s.L);
  return null;
}
const allT=s=>s.L.concat(s.R);
const dens=s=>{const d=[];allT(s).forEach(t=>{if(t.k==='f'&&d.indexOf(t.d)<0)d.push(t.d);});return d.sort((a,b)=>a-b);};
const pidx=s=>{const o=[];['L','R'].forEach(sd=>s[sd].forEach((t,i)=>{if(t.k==='p')o.push({sd:sd,i:i,t:t});}));return o;};
/* pas recomanat (demostració) */
function suggest(s){
  if(solvedVal(s))return null;
  const ds=dens(s);
  if(ds.length)return {op:'clear',M:ds.reduce(lcm,1),ds:ds};
  const ps=pidx(s);
  if(ps.length)return {op:'exp',sd:ps[0].sd,i:ps[0].i,m:ps[0].t.m};
  if(mReduce(s))return {op:'red'};
  const fx=side=>side.find(t=>t.k==='x'),fn=side=>side.find(t=>t.k==='n');
  const xl=fx(s.L),xr=fx(s.R);
  if(xl&&xr){
    const lo=fnum(xl.v)<=fnum(xr.v)?xl.v:xr.v;
    return {op:'add',kind:'x',v:fm(FM,lo)};
  }
  const sd=xl?'L':xr?'R':null;if(!sd)return null;
  const cn=fn(s[sd]);
  if(cn)return {op:'add',kind:'n',v:fm(FM,cn.v)};
  const xt=fx(s[sd]);
  if(!fe(xt.v,F1)&&isSimple(s))return {op:'div',k:xt.v};
  return null;
}
/* aplica una operació (de la demostració o de l'alumne); torna {s} o {err:{k,p}} */
function applyOp(s,op,onlyLeft){
  let r=null;
  if(op.op==='exp')r=mExpand(s,op.sd,op.i);
  else if(op.op==='clear'){
    r=mClear(s,op.M,onlyLeft);
    if(!r){const bad=dens(s).find(d=>op.M%d);return {err:{k:'er_mult',p:[op.M,bad===undefined?'?':bad]}};}
  }
  else if(op.op==='red'){r=mReduce(s);if(!r)return {err:{k:'er_red'}};}
  else if(op.op==='add')r=mAdd(s,op.kind,op.v,onlyLeft);
  else if(op.op==='div'){r=mDiv(s,op.k,onlyLeft);if(!r)return {err:{k:'er_div'}};}
  return {s:r};
}

 pd:[
  ()=>({L:[P(pick([2,3,4]),1,nz(-5,5))],R:[Q(1,1,nz(-5,5),pick([2,3,4]))]}),
  ()=>({L:[Q(1,1,nz(-5,5),pick([2,3,4])),P(pick([2,3,-2]),1,nz(-5,5))],R:[N(ri(-4,12))]}),
  ()=>({L:[Q(1,1,0,pick([2,3,4])),P(-pick([1,2]),1,nz(-5,5))],R:[N(ri(-4,8))]}),
  ()=>({L:[Q(1,pick([2,3]),nz(-5,5),pick([2,3,4,5]))],R:[P(pick([2,3,-1]),1,nz(-5,5))]}),
  ()=>({L:[Q(1,1,nz(-5,5),pick([2,3,4])),P(-pick([1,2,3]),1,nz(-5,5))],R:[N(ri(-6,6))]}),
  ()=>({L:[P(pick([2,3]),1,nz(-4,4)),Q(-1,1,nz(-5,5),pick([2,3,4]))],R:[N(ri(0,12))]}),
  ()=>({L:[Q(1,1,nz(-4,4),pick([2,3])),Q(1,1,nz(-4,4),pick([4,5,6]))],R:[P(pick([2,3]),1,nz(-3,3))]})
 ]
};
function mkEq(L,R){const s={L:norm(L),R:norm(R)};return {s:s,xs:solve(s.L,s.R)};}
function okFr(s){
  const f=allT(s).filter(t=>t.k==='f'),seen={};
  for(const t of f){
    if(gcd(gcd(t.a,t.b),t.d)>1)return false;
    const k=t.a+','+t.b+','+t.d;if(seen[k])return false;seen[k]=1;
  }
  return true;
}
function gen(level,avoid){
  for(let n=0;n<6000;n++){
    const t=pick(TPL[level])(),e=mkEq(t.L,t.R);
    if(!e.xs||!fi(e.xs)||e.xs.n===0||Math.abs(e.xs.n)>9)continue;
    const ds=dens(e.s),M=ds.reduce(lcm,1);if(M>12||!okFr(e.s))continue;
    const np=pidx(e.s).length;
    if(level==='p'&&(np===0||ds.length))continue;
    if(level==='d'&&(ds.length===0||np))continue;
    if(level==='pd'&&(ds.length===0||np===0))continue;
    if(avoid&&eqKey(e.s)===avoid)continue;
    return e;
  }
  return mkEq([P(2,1,3)],[N(14)]);
}
function eqKey(s){return JSON.stringify(s);}

/* ===== presentació: fraccions i termes en HTML ===== */
const frH=(n,d)=>'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
function linH(a,b){
  let s='';
  if(a!==0)s+=(a===1?'':a===-1?MIN:sg(a))+'x';
  if(b!==0)s+=a!==0?(b>0?' + ':' '+MIN+' ')+Math.abs(b):sg(b);
  return s||'0';
}
function termH(q){
  if(q.k==='n'){const a=Fr(Math.abs(q.v.n),q.v.d);return {neg:q.v.n<0,h:fi(a)?String(a.n):frH(a.n,a.d)};}
  if(q.k==='x'){const a=Fr(Math.abs(q.v.n),q.v.d);return {neg:q.v.n<0,h:(fi(a)?(a.n===1?'':a.n):frH(a.n,a.d))+'x'};}
  if(q.k==='p'){const am=Math.abs(q.m);return {neg:q.m<0,h:(am===1?'':am)+'('+linH(q.a,q.b)+')'};}
  return {neg:q.s<0,h:frH(linH(q.a,q.b),q.d)};
}
function sideH(side){
  if(!side.length)return '0';
  return side.map((q,i)=>{const r=termH(q);return i===0?(r.neg?MIN:'')+r.h:'<span class="o">'+(r.neg?MIN:'+')+'</span>'+r.h;}).join('');
}
let S=null,OR=null,XS=F0,hist=[],mode='both',level='p',flash=null,note=null,theta=0,target=0,raf=0;
const bal=s=>fe(sv(s.L,XS),sv(s.R,XS));
const eqH=s=>sideH(s.L)+'<span class="eqs">'+(bal(s)?'=':'≠')+'</span>'+sideH(s.R);
const sgp=n=>n<0?'('+sg(n)+')':String(n);
const jn=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' '+t('and')+' '+a[a.length-1];
const msgT=m=>m?tt(m.k,...(m.p||[])):'';
const svg=$('#svg'),eqEl=$('#eq'),origEl=$('#orig'),msgEl=$('#msg'),qd=$('#qd'),pbtns=$('#pbtns');
const demo=$('#demo'),undoB=$('#undo'),btnBoth=$('#both'),btnLeft=$('#left');
/* etiquetes dels passos */
function addStr(op){
  const a=Fr(Math.abs(op.v.n),op.v.d);
  return (op.v.n<0?MIN:'+')+' '+((op.kind==='x'&&fe(a,F1))?'':fstr(a))+(op.kind==='x'?'x':'');
}
function lblOf(op){
  if(op.op==='clear')return {k:'lb_clear',p:[op.M]};
  if(op.op==='exp')return {k:'lb_exp'};
  if(op.op==='red')return {k:'lb_red'};
  if(op.op==='add')return {k:'lb_add',p:[addStr(op)]};
  return {k:'lb_div',p:[fstr(op.k)]};
}
function explain(op,prev,left){
  if(left)return null;
  if(op.op==='clear'){const ds=dens(prev),m=ds.reduce(lcm,1);return op.M===m?(ds.length>1?{k:'ex_clear',p:[jn(ds),m]}:{k:'ex_clear1',p:[m]}):{k:'ex_clear_big',p:[op.M,m]};}
  if(op.op==='exp'){const m=prev[op.sd][op.i].m;return {k:m<0?'ex_exp_neg':'ex_exp',p:[sg(m)]};}
  if(op.op==='red')return {k:'ex_red'};
  if(op.op==='add')return {k:op.kind==='x'?'ex_addx':'ex_addn',p:[addStr(op)]};
  return {k:'ex_div',p:[fstr(op.k)]};
}
/* balança */
function layoutS(side){
  if(!side.length)return [{s:'0'}];
  const out=[];
  side.forEach((q,i)=>{
    let neg,body;
    if(q.k==='n'){const a=Fr(Math.abs(q.v.n),q.v.d);neg=q.v.n<0;body=fi(a)?[{s:String(a.n)}]:[{n:String(a.n),d:String(a.d)}];}
    else if(q.k==='x'){const a=Fr(Math.abs(q.v.n),q.v.d);neg=q.v.n<0;body=fi(a)?[{s:(a.n===1?'':String(a.n))+'x'}]:[{n:String(a.n),d:String(a.d)},{s:'x'}];}
    else if(q.k==='p'){const am=Math.abs(q.m);neg=q.m<0;body=[{s:(am===1?'':am)+'('+linH(q.a,q.b)+')'}];}
    else{neg=q.s<0;body=[{n:linH(q.a,q.b),d:String(q.d)}];}
    out.push({s:i===0?(neg?MIN:''):' '+(neg?MIN:'+')+' '});
    body.forEach(e=>out.push(e));
  });
  return out.filter(e=>e.n!==undefined||e.s!=='');
}
/* expressió d'un plat en SVG pur (sense foreignObject): font monoespaiada i fraccions dibuixades */
function exprSVG(side){
  const els=layoutS(side),wOf=(e,f)=>e.n!==undefined?(Math.max(e.n.length,e.d.length)+0.8)*0.6*f:e.s.length*0.6*f;
  let fs=26,W=els.reduce((a,e)=>a+wOf(e,fs),0);
  if(W>204){fs=Math.max(11,fs*204/W);W=els.reduce((a,e)=>a+wOf(e,fs),0);}
  const y0=110;let x=-W/2,o='<g class="ex" font-size="'+fs.toFixed(1)+'">';
  els.forEach(e=>{
    const w=wOf(e,fs);
    if(e.n!==undefined){
      const c=(x+w/2).toFixed(1);
      o+='<text x="'+c+'" y="'+(y0-0.26*fs).toFixed(1)+'" text-anchor="middle">'+e.n+'</text>'+
         '<line x1="'+(x+0.1*fs).toFixed(1)+'" x2="'+(x+w-0.1*fs).toFixed(1)+'" y1="'+y0+'" y2="'+y0+'" stroke-width="'+(0.08*fs).toFixed(1)+'"/>'+
         '<text x="'+c+'" y="'+(y0+0.95*fs).toFixed(1)+'" text-anchor="middle">'+e.d+'</text>';
    }else o+='<text x="'+x.toFixed(1)+'" y="'+(y0+0.3*fs).toFixed(1)+'">'+e.s.replace(/ /g,'\u00a0')+'</text>';
    x+=w;
  });
  return o+'</g>';
}
function pan(x,y,side,w,ok){
  return '<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')"><line x1="0" y1="0" x2="-110" y2="150" class="rope"/><line x1="0" y1="0" x2="110" y2="150" class="rope"/>'+
    '<rect x="-112" y="72" width="224" height="76" rx="10" class="tag"/>'+exprSVG(side)+
    '<rect x="-118" y="150" width="236" height="12" rx="5" class="plate"/>'+
    '<text x="0" y="186" text-anchor="middle" class="wt'+(ok?'':' off')+'">'+tt('w_val',fstr(w))+'</text></g>';
}
function draw(){
  const cx=380,cy=80,arm=250,r=theta*Math.PI/180,co=Math.cos(r),si=Math.sin(r);
  const A=[cx-arm*co,cy-arm*si],B=[cx+arm*co,cy+arm*si],ok=bal(S);
  let s='<polygon points="'+(cx-12)+','+cy+' '+(cx+12)+','+cy+' '+(cx+34)+',318 '+(cx-34)+',318" class="stand"/>';
  s+='<rect x="'+(cx-150)+'" y="318" width="300" height="16" rx="6" class="stand"/>';
  s+=pan(A[0],A[1],S.L,sv(S.L,XS),ok)+pan(B[0],B[1],S.R,sv(S.R,XS),ok);
  s+='<line x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'" class="beam"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" class="pivot"/>';
  svg.innerHTML=s;
}
function animate(){
  cancelAnimationFrame(raf);
  if(REDUCE){theta=target;draw();return;}
  (function step(){
    theta+=(target-theta)*0.16;
    if(Math.abs(target-theta)<0.04){theta=target;draw();return;}
    draw();raf=requestAnimationFrame(step);
  })();
}
function render(){
  const ok=bal(S),solved=solvedVal(S);
  eqEl.innerHTML=eqH(S);eqEl.classList.toggle('off',!ok);
  origEl.innerHTML=t('orig')+' <span class="m">'+eqH(OR)+'</span>';
  let h;
  if(flash)h='<p class="bad">'+msgT(flash)+'</p>';
  else if(solved&&ok)h='<p class="ok">'+tt('solved',fstr(solved),fstr(sv(OR.L,solved)),fstr(sv(OR.R,solved)))+'</p>';
  else if(!ok)h='<p class="bad">'+t('off')+'</p>';
  else h=note?'<p class="step">'+msgT(note)+'</p>':'<p class="note">'+t('keep')+'</p>';
  msgEl.innerHTML=h;
  qd.innerHTML=hist.map((e,i)=>'<li class="'+(i===hist.length-1?'cur':'')+(bal(e.s)?'':' bad')+'"><span class="qe">'+eqH(e.s)+'</span><span class="ql">'+msgT(e.lbl)+(e.left?' '+t('lb_left'):'')+'</span></li>').join('');
  qd.scrollTop=qd.scrollHeight;
  pbtns.innerHTML=pidx(S).map(q=>{const r=termH(q.t);return '<button class="btn small" type="button" data-sd="'+q.sd+'" data-i="'+q.i+'">'+t('b_exp')+' <span class="m">'+(r.neg?MIN:'')+r.h+'</span></button>';}).join('');
  const nd=dens(S).length>0;
  $('#mulgo').disabled=$('#mulm').disabled=!nd;
  $('#redgo').disabled=!mReduce(S);
  $('#divgo').disabled=$('#divk').disabled=!isSimple(S);
  undoB.disabled=hist.length<2;
  demo.disabled=!!(solved&&ok);
  $$('#lvsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lv===level)));
  const w0=fnum(sv(S.L,XS)),w1=fnum(sv(S.R,XS)),sc=Math.max(Math.abs(w0),Math.abs(w1),1);
  let a=-13*clamp((w0-w1)/sc*3,-1,1);
  if(!ok&&Math.abs(a)<3)a=a<0?-3:3;
  target=ok?0:a;
  animate();
}
function push(s,lbl,left){hist.push({s:s,lbl:lbl,left:!!left});S=s;}
function act(op,left){
  const prev=S,r=applyOp(S,op,left);
  if(r.err){flash=r.err;note=null;render();return false;}
  const lf=!!left&&(op.op==='clear'||op.op==='add'||op.op==='div');
  push(r.s,lblOf(op),lf);
  note=explain(op,prev,lf);flash=null;render();return true;
}
function fail(k){flash={k:k};note=null;render();}
function setMode(m){mode=m;btnBoth.setAttribute('aria-pressed',String(m==='both'));btnLeft.setAttribute('aria-pressed',String(m==='left'));}
function setCase(o,xs,st){
  OR=o;XS=xs;S=st||o;
  hist=[{s:o,lbl:{k:'lb_init'}}];if(st)hist.push({s:st,lbl:{k:'lb_try'}});
  flash=note=null;theta=0;setMode('both');
  ['#mulm','#addn','#divk'].forEach(i=>{$(i).value='';});
  render();
}
function fresh(){const e=gen(level,OR?eqKey(OR):null);setCase(e.s,e.xs,null);}
/* controls */
demo.addEventListener('click',()=>{
  if(!bal(S)){fail('off_demo');return;}
  const g=suggest(S);if(g)act(g,false);
});
undoB.addEventListener('click',()=>{if(hist.length<2)return;hist.pop();S=hist[hist.length-1].s;flash=note=null;render();});
$('#new').addEventListener('click',fresh);
btnBoth.addEventListener('click',()=>setMode('both'));
btnLeft.addEventListener('click',()=>setMode('left'));
$$('#lvsw button').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.lv;fresh();}));
pbtns.addEventListener('click',e=>{
  const b=e.target.closest('button[data-sd]');if(!b)return;
  act({op:'exp',sd:b.dataset.sd,i:+b.dataset.i},false);
});
function goMul(){
  const M=parseNum($('#mulm').value);

$('#addgo').addEventListener('click',goAdd);

$('#redgo').addEventListener('click',()=>act({op:'red'},false));
[['#mulm',goMul],['#addn',goAdd],['#divk',goDiv]].forEach(p=>$(p[0]).addEventListener('keydown',e=>{if(e.key==='Enter')p[1]();}));
App.hooks.push(render);

 ],

 ],

  {id:'d2',f:[{l:'d2.l0'}],sim:()=>loadCase([Q(1,1,0,2),Q(1,1,0,3)],[N(25)]),ok:()=>({k:'d2_ok'}),chk:([x])=>x!==30?{k:'d2_n'}:null},
