<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isostasia · Arrels de muntanyes i rebot glacial</title>
<meta name="description" content="Isostasia: muntanyes amb arrels (model d'Airy) i rebot glacial amb un mantell viscós. Simulació interactiva amb test autocorregit.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
</style>
<!--@GC@-->
</head>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <!--@LVLSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<div class="row"><div class="seg" role="group"><button data-mode="airy" data-i18n="mode_airy"></button><button data-mode="ice" data-i18n="mode_ice"></button></div></div>
<div class="gridW">
<div><canvas id="iso"></canvas></div>
<div>
<div id="airyc">
<div class="ctrl"><label for="H"><span data-i18n="H"></span>: <b id="Hv"></b> km</label><input type="range" id="H" min="0" max="9" step="0.1" value="0"></div>
<div class="row"><button class="chip" id="pTibet" data-i18n="p_tibet"></button><button class="chip" id="pFlat" data-i18n="p_flat"></button><button class="btn" id="ero" data-i18n="ero"></button></div>
</div>
<div id="icec" hidden>
<div class="ctrl"><label for="I"><span data-i18n="I"></span>: <b id="Iv"></b> km</label><input type="range" id="I" min="0" max="4" step="0.1" value="0"></div>
<div class="row"><button class="btn primary" id="glac" data-i18n="glac"></button><button class="btn" id="melt" data-i18n="melt"></button></div>
</div>
<div data-lvl="adv">
<div class="ctrl"><label for="rc">ρ<sub>c</sub> (<span data-i18n="crust"></span>): <b id="rcv"></b> g/cm³</label><input type="range" id="rc" min="2.6" max="3.0" step="0.05" value="2.7"></div>
<div class="ctrl"><label for="rm">ρ<sub>m</sub> (<span data-i18n="mantle"></span>): <b id="rmv"></b> g/cm³</label><input type="range" id="rm" min="3.2" max="3.4" step="0.05" value="3.3"></div>
<div class="ctrl" id="tauc"><label for="tau">τ (<span data-i18n="tau"></span>): <b id="tauv"></b> ka</label><input type="range" id="tau" min="1" max="10" step="0.5" value="4"></div>
</div>
<div class="stats">
<div class="stat" data-m="airy"><span class="k" data-i18n="st_h"></span><span class="v" id="sH"></span></div>
<div class="stat" data-m="airy"><span class="k" data-i18n="st_moho"></span><span class="v" id="sM"></span></div>
<div class="stat" data-m="airy"><span class="k" data-i18n="st_root"></span><span class="v" id="sR"></span></div>
<div class="stat" data-m="ice"><span class="k" data-i18n="st_sink"></span><span class="v" id="sS"></span></div>
<div class="stat" data-m="ice"><span class="k" data-i18n="st_rate"></span><span class="v" id="sRate"></span></div>
<div class="stat" data-m="ice"><span class="k" data-i18n="st_time"></span><span class="v" id="sTime"></span></div>
<div class="stat" data-lvl="adv"><span class="k" data-i18n="st_dp"></span><span class="v" id="sDP"></span></div>
</div>
</div>
</div>
<div class="idea" data-lvl="basic"><span id="ideab"></span></div>
<div class="idea" data-lvl="adv"><div id="advb"></div><div id="advcalc" class="mono"></div></div>
<p class="note" data-i18n-html="note"></p>
</section>

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

/* ===== Isostasia: Airy (arrels) y rebote glaciar ===== */

const T0=35,D=120,RI=0.917,MPA=9.81;
let mode='airy',T=35,Ttar=35,h=0,I=0,Itar=0,tsim=0,rate=0,last=performance.now();
const cx=fitCanvas($('#iso'),700,600);
const rcI=$('#rc'),rmI=$('#rm'),tauI=$('#tau'),HI=$('#H'),II=$('#I');
const rc=()=>+rcI.value,rm=()=>+rmI.value;
const yv=e=>24+(28-e)*3.7;
const heqF=()=>((rm()-rc())*(T-T0)-RI*I)/rm();

function setTar(){Ttar=T0+(+HI.value)*rm()/(rm()-rc());}
function resetState(){T=T0;Ttar=T0;h=0;I=0;Itar=0;tsim=0;rate=0;HI.value=0;II.value=0;}
function updMode(){
  $$('[data-mode]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.dataset.mode===mode);});
  $('#airyc').hidden=mode!=='airy';$('#icec').hidden=mode!=='ice';
  $$('.stat[data-m]').forEach(e=>{e.hidden=e.dataset.m!==mode;});
  $('#tauc').hidden=mode!=='ice';
  $('#ideab').innerHTML=t(mode==='airy'?'idea_airy':'idea_ice');
  $('#advb').innerHTML=t(mode==='airy'?'adv_airy':'adv_ice');
  readouts();
}
function readouts(){
  $('#Hv').textContent=nf(+HI.value,1);$('#Iv').textContent=nf(+II.value,1);
  $('#rcv').textContent=nf(rc(),2);$('#rmv').textContent=nf(rm(),2);$('#tauv').textContent=nf(+tauI.value,1);
  const k=rc()/(rm()-rc());
  $('#advcalc').innerHTML=mode==='airy'?tt('advcalc_airy',nf(k,2),nf(+HI.value,1),nf(k*(+HI.value),1)):tt('advcalc_ice',nf(RI/rm(),3),nf(+II.value,1),nf(RI*(+II.value)/rm(),2));
}
$$('[data-mode]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>{mode=b.dataset.mode;resetState();updMode();};});
HI.oninput=()=>{setTar();readouts();};
II.oninput=()=>{Itar=+II.value;readouts();};
[rcI,rmI,tauI].forEach(e=>e.oninput=()=>{if(mode==='airy')setTar();readouts();});
$('#pTibet').onclick=()=>{HI.value=5;HI.oninput();};
$('#pFlat').onclick=()=>{HI.value=0;HI.oninput();};
$('#ero').onclick=()=>{const e=Math.min(1,T-T0);if(e<=0)return;T-=e;h-=e;Ttar=T;HI.value=Math.max(0,Math.round(heqF()*10)/10);readouts();};
$('#glac').onclick=()=>{II.value=3;II.oninput();};
$('#melt').onclick=()=>{II.value=0;II.oninput();};

function step(dt){
  const dT=Math.sign(Ttar-T)*Math.min(Math.abs(Ttar-T),25*dt);T+=dT;h+=dT;
  const dI=Math.sign(Itar-I)*Math.min(Math.abs(Itar-I),2.5*dt);I+=dI;
  const tau=mode==='ice'?+tauI.value:0.7;
  const heq=heqF(),dh=(heq-h)*(1-Math.exp(-dt/tau));
  h+=dh;rate=(heq-h)/tau;   /* km por ka (ice) */
  if(mode==='ice')tsim+=dt;
}
function colMass(Tt,hh,II){return rc()*Tt+RI*II+rm()*(hh-Tt+D);}
function block(x,w,top,bot,fill){
  cx.fillStyle=fill;cx.fillRect(x,yv(top),w,yv(bot)-yv(top));
  cx.strokeStyle='rgba(0,0,0,.45)';cx.lineWidth=1.5;cx.strokeRect(x,yv(top),w,yv(bot)-yv(top));
}
function draw(){
  const ink=css('--ink'),mut=css('--mut');
  cx.fillStyle=css('--cv');cx.fillRect(0,0,700,600);
  const zf=-T0*(rm()-rc())/rm();                      /* superficie libre del manto */
  cx.fillStyle='#f2b36a';cx.fillRect(0,yv(zf),700,600-yv(zf));
  cx.fillStyle='rgba(120,70,20,.75)';cx.font='bold 13px system-ui';cx.textAlign='center';cx.fillText(t('lbl_mantle'),350,yv(-95));
  /* líneas de referencia */
  cx.setLineDash([6,5]);cx.strokeStyle=mut;cx.lineWidth=1;
  [[0,t('lbl_sea')],[-D,t('lbl_comp')]].forEach(([e,lab])=>{cx.beginPath();cx.moveTo(0,yv(e));cx.lineTo(700,yv(e));cx.stroke();});
  cx.setLineDash([]);cx.textAlign='left';cx.fillStyle=mut;cx.font='12px system-ui';
  cx.fillText(t('lbl_sea'),268,yv(0)-4);cx.fillText(t('lbl_comp'),6,yv(-D)-4);
  /* regla de km */
  cx.textAlign='right';for(let e=-100;e<=20;e+=20){cx.fillText((e>0?'+':'')+e,696,yv(e)+4);}
  /* bloques */
  const xL=90,xR=400,w=160;
  block(xL,w,0,-T0,'#b08a62');
  const topA=h,botA=h-T;
  block(xR,w,topA,botA,'#b08a62');
  if(I>0.02){cx.fillStyle='#f4fbff';cx.fillRect(xR,yv(h+I),w,yv(h)-yv(h+I));cx.strokeStyle='#8ab';cx.lineWidth=1.5;cx.strokeRect(xR,yv(h+I),w,yv(h)-yv(h+I));
    cx.fillStyle='#456';cx.textAlign='center';cx.font='12px system-ui';if(yv(h)-yv(h+I)>16)cx.fillText(t('lbl_ice'),xR+w/2,yv(h+I/2)+4);}
  if(h>3.5&&I<0.02){cx.fillStyle='#fff';cx.fillRect(xR,yv(h),w,Math.min(6,yv(h-1.5)-yv(h)));}
  /* etiquetas */
  cx.fillStyle='#fff';cx.font='bold 13px system-ui';cx.textAlign='center';
  cx.fillText('ρ = '+nf(rc(),2),xL+w/2,yv(-T0/2)+4);cx.fillText('ρ = '+nf(rc(),2),xR+w/2,yv((topA+botA)/2)+4);
  cx.fillStyle=ink;cx.font='bold 14px system-ui';
  cx.fillText(t('lbl_ref'),xL+w/2,yv(0)-12-(0));cx.fillText(t('lbl_act'),xR+w/2,yv(Math.max(topA+I,0))-12);
  /* Moho del bloque activo */
  const moho=T-h;
  cx.textAlign='left';cx.font='12px system-ui';cx.fillStyle=ink;
  cx.fillText(tt('lbl_moho',nf(moho,1)),xR+w+8,yv(botA)+4);
  cx.fillText(tt('lbl_moho',nf(T0,1)),xL+w+8,yv(-T0)+4);
  cx.strokeStyle=ink;cx.lineWidth=1;cx.beginPath();cx.moveTo(xR+w,yv(botA));cx.lineTo(xR+w+6,yv(botA));cx.stroke();
  /* flujo del manto por diferencia de presión */
  const dm=colMass(T,h,I)-colMass(T0,0,0),dp=dm*MPA;
  const thick=Math.min(30,Math.abs(dm)*0.6);
  if(thick>1.2){
    const y=yv(-80),x1=330,x0=270,dirL=dm>0;
    cx.fillStyle='rgba(193,18,31,.8)';
    cx.beginPath();
    if(dirL){cx.moveTo(x1,y-thick/2);cx.lineTo(x0+14,y-thick/2);cx.lineTo(x0+14,y-thick);cx.lineTo(x0-6,y);cx.lineTo(x0+14,y+thick);cx.lineTo(x0+14,y+thick/2);cx.lineTo(x1,y+thick/2);}
    else{cx.moveTo(x0,y-thick/2);cx.lineTo(x1-14,y-thick/2);cx.lineTo(x1-14,y-thick);cx.lineTo(x1+6,y);cx.lineTo(x1-14,y+thick);cx.lineTo(x1-14,y+thick/2);cx.lineTo(x0,y+thick/2);}
    cx.closePath();cx.fill();
    cx.fillStyle='rgba(120,20,20,.9)';cx.font='11px system-ui';cx.textAlign='center';cx.fillText(t('lbl_flow'),300,y+thick+14);
  }
  cx.textAlign='left';
  /* lecturas */
  if(mode==='airy'){
    $('#sH').textContent=nf(h,1)+' km';$('#sM').textContent=nf(moho,1)+' km';$('#sR').textContent=nf(Math.max(moho-T0,0),1)+' km';
  }else{
    const sink=Math.max(-h,0);
    $('#sS').textContent=nf(sink,2)+' km';
    $('#sRate').textContent=(rate>=0?'↑ ':'↓ ')+nf(Math.abs(rate)*1000,1)+' mm/'+(LANG==='es'?'año':'any');
    $('#sTime').textContent=nf(tsim,1)+' ka';
  }
  $('#sDP').textContent=nf(dp,0)+' MPa';
}
function loop(now){const dt=Math.min((now-last)/1000,0.1);last=now;step(dt);draw();requestAnimationFrame(loop);}
App.hooks.push(()=>{updMode();});
requestAnimationFrame(loop);
