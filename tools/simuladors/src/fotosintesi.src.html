/*@STEPS_JS@*/
const STEPS=[{"id":"f0","preset":{"light":70,"mode":"plant","showE":false,"hl":null}},{"id":"f1","ask":{"n":3,"ok":1},"preset":{"light":70,"mode":"plant","showE":false,"hl":"chloro"}},{"id":"f2","ask":{"n":3,"ok":0},"preset":{"light":70,"mode":"plant","showE":false,"hl":"mito"}},{"id":"f3","think":true,"preset":{"light":70,"mode":"plant","showE":false,"hl":"matter"}},{"id":"f4","ask":{"n":3,"ok":2},"preset":{"light":70,"mode":"plant","showE":true,"hl":null}},{"id":"f5","ask":{"n":3,"ok":2},"preset":{"light":0,"mode":"plant","showE":false,"hl":null}},{"id":"f6","think":true,"preset":{"light":100,"mode":"plant","showE":false,"hl":null}},{"id":"f7","ask":{"n":3,"ok":2},"preset":{"light":0,"mode":"animal","showE":true,"hl":null}}];
const QDATA=[{"id":"fq1","lvl":"all","type":"mc","n":4,"ans":2},{"id":"fq2","lvl":"all","type":"mc","n":4,"ans":1},{"id":"fq3","lvl":"all","type":"mc","n":4,"ans":0},{"id":"fq4","lvl":"all","type":"mc","n":4,"ans":0},{"id":"fq5","lvl":"all","type":"mc","n":4,"ans":1},{"id":"fq6","lvl":"all","type":"mc","n":4,"ans":1}];
const FW=800,FH=460;
const FS={light:70,mode:'plant',auto:false,showE:false,hl:null,G:50,tday:10,P:0,R:0};
let fcv,fch,fsl,parts=[],acc={},hist=[],lastTs=0,histT=0,roT=0;
const QF=1.2;
const PATH={
 glu:[[300,175],[500,175]],o2:[[300,208],[500,208]],co2:[[500,258],[300,258]],h2o:[[500,290],[300,290]],
 co2in:[[4,205],[120,230]],h2oin:[[4,275],[120,262]],o2out:[[190,125],[190,6]],o2in:[[710,8],[650,150]],co2out:[[640,322],[745,445]],
 photon:[[84,76],[165,185]],atp:[[580,318],[575,452]],heat:[[700,250],[790,215]],
 toPool:[[255,335],[385,392]],poolMito:[[435,395],[525,312]],food:[[4,418],[350,400]]
};
const KIND={
 glu:{c:'#f2b705',s:'hex',sp:70},o2:{c:'#e8606a',s:'dot',sp:70},co2:{c:'#6b7280',s:'dot',sp:70},h2o:{c:'#3b9ae1',s:'dot',sp:70},
 co2in:{c:'#6b7280',s:'dot',sp:60},h2oin:{c:'#3b9ae1',s:'dot',sp:60},o2out:{c:'#e8606a',s:'dot',sp:60},o2in:{c:'#e8606a',s:'dot',sp:60},co2out:{c:'#6b7280',s:'dot',sp:60},
 photon:{c:'#ffc400',s:'dia',sp:150},atp:{c:'#2fb344',s:'atp',sp:55},heat:{c:'#ff7a2f',s:'heat',sp:40},
 toPool:{c:'#f2b705',s:'hex',sp:70},poolMito:{c:'#f2b705',s:'hex',sp:70},food:{c:'#f2b705',s:'hex',sp:90}
};
const MATTER={glu:1,o2:1,co2:1,h2o:1,co2in:1,h2oin:1,o2out:1,o2in:1,co2out:1,toPool:1,poolMito:1,food:1};
function plen(p){let l=0;for(let i=1;i<p.length;i++)l+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return l;}
function ppos(p,u){
  for(let i=1;i<p.length;i++){
    const sl=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
    if(u<=sl||i===p.length-1){const f=Math.min(1,u/sl);return {x:p[i-1][0]+(p[i][0]-p[i-1][0])*f,y:p[i-1][1]+(p[i][1]-p[i-1][1])*f,nx:-(p[i][1]-p[i-1][1])/sl,ny:(p[i][0]-p[i-1][0])/sl};}
    u-=sl;
  }
}
function spawn(k){parts.push({k:k,u:0,len:plen(PATH[k]),off:(Math.random()-0.5)*14,ph:Math.random()*6});}
function rate(k,r,dt){
  if(r<=0)return;
  acc[k]=(acc[k]||0)+r*dt;
  while(acc[k]>=1){acc[k]-=1;if(parts.length<420)spawn(k);}
}
function updateF(dt){
  if(FS.auto){
    FS.tday+=dt;
    FS.light=Math.max(0,Math.sin(2*Math.PI*FS.tday/40))*100;
    fsl.set(FS.light);
  }
  const plant=FS.mode==='plant';
  FS.P=plant?FS.light/100:0;
  const F=plant?0:0.45;
  FS.R=0.5*FS.G/(FS.G+15);
  FS.G+=3*(FS.P+F-FS.R)*dt;
  FS.G=Math.max(0,Math.min(100,FS.G));
  const P=FS.P,R=FS.R,ri=plant?Math.min(P,R):0;
  rate('glu',QF*ri,dt);rate('o2',6*QF*ri,dt);rate('co2',6*QF*ri,dt);rate('h2o',6*QF*ri,dt);
  if(plant){
    rate('photon',14*FS.light/100,dt);
    if(P>R){const n=P-R;rate('co2in',6*QF*n,dt);rate('h2oin',6*QF*n,dt);rate('o2out',6*QF*n,dt);rate('toPool',QF*n,dt);}
    else{const d=R-P;rate('o2in',6*QF*d,dt);rate('co2out',6*QF*d,dt);rate('poolMito',QF*d,dt);}
  }else{
    rate('food',QF*F,dt);rate('poolMito',QF*R,dt);rate('o2in',6*QF*R,dt);rate('co2out',6*QF*R,dt);
  }
  rate('atp',6*QF*R,dt);rate('heat',4*QF*R,dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.u+=KIND[p.k].sp*dt;if(p.u>=p.len)parts.splice(i,1);}
  histT+=dt;
  if(histT>0.25){histT=0;hist.push([FS.P,FS.R,FS.G/100]);if(hist.length>160)hist.shift();}
}
const mixc=(a,b,f)=>Math.round(a+(b-a)*f);
const pick=(dk,a,b)=>dk?b:a;
function drawHex(c,x,y,r){c.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;c.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}c.closePath();}
function drawParts(c){
  for(let i=0;i<parts.length;i++){
    const p=parts[i],k=KIND[p.k],q=ppos(PATH[p.k],p.u);
    const x=q.x+q.nx*p.off,y=q.y+q.ny*p.off;
    const al=FS.showE?(MATTER[p.k]?0.22:1):1;
    c.globalAlpha=al;
    if(k.s==='dot'){c.fillStyle=k.c;c.beginPath();c.arc(x,y,4,0,6.2832);c.fill();}
    else if(k.s==='hex'){c.fillStyle=k.c;drawHex(c,x,y,6.5);c.fill();c.strokeStyle='#a87400';c.lineWidth=1;c.stroke();}
    else if(k.s==='dia'){c.fillStyle=k.c;c.shadowColor='#ffc400';c.shadowBlur=8;c.beginPath();c.moveTo(x,y-6);c.lineTo(x+4,y);c.lineTo(x,y+6);c.lineTo(x-4,y);c.closePath();c.fill();c.shadowBlur=0;}
    else if(k.s==='atp'){c.fillStyle=k.c;c.fillRect(x-11,y-6,22,12);c.fillStyle='#fff';c.font='700 9px system-ui,sans-serif';c.textAlign='center';c.fillText('ATP',x,y+3);}
    else if(k.s==='heat'){c.globalAlpha=al*(1-p.u/p.len);c.fillStyle=k.c;c.beginPath();c.arc(x,y+Math.sin(p.ph+p.u/12)*5,3,0,6.2832);c.fill();}
  }
  c.globalAlpha=1;
}
function drawChloro(c,col){
  const plant=FS.mode==='plant';
  c.save();
  if(!plant){c.globalAlpha=0.5;c.setLineDash([8,6]);}
  c.beginPath();c.ellipse(190,235,140,120,0,0,6.2832);
  c.fillStyle=plant?'#d3ecc9':'#eceff3';c.fill();
  c.lineWidth=(FS.hl==='chloro')?6:3;c.strokeStyle=plant?'#3f9a43':'#9aa3b2';c.stroke();
  c.setLineDash([]);
  if(plant){
    [[140,215],[225,185],[245,270],[155,285]].forEach(p=>{
      for(let i=0;i<4;i++){c.fillStyle='#2f8a3a';c.strokeStyle='#1d5f27';c.lineWidth=1;c.beginPath();c.rect(p[0]-20,p[1]-16+i*9,40,7);c.fill();c.stroke();}
    });
  }
  c.restore();
  c.fillStyle=plant?pick(col.dark,'#1d5f27','#9bdba0'):col.muted;c.font='700 15px system-ui,sans-serif';c.textAlign='center';
  c.fillText(plant?t('cv_ch'):t('cv_noch'),190,363);
  c.font='13px system-ui,sans-serif';
  if(plant)c.fillText(t('cv_chp'),190,382);
}
function drawMito(c,col){
  c.beginPath();c.ellipse(610,235,140,105,0,0,6.2832);
  c.fillStyle='#fbdcc4';c.fill();
  c.lineWidth=(FS.hl==='mito')?6:3;c.strokeStyle='#d9722b';c.stroke();
  c.save();c.beginPath();c.ellipse(610,235,128,93,0,0,6.2832);c.clip();
  c.strokeStyle='#e89a63';c.lineWidth=9;c.lineCap='round';
  for(let i=0;i<6;i++){const x=520+i*34;c.beginPath();if(i%2===0){c.moveTo(x,140);c.lineTo(x,215);}else{c.moveTo(x,330);c.lineTo(x,255);}c.stroke();}
  c.restore();
  c.lineCap='butt';
  c.fillStyle=pick(col.dark,'#8d4310','#ffb98a');c.font='700 15px system-ui,sans-serif';c.textAlign='center';
  c.fillText(t('cv_mi'),610,363);
  c.font='13px system-ui,sans-serif';
  c.fillText(t('cv_mip'),610,382);
}
function drawTank(c,col){
  const x=345,y=345,w=90,h=95;
  c.fillStyle=col.panel;c.fillRect(x,y,w,h);
  const gh=h*FS.G/100;
  c.fillStyle='#f6c944';c.fillRect(x,y+h-gh,w,gh);
  c.strokeStyle=pick(col.dark,'#8a6a10','#d9b04a');c.lineWidth=3;c.strokeRect(x,y,w,h);
  c.fillStyle=pick(col.dark,'#6a5008','#f2d27a');c.font='600 11px system-ui,sans-serif';c.textAlign='center';
  c.fillText(t('cv_tank'),x+w/2,y-5);
}
function banner(c,text,color){
  c.font='700 13px system-ui,sans-serif';c.textAlign='center';
  const w=c.measureText(text).width+24;
  c.fillStyle=color;c.globalAlpha=0.92;c.fillRect(400-w/2,9,w,24);c.globalAlpha=1;
  c.fillStyle='#fff';c.fillText(text,400,26);
}
function drawF(){
  const col=C(),dk=col.dark,c=fcv.ctx,ratio=fcv.cv.width/FW;
  c.setTransform(ratio,0,0,ratio,0,0);
  const f=FS.light/100;
  c.fillStyle=dk?'rgb('+mixc(12,34,f)+','+mixc(18,52,f)+','+mixc(34,84,f)+')':'rgb('+mixc(200,244,f)+','+mixc(210,249,f)+','+mixc(232,255,f)+')';
  c.fillRect(0,0,FW,FH);
  const plant=FS.mode==='plant';
  c.globalAlpha=plant?1:0.25;
  if(FS.light>5){
    c.fillStyle='#ffd23f';c.beginPath();c.arc(52,46,22*(0.6+0.4*f),0,6.2832);c.fill();
    c.strokeStyle='#ffc400';c.lineWidth=3;
    for(let i=0;i<10;i++){const a=i*0.628;c.beginPath();c.moveTo(52+Math.cos(a)*29,46+Math.sin(a)*29);c.lineTo(52+Math.cos(a)*(29+8*f),46+Math.sin(a)*(29+8*f));c.stroke();}
  }else{c.fillStyle='#f4f1c9';c.beginPath();c.arc(52,46,18,0,6.2832);c.fill();c.fillStyle=dk?'#22304f':'#c8d2e8';c.beginPath();c.arc(60,42,16,0,6.2832);c.fill();}
  c.globalAlpha=1;
  drawChloro(c,col);drawMito(c,col);drawTank(c,col);
  c.font='600 11px system-ui,sans-serif';c.textAlign='center';
  c.globalAlpha=FS.showE?0.35:1;
  c.fillStyle=pick(dk,'#a87400','#f2c14e');c.fillText('C₆H₁₂O₆',400,165);
  c.fillStyle=pick(dk,'#c4414b','#ff8a92');c.fillText('O₂',400,199);
  c.fillStyle=pick(dk,'#5b6370','#aab3c2');c.fillText('CO₂',400,274);
  c.fillStyle=pick(dk,'#2f78b8','#6fb6f0');c.fillText('H₂O',400,306);
  c.globalAlpha=1;
  if(FS.showE){
    c.fillStyle='#2fb344';c.font='700 12px system-ui,sans-serif';c.textAlign='left';
    c.fillText(t('cv_atp'),604,450);
    c.fillStyle=pick(dk,'#e0661f','#ff9a5a');c.textAlign='center';c.fillText(t('cv_heat'),768,196);
  }
  drawParts(c);
  if(FS.showE)banner(c,t('ban_e'),'#c2570f');
  else if(FS.hl==='matter')banner(c,t('ban_m'),'#2f6fed');
  /* gràfica */
  const k=fch.ctx,cw=fch.cv.width/FW;
  k.setTransform(cw,0,0,cw,0,0);
  k.clearRect(0,0,FW,90);k.fillStyle=col.stage;k.fillRect(0,0,FW,90);
  k.strokeStyle=col.line;k.lineWidth=1;
  for(let g=0;g<=4;g++){k.beginPath();k.moveTo(0,10+g*17.5);k.lineTo(FW,10+g*17.5);k.stroke();}
  const line=(idx,color)=>{k.strokeStyle=color;k.lineWidth=2.4;k.beginPath();
    for(let i=0;i<hist.length;i++){const x=i*(FW/160),y=80-hist[i][idx]*68;if(i===0)k.moveTo(x,y);else k.lineTo(x,y);}
    k.stroke();};
  line(0,'#2f9a45');line(1,'#e0661f');line(2,'#d4a30f');
  k.font='600 11px system-ui,sans-serif';k.textAlign='left';
  k.fillStyle='#2f9a45';k.fillText(t('g_ph'),8,14);
  k.fillStyle='#e0661f';k.fillText(t('g_re'),100,14);
  k.fillStyle='#d4a30f';k.fillText(t('g_gl'),190,14);
}
function paintROf(){
  const ro=$('#fro');if(!ro)return;
  let msg;
  if(FS.mode==='plant'){const net=FS.P-FS.R;msg=t(net>0.02?'msg_plus':(net<-0.02?'msg_minus':'msg_zero'));}
  else msg=t('msg_animal');
  ro.innerHTML='<div><b>'+t('r_light')+':</b> '+Math.round(FS.light)+' % · <b>'+t('r_ph')+':</b> '+FS.P.toFixed(2)+' · <b>'+t('r_re')+':</b> '+FS.R.toFixed(2)+' · <b>'+t('r_res')+':</b> '+Math.round(FS.G)+' %</div><div>'+msg+'</div>';
}
function paintCtlF(){
  $$('#fmode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===FS.mode)));
  $('#fauto').setAttribute('aria-pressed',String(FS.auto));
  $('#fen').setAttribute('aria-pressed',String(FS.showE));
  fsl.disable(FS.mode!=='plant');
  fsl.refresh();
}
function loopF(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016);lastTs=ts;
  updateF(dt);drawF();
  roT+=dt;if(roT>0.25){roT=0;paintROf();if(FS.auto)paintCtlF();}
  requestAnimationFrame(loopF);
}
function initF(){
  fcv=makeCanvas($('#fc'),FW,FH);
  fch=makeCanvas($('#fch'),FW,90);
  fsl=slider($('#fcl'),{id:'fl',key:'c_light',min:0,max:100,step:1,val:70,fmtv:v=>Math.round(v)+' %',on:v=>{FS.light=v;FS.auto=false;paintCtlF();}});
  $('#fcl').insertBefore(fsl.el,$('#fcl').firstChild);
  $$('#fmode button').forEach(b=>b.addEventListener('click',()=>{FS.mode=b.dataset.mode;paintCtlF();}));
  $('#fauto').addEventListener('click',()=>{FS.auto=!FS.auto;if(FS.auto)FS.tday=Math.asin(Math.min(1,Math.max(0,FS.light/100)))*40/(2*Math.PI);paintCtlF();});
  $('#fen').addEventListener('click',()=>{FS.showE=!FS.showE;paintCtlF();});
  requestAnimationFrame(loopF);
}
function applyPresetF(p){
  FS.light=p.light;FS.mode=p.mode;FS.showE=p.showE;FS.hl=p.hl;FS.auto=false;
  fsl.set(p.light);paintCtlF();
}
initQuiz(QDATA);
initLang();initF();applyLang();
document.addEventListener('langchange',()=>{paintCtlF();paintROf();});
stepsInit(STEPS,(i)=>{applyPresetF(STEPS[i].preset);});
</script>
