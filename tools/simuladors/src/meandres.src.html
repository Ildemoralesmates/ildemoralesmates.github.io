/* ===== Meandres: simulació ===== */
//SIM-START
const W=1000,H=560,DS=4,RW=11,KSIG=6.3;
let rngS=1;
function rnd(){rngS|=0;rngS=rngS+0x6D2B79F5|0;let q=Math.imul(rngS^rngS>>>15,1|rngS);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}
let pts=[],lakes=[],steps=0,cuts=0,cutSteps=[];
const KERN=(()=>{const r=Math.ceil(3*KSIG);const k=[];let s=0;for(let i=-r;i<=r;i++){const v=Math.exp(-i*i/(2*KSIG*KSIG));k.push(v);s+=v}return k.map(v=>v/s)})();
function initSim(seed){
  rngS=seed;lakes=[];steps=0;cuts=0;cutSteps=[];
  const comps=[];for(let c=0;c<6;c++)comps.push({lam:90+rnd()*300,amp:3+rnd()*7,ph:rnd()*6.283});
  pts=[];
  for(let x=0;x<=W;x+=DS){let y=H/2;for(const c of comps)y+=c.amp*Math.sin(2*Math.PI*x/c.lam+c.ph);pts.push({x,y})}
}
function resample(){
  const out=[{x:pts[0].x,y:pts[0].y}];
  let prev=pts[0],need=DS;
  for(let i=1;i<pts.length;i++){
    let a=prev;const b=pts[i];
    let d=Math.hypot(b.x-a.x,b.y-a.y);
    while(d>=need){
      const f=need/d;const nx=a.x+(b.x-a.x)*f,ny=a.y+(b.y-a.y)*f;
      out.push({x:nx,y:ny});a={x:nx,y:ny};d=Math.hypot(b.x-a.x,b.y-a.y);need=DS;
    }
    need-=d;prev=b;
  }
  const last=pts[pts.length-1],lo=out[out.length-1];
  if(Math.hypot(last.x-lo.x,last.y-lo.y)>DS*0.5)out.push({x:last.x,y:last.y});else out[out.length-1]={x:last.x,y:last.y};
  pts=out;
}
function smoothCurv(){
  const n=pts.length,k=new Float64Array(n);
  for(let i=1;i<n-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const v1x=b.x-a.x,v1y=b.y-a.y,v2x=c.x-b.x,v2y=c.y-b.y;
    const cross=v1x*v2y-v1y*v2x,dot=v1x*v2x+v1y*v2y;
    k[i]=Math.atan2(cross,dot)/((Math.hypot(v1x,v1y)+Math.hypot(v2x,v2y))/2);
  }
  const R=(KERN.length-1)/2,ks=new Float64Array(n);
  for(let i=0;i<n;i++){let s=0;for(let j=-R;j<=R;j++){let idx=i+j;if(idx<0)idx=0;if(idx>=n)idx=n-1;s+=KERN[j+R]*k[idx]}ks[i]=s}
  return ks;
}
function stepSim(rate){
  const n=pts.length,ks=smoothCurv(),SH=8;
  const dx=new Float64Array(n),dy=new Float64Array(n);
  for(let i=1;i<n-1;i++){
    const tx=pts[i+1].x-pts[i-1].x,ty=pts[i+1].y-pts[i-1].y,l=Math.hypot(tx,ty)||1;
    const nx=-ty/l,ny=tx/l;
    const ke=0.55*ks[i]+0.45*ks[Math.max(0,i-SH)];
    const f=Math.min(1,i/20,(n-1-i)/20);
    const e=Math.min(pts[i].x,W-pts[i].x,pts[i].y,H-pts[i].y);
    const fe=Math.max(0,Math.min(1,(e-8)/50));
    let m=-rate*ke*f*fe;if(m>1.2)m=1.2;if(m<-1.2)m=-1.2;
    dx[i]=nx*m;dy[i]=ny*m;
  }
  for(let i=1;i<n-1;i++){pts[i].x+=dx[i];pts[i].y+=dy[i]}
  steps++;
  resample();
  if(steps%3===0)detectCut();
}
function detectCut(){
  const n=pts.length,TH=RW*1.25,MINSEP=Math.round(170/DS);
  let best=null,bd=1e9;
  for(let i=0;i<n-MINSEP;i++){
    const a=pts[i];
    for(let j=i+MINSEP;j<n;j++){
      const b=pts[j],ddx=a.x-b.x;if(ddx>TH||ddx<-TH)continue;
      const ddy=a.y-b.y;if(ddy>TH||ddy<-TH)continue;
      const d=ddx*ddx+ddy*ddy;if(d<TH*TH&&d<bd){bd=d;best=[i,j]}
    }
  }
  if(!best)return;
  const [i,j]=best;
  lakes.push({poly:pts.slice(i,j+1).map(p=>({x:p.x,y:p.y})),born:steps});
  cuts++;cutSteps.push(steps);
  pts=pts.slice(0,i+1).concat(pts.slice(j));
  resample();
  const lo=Math.max(2,i-10),hi=Math.min(pts.length-3,i+10);
  for(let it=0;it<25;it++)for(let q=lo;q<=hi;q++){
    pts[q].x=0.5*pts[q].x+0.25*(pts[q-1].x+pts[q+1].x);
    pts[q].y=0.5*pts[q].y+0.25*(pts[q-1].y+pts[q+1].y);
  }
}
function riverLen(){let s=0;for(let i=1;i<pts.length;i++)s+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return s}
function sinuosity(){const a=pts[0],b=pts[pts.length-1];return riverLen()/Math.hypot(b.x-a.x,b.y-a.y)}
//SIM-END

/* ===== dibuix ===== */
const ctx=fitCanvas($('#cv'),W,H), cx2=fitCanvas($('#ch'),1000,150);
const hist=document.createElement('canvas');hist.width=W*2;hist.height=H*2;const hx=hist.getContext('2d');hx.scale(2,2);
let running=false,ff=false,ffC=0,ffS=0,dashT=0,hs=[],maxSin=1.6;
function resetHist(){
  const g=hx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c5dca4');g.addColorStop(1,'#b7d393');
  hx.fillStyle=g;hx.fillRect(0,0,W,H);
}
function path(c,a){c.beginPath();c.moveTo(a[0].x,a[0].y);for(let i=1;i<a.length;i++)c.lineTo(a[i].x,a[i].y)}
function mix(c1,c2,f){return 'rgb('+c1.map((v,i)=>Math.round(v+(c2[i]-v)*f)).join(',')+')'}
function drawMain(){
  ctx.drawImage(hist,0,0,W,H);
  ctx.lineJoin='round';ctx.lineCap='round';
  for(const lk of lakes){
    const age=Math.min(1,(steps-lk.born)/5000);
    path(ctx,lk.poly);
    ctx.strokeStyle=mix([60,130,190],[110,140,80],age);ctx.lineWidth=(RW+1)*(1-0.6*age);ctx.stroke();
  }
  path(ctx,pts);ctx.strokeStyle='#2c6a9a';ctx.lineWidth=RW+3;ctx.stroke();
  ctx.strokeStyle='#4aa3e0';ctx.lineWidth=RW;ctx.stroke();
  ctx.setLineDash([4,16]);ctx.lineDashOffset=-dashT;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
  if($('#pr').checked)drawProc();
  ctx.fillStyle='#1f2933';ctx.font='15px system-ui';ctx.textAlign='left';ctx.fillText(t('flow'),12,24);
}
function drawProc(){
  const ks=smoothCurv(),n=pts.length;let last=-999,cnt=0;
  for(let i=15;i<n-15&&cnt<8;i++){
    const v=Math.abs(ks[i]);if(v<0.008)continue;
    let mx=true;for(let j=-15;j<=15;j++){if(Math.abs(ks[i+j])>v){mx=false;break}}
    if(!mx||i-last<40)continue;
    last=i;cnt++;
    const tx=pts[i+1].x-pts[i-1].x,ty=pts[i+1].y-pts[i-1].y,l=Math.hypot(tx,ty)||1;
    const nx=-ty/l,ny=tx/l,s=ks[i]>0?1:-1,ox=-s*nx,oy=-s*ny,p=pts[i];
    const x1=p.x+ox*(RW/2+3),y1=p.y+oy*(RW/2+3),x2=p.x+ox*(RW/2+24),y2=p.y+oy*(RW/2+24);
    ctx.strokeStyle='#c0392b';ctx.fillStyle='#c0392b';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.beginPath();ctx.arc(x2,y2,4,0,6.283);ctx.fill();
    ctx.font='bold 13px system-ui';ctx.fillText('E',x2+ox*8-4,y2+oy*8+5);
    ctx.fillStyle='#e08a1e';
    for(let q=0;q<4;q++){const a=(q-1.5)*0.7;const cx=p.x-ox*(RW/2+8+(q%2)*5)-oy*a*7,cy=p.y-oy*(RW/2+8+(q%2)*5)+ox*a*7;ctx.beginPath();ctx.arc(cx,cy,3,0,6.283);ctx.fill()}
    ctx.font='bold 13px system-ui';ctx.fillText('S',p.x-ox*(RW/2+27)-4,p.y-oy*(RW/2+27)+5);
  }
}
function drawChart(){
  const g=cx2,w=1000,h=150,pad=40;
  g.fillStyle=css('--stage');g.fillRect(0,0,w,h);
  const maxT=Math.max(steps,2000),X=s=>pad+(w-pad-14)*s/maxT,Y=v=>h-26-(h-46)*(v-1)/(maxSin-1);
  g.strokeStyle=css('--line');g.lineWidth=1;g.fillStyle=css('--muted');g.font='12px system-ui';g.textAlign='left';
  g.beginPath();g.moveTo(pad,h-26);g.lineTo(w-8,h-26);g.moveTo(pad,10);g.lineTo(pad,h-26);g.stroke();
  g.fillText('1',pad-14,h-22);g.fillText(nf(maxSin,1),pad-32,20);
  g.fillText(t('ch_sin'),pad+8,16);g.textAlign='right';g.fillText(nf(maxT*0.25,0)+' '+t('unit'),w-12,h-8);g.textAlign='left';
  g.strokeStyle=css('--pb');g.globalAlpha=.7;
  for(const s of cutSteps){g.beginPath();g.moveTo(X(s),10);g.lineTo(X(s),h-26);g.stroke()}
  g.globalAlpha=1;
  if(hs.length>1){g.strokeStyle=css('--pa');g.lineWidth=2;g.beginPath();hs.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
}
function updStats(){
  $('#stT').textContent=nf(steps*0.25,0)+' '+t('unit');
  $('#stS').textContent=nf(sinuosity(),2);
  $('#stC').textContent=cuts;
  $('#spv').textContent=$('#sp').value+'×';
  $('#erv').textContent=nf(+$('#er').value,1)+'×';
}
function setPlayLabel(){const b=$('#bPlay');b.dataset.i18n=running?'pause':'play';b.textContent=t(b.dataset.i18n)}
function record(){const s=sinuosity();if(s>maxSin)maxSin=s*1.05;hs.push([steps,s])}
function drawAll(){drawMain();drawChart();updStats();setPlayLabel()}
function frame(){
  const rate=1.2*parseFloat($('#er').value);
  if(ff){
    const t0=performance.now();
    while(performance.now()-t0<14){stepSim(rate);if(steps%10===0)record();if(cuts>ffC||steps-ffS>40000){ff=false;break}}
    trail();
  }else if(running){
    const sp=parseInt($('#sp').value);
    for(let k=0;k<sp;k++){stepSim(rate);if(steps%10===0)record()}
    trail();
  }
  if(running||ff)drawAll();
  requestAnimationFrame(frame);
}
function trail(){dashT+=1.5;hx.strokeStyle='rgba(205,170,100,.05)';hx.lineWidth=RW+2;hx.lineJoin='round';path(hx,pts);hx.stroke()}
function newRiver(){running=false;ff=false;hs=[];maxSin=1.6;initSim((Math.random()*1e9)|0);resetHist();record();drawAll()}
$('#bPlay').onclick=()=>{running=!running;ff=false;drawAll()};
$('#bFF').onclick=()=>{ff=true;ffC=cuts;ffS=steps;running=false;setPlayLabel()};
$('#bReset').onclick=newRiver;
$('#pr').onchange=drawAll;
$('#sp').oninput=updStats;$('#er').oninput=updStats;
document.addEventListener('langchange',drawAll);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawAll);

initQuiz(QDATA);
newRiver();
initLang();applyLang();
requestAnimationFrame(frame);
</script>
