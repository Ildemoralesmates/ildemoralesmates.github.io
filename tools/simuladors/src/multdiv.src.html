"x0.title":"Una parte de una parte",
"x0.text":"<p>Multiplicar fracciones es <b>tomar una parte de una parte</b>: 2/3 · 3/4 quiere decir «los 2/3 de 3/4». Empezamos por el cuadrado unidad: lo cortamos en franjas <b>verticales</b> según la <b>1.ª fracción</b> y pintamos el numerador.</p>",
"x0.q":"¿Qué quiere decir 2/3 · 3/4?",
"x0.o0":"Los 2/3 de 3/4: una parte de una parte","x0.o1":"2/3 más 3/4","x0.o2":"Repartir 3/4 entre 2/3",
"x0.why":"Multiplicar por una fracción es tomar esa fracción de algo: los 2/3 de 3/4, igual que «la mitad de 3/4».",
"x1.title":"La otra fracción, en horizontal",
"x1.text":"<p>Ahora cortamos el mismo cuadrado en franjas <b>horizontales</b> según la <b>2.ª fracción</b> y pintamos las suyas. Las dos pinturas se superponen.</p>",
"x1.q":"El producto de las dos fracciones es la zona…",
"x1.o0":"pintada de un color o del otro","x1.o1":"pintada de los dos colores a la vez","x1.o2":"que ha quedado sin pintar",
"x1.why":"Tomar una parte de una parte es quedarse con lo que está a la vez dentro de la primera y dentro de la segunda: la zona donde se cruzan.",
"x2.title":"Donde se cruzan",
"x2.text":"<p>Las franjas verticales y las horizontales cortan el cuadrado en una <b>cuadrícula</b>. Contamos: cuántas celdas hay en total y cuántas están pintadas de los dos colores.</p>",
"x2.q":"¿En cuántas celdas iguales ha quedado cortado el cuadrado?",
"x2.o0":"La suma de los denominadores","x2.o1":"El producto de los denominadores","x2.o2":"El denominador mayor",
"x2.why":"Hay tantas columnas como el primer denominador y tantas filas como el segundo: las celdas son el producto.",
"x3.title":"La regla, ahora con sentido",
"x3.text":"<p>Las celdas totales son el producto de los denominadores y las pintadas de los dos colores, el producto de los numeradores: <b>numerador por numerador y denominador por denominador</b>. Si se puede, simplificamos.</p>",
"x3.tq":"Para multiplicar fracciones no hace falta buscar denominador común. Para sumar sí. ¿Por qué?",
"x3.th":"Al sumar contamos trozos juntos, y solo se pueden contar si son iguales. Al multiplicar tomamos una parte de una parte: las franjas de una fracción cortan las de la otra, sea cual sea su tamaño.",
"x4.title":"¿Más pequeño o más grande?",
"x4.text":"<p>Debajo, compara la <b>1.ª fracción</b> con el <b>producto</b>. Multiplicar por una fracción <b>menor que 1</b> hace el resultado más pequeño (tomas solo una parte); multiplicar por una fracción <b>mayor que 1</b> lo hace más grande.</p>",
"x4.q":"Multiplicar por una fracción menor que 1 hace el resultado…",
"x4.o0":"más grande, como siempre que multiplicas","x4.o1":"más pequeño","x4.o2":"igual",
"x4.why":"Tomar los 2/3 de algo es quedarse con menos de lo que tenías. Multiplicar «hace más grande» solo cuando multiplicas por más de 1.",
"v0.title":"¿Cuántas veces cabe?",
"v0.text":"<p>Dividir <b>3/4 : 1/8</b> es preguntar <b>cuántas veces cabe 1/8 dentro de 3/4</b>, igual que 12 : 3 pregunta cuántas veces cabe el 3 en el 12. Arriba, el dividendo; abajo, el trozo que queremos encajar.</p>",
"v0.q":"¿Qué quiere decir 3/4 : 1/8?",
"v0.o0":"Cuántas veces cabe 1/8 dentro de 3/4","v0.o1":"La octava parte de 3/4","v0.o2":"3/4 menos 1/8",
"v0.why":"Dividir es repartir o encajar. Aquí encajamos: 1/8 cabe 6 veces dentro de 3/4, así que 3/4 : 1/8 = 6.",
"v1.title":"Encajamos trozos",
"v1.text":"<p>Vamos poniendo copias del trozo dentro del dividendo y las contamos. Si sobra un trozo incompleto, el resultado no es un número entero.</p>",
"v1.q":"Al dividir entre una fracción menor que 1, el resultado es…",
"v1.o0":"mayor que el dividendo","v1.o1":"menor que el dividendo","v1.o2":"siempre un número entero",
"v1.why":"Un trozo pequeño cabe muchas veces: 3/4 : 1/8 = 6, mucho más que 3/4. Dividir «hace más pequeño» solo cuando divides entre más de 1.",
"v2.title":"Trozos iguales",
"v2.text":"<p>Para contar exactamente cortamos las dos fracciones en trozos del mismo tamaño (el <b>mcm</b> de los denominadores). Ahora la pregunta es sencilla: <b>¿cuántas veces caben b trozos en a trozos?</b> Eso es a : b.</p>",
"v2.q":"Con el mismo denominador, 9/12 : 2/12 =",
"v2.o0":"9/2","v2.o1":"9/24","v2.o2":"2/9",
"v2.why":"9 trozos entre 2 trozos: cabe 4 veces y media. Los doceavos desaparecen porque son la misma unidad arriba y abajo.",
"w.title":"De dónde sale la regla: dos pasos",
"w.text":"<p>Pensémoslo en dos pasos. <b>Primero</b>, cuántas veces cabe <b>un solo trozo de 1/d</b> (el denominador del divisor) dentro del dividendo: en cada unidad caben <b>d</b>, así que multiplicamos el dividendo por d. <b>Segundo</b>, el divisor no es un trozo sino <b>n trozos juntos</b>: agrupamos los trozos de n en n, es decir, dividimos entre n.</p><p>Multiplicar por d y dividir entre n es multiplicar por <b>d/n</b>: la fracción inversa.</p>",
"w.q":"Para dividir entre 2/3, primero multiplicamos por 3 y después dividimos entre 2. ¿Por qué se multiplica por 3?",
"w.o0":"Porque en cada unidad caben 3 tercios","w.o1":"Porque 3 es mayor que 2","w.o2":"Porque siempre se multiplica por el número de arriba",
"w.why":"El denominador 3 dice cuántos tercios forman una unidad. Multiplicar por 3 cuenta todos los tercios que hay en el dividendo; después los agrupamos de 2 en 2 porque el divisor son 2 tercios.",
"tk_w1":"<b>1.er paso.</b> En cada unidad caben <b>{0}</b> trozos de 1/{0}: dentro de {1} caben {1} × {0} = <b>{2}</b>.",
"tk_w2":"<b>2.º paso.</b> El divisor son <b>{0}</b> trozos juntos: agrupamos los {1} trozos de {0} en {0}: {1} : {0} = <b>{2}</b>.",
"tk_w3":"Multiplicar por {0} y dividir entre {1} es multiplicar por {0}/{1}, la inversa de {1}/{0}.",
"cv_w1":"{0} trozos de 1/{1}","cv_w2":"grupos de {0}",
"v3.title":"La regla: multiplicar por la inversa",
"v3.text":"<p>El resultado coincide con <b>multiplicar la primera fracción por la inversa de la segunda</b> (la segunda dada la vuelta). Es la regla que se usa siempre, y ahora ya sabes de dónde sale.</p>",
"v3.tq":"¿Por qué dividir entre 1/8 es lo mismo que multiplicar por 8?",
"v3.th":"En cada unidad caben 8 octavos, así que en 3/4 de unidad caben 8 · 3/4 = 6. Dividir entre un trozo es multiplicar por el número de trozos que forman una unidad.",
"v4.title":"Simplificamos",
"v4.text":"<p>Si numerador y denominador tienen un divisor común, los dividimos por el <b>mcd</b>. Si el resultado pasa de 1, también podemos escribirlo como número mixto: las veces enteras que cabe más la parte que sobra.</p>",
"v4.tq":"¿Cuándo el resultado de una división de fracciones es un número entero?",
"v4.th":"Cuando el trozo cabe un número exacto de veces: con el mismo denominador, cuando el numerador del dividendo es múltiplo del numerador del divisor (9/12 : 3/12 = 3).",

/* ===== càlcul ===== */
const g2=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const r=a%b;a=b;b=r;}return a;};
const lcm=(a,b)=>a/g2(a,b)*b;
const fs=(n,d)=>{const g=g2(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d;};
const fr=(n,d,cls)=>'<span class="fr'+(cls?' '+cls:'')+'"><i>'+n+'</i><i>'+d+'</i></span>';
const TIMES='·';
let S={n1:2,d1:3,op:'*',n2:3,d2:4},V={};
function derive(){
  const {n1,d1,n2,d2,op}=S;
  const f1=n1/d1,f2=n2/d2;
  if(op==='*'){
    const P=n1*n2,Q=d1*d2,g=g2(P,Q);
    V={f1,f2,P,Q,g,R:P/Q,mx1:Math.ceil(n1/d1),mx2:Math.ceil(n2/d2)};
  }else{
    const m=lcm(d1,d2),na=n1*m/d1,nb=n2*m/d2;
    const P=n1*d2,Q=d1*n2,g=g2(P,Q);
    V={f1,f2,m,na,nb,P,Q,g,R:P/Q,q:Math.floor(na/nb),rem:na%nb,mx:Math.ceil(Math.max(f1,f2))};
  }
}

/* ===== controls ===== */
function fillSel(sel,from,to,keep){
  sel.innerHTML='';
  for(let k=from;k<=to;k++){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}
  sel.value=clamp(keep,from,to);
}
function syncControls(){
  fillSel($('#d1'),2,12,S.d1);fillSel($('#d2'),2,12,S.d2);
  fillSel($('#n1'),1,2*S.d1,S.n1);fillSel($('#n2'),1,2*S.d2,S.n2);
  $$('#opsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.op===S.op)));
}
function readControls(from){
  S.d1=+$('#d1').value;S.d2=+$('#d2').value;
  if(from==='d1')fillSel($('#n1'),1,2*S.d1,+$('#n1').value);
  if(from==='d2')fillSel($('#n2'),1,2*S.d2,+$('#n2').value);
  S.n1=+$('#n1').value;S.n2=+$('#n2').value;
  derive();paint();
}
function setFr(n1,d1,op,n2,d2){
  d1=clamp(Math.round(d1),2,12);d2=clamp(Math.round(d2),2,12);
  const chg=op!==S.op;
  S={n1:clamp(Math.round(n1),1,2*d1),d1,op,n2:clamp(Math.round(n2),1,2*d2),d2};
  derive();syncControls();
  if(chg)setSteps();else paint();
}
const PRE=[[2,3,'*',3,4],[1,2,'*',1,2],[3,2,'*',4,5],[4,5,'*',5,4],[3,4,'/',1,8],[1,2,'/',1,3],[2,3,'/',4,5],[5,4,'/',1,2]];
function buildPresets(){
  const h=$('#presets');h.innerHTML='';
  PRE.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=p[0]+'/'+p[1]+' '+(p[2]==='*'?TIMES:':')+' '+p[3]+'/'+p[4];
    b.onclick=()=>setFr(...p);h.appendChild(b);});
}

/* ===== text del panell ===== */
function simplHTML(P,Q,g){
  let h='';
  const rs=P/g,ms=Q/g,sh=ms===1?'<b class="cG">'+rs+'</b>':fr(rs,ms,'cG');
  if(g>1)h+='<p>'+tt('tk_gcd',P,Q,g)+'. '+tt('tk_simpl',g)+'</p><div class="eq">'+fr(P,Q)+' = '+fr(P+' ÷ '+g,Q+' ÷ '+g)+' = '+sh+'</div>';
  else h+='<p>'+tt('tk_irred',P+'/'+Q)+'</p>';
  if(ms>1&&rs>ms){const w=Math.floor(rs/ms),q=rs%ms;h+='<p>'+t('tk_mixed')+' <span class="eq"><b class="cG">'+w+'</b>'+(q?fr(q,ms,'cG'):'')+'</span></p>';}
  return h;
}
function ticketHTML(i){
  const {n1,d1,n2,d2,op}=S,{P,Q,g,f1,f2,R}=V,a=n1+'/'+d1,b=n2+'/'+d2;
  let h='';
  if(op==='*'){
    h+='<div class="eq">'+fr(n1,d1,'cA')+' '+TIMES+' '+fr(n2,d2,'cB')+(i>=3?' = '+fr(n1+'·'+n2,d1+'·'+d2)+' = '+fr(P,Q,'cG'):' = ?')+'</div>';
    if(i===0)h+='<p>'+tt('tk_mean',a,b)+'</p><p class="note">'+tt('tk_cols',n1,d1)+'</p>';
    else if(i===1)h+='<p class="note">'+tt('tk_cols',n1,d1)+' '+tt('tk_rows',n2,d2)+'</p>';
    else if(i===2)h+='<p>'+tt('tk_cells',d1,d2,Q,n1,n2,P)+'</p>';
    else if(i===3)h+='<p class="note">'+t('tk_rule')+'</p>'+simplHTML(P,Q,g);
    else if(i===4){
      const r=fs(P,Q);
      h+='<p>'+(f2<1?tt('tk_lt',a,b,r):f2>1?tt('tk_gt',a,b,r):tt('tk_one',a,b))+'</p>';
    }
  }else{
    const {m,na,nb,q,rem}=V;
    const K=n1*d2;
    h+='<div class="eq">'+fr(n1,d1,'cA')+' : '+fr(n2,d2,'cB')+(i>=4?' = '+fr(n1,d1,'cA')+' '+TIMES+' '+fr(d2,n2,'cB')+' = '+fr(P,Q,'cG'):i===3?' = '+fr(n1,d1,'cA')+' × '+d2+' : '+n2+' = '+fr(K,d1)+' : '+n2+' = '+fr(P,Q,'cG'):i===2?' = '+fr(na,m,'cA')+' : '+fr(nb,m,'cB')+' = '+fr(na,nb,'cG'):' = ?')+'</div>';
    if(i===0)h+='<p>'+tt('tk_ask',a,b)+'</p>';
    else if(i===1){
      h+='<p>'+(q>0?tt('tk_fits',q):tt('tk_fits0',a,b))+'</p>';
      h+='<p class="note">'+(rem?tt('tk_rest',b):tt('tk_exact',q))+'</p>';
    }else if(i===2)h+='<p>'+tt('tk_lcm',d1,d2,m)+'</p><p class="note">'+tt('tk_same',na,nb)+'</p>';
    else if(i===3)h+='<p>'+tt('tk_w1',d2,a,fs(K,d1))+'</p><p>'+tt('tk_w2',n2,fs(K,d1),fs(P,Q))+'</p><p class="note">'+tt('tk_w3',d2,n2)+'</p>';
    else if(i===4)h+='<p>'+tt('tk_inv',b,d2+'/'+n2)+'</p>';
    else if(i===5){
      h+=simplHTML(P,Q,g);
      const r=fs(P,Q);
      if(f2<1)h+='<p class="note">'+tt('tk_big',r,a)+'</p>';else if(f2>1)h+='<p class="note">'+tt('tk_small',r,a)+'</p>';
    }
  }
  return h;
}
function paint(){$('#ticket').innerHTML=ticketHTML(SE.i);}

/* ===== dibuix ===== */
const W=640,H=380;
const cv=$('#cv'),ctx=cv.getContext('2d');
function fitCv(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*dpr*H/W);const sc=cv.width/W;ctx.setTransform(sc,0,0,sc,0,0);}
cv.style.aspectRatio=W+'/'+H;new ResizeObserver(fitCv).observe(cv);fitCv();
const ease=x=>x*x*(3-2*x);
const FM='ui-monospace,Menlo,Consolas,monospace';
let ph=0,target=0;
function txt(x,s,px,py,col,size,al){x.font='700 '+(size||18)+'px '+FM;x.fillStyle=col;x.textAlign=al||'left';x.fillText(s,px,py);}
function drawMul(){
  const c=C(),x=ctx,{n1,d1,n2,d2}=S,{mx1,mx2,P,Q,f1,f2,R}=V;
  const e1=ease(clamp(ph,0,1)),e2=ease(clamp(ph-1,0,1)),e3=ease(clamp(ph-2,0,1)),e4=ease(clamp(ph-3,0,1));
  const BX=90,BY=36,BW=500,BH=236;
  const U=Math.min(BW/mx1,BH/mx2),GW=U*mx1,GH=U*mx2,gx=BX+(BW-GW)/2,gy=BY+(BH-GH)/2;
  const cw=U/d1,chh=U/d2;
  x.fillStyle=c.panel;x.fillRect(gx,gy,GW,GH);
  /* columnes (1a fracció) */
  x.globalAlpha=.55;x.fillStyle=c.pa;x.fillRect(gx,gy,cw*n1*e1,GH);x.globalAlpha=1;
  /* files (2a fracció) */
  if(e2>0){x.globalAlpha=.55*e2;x.fillStyle=c.pb;x.fillRect(gx,gy+GH-chh*n2,GW,chh*n2);x.globalAlpha=1;}
  /* intersecció */
  if(e3>0){x.globalAlpha=.75*e3;x.fillStyle=c.ok;x.fillRect(gx,gy+GH-chh*n2,cw*n1,chh*n2);x.globalAlpha=1;}
  /* línies de la quadrícula */
  x.strokeStyle=c.ink;x.lineWidth=1;
  for(let k=1;k<d1*mx1;k++){x.globalAlpha=(k%d1===0)?.9:.35*e1;x.lineWidth=(k%d1===0)?2.5:1;x.beginPath();x.moveTo(gx+k*cw,gy);x.lineTo(gx+k*cw,gy+GH);x.stroke();}
  for(let k=1;k<d2*mx2;k++){x.globalAlpha=(k%d2===0)?.9:.35*e2;x.lineWidth=(k%d2===0)?2.5:1;x.beginPath();x.moveTo(gx,gy+GH-k*chh);x.lineTo(gx+GW,gy+GH-k*chh);x.stroke();}
  x.globalAlpha=1;x.lineWidth=2;x.strokeRect(gx,gy,GW,GH);
  /* etiquetes */
  txt(x,n1+'/'+d1,gx,gy-9,c.pa,18);
  if(e2>0){x.save();x.translate(gx-10,gy+GH-chh*n2/2);x.rotate(-Math.PI/2);x.globalAlpha=e2;txt(x,n2+'/'+d2,0,0,c.pb,18,'center');x.restore();x.globalAlpha=1;}
  if(e3>.5)txt(x,tt('cv_cells',P,Q),gx+GW,gy-9,c.ok,15,'right');
  /* comparació (pas 5) */
  if(e4>0){
    const y0=300,bh=22,sc=Math.min(150,480/Math.max(f1,R,1));
    x.globalAlpha=e4;
    txt(x,n1+'/'+d1,gx-8,y0+16,c.pa,15,'right');
    x.fillStyle=c.panel;x.fillRect(gx,y0,sc*Math.max(f1,R,1)+2,bh);x.strokeStyle=c.line;x.lineWidth=1;x.strokeRect(gx,y0,sc*Math.max(f1,R,1)+2,bh);
    x.fillStyle=c.pa;x.globalAlpha=.85*e4;x.fillRect(gx,y0,sc*f1,bh);x.globalAlpha=e4;
    const y1=y0+bh+16;
    txt(x,fs(P,Q),gx-8,y1+16,c.ok,15,'right');
    x.fillStyle=c.panel;x.fillRect(gx,y1,sc*Math.max(f1,R,1)+2,bh);x.strokeStyle=c.line;x.strokeRect(gx,y1,sc*Math.max(f1,R,1)+2,bh);
    x.fillStyle=c.ok;x.globalAlpha=.85*e4;x.fillRect(gx,y1,sc*R*e4,bh);x.globalAlpha=e4;
    x.strokeStyle=c.ink;x.setLineDash([3,3]);x.beginPath();x.moveTo(gx+sc*f1,y0-4);x.lineTo(gx+sc*f1,y1+bh+4);x.stroke();x.setLineDash([]);
    const k=f2<1?'cv_lt':f2>1?'cv_gt':'cv_eq';
    txt(x,tt(k,n1+'/'+d1),gx+sc*Math.max(f1,R,1)+10,y1+16,c.muted,14);
    x.globalAlpha=1;
  }
}
function drawDiv(){
  const c=C(),x=ctx,{n1,d1,n2,d2}=S,{f1,f2,m,na,nb,q,rem,mx,P,Q}=V;
  const e1=ease(clamp(ph,0,1)),e2=ease(clamp(ph-1,0,1)),eW=ease(clamp(ph-2,0,1)),e3=ease(clamp(ph-3,0,1));
  const X0=70,LW=540,BH=44,YA=44,YB=140,YC=250;
  const U=LW/mx,X=v=>X0+v*U;
  const frame=y=>{x.fillStyle=c.panel;x.fillRect(X0,y,LW,BH);x.strokeStyle=c.line;x.lineWidth=1.5;x.strokeRect(X0,y,LW,BH);
    for(let k=1;k<mx;k++){x.strokeStyle=c.ink;x.lineWidth=2.5;x.globalAlpha=.85;x.beginPath();x.moveTo(X(k),y);x.lineTo(X(k),y+BH);x.stroke();x.globalAlpha=1;}};
  const ticks=(y,den,al)=>{x.strokeStyle=c.ink;x.lineWidth=1;for(let k=1;k<den*mx;k++){if(k%den===0)continue;x.globalAlpha=al;x.beginPath();x.moveTo(X(k/den),y);x.lineTo(X(k/den),y+BH);x.stroke();}x.globalAlpha=1;};
  const block=(v0,v1,y,col,al,den)=>{if(v1<=v0)return;x.globalAlpha=al;x.fillStyle=col;x.fillRect(X(v0),y,(v1-v0)*U,BH);
    x.strokeStyle=c.panel;x.lineWidth=1.5;x.globalAlpha=al*.85;for(let k=1;v0+k/den<v1-1e-9;k++){x.beginPath();x.moveTo(X(v0+k/den),y);x.lineTo(X(v0+k/den),y+BH);x.stroke();}x.globalAlpha=1;};
  /* dividend */
  frame(YA);ticks(YA,d1,.22);block(0,f1,YA,c.pa,.9,d1);
  txt(x,n1+'/'+d1,X0,YA-9,c.pa,18);
  /* divisor */
  frame(YB);ticks(YB,d2,.22);block(0,f2,YB,c.pb,.9,d2);
  txt(x,n2+'/'+d2,X0,YB-9,c.pb,18);
  if(e2>0){ticks(YA,m,.5*e2);ticks(YB,m,.5*e2);if(m*mx<=48)txt(x,tt('cv_piece',m),X0+LW,YB-9,c.muted,14,'right');}
  /* encabir */
  frame(YC);
  if(e1<.02)txt(x,'?',X0+LW/2,YC+BH/2+9,c.muted,28,'center');
  if(e1>0){
    x.globalAlpha=.25*e1;x.fillStyle=c.pa;x.fillRect(X0,YC,f1*U,BH);x.globalAlpha=1;
    const total=q+(rem?1:0),shown=e1*total;
    for(let k=0;k<total;k++){
      const prog=clamp(shown-k,0,1);if(prog<=0)break;
      const v0=k*f2,full=k<q,v1=full?v0+f2:f1;
      const yy=lerp(YB,YC,ease(prog));
      block(v0,v1,yy,c.pb,full?.9:.45,d2);
      if(!full){x.save();x.beginPath();x.rect(X(v0),yy,(v1-v0)*U,BH);x.clip();x.strokeStyle=c.pb;x.globalAlpha=.8;x.lineWidth=2;
        for(let s=-BH;s<(v1-v0)*U;s+=8){x.beginPath();x.moveTo(X(v0)+s,yy+BH);x.lineTo(X(v0)+s+BH,yy);x.stroke();}x.restore();x.globalAlpha=1;}
      if(full&&prog>.9)txt(x,String(k+1),X((v0+v1)/2),yy+BH/2+6,c.panel,15,'center');
    }
    if(e1>.95){
      x.strokeStyle=c.ink;x.lineWidth=2;x.globalAlpha=.85;x.beginPath();x.moveTo(X(f1),YC-6);x.lineTo(X(f1),YC+BH+6);x.stroke();x.globalAlpha=1;
      let lab=q>0?tt('cv_fits',q):'';if(rem)lab+=(lab?' ':'')+t('cv_rest');
      txt(x,lab,X0,YC-9,c.ink,15);
    }
  }
  if(e2>0){ticks(YC,m,.5*e2);}
  /* dos passos: trossos d'1/d2 agrupats de n2 en n2 */
  if(eW>0&&d2*mx<=60){
    const K=n1*d2,y=YA+BH+6;
    x.strokeStyle=c.pb;x.lineWidth=2;x.globalAlpha=.9*eW;
    for(let k=1;k<d2*mx;k++){x.beginPath();x.moveTo(X(k/d2),YA);x.lineTo(X(k/d2),YA+BH);x.stroke();}
    const groups=q;
    for(let g=0;g<groups;g++){const x1=X(g*n2/d2)+2,x2=X((g+1)*n2/d2)-2;x.beginPath();x.moveTo(x1,y);x.lineTo(x1,y+6);x.lineTo(x2,y+6);x.lineTo(x2,y);x.stroke();}
    x.globalAlpha=1;
    txt(x,tt('cv_w1',fs(K,d1),d2)+(n2>1?' → '+tt('cv_w2',n2):''),X0+LW,YA-9,c.pb,14,'right');
  }
  /* resultat */
  if(e3>0){
    x.globalAlpha=e3;
    const r=fs(P,Q),mixed=(P>Q&&P%Q)?Math.floor(P/Q)+' '+fs(P%Q,Q):'';
    txt(x,'= '+r+(mixed?'  ('+mixed+')':''),X0+LW,YC+BH+30,c.ok,20,'right');
    x.globalAlpha=1;
  }
}
function draw(){ctx.clearRect(0,0,W,H);if(S.op==='*')drawMul();else drawDiv();}
function loop(){
  if(ph!==target){const d=target-ph;ph=REDUCE||Math.abs(d)<.002?target:ph+Math.sign(d)*Math.min(Math.abs(d),.035);}
  draw();requestAnimationFrame(loop);
}
