"p0.title":"Un paralelogramo",
"p0.text":"<p>Un paralelogramo tiene los lados opuestos paralelos, pero no tiene ángulos rectos. Por eso no podemos multiplicar «largo por ancho» sin más. Ahora bien, <b>podemos transformarlo</b> en una figura que ya sabemos medir.</p>",
"p0.q":"Predice antes de ver: ¿con qué figura simple tiene la misma área?",
"p0.o0":"Un rectángulo con la misma base y la misma altura","p0.o1":"Un cuadrado que tiene por lado el lado inclinado","p0.o2":"Un triángulo con la misma base",
"p0.why":"Si cambiamos de sitio un trozo de la figura, la forma cambia pero el área no: nos quedará un rectángulo. Lo comprobamos en los pasos siguientes.",
"p1.title":"Baja la altura y corta",
"p1.text":"<p>Desde un vértice de arriba bajamos una línea <b>perpendicular a la base</b>: es la <b>altura h</b>. Esa línea corta un <b>triángulo rectángulo</b> a la izquierda (en color).</p>",
"p1.tq":"¿Por qué hay que medir la altura perpendicular a la base y no por el lado inclinado?",
"p1.th":"El lado inclinado es más largo que la altura (es la hipotenusa del triángulo que acabamos de cortar). La altura es la distancia real entre las dos bases paralelas, y es la que dice cuántas filas de cuadraditos caben.",
"p2.title":"Mueve el triángulo",
"p2.text":"<p>Trasladamos el triángulo hasta el otro lado, sin girarlo ni deformarlo. Los dos lados inclinados coinciden perfectamente.</p>",
"p2.q":"Cuando movemos el triángulo, ¿cambia el área de la figura?",
"p2.o0":"Sí, aumenta","p2.o1":"Sí, disminuye","p2.o2":"No, sigue siendo la misma",
"p2.why":"No hemos añadido ni quitado nada: solo hemos cambiado de sitio una pieza. El área se conserva.",
"p3.title":"Ya es un rectángulo",
"p3.text":"<p>Ahora tenemos un rectángulo de base <b>b</b> y altura <b>h</b>. Cuenta los cuadraditos: <b>b · h</b>. Por tanto, el área de un paralelogramo es <b>A = b · h</b>.</p>",
"p3.tq":"Cambia s sin tocar b ni h, es decir, inclina el paralelogramo. ¿Qué pasa con el área?",
"p3.th":"Se queda igual: todos los paralelogramos con la misma base y la misma altura tienen la misma área, por muy inclinados que estén.",
"t0.title":"Un triángulo",
"t0.text":"<p>Un triángulo tiene base <b>b</b> y altura <b>h</b>. Para hallar su área lo convertiremos en una figura que ya sabemos medir.</p>",
"t0.q":"Predice: si ponemos al lado un triángulo igual, girado, ¿qué figura formarán juntos?",
"t0.o0":"Un paralelogramo","t0.o1":"Un cuadrado","t0.o2":"Un triángulo más grande",
"t0.why":"Girar la copia 180° hace que los lados iguales coincidan y los dos triángulos formen un paralelogramo. Lo verás ahora.",
"t1.title":"Haz una copia",
"t1.text":"<p>Hacemos una <b>copia exacta</b> del triángulo (en color). Ahora hay dos triángulos iguales, uno encima del otro.</p>",
"t1.tq":"¿Por qué la copia girada encajará sin dejar ningún hueco?",
"t1.th":"Gira media vuelta alrededor del punto medio de un lado: ese lado queda en su sitio, y los otros dos lados de la copia, que son iguales a los del original, pasan a ser los opuestos y paralelos.",
"t2.title":"Gira la copia 180°",
"t2.text":"<p>La copia gira media vuelta alrededor del <b>punto medio</b> de un lado. Los dos triángulos encajan y forman un <b>paralelogramo</b>.</p>",
"t3.title":"Un paralelogramo: el doble",
"t3.text":"<p>El paralelogramo tiene base <b>b</b> y altura <b>h</b>: su área es <b>b · h</b>. El triángulo es <b>la mitad</b>: <b>A = b · h ÷ 2</b>.</p>",

"t3.tq":"Mueve el vértice de arriba (cambia s). ¿Por qué el área del triángulo no cambia?",
"t3.th":"Porque no han cambiado ni la base ni la altura: todos los triángulos con la misma base y la misma altura tienen la misma área.",

/* ===== Àrea per descomposició ===== */
const svg=$('#svg');
const STEPDEF={
 par:[{id:'p0',ask:{n:3,ok:0}},{id:'p1',think:true},{id:'p2',ask:{n:3,ok:2}},{id:'p3',think:true}],
 tri:[{id:'t0',ask:{n:3,ok:0}},{id:'t1',think:true},{id:'t2'},{id:'t3',ask:{n:3,ok:1},think:true}],
 tra:[{id:'z0'},{id:'z1',think:true},{id:'z2',ask:{n:3,ok:0}},{id:'z3',think:true}]
};
const ST={shape:'par',b:6,h:4,s:2,B:8,bt:4,grid:true};
let P=0,raf=0;
const ease=x=>x*x*(3-2*x);
const VW=360,VH=292,ML=24,MT=26,MB=50;
const fx=x=>nf(x,2);
/* sliders (compartits entre figures) */
const ctrl=$('#ctrl');
const sB_=slider(ctrl,{id:'sb',key:'l_b',min:2,max:12,step:1,val:6,on:v=>{ST.b=v;if(ST.s>v){ST.s=v;sS_.set(v);}sS_.inp.max=v;refresh();}});
const sBB=slider(ctrl,{id:'sBB',key:'l_B',min:3,max:12,step:1,val:8,on:v=>{ST.B=v;if(ST.bt>v){ST.bt=v;sBM.set(v);}sBM.inp.max=v;refresh();}});
const sBM=slider(ctrl,{id:'sbm',key:'l_bm',min:1,max:8,step:1,val:4,on:v=>{ST.bt=v;refresh();}});
const sH_=slider(ctrl,{id:'sh',key:'l_h',min:2,max:10,step:1,val:4,on:v=>{ST.h=v;refresh();}});
const sS_=slider(ctrl,{id:'ss',key:'l_s',min:0,max:6,step:1,val:2,on:v=>{ST.s=v;refresh();}});
sBM.inp.max=ST.B;sS_.inp.max=ST.b;
function showCtl(){
  const par=ST.shape!=='tra';
  sB_.el.hidden=!par;sS_.el.hidden=!par;sBB.el.hidden=par;sBM.el.hidden=par;
}
/* geometria */
function bbox(){
  const {shape,b,h,s,B,bt}=ST;
  if(shape==='tra')return {x1:(3*B+bt)/2,h};
  return {x1:b+s,h};
}
function map(bb){
  const w=bb.x1,k=Math.min((VW-2*ML)/w,(VH-MT-MB)/bb.h),ox=ML+((VW-2*ML)-w*k)/2;
  return {k,X:x=>ox+x*k,Y:y=>VH-MB-y*k};
}
function draw(){
  const bb=bbox(),{k,X,Y}=map(bb);
  const op=o=>o!==undefined?' style="opacity:'+Math.max(0,Math.min(1,o)).toFixed(3)+'"':'';
  const pl=(pts,cls,o)=>'<polygon points="'+pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+'" class="'+cls+'"'+op(o)+'/>';
  const ln=(x1,y1,x2,y2,cls,o)=>'<line x1="'+X(x1).toFixed(1)+'" y1="'+Y(y1).toFixed(1)+'" x2="'+X(x2).toFixed(1)+'" y2="'+Y(y2).toFixed(1)+'" class="'+cls+'"'+op(o)+'/>';
  const lp=(x1,y1,x2,y2,cls,o)=>'<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" class="'+cls+'"'+op(o)+'/>';
  const tx=(px,py,str,cls,o,anchor)=>'<text x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" class="'+(cls||'lab')+'" text-anchor="'+(anchor||'middle')+'" dominant-baseline="central"'+op(o)+'>'+str+'</text>';
  const ra=(x,o)=>{const px=X(x),py=Y(0);return '<path class="rm" d="M'+(px+8).toFixed(1)+','+py.toFixed(1)+' L'+(px+8).toFixed(1)+','+(py-8).toFixed(1)+' L'+px.toFixed(1)+','+(py-8).toFixed(1)+'"'+op(o)+'/>';};
  let s='';
  if(ST.grid){
    for(let x=0;x<=bb.x1+1e-9;x++)s+=ln(x,0,x,bb.h,'gr');
    for(let y=0;y<=bb.h;y++)s+=ln(0,y,bb.x1,y,'gr');
  }
  const ca=clamp(P,0,1),e=ease(clamp(P-1,0,1)),fa=clamp(P-2,0,1);
  const h=ST.h;
  if(ST.shape==='par'){
    const b=ST.b,sv=ST.s,dx=b*e;
    const rest=[[sv,0],[b,0],[b+sv,h],[sv,h]],T=[[dx,0],[sv+dx,0],[sv+dx,h]];
    s+=pl(rest,'f1');
    if(sv>0)s+=pl(T,'f1')+pl(T,'f2',ca);
    s+=pl([[0,0],[b,0],[b+sv,h],[sv,h]],'ol',1-ca);
    s+=pl(rest,'ol2',ca);
    if(sv>0)s+=pl(T,'ol2',ca);
    s+=pl([[sv,0],[b+sv,0],[b+sv,h],[sv,h]],'ol3',fa);
    s+=ln(sv,0,sv,h,'hl',ca);
    if(sv>0)s+=ra(sv,ca);
    s+=tx(X(b/2+sv*e),Y(0)+17,'b','edge');
    s+=tx(X(sv)-9,Y(h/2),'h','edge',ca,'end');
    s+=tx(X(sv+b/2),Y(h/2)-9,'A = b · h','big',fa);
    s+=tx(X(sv+b/2),Y(h/2)+9,b+' · '+h+' = '+(b*h),'big',fa);
  }else{
    const isT=ST.shape==='tri';
    const b=isT?ST.b:ST.B,sv=ST.s,o=(ST.B-ST.bt)/2,bt=ST.bt;
    const Q=isT?[[0,0],[b,0],[sv,h]]:[[0,0],[ST.B,0],[o+bt,h],[o,h]];
    const M=isT?[(b+sv)/2,h/2]:[(ST.B+o+bt)/2,h/2],phi=Math.PI*e,cs=Math.cos(phi),sn=Math.sin(phi);
    const rot=p=>{const dx=p[0]-M[0],dy=p[1]-M[1];return [M[0]+cs*dx-sn*dy,M[1]+sn*dx+cs*dy];};
    const Qc=Q.map(rot);
    s+=pl(Q,'f1')+pl(Qc,'f2',ca)+pl(Q,'ol2');
    s+=pl(Qc,e>=0.999?'ol2':'ol2d',ca);
    const par=isT?[[0,0],[b,0],[b+sv,h],[sv,h]]:[[0,0],[ST.B+bt,0],[ST.B+o+bt,h],[o,h]];
    s+=pl(par,'ol3',fa);
    const xh=isT?sv:o;
    s+=ln(xh,0,xh,h,'hl');
    s+=ra(xh);
    const piv=ca*(1-fa);
    s+='<circle class="piv" cx="'+X(M[0]).toFixed(1)+'" cy="'+Y(M[1]).toFixed(1)+'" r="4.5"'+op(piv)+'/>';
    s+=tx(X(xh)-9,Y(h/2),'h','edge',1,'end');
    if(isT){
      s+=tx(X(b/2),Y(0)+17,'b','edge');
      s+=tx(X(M[0]),Y(M[1])-9,b+' · '+h+' = '+(b*h),'big',fa);
      s+=tx(X(M[0]),Y(M[1])+9,'A = '+(b*h)+' ÷ 2 = '+fx(b*h/2),'big',fa);
    }else{
      const B=ST.B;
      s+=tx(X(B/2),Y(0)+17,'B','edge');
      s+=tx(X(o+bt/2),Y(h)-11,'b','edge');
      s+=tx(X(B+bt/2),Y(0)+17,'b','edge',fa);
      const yb=Y(0)+29;
      s+=lp(X(0),yb,X(B+bt),yb,'br',fa)+lp(X(0),yb-4,X(0),yb+4,'br',fa)+lp(X(B+bt),yb-4,X(B+bt),yb+4,'br',fa);
      s+=tx(X((B+bt)/2),yb+13,'B + b','edge',fa);
      s+=tx(X(M[0]),Y(M[1])-9,'('+B+' + '+bt+') · '+h+' = '+((B+bt)*h),'big',fa);
      s+=tx(X(M[0]),Y(M[1])+9,'A = '+((B+bt)*h)+' ÷ 2 = '+fx((B+bt)*h/2),'big',fa);
    }
  }
  svg.innerHTML=s;
}
/* dades que es mostren al panell (segons la figura i el pas) */
function statsFor(i){
  const {shape,b,h,B,bt}=ST;
  if(shape==='par')return i<3?[['k_b',b],['k_h',h]]:[['k_b',b],['k_h',h],['k_A','b · h = '+(b*h)]];
  if(shape==='tri')return i<3?[['k_b',b],['k_h',h]]:[['k_b',b],['k_h',h],['k_Ap','b · h = '+(b*h)],['k_A',(b*h)+' ÷ 2 = '+fx(b*h/2)]];
  return i<3?[['k_B',B],['k_bm',bt],['k_h',h]]:[['k_B',B],['k_bm',bt],['k_h',h],['k_Ap','(B + b) · h = '+((B+bt)*h)],['k_A',((B+bt)*h)+' ÷ 2 = '+fx((B+bt)*h/2)]];
}
function refresh(){
  SE.steps.forEach((s,i)=>{s.stats=statsFor(i).map(p=>[p[0],String(p[1]).replace('.',',')]);});
  stepRender();draw();
}
/* animació entre passos */
function animateTo(i){
  cancelAnimationFrame(raf);
  const from=P,to=i;
  if(REDUCE||Math.abs(to-from)<1e-6){P=to;draw();return;}
  const dur=1000*Math.max(0.5,Math.abs(to-from)),t0=performance.now();
  function step(now){
    const p=Math.min(1,(now-t0)/dur);
    P=from+(to-from)*(p*p*(3-2*p));draw();
    if(p<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
function rebuildStepper(){
  const sp=$('#stepper');sp.innerHTML='';
  SE.steps.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.textContent=k+1;b.onclick=()=>stepGo(k);sp.appendChild(b);});
}
function setShape(sh,keepStep){
  cancelAnimationFrame(raf);
  ST.shape=sh;
  SE.steps=STEPDEF[sh].map(x=>Object.assign({},x));SE.ans={};SE.hint={};SE.i=0;P=0;
  rebuildStepper();showCtl();
  $$('#shapesw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===sh)));
  refresh();
}
$$('#shapesw button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.shape!==ST.shape)setShape(b.dataset.shape);}));
$('#gridc').addEventListener('change',e=>{ST.grid=e.target.checked;draw();});
/* càrrega d'un cas des de les activitats: es mostra la figura ja transformada */
function ld(shape,v){
  const c=(x,a,z)=>clamp(Math.round(x),a,z);
  if(v.b!==undefined){ST.b=c(v.b,2,12);sB_.set(ST.b);}
  if(v.h!==undefined){ST.h=c(v.h,2,10);sH_.set(ST.h);}
  if(v.B!==undefined){ST.B=c(v.B,3,12);sBB.set(ST.B);}
  sBM.inp.max=ST.B;
  if(v.bt!==undefined){ST.bt=c(v.bt,1,ST.B);sBM.set(ST.bt);}
  if(ST.bt>ST.B){ST.bt=ST.B;sBM.set(ST.bt);}
  sS_.inp.max=ST.b;
  if(v.s!==undefined){ST.s=c(v.s,0,ST.b);sS_.set(ST.s);}
  if(ST.s>ST.b){ST.s=ST.b;sS_.set(ST.s);}
  setShape(shape);
  P=3;SE.i=3;refresh();
  RZ.show($('#svg'));
}
App.hooks.push(()=>{if(!SE.steps.length)return;showCtl();refresh();});
