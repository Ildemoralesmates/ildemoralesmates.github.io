/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/* ===== Trazado de rayos en una Tierra esférica (modelo tipo PREM simplificado) ===== */
const R_E=6371;
/* [profundidad km, vP km/s, vS km/s]; profundidades repetidas = discontinuidades */
const EARTH=[[0,5.8,3.2],[15,5.8,3.2],[15,6.8,3.9],[24.4,6.8,3.9],[24.4,8.11,4.49],[220,8.56,4.64],[400,8.91,4.77],[400,9.13,4.93],[600,10.16,5.51],[670,10.27,5.57],[670,10.75,5.95],[771,11.07,6.24]];
/* manto inferior, núcleo externo e interno: polinomios de PREM (Dziewonski & Anderson 1981), x = r/R */
for(let d=871;d<2741;d+=100){const x=(R_E-d)/R_E;EARTH.push([d,24.952-40.4673*x+51.4832*x*x-26.6419*x*x*x,11.1671-13.7818*x+17.4575*x*x-9.2777*x*x*x]);}
EARTH.push([2741,13.68,7.27],[2891,13.72,7.26],[2891,8.06,0]);
for(let d=2991;d<5150;d+=100){const x=(R_E-d)/R_E;EARTH.push([d,11.0487-4.0362*x+4.8023*x*x-13.5732*x*x*x,0]);}
EARTH.push([5150,10.36,0],[5150,11.03,3.5]);
for(let d=5250;d<6371;d+=200){const x=(R_E-d)/R_E;EARTH.push([d,11.2622-6.364*x*x,3.6678-4.4475*x*x]);}
EARTH.push([6371,11.26,3.67]);
function velAt(r,k){
  const d=Math.min(Math.max(R_E-r,0),R_E);
  for(let i=0;i<EARTH.length-1;i++){const a=EARTH[i],b=EARTH[i+1];
    if(b[0]>a[0]&&d>=a[0]&&d<=b[0]){return a[k]+(b[k]-a[k])*(d-a[0])/(b[0]-a[0]);}}
  return EARTH[EARTH.length-1][k];
}
/* k=1 onda P, k=2 onda S; i0deg = ángulo de salida respecto a la vertical */
function traceRay(k,i0deg){
  const R=R_E,ds=8,i0=i0deg*Math.PI/180;
  const p=R*Math.sin(i0)/velAt(R,k);            /* parámetro del rayo (s/rad), constante */
  let r=R-1e-6,phi=0,tm=0,dir=1,flips=0,core=false,ended='lost',minr=R,vPrev=velAt(r,k);
  const PH=[0],RR=[R],TT=[0];
  for(let n=1;n<=9000;n++){
    const v=velAt(r,k);
    if(v<0.001){ended='liquid';break;}
    let s=p*v/r;
    if(s>=0.99999){
      if(Math.abs(v-vPrev)/vPrev>0.04){ended='reflected';break;}  /* reflexión total en una discontinuidad: no la seguimos */
      if(dir===1){dir=-1;flips++;if(flips>60){ended='trapped';break;}}   /* punto de giro: el rayo vuelve hacia arriba */
      s=0.99999;
    }
    const c=Math.sqrt(1-s*s);
    r-=dir*ds*c;phi+=ds*s/Math.max(r,1);tm+=ds/v;vPrev=v;
    if(r<minr)minr=r;
    if(r<3480)core=true;
    if(r>=R){r=R;PH.push(phi);RR.push(r);TT.push(tm);ended='surface';break;}
    if(r<ds){phi+=Math.PI;r=ds;dir=-1;}            /* rayo que pasa por el centro */
    if(n%3===0){PH.push(phi);RR.push(r);TT.push(tm);}
  }
  if(ended!=='surface'){PH.push(phi);RR.push(r);TT.push(tm);}
  return {phi:PH,r:RR,t:TT,ended,core,p,T:tm,delta:phi*180/Math.PI,turn:R-minr};
}

/* ===== Ondas P y S e interior de la Tierra ===== */

/* --- rayos precalculados --- */
const ANGLES=[];for(let a=0;a<=20;a+=0.5)ANGLES.push(a);ANGLES.push(13.4,13.95);for(let a=21.5;a<=45;a+=1.5)ANGLES.push(a);ANGLES.sort((x,y)=>x-y);
const weak=x=>x.core&&x.turn>5150&&x.turn<5250;
const foldD=d=>d>180?360-d:d;
const mkFan=k=>ANGLES.map(a=>Object.assign({a},traceRay(k,a))).filter(x=>(x.ended==='surface'&&x.delta<360&&!weak(x))||(k===2&&x.ended==='liquid'));
const FAN={1:mkFan(1),2:mkFan(2)};
let pMantleMax=0,pCoreMin=999,sMax=0;
for(let a=13.3;a<=14.6;a+=0.02){const x=traceRay(1,a);if(x.ended==='surface'&&!x.core)pMantleMax=Math.max(pMantleMax,x.delta);const y=traceRay(2,a);if(y.ended==='surface')sMax=Math.max(sMax,y.delta);}
for(let a=0.5;a<=13.35;a+=0.1){const x=traceRay(1,a);if(x.ended==='surface'&&x.core&&x.delta<360&&!weak(x))pCoreMin=Math.min(pCoreMin,foldD(x.delta));}
const TMAX=Math.max(...[1,2].flatMap(k=>FAN[k].map(x=>x.T)));
const SPEEDS=[30,60,120,240,480];

/* --- dibujo --- */
const ctx=fitCanvas($('#earth'),700,700);
const CX=350,CY=350,RP=300,K=RP/R_E;
const pos=(r,phi,mir)=>{const x=CX+r*K*Math.sin(phi),y=CY-r*K*Math.cos(phi);return [mir?2*CX-x:x,y];};
const idxAt=(arr,T)=>{let lo=0,hi=arr.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(arr[m]<=T)lo=m;else hi=m-1;}return lo;};
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function layer(r,col){ctx.beginPath();ctx.arc(CX,CY,r*K,0,2*Math.PI);ctx.fillStyle=col;ctx.fill();}
function drawRay(ray,T,color,lw,alpha,mir,dotR){
  if(T<=0)return;
  const i=idxAt(ray.t,T),n=ray.t.length;
  ctx.beginPath();
  for(let j=0;j<=i;j++){const [x,y]=pos(ray.r[j],ray.phi[j],mir);j?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  let hx,hy;
  if(i<n-1){const f=(T-ray.t[i])/(ray.t[i+1]-ray.t[i]);[hx,hy]=pos(ray.r[i]+(ray.r[i+1]-ray.r[i])*f,ray.phi[i]+(ray.phi[i+1]-ray.phi[i])*f,mir);ctx.lineTo(hx,hy);}
  else{[hx,hy]=pos(ray.r[n-1],ray.phi[n-1],mir);}
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.globalAlpha=alpha;ctx.stroke();ctx.globalAlpha=1;
  if(i<n-1){ctx.beginPath();ctx.arc(hx,hy,dotR,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();}
  else if(ray.ended==='surface'){ctx.beginPath();ctx.arc(hx,hy,dotR,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();}
  else if(ray.ended==='liquid'){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx-4,hy-4);ctx.lineTo(hx+4,hy+4);ctx.moveTo(hx+4,hy-4);ctx.lineTo(hx-4,hy+4);ctx.stroke();}
}
function arcBand(d1,d2,rad,col){
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.globalAlpha=.55;
  const a1=-Math.PI/2+d1*Math.PI/180,a2=-Math.PI/2+d2*Math.PI/180;
  ctx.beginPath();ctx.arc(CX,CY,rad,a1,a2);ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,rad,Math.PI-a2,Math.PI-a1);ctx.stroke();
  ctx.globalAlpha=1;
}
let T=0,playing=true,last=performance.now(),custom=null;
const cP='#1d4ed8',cS='#c2185b';
function visible(x){return App.level==='adv'||x.a%1===0||x.a>20||x.a===13.4||x.a===13.95;}
function draw(){
  ctx.fillStyle=css('--cv');ctx.fillRect(0,0,700,700);
  layer(R_E,'#9b7653');layer(R_E-35,'#f2b36a');layer(3480,'#f7d98a');layer(1221.5,'#fff3c4');
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;[3480,1221.5].forEach(r=>{ctx.beginPath();ctx.arc(CX,CY,r*K,0,2*Math.PI);ctx.stroke();});
  /* marcas de distancia angular */
  ctx.fillStyle=css('--mut');ctx.font='11px system-ui';ctx.textAlign='center';
  for(let d=0;d<=180;d+=30){const th=-Math.PI/2+d*Math.PI/180;ctx.fillText(d+'°',CX+(RP+36)*Math.cos(th),CY+(RP+36)*Math.sin(th)+4);}
  if($('#showSh').checked){arcBand(pMantleMax,pCoreMin,RP+9,cP);arcBand(sMax,180,RP+17,cS);}
  [1,2].forEach(k=>{
    if(!$(k===1?'#showP':'#showS').checked)return;
    FAN[k].filter(visible).forEach(x=>[false,true].forEach(m=>drawRay(x,T,k===1?cP:cS,1.1,.55,m,3.2)));
  });
  if(custom){drawRay(custom,T,css('--ink'),2.6,1,false,5);}
  ctx.beginPath();ctx.arc(CX,CY-RP,7,0,2*Math.PI);ctx.fillStyle='#ffd43b';ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.stroke();
  ctx.textAlign='left';
  $('#clock').textContent=mmss(Math.min(T,TMAX))+' min';
}
function loop(now){
  const dt=Math.min((now-last)/1000,0.1);last=now;
  if(playing&&T<TMAX+25)T+=dt*SPEEDS[+$('#sp').value];
  draw();requestAnimationFrame(loop);
}

/* --- controles --- */
function updOne(){
  const k=+document.querySelector('input[name=wv]:checked').value,a=+$('#ang').value;
  $('#angv').textContent=nf(a,2);
  custom=traceRay(k,a);
  let msg;
  if(custom.ended==='surface'&&custom.delta<360)msg=t(custom.core?'one_core':'one_surf',nf(foldD(custom.delta),1),mmss(custom.T)+' min');
  else if(custom.ended==='liquid')msg=t('one_liq');
  else msg=t('one_ref');
  if(App.level==='adv'&&k)msg+=tt('one_adv',nf(custom.p*Math.PI/180,2),nf(custom.turn,0));
  $('#oneinfo').innerHTML=msg;
}
function updTexts(){
  $('#spv').textContent='×'+SPEEDS[+$('#sp').value];
  $('#pp').textContent=t(playing?'pause':'resume');
  $('#stP').textContent='≈ '+nf(pMantleMax,0)+'° – '+nf(pCoreMin,0)+'°';
  $('#stS').textContent='> '+nf(sMax,0)+'°';
  updOne();
}
$('#go').onclick=()=>{T=0;playing=true;updTexts();};
$('#pp').onclick=()=>{playing=!playing;updTexts();};
$('#sp').oninput=updTexts;
$('#ang').oninput=updOne;
$$('input[name=wv]').forEach(r=>r.onchange=updOne);
App.hooks.push(updTexts);
requestAnimationFrame(loop);

initQuiz(QDATA);
initLang();applyLang();
