<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camp magnètic i inducció en 3D: fils, la Terra i Faraday-Lenz — simulador interactiu</title>
<meta name="description" content="Tres escenes 3D que es poden girar per a Física de 2n de Batxillerat: camp de dos fils paral·lels (suma vectorial, punt de camp nul i força entre fils), la Terra com a imant (pols magnètics, línies de camp i inclinació de la brúixola) i una espira que travessa un camp amb les gràfiques de Φ(t) i ε(t) (Faraday i Lenz). Pas a pas i amb activitats per a raonar.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
.stage svg{display:block;width:100%;height:auto}
.stage svg text{font-family:var(--f-num);font-size:10.5px;fill:var(--muted)}
#svg{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.rot{cursor:grabbing}
#hP{touch-action:none;cursor:move}
#gsvg{border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:14px;height:3px;display:inline-block;border-radius:2px}
.ctls{display:grid;gap:6px;padding:2px 4px}
.grp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px}
@media (max-width:620px){.grp{grid-template-columns:1fr}}
.grp .span{grid-column:1/-1}
.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:4px 18px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
#stepMsg{margin:0}
</style>
<!--@GC@-->
</head>

<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">

      <p class="lede" data-i18n="lede"></p>

<div class="checks">

</div>
<div class="grp" id="ctE" hidden>
<div class="ctl span"><label for="lam" data-i18n="l_lam"></label><output id="lamL"></output><input type="range" id="lam" min="-90" max="90" step="1" value="40"></div>
</div>
<div class="grp" id="ctI" hidden>
<div class="ctl span"><label for="tau" data-i18n="i_l_t"></label><output id="tauL"></output><input type="range" id="tau" min="0" max="1" step="0.002" value="0"></div>
<div class="ctl"><label for="bf" data-i18n="i_l_B"></label><output id="bfL"></output><input type="range" id="bf" min="0.1" max="1" step="0.05" value="0.5"></div>

<div class="ctl"><label for="rr" data-i18n="i_l_R"></label><output id="rrL"></output><input type="range" id="rr" min="0.5" max="10" step="0.5" value="2"></div>
<div class="ctl"><label for="aa" data-i18n="i_l_a"></label><output id="aaL"></output><input type="range" id="aa" min="5" max="20" step="1" value="10"></div>
<div class="ctl"><label for="bb" data-i18n="i_l_b"></label><output id="bbL"></output><input type="range" id="bb" min="4" max="14" step="1" value="10"></div>
<div class="ctl"><label for="nn" data-i18n="i_l_N"></label><output id="nnL"></output><input type="range" id="nn" min="1" max="20" step="1" value="1"></div>
<div class="ctl"><label data-i18n="i_l_dir"></label><div class="seg" id="dirsw" role="group" style="grid-column:1/-1"><button type="button" data-d="-1" aria-pressed="true" data-i18n="i_dir_in"></button><button type="button" data-d="1" aria-pressed="false" data-i18n="i_dir_out"></button></div></div>

<label class="check"><input type="checkbox" id="cur" checked><span data-i18n="i_c_cur"></span></label>

</div>
</div>
<div class="side">

<dl class="vals" id="readout"></dl>
<p class="sh" data-i18n="s_res"></p>
<dl class="vals" id="results"></dl>
<p class="note" id="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>

"e2.model":"Marc, és veritat que el fil de 20 A crea un camp quatre vegades major, però actua sobre un corrent quatre vegades menor. Sobre el fil 1: F = I₁·L·B₂; sobre el fil 2: F = I₂·L·B₁. Les dues valen μ₀·I₁·I₂·L/(2π·d): tercera llei de Newton.",
"e3.ctx":"L'agulla d'una brúixola apunta amb el seu pol nord cap al nord geogràfic de la Terra. Es discuteix quin pol magnètic hi ha allí.",
"e3.n0":"Pau",
"e3.n1":"Aina",
"e3.s0":"Al nord geogràfic hi ha el pol nord de l'imant terrestre, per això es diu pol nord magnètic.",
"e3.s1":"Prop del nord geogràfic hi ha el pol sud de l'imant terrestre.",
"e3.w0":"Els pols del mateix nom es repel·leixen i els de nom contrari s'atrauen: el que atrau el pol nord de l'agulla ha de ser un pol sud.",
"e3.w1":"Perquè la brúixola apunta en sentit contrari al camp magnètic.",
"e3.w2":"Perquè els pols magnètics i els geogràfics coincideixen exactament.",
"e3.frame":"Pau, al nord geogràfic no pot haver-hi un pol nord magnètic perquè…",
"e3.model":"Pau, el nom «pol nord magnètic» és geogràfic: és el punt de l'hemisferi nord cap on apunten les brúixoles. Però el nord de l'agulla només pot ser atret per un pol sud. Les línies de camp entren a la Terra per allí, com entren pel pol sud d'un imant de barra.",
"d1.q":"El fil 1 porta 5 A i el fil 2, en el mateix sentit, està a 6 cm. Volem que el camp s'anul·le <b>a 2 cm del fil 1</b>. Tria el corrent I₂ i calcula la <b>força per metre</b> entre els fils (mN/m).",
"d1.lc":"Corrent I₂:",
"d1_p":"Amb I₂ = {0} A el camp s'anul·la a {1} cm del fil 1, no a 2 cm.",
"d1_F":"El corrent és el bo, però la força no: F/L = μ₀·I₁·I₂/(2π·d) amb d = 0,06 m.",
"d1_ok":"✔ Ben decidit! 5/2 = I₂/4 → I₂ = 10 A, i F/L = 4π·10⁻⁷·5·10/(2π·0,06) ≈ 0,17 mN/m.",
"d1.more":"Si volguérem el punt nul exactament al mig, quina relació haurien de tindre els corrents? I just damunt d'un dels fils, seria possible?",
"d2.q":"Una expedició vol mesurar el camp on l'agulla s'inclina <b>60°</b>. Tria la latitud magnètica on passa i digues el <b>mòdul del camp</b> allí (µT).",
"d2.lc":"Latitud magnètica:",
"d2_p":"A λ = {0}° la inclinació és de {1}°, no de 60°. Recorda: tan I = 2·tan λ.",
"d2_B":"La latitud és la bona, però el camp no. Mira'l al simulador (pas 4).",
"d2_ok":"✔ Ben decidit! tan 60° = 2·tan λ → λ ≈ 41°, i allí |B| ≈ 47 µT.",
"d2.more":"A quina latitud magnètica la inclinació val 45°? És més o menys de 45°? Per què?",

"i_p1":"<b>Entra.</b> El flux {0} <b>augmenta</b>. Lenz: el corrent induït crea un camp {1} per a oposar-se a eixe augment → corrent <b>{2}</b>. |ε| = N·B·b·v = {3}.",

"i_p4":"<b>Ja és fora.</b> Φ = 0 i ε = 0. L'energia dissipada en la resistència ({0}) és el treball fet per a moure l'espira contra la força magnètica.",

"m5.q":"Una espira d'una volta i 10 cm d'alt entra a 2 m/s en un camp de 0,5 T perpendicular a ella. Calcula la <b>fem induïda</b> (en V) mentre entra.",
"m5_f":"{0} V no és el valor. Mentre entra, l'àrea dins del camp creix a raó de b·v: |ε| = N·B·b·v, amb b en metres.",
"m5_ok":"✔ Missió complida! |ε| = 1·0,5·0,10·2 = 0,1 V.",
"m5.more":"La fem depén del llarg a de l'espira? Canvia'l i mira què canvia a la gràfica i què no.",
"m6.q":"La mateixa espira (ε = 0,1 V mentre entra) té una resistència de 2 Ω. Calcula la <b>intensitat</b> induïda (en mA).",
"m6_f":"{0} mA no és el valor. Llei d'Ohm: I = ε/R; 1 A = 1000 mA.",
"m6_ok":"✔ Missió complida! I = 0,1/2 = 0,05 A = 50 mA.",
"m6.more":"Si l'espira fora d'un material amb el doble de resistència, canviaria la fem? I la intensitat? I la força de frenada?",
"m7.q":"Una espira quadrada de 10 cm de costat i una volta està tota dins d'un camp de 0,5 T perpendicular a ella. Calcula el <b>flux</b> (en mWb).",
"m7_f":"{0} mWb no és el valor. Φ = B·S amb S en m² (10 cm × 10 cm = 0,01 m²); 1 Wb = 1000 mWb.",
"m7_ok":"✔ Missió complida! Φ = 0,5·0,01 = 0,005 Wb = 5 mWb.",
"m7.more":"En eixe moment el flux és màxim. Quant val la fem? Per què?",
"m8.q":"Una espira de 2 voltes i 10 cm d'alt entra en un camp de 0,5 T. A quina <b>velocitat</b> (m/s) ha d'anar perquè la fem induïda siga de 0,3 V?",
"m8_f":"Amb v = {0} m/s la fem seria de {1} V. Aïlla v en |ε| = N·B·b·v.",
"m8_ok":"✔ Missió complida! v = ε/(N·B·b) = 0,3/(2·0,5·0,10) = 3 m/s.",
"m8.more":"Amb quina altra magnitud, a més de la velocitat, podries triplicar la fem sense tocar el camp?",
"s7.q":"Mentre l'espira està totalment dins del camp uniforme hi ha corrent induït.",
"s7.h":"Ves a la fase 3 i mira la gràfica de ε.",
"s7.e":"Mai. Dins del camp uniforme el flux és constant; sense variació de flux no hi ha fem (ε = −dΦ/dt = 0) ni corrent.",
"s8.q":"El corrent induït té el mateix sentit quan l'espira entra que quan ix.",
"s8.h":"Compara les fases 2 i 4.",
"s8.e":"Mai. En entrar el flux augmenta i en eixir disminueix: el corrent s'oposa a canvis contraris i, per tant, canvia de sentit.",
"s9.q":"Si l'espira entra més de pressa, la fem induïda és més gran.",
"s9.h":"Canvia v i mira l'altura dels esglaons de ε(t).",
"s9.e":"Sempre. |ε| = N·B·b·v és proporcional a la velocitat: el flux canvia el mateix, però en menys temps.",
"s10.q":"Si hi ha flux magnètic a través de l'espira, hi ha fem induïda.",
"s10.h":"Busca un moment amb Φ ≠ 0 i ε = 0.",
"s10.e":"De vegades. Només quan el flux canvia. Amb l'espira tota dins hi ha flux (i és el màxim) però la fem és zero.",
"s10.cxq":"Amb a = 10 cm i v = 1 m/s, un instant t",
"s10_cx_no":"En t = {0} s no val: o el flux és zero o la fem no ho és. Busca un instant amb l'espira tota dins.",
"s10_cx":"✔ En t = {0} s l'espira està tota dins: Φ = 5 mWb i ε = 0.",
"s11.q":"La força magnètica sobre l'espira va en contra del moviment, tant en entrar com en eixir.",
"s11.h":"Mira la fletxa de la força en les fases 2 i 4.",
"s11.e":"Sempre. És la llei de Lenz en versió mecànica: el corrent induït s'oposa a la causa que el produeix, que és el moviment. Si la força ajudara, l'espira s'acceleraria sola i tindríem energia de franc.",
"s12.q":"La fem induïda depén de la resistència de l'espira.",
"s12.h":"Canvia R i mira ε i I al panell.",
"s12.e":"Mai. La fem la fixa la variació de flux (N·B·b·v). La resistència decideix quanta intensitat circula: I = ε/R.",
"e4.ctx":"Una espira travessa una regió amb camp uniforme. Es discuteix en quin moment la fem induïda és màxima.",
"e4.n0":"Pau",
"e4.n1":"Aina",
"e4.s0":"Com més flux, més fem: és màxima quan l'espira està tota dins del camp.",
"e4.s1":"Quan està tota dins la fem és zero; només n'hi ha mentre entra i mentre ix.",
"e4.w0":"La fem no depén del valor del flux sinó del ritme al qual canvia (ε = −dΦ/dt): amb l'espira tota dins, el flux és màxim però constant.",
"e4.w1":"Perquè dins del camp les forces sobre els costats de l'espira es cancel·len.",
"e4.w2":"Perquè el flux només existeix a les vores del camp.",
"e4.frame":"Pau, quan l'espira està tota dins no hi ha fem perquè…",
"e4.model":"Pau, mira les dues gràfiques alhora: la fem és el pendent (canviat de signe) de la gràfica del flux. On Φ puja o baixa hi ha esglaó de ε; on Φ és horitzontal, encara que siga al màxim, ε = 0.",
"e5.ctx":"El camp va cap avall i l'espira hi està entrant. Es discuteix el sentit del camp creat pel corrent induït.",
"e5.n0":"Marc",
"e5.n1":"Clara",
"e5.s0":"El corrent induït crea un camp cap avall, per a reforçar el camp que troba.",
"e5.s1":"El corrent induït crea un camp cap amunt, i per això circula en sentit antihorari.",
"e5.w0":"El flux cap avall està augmentant, i el corrent induït s'oposa a eixe augment creant un camp en sentit contrari (cap amunt); per la regla de la mà dreta, això és un corrent antihorari.",
"e5.w1":"Perquè el corrent induït sempre és antihorari.",
"e5.w2":"Perquè el camp induït sempre té el mateix sentit que el camp exterior.",
"e5.frame":"Marc, el camp induït no pot reforçar l'augment de flux perquè…",
"e5.model":"Marc, si el corrent induït reforçara l'augment de flux, eixe flux major induiria més corrent, que el reforçaria encara més: energia del no-res. Lenz diu el contrari: s'oposa al canvi. Flux cap avall que creix → camp induït cap amunt → corrent antihorari.",
"e6.ctx":"El camp va cap avall i l'espira n'està eixint. Es discuteix el sentit del camp induït.",
"e6.n1":"Pau",
"e6.n0":"Clara",
"e6.s1":"Cap a fora, com en entrar: Lenz diu que el camp induït sempre s'oposa al camp exterior.",
"e6.s0":"Cap a dins: ara el flux disminueix i el corrent induït intenta mantindre'l.",
"e6.w0":"La llei de Lenz parla d'oposar-se a la variació del flux, no al camp: si el flux cap avall disminueix, el camp induït va cap avall per a compensar la pèrdua.",
"e6.w1":"Perquè en eixir el camp exterior canvia de sentit.",
"e6.w2":"Perquè el corrent induït sempre té el sentit del moviment.",
"e6.frame":"Pau, en eixir el camp induït no va cap amunt perquè…",
"e6.model":"Pau, Lenz no s'oposa al camp sinó al canvi de flux. En entrar, el flux cap avall creixia i el camp induït anava cap amunt. En eixir, eixe flux minva, i el camp induït va cap avall per a sostindre'l: per això el corrent canvia de sentit i passa a ser horari.",
"d3.q":"Vols usar l'espira com a <b>fre magnètic</b> i que la força de frenada siga la major possible (B = 0,5 T, b = 10 cm, v = 2 m/s, 1 volta). Tria la resistència i calcula la <b>força</b> (en mN).",

"e1.w0":"El sentido de cada campo depende del sentido de la corriente y del lado del hilo en el que está el punto. En el medio, el punto queda a la derecha de un hilo y a la izquierda del otro: los dos cambios se compensan y los campos tienen el mismo sentido.",

"e2.s0":"Los dos hilos reciben la misma fuerza, aunque las corrientes sean distintas.",
"e2.w0":"La fuerza sobre cada hilo es (campo del otro) × (corriente propia): en los dos casos sale F/L = μ₀·I₁·I₂/(2π·d). Además, es un par de acción y reacción.",

"e2.frame":"Marc, las dos fuerzas son iguales porque…",

"e3.s1":"Cerca del norte geográfico está el polo sur del imán terrestre.",
"e3.w0":"Los polos del mismo nombre se repelen y los de nombre contrario se atraen: lo que atrae al polo norte de la aguja tiene que ser un polo sur.",
"e3.w1":"Porque la brújula apunta en sentido contrario al campo magnético.",
"e3.w2":"Porque los polos magnéticos y los geográficos coinciden exactamente.",
"e3.frame":"Pau, en el norte geográfico no puede haber un polo norte magnético porque…",

const bf=$('#bf'),vv=$('#vv'),rr=$('#rr'),aa=$('#aa'),bb=$('#bb'),nn=$('#nn'),tauEl=$('#tau'),curEl=$('#cur');
const btnPlay=$('#btnPlay'),btnStep=$('#btnStep'),readout=$('#readout'),results=$('#results');
let scene='w',s1=1,s2=1,P={x:2,y:6},stW=1,stE=1,sB=-1,tau=0,playing=false,last=null;
const f1=n=>n.toFixed(1);
const A=[-Math.sin(TILT),0,Math.cos(TILT)],E1=[Math.cos(TILT),0,Math.sin(TILT)];
/* ----- càmera ortogràfica: z cap amunt; az gira al voltant de z; el = elevació (90° = des de dalt) ----- */
const CAM0={w:{az:-25,el:32},e:{az:0,el:10},i:{az:-20,el:34}},ELMIN={w:12,e:-80,i:12},TOP={az:0,el:90};
const CAM={w:{...CAM0.w},e:{...CAM0.e},i:{...CAM0.i}};
const VIEW={w:{W:600,H:340,cx:300,cy:182,S:10,ox:0},e:{W:600,H:340,cx:300,cy:170,S:68,ox:0},i:{W:600,H:230,cx:300,cy:128,S:7.2,ox:15}};
let PR;
function setProj(){const c=CAM[scene],a=c.az*RAD,e=c.el*RAD;PR={ca:Math.cos(a),sa:Math.sin(a),se:Math.sin(e),ce:Math.cos(e),v:VIEW[scene]};}
function pr(p){const v=PR.v,x=p[0]-v.ox,ux=x*PR.ca+p[1]*PR.sa,wy=-x*PR.sa+p[1]*PR.ca;return [v.cx+v.S*ux,v.cy-v.S*(wy*PR.se+p[2]*PR.ce),-wy*PR.ce+p[2]*PR.se];}
function fmtU(x,u){const a=Math.abs(x);if(a<1e-15)return '0 '+u;if(a>=1)return fmt(x,2)+' '+u;if(a>=1e-3)return fmt(x*1e3,2)+' m'+u;if(a>=1e-6)return fmt(x*1e6,2)+' µ'+u;return fmt(x*1e9,2)+' n'+u;}
const uT=x=>fmt(x,x<10?2:1)+' µT';
const bg=()=>{const v=PR.v;return '<rect x="1" y="1" width="'+(v.W-2)+'" height="'+(v.H-2)+'" rx="6" fill="var(--stage)" stroke="var(--line)"/>';};
const lbl=(x,y,s,col,anc)=>'<text x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+(anc||'middle')+'" style="fill:'+col+';font-weight:700">'+s+'</text>';
function arrow2(x,y,dx,dy,len,color,w){
  const h=Math.min(Math.max(4,len*.45),Math.max(7,w*2.7)),x2=x+dx*len,y2=y+dy*len,px=-dy,py=dx;
  return '<line x1="'+f1(x)+'" y1="'+f1(y)+'" x2="'+f1(x2-dx*h*.6)+'" y2="'+f1(y2-dy*h*.6)+'" stroke="'+color+'" stroke-width="'+w+'"/><polygon points="'+f1(x2)+','+f1(y2)+' '+f1(x2-dx*h+px*h*.5)+','+f1(y2-dy*h+py*h*.5)+' '+f1(x2-dx*h-px*h*.5)+','+f1(y2-dy*h-py*h*.5)+'" fill="'+color+'"/>';
}
/* símbol ⊙ / ⊗ per a un vector que apunta cap a l'observador o se n'allunya */
function sym(x,y,out,color,r){
  r=r||7;const k=r*.5;
  return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+r+'" fill="var(--panel)" stroke="'+color+'" stroke-width="2"/>'+(out?'<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r*.3)+'" fill="'+color+'"/>':'<path d="M'+f1(x-k)+','+f1(y-k)+'L'+f1(x+k)+','+f1(y+k)+'M'+f1(x+k)+','+f1(y-k)+'L'+f1(x-k)+','+f1(y+k)+'" stroke="'+color+'" stroke-width="1.8"/>');
}
/* fletxa 3D de p a q (coordenades del món) */
function arr3(p,q,color,w,lab,r){
  w=w||2.6;const a=pr(p),b=pr(q),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);
  const L3=Math.hypot(q[0]-p[0],q[1]-p[1],q[2]-p[2])*PR.v.S;
  if(L3<1.5)return '';
  if(L<Math.min(7,L3*.35))return sym(a[0],a[1],b[2]>a[2],color,r)+(lab?lbl(a[0]+13,a[1]-9,lab,color):'');
  return arrow2(a[0],a[1],dx/L,dy/L,L,color,w)+(lab?lbl(b[0]+dx/L*10,b[1]+dy/L*10+3.5,lab,color):'');
}
const ln=(p,q,attr)=>{const a=pr(p),b=pr(q);return '<line x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" '+attr+'/>';};
const poly=(pts,attr,closed)=>'<'+(closed?'polygon':'polyline')+' points="'+pts.map(p=>{const q=pr(p);return f1(q[0])+','+f1(q[1]);}).join(' ')+'" '+attr+'/>';
const circ=(x,y,r,z,n)=>{const o=[];for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;o.push([x+r*Math.cos(a),y+r*Math.sin(a),z]);}return o;};

/* ================= escena 1: dos fils ================= */
/* camp d'un fil en µT (x, y en cm; s = +1 corrent cap amunt, gir antihorari vist des de dalt) */
function Bw(xw,I,s,x,y){const dx=x-xw,dy=y,r2=dx*dx+dy*dy;if(r2<1e-6)return [0,0];const k=MU*I*s/(2*Math.PI*1e-2*r2)*1e6;return [-dy*k,dx*k];}
function fixP(){
  const d=+dd.value;
  if(lineEl.checked)P.y=0;
  P.x=clamp(P.x,-22,22);P.y=clamp(P.y,-12,12);
  [-d/2,d/2].forEach(xw=>{const r=Math.hypot(P.x-xw,P.y);if(r<1){if(r<1e-6){P.x=xw+1;P.y=0;}else if(lineEl.checked){P.x=xw+(P.x>=xw?1:-1);}else{P.x=xw+(P.x-xw)/r;P.y=P.y/r;}}});
}
function W(){
  const I1=+i1.value,I2=+i2.value,d=+dd.value,x1=-d/2,x2=d/2;
  const b1=Bw(x1,I1,s1,P.x,P.y),b2=Bw(x2,I2,s2,P.x,P.y),b=[b1[0]+b2[0],b1[1]+b2[1]];
  let nul=null,nk,nd=0,nw=1;
  if(I1===0||I2===0)nk='one';
  else if(s1===s2){nd=d*I1/(I1+I2);nul=x1+nd;nk='in';}
  else if(I1===I2)nk='eq';
  else if(I1<I2){nd=d*I1/(I2-I1);nul=x1-nd;nk='out';nw=1;}
  else{nd=d*I2/(I1-I2);nul=x2+nd;nk='out';nw=2;}
  return {I1,I2,d,x1,x2,b1,b2,b,nul,nk,nd,nw,r1:Math.hypot(P.x-x1,P.y),r2:Math.hypot(P.x-x2,P.y),
    m1:Math.hypot(b1[0],b1[1]),m2:Math.hypot(b2[0],b2[1]),m:Math.hypot(b[0],b[1]),F:MU*I1*I2/(2*Math.PI*d*1e-2)};
}
function drawW(){
  const w=W(),top=CAM.w.el>78,Pw=[P.x,P.y,0];let o=bg();
  const wires=[[w.x1,w.I1,s1,'var(--pa)','I₁'],[w.x2,w.I2,s2,'var(--pb)','I₂']];
  /* anell de camp al voltant d'un fil, amb la fletxa en el punt més pròxim a la càmera */
  const ring=(x,z,s,col,op)=>{const a0=Math.atan2(-PR.ca,PR.sa),c=Math.cos(a0),sn=Math.sin(a0),R=2.6,px=x+R*c,py=R*sn,tx=-sn*s,ty=c*s;
    return '<g opacity="'+op+'">'+poly(circ(x,0,R,z,48),'fill="none" stroke="'+col+'" stroke-width="1.5"')+arr3([px-tx*.8,py-ty*.8,z],[px+tx*1.1,py+ty*1.1,z],col,1.5)+'</g>';};
  wires.forEach(([x,I,s,col])=>{o+=ln([x,0,-11],[x,0,0],'stroke="'+col+'" stroke-width="3" opacity=".4"'+(I===0?' stroke-dasharray="4 4"':''));if(I>0&&!top)o+=ring(x,-7,s,col,.3);});
  o+=poly([[-23,-13,0],[23,-13,0],[23,13,0],[-23,13,0]],'fill="var(--pa)" fill-opacity=".05" stroke="var(--line)"',true);
  if(stW>=3&&ndlEl.checked){
    for(let x=-21;x<=21;x+=3)for(let y=-12;y<=12;y+=3){
      if(Math.hypot(x-w.x1,y)<1.6||Math.hypot(x-w.x2,y)<1.6)continue;
      const a=Bw(w.x1,w.I1,s1,x,y),b=Bw(w.x2,w.I2,s2,x,y),bx=a[0]+b[0],by=a[1]+b[1],m=Math.hypot(bx,by);
      if(m<.05)continue;
      const ux=bx/m*.95,uy=by/m*.95;
      o+='<g opacity="'+clamp(.16+.2*Math.log10(m+1),.16,.6).toFixed(2)+'">'+arr3([x-ux,y-uy,0],[x+ux,y+uy,0],'var(--muted)',1.2)+'</g>';
    }
  }
  o+=ln([-23,0,0],[23,0,0],'stroke="var(--line)" stroke-dasharray="2 4"');
  const da=pr([w.x1,-11.6,0]),db=pr([w.x2,-11.6,0]);
  o+=ln([w.x1,-11.6,0],[w.x2,-11.6,0],'stroke="var(--muted)"')+'<text x="'+f1((da[0]+db[0])/2)+'" y="'+f1((da[1]+db[1])/2+13)+'" text-anchor="middle">d = '+w.d+' cm</text>';
  /* escala comuna dels vectors (cm per µT) */
  let k=.18;const mx=Math.max(stW>=1?w.m1:0,stW>=2?w.m2:0,stW>=3?w.m:0)*k;if(mx>9.5)k*=9.5/mx;
  const vec=(xw,b,m,col,lab)=>{
    let q=poly(circ(xw,0,Math.hypot(P.x-xw,P.y),0,72),'fill="none" stroke="'+col+'" stroke-dasharray="3 5" opacity=".5"')+ln([xw,0,0],Pw,'stroke="'+col+'" stroke-dasharray="2 3" opacity=".75"');
    if(m>1e-9)q+=arr3(Pw,[P.x+b[0]*k,P.y+b[1]*k,0],col,2.8,lab);
    return q;
  };
  if(stW>=1)o+=vec(w.x1,w.b1,w.m1,'var(--pa)','B₁');
  if(stW>=2)o+=vec(w.x2,w.b2,w.m2,'var(--pb)','B₂');
  const pp=pr(Pw);
  if(stW>=3){
    const t1=[P.x+w.b1[0]*k,P.y+w.b1[1]*k,0],t2=[P.x+w.b2[0]*k,P.y+w.b2[1]*k,0],t3=[P.x+w.b[0]*k,P.y+w.b[1]*k,0];
    o+=ln(t1,t3,'stroke="var(--muted)" stroke-dasharray="3 3"')+ln(t2,t3,'stroke="var(--muted)" stroke-dasharray="3 3"');
    if(w.m>.02)o+=arr3(Pw,t3,'var(--ok)',3.4,'B');
    else o+=lbl(pp[0],pp[1]-12,t('lbl_nul'),'var(--ok)');
  }
  if(stW>=4&&w.nul!==null&&Math.abs(w.nul)<22.5){
    const n=w.nul,q=pr([n,0,0]);
    o+=poly(circ(n,0,.85,0,28),'fill="none" stroke="var(--ok)" stroke-width="2"')+ln([n-.6,-.6,0],[n+.6,.6,0],'stroke="var(--ok)" stroke-width="2"')+ln([n-.6,.6,0],[n+.6,-.6,0],'stroke="var(--ok)" stroke-width="2"')+lbl(q[0],q[1]-13,t('lbl_nul'),'var(--ok)');
  }
  wires.forEach(([x,I,s,col,lab])=>{
    const q0=pr([x,0,0]),qt=pr([x,0,12]);
    if(I===0)o+=ln([x,0,0],[x,0,12],'stroke="'+col+'" stroke-width="3.2" stroke-dasharray="4 4"')+'<circle cx="'+f1(q0[0])+'" cy="'+f1(q0[1])+'" r="5" fill="var(--panel)" stroke="'+col+'" stroke-dasharray="2 2"/>';
    else if(s>0)o+=ln([x,0,0],[x,0,8],'stroke="'+col+'" stroke-width="3.2"')+ring(x,6,s,col,.6)+arr3([x,0,8],[x,0,12],col,3.2,'',9);
    else o+=ln([x,0,0],[x,0,12],'stroke="'+col+'" stroke-width="3.2"')+ring(x,6,s,col,.6)+arr3([x,0,12],[x,0,7.5],col,3.2,'',9);
    o+=top?lbl(q0[0],q0[1]+24,lab+' = '+fmt(I,1)+' A',col):lbl(qt[0],qt[1]-8,lab+' = '+fmt(I,1)+' A',col);
  });
  if(stW>=5&&w.F>0){
    const L=clamp(1.6+w.F*8e3,1.8,5.5),dir=s1===s2?1:-1,z=top?0:3,y=top?2.6:0;
    o+=arr3([w.x1,y,z],[w.x1+dir*L,y,z],'var(--warn)',3.2,'F')+arr3([w.x2,y,z],[w.x2-dir*L,y,z],'var(--warn)',3.2,'F');
  }
  o+='<circle cx="'+f1(pp[0])+'" cy="'+f1(pp[1])+'" r="5.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="1.5"/>'+lbl(pp[0]-10,pp[1]+15,'P','var(--ink)');
  dyn.innerHTML=o;hP.setAttribute('cx',f1(pp[0]));hP.setAttribute('cy',f1(pp[1]));
}

/* ================= escena 2: la Terra (dipol amb moment cap al sud geogràfic) ================= */
const add3=(a,b,k)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];
function earth(){
  const l=+lam.value*RAD,c=Math.cos(l),sn=Math.sin(l),m=Math.sqrt(1+3*sn*sn);
  const rh=[c*E1[0]+sn*A[0],0,c*E1[2]+sn*A[2]],nh=[-sn*E1[0]+c*A[0],0,-sn*E1[2]+c*A[2]];
  const bh=[(c*nh[0]-2*sn*rh[0])/m,0,(c*nh[2]-2*sn*rh[2])/m];
  const I=Math.abs(+lam.value)===90?(+lam.value):Math.atan(2*Math.tan(l))/RAD;
  return {rh,nh,bh,m:B0*m,I,H:B0*c,Z:2*B0*Math.abs(sn),lam:+lam.value};
}
function drawE(){
  const e=earth(),V=PR.v,R=V.S;let back='',front='';
  const hid=q=>Math.hypot(q[0]-V.cx,q[1]-V.cy)<R-.5&&q[2]<0;
  const put=(q,s)=>{if(q[2]<0)back+=s;else front+=s;};
  /* polilínia 3D repartida entre darrere i davant de l'esfera; el que queda tapat no es dibuixa */
  const path3=(pts,attr)=>{
    let cur=null,L0=null;
    const flush=()=>{if(cur&&cur.length>1){const s='<polyline points="'+cur.join(' ')+'" '+attr+'/>';if(L0==='b')back+=s;else front+=s;}cur=null;};
    pts.forEach(p=>{const q=pr(p);if(hid(q)){flush();return;}
      const L=q[2]<0?'b':'f',s=f1(q[0])+','+f1(q[1]);
      if(!cur){cur=[s];L0=L;return;}
      if(L!==L0){cur.push(s);flush();cur=[s];L0=L;return;}
      cur.push(s);});
    flush();
  };
  const LA='fill="none" stroke="var(--muted)" stroke-width="1.25"';
  if(stE>=2){
    [1.5,2.2,3.3,5].forEach(L=>{for(let j=0;j<6;j++){
      if(j%3&&(L<2||L>4))continue;
      const ph=j*60*RAD,ef=[E1[0]*Math.cos(ph),Math.sin(ph),E1[2]*Math.cos(ph)],lm=Math.acos(Math.sqrt(1/L)),pts=[];
      for(let i=0;i<=70;i++){const l=-lm+2*lm*i/70,c=Math.cos(l),r=L*c*c;pts.push(add3([r*c*ef[0],r*c*ef[1],r*c*ef[2]],A,r*Math.sin(l)));}
      path3(pts,LA);
      const pm=[L*ef[0],L*ef[1],L*ef[2]],q=pr(pm);
      if(!hid(q)&&Math.abs(q[0]-300)<296&&Math.abs(q[1]-170)<166)put(q,arr3(add3(pm,A,-.1),add3(pm,A,.16),'var(--muted)',1.25));
    }});
    [1,-1].forEach(sg=>{const pts=[];for(let i=0;i<=10;i++)pts.push(add3([0,0,0],A,sg*(1+1.7*i/10)));path3(pts,LA);
      const pm=add3([0,0,0],A,sg*1.9),q=pr(pm);if(!hid(q))put(q,arr3(add3(pm,A,.1),add3(pm,A,-.16),'var(--muted)',1.25));});
  }
  /* reixeta de l'esfera (només la cara visible) */
  const GA='fill="none" stroke="var(--muted)" stroke-width=".8" opacity=".4"';
  [-60,-30,0,30,60].forEach(la=>{const c=Math.cos(la*RAD);path3(circ(0,0,c,Math.sin(la*RAD),72),GA);});
  for(let lo=0;lo<180;lo+=30){const pts=[];for(let i=0;i<=72;i++){const a=i/72*2*Math.PI;pts.push([Math.cos(a)*Math.cos(lo*RAD),Math.cos(a)*Math.sin(lo*RAD),Math.sin(a)]);}path3(pts,GA);}
  /* eix de rotació i pols */
  const AX='fill="none" stroke="var(--ink)" stroke-width="1.5"';
  path3([[0,0,1],[0,0,1.25],[0,0,1.5]],AX);path3([[0,0,-1],[0,0,-1.25],[0,0,-1.5]],AX);
  const gn=pr([0,0,1.5]),gs=pr([0,0,-1.5]);
  front+=lbl(gn[0],gn[1]-7,t('e_gn'),'var(--ink)')+lbl(gs[0],gs[1]+15,t('e_gs'),'var(--ink)');
  if(stE>=2){
    const n=pr(A),s=pr([-A[0],0,-A[2]]);
    if(n[2]>-.3)front+='<circle cx="'+f1(n[0])+'" cy="'+f1(n[1])+'" r="3.8" fill="var(--pa)"/>'+lbl(n[0]-9,n[1]-9,t('e_mn'),'var(--pa)','end');
    if(s[2]>-.3)front+='<circle cx="'+f1(s[0])+'" cy="'+f1(s[1])+'" r="3.8" fill="var(--pb)"/>'+lbl(s[0]+9,s[1]+16,t('e_ms'),'var(--pb)','start');
  }
  /* brúixola */
  const c=[e.rh[0]*1.36,0,e.rh[2]*1.36],qc=pr(c);
  let cp='';
  if(stE>=4)cp+=ln(add3(c,e.nh,-.45),add3(c,e.nh,.45),'stroke="var(--ok)" stroke-dasharray="4 3" stroke-width="1.6"');
  cp+=ln(add3(c,e.bh,-.3),c,'stroke="var(--pa)" stroke-width="6" stroke-linecap="round"')+arr3(c,add3(c,e.bh,.36),'var(--pb)',6)+'<circle cx="'+f1(qc[0])+'" cy="'+f1(qc[1])+'" r="2.4" fill="var(--panel)" stroke="var(--ink)"/>';
  if(stE>=4){const ql=pr(add3(c,e.rh,.42));cp+=lbl(ql[0],ql[1]+4,'I = '+fmt(Math.abs(e.I),0)+'°','var(--ok)');}
  put(qc,cp);
  let o=bg()+'<g opacity=".4">'+back+'</g>';
  if(stE>=3){
    const a=pr(add3([0,0,0],A,.62)),b=pr(add3([0,0,0],A,-.62)),m=pr([0,0,0]),ls=pr(add3([0,0,0],A,.33)),lw=pr(add3([0,0,0],A,-.33));
    o+='<line x1="'+f1(m[0])+'" y1="'+f1(m[1])+'" x2="'+f1(a[0])+'" y2="'+f1(a[1])+'" stroke="var(--pa)" stroke-width="22"/><line x1="'+f1(m[0])+'" y1="'+f1(m[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" stroke="var(--pb)" stroke-width="22"/>';
    front='<text x="'+f1(ls[0])+'" y="'+f1(ls[1]+4.5)+'" text-anchor="middle" style="fill:var(--panel);font-weight:700;font-size:13px">S</text><text x="'+f1(lw[0])+'" y="'+f1(lw[1]+4.5)+'" text-anchor="middle" style="fill:var(--panel);font-weight:700;font-size:13px">N</text>'+front;
  }
  o+='<defs><radialGradient id="gE" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="var(--panel)"/><stop offset="1" stop-color="var(--line)"/></radialGradient></defs><circle cx="'+V.cx+'" cy="'+V.cy+'" r="'+R+'" fill="url(#gE)" fill-opacity="'+(stE>=3?.38:.94)+'" stroke="var(--muted)" stroke-width="1.5"/>'+front;
  dyn.innerHTML=o;
}
function incTxt(e){const a=fmt(Math.abs(e.I),0)+'°';return Math.abs(e.I)<.5?a+' ('+t('horiz')+')':a+' '+t(e.I>0?'down':'up');}

/* ================= escena 3: espira que travessa una regió amb camp ================= */
function st(){
  const B=+bf.value,v=+vv.value,R=+rr.value,a=+aa.value,b=+bb.value,N=+nn.value;
  const span=WR+a-X0+TAIL,x=X0+tau*span,T=span/100/v,tm=tau*T;
  const l=clamp(Math.min(x,WR)-Math.max(x-a,0),0,a);
  const ph=x<=1e-9?0:x<a-1e-9?1:x<=WR+1e-9?2:x<WR+a-1e-9?3:4,dl=ph===1?1:ph===3?-1:0;
  const E0=N*B*(b/100)*v,phi=sB*N*B*(b/100)*(l/100),e=-sB*E0*dl,I=e/R,F=N*B*Math.abs(I)*(b/100);
  return {B,v,R,a,b,N,span,x,T,t:tm,l,ph,dl,E0,phi,e,I,F,phiM:N*B*(b/100)*(a/100),Q:2*E0*E0/R*(a/100/v)};
}
