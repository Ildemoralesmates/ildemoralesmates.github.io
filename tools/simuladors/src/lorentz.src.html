<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partícula en un camp magnètic — simulador interactiu</title>
<meta name="description" content="Una càrrega que entra en un camp magnètic uniforme gira: canvia la partícula (protó, electró, alfa, positró), la velocitat, el camp B i l’angle, i mira el radi, el període i l’hèlix. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d’altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
.stage svg{display:block;width:100%;height:auto}
.stage svg text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:14px;height:3px;display:inline-block;border-radius:2px}
.ctls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;padding:2px 4px}
@media (max-width:620px){.ctls{grid-template-columns:1fr}}
.ctls .span{grid-column:1/-1}
.ctl select{grid-column:1/-1;width:100%}
.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:4px 18px}
.cmp{grid-column:1/-1;display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;border-top:1px dashed var(--line);padding-top:6px}
.cmp.show{display:grid}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp output{color:var(--pb)}
.btns{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
.vals dd.b,.vals dt.b{color:var(--pb)}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="stage"><svg id="svg" viewBox="0 0 600 300" role="img" data-i18n-aria="aria.svg" aria-label=""></svg></div>
<div class="legend">
<span><span class="swatch" style="background:var(--pa)"></span><span data-i18n="lg_a"></span></span>
<span><span class="swatch" style="background:var(--pb)"></span><span data-i18n="lg_b"></span></span>
<span><span class="swatch" style="background:var(--ok)"></span><span data-i18n="lg_v"></span></span>
<span><span class="swatch" style="background:var(--warn)"></span><span data-i18n="lg_f"></span></span>
</div>
<div class="ctls">
<div class="btns"><button class="btn primary" id="btnPlay" type="button"></button><button class="btn" id="btnReset" type="button" data-i18n="reset"></button>
<select id="speed" aria-label="Velocitat"><option value="0.5" data-i18n="sp_slow"></option><option value="1" selected data-i18n="sp_norm"></option><option value="2" data-i18n="sp_fast"></option></select></div>
<div class="ctl span"><label for="ph" data-i18n="l_ph"></label><output id="phL"></output><input type="range" id="ph" min="0" max="3" step="0.01" value="0"></div>
<div class="ctl"><label for="partA" data-i18n="l_part"></label><select id="partA">
<option value="0" selected data-i18n="pn_p"></option><option value="1" data-i18n="pn_e"></option><option value="2" data-i18n="pn_a"></option><option value="3" data-i18n="pn_pos"></option></select></div>
<div class="ctl"><label for="va" data-i18n="l_v"></label><output id="vaL"></output><input type="range" id="va" min="1" max="50" step="1" value="20"></div>
<div class="ctl"><label for="bf" data-i18n="l_B"></label><output id="bfL"></output><input type="range" id="bf" min="0.05" max="2" step="0.05" value="0.5"></div>
<div class="ctl"><label for="al" data-i18n="l_al"></label><output id="alL"></output><input type="range" id="al" min="0" max="90" step="5" value="90"></div>
<div class="ctl"><label data-i18n="l_dir"></label><div class="seg" id="dirsw" role="group" style="grid-column:1/-1"><button type="button" data-d="in" aria-pressed="true" data-i18n="dir_in"></button><button type="button" data-d="out" aria-pressed="false" data-i18n="dir_out"></button></div></div>
<div class="checks">
<label class="check"><input type="checkbox" id="cmp"><span data-i18n="c_cmp"></span></label>
<label class="check"><input type="checkbox" id="vec" checked><span data-i18n="c_vec"></span></label>
<label class="check"><input type="checkbox" id="lock"><span data-i18n="c_lock"></span></label>
</div>
<div class="cmp" id="cmpBlock">
<div class="ctl"><label for="partB" data-i18n="l_partb"></label><select id="partB">
<option value="0" data-i18n="pn_p"></option><option value="1" selected data-i18n="pn_e"></option><option value="2" data-i18n="pn_a"></option><option value="3" data-i18n="pn_pos"></option></select></div>
<div class="ctl"><label for="vb" data-i18n="l_vb"></label><output id="vbL"></output><input type="range" id="vb" min="1" max="50" step="1" value="20"></div>
</div>
</div>
</div>
<div class="side">
<p class="sh" data-i18n="s_live"></p>
<dl class="vals" id="readout"></dl>
<p class="sh" data-i18n="s_res"></p>
<dl class="vals" id="results"></dl>
<p class="note" data-i18n="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

  if(o.c){cmpEl.checked=true;partB.value=String(dv(o.c.p,1));vbEl.value=dv(o.c.v,20);}else cmpEl.checked=false;

  speedEl.value=o.slow?'0.5':'1';
  playing=false;last=null;turns=clamp(dv(o.ph,0),0,3);

  if(o.run)play();
  RZ.show($('#svg'));
}
