<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equacions com a balança</title>
<meta name="description" content="Cada bloc x pesa el mateix. Aïlla la x fent la mateixa operació als dos costats. Prova de fer-ho només a un i mira què passa. Amb activitats per a raonar.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
#svg{display:block;width:100%;height:auto}
#svg .beam{stroke:var(--ink);stroke-width:9;stroke-linecap:round}
#svg .pivot{fill:var(--panel);stroke:var(--ink);stroke-width:4}
#svg .stand{fill:var(--ink)}
#svg .rope{stroke:var(--muted);stroke-width:2}
#svg .plate{fill:var(--ink)}
#svg .bx{fill:var(--pa);stroke:var(--ink);stroke-width:1.5}
#svg .bu{fill:var(--pb);stroke:var(--ink);stroke-width:1.2}
#svg .bxl{fill:var(--panel);font:600 22px var(--f-num)}
.eqbig{font:700 clamp(1.4rem,3.6vw,2rem)/1.2 var(--f-num);letter-spacing:-.01em}
.eqbig.off{color:var(--warn)}
.read{display:grid;gap:8px;font-size:15px}
.read .ok{color:var(--ok);font-weight:700;margin:0}
.read .bad{color:var(--warn);font-weight:700;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn.op{font-family:var(--f-num);min-width:56px}
.log{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.log span{font:500 12.5px var(--f-num);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>
<div class="simgrid">
<div class="simcv"><div class="stage"><svg id="svg" viewBox="0 0 640 420" role="img" data-i18n-aria="aria.svg" aria-label=""></svg></div></div>
<div class="side">
<div class="read">
<div class="eqbig" id="eq"></div>
<div class="note" id="orig"></div>
<div id="msg" aria-live="polite"></div>
</div>
<fieldset>
<legend data-i18n="gt"></legend>
<div class="seg" role="group" data-i18n-aria="aria.side" aria-label="">
<button type="button" id="both" aria-pressed="true" data-i18n="both"></button>
<button type="button" id="left" aria-pressed="false" data-i18n="left"></button>
</div>
<div class="btns">
<button class="btn op" type="button" data-op="u+">+ 1</button>
<button class="btn op" type="button" data-op="u-">− 1</button>
<button class="btn op" type="button" data-op="x+">+ x</button>
<button class="btn op" type="button" data-op="x-">− x</button>
</div>
<div class="btns">
<button class="btn op" type="button" data-op="d2">÷ 2</button>
<button class="btn op" type="button" data-op="d3">÷ 3</button>
<button class="btn op" type="button" data-op="d4">÷ 4</button>
</div>
<div class="btns">
<button class="btn" type="button" id="undo" data-i18n="undo"></button>
<button class="btn primary" type="button" id="new" data-i18n="new"></button>
</div>
<div class="log" id="log" role="group" data-i18n-aria="aria.log" aria-label=""></div>
</fieldset>
</div>
</div>
<div class="idea" data-i18n-html="idea"></div>
</section>

<!--@RAONA@-->

  </main>
  <!--@FOOTER@-->
</div>

"e3.model":"Pau, un bloque no puede pesar −1: el resultado no tiene sentido físico. Además, restar 4 deja x = 3x − 4, que sigue teniendo x en los dos lados. Eva lo hace mejor: resta x y queda 4 = 2x, así que x = 2 (comprobamos: 2 + 4 = 6 = 3 · 2).",
"e4.ctx":"Resuelve <b>3x + 6 = 2x + 9</b>.",
"e4.n0":"Eva","e4.n1":"Pau",
"e4.s0":"Resto 2x y 6: x = 3.",
"e4.s1":"Resto 2x: x + 6 = 9; después resto 6: x = 3.",
"e4.w0":"Las dos llegan a x = 3 con pasos legales: el orden no importa mientras se haga en los dos lados.",
"e4.w1":"Porque solo una de las dos ha respetado el equilibrio.",
"e4.w2":"Porque x = 3 no cumple la ecuación.",
"e4.frame":"Eva y Pau, los dos tenéis razón porque…",
"e4.model":"Eva y Pau, los dos hacéis pasos que mantienen el equilibrio: restar 2x y 6 de golpe, o primero 2x y después 6. Comprobamos: 3 · 3 + 6 = 15 y 2 · 3 + 9 = 15.",
"d1.q":"En una balanza, <b>3 paquetes idénticos</b> y <b>2 pesas de 1 kg</b> pesan igual que <b>1 paquete</b> y <b>8 pesas de 1 kg</b>. ¿Cuánto pesa un paquete?",
"d1.l0":"Un paquete","d1_n":"Plantea 3x + 2 = x + 8 y aísla la x.",
"d1_ok":"✔ ¡Bien decidido! 3x + 2 = x + 8 → 2x = 6 → x = 3 kg.",
"d1.more":"¿Y si un paquete pudiera pesar 3,5 kg? ¿Qué cambio harían las ecuaciones?",
"d2.q":"En una balanza, <b>5x + 3</b> pesa igual que <b>2x + 15</b>. ¿Cuánto vale <b>x</b>?",
"d2.l0":"x =","d2_n":"Resta 2x y 3 en los dos lados: 3x = 12.",
"d2_ok":"✔ ¡Bien decidido! 3x = 12 → x = 4. Comprobación: 5·4+3 = 23 = 2·4+15.",
"d2.more":"¿Y si en lugar de 15 fuera 14? ¿Vuelve a salir un valor entero?",
"d3.q":"Si <b>2x + 5 = x + 9</b>, ¿cuál de estos valores cumple la ecuación?",
"d3.lc":"x vale:",
"d3_l":"Con x = {0}, la izquierda pesa {1} y la derecha {2}: la izquierda pesa más, y la balanza se inclina hacia la izquierda.",
"d3_r":"Con x = {0}, la izquierda pesa {1} y la derecha {2}: la derecha pesa más, y la balanza se inclina hacia la derecha.",
"d3_ok":"✔ ¡Bien decidido! Con x = 4, 2·4+5 = 13 y 4+9 = 13: equilibrio.",
"d3.more":"Sin probar, ¿cómo podrías haber encontrado x = 4 restando x y 5 en los dos lados?"
}
};
/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@RAONA_JS@*/
/* ===== Equacions com a balança ===== */
const svg=$('#svg'),eqEl=$('#eq'),orig=$('#orig'),msg=$('#msg'),logEl=$('#log'),undo=$('#undo');
const btnBoth=$('#both'),btnLeft=$('#left');
const LIM_X=8,LIM_U=24,EPS=1e-9;
let X=0,st=null,first=null,hist=[],logs=[],mode='both',theta=0,target=0,raf=0;
const RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=n=>Math.floor(Math.random()*n);
function gen(){
  for(;;){
    const x=1+rnd(6),lx=2+rnd(3),rx=rnd(lx),lu=rnd(7);
    if(lu===0&&rx===0)continue;
    const ru=(lx-rx)*x+lu;
    if(ru>LIM_U)continue;
    X=x;return {lx:lx,lu:lu,rx:rx,ru:ru};
  }
}
const W=s=>[s.lx*X+s.lu,s.rx*X+s.ru];
const bal=s=>{const w=W(s);return Math.abs(w[0]-w[1])<EPS;};
const side=(x,u)=>{const p=[];if(x)p.push((x===1?'':x)+'x');if(u||!x)p.push(String(u));return p.join(' + ');};
const eqText=s=>side(s.lx,s.lu)+' '+(bal(s)?'=':'≠')+' '+side(s.rx,s.ru);
const div=(s,k)=>({lx:s.lx/k,lu:s.lu/k,rx:s.rx/k,ru:s.ru/k});
const OPS={
  'u+':(s,b)=>({lx:s.lx,lu:s.lu+1,rx:s.rx,ru:s.ru+(b?1:0)}),
  'u-':(s,b)=>({lx:s.lx,lu:s.lu-1,rx:s.rx,ru:s.ru-(b?1:0)}),
  'x+':(s,b)=>({lx:s.lx+1,lu:s.lu,rx:s.rx+(b?1:0),ru:s.ru}),
  'x-':(s,b)=>({lx:s.lx-1,lu:s.lu,rx:s.rx-(b?1:0),ru:s.ru}),
  'd2':s=>div(s,2),'d3':s=>div(s,3),'d4':s=>div(s,4)
};
const LBL={'u+':'+ 1','u-':'− 1','x+':'+ x','x-':'− x','d2':'÷ 2','d3':'÷ 3','d4':'÷ 4'};
const valid=s=>[s.lx,s.lu,s.rx,s.ru].every(Number.isInteger)&&s.lx>=0&&s.rx>=0&&s.lu>=0&&s.ru>=0&&s.lx<=LIM_X&&s.rx<=LIM_X&&s.lu<=LIM_U&&s.ru<=LIM_U;
function pan(x,y,nx,nu){
  let g='<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')"><line x1="0" y1="0" x2="-92" y2="200" class="rope"/><line x1="0" y1="0" x2="92" y2="200" class="rope"/>';
  const xr=Math.ceil(nx/4);
  for(let i=0;i<nx;i++){
    const r=Math.floor(i/4),c=i%4,cnt=Math.min(4,nx-r*4),px=-cnt*21+c*42+1,py=200-(r+1)*42+2;
    g+='<rect x="'+px+'" y="'+py+'" width="40" height="40" rx="5" class="bx"/><text x="'+(px+20)+'" y="'+(py+21)+'" class="bxl" text-anchor="middle" dominant-baseline="central">x</text>';
  }
  const base=200-xr*42-2;
  for(let i=0;i<nu;i++){
    const r=Math.floor(i/8),c=i%8,cnt=Math.min(8,nu-r*8),px=-cnt*11+c*22+1,py=base-(r+1)*22+2;
    g+='<rect x="'+px+'" y="'+py+'" width="20" height="20" rx="3" class="bu"/>';
  }
  return g+'<rect x="-98" y="200" width="196" height="12" rx="5" class="plate"/></g>';
}
function draw(){
  const cx=320,cy=84,arm=210,r=theta*Math.PI/180,co=Math.cos(r),si=Math.sin(r);
  const L=[cx-arm*co,cy-arm*si],R=[cx+arm*co,cy+arm*si];
  let s='<polygon points="'+(cx-12)+','+cy+' '+(cx+12)+','+cy+' '+(cx+34)+',392 '+(cx-34)+',392" class="stand"/>';
  s+='<rect x="'+(cx-150)+'" y="392" width="300" height="16" rx="6" class="stand"/>';
  s+=pan(L[0],L[1],st.lx,st.lu)+pan(R[0],R[1],st.rx,st.ru);
  s+='<line x1="'+L[0].toFixed(1)+'" y1="'+L[1].toFixed(1)+'" x2="'+R[0].toFixed(1)+'" y2="'+R[1].toFixed(1)+'" class="beam"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" class="pivot"/>';
  svg.innerHTML=s;
}
function animate(){
  cancelAnimationFrame(raf);
  if(RM){theta=target;draw();return;}
  (function step(){
    theta+=(target-theta)*0.16;
    if(Math.abs(target-theta)<0.04){theta=target;draw();return;}
    draw();raf=requestAnimationFrame(step);
  })();
}
function refresh(){
  const b=mode==='both';
  $$('[data-op]').forEach(bt=>{
    const op=bt.dataset.op,c=OPS[op](st,b);
    bt.disabled=!valid(c)||(op[0]==='d'&&!bal(st));
  });
  undo.disabled=hist.length===0;
  const w=W(st);
  target=-Math.max(-16,Math.min(16,(w[0]-w[1])*2));
  const ok=bal(st);
  eqEl.textContent=eqText(st);
  eqEl.classList.toggle('off',!ok);
  orig.textContent=tt('orig',eqText(first));
  let solved=null;
  if(ok&&st.lx===1&&st.lu===0&&st.rx===0)solved=st.ru;
  else if(ok&&st.rx===1&&st.ru===0&&st.lx===0)solved=st.lu;
  if(solved!==null)msg.innerHTML='<p class="ok">'+tt('solved',nf(solved,3))+'</p>';
  else if(!ok)msg.innerHTML='<p class="bad">'+t('off')+'</p>';
  else msg.innerHTML='<p class="note">'+t('keep')+'</p>';
  logEl.innerHTML=logs.slice(-8).map(l=>'<span>'+LBL[l.op]+(l.left?' '+t('esq'):'')+'</span>').join('');
  animate();
}
function run(op){
  const b=mode==='both',c=OPS[op](st,b);
  if(!valid(c))return;
  hist.push({s:st,l:logs.slice()});
  logs.push({op:op,left:op[0]!=='d'&&!b});
  st=c;refresh();
}
function fresh(){st=gen();first=st;hist=[];logs=[];theta=0;refresh();}
$$('[data-op]').forEach(bt=>bt.addEventListener('click',()=>run(bt.dataset.op)));
undo.addEventListener('click',()=>{const h=hist.pop();if(!h)return;st=h.s;logs=h.l;refresh();});
$('#new').addEventListener('click',fresh);
function setMode(m){mode=m;btnBoth.setAttribute('aria-pressed',String(m==='both'));btnLeft.setAttribute('aria-pressed',String(m==='left'));refresh();}
btnBoth.addEventListener('click',()=>setMode('both'));
btnLeft.addEventListener('click',()=>setMode('left'));
App.hooks.push(refresh);
/* ===== Raona-ho ===== */
function load(lx,lu,rx,ru,x){
  lx=clamp(Math.round(lx),0,LIM_X);rx=clamp(Math.round(rx),0,LIM_X);
  lu=clamp(Math.round(lu),0,LIM_U);ru=clamp(Math.round(ru),0,LIM_U);
  X=x;st={lx:lx,lu:lu,rx:rx,ru:ru};first=st;hist=[];logs=[];theta=0;
  setMode('both');RZ.show($('#svg'));
}
const isI=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;
const RNG={k:'rng'};
RZ.init({
 F:{n:{l:'f_n'},a:{l:'f_a'},b:{l:'f_b'},r:{l:'f_r'},x:{l:'f_x'}},
 sim:v=>load(...v),
 M:[
  {id:'m1',f:['n'],sim:()=>load(2,3,0,11,4),ok:()=>({k:'m1_ok'}),
   chk:([n])=>!isI(n,0,11)?RNG:n===3?null:n>3?{k:'m1_big',p:[n]}:{k:'m1_less',p:[n,3-n]}},
  {id:'m2',f:['b'],sim:([b])=>load(3,4,1,isI(b,0,24)?b:14,5),ok:()=>({k:'m2_ok'}),
   chk:([b])=>!isI(b,0,24)?RNG:b===14?null:{k:'m2_f',p:[b,5+b]}},
  {id:'m3',f:['a'],sim:([a])=>load(isI(a,0,8)?a:4,1,0,13,3),ok:()=>({k:'m3_ok'}),
   chk:([a])=>!isI(a,0,8)?RNG:a===4?null:{k:'m3_f',p:[a,3*a+1]}},
  {id:'m4',f:['r'],sim:([r])=>load(5,2,isI(r,0,8)?r:1,14,3),ok:()=>({k:'m4_ok'}),
   chk:([r])=>!isI(r,0,8)?RNG:r===1?null:{k:'m4_f',p:[r,3*r+14]}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load(2,3,0,11,4)},
  {id:'s2',ans:'D',f:['a'],cxsim:([a])=>load(isI(a,1,8)?a:3,0,0,6,6/(isI(a,1,8)?a:3)),
   cx:([a])=>!isI(a,1,8)?RNG:a%2===0?{k:'s2_cx_no',p:[a,a/2]}:null,
   sim:()=>load(4,0,0,6,1.5)},
  {id:'s3',ans:'S',sim:()=>load(2,1,0,9,4)},
  {id:'s4',ans:'M',sim:()=>load(3,2,1,10,4)},
  {id:'s5',ans:'M',sim:()=>load(3,0,0,12,4)},
  {id:'s6',ans:'D',f:['a'],cxsim:([a])=>load(isI(a,1,8)?a:3,4,0,10,6/(isI(a,1,8)?a:3)),
   cx:([a])=>!isI(a,1,8)?RNG:a<=2?{k:'s6_cx_no',p:[a]}:null,
   sim:()=>load(2,4,0,10,3)}
 ],
 E:[{id:'e1',who:1,args:[2,3,0,11,4]},{id:'e2',who:3,args:[3,2,1,10,4]},{id:'e3',who:0,args:[1,4,3,0,2]},{id:'e4',who:2,args:[3,6,2,9,3]}],
 D:[
  {id:'d1',f:[{l:'d1.l0',u:'kg'}],sim:()=>load(3,2,1,8,3),ok:()=>({k:'d1_ok'}),
   chk:([x])=>x!==3?{k:'d1_n'}:null},
  {id:'d2',f:['x'],sim:()=>load(5,3,2,15,4),ok:()=>({k:'d2_ok'}),
   chk:([x])=>x!==4?{k:'d2_n'}:null},
  {id:'d3',chips:{vals:[3,4,5,9]},sim:()=>load(2,5,1,9,4),ok:()=>({k:'d3_ok'}),
   chk:([p])=>{if(p===4)return null;const l=2*p+5,r=p+9;return {k:l>r?'d3_l':'d3_r',p:[p,l,r]};}}
 ]
});
initQuiz([]);
fresh();
initLang();applyLang();
</script>
