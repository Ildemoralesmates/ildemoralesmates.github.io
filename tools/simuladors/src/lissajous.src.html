<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Figures de Lissajous — simulador interactiu</title>
<meta name="description" content="Dos moviments oscil·latoris perpendiculars, un horitzontal i un de vertical, dibuixen una figura de Lissajous. Canvia les freqüències i la fase, mira les dues ones a la vegada i aprèn a deduir la relació fx:fy comptant les tangències. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d’altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
.stage svg{display:block;width:100%;height:auto}
.stage svg text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:14px;height:3px;display:inline-block;border-radius:2px}
.ctls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;padding:2px 4px}
@media (max-width:620px){.ctls{grid-template-columns:1fr}}
.ctls .span{grid-column:1/-1}
.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:4px 18px}
.btns{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
.vals dd.hl1{color:var(--pa);font-weight:700}
.vals dd.hl2{color:var(--pb);font-weight:700}
.tyl{margin:0;padding:6px 10px;border-radius:8px;background:var(--chip);border:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.chiprow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chiprow .lb{font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--muted);font-weight:600;margin-right:4px}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="stage"><svg id="svg" viewBox="0 0 640 344" role="img" data-i18n-aria="aria.svg" aria-label=""></svg></div>
<div class="legend">
<span><span class="swatch" style="background:var(--pa)"></span><span data-i18n="lg_x"></span></span>
<span><span class="swatch" style="background:var(--pb)"></span><span data-i18n="lg_y"></span></span>
<span><span class="swatch" style="background:var(--ink)"></span><span data-i18n="lg_f"></span></span>
</div>
<div class="ctls">
<div class="btns"><button class="btn primary" id="btnPlay" type="button"></button><button class="btn" id="btnStep" type="button" data-i18n="step"></button><button class="btn" id="btnReset" type="button" data-i18n="reset"></button>
<select id="speed" aria-label="Velocitat"><option value="0.5" data-i18n="sp_slow"></option><option value="1" selected data-i18n="sp_norm"></option><option value="2" data-i18n="sp_fast"></option></select></div>
<div class="chiprow"><span class="lb" data-i18n="lb_ratio"></span><span id="pRatio" class="chips"></span></div>
<div class="chiprow"><span class="lb" data-i18n="lb_phase"></span><span id="pPhase" class="chips"></span></div>
<div class="ctl"><label for="fa" data-i18n="l_fa"></label><output id="faL"></output><input type="range" id="fa" min="1" max="9" step="1" value="1"></div>
<div class="ctl"><label for="fb" data-i18n="l_fb"></label><output id="fbL"></output><input type="range" id="fb" min="1" max="9" step="1" value="2"></div>
<div class="ctl"><label for="dl" data-i18n="l_dl"></label><output id="dlL"></output><input type="range" id="dl" min="0" max="360" step="5" value="40"></div>
<div class="ctl"><label for="amA" data-i18n="l_A"></label><output id="amAL"></output><input type="range" id="amA" min="0.4" max="1" step="0.05" value="1"></div>
<div class="ctl"><label for="amB" data-i18n="l_B"></label><output id="amBL"></output><input type="range" id="amB" min="0.4" max="1" step="0.05" value="1"></div>
<div class="ctl"><label for="pg" data-i18n="l_pg"></label><output id="pgL"></output><input type="range" id="pg" min="0" max="1" step="0.005" value="0"></div>
<div class="checks">
<label class="check"><input type="checkbox" id="mark"><span data-i18n="c_mark"></span></label>
<label class="check"><input type="checkbox" id="guide" checked><span data-i18n="c_guide"></span></label>
<label class="check"><input type="checkbox" id="sweep"><span data-i18n="c_sweep"></span></label>
</div>
</div>
</div>
<div class="side">
<p class="sh" data-i18n="s_live"></p>
<dl class="vals" id="readout"></dl>
<p class="sh" data-i18n="s_res"></p>
<dl class="vals" id="results"></dl>
<p class="tyl" id="tyl" aria-live="polite"></p>
<p class="note" data-i18n="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

(function(){
/* ===== Figures de Lissajous: x = A·sin(2π·a'·u + δ), y = B·sin(2π·b'·u), u ∈ [0,1] = una figura completa ===== */
const svg=$('#svg');
const faEl=$('#fa'),fbEl=$('#fb'),dlEl=$('#dl'),amAEl=$('#amA'),amBEl=$('#amB'),pgEl=$('#pg'),speedEl=$('#speed');
const markEl=$('#mark'),guideEl=$('#guide'),sweepEl=$('#sweep');
const btnPlay=$('#btnPlay'),btnStep=$('#btnStep'),btnReset=$('#btnReset');
const readout=$('#readout'),results=$('#results'),tyl=$('#tyl');
const CX=170,CY=172,HALF=150,DUR=6;
let u=0,playing=false,last=null,presLang=null;
const f1=n=>n.toFixed(1);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const RAD=Math.PI/180;
function P(){
  const a=+faEl.value,b=+fbEl.value,g=gcd(a,b);
  return {a,b,g,ar:a/g,br:b/g,d:+dlEl.value*RAD,dd:+dlEl.value,A:+amAEl.value,B:+amBEl.value};
}
const px=(p,uu)=>Math.sin(TAU*p.ar*uu+p.d),py=(p,uu)=>Math.sin(TAU*p.br*uu);
const sx=(p,uu)=>CX+p.A*HALF*px(p,uu),sy=(p,uu)=>CY-p.B*HALF*py(p,uu);
/* punts de tangència amb els costats: retorna {vr,vl,ht,hb} com a llistes de [x,y] normalitzats */
function tangents(p){
  const o={r:[],l:[],t:[],b:[]};
  for(let k=0;k<2*p.ar;k++){
    const uu=((Math.PI/2+k*Math.PI-p.d)/(TAU*p.ar)%1+1)%1,pt=[k%2===0?1:-1,py(p,uu)];(k%2===0?o.r:o.l).push(pt);
  }
  for(let k=0;k<2*p.br;k++){
    const uu=((Math.PI/2+k*Math.PI)/(TAU*p.br))%1,pt=[px(p,uu),k%2===0?1:-1];(k%2===0?o.t:o.b).push(pt);
  }
  return o;
}
function distinct(L,i){const out=[];L.forEach(q=>{if(!out.some(r=>Math.abs(r[i]-q[i])<.01))out.push(q);});return out;}
function retraced(p){
  /* la corba es recorre dues vegades (degenerada) si cada punt de prova torna a aparéixer en un altre instant */
  const M=1200,xs=[],ys=[];for(let i=0;i<M;i++){xs.push(px(p,i/M));ys.push(py(p,i/M));}
  let hit=0;const tests=[.137,.291,.443,.597,.71,.853];
  tests.forEach(uu=>{const x0=px(p,uu),y0=py(p,uu);let f=false;
    for(let i=0;i<M&&!f;i++){const du=Math.abs(i/M-uu);if(Math.min(du,1-du)<.03)continue;if(Math.abs(xs[i]-x0)<.012&&Math.abs(ys[i]-y0)<.012)f=true;}
    if(f)hit++;});
  return hit>=5;
}
function draw(){
  const p=P(),o0=[];
  let o='';
  /* requadre */
  const bx0=CX-p.A*HALF,bx1=CX+p.A*HALF,by0=CY-p.B*HALF,by1=CY+p.B*HALF;
  o+='<rect x="'+f1(CX-HALF-6)+'" y="'+f1(CY-HALF-6)+'" width="'+(2*HALF+12)+'" height="'+(2*HALF+12)+'" rx="6" fill="none" stroke="var(--line)"/>';
  o+='<rect x="'+f1(bx0)+'" y="'+f1(by0)+'" width="'+f1(bx1-bx0)+'" height="'+f1(by1-by0)+'" fill="none" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>';
  o+='<path d="M'+(CX-HALF-6)+','+CY+'H'+(CX+HALF+6)+'M'+CX+','+(CY-HALF-6)+'V'+(CY+HALF+6)+'" stroke="var(--line)"/>';
  /* corba completa i traç */
  const N=700,all=[];for(let i=0;i<=N;i++){const uu=i/N;all.push(f1(sx(p,uu))+','+f1(sy(p,uu)));}
  o+='<polyline fill="none" stroke="var(--line)" stroke-width="3" stroke-linejoin="round" points="'+all.join(' ')+'"/>';
  const n=Math.max(2,Math.ceil(u*N)),tp=[];for(let i=0;i<=n;i++){const uu=u*i/n;tp.push(f1(sx(p,uu))+','+f1(sy(p,uu)));}
  if(u>0)o+='<polyline fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" points="'+tp.join(' ')+'"/>';
  /* tangències */
  if(markEl.checked){
    const T=tangents(p);
    ['r','l'].forEach(k=>distinct(T[k],1).forEach(q=>{o+='<circle cx="'+f1(CX+q[0]*p.A*HALF)+'" cy="'+f1(CY-q[1]*p.B*HALF)+'" r="4.6" fill="var(--pa)" stroke="var(--panel)" stroke-width="1.2"/>';}));
    ['t','b'].forEach(k=>distinct(T[k],0).forEach(q=>{o+='<circle cx="'+f1(CX+q[0]*p.A*HALF)+'" cy="'+f1(CY-q[1]*p.B*HALF)+'" r="4.6" fill="var(--pb)" stroke="var(--panel)" stroke-width="1.2"/>';}));
  }
  /* punt mòbil i projeccions */
  const X=sx(p,u),Y=sy(p,u);
  if(guideEl.checked){
    o+='<line x1="'+f1(X)+'" y1="'+f1(Y)+'" x2="'+f1(X)+'" y2="'+f1(CY+HALF+6)+'" stroke="var(--pa)" stroke-dasharray="3 4"/><line x1="'+f1(X)+'" y1="'+f1(Y)+'" x2="'+f1(CX-HALF-6)+'" y2="'+f1(Y)+'" stroke="var(--pb)" stroke-dasharray="3 4"/>';
    o+='<circle cx="'+f1(X)+'" cy="'+f1(CY+HALF+6)+'" r="4" fill="var(--pa)"/><circle cx="'+f1(CX-HALF-6)+'" cy="'+f1(Y)+'" r="4" fill="var(--pb)"/>';
  }
  o+='<circle cx="'+f1(X)+'" cy="'+f1(Y)+'" r="7" fill="var(--warn)" stroke="var(--panel)" stroke-width="2"/>';
  /* ones x(u) i y(u) */
  const gx0=372,gx1=626,gw=gx1-gx0,gy1=88,gy2=258,gh=62;
  const wave=(cy,fn,col)=>{const pts=[];for(let i=0;i<=300;i++){const uu=i/300;pts.push(f1(gx0+gw*uu)+','+f1(cy-gh*fn(uu)));}
    return '<line x1="'+gx0+'" y1="'+cy+'" x2="'+gx1+'" y2="'+cy+'" stroke="var(--line)"/><polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+pts.join(' ')+'"/>';};
  o+=wave(gy1,uu=>p.A*px(p,uu),'var(--pa)')+wave(gy2,uu=>p.B*py(p,uu),'var(--pb)');
  const mx=gx0+gw*u;
  o+='<line x1="'+f1(mx)+'" y1="'+(gy1-gh-6)+'" x2="'+f1(mx)+'" y2="'+(gy2+gh+6)+'" stroke="var(--muted)" stroke-dasharray="3 4"/>';
  o+='<circle cx="'+f1(mx)+'" cy="'+f1(gy1-gh*p.A*px(p,u))+'" r="4.6" fill="var(--pa)"/><circle cx="'+f1(mx)+'" cy="'+f1(gy2-gh*p.B*py(p,u))+'" r="4.6" fill="var(--pb)"/>';
  o+='<text x="'+gx0+'" y="'+(gy1-gh-10)+'" style="fill:var(--pa);font-weight:700">x(t) · '+p.ar+' '+t('cyc')+'</text><text x="'+gx0+'" y="'+(gy2-gh-10)+'" style="fill:var(--pb);font-weight:700">y(t) · '+p.br+' '+t('cyc')+'</text>';
  o+='<text x="'+gx1+'" y="'+(gy2+gh+22)+'" text-anchor="end">t → '+fmt(1/p.g,2)+' s</text>';
  svg.innerHTML=o;
}
const row=(k,v,c)=>'<dt>'+k+'</dt><dd'+(c?' class="'+c+'"':'')+'>'+v+'</dd>';
function panels(){
  const p=P(),Tc=tangents(p),nr=distinct(Tc.r,1).length,nt=distinct(Tc.t,0).length;
  readout.innerHTML=row(t('rd_p'),fmt(u*100,0)+' %')+row(t('rd_t'),fmt(u/p.g,3)+' s')+row(t('rd_x'),fmt(p.A*px(p,u),2),'hl1')+row(t('rd_y'),fmt(p.B*py(p,u),2),'hl2')+row(t('rd_d'),Math.round(p.dd)+'°');
  results.innerHTML=row(t('r_ratio'),p.a+' : '+p.b)+row(t('r_red'),'<b>'+p.ar+' : '+p.br+'</b>')+row(t('r_close'),fmt(1/p.g,3)+' s')+row(t('r_tr'),nr,'hl1')+row(t('r_tt'),nt,'hl2')+
    row(t('r_cross'),p.ar===1&&p.br===1?'0':String(2*p.ar*p.br-p.ar-p.br));
  let k;
  if(p.ar===1&&p.br===1){
    const s=Math.abs(Math.sin(p.d));
    k=s<.02?'ty_line':s>.98?(Math.abs(p.A-p.B)<1e-9?'ty_circ':'ty_ell0'):'ty_ell';
    tyl.textContent=t(k);
  }else{
    /* degenerada: algun costat tocat menys vegades del que correspon */
    const deg=retraced(p);
    tyl.textContent=deg?t('ty_par'):t('ty_lis',{0:p.ar,1:p.br});
  }
}
function labels(){
  $('#faL').textContent=faEl.value+' Hz';$('#fbL').textContent=fbEl.value+' Hz';$('#dlL').textContent=Math.round(+dlEl.value)+'°';
  $('#amAL').textContent=fmt(+amAEl.value,2);$('#amBL').textContent=fmt(+amBEl.value,2);
  $('#pgL').textContent=fmt(u*100,0)+' %';pgEl.value=u;
}
function buildChips(){
  if(presLang===LANG)return;presLang=LANG;
  const R=$('#pRatio'),F=$('#pPhase');R.innerHTML='';F.innerHTML='';
  [[1,1],[1,2],[2,1],[1,3],[3,2],[2,3],[3,4],[4,3],[5,4]].forEach(([a,b])=>{
    const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=a+':'+b;c.dataset.a=a;c.dataset.b=b;
    c.onclick=()=>{faEl.value=a;fbEl.value=b;sweepEl.checked=false;refresh();};R.appendChild(c);});
  [0,45,90,135,180].forEach(d=>{
    const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=d+'°';c.dataset.d=d;
    c.onclick=()=>{dlEl.value=d;sweepEl.checked=false;refresh();};F.appendChild(c);});
}
function pressChips(){
  $$('#pRatio .chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.a===+faEl.value&&+c.dataset.b===+fbEl.value)));
  $$('#pPhase .chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.d===+dlEl.value)));
}
function setPlay(){const k=playing?'pause':(u>0&&u<1?'resume':'play');if(btnPlay.textContent!==t(k))btnPlay.textContent=t(k);}
function refresh(){buildChips();pressChips();labels();draw();panels();setPlay();}
function tick(ts){
  if(!playing)return;
  if(last===null)last=ts;
  const dt=(ts-last)/1000*(+speedEl.value);last=ts;
  u+=dt/DUR;
  if(sweepEl.checked){u=u%1;dlEl.value=((+dlEl.value+dt*40)%360);}
  else if(u>=1){u=1;playing=false;last=null;}
  refresh();
  if(playing)requestAnimationFrame(tick);
}
function play(){
  if(playing){playing=false;last=null;setPlay();return;}
  if(u>=1)u=0;
  playing=true;last=null;setPlay();requestAnimationFrame(tick);
}
[faEl,fbEl,dlEl,amAEl,amBEl,markEl,guideEl].forEach(e=>e.addEventListener('input',refresh));
sweepEl.addEventListener('change',()=>{if(sweepEl.checked&&!playing)play();else refresh();});
pgEl.addEventListener('input',()=>{u=+pgEl.value;playing=false;last=null;refresh();});
btnPlay.addEventListener('click',play);
btnStep.addEventListener('click',()=>{playing=false;last=null;u=Math.min(1,Math.round(u*16+1e-9)/16+1/16);refresh();});
btnReset.addEventListener('click',()=>{playing=false;last=null;u=0;sweepEl.checked=false;refresh();});
App.hooks.push(()=>{presLang=null;refresh();});

/* ===== Raona-ho ===== */
const dv=(x,d)=>x===undefined?d:x;
function load(o){
  o=o||{};
  faEl.value=dv(o.a,1);fbEl.value=dv(o.b,2);dlEl.value=dv(o.d,40);amAEl.value=dv(o.A,1);amBEl.value=dv(o.B,1);
  markEl.checked=!!o.mark;guideEl.checked=true;sweepEl.checked=!!o.sweep;speedEl.value='1';
  playing=false;last=null;u=clamp(dv(o.u,o.run?0:1),0,1);
  refresh();
  if(o.run)play();
  RZ.show($('#svg'));
}
const lim=(x,a,b)=>Math.round(clamp(x,a,b));
const PAIRS=[[3,5],[5,3],[5,4],[4,5]];
RZ.init({
 sim:()=>load(),
 M:[
  {id:'m1',f:[{l:'l_xf',u:'Hz'},{l:'l_yf',u:'Hz'}],sim:([x,y])=>load({a:Number.isFinite(x)?lim(x,1,9):2,b:Number.isFinite(y)?lim(y,1,9):3,d:40,mark:true}),ok:()=>({k:'m1_ok'}),
   chk:([x,y])=>(Number.isInteger(x)&&Number.isInteger(y)&&x>=1&&y>=1&&x*3===y*2)?null:(x*2===y*3?{k:'m1_swap'}:{k:'m1_f',p:[fmt(x,0),fmt(y,0)]})},
  {id:'m2',f:[{l:'l_tr'},{l:'l_tt'}],sim:()=>load({a:3,b:4,d:40,mark:true}),ok:()=>({k:'m2_ok'}),
   chk:([r,s])=>(r===3&&s===4)?null:(r===4&&s===3?{k:'m2_swap'}:{k:'m2_f',p:[fmt(r,0),fmt(s,0)]})},
  {id:'m3',f:[{l:'l_df',u:'°'}],sim:([d])=>load({a:1,b:1,d:Number.isFinite(d)?clamp(d,0,360):90}),ok:()=>({k:'m3_ok'}),
   chk:([d])=>(Math.abs(d-90)<=2||Math.abs(d-270)<=2)?null:{k:'m3_f',p:[fmt(d,0)]}},
  {id:'m4',f:[{l:'l_df',u:'°'}],sim:([d])=>load({a:1,b:1,d:Number.isFinite(d)?clamp(d,0,360):0}),ok:()=>({k:'m4_ok'}),
   chk:([d])=>(d<=2||Math.abs(d-180)<=2||d>=358)?null:(Math.abs(d-90)<=2||Math.abs(d-270)<=2)?{k:'m4_c',p:[fmt(d,0)]}:{k:'m4_f',p:[fmt(d,0)]}},
  {id:'m5',f:[{l:'l_tf',u:'s'}],sim:()=>load({a:4,b:6,d:40,run:true}),ok:()=>({k:'m5_ok'}),
   chk:([x])=>Math.abs(x-.5)<=.01?null:{k:'m5_f',p:[fmt(x,2)]}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load({a:1,b:1,d:40,sweep:true,run:true})},
  {id:'s2',ans:'D',f:[{l:'l_df',u:'°'}],cxsim:([d])=>load({a:1,b:2,d:clamp(d,0,360)}),
   cxok:([d])=>({k:'s2_cx',p:[fmt(d,0)]}),
   cx:([d])=>!(d>=0&&d<=360)?{k:'rng'}:[45,135,225,315].some(q=>Math.abs(d-q)<=3)?null:{k:'s2_cx_no',p:[fmt(d,0)]}},
  {id:'s3',ans:'M',sim:()=>load({a:2,b:3,d:40,A:.5,mark:true})},
  {id:'s4',ans:'S',sim:()=>load({a:3,b:4,d:40,mark:true})},
  {id:'s5',ans:'M',sim:()=>load({a:4,b:6,d:40,mark:true})},
  {id:'s6',ans:'S',sim:()=>load({a:1,b:1,d:90,run:true})}
 ],
 E:[
  {id:'e1',who:1,sim:()=>load({a:3,b:2,d:40,mark:true})},
  {id:'e2',who:1,sim:()=>load({a:1,b:1,d:90,run:true})},
  {id:'e3',who:0,sim:()=>load({a:1,b:2,d:40,run:true})},
  {id:'e4',who:1,sim:()=>load({a:1,b:1,d:40,sweep:true,run:true})}
 ],
 D:[
  {id:'d1',chips:{vals:[0,1,2,3],fmt:i=>PAIRS[i][0]+':'+PAIRS[i][1]},f:[{l:'d1.l0',u:'s'}],
   sim:(a)=>{const q=PAIRS[Number.isFinite(a[0])?a[0]:1];load({a:q[0],b:q[1],d:40,mark:true});},ok:()=>({k:'d1_ok'}),
   chk:([i,T])=>i!==1?{k:'d1_p',p:[PAIRS[i][0],PAIRS[i][1],PAIRS[i][1],PAIRS[i][0]]}:Math.abs(T-1)>.01?{k:'d1_t'}:null},
  {id:'d2',f:[{l:'d2.l0',u:'Hz'}],sim:()=>load({a:2,b:3,d:40,mark:true}),ok:()=>({k:'d2_ok'}),
   chk:([x])=>Math.abs(x-300)<=1?null:Math.abs(x-133.3)<=2?{k:'d2_sw',p:[fmt(x,1)]}:{k:'d2_f',p:[fmt(x,1)]}},
  {id:'d3',chips:{vals:[0,45,90,180],fmt:x=>x+'°'},f:[{l:'d3.l0'}],
   sim:(a)=>load({a:1,b:1,d:Number.isFinite(a[0])?a[0]:90}),ok:()=>({k:'d3_ok'}),
   chk:([d,r])=>d!==90?{k:'d3_p',p:[d]}:Math.abs(r-1)>.02?{k:'d3_r'}:null}
 ]
});
initQuiz([]);
initLang();applyLang();
refresh();
})();
</script>
