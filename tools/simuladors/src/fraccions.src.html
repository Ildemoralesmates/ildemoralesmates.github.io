<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suma i resta de fraccions: barres que encaixen</title>
<meta name="description" content="Suma i resta de fraccions amb barres: per què cal un denominador comú. Animació pas a pas (mcm, fraccions equivalents, simplificar) amb predicció, l'error típic de sumar també els denominadors, activitats per a raonar i test autocorregit. Per a 2n d'ESO.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@STEPS_CSS@*/
/*@RAONA_CSS@*/
.stage canvas{display:block;width:100%;height:auto}
.frs{gap:10px 14px}
.frin{display:inline-flex;align-items:center;gap:4px;font:600 18px var(--f-num)}
.frin select{font:inherit;font-size:16px;padding:3px 6px}
.frin.fa select{color:var(--pa);border-color:var(--pa)}
.frin.fb select{color:var(--pb);border-color:var(--pb)}
.mut{color:var(--muted);font-size:13px}
.ticket{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;background:var(--stage);font-size:14.5px;display:grid;gap:6px}
.ticket:empty{display:none}
.ticket p{margin:0}
.ticket .note{font-size:13px;color:var(--muted)}
.ticket .errb{border-left:4px solid var(--warn);padding-left:10px}
.eq{font-family:var(--f-num);font-size:17px;line-height:2.3}
.fr{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.2;margin:0 3px;font-family:var(--f-num);font-weight:600}
.fr i{font-style:normal;padding:0 4px}
.fr i:first-child{border-bottom:2px solid currentColor}
.cA{color:var(--pa)}.cB{color:var(--pb)}.cG{color:var(--ok)}.cW{color:var(--warn)}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<div class="app">
<section class="stage-card">
<div class="stage"><canvas id="cv" role="img" data-i18n-aria="aria.stage" aria-label=""></canvas></div>
<div class="ctrlbar">
<span class="mut" data-i18n="presets"></span><div class="chips" id="presets"></div>
</div>
<div class="ctrlbar frs">
<span class="frin fa"><select id="n1" data-i18n-aria="aria.n1" aria-label=""></select><span>/</span><select id="d1" data-i18n-aria="aria.d1" aria-label=""></select></span>
<div class="seg" id="opsw" role="group" data-i18n-aria="aria.op" aria-label=""><button type="button" data-op="+" aria-pressed="true">+</button><button type="button" data-op="-" aria-pressed="false">−</button></div>
<span class="frin fb"><select id="n2" data-i18n-aria="aria.n2" aria-label=""></select><span>/</span><select id="d2" data-i18n-aria="aria.d2" aria-label=""></select></span>
<button type="button" class="btn" id="errbtn" aria-pressed="false" data-i18n="btn_err"></button>
</div>
</section>
<aside class="panel sidep" data-i18n-aria="aria.steps" aria-label="">
<div class="stepper" id="stepper"></div>
<div class="stepnav"><button type="button" class="btn" id="prev" data-i18n="st_prev"></button><button type="button" class="btn primary" id="next" data-i18n="st_next"></button></div>
<p class="stepno" id="stepno"></p>
<h2 id="stitle" data-i18n="a0.title"></h2>
<div class="stext" id="stext" data-i18n-html="a0.text"></div>
<div class="ticket" id="ticket" aria-live="polite"></div>
<div class="stats" id="sstats" hidden></div>
<div id="sask" hidden></div>
<div id="sthink" hidden></div>
<div class="rowlinks"><button type="button" class="linkb" id="restart" data-i18n="st_restart"></button></div>
</aside>
</div>

<!--@RAONA@-->

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

/* ===== càlcul ===== */
const g2=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const r=a%b;a=b;b=r;}return a;};
const lcm=(a,b)=>a/g2(a,b)*b;
const fs=(n,d)=>{const g=g2(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d;};
const fr=(n,d,cls)=>'<span class="fr'+(cls?' '+cls:'')+'"><i>'+n+'</i><i>'+d+'</i></span>';
const MINUS='−';
let S={n1:1,d1:2,op:'+',n2:1,d2:3},V={},swapped=false,errOn=false;
function derive(){
  swapped=false;
  if(S.op==='-'&&S.n1*S.d2<S.n2*S.d1){
    const a=S.n1,b=S.d1;S.n1=S.n2;S.d1=S.d2;S.n2=a;S.d2=b;swapped=true;
  }
  const {n1,d1,n2,d2,op}=S;
  const m=lcm(d1,d2),ka=m/d1,kb=m/d2,na=n1*ka,nb=n2*kb,r=op==='+'?na+nb:na-nb;
  V={m,ka,kb,na,nb,r,g:r>0?g2(r,m):1,mx:r>m?2:1,f1:n1/d1,f2:n2/d2,R:r/m,
     en:op==='+'?n1+n2:n1-n2,ed:op==='+'?d1+d2:d1-d2};
}

/* ===== controls ===== */
function fillSel(sel,from,to,keep){
  sel.innerHTML='';
  for(let k=from;k<=to;k++){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}
  sel.value=clamp(keep,from,to);
}
function syncControls(){
  fillSel($('#d1'),2,12,S.d1);fillSel($('#d2'),2,12,S.d2);
  fillSel($('#n1'),1,S.d1,S.n1);fillSel($('#n2'),1,S.d2,S.n2);
  $$('#opsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.op===S.op)));
  $('#errbtn').setAttribute('aria-pressed',String(errOn));
}
function readControls(from){
  S.d1=+$('#d1').value;S.d2=+$('#d2').value;
  if(from==='d1')fillSel($('#n1'),1,S.d1,+$('#n1').value);
  if(from==='d2')fillSel($('#n2'),1,S.d2,+$('#n2').value);
  S.n1=+$('#n1').value;S.n2=+$('#n2').value;
  change();
}
function change(){
  derive();
  if(swapped)syncControls();
  paint();
}
function setFr(n1,d1,op,n2,d2,err){
  d1=clamp(Math.round(d1),2,12);d2=clamp(Math.round(d2),2,12);
  S={n1:clamp(Math.round(n1),1,d1),d1,op,n2:clamp(Math.round(n2),1,d2),d2};
  if(err!==undefined)setErr(err);
  derive();syncControls();paint();
}
const PRE=[[1,2,'+',1,3],[3,4,'-',1,6],[2,3,'+',3,4],[1,6,'+',1,3],[5,6,'-',1,4],[3,4,'+',1,4]];
function buildPresets(){
  const h=$('#presets');h.innerHTML='';
  PRE.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t('p_ex'+(i+1));
    b.onclick=()=>setFr(...p);h.appendChild(b);});
}

function ticketHTML(i){
  const {n1,d1,n2,d2,op}=S,{m,ka,kb,na,nb,r,g}=V,sg=op==='+'?'+':MINUS;
  let h='';
  if(swapped)h+='<p class="note">'+t('tk_swap')+'</p>';
  h+='<div class="eq">'+fr(n1,d1,'cA')+' '+sg+' '+fr(n2,d2,'cB')+(i>=4?' = '+fr(r,m,'cG'):' = ?')+'</div>';
  if(i===1){
    h+=d1===d2?'<p>'+t('tk_same')+'</p>':'<p>'+tt('tk_sizes','1/'+d1,'1/'+d2)+'</p>';
  }else if(i===2){
    h+='<p>'+tt('tk_lcm',d1,d2,m)+'</p>';
    h+=d1===d2?'<p>'+t('tk_same')+'</p>':'<p>'+tt('tk_cuts',ka,kb)+'</p>';
  }else if(i===3){
    const one=(n,d,k,nn,cls)=>k>1?'<div class="eq">'+fr(n,d,cls)+' = '+fr(n+'·'+k,d+'·'+k,cls)+' = '+fr(nn,m,cls)+'</div>':'<p>'+tt('tk_keep',m)+'</p>';
    h+=one(n1,d1,ka,na,'cA')+one(n2,d2,kb,nb,'cB');
  }else if(i>=4){
    h+='<div class="eq">'+fr(na,m,'cA')+' '+sg+' '+fr(nb,m,'cB')+' = '+fr(na+' '+sg+' '+nb,m)+' = '+fr(r,m,'cG')+'</div>';
    if(i===4)h+='<p class="note">'+t('tk_op')+'</p>';
  }
  if(i===5){
    if(r===0)h+='<p>'+t('tk_zero')+'</p>';
    else{
      const rs=r/g,ms=m/g,sh=ms===1?'<b>'+rs+'</b>':fr(rs,ms,'cG');
      if(g>1)h+='<p>'+tt('tk_gcd',r,m,g)+'. '+tt('tk_simpl',g)+'</p><div class="eq">'+fr(r,m)+' = '+fr(r+' ÷ '+g,m+' ÷ '+g)+' = '+sh+'</div>';
      else h+='<p>'+tt('tk_irred',r+'/'+m)+'</p>';
      if(ms>1&&rs>ms){const w=Math.floor(rs/ms),q=rs%ms;
        h+='<p>'+t('tk_mixed')+' <span class="eq"><b class="cG">'+w+'</b>'+(q?fr(q,ms,'cG'):'')+'</span></p>';}
    }
  }
  if(errOn)h+=errHTML();
  return h;
}
function errHTML(){
  const {n1,d1,n2,d2,op}=S,{en,ed,f1,f2,m,r}=V,sg=op==='+'?'+':MINUS;
  let h='<div class="errb"><p><b class="cW">'+t(op==='+'?'err_head_p':'err_head_m')+'</b></p>'+
    '<div class="eq">'+fr(n1,d1)+' '+sg+' '+fr(n2,d2)+' = '+fr('('+n1+' '+sg+' '+n2+')','('+d1+' '+sg+' '+d2+')')+' = '+fr(en,ed,'cW')+' ✗</div>';
  const ok=fs(r,m),bad=en+'/'+ed;
  if(ed<=0)h+='<p>'+tt('err_neg',d1,d2)+'</p>';
  else{
    const fv=en/ed;
    if(op==='+'&&fv<Math.max(f1,f2)-1e-9)h+='<p>'+tt('err_less',bad,fs(f1>=f2?n1:n2,f1>=f2?d1:d2))+'</p>';
    else if(op!=='+'&&fv>f1+1e-9)h+='<p>'+tt('err_more',bad,n1+'/'+d1)+'</p>';
    else if(fv<0)h+='<p>'+tt('err_negv',bad)+'</p>';
    else h+='<p>'+tt('err_gen',fs(en,ed),ok)+'</p>';
  }
  return h+'</div>';
}
function paint(){$('#ticket').innerHTML=ticketHTML(SE.i);}

/* ===== dibuix ===== */
const W=640,H1=264,H2=352,X0=46,LW=570,BH=40,YA=36,YB=104,YC=180,YD=300;
const cv=$('#cv'),ctx=cv.getContext('2d');let HH=H1;
function fitCv(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*dpr*HH/W);const sc=cv.width/W;ctx.setTransform(sc,0,0,sc,0,0);}
function setH(h){HH=h;cv.style.aspectRatio=W+'/'+h;fitCv();}
new ResizeObserver(fitCv).observe(cv);setH(H1);
function setErr(v){errOn=!!v;setH(errOn?H2:H1);syncControls();}
const ease=x=>x*x*(3-2*x);
const FM='ui-monospace,Menlo,Consolas,monospace';
let ph=0,target=0;
function draw(){
  const c=C(),x=ctx;x.clearRect(0,0,W,HH);
  const {n1,d1,n2,d2,op}=S,{m,ka,na,nb,r,g,mx,f1,f2,R,en,ed}=V;
  const U=LW/mx,X=v=>X0+v*U;
  const e1=ease(clamp(ph,0,1)),e2=ease(clamp(ph-1,0,1)),e3=ease(clamp(ph-2,0,1)),e4=ease(clamp(ph-3,0,1)),e5=ease(clamp(ph-4,0,1));
  const txt=(s,px,py,col,size,al)=>{x.font='700 '+(size||20)+'px '+FM;x.fillStyle=col;x.textAlign=al||'left';x.fillText(s,px,py);};
  const frame=(y)=>{x.fillStyle=c.panel;x.fillRect(X0,y,LW,BH);x.strokeStyle=c.line;x.lineWidth=1.5;x.strokeRect(X0,y,LW,BH);};
  const ticks=(y,den,col,al,w)=>{
    x.strokeStyle=col;x.lineWidth=w||1;
    for(let k=1;k<den*mx;k++){const xx=X(k/den);x.globalAlpha=(k%den===0)?Math.min(1,al*2.2):al;x.lineWidth=(k%den===0)?2.5:(w||1);x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+BH);x.stroke();}
    x.globalAlpha=1;
  };
  const block=(v0,v1,y,col,al,den)=>{
    if(v1<=v0)return;
    x.globalAlpha=al;x.fillStyle=col;x.fillRect(X(v0),y,(v1-v0)*U,BH);
    x.strokeStyle=c.panel;x.lineWidth=1.5;x.globalAlpha=al*.85;
    for(let k=1;v0+k/den<v1-1e-9;k++){const xx=X(v0+k/den);x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+BH);x.stroke();}
    x.globalAlpha=1;
  };
  const hatch=(v0,v1,y,col,al)=>{
    const px=X(v0),w=(v1-v0)*U;if(w<=0)return;
    x.save();x.beginPath();x.rect(px,y,w,BH);x.clip();x.strokeStyle=col;x.globalAlpha=al;x.lineWidth=2.5;
    for(let k=-BH;k<w;k+=9){x.beginPath();x.moveTo(px+k,y+BH);x.lineTo(px+k+BH,y);x.stroke();}
    x.restore();x.globalAlpha=1;
  };
  /* guies verticals entre barres */
  if(e2>0&&m*mx<=60){x.strokeStyle=c.ink;x.globalAlpha=.16*e2;x.lineWidth=1;x.setLineDash([3,4]);
    for(let k=1;k<m*mx;k++){const xx=X(k/m);x.beginPath();x.moveTo(xx,YA+BH);x.lineTo(xx,YB);x.moveTo(xx,YB+BH);x.lineTo(xx,YC);x.stroke();}
    x.setLineDash([]);x.globalAlpha=1;}
  /* fila A i B */
  frame(YA);ticks(YA,d1,c.ink,.22);block(0,f1,YA,c.pa,.9,d1);
  frame(YB);ticks(YB,d2,c.ink,.22);block(0,f2,YB,c.pb,.9,d2);
  if(e2>0){ticks(YA,m,c.ink,.5*e2);ticks(YB,m,c.ink,.5*e2);}
  /* fila C */
  frame(YC);
  if(e1<.02)txt('?',X0+LW/2,YC+BH/2+9,c.muted,28,'center');
  if(e1>0){
    const yy=lerp(YA,YC,e1),yb=lerp(YB,YC,e1);
    block(0,f1,yy,c.pa,.9,d1);
    if(op==='+')block(lerp(0,f1,e1),lerp(0,f1,e1)+f2,yb,c.pb,.9,d2);
    else{
      const off=lerp(0,f1-f2,e1);
      block(off,off+f2,yb,c.pb,lerp(.9,.3,e1),d2);
      hatch(off,off+f2,yb,c.pb,.9*e1);
    }
  }
  if(e4>0&&r>0){x.globalAlpha=.68*e4;x.fillStyle=c.ok;x.fillRect(X0,YC,R*U,BH);x.globalAlpha=1;}
  if(mx===2){x.strokeStyle=c.ink;x.globalAlpha=.85;x.lineWidth=2.5;x.beginPath();x.moveTo(X(1),YC);x.lineTo(X(1),YC+BH);x.stroke();x.globalAlpha=1;}
  if(e2>0){
    x.strokeStyle=c.ink;
    for(let k=1;k<m*mx;k++){
      const xx=X(k/m),inside=k<=r&&r>0;
      let al=.5*e2;
      if(inside&&g>1&&k%g!==0)al*=(1-e5);
      x.globalAlpha=al;x.lineWidth=(inside&&g>1&&k%g===0)?1+1.4*e5:1;
      x.beginPath();x.moveTo(xx,YC);x.lineTo(xx,YC+BH);x.stroke();
    }
    x.globalAlpha=1;
  }
  /* etiquetes */
  const sg=op==='+'?'+':MINUS;
  const lab1=ph>=2.5&&ka>1?n1+'/'+d1+' = '+na+'/'+m:n1+'/'+d1;
  const lab2=ph>=2.5&&V.kb>1?n2+'/'+d2+' = '+nb+'/'+m:n2+'/'+d2;
  txt(lab1,X0,YA-8,c.pa);txt(lab2,X0,YB-8,c.pb);
  let lc=t('cv_q');
  if(ph>=3.5){lc=r===0?'0':r+'/'+m;if(ph>=4.5&&g>1&&r>0)lc+=' = '+(r/g)+'/'+(m/g);}
  txt(ph>=3.5?'= '+lc:lc,X0,YC-8,ph>=3.5?c.ok:c.muted);
  if(e2>.5&&d1!==d2)txt(tt('cv_den',m),X0+LW,YC-8,c.muted,15,'right');
  txt(sg,X0-22,YB+BH/2+8,c.ink,26,'center');txt('=',X0-22,YC+BH/2+8,c.ink,26,'center');
  /* clau del resultat */
  if(e4>0&&r>0){
    const y=YC+BH+8,x1=X0+1,x2=X(R)-1;
    x.strokeStyle=c.ok;x.globalAlpha=e4;x.lineWidth=2;x.beginPath();x.moveTo(x1,y);x.lineTo(x1,y+7);x.lineTo(x2,y+7);x.lineTo(x2,y);x.stroke();
    const sp=e5>.5&&g>1?(r/g)+'/'+(m/g):r+'/'+m;
    txt(sp,(x1+x2)/2,y+28,c.ok,20,'center');x.globalAlpha=1;
  }
  /* fila D: error típic */
  if(errOn){
    frame(YD);
    if(ed>0){
      ticks(YD,Math.min(ed,36),c.ink,.22);
      const fv=en/ed;
      if(fv>0)block(0,Math.min(fv,mx),YD,c.warn,.85,Math.min(ed,36));
      txt(t('cv_err')+' '+en+'/'+ed+' ✗',X0,YD-8,c.warn);
    }else{txt(t('cv_err')+' ✗',X0,YD-8,c.warn);txt(t('cv_bad'),X0+LW/2,YD+BH/2+6,c.warn,16,'center');}
    if(r>0){x.strokeStyle=c.ok;x.lineWidth=2;x.setLineDash([6,5]);x.globalAlpha=.9;x.beginPath();x.moveTo(X(R),YC+BH+34);x.lineTo(X(R),YD+BH+6);x.stroke();x.setLineDash([]);x.globalAlpha=1;}
  }
}
function loop(){
  if(ph!==target){const d=target-ph;ph=REDUCE||Math.abs(d)<.002?target:ph+Math.sign(d)*Math.min(Math.abs(d),.04);}
  draw();requestAnimationFrame(loop);
}

/* ===== passos ===== */
const STEPS=[
 {id:'a0',ask:{n:3,ok:1}},
 {id:'a1',ask:{n:2,ok:1}},
 {id:'a2',ask:{n:3,ok:1},think:true},
 {id:'a3',ask:{n:3,ok:1}},
 {id:'a4',ask:{n:3,ok:1}},
 {id:'a5',think:true}
];

/* ===== Raona-ho ===== */
const isI=Number.isInteger;
const okFr=(n,d)=>isI(n)&&isI(d)&&d>=2&&d<=12&&n>=1&&n<=d;
const RNG={k:'rng'};
function load(n1,d1,op,n2,d2,err){
  setFr(n1,d1,op,n2,d2,err);
  stepGo(5);
  RZ.show($('#cv'));
}
RZ.init({
 sim:v=>load(...v),
 M:[
  {id:'m1',f:['l_num','l_den'],sim:([n,d])=>load(1,4,'+',n,d),ok:()=>({k:'m1_ok'}),
   chk:([n,d])=>!okFr(n,d)?RNG:(2*n===d?null:{k:'m1_f',p:[n,d,fs(d+4*n,4*d)]})},
  {id:'m2',f:['l_a','l_b','l_c','l_d'],sim:([a,b,c,d])=>load(a,b,'+',c,d),ok:()=>({k:'m2_ok'}),
   chk:([a,b,c,d])=>!(okFr(a,b)&&okFr(c,d))?RNG:b===d?{k:'m2_same'}:(a*d+c*b===b*d?null:{k:'m2_f',p:[fs(a*d+c*b,b*d)]})},
  {id:'m3',f:['l_mcm','l_num'],sim:()=>load(1,6,'+',1,4),ok:()=>({k:'m3_ok'}),
   chk:([m,n])=>!(isI(m)&&isI(n))?RNG:m!==12?{k:'m3_m'}:n!==5?{k:'m3_n'}:null},
  {id:'m4',f:['l_num'],sim:([n])=>load(3,4,'-',n,8),ok:()=>({k:'m4_ok'}),
   chk:([n])=>!(isI(n)&&n>=1&&n<=8)?RNG:n>6?{k:'m4_neg'}:n!==2?{k:'m4_f',p:[n,fs(6-n,8)]}:null}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load(1,2,'+',1,3)},
  {id:'s2',ans:'D',f:['l_a','l_b','l_c','l_d'],cxsim:([a,b,c,d])=>load(a,b,'+',c,d),
   cx:([a,b,c,d])=>!(okFr(a,b)&&okFr(c,d)&&a<b&&c<d)?{k:'s2_range'}:(a*d+c*b>=b*d?null:{k:'s2_no',p:[fs(a*d+c*b,b*d)]})},
  {id:'s3',ans:'M',sim:()=>load(1,2,'+',1,3,true)},
  {id:'s4',ans:'S',sim:()=>load(1,3,'+',1,4)},
  {id:'s5',ans:'D',f:['l_a','l_b','l_c','l_d'],cxsim:([a,b,c,d])=>load(a,b,'+',c,d),
   cx:([a,b,c,d])=>{if(!(okFr(a,b)&&okFr(c,d)))return RNG;const m=lcm(b,d),r=a*(m/b)+c*(m/d);return g2(r,m)>1?null:{k:'s5_no',p:[fs(r,m)]};}}
 ],
 E:[{id:'e1',who:1,args:[1,2,'+',1,3,true]},{id:'e2',who:1,args:[3,4,'-',1,2,true]},{id:'e3',who:2,args:[1,4,'+',1,4]}],
 D:[
  {id:'d1',chips:{vals:[1,2],fmt:x=>t(x===1?'yes':'no')},f:['d1.l0'],sim:()=>load(3,4,'+',2,3),
   chk:([p,n])=>n!==17?{k:'d1_n'}:p!==2?{k:'d1_p'}:null,ok:()=>({k:'d1_ok'})},
  {id:'d2',f:['d2.l0'],sim:()=>load(1,3,'+',1,4),ok:()=>({k:'d2_ok'}),
   chk:([n])=>n===5?null:n===7?{k:'d2_7'}:{k:'d2_n'}}
 ]
});
const QDATA=[
 {"id":"r1","lvl":"all","type":"mc","n":4,"ans":1},
 {"id":"r2","lvl":"all","type":"num","num":5,"tol":0},
 {"id":"r3","lvl":"all","type":"mc","n":4,"ans":1},
 {"id":"r4","lvl":"all","type":"num","num":19,"tol":0},
 {"id":"r5","lvl":"all","type":"mc","n":4,"ans":2},
 {"id":"r6","lvl":"all","type":"mc","n":4,"ans":1},
 {"id":"r7","lvl":"all","type":"mc","n":4,"ans":0}
];
initQuiz(QDATA);
initLang();
$$('#opsw button').forEach(b=>b.addEventListener('click',()=>{S.op=b.dataset.op;syncControls();change();}));
['n1','n2'].forEach(id=>$('#'+id).addEventListener('change',()=>readControls()));
['d1','d2'].forEach(id=>$('#'+id).addEventListener('change',()=>readControls(id)));
$('#errbtn').addEventListener('click',()=>{setErr(!errOn);paint();});
derive();syncControls();applyLang();
document.addEventListener('langchange',()=>{buildPresets();paint();});

buildPresets();
stepsInit(STEPS,(i)=>{target=i;paint();});
requestAnimationFrame(loop);
</script>
