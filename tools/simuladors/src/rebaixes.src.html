<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebaixes encadenades: 20 % + 20 % no és 40 %</title>
<meta name="description" content="Percentatges encadenats a ull: un 20 % i després un altre 20 % de rebaixa no fan un 40 %. Model d'àrea i barres de preu per a 1r d'ESO, amb pujades i baixades, predicció i test autocorregit.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px 18px}
.op{display:grid;gap:4px}
.op .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.op output{font-family:var(--f-num);font-weight:700;font-size:16px}
.op1 output{color:var(--pa)}.op2 output{color:var(--pb)}
.numin{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.numin input{font:inherit;font-size:15px;width:6em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.msg{min-height:1.5em;font-size:14.5px;margin:0}
.msg.good{color:var(--ok);font-weight:600}.msg.bad{color:var(--warn);font-weight:600}
.ticket{font-family:var(--f-num);font-size:15px;line-height:1.75;background:var(--stage);border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
.ticket .a{color:var(--pa);font-weight:700}.ticket .b{color:var(--pb);font-weight:700}.ticket .w{color:var(--warn);font-weight:700}.ticket .g{color:var(--ok);font-weight:700}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <!--@LVLSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>
<div class="row"><span class="mut" data-i18n="presets"></span><div class="chips" id="presets"></div></div>
<div class="numin"><label for="price" data-i18n="price"></label><input type="text" inputmode="decimal" id="price" value="100" autocomplete="off"><span>€</span></div>
<div class="ops">
<div class="op op1"><div class="head"><b data-i18n="first"></b><select id="t1" aria-label="1"><option value="-1" data-i18n="down"></option><option value="1" data-i18n="up"></option></select><output id="p1v"></output></div><input type="range" id="p1" min="5" max="90" step="5" value="20" data-i18n-aria="aria.p1" aria-label=""></div>
<div class="op op2"><div class="head"><b data-i18n="second"></b><select id="t2" aria-label="2"><option value="-1" data-i18n="down"></option><option value="1" data-i18n="up"></option></select><output id="p2v"></output></div><input type="range" id="p2" min="5" max="90" step="5" value="20" data-i18n-aria="aria.p2" aria-label=""></div>
</div>
<div class="numin"><label for="guess" data-i18n="guess_q"></label><input type="text" inputmode="decimal" id="guess" autocomplete="off"><span>€</span>
<button class="btn primary" id="go" type="button" data-i18n="go"></button><button class="btn" id="again" type="button" data-i18n="again"></button></div>
<canvas id="cv"></canvas>
<p class="msg" id="msg" aria-live="polite"></p>
<div class="ticket" id="ticket"></div>
<div class="idea" data-lvl="basic" data-i18n-html="idea_basic"></div>
<div class="idea" data-lvl="adv"><div data-i18n-html="idea_adv"></div><div class="ticket" id="mult" style="margin-top:8px"></div></div>
</section>

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/* ===== Rebaixes encadenades ===== */
const W=900,H=440,cx=fitCanvas($('#cv'),W,H);
const PRE=[[-1,20,-1,20],[-1,50,-1,50],[-1,30,-1,10],[-1,10,-1,30],[-1,30,-1,20],[1,20,-1,20],[-1,20,1,20],[1,10,-1,10]];
let P=100,s1=-1,p1=20,s2=-1,p2=20,phase=0,target=0,guess=null,msgFn=null;
const fx=(v,d)=>v.toFixed(d).replace('.',',');
const eur=v=>{const r=Math.round(v*100)/100;return fx(r,2).replace(/,00$/,'')+' €';};
const pct=v=>{const r=Math.round(v*100)/100;return Number.isInteger(r)?String(r):fx(r,2).replace(/0$/,'');};
function presetLabel(a){return (a[0]<0?'−':'+')+a[1]+' % '+(a[2]<0?'−':'+')+a[3]+' %';}
function buildPresets(){const box=$('#presets');box.innerHTML='';
  PRE.forEach(a=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=presetLabel(a);
    c.setAttribute('aria-pressed',String(a[0]===s1&&a[1]===p1&&a[2]===s2&&a[3]===p2));
    c.onclick=()=>{$('#t1').value=a[0];$('#p1').value=a[1];$('#t2').value=a[2];$('#p2').value=a[3];read(true);};box.appendChild(c);});}
function read(reset){
  const v=parseNum($('#price').value);P=Number.isFinite(v)&&v>0&&v<=100000?v:100;
  s1=+$('#t1').value;p1=+$('#p1').value;s2=+$('#t2').value;p2=+$('#p2').value;
  $('#p1v').textContent=(s1<0?'−':'+')+p1+' %';$('#p2v').textContent=(s2<0?'−':'+')+p2+' %';
  if(reset){phase=0;target=0;msgFn=null;$('#msg').innerHTML='';$('#msg').className='msg';}
  buildPresets();texts();
}
['t1','t2','p1','p2'].forEach(id=>$('#'+id).addEventListener('input',()=>read(true)));
$('#price').addEventListener('input',()=>read(true));
$('#go').onclick=()=>{const g=parseNum($('#guess').value);guess=$('#guess').value.trim()!==''&&Number.isFinite(g)?g:null;phase=0;target=3;msgFn=null;$('#msg').innerHTML='';};
$('#again').onclick=()=>{$('#guess').value='';guess=null;read(true);};
function vals(){const m1=1+s1*p1/100,m2=1+s2*p2/100,v1=P*m1,v2=v1*m2,naive=P*(1+(s1*p1+s2*p2)/100);
  return {m1,m2,v1,v2,naive,tot:(m1*m2-1)*100,naiveTot:s1*p1+s2*p2};}
function texts(){
  const V=vals(),sg=s=>s<0?t('t_down'):t('t_up');
  let h=tt('t_line1',eur(P),sg(s1),p1,eur(P),eur(P*p1/100),eur(V.v1))+'<br>'+tt('t_line2',eur(V.v1),sg(s2),p2,eur(V.v1),eur(V.v1*p2/100),eur(V.v2))+'<br>';
  const tot=V.tot,sign=tot<0?'−':'+',diff=Math.abs(V.tot-V.naiveTot);
  if(Math.abs(tot)<1e-9)h+=t('t_zero');
  else if(diff<1e-9)h+=tt('t_same',sign,pct(Math.abs(tot)));
  else{const sn=v=>Math.abs(v)<1e-9?'0':(v<0?'− ':'+ ')+pct(Math.abs(v));h+=tt('t_total',sn(tot),sn(V.naiveTot),pct(diff),eur(P*diff/100));}
  if(s1!==s2&&p1===p2)h+='<br>'+tt('t_updown',eur(P),eur(V.v1));
  $('#ticket').innerHTML=phase>=2.99?h:h.split('<br>').slice(0,phase>=1.99?2:phase>=0.99?1:0).join('<br>');
  $('#mult').innerHTML=tt('m_line',fx(V.m1,2).replace(/0$/,''),fx(V.m2,2).replace(/0$/,''),fx(V.m1*V.m2,4).replace(/0+$/,'').replace(/,$/,''),tt('m_pay',pct(V.m1*V.m2*100)));
  if(msgFn)msgFn();
}
function finish(){
  const V=vals();
  msgFn=()=>{const m=$('#msg');
    if(guess===null){m.className='msg';m.innerHTML='';return;}
    if(Math.abs(guess-V.v2)<=0.011+V.v2*0.002){m.className='msg good';m.innerHTML=tt('g_ok',eur(V.v2));}
    else if(Math.abs(guess-V.naive)<=0.011+V.naive*0.002&&Math.abs(V.naive-V.v2)>0.01){m.className='msg bad';m.innerHTML=tt('g_naive',eur(guess),eur(V.v2));}
    else{m.className='msg bad';m.innerHTML=tt('g_ko',eur(guess),eur(V.v2));}};
  texts();
}
function hatch(x,y,w,h,col){cx.save();cx.beginPath();cx.rect(x,y,w,h);cx.clip();cx.strokeStyle=col;cx.lineWidth=2;cx.beginPath();
  for(let k=-h;k<w+h;k+=9){cx.moveTo(x+k,y);cx.lineTo(x+k+h,y+h);}cx.stroke();cx.restore();}
function draw(){
  const ink=css('--ink'),mut=css('--muted'),pa=css('--pa'),pb=css('--pb'),ok=css('--ok'),wn=css('--warn'),panel=css('--panel');
  cx.fillStyle=css('--stage');cx.fillRect(0,0,W,H);
  const V=vals(),f1=clamp(phase,0,1),f2=clamp(phase-1,0,1),f3=clamp(phase-2,0,1);
  const both=s1<0&&s2<0;
  /* --- model d'àrea (només per a dues rebaixes) o barres verticals --- */
  const S=340,X0=40,Y0=50;
  if(both){
    const a=p1/100,b=p2/100;
    cx.fillStyle=ok;cx.globalAlpha=.25;cx.fillRect(X0,Y0,S,S);cx.globalAlpha=1;
    /* quadrícula 10×10 */
    cx.strokeStyle=mut;cx.globalAlpha=.25;cx.lineWidth=1;cx.beginPath();for(let i=1;i<10;i++){cx.moveTo(X0+i*S/10,Y0);cx.lineTo(X0+i*S/10,Y0+S);cx.moveTo(X0,Y0+i*S/10);cx.lineTo(X0+S,Y0+i*S/10);}cx.stroke();cx.globalAlpha=1;
    /* 1a rebaixa: franja vertical a la dreta */
    if(f1>0){const w=S*a;cx.fillStyle=pa;cx.globalAlpha=.75*f1;cx.fillRect(X0+S-w,Y0,w,S);cx.globalAlpha=1;
      cx.fillStyle=pa;cx.font='bold 15px system-ui';cx.textAlign='center';cx.globalAlpha=f1;cx.fillText('−'+p1+' %',X0+S-w/2,Y0+S+22);cx.globalAlpha=1;}
    /* 2a rebaixa: franja horitzontal a dalt, només sobre el que queda */
    if(f2>0){const h=S*b,w=S*(1-a);cx.fillStyle=pb;cx.globalAlpha=.75*f2;cx.fillRect(X0,Y0,w,h);cx.globalAlpha=1;
      cx.fillStyle=panel;cx.font='bold 15px system-ui';cx.textAlign='center';cx.globalAlpha=f2;if(h>=20)cx.fillText('−'+p2+' %',X0+w/2,Y0+h/2+5);cx.globalAlpha=1;}
    /* racó: el que sumaríem dues vegades */
    if(f3>0){const w=S*a,h=S*b;cx.globalAlpha=f3;hatch(X0+S-w,Y0,w,h,wn);cx.strokeStyle=wn;cx.lineWidth=3;cx.setLineDash([6,4]);cx.strokeRect(X0+S-w,Y0,w,h);cx.setLineDash([]);
      cx.fillStyle=wn;cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillText(tt('l_lost',pct(p1*p2/100)),X0+S/2,Y0-12);cx.globalAlpha=1;}
    cx.strokeStyle=ink;cx.lineWidth=2.5;cx.strokeRect(X0,Y0,S,S);
    if(f2>=1){cx.fillStyle=ink;cx.font='bold 22px system-ui';cx.textAlign='center';cx.fillText(pct(100+V.tot)+' %',X0+S*(1-a)/2,Y0+S*b+(S*(1-b))/2+8);}
    else{cx.fillStyle=ink;cx.font='bold 22px system-ui';cx.textAlign='center';cx.fillText('100 %',X0+S/2,Y0+S/2+8);}
  }
  /* --- barres de preu --- */
  const bx0=both?X0+S+90:150,bw=W-bx0-100,mx=Math.max(P,V.v1,V.v2,V.naive)*1.02,BW=v=>bw*v/mx;
  const rows=[[t('l_start'),P,null,1],[t('l_after1'),V.v1,s1,f1],[t('l_after2'),V.v2,s2,f2],[t('l_naive'),V.naive,0,f3]];
  const rh=both?62:80,ry0=both?70:60;
  rows.forEach(([lab,v,sg,f],i)=>{
    if(f<=0&&i>0)return;
    const y=ry0+i*rh;cx.globalAlpha=i?f:1;
    cx.fillStyle=ink;cx.font='bold 13.5px system-ui';cx.textAlign='left';cx.fillText(lab,bx0,y-6);
