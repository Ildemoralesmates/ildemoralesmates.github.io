.side .tbl th{font:600 13px var(--f-num);text-align:left;white-space:nowrap;color:var(--ink)}

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@RAONA_JS@*/
/* ===== Thales i semblança ===== */
const svg=$('#svg'),U=25;
const DEF={A:[230,46],B:[80,290],C:[390,290]};
const T0={A:[230,90],B:[80,290],C:[380,290]}; /* triangle de les activitats: AB = AC = 10 cm, BC = 12 cm, àrea 48 cm² */
const clone=o=>JSON.parse(JSON.stringify(o));
let pts=clone(DEF),kk=0.45,drag=null;
const lerpP=(p,q,s)=>[p[0]+(q[0]-p[0])*s,p[1]+(q[1]-p[1])*s];
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
const area=(p,q,r)=>Math.abs((q[0]-p[0])*(r[1]-p[1])-(r[0]-p[0])*(q[1]-p[1]))/2/(U*U);
const sk=slider($('#ctl'),{id:'sk',key:'l_k',min:5,max:100,step:1,val:45,fmtv:v=>nf(v/100,2),on:v=>{kk=v/100;update();}});
svg.innerHTML=
  '<polygon id="tri" class="tri"/>'+
  '<line id="l-AB" class="side0"/><line id="l-AC" class="side0"/>'+
  '<line id="l-AD" class="part"/><line id="l-AE" class="part"/>'+
  '<line id="l-DE" class="par"/><line id="l-BC" class="par"/>'+
  '<circle id="pD" class="dot" r="6"/><circle id="pE" class="dot" r="6"/>'+
  ['A','B','C'].map(n=>'<circle id="p'+n+'" class="drag" r="12" tabindex="0" aria-label="'+t('aria.v'+n)+'"/>').join('')+
  ['A','B','C','D','E'].map(n=>'<text id="v'+n+'" class="vl">'+n+'</text>').join('');
const setL=(id,p,q)=>{const e=$('#'+id);e.setAttribute('x1',p[0]);e.setAttribute('y1',p[1]);e.setAttribute('x2',q[0]);e.setAttribute('y2',q[1]);};
const setC=(id,p)=>{const e=$('#'+id);e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1]);};
function update(){
  const A=pts.A,B=pts.B,C=pts.C,D=lerpP(A,B,kk),E=lerpP(A,C,kk);
  $('#tri').setAttribute('points',[A,B,C].map(p=>p.join(',')).join(' '));
  setL('l-AB',A,B);setL('l-AC',A,C);setL('l-AD',A,D);setL('l-AE',A,E);setL('l-DE',D,E);setL('l-BC',B,C);
  setC('pA',A);setC('pB',B);setC('pC',C);setC('pD',D);setC('pE',E);
  const g=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];
  const lab={A:A,B:B,C:C,D:D,E:E};
  Object.keys(lab).forEach(n=>{
    const p=lab[n],dx=p[0]-g[0],dy=p[1]-g[1],len=Math.hypot(dx,dy)||1,off=(n==='D'||n==='E')?20:26;
    const e=$('#v'+n);e.setAttribute('x',clamp(p[0]+dx/len*off,12,448).toFixed(1));e.setAttribute('y',clamp(p[1]+dy/len*off,14,326).toFixed(1));
  });
  const ab=dist(A,B)/U,ac=dist(A,C)/U,bc=dist(B,C)/U,ad=dist(A,D)/U,ae=dist(A,E)/U,de=dist(D,E)/U;
  const sA=area(A,B,C),sD=area(A,D,E);
  const r=(n,x,y)=>'<tr><th>'+n+'</th><td>'+nf(x,1)+' / '+nf(y,1)+' cm</td><td>'+nf(x/y,2)+'</td></tr>';
  $('#tbl').innerHTML=r('AD / AB',ad,ab)+r('AE / AC',ae,ac)+r('DE / BC',de,bc)+
    '<tr><th>'+t('row_area')+'</th><td>'+nf(sD,1)+' / '+nf(sA,1)+' cm²</td><td>'+nf(sD/sA,2)+'</td></tr>';
  $('#note').innerHTML=tt('note',nf(kk,2),nf(kk*kk,2));
}
function toSvg(e){
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  const m=svg.getScreenCTM();
  return m?p.matrixTransform(m.inverse()):{x:p.x,y:p.y};
}
['A','B','C'].forEach(n=>{
  const e=$('#p'+n);
  e.addEventListener('pointerdown',ev=>{drag=n;try{e.setPointerCapture(ev.pointerId);}catch(x){}ev.preventDefault();});
  e.addEventListener('pointermove',ev=>{
    if(drag!==n)return;
    const p=toSvg(ev);pts[n]=[clamp(p.x,16,444),clamp(p.y,16,324)];update();
  });
  e.addEventListener('pointerup',()=>{drag=null;});
  e.addEventListener('pointercancel',()=>{drag=null;});
  e.addEventListener('keydown',ev=>{
    const d={ArrowLeft:[-6,0],ArrowRight:[6,0],ArrowUp:[0,-6],ArrowDown:[0,6]}[ev.key];
    if(!d)return;ev.preventDefault();
    pts[n]=[clamp(pts[n][0]+d[0],16,444),clamp(pts[n][1]+d[1],16,324)];update();
  });
});
function setK(v){kk=clamp(Math.round(v*100)/100,0.05,1);sk.set(Math.round(kk*100));update();}
$('#reset').onclick=()=>{pts=clone(DEF);update();};
App.hooks.push(update);
/* ===== Raona-ho ===== */
const inK=x=>Number.isFinite(x)&&x>=0.05&&x<=1;
const ck=f=>v=>inK(v[0])?f(...v):{k:'rng'};
const eq=(x,y)=>Math.abs(x-y)<1e-9;
const load=v=>{pts=clone(T0);setK(v);RZ.show($('#svg'));};
RZ.init({
 F:{k:{l:'l_kf'},de:{l:'l_de',u:'cm'}},
 sim:([v])=>load(v),
 M:[
  {id:'m1',f:['k'],ok:()=>({k:'m1_ok'}),
   chk:ck(x=>eq(x,0.25)?null:{k:'m1_f',p:()=>[nf(x,2),nf(12*x,2)]})},
  {id:'m2',f:['k','de'],ok:()=>({k:'m2_ok'}),
   chk:ck((x,de)=>!eq(x,0.4)?{k:'m2_k',p:()=>[nf(x,2),nf(10*x,2)]}:!eq(de,4.8)?{k:'m2_de'}:null)},
  {id:'m3',f:['k'],ok:()=>({k:'m3_ok'}),
   chk:ck(x=>eq(x,0.5)?null:eq(x,0.25)?{k:'m3_lin'}:{k:'m3_f',p:()=>[nf(x,2),nf(x*x,4)]})},
  {id:'m4',f:['k'],ok:()=>({k:'m4_ok'}),
   chk:ck(x=>eq(x,0.75)?null:Math.abs(x-0.5625)<0.006?{k:'m4_sq'}:{k:'m4_f',p:()=>[nf(x,2),nf(48*x*x,2)]})}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load(0.45)},
  {id:'s2',ans:'S',sim:()=>load(0.5)},
  {id:'s3',ans:'M',sim:()=>load(0.5)},
  {id:'s4',ans:'S',sim:()=>load(0.5)},
  {id:'s5',ans:'D',f:['k'],sim:()=>load(0.5),cx:ck(x=>x<1?null:{k:'s_cx_no',p:()=>[nf(x,2)]})},
  {id:'s6',ans:'M',sim:()=>load(0.45)}
 ],
 E:[{id:'e1',who:1,args:[0.5]},{id:'e2',who:1,args:[0.5]},{id:'e3',who:3,sim:null},{id:'e4',who:2,args:[0.4]}],
 D:[
  {id:'d1',f:[{l:'d1.l0',u:'m'}],sim:null,ok:()=>({k:'d1_ok'}),
   chk:([h])=>eq(h,9)?null:eq(h,11.5)?{k:'d1_add'}:eq(h,0.25)?{k:'d1_inv'}:eq(h,18)?{k:'d1_mul'}:{k:'d1_no',p:()=>[nf(h,2)]}},
  {id:'d2',f:[{l:'d2.l0',u:'cm'},{l:'d2.l1',u:'cm²'}],sim:()=>load(0.25),ok:()=>({k:'d2_ok'}),
   chk:([de,ar])=>!eq(de,15)?{k:'d2_de'}:eq(ar,600)?{k:'d2_lin'}:!eq(ar,150)?{k:'d2_a'}:null},
  {id:'d3',chips:{vals:[0.5,0.6,0.7,0.8]},sim:()=>load(0.7),ok:()=>({k:'d3_ok'}),
   chk:([p])=>eq(p,0.7)?null:p<0.7?{k:'d3_lo',p:()=>[nf(p,1),nf(p*p*100,0)+' %']}:{k:'d3_hi',p:()=>[nf(p,1),nf(p*p*100,0)+' %']}}
 ]
});
initQuiz([]);
update();
initLang();applyLang();
</script>
