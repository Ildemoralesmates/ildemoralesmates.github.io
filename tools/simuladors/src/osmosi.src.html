function simReset(sim,nsL,nsR){

}
function simMeasure(sim){
  const nL=[0,0],nR=[0,0];

    p.vx+=(Math.random()-0.5)*0.35;p.vy+=(Math.random()-0.5)*0.35;
    const kk=Math.hypot(p.vx,p.vy)||1,v=BASE[p.t]*sq;
    p.vx=p.vx/kk*v;p.vy=p.vy/kk*v;
    let nx=p.x+p.vx*dtf,ny=p.y+p.vy*dtf;
    const leftNow=p.x<XM;
    if((nx<XM)!==leftNow){
      const hA=leftNow?sim.hL:sim.hR,hB=leftNow?sim.hR:sim.hL;
      const dh=hB-hA,acc=dh>0?Math.max(0,1-0.35*dh/100):1;
      if(!(canPass(sim,p.t,ny)&&Math.random()<acc)){nx=p.x;p.vx=-p.vx;}
    }
    const left=nx<XM,top=left?topL:topR;
    if(left){if(nx<XL+p.r){nx=XL+p.r;p.vx=Math.abs(p.vx);}}
    else{if(nx>XR-p.r){nx=XR-p.r;p.vx=-Math.abs(p.vx);}}
    if(ny>YB-p.r){ny=YB-p.r;p.vy=-Math.abs(p.vy);}
    if(ny<top+p.r){ny=top+p.r;p.vy=Math.abs(p.vy);}
    p.x=nx;p.y=ny;
  }
  sim.t+=dtf/60;
}

/* --- interfície --- */
const sim=makeSim();
let ocv,octx,paused=false,scene='tank',nsL0=0,nsR0=0,lastTs=0,roTick=0,slL,slR,slT;
function lblKey(side){return scene==='cell'?(side?'lblRc':'lblLc'):(side?'lblR':'lblL');}
function concOf(n){const tot=n[0]+KS*n[1];return tot?100*KS*n[1]/tot:0;}
function paintCtl(){
  $$('#omemb button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===sim.memb)));
  $('#opause').textContent=t(paused?'play':'pause');
  [[slL,scene==='cell'?'sLc':'sL'],[slR,scene==='cell'?'sRc':'sR']].forEach(p=>{const l=p[0].el.querySelector('label');l.dataset.i18n=p[1];l.textContent=t(p[1]);});
  slL.refresh();slR.refresh();slT.refresh();
}
function paintReadout(){
  const ro=$('#ro');
  const side=(key,n,h)=>{const c=concOf(n);
    return '<div><b>'+t(key)+'</b><br>'+t('ro_s')+': '+n[1]+' · '+t('ro_w')+': '+n[0]+'<br>'+t('ro_c')+': <b>'+c.toFixed(0)+' %</b><div class="meter"><i style="width:'+Math.min(100,c*1.6)+'%"></i></div>'+t('ro_l')+': '+Math.round(100*h/200)+' %</div>';};
  let extra='';
  if(scene==='cell'){
    const v=100*sim.hL/200;
    extra='<div><b>'+t('ro_v')+':</b> '+v.toFixed(0)+' % → '+t(v>112?'v_big':(v<88?'v_small':'v_ok'))+'</div>';
  }
  ro.innerHTML='<div class="two">'+side(lblKey(0),sim.nL,sim.hL)+side(lblKey(1),sim.nR,sim.hR)+'</div>'+extra;
}
function doReset(){simReset(sim,nsL0,nsR0);}
function waterColor(c,dark){
  return dark?'rgb('+Math.round(18+c*0.9)+','+Math.round(52-c*0.2)+','+Math.round(92-c*0.6)+')':'rgb('+Math.round(205+c*0.7)+','+Math.round(232-c*0.6)+','+Math.round(250-c*1.5)+')';
}
function drawO(){
  const ratio=ocv.cv.width/OW,ctx=ocv.ctx,col=C();
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.clearRect(0,0,OW,OH);
  ctx.fillStyle=col.stage;ctx.fillRect(0,0,OW,OH);
  [[XL,XM,sim.hL,sim.nL],[XM,XR,sim.hR,sim.nR]].forEach(s=>{
    ctx.fillStyle=waterColor(concOf(s[3]),col.dark);ctx.fillRect(s[0],YB-s[2],s[1]-s[0],s[2]);
    ctx.strokeStyle='#5f8fc4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s[0],YB-s[2]);ctx.lineTo(s[1],YB-s[2]);ctx.stroke();
  });
  ctx.strokeStyle=col.muted;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(XL,YB-MAXH-20);ctx.lineTo(XL,YB+2);ctx.lineTo(XR,YB+2);ctx.lineTo(XR,YB-MAXH-20);ctx.stroke();
  if(scene==='cell'){ctx.strokeStyle='#2e9e5b';ctx.lineWidth=5;ctx.strokeRect(XL+2,YB-sim.hL,XM-XL-4,sim.hL);}
  const gap=sim.memb==='semi'?6:(sim.memb==='perm'?13:0);
  ctx.strokeStyle=sim.memb==='imp'?col.ink:'#a173e0';ctx.lineWidth=5;
  for(let y0=YB;y0>YB-MAXH-20;y0-=28){
    const c0=y0-14;ctx.beginPath();
    if(!gap){ctx.moveTo(XM,y0);ctx.lineTo(XM,y0-28);}
    else{ctx.moveTo(XM,y0);ctx.lineTo(XM,c0+gap);ctx.moveTo(XM,c0-gap);ctx.lineTo(XM,y0-28);}
    ctx.stroke();
  }
  const ps=sim.parts;
  for(let i=0;i<ps.length;i++){
    const p=ps[i];ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);
    if(p.t){ctx.fillStyle='#e8913a';ctx.fill();ctx.strokeStyle='#a85f12';ctx.lineWidth=1.2;ctx.stroke();}
    else{ctx.fillStyle='#4aa3e8';ctx.fill();}
  }
  ctx.fillStyle=col.ink;ctx.font='600 15px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText(t(lblKey(0)),(XL+XM)/2,24);ctx.fillText(t(lblKey(1)),(XM+XR)/2,24);
  ctx.font='13px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillStyle='#4aa3e8';ctx.beginPath();ctx.arc(XL+4,OH-14,4,0,6.2832);ctx.fill();
  ctx.fillStyle=col.muted;ctx.fillText(t('cv_w'),XL+14,OH-9);
  ctx.fillStyle='#e8913a';ctx.beginPath();ctx.arc(XL+80,OH-14,8,0,6.2832);ctx.fill();
  ctx.fillStyle=col.muted;ctx.fillText(t('cv_s'),XL+93,OH-9);
  ctx.textAlign='center';
}
function loopO(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016);lastTs=ts;
  if(!paused)simStep(sim,dt*60);
  drawO();
  roTick+=dt;if(roTick>0.25){roTick=0;paintReadout();}
  requestAnimationFrame(loopO);
}
function applyPreset(p){
  scene=p.scene;sim.memb=p.m;nsL0=p.L;nsR0=p.R;sim.T=1;
  slL.set(p.L);slR.set(p.R);slT.set(1);
  paused=false;paintCtl();doReset();paintReadout();
}
function initO(){
  ocv=makeCanvas($('#oc'),OW,OH);
  const host=$('#osl');
  slL=slider(host,{id:'oL',key:'sL',min:0,max:30,step:1,val:0,fmtv:v=>String(v),on:v=>{nsL0=v;}});
  slR=slider(host,{id:'oR',key:'sR',min:0,max:30,step:1,val:0,fmtv:v=>String(v),on:v=>{nsR0=v;}});
  slT=slider(host,{id:'oT',key:'sT',min:0.3,max:3,step:0.1,val:1,fmtv:v=>'×'+v.toFixed(1),on:v=>{sim.T=v;}});
  slL.inp.addEventListener('change',doReset);slR.inp.addEventListener('change',doReset);
  $$('#omemb button').forEach(b=>b.addEventListener('click',()=>{sim.memb=b.dataset.m;paintCtl();}));
  $('#opause').addEventListener('click',()=>{paused=!paused;paintCtl();});
  $('#oreset').addEventListener('click',doReset);
  requestAnimationFrame(loopO);
}
initQuiz(QDATA);
initLang();initO();applyLang();
document.addEventListener('langchange',()=>{paintCtl();paintReadout();});
stepsInit(STEPS,(i)=>{applyPreset(STEPS[i].preset);});
</script>
