<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Màxim comú divisor amb rectangles</title>
<meta name="description" content="Cobreix un rectangle amb les rajoles quadrades més grans possible: el màxim comú divisor (mcd) a ull i l'algorisme d'Euclides animat. Per a 1r d'ESO, amb predicció, casos predefinits i test autocorregit.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
.predict,.numin{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.predict input,.numin input{font:inherit;font-size:15px;width:5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.msg{min-height:1.5em;font-size:14.5px;margin:0}
.msg.good{color:var(--ok);font-weight:600}
.msg.bad{color:var(--warn);font-weight:600}
.divs{font-family:var(--f-num);font-size:14px;line-height:1.9}
.divs span{display:inline-block;min-width:2.2em;text-align:center;border-radius:5px;margin:0 1px}
.divs .c{background:rgba(29,138,78,.18);font-weight:700}
.divs .g{background:var(--ok);color:var(--panel);font-weight:700}
.simgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(15rem,1fr);gap:14px;align-items:start}
@media (max-width:820px){.simgrid{grid-template-columns:1fr}}
.side{display:grid;gap:10px;align-content:start;background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.side:has(.msg:empty):has(.steps:empty) .msg{display:none}
.side .divs{font-size:13.5px}
.steps{font-family:var(--f-num);font-size:14px;line-height:1.7;margin:0;padding-left:1.3em}
.steps li.on{color:var(--pa);font-weight:700}
.tabs button{padding:7px 12px;font-size:13.5px}
.rzp{display:grid;gap:12px}
.task{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--stage);display:grid;gap:8px}
.task.done{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.task p{margin:0}
.task .q{color:var(--ink)!important;font-size:15px!important}
.pairin{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.pairin input,.task input[type=text]{font:inherit;font-size:15px;width:4.5em;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.sdm{display:flex;gap:6px;flex-wrap:wrap}
.sdm .opt,.whobtn .opt{min-width:7em;text-align:center}
.opt[aria-pressed=true]{border-color:var(--pa);border-width:2px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.who{grid-template-columns:1fr}}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--ink)}
.bubble b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.whobtn,.whyopts{display:grid;gap:6px}
.whobtn{grid-template-columns:repeat(auto-fit,minmax(8rem,1fr))}
.task textarea{font:inherit;font-size:14.5px;width:100%;min-height:4.5em;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical}
.model{border-left:4px solid var(--ok);background:var(--chip);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.more{font-size:14px;color:var(--ink);background:var(--chip);border-radius:8px;padding:8px 12px}
.more::before{content:"🤔 ";}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <!--@LVLSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>
<div class="row"><span class="mut" data-i18n="presets"></span><div class="chips" id="presets"></div></div>
<div class="numin">
<label for="ra" data-i18n="side_a"></label><input type="number" id="ra" min="1" max="300" value="24">
<label for="rb" data-i18n="side_b"></label><input type="number" id="rb" min="1" max="300" value="36">
<button class="btn" id="apply" type="button" data-i18n="apply"></button>
</div>
<div class="predict">
<label for="guess" data-i18n="guess_q"></label><input type="text" inputmode="numeric" id="guess" autocomplete="off">
<button class="btn primary" id="check" type="button" data-i18n="check_guess"></button>
</div>
<div class="row">
<div class="seg" id="mode" role="group" data-i18n-aria="aria.mode" aria-label=""><button type="button" data-m="tile" aria-pressed="true" data-i18n="m_tile"></button><button type="button" data-m="euc" aria-pressed="false" data-i18n="m_euc"></button></div>
</div>
<div class="ctrl" id="tilectl"><label for="d"><span data-i18n="tile_side"></span>: <b id="dv"></b></label><input type="range" id="d" min="1" max="24" step="1" value="5"></div>
<div class="row" id="eucctl" hidden><button class="btn primary" id="eplay" type="button" data-i18n="e_play"></button><button class="btn" id="estep" type="button" data-i18n="e_step"></button></div>
<div class="simgrid">
<div class="simcv"><canvas id="cv"></canvas></div>
<div class="side">
<p class="msg" id="msg" aria-live="polite"></p>
<div class="divs" id="divs"></div>
<ol class="steps" id="steps"></ol>
</div>
</div>
<div class="idea" data-lvl="basic" data-i18n-html="idea_basic"></div>
<div class="idea" data-lvl="adv" data-i18n-html="idea_adv"></div>
</section>

<section class="card" id="reason">
<h2><small data-i18n="rz_eyebrow"></small><span data-i18n="rz_title"></span></h2>
<p data-i18n="rz_intro"></p>
<div class="seg tabs" id="rztabs" role="group" data-i18n-aria="aria.rz" aria-label=""><button type="button" data-t="M" aria-pressed="true" data-i18n="rz_tM"></button><button type="button" data-t="S" aria-pressed="false" data-i18n="rz_tS"></button><button type="button" data-t="E" aria-pressed="false" data-i18n="rz_tE"></button><button type="button" data-t="D" aria-pressed="false" data-i18n="rz_tD"></button></div>
<div id="rzM" class="rzp"></div>
<div id="rzS" class="rzp" hidden></div>
<div id="rzE" class="rzp" hidden></div>
<div id="rzD" class="rzp" hidden></div>
</section>

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

/* ===== mcd amb rectangles ===== */
const gcd=(a,b)=>b?gcd(b,a%b):a;
const PRE=[[24,36],[12,18],[20,30],[16,40],[45,60],[18,48],[15,28],[21,35]];
let revealed=false,A=24,B=36,G=12,mode='tile',d=5,sq=[],shown=0,eplaying=false,eacc=0,last=0,msgFn=null;
const W=900,H=500,cx=fitCanvas($('#cv'),W,H);
const COLS=['--pa','--pb','--ok','--warn'];

function buildPresets(){const box=$('#presets');box.innerHTML='';
  PRE.forEach(([a,b])=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=a+' × '+b;
    c.setAttribute('aria-pressed',String(a===A&&b===B));c.onclick=()=>setup(a,b);box.appendChild(c);});}
function euclidSquares(){
  /* quadrats en unitats; rectangle: ample B (x), alt A (y) */
  const out=[];let x=0,y=0,w=B,h=A,step=0;
  while(w>0&&h>0){
    if(w>=h){const q=Math.floor(w/h);for(let i=0;i<q;i++)out.push({x:x+i*h,y,s:h,step});x+=q*h;w-=q*h;}
    else{const q=Math.floor(h/w);for(let i=0;i<q;i++)out.push({x,y:y+i*w,s:w,step});y+=q*w;h-=q*w;}
    step++;
  }
  return out;
}
function setup(a,b){
  A=clamp(Math.round(a)||24,1,300);B=clamp(Math.round(b)||36,1,300);
  $('#ra').value=A;$('#rb').value=B;G=gcd(A,B);
  const mn=Math.min(A,B);$('#d').max=mn;d=Math.min(d,mn);if(d<1)d=1;$('#d').value=d;
  sq=euclidSquares();shown=0;revealed=false;eplaying=false;msgFn=null;$('#msg').innerHTML='';$('#msg').className='msg';$('#guess').value='';
  buildPresets();refresh();
}
$('#apply').onclick=()=>setup(+$('#ra').value,+$('#rb').value);
['ra','rb'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')setup(+$('#ra').value,+$('#rb').value);}));
$('#d').addEventListener('input',()=>{d=+$('#d').value;msgFn=tileMsg;refresh();});
$$('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#mode button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  $('#tilectl').hidden=mode!=='tile';$('#eucctl').hidden=mode!=='euc';msgFn=mode==='tile'?tileMsg:null;if(mode==='euc'){shown=0;eplaying=false;}refresh();});
$('#eplay').onclick=()=>{if(shown>=sq.length)shown=0;eplaying=true;last=performance.now();eacc=0;};
$('#estep').onclick=()=>{eplaying=false;if(shown>=sq.length)shown=0;shown++;if(shown>=sq.length)msgFn=eucDone;refresh();};
$('#check').onclick=()=>{
  const v=Math.round(parseNum($('#guess').value)),mn=Math.min(A,B);
  if(!(v>=1&&v<=mn)){msgFn=()=>{$('#msg').className='msg bad';$('#msg').innerHTML=tt('g_bad',mn);};refresh();return;}
  if(mode!=='tile')$$('#mode button')[0].click();
  d=v;$('#d').value=v;
  msgFn=()=>{const m=$('#msg');
    if(v===G){revealed=true;m.className='msg good';m.innerHTML=tt('g_ok',G,A,B);}
    else if(A%v===0&&B%v===0){m.className='msg bad';m.innerHTML=tt('g_small',v);}
    else{m.className='msg bad';m.innerHTML=tt('g_no',v,A%v!==0?A:B);}};
  refresh();
};
function tileMsg(){
  const m=$('#msg'),rx=B%d,ry=A%d;
  if(!rx&&!ry){if(d===G)revealed=true;m.className='msg good';m.innerHTML=tt('fits',A/d,B/d,A*B/d/d,d)+(d===G?' '+tt('fits_max',A,B,G):'');}
  else{const parts=[];if(rx)parts.push(tt('nofit_w',rx));if(ry)parts.push(tt('nofit_h',ry));
    m.className='msg bad';m.innerHTML=tt('nofit',parts.join(t('and')));}
}
function eucDone(){revealed=true;$('#msg').className='msg good';$('#msg').innerHTML=tt('e_done',A,B,G);}
function divisors(n){const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r;}
function divsHTML(){
  const da=divisors(A),db=divisors(B),com=da.filter(x=>B%x===0);
  const sp=(arr)=>arr.map(x=>'<span class="'+(!revealed?(x===d&&mode==='tile'?'c':''):x===G?'g':com.includes(x)?'c':'')+'">'+x+'</span>').join('');
  $('#divs').innerHTML=tt('divs_a',A)+' '+sp(da)+'<br>'+tt('divs_b',B)+' '+sp(db)+(revealed?'<br><b>'+t('divs_c')+'</b> '+sp(com):'');
}
function stepsHTML(){
  const ol=$('#steps');ol.innerHTML='';
  if(mode!=='euc')return;
  let w=Math.max(A,B),h=Math.min(A,B),k=0,cnt=0;
  const curStep=shown?sq[Math.min(shown,sq.length)-1].step:-1;
  while(h>0){
    const q=Math.floor(w/h),r=w%h;cnt+=q;
    if(cnt-q>=shown)break;
    const li=document.createElement('li');
    li.innerHTML=App.level==='adv'?tt('st_div',w,q,h,r):(r?tt(q===1?'st_q':'st_qp',q,h,h,r):tt(q===1?'st_end1':'st_end',q,h));
    if(k===curStep)li.className='on';
    ol.appendChild(li);w=h;h=r;k++;
  }
}
function refresh(){
  $('#dv').textContent=d+' × '+d;
  if(msgFn)msgFn();else if(mode==='tile'){msgFn=tileMsg;msgFn();}else{$('#msg').innerHTML='';$('#msg').className='msg';}
  divsHTML();stepsHTML();
  draw();
}
function draw(){
  const ink=css('--ink'),mut=css('--muted'),st=css('--stage');
  cx.fillStyle=st;cx.fillRect(0,0,W,H);
  const u=Math.min((W-90)/B,(H-80)/A),ox=(W-u*B)/2+10,oy=(H-u*A)/2+8;
  const X=v=>ox+v*u,Y=v=>oy+v*u;
  /* fons i quadrícula d'unitats */
  cx.fillStyle=css('--panel');cx.fillRect(ox,oy,u*B,u*A);
  if(u>=6){cx.strokeStyle=mut;cx.globalAlpha=.16;cx.lineWidth=1;cx.beginPath();
    for(let i=1;i<B;i++){cx.moveTo(X(i),oy);cx.lineTo(X(i),Y(A));}for(let j=1;j<A;j++){cx.moveTo(ox,Y(j));cx.lineTo(X(B),Y(j));}cx.stroke();cx.globalAlpha=1;}
  if(mode==='tile'){
    const nx=Math.floor(B/d),ny=Math.floor(A/d),ok=B%d===0&&A%d===0,col=ok?css('--ok'):css('--pa');
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      cx.fillStyle=col;cx.globalAlpha=(i+j)%2?.30:.18;cx.fillRect(X(i*d),Y(j*d),u*d,u*d);cx.globalAlpha=1;
      cx.strokeStyle=col;cx.lineWidth=2;cx.strokeRect(X(i*d)+1,Y(j*d)+1,u*d-2,u*d-2);}
    /* sobrants */
    cx.fillStyle=css('--warn');cx.globalAlpha=.35;
    if(B%d)cx.fillRect(X(nx*d),oy,u*(B-nx*d),u*A);
    if(A%d)cx.fillRect(ox,Y(ny*d),u*nx*d,u*(A-ny*d));
    cx.globalAlpha=1;
    if(B%d||A%d){cx.save();cx.beginPath();if(B%d)cx.rect(X(nx*d),oy,u*(B-nx*d),u*A);if(A%d)cx.rect(ox,Y(ny*d),u*nx*d,u*(A-ny*d));cx.clip();
      cx.strokeStyle=css('--warn');cx.lineWidth=1.5;cx.beginPath();for(let k=-H;k<W+H;k+=10){cx.moveTo(k,0);cx.lineTo(k+H,H);}cx.stroke();cx.restore();}
  } else {
    const n=Math.min(shown,sq.length);
    for(let i=0;i<n;i++){const q=sq[i],col=css(COLS[q.step%4]);
      cx.fillStyle=col;cx.globalAlpha=.25;cx.fillRect(X(q.x),Y(q.y),u*q.s,u*q.s);cx.globalAlpha=1;
      cx.strokeStyle=col;cx.lineWidth=2.5;cx.strokeRect(X(q.x)+1.5,Y(q.y)+1.5,u*q.s-3,u*q.s-3);
      if(u*q.s>=26){cx.fillStyle=ink;cx.font='bold '+Math.min(22,u*q.s/3)+'px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(String(q.s),X(q.x+q.s/2),Y(q.y+q.s/2));}}
    if(n>=sq.length&&G*u>=4){cx.strokeStyle=ink;cx.globalAlpha=.55;cx.lineWidth=1;cx.setLineDash([3,3]);cx.beginPath();
      for(let i=G;i<B;i+=G){cx.moveTo(X(i),oy);cx.lineTo(X(i),Y(A));}for(let j=G;j<A;j+=G){cx.moveTo(ox,Y(j));cx.lineTo(X(B),Y(j));}cx.stroke();cx.setLineDash([]);cx.globalAlpha=1;}
  }
  cx.strokeStyle=ink;cx.lineWidth=2.5;cx.strokeRect(ox,oy,u*B,u*A);
  cx.fillStyle=ink;cx.font='bold 16px system-ui';cx.textAlign='center';cx.textBaseline='alphabetic';
  cx.fillText(String(B),ox+u*B/2,oy-10);
  cx.save();cx.translate(ox-14,oy+u*A/2);cx.rotate(-Math.PI/2);cx.fillText(String(A),0,0);cx.restore();
}
function loop(now){
  if(eplaying){eacc+=(now-last)/1000;last=now;const per=REDUCE?0:Math.max(.12,1.6/sq.length);
    let ch=false;while(eacc>=per&&shown<sq.length){eacc-=per;shown++;ch=true;if(REDUCE)break;}
    if(REDUCE){shown=sq.length;ch=true;}
    if(shown>=sq.length){eplaying=false;msgFn=eucDone;}
    if(ch)refresh();}
  requestAnimationFrame(loop);
}
App.hooks.push(refresh);
document.addEventListener('themechange',draw);
/* ===== Raona-ho ===== */
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const euSteps=(a,b)=>{let w=Math.max(a,b),h=Math.min(a,b),k=0;while(h){const r=w%h;k++;w=h;h=r;}return k;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Mt=m=>m?tt(m.k,...(m.p||[])):'';
function intOf(v){const x=parseNum(v);return Number.isInteger(x)?x:null;}
function readPair(box){const a=intOf($('.pa',box).value),b=intOf($('.pb',box).value);return a&&b&&a>=1&&b>=1&&a<=300&&b<=300?[a,b]:null;}
function pairHTML(st){return '<span class="pairin"><label>'+t('alt')+' <input type="text" inputmode="numeric" class="pa" value="'+esc(st.a)+'"></label> × <label>'+t('ample')+' <input type="text" inputmode="numeric" class="pb" value="'+esc(st.b)+'"></label></span>';}
function keepPair(box,st){$('.pa',box).oninput=e=>{st.a=e.target.value;};$('.pb',box).oninput=e=>{st.b=e.target.value;};}
function loadSim(a,b,tile){
  setup(a,b);
  if(tile){if(mode!=='tile')$$('#mode button')[0].click();d=clamp(tile,1,Math.min(A,B));$('#d').value=d;msgFn=tileMsg;refresh();}
  $('#cv').scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'center'});
}
let rzTab='M';
$$('#rztabs button').forEach(b=>b.onclick=()=>{rzTab=b.dataset.t;$$('#rztabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  ['M','S','E','D'].forEach(k=>{$('#rz'+k).hidden=k!==rzTab;});});

/* 1. Missions inverses */
const MS=[
 {id:'m1',chk:(a,b,g)=>g!==6?{k:'mf_g',p:[a,b,g]}:(a===6||b===6)?{k:'m1_f6'}:null},
 {id:'m2',chk:(a,b,g)=>g!==1?{k:'mf_g',p:[a,b,g]}:(isPrime(a)||a===1)?{k:'m2_fp',p:[a]}:(isPrime(b)||b===1)?{k:'m2_fp',p:[b]}:null},
 {id:'m3',chk:(a,b,g)=>a*b/(g*g)!==12?{k:'m3_f',p:[g,a*b/(g*g)]}:null},
 {id:'m4',chk:(a,b,g)=>a===b?{k:'m4_sq'}:euSteps(a,b)!==1?{k:'m4_f',p:[euSteps(a,b)]}:null}
].map(m=>Object.assign(m,{st:{a:'',b:'',ok:false,msg:null}}));
function renderM(){
  const box=$('#rzM');const done=MS.filter(m=>m.st.ok).length;
  box.innerHTML='<p class="score">'+tt('m_count',done,MS.length)+'</p>'+MS.map((m,i)=>
    '<div class="task'+(m.st.ok?' done':'')+'" data-id="'+m.id+'"><p class="q"><b>'+t('mission')+' '+(i+1)+'.</b> '+t(m.id+'.q')+'</p>'+
    '<div class="row">'+pairHTML(m.st)+'<button class="btn primary" type="button" data-act="chk">'+t('check')+'</button><button class="btn" type="button" data-act="sim">'+t('to_sim')+'</button></div>'+
    '<p class="msg '+(m.st.msg?(m.st.ok?'good':'bad'):'')+'" aria-live="polite">'+Mt(m.st.msg)+'</p>'+
    (m.st.ok?'<p class="more">'+t(m.id+'.more')+'</p>':'')+'</div>').join('');
  MS.forEach(m=>{const el=$('.task[data-id="'+m.id+'"]',box);keepPair(el,m.st);
    const go=()=>{const p=readPair(el);if(!p){m.st.msg={k:'m_bad'};m.st.ok=false;renderM();return;}
      const [a,b]=p,g=gcd(a,b),f=m.chk(a,b,g);m.st.ok=!f;m.st.msg=f||{k:'m_ok',p:[a,b,g]};renderM();};
    $('[data-act=chk]',el).onclick=go;
    $$('input',el).forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go();});
    $('[data-act=sim]',el).onclick=()=>{const p=readPair(el);if(p)loadSim(p[0],p[1]);else{m.st.msg={k:'m_bad'};renderM();}};});
}

/* 2. Sempre / De vegades / Mai */
const SS=[
 {id:'s1',ans:'D',cx:(a,b,g)=>g!==Math.min(a,b)?null:{k:'s_cx_no',p:[a,b,g]}},
 {id:'s2',ans:'S'},
 {id:'s3',ans:'M'},
 {id:'s4',ans:'S'},
 {id:'s5',ans:'D',cx:(a,b,g)=>!(isPrime(a)||isPrime(b))?{k:'s5_np',p:[a,b]}:g>1?null:{k:'s_cx_no',p:[a,b,g]}},
 {id:'s6',ans:'D',cx:(a,b,g)=>(a%2||b%2)?{k:'s6_ne',p:[a,b]}:g!==2?null:{k:'s_cx_no',p:[a,b,g]}}
].map(s=>Object.assign(s,{st:{choice:null,ok:false,a:'',b:'',cxOk:false,cxMsg:null}}));
function renderS(){
  const box=$('#rzS');const done=SS.filter(s=>s.st.ok&&(s.ans!=='D'||s.st.cxOk)).length;
  box.innerHTML='<p class="score">'+tt('s_count',done,SS.length)+'</p>'+SS.map(s=>{
    const st=s.st,fin=st.ok&&(s.ans!=='D'||st.cxOk);
    let h='<div class="task'+(fin?' done':'')+'" data-id="'+s.id+'"><p class="q">'+t(s.id+'.q')+'</p><div class="sdm">'+
      ['S','D','M'].map(c=>'<button class="opt" type="button" data-c="'+c+'" aria-pressed="'+(st.choice===c)+'"'+(st.ok?' disabled':'')+'>'+t('s_'+c)+'</button>').join('')+'</div>';
    if(st.choice&&!st.ok)h+='<p class="msg bad">'+tt('s_wrong',t(s.id+'.h'))+'</p>';
    if(st.ok){h+='<p class="msg good">'+t('s_ok')+'</p>';
      if(s.ans==='D'&&!st.cxOk){h+='<p>'+t('s_cx_ask')+'</p><div class="row">'+pairHTML(st)+'<button class="btn primary" type="button" data-act="cx">'+t('check')+'</button></div>';
        if(st.cxMsg)h+='<p class="msg bad">'+Mt(st.cxMsg)+'</p>';}
      if(st.cxOk)h+='<p class="msg good">'+Mt(st.cxMsg)+'</p>';
      if(fin)h+='<p class="idea">'+t(s.id+'.e')+'</p>';}
    return h+'</div>';}).join('');
  SS.forEach(s=>{const el=$('.task[data-id="'+s.id+'"]',box);
    $$('.sdm .opt',el).forEach(b=>b.onclick=()=>{s.st.choice=b.dataset.c;s.st.ok=b.dataset.c===s.ans;renderS();});
    const cb=$('[data-act=cx]',el);if(cb){keepPair(el,s.st);
      const go=()=>{const p=readPair(el);if(!p){s.st.cxMsg={k:'m_bad'};renderS();return;}
        const [a,b]=p,g=gcd(a,b),f=s.cx(a,b,g);s.st.cxOk=!f;s.st.cxMsg=f||{k:'s_cx_ok',p:[a,b,g]};renderS();if(!f)loadSim(a,b);};
      cb.onclick=go;$$('input',el).forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go();});}
  });
}

/* 3. Qui té raó? (exemples erronis) */
const ES=[{id:'e1',who:1,why:0,sim:[24,36,12]},{id:'e2',who:1,why:0,sim:[30,50,20]},{id:'e3',who:0,why:0,sim:[7,10,1]}]
 .map(e=>Object.assign(e,{st:{who:null,why:null,txt:'',model:false},order:[0,1,2].sort(()=>Math.random()-.5)}));
function renderE(){
  const box=$('#rzE');
  box.innerHTML=ES.map(e=>{const st=e.st,whoOk=st.who===e.who,whyOk=whoOk&&st.why===e.why;
    const names=[t(e.id+'.n0'),t(e.id+'.n1'),t('e_both'),t('e_none')];
    let h='<div class="task'+(whyOk?' done':'')+'" data-id="'+e.id+'"><p class="q">'+t(e.id+'.ctx')+'</p>'+
      '<div class="who"><div class="bubble"><b>'+names[0]+'</b>'+t(e.id+'.s0')+'</div><div class="bubble"><b>'+names[1]+'</b>'+t(e.id+'.s1')+'</div></div>'+
      '<p class="q"><b>1.</b> '+t('e_who')+'</p><div class="whobtn">'+names.map((n,i)=>'<button class="opt" type="button" data-who="'+i+'" aria-pressed="'+(st.who===i)+'"'+(whoOk?' disabled':'')+'>'+n+'</button>').join('')+'</div>';
    if(st.who!==null)h+='<p class="msg '+(whoOk?'good':'bad')+'">'+t(whoOk?'e_ok':'e_ko')+'</p>';
    if(whoOk){h+='<p class="q"><b>2.</b> '+t('e_why')+'</p><div class="whyopts">'+e.order.map(i=>'<button class="opt" type="button" data-why="'+i+'" aria-pressed="'+(st.why===i)+'"'+(whyOk?' disabled':'')+'>'+t(e.id+'.w'+i)+'</button>').join('')+'</div>';
      if(st.why!==null)h+='<p class="msg '+(whyOk?'good':'bad')+'">'+t(whyOk?'e_ok':'e_ko2')+'</p>';}
    if(whyOk){h+='<p class="q"><b>3.</b> '+t('e_write')+'</p><textarea placeholder="'+esc(t(e.id+'.frame'))+'" aria-label="'+esc(t('e_write'))+'">'+esc(st.txt)+'</textarea>'+
      '<div class="row"><button class="btn" type="button" data-act="model">'+t('e_model_btn')+'</button><button class="btn" type="button" data-act="sim">'+t('to_sim')+'</button></div>';
      if(st.model)h+='<div class="model"><b>'+t('e_model')+'</b> '+t(e.id+'.model')+'</div>';}
    return h+'</div>';}).join('');
  ES.forEach(e=>{const el=$('.task[data-id="'+e.id+'"]',box);
    $$('[data-who]',el).forEach(b=>b.onclick=()=>{e.st.who=+b.dataset.who;e.st.why=null;renderE();});
    $$('[data-why]',el).forEach(b=>b.onclick=()=>{e.st.why=+b.dataset.why;renderE();});
    const ta=$('textarea',el);if(ta)ta.oninput=()=>{e.st.txt=ta.value;};
    const mb=$('[data-act=model]',el);if(mb)mb.onclick=()=>{e.st.model=true;renderE();};
    const sb=$('[data-act=sim]',el);if(sb)sb.onclick=()=>loadSim(...e.sim);});
}

/* 6. Decideix */
const DS={
 d1:{v:['','',''],msg:null,ok:false,sim:[36,48,12],
   chk:([L,p,g])=>(48%L||36%L)?{k:'d1_left',p:[L]}:L<12?{k:'d1_small',p:[L]}:(p!==4||g!==3)?{k:'d1_per',p:[L]}:null},
 d2:{v:['',''],msg:null,ok:false,sim:[210,270,30],tile:null,
   chk:([T,C])=>!T?{k:'d2_pick'}:270%T?{k:'d2_cut',p:[T,270]}:210%T?{k:'d2_cut',p:[T,210]}:T===15?{k:'d2_15'}:C!==63?{k:'d2_count'}:null},
 d3:{v:['',''],msg:null,ok:false,sim:[84,120,12],
   chk:([L,N])=>(120%L||84%L)?{k:'d3_left',p:[L]}:L<12?{k:'d3_small',p:[L]}:N!==17?{k:'d3_cnt'}:null}
};
function renderD(){
  const box=$('#rzD');
  const inp=(id,i,lab)=>'<label class="pairin">'+t(id+'.l'+i)+' <input type="text" inputmode="numeric" data-i="'+i+'" value="'+esc(DS[id].v[i])+'"></label>';
  box.innerHTML=['d1','d2','d3'].map(id=>{const s=DS[id];
    let h='<div class="task'+(s.ok?' done':'')+'" data-id="'+id+'"><p class="q">'+t(id+'.q')+'</p><div class="row">';
    if(id==='d1')h+=inp(id,0)+inp(id,1)+inp(id,2);
    if(id==='d2')h+='<span class="pairin">'+t('d2.l0')+'</span><div class="chips">'+[15,20,30,45].map(x=>'<button class="chip" type="button" data-tile="'+x+'" aria-pressed="'+(s.tile===x)+'">'+x+' cm</button>').join('')+'</div>'+inp(id,1);
    if(id==='d3')h+=inp(id,0)+inp(id,1);
    h+='<button class="btn primary" type="button" data-act="chk">'+t('check')+'</button><button class="btn" type="button" data-act="sim">'+t('to_sim')+'</button></div>';
    h+='<p class="msg '+(s.msg?(s.ok?'good':'bad'):'')+'" aria-live="polite">'+Mt(s.msg)+'</p>';
    if(s.ok)h+='<p class="more">'+t(id+'.more')+'</p>';
    return h+'</div>';}).join('');
  ['d1','d2','d3'].forEach(id=>{const s=DS[id],el=$('.task[data-id="'+id+'"]',box);
    $$('input',el).forEach(i=>{i.oninput=()=>{s.v[+i.dataset.i]=i.value;};i.onkeydown=e=>{if(e.key==='Enter')go();};});
    $$('[data-tile]',el).forEach(b=>b.onclick=()=>{s.tile=+b.dataset.tile;renderD();});
    function go(){let vals;
      if(id==='d2'){const c=intOf(s.v[1]);if(s.tile&&c===null){s.msg={k:'d_bad'};s.ok=false;renderD();return;}vals=[s.tile,c];}
      else{vals=s.v.map(intOf);if(vals.some(x=>!x||x<1)){s.msg={k:'d_bad'};s.ok=false;renderD();return;}}
      const f=s.chk(vals);s.ok=!f;s.msg=f||{k:'d_ok'};renderD();}
    $('[data-act=chk]',el).onclick=go;
    $('[data-act=sim]',el).onclick=()=>{const [a,b,tl]=s.sim;loadSim(a,b,id==='d2'&&s.tile?s.tile:id==='d1'||id==='d3'?(intOf(s.v[0])||tl):tl);};
  });
}
