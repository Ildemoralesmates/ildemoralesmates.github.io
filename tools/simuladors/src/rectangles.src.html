<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Màxim comú divisor amb rectangles</title>
<meta name="description" content="Cobreix un rectangle amb les rajoles quadrades més grans possible: el màxim comú divisor (mcd) a ull i l'algorisme d'Euclides animat. Per a 1r d'ESO, amb predicció, casos predefinits i test autocorregit.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
.predict,.numin{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.predict input,.numin input{font:inherit;font-size:15px;width:5em;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.msg{min-height:1.5em;font-size:14.5px;margin:0}
.msg.good{color:var(--ok);font-weight:600}
.msg.bad{color:var(--warn);font-weight:600}
.divs{font-family:var(--f-num);font-size:14px;line-height:1.9}
.divs span{display:inline-block;min-width:2.2em;text-align:center;border-radius:5px;margin:0 1px}
.divs .c{background:rgba(29,138,78,.18);font-weight:700}
.divs .g{background:var(--ok);color:var(--panel);font-weight:700}
.steps{font-family:var(--f-num);font-size:14px;line-height:1.7;margin:0;padding-left:1.3em}
.steps li.on{color:var(--pa);font-weight:700}
</style>
<!--@GC@-->
</head>

  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <!--@LVLSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>
<div class="row"><span class="mut" data-i18n="presets"></span><div class="chips" id="presets"></div></div>
<div class="numin">
<label for="ra" data-i18n="side_a"></label><input type="number" id="ra" min="1" max="100" value="24">
<label for="rb" data-i18n="side_b"></label><input type="number" id="rb" min="1" max="100" value="36">
<button class="btn" id="apply" type="button" data-i18n="apply"></button>
</div>
<div class="predict">
<label for="guess" data-i18n="guess_q"></label><input type="text" inputmode="numeric" id="guess" autocomplete="off">
<button class="btn primary" id="check" type="button" data-i18n="check_guess"></button>
</div>
<div class="row">
<div class="seg" id="mode" role="group" data-i18n-aria="aria.mode" aria-label=""><button type="button" data-m="tile" aria-pressed="true" data-i18n="m_tile"></button><button type="button" data-m="euc" aria-pressed="false" data-i18n="m_euc"></button></div>
</div>
<div class="ctrl" id="tilectl"><label for="d"><span data-i18n="tile_side"></span>: <b id="dv"></b></label><input type="range" id="d" min="1" max="24" step="1" value="5"></div>
<div class="row" id="eucctl" hidden><button class="btn primary" id="eplay" type="button" data-i18n="e_play"></button><button class="btn" id="estep" type="button" data-i18n="e_step"></button></div>
<canvas id="cv"></canvas>
<p class="msg" id="msg" aria-live="polite"></p>
<div class="grid2">
<div class="divs" id="divs"></div>
<div><ol class="steps" id="steps"></ol></div>
</div>
<div class="idea" data-lvl="basic" data-i18n-html="idea_basic"></div>
<div class="idea" data-lvl="adv" data-i18n-html="idea_adv"></div>
</section>

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/* ===== mcd amb rectangles ===== */
const gcd=(a,b)=>b?gcd(b,a%b):a;
const PRE=[[24,36],[12,18],[20,30],[16,40],[45,60],[18,48],[15,28],[21,35]];
let revealed=false,A=24,B=36,G=12,mode='tile',d=5,sq=[],shown=0,eplaying=false,eacc=0,last=0,msgFn=null;
const W=900,H=500,cx=fitCanvas($('#cv'),W,H);
const COLS=['--pa','--pb','--ok','--warn'];

function buildPresets(){const box=$('#presets');box.innerHTML='';
  PRE.forEach(([a,b])=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=a+' × '+b;
    c.setAttribute('aria-pressed',String(a===A&&b===B));c.onclick=()=>setup(a,b);box.appendChild(c);});}
function euclidSquares(){
  /* quadrats en unitats; rectangle: ample B (x), alt A (y) */
  const out=[];let x=0,y=0,w=B,h=A,step=0;
  while(w>0&&h>0){
    if(w>=h){const q=Math.floor(w/h);for(let i=0;i<q;i++)out.push({x:x+i*h,y,s:h,step});x+=q*h;w-=q*h;}
    else{const q=Math.floor(h/w);for(let i=0;i<q;i++)out.push({x,y:y+i*w,s:w,step});y+=q*w;h-=q*w;}
    step++;
  }
  return out;
}
function setup(a,b){
  A=clamp(Math.round(a)||24,1,100);B=clamp(Math.round(b)||36,1,100);
  $('#ra').value=A;$('#rb').value=B;G=gcd(A,B);
  const mn=Math.min(A,B);$('#d').max=mn;d=Math.min(d,mn);if(d<1)d=1;$('#d').value=d;
  sq=euclidSquares();shown=0;revealed=false;eplaying=false;msgFn=null;$('#msg').innerHTML='';$('#msg').className='msg';$('#guess').value='';
  buildPresets();refresh();
}
$('#apply').onclick=()=>setup(+$('#ra').value,+$('#rb').value);
['ra','rb'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')setup(+$('#ra').value,+$('#rb').value);}));
$('#d').addEventListener('input',()=>{d=+$('#d').value;msgFn=tileMsg;refresh();});
$$('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#mode button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  $('#tilectl').hidden=mode!=='tile';$('#eucctl').hidden=mode!=='euc';msgFn=mode==='tile'?tileMsg:null;if(mode==='euc'){shown=0;eplaying=false;}refresh();});
$('#eplay').onclick=()=>{if(shown>=sq.length)shown=0;eplaying=true;last=performance.now();eacc=0;};
$('#estep').onclick=()=>{eplaying=false;if(shown>=sq.length)shown=0;shown++;if(shown>=sq.length)msgFn=eucDone;refresh();};
$('#check').onclick=()=>{
  const v=Math.round(parseNum($('#guess').value)),mn=Math.min(A,B);
  if(!(v>=1&&v<=mn)){msgFn=()=>{$('#msg').className='msg bad';$('#msg').innerHTML=tt('g_bad',mn);};refresh();return;}
  if(mode!=='tile')$$('#mode button')[0].click();
  d=v;$('#d').value=v;
  msgFn=()=>{const m=$('#msg');
    if(v===G){revealed=true;m.className='msg good';m.innerHTML=tt('g_ok',G,A,B);}
    else if(A%v===0&&B%v===0){m.className='msg bad';m.innerHTML=tt('g_small',v);}
    else{m.className='msg bad';m.innerHTML=tt('g_no',v,A%v!==0?A:B);}};
  refresh();
};
function tileMsg(){
  const m=$('#msg'),rx=B%d,ry=A%d;
  if(!rx&&!ry){if(d===G)revealed=true;m.className='msg good';m.innerHTML=tt('fits',A/d,B/d,A*B/d/d,d)+(d===G?' '+tt('fits_max',A,B,G):'');}
  else{const parts=[];if(rx)parts.push(tt('nofit_w',rx));if(ry)parts.push(tt('nofit_h',ry));
    m.className='msg bad';m.innerHTML=tt('nofit',parts.join(t('and')));}
}
function eucDone(){revealed=true;$('#msg').className='msg good';$('#msg').innerHTML=tt('e_done',A,B,G);}
function divisors(n){const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r;}
function divsHTML(){
  const da=divisors(A),db=divisors(B),com=da.filter(x=>B%x===0);
  const sp=(arr)=>arr.map(x=>'<span class="'+(!revealed?(x===d&&mode==='tile'?'c':''):x===G?'g':com.includes(x)?'c':'')+'">'+x+'</span>').join('');
  $('#divs').innerHTML=tt('divs_a',A)+' '+sp(da)+'<br>'+tt('divs_b',B)+' '+sp(db)+(revealed?'<br><b>'+t('divs_c')+'</b> '+sp(com):'');
}
function stepsHTML(){
  const ol=$('#steps');ol.innerHTML='';
  if(mode!=='euc')return;
  let w=Math.max(A,B),h=Math.min(A,B),k=0,cnt=0;
  const curStep=shown?sq[Math.min(shown,sq.length)-1].step:-1;
  while(h>0){
    const q=Math.floor(w/h),r=w%h;cnt+=q;
    if(cnt-q>=shown)break;
    const li=document.createElement('li');
    li.innerHTML=App.level==='adv'?tt('st_div',w,q,h,r):(r?tt(q===1?'st_q':'st_qp',q,h,h,r):tt(q===1?'st_end1':'st_end',q,h));
    if(k===curStep)li.className='on';
    ol.appendChild(li);w=h;h=r;k++;
  }
}
function refresh(){
  $('#dv').textContent=d+' × '+d;
  if(msgFn)msgFn();else if(mode==='tile'){msgFn=tileMsg;msgFn();}else{$('#msg').innerHTML='';$('#msg').className='msg';}
  divsHTML();stepsHTML();
  draw();
}
function draw(){
  const ink=css('--ink'),mut=css('--muted'),st=css('--stage');
  cx.fillStyle=st;cx.fillRect(0,0,W,H);
  const u=Math.min((W-90)/B,(H-80)/A),ox=(W-u*B)/2+10,oy=(H-u*A)/2+8;
  const X=v=>ox+v*u,Y=v=>oy+v*u;
  /* fons i quadrícula d'unitats */
  cx.fillStyle=css('--panel');cx.fillRect(ox,oy,u*B,u*A);
  if(u>=6){cx.strokeStyle=mut;cx.globalAlpha=.16;cx.lineWidth=1;cx.beginPath();
    for(let i=1;i<B;i++){cx.moveTo(X(i),oy);cx.lineTo(X(i),Y(A));}for(let j=1;j<A;j++){cx.moveTo(ox,Y(j));cx.lineTo(X(B),Y(j));}cx.stroke();cx.globalAlpha=1;}
  if(mode==='tile'){
    const nx=Math.floor(B/d),ny=Math.floor(A/d),ok=B%d===0&&A%d===0,col=ok?css('--ok'):css('--pa');
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      cx.fillStyle=col;cx.globalAlpha=(i+j)%2?.30:.18;cx.fillRect(X(i*d),Y(j*d),u*d,u*d);cx.globalAlpha=1;
      cx.strokeStyle=col;cx.lineWidth=2;cx.strokeRect(X(i*d)+1,Y(j*d)+1,u*d-2,u*d-2);}
    /* sobrants */
    cx.fillStyle=css('--warn');cx.globalAlpha=.35;
    if(B%d)cx.fillRect(X(nx*d),oy,u*(B-nx*d),u*A);
    if(A%d)cx.fillRect(ox,Y(ny*d),u*nx*d,u*(A-ny*d));
    cx.globalAlpha=1;
    if(B%d||A%d){cx.save();cx.beginPath();if(B%d)cx.rect(X(nx*d),oy,u*(B-nx*d),u*A);if(A%d)cx.rect(ox,Y(ny*d),u*nx*d,u*(A-ny*d));cx.clip();
      cx.strokeStyle=css('--warn');cx.lineWidth=1.5;cx.beginPath();for(let k=-H;k<W+H;k+=10){cx.moveTo(k,0);cx.lineTo(k+H,H);}cx.stroke();cx.restore();}
  } else {
    const n=Math.min(shown,sq.length);
    for(let i=0;i<n;i++){const q=sq[i],col=css(COLS[q.step%4]);

    if(n>=sq.length&&G*u>=4){cx.strokeStyle=ink;cx.globalAlpha=.55;cx.lineWidth=1;cx.setLineDash([3,3]);cx.beginPath();

  }
  cx.strokeStyle=ink;cx.lineWidth=2.5;cx.strokeRect(ox,oy,u*B,u*A);
  cx.fillStyle=ink;cx.font='bold 16px system-ui';cx.textAlign='center';cx.textBaseline='alphabetic';
  cx.fillText(String(B),ox+u*B/2,oy-10);
  cx.save();cx.translate(ox-14,oy+u*A/2);cx.rotate(-Math.PI/2);cx.fillText(String(A),0,0);cx.restore();
}
