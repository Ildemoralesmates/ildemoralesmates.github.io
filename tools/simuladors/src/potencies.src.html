/* ===== Potències ===== */
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
const supN=n=>String(n).split('').map(d=>SUP[+d]).join('');
const nfs=(x,d)=>nf(x,d).replace(/\./g,'\u00a0');
const big=n=>(2n**BigInt(n)).toLocaleString(LANG==='es'?'es-ES':'ca-ES').replace(/[. ]/g,' ');
function sci(x,d=1){if(x<1e6)return nfs(x,x<10?2:0);const e=Math.floor(Math.log10(x));let m=x/Math.pow(10,e);
  if(+m.toFixed(d)>=10){m/=10;}return nfs(m,d)+'·10<sup>'+e+'</sup>';}
function len(m){ /* metres -> text */
  if(m<0.01)return tt('r_mm',nfs(m*1000,m<0.001?2:1));
  if(m<1)return tt('r_cm',nfs(m*100,1));
  if(m<1000)return tt('r_m',nfs(m,m<10?2:0));
  if(m<9.461e14)return tt('r_km',m<1e9?nfs(m/1000,m<1e4?2:0):sci(m/1000,1));
  return tt('r_ly',nfs(m/9.461e15,1));}
let tab='wheat';
$$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('#tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  $('#pWheat').hidden=tab!=='wheat';$('#pPaper').hidden=tab!=='paper';});

/* ---- predicció genèrica ---- */
function predBox(host,keys,correct,store){
  const el=$(host);el.innerHTML='';
  keys.forEach((k,i)=>{const c=document.createElement('button');c.type='button';c.className='chip';c.dataset.k=k;c.textContent=t(k);
    c.setAttribute('aria-pressed',String(store.p===i));
    c.onclick=()=>{store.p=i;predBox(host,keys,correct,store);};el.appendChild(c);});
}

/* ---- barra amb càmera ---- */
function Camera(cvId,W,H,vertical,refs,s0){
  const c=fitCanvas($(cvId),W,H);
  const o={c,W,H,vertical,refs,scale:s0,s0,target:s0,auto:false,value:0};
  o.out=()=>{o.auto=false;o.target=o.target*10;};
  o.in=()=>{o.auto=false;o.target=Math.max(o.s0/1000,o.target/10);};
  o.reset=()=>{o.scale=o.target=o.s0;};
  o.step=()=>{
    if(o.auto&&o.value>0){const want=Math.pow(10,Math.ceil(Math.log10(o.value/0.9)));o.target=Math.max(o.s0,want);}
    const k=REDUCE?1:0.12;o.scale=Math.exp(lerp(Math.log(o.scale),Math.log(o.target),k));
  };
  o.draw=()=>{
    const ink=css('--ink'),mut=css('--muted'),pb=css('--pb'),pa=css('--pa');
    c.fillStyle=css('--stage');c.fillRect(0,0,W,H);
    const L=vertical?H-46:W-40, at=v=>v/o.scale*L;  /* longitud en px */
    const x0=vertical?0:20,y0=vertical?H-30:0;
    /* referències */
    c.font='13px system-ui';c.lineWidth=1;
    let lastPos=-99;
    refs.forEach(([m,k])=>{const p=at(m);if(p<6||p>L+2)return;if(Math.abs(p-lastPos)<(vertical?17:70))return;lastPos=p;
      c.strokeStyle=mut;c.setLineDash([4,4]);c.beginPath();
      if(vertical){const y=y0-p;c.moveTo(0,y);c.lineTo(W,y);c.stroke();c.setLineDash([]);c.fillStyle=mut;c.textAlign='right';c.fillText(t(k)+' · '+len(m),W-8,y-4);}
      else{const x=x0+p;c.moveTo(x,10);c.lineTo(x,H-26);c.stroke();c.setLineDash([]);c.fillStyle=mut;c.textAlign='center';c.fillText(t(k),x,H-10);}
    });
    /* barra */
    const p=at(o.value),over=p>L+(vertical?40:36);
    const pp=Math.min(p,L+(vertical?40:36));
    c.fillStyle=pb;
    if(vertical){const bw=70,bx=60;if(pp>0)c.fillRect(bx,y0-pp,bw,Math.max(pp,o.value>0?1.5:0));
      c.fillStyle=ink;c.fillRect(0,y0,W,2);
      if(over){c.fillStyle=css('--warn');c.font='bold 20px system-ui';c.textAlign='left';c.fillText('▲▲▲',bx+8,18);}
    } else {const bh=34,by=(H-bh)/2-8;if(pp>0)c.fillRect(x0,by,Math.max(pp,o.value>0?1.5:0),bh);
      c.fillStyle=ink;c.fillRect(x0-2,by-14,2,bh+28);
      if(over){c.fillStyle=css('--warn');c.font='bold 20px system-ui';c.textAlign='right';c.fillText('▶▶▶',W-4,by-4);}
    }
    c.fillStyle=ink;c.font='bold 13px system-ui';c.textAlign='left';
    c.fillText(tt(vertical?'scale_v':'scale',len(o.scale)),vertical?8:24,vertical?16:18);
  };
  o.screens=()=>o.value/o.scale;
  return o;
}
const W_REFS=[[1,'ref_1m'],[105,'ref_field'],[1000,'ref_1km'],[5.04e5,'ref_mb'],[4.0075e7,'ref_earth'],[3.844e8,'ref_moonD'],[1.496e11,'ref_sun'],[4.5e12,'ref_nep'],[9.461e15,'ref_ly']];
const P_REFS=[[0.0001,'ref_sheet'],[0.008,'ref_phone'],[0.3,'ref_ruler'],[1.7,'ref_person'],[30,'ref_build'],[330,'ref_eiffel'],[8849,'ref_everest'],[11000,'ref_plane'],[4.08e5,'ref_iss'],[3.844e8,'ref_moon']];
const camW=Camera('#wBar',900,150,false,W_REFS,1);
const camP=Camera('#pCv',560,520,true,P_REFS,0.1);
$('#wOut').onclick=()=>{$('#wAuto').checked=false;camW.out();};$('#wIn').onclick=()=>{$('#wAuto').checked=false;camW.in();};
$('#pOut').onclick=()=>{$('#pAuto').checked=false;camP.out();};$('#pIn').onclick=()=>{$('#pAuto').checked=false;camP.in();};
$('#wAuto').onchange=e=>{camW.auto=e.target.checked;};$('#pAuto').onchange=e=>{camP.auto=e.target.checked;};

/* ---- blat ---- */
const BW=440,bx=fitCanvas($('#board'),BW,BW);
const WP={p:null};let wn=0,wPlaying=false,wAcc=0;
const WKEYS=['wp0','wp1','wp2','wp3'];
function wUpd(){
  $('#wPlay').textContent=wPlaying?t('w_pause'):t('w_play');
  $('#wSq').innerHTML=wn?String(wn):'—';
  $('#wThis').innerHTML=wn?(wn<=40?big(wn-1):'≈ '+sci(Math.pow(2,wn-1),2))+'<br><span class="mut">= 2<sup>'+(wn-1)+'</sup></span>':'—';
  $('#wTot').innerHTML=wn?(wn<=40?big(wn).replace(/\d$/,d=>String(+d-1)):'≈ '+sci(Math.pow(2,wn)-1,2))+'<br><span class="mut">= 2<sup>'+wn+'</sup> − 1</span>':'—';
  const g=(Math.pow(2,wn)-1)*0.04;
  $('#wMass').innerHTML=wn?(g<1000?tt('t_g',nfs(g,g<10?2:0)):g<1e6?tt('t_kg',nfs(g/1000,1)):tt('t_t',g<1e12?nfs(g/1e6,g<1e9?1:0):sci(g/1e6,1))):'—';
  camW.value=wn?Math.pow(2,wn-1)*0.005:0;
  const m=$('#wMsg');
  if(wn===64){let h=tt('w_end',sci((Math.pow(2,64)-1)*0.04/1e6,1));
    if(WP.p!==null)h+='<br>'+(WP.p===3?t('w_pred_ok'):tt('w_pred_ko',t(WKEYS[WP.p])));
    m.innerHTML=h;m.className='msg '+(WP.p===null||WP.p===3?'good':'bad');}
  else{m.innerHTML=wn?(camW.screens()>1?tt('screens',sci(camW.screens(),1)):t('fits')):'';m.className='msg';}
  predBox('#wPred',WKEYS,3,WP);
}
$('#wPlay').onclick=()=>{if(wn>=64)wn=0;wPlaying=!wPlaying;wAcc=0;wUpd();};
$('#wStep').onclick=()=>{wPlaying=false;if(wn<64)wn++;wUpd();};
$('#wReset').onclick=()=>{wPlaying=false;wn=0;camW.reset();wUpd();};
function drawBoard(){
  const s=BW/8,ink=css('--ink'),pa=css('--pa'),dark=matchMedia('(prefers-color-scheme: dark)').matches;
  for(let i=0;i<64;i++){const r=Math.floor(i/8),cc=i%8,x=cc*s,y=r*s,n=i+1;
    const light=(r+cc)%2===0;
    bx.fillStyle=light?(dark?'#2a3346':'#efe6d2'):(dark?'#18202f':'#c9b48d');bx.fillRect(x,y,s,s);
    if(n<=wn){
      bx.fillStyle='#d9a521';bx.globalAlpha=clamp(0.15+0.85*(n-1)/63,0.15,1);bx.fillRect(x+2,y+2,s-4,s-4);bx.globalAlpha=1;
      if(n<=6){const k=Math.pow(2,n-1),cols=Math.ceil(Math.sqrt(k)),rr=Math.ceil(k/cols);
        bx.fillStyle='#7a5200';for(let j=0;j<k;j++){const gx=x+s*(j%cols+1)/(cols+1),gy=y+s*(Math.floor(j/cols)+1)/(rr+1);
          bx.beginPath();bx.ellipse(gx,gy,3.2,2,0.6,0,TAU);bx.fill();}}
      else{bx.fillStyle=n>=40?'#fff':'#3b2600';bx.textAlign='center';bx.textBaseline='middle';
        const lab=n<=17?String(Math.pow(2,n-1)):'2'+supN(n-1);
        bx.font='bold '+(lab.length>5?11:15)+'px '+(n<=17?'ui-monospace,Menlo,Consolas,monospace':'system-ui,sans-serif');bx.fillText(lab,x+s/2,y+s/2);}
    }
    if(n===wn){bx.strokeStyle=pa;bx.lineWidth=4;bx.strokeRect(x+2,y+2,s-4,s-4);}
  }
  bx.textBaseline='alphabetic';
}

/* ---- paper ---- */
const PP={p:null};let pn=0,pPlaying=false,pAcc=0;
const PKEYS=['pp0','pp1','pp2','pp3'];
function pUpd(){
  $('#pPlay').textContent=pPlaying?t('p_pause'):t('p_play');
  $('#pN').textContent=String(pn);
  $('#pL').innerHTML=(pn<=40?big(pn):sci(Math.pow(2,pn),2))+' <span class="mut">= 2<sup>'+pn+'</sup></span>';
  const th=0.0001*Math.pow(2,pn);camP.value=th;
  $('#pT').innerHTML=len(th);
  $('#pS').innerHTML=camP.screens()>1?tt('screens',sci(camP.screens(),1)):t('fits');
  const m=$('#pMsg');
  if(pn>=42){let h=t('p_end');if(PP.p!==null)h+='<br>'+(PP.p===0?t('p_pred_ok'):tt('p_pred_ko',t(PKEYS[PP.p])));m.innerHTML=h;m.className='msg '+(PP.p===null||PP.p===0?'good':'bad');}
  else{m.innerHTML='';m.className='msg';}
  predBox('#pPred',PKEYS,0,PP);
}
$('#pPlay').onclick=()=>{if(pn>=42)pn=0;pPlaying=!pPlaying;pAcc=0;pUpd();};
$('#pStep').onclick=()=>{pPlaying=false;if(pn<42)pn++;pUpd();};
$('#pReset').onclick=()=>{pPlaying=false;pn=0;camP.reset();pUpd();};

let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(wPlaying){wAcc+=dt;if(wAcc>0.45||REDUCE){wAcc=0;wn=REDUCE?64:wn+1;if(wn>=64){wn=64;wPlaying=false;}wUpd();}}
  if(pPlaying){pAcc+=dt;if(pAcc>0.6||REDUCE){pAcc=0;pn=REDUCE?42:pn+1;if(pn>=42){pn=42;pPlaying=false;}pUpd();}}
  camW.step();camP.step();
  if(tab==='wheat'){drawBoard();camW.draw();
    if(wn&&wn<64){const m=$('#wMsg'),s=camW.screens()>1?tt('screens',sci(camW.screens(),1)):t('fits');if(m.dataset.s!==s){m.dataset.s=s;m.innerHTML=s;}}}
  else{camP.draw();const s=camP.screens()>1?tt('screens',sci(camP.screens(),1)):t('fits');if($('#pS').dataset.s!==s){$('#pS').dataset.s=s;$('#pS').innerHTML=s;}}
  requestAnimationFrame(loop);
}
App.hooks.push(()=>{wUpd();pUpd();});
/* ===== Raona-ho ===== */
const inW=n=>Number.isInteger(n)&&n>=1&&n<=64, inP=n=>Number.isInteger(n)&&n>=1&&n<=42;
const totBig=n=>(2n**BigInt(n)-1n).toLocaleString(LANG==='es'?'es-ES':'ca-ES').replace(/[. ]/g,'\u00a0');
const massTxt=g=>g<1000?tt('t_g',nfs(g,g<10?2:0)):g<1e6?tt('t_kg',nfs(g/1000,1)):tt('t_t',g<1e12?nfs(g/1e6,g<1e9?1:0):sci(g/1e6,1));
const thick=n=>0.0001*Math.pow(2,n);
const euro=c=>nfs(c/100,2);
function loadW(n){$('#tabs button[data-tab=wheat]').click();wPlaying=false;wn=clamp(n,0,64);$('#wAuto').checked=true;camW.auto=true;wUpd();RZ.show($('#board'));}
function loadP(n){$('#tabs button[data-tab=paper]').click();pPlaying=false;pn=clamp(n,0,42);$('#pAuto').checked=true;camP.auto=true;pUpd();RZ.show($('#pCv'));}
const ckW=f=>([n])=>inW(n)?f(n):{k:'rngW'}, ckP=f=>([n])=>inP(n)?f(n):{k:'rngP'};
RZ.init({
 sim:v=>v[0]==='w'?loadW(v[1]):loadP(v[1]),
 M:[
  {id:'m1',f:[{l:'l_sq'}],sim:([n])=>loadW(n),ok:([n])=>({k:'m1_ok',p:()=>[n,n-1,big(n-1)]}),
   chk:ckW(n=>n<11?{k:'m1_lo',p:()=>[n,big(n-1)]}:n>11?{k:'m1_hi',p:[n]}:null)},
  {id:'m2',f:[{l:'l_fold'}],sim:([n])=>loadP(n),ok:([n])=>({k:'m2_ok',p:()=>[n,len(thick(n))]}),
   chk:ckP(n=>n<15?{k:'m2_lo',p:()=>[n,len(thick(n))]}:n>15?{k:'m2_hi',p:[n]}:null)},
  {id:'m3',f:[{l:'l_fold'}],sim:([n])=>loadP(n),ok:([n])=>({k:'m3_ok',p:()=>[n,len(thick(n))]}),
   chk:ckP(n=>thick(n)<=8849?{k:'m3_lo',p:()=>[n,len(thick(n))]}:thick(n)>=4.08e5?{k:'m3_hi',p:()=>[n,len(thick(n))]}:null)},
  {id:'m4',f:[{l:'l_sq2'}],sim:([n])=>loadW(n),ok:([n])=>({k:'m4_ok',p:()=>[n,totBig(n)]}),
   chk:ckW(n=>(Math.pow(2,n)-1)<=1e6?{k:'m4_lo',p:()=>[n,totBig(n)]}:(Math.pow(2,n)-1)>=1e9?{k:'m4_hi',p:()=>[n,totBig(n)]}:null)}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>loadP(4)},{id:'s2',ans:'S',sim:()=>loadW(6)},{id:'s3',ans:'S',sim:()=>loadW(10)},{id:'s4',ans:'M',sim:()=>loadP(10)},
  {id:'s5',ans:'D',f:[{l:'f_b'},{l:'f_m'},{l:'f_n'}],cxsim:null,cxok:([b,m,n])=>({k:'s5.cx',p:[b,m,n]}),
   cx:([b,m,n])=>(![b,m,n].every(Number.isInteger)||b<1||b>10||m<0||n>10||m>=n)?{k:'s5_bad'}:(Math.pow(b,m)<Math.pow(b,n))?{k:'s_cx_no',p:[b,m,n,Math.pow(b,m),Math.pow(b,n)]}:null},
  {id:'s6',ans:'S',sim:()=>loadP(20)}
 ],
 E:[{id:'e1',who:1,args:['p',42]},{id:'e2',who:0,args:['w',64]},{id:'e3',who:3,args:['w',6]}],
 D:[
  {id:'d1',f:[{l:'d1.l0'}],sim:([n])=>loadW(inW(n)?n:20),
   chk:ckW(n=>n<27?{k:'d1_lo',p:()=>[n,euro(Math.pow(2,n)-1)]}:n>27?{k:'d1_hi',p:()=>[n,euro(Math.pow(2,n)-1)]}:null)},
  {id:'d2',f:[{l:'d2.l0'}],sim:([n])=>loadW(inW(n)?n:20),
   chk:ckW(n=>{const g=(Math.pow(2,n)-1)*0.04;return n<24?{k:'d2_lo',p:()=>[n,massTxt(g)]}:n>24?{k:'d2_hi',p:()=>[n,massTxt(g)]}:null;})},
  {id:'d3',chips:{vals:[20,400,10000,1000000],fmt:x=>nfs(x,0)},sim:()=>loadP(20),ok:()=>({k:'d3_ok'}),
   chk:([p])=>p!==1000000?{k:'d3_no',p:()=>[nfs(p,0)]}:null}
 ]
});
const QDATA=[{"id":"r1","lvl":"all","type":"mc","n":4,"ans":2},{"id":"r2","lvl":"all","type":"mc","n":3,"ans":0},{"id":"r3","lvl":"all","type":"num","num":3.2,"tol":0.001,"u":1},{"id":"r4","lvl":"basic","type":"mc","n":4,"ans":2},{"id":"r5","lvl":"basic","type":"mc","n":4,"ans":1},{"id":"r6","lvl":"adv","type":"mc","n":4,"ans":0},{"id":"r7","lvl":"adv","type":"num","num":14,"tol":0,"u":1}];
initQuiz(QDATA);
initLang();applyLang();
requestAnimationFrame(loop);
