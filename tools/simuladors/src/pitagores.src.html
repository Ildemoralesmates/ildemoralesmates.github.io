/* ===== Pitàgores per àrees ===== */
const svg=$('#svg'),out=$('#out'),go=$('#go');
let a=3,b=4,u=0,raf=0;
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
const sa=slider($('#ctl'),{id:'sa',key:'l_a',min:1,max:12,step:1,val:3,on:v=>{a=v;draw();}});
const sb=slider($('#ctl'),{id:'sb',key:'l_b',min:1,max:12,step:1,val:4,on:v=>{b=v;draw();}});
const su=slider($('#ctl2'),{id:'su',key:'l_re',min:0,max:1000,step:1,val:0,fmtv:v=>Math.round(v/10)+' %',on:v=>{cancelAnimationFrame(raf);u=v/1000;draw();}});
$('#ctl2').prepend(su.el);
[[3,4],[5,12],[6,8],[1,1]].forEach(([x,y])=>{
  const c=Math.sqrt(x*x+y*y),bt=document.createElement('button');
  bt.type='button';bt.className='chip';bt.textContent=x+' · '+y+' · '+(isInt(c)?c:'√'+(x*x+y*y));
  bt.onclick=()=>setAB(x,y);$('#exs').appendChild(bt);
});
function setAB(x,y){a=clamp(Math.round(x),1,12);b=clamp(Math.round(y),1,12);sa.set(a);sb.set(b);draw();}
function draw(){
  const S=a+b,k=300/S,o=20,c2=a*a+b*b;
  const P=(x,y)=>(o+x*k).toFixed(1)+','+(o+y*k).toFixed(1);
  const poly=(pts,dx,dy)=>pts.map(p=>P(p[0]+(dx||0),p[1]+(dy||0))).join(' ');
  const tri=(pts,dx,dy)=>'<polygon points="'+poly(pts,dx,dy)+'" class="tri"/>';
  const txt=(x,y,str,op,size)=>'<text x="'+(o+x*k).toFixed(1)+'" y="'+(o+y*k).toFixed(1)+'" class="lab" text-anchor="middle" dominant-baseline="central" style="opacity:'+op.toFixed(2)+';font-size:'+size+'px">'+str+'</text>';
  let s='';
  s+='<polygon points="'+poly([[0,0],[S,0],[S,S],[0,S]])+'" class="frame"/>';
  s+='<polygon points="'+poly([[0,0],[a,0],[a,a],[0,a]])+'" class="sqa" style="opacity:'+(1-u).toFixed(3)+'"/>';
  s+='<polygon points="'+poly([[a,a],[S,a],[S,S],[a,S]])+'" class="sqb" style="opacity:'+(1-u).toFixed(3)+'"/>';
  s+='<polygon points="'+poly([[a,0],[S,a],[b,S],[0,b]])+'" class="sqc" style="opacity:'+u.toFixed(3)+'"/>';
  s+=tri([[a,0],[S,0],[S,a]],0,0);
  s+=tri([[a,0],[a,a],[S,a]],-a*u,b*u);
  s+=tri([[0,a],[a,a],[0,S]],0,-a*u);
  s+=tri([[a,S],[0,S],[a,a]],b*u,0);
  if(a*k>=26)s+=txt(a/2,a/2,a*k>=78?'a² = '+a*a:String(a*a),1-u,Math.min(18,a*k*0.22+6));
  if(b*k>=26)s+=txt(a+b/2,a+b/2,b*k>=78?'b² = '+b*b:String(b*b),1-u,Math.min(18,b*k*0.22+6));
  s+=txt(S/2,S/2,'c² = '+c2,Math.max(0,(u-0.55)/0.45),20);
  const ex=(px,py,str)=>'<text x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" class="edge" text-anchor="middle" dominant-baseline="central">'+str+'</text>';
  s+=ex(o+a/2*k,11,'a')+ex(o+(a+b/2)*k,11,'b')+ex(9,o+a/2*k,'a')+ex(9,o+(a+b/2)*k,'b');
  svg.innerHTML=s;
  const c=Math.sqrt(c2),int=isInt(c);
  out.innerHTML=
    '<div><span class="ta">a²</span> + <span class="tb">b²</span> = <span class="tc">c²</span></div>'+
    '<div><span class="ta">'+a*a+'</span> + <span class="tb">'+b*b+'</span> = <span class="tc">'+c2+'</span></div>'+
    '<div class="big">c = √'+c2+' '+(int?'= '+c:'≈ '+nf(c,3))+'</div>'+
    '<p class="note">'+(int?tt('note_int',a,b,c):tt('note_irr',c2))+'</p>';
  go.textContent=t(u>=0.999?'btn_back':'btn_go');
}
function play(){
  cancelAnimationFrame(raf);
  const from=u,to=u>=0.999?0:1;
  if(REDUCE){u=to;su.set(Math.round(u*1000));draw();return;}
  const dur=2800*Math.max(0.25,Math.abs(to-from)),t0=performance.now();
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e=p*p*(3-2*p);
    u=from+(to-from)*e;su.set(Math.round(u*1000));draw();
    if(p<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
go.onclick=play;
App.hooks.push(draw);
/* ===== Raona-ho ===== */
const inR=x=>Number.isInteger(x)&&x>=1&&x<=12;
const ck=f=>([x,y])=>(inR(x)&&inR(y))?f(x,y):{k:'rng'};
const hyp=(x,y)=>Math.sqrt(x*x+y*y);
const load=(x,y)=>{cancelAnimationFrame(raf);u=1;su.set(1000);setAB(x,y);RZ.show($('#svg'));};
RZ.init({
 F:{a:{l:'l_a'},b:{l:'l_b'}},
 sim:([x,y])=>load(x,y),
 M:[
  {id:'m1',f:['a','b'],ok:([x,y])=>({k:'m1_ok',p:[x,y,hyp(x,y),x*x+y*y]}),
   chk:ck((x,y)=>!isInt(hyp(x,y))?{k:'m1_c',p:()=>[x*x+y*y,nf(hyp(x,y),2)]}:x*x+y*y<=100?{k:'m1_s',p:[hyp(x,y),x*x+y*y]}:null)},
  {id:'m2',f:['a','b'],ok:([x,y])=>({k:'m2_ok',p:[x,y,x*x+y*y]}),
   chk:ck((x,y)=>x*x+y*y!==50?{k:'m2_f',p:[x,y,x*x+y*y]}:x===y?{k:'m2_eq',p:[x]}:null)},
  {id:'m3',f:['a','b'],ok:([x,y])=>({k:'m3_ok',p:()=>[nf(hyp(x,y),3),Math.max(x,y),nf(hyp(x,y)-Math.max(x,y),3)]}),
   chk:ck((x,y)=>hyp(x,y)-Math.max(x,y)>=0.1?{k:'m3_f',p:()=>[nf(hyp(x,y),3),Math.max(x,y),nf(hyp(x,y)-Math.max(x,y),3)]}:null)},
  {id:'m4',f:['a','b'],ok:([x,y])=>({k:'m4_ok',p:[x,y,x*x+y*y]}),
   chk:ck((x,y)=>x*x+y*y!==85?{k:'m4_f',p:[x,y,x*x+y*y]}:null)}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load(1,12)},
  {id:'s2',ans:'M',sim:()=>load(3,4)},
  {id:'s3',ans:'D',f:['a','b'],cx:ck((x,y)=>isInt(hyp(x,y))?{k:'s_cx_no',p:()=>[x,y,nf(hyp(x,y),2)]}:null)},
  {id:'s4',ans:'M',sim:()=>load(3,4)},
  {id:'s5',ans:'S',sim:()=>load(5,5)},
  {id:'s6',ans:'D',f:['a','b'],cx:ck((x,y)=>(isInt(hyp(x,y))&&Math.round(hyp(x,y))%2===1)?null:{k:'s6_no',p:()=>[x,y,nf(hyp(x,y),2)]})}
 ],
 E:[{id:'e1',who:1,args:[6,8]},{id:'e2',who:0,args:[5,12]},{id:'e3',who:3,args:[5,12]}],
 D:[
  {id:'d1',f:[{l:'d1.l0',u:'m'}],sim:()=>load(5,12),ok:()=>({k:'d1_ok'}),
   chk:([h])=>h===12?null:h===18?{k:'d1_sum'}:Math.abs(h-Math.sqrt(194))<0.1?{k:'d1_plus'}:h>13?{k:'d1_big'}:{k:'d1_no',p:()=>[nf(h,2),nf(h*h+25,2)]}},
  {id:'d2',f:[{l:'d2.l0',u:'m'},{l:'d2.l1',u:'m'}],sim:()=>load(3,4),ok:()=>({k:'d2_ok'}),
   chk:([d,s])=>d!==50?(d===70?{k:'d2_sum'}:{k:'d2_d',p:()=>[nf(d,2),nf(d*d,0)]}):s!==20?{k:'d2_s'}:null},
  {id:'d3',chips:{vals:[2.4,2.5,2.6,2.7],u:'d3.cu'},sim:()=>load(12,5),ok:()=>({k:'d3_ok'}),
   chk:([p])=>p===2.6?null:p>2.6?{k:'d3_big',p:()=>[nf(p,1)]}:{k:'d3_small',p:()=>[nf(p,1)]}}
 ]
});
initQuiz([]);
setAB(3,4);
initLang();applyLang();
</script>
