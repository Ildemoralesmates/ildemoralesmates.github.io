<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tir parabòlic — simulador interactiu</title>
<meta name="description" content="Simulador de tir parabòlic: canvia la velocitat, l’angle i la gravetat (Terra, Lluna, Mart, Júpiter) i compara trajectòries. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d’altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
:root{--vres:#7c3aed;--ground:#6b9c5a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--vres:#a78bfa;--ground:#355c2c}}
.stage svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:14px;height:3px;display:inline-block;border-radius:2px}
.ctls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;padding:2px 4px}
@media (max-width:620px){.ctls{grid-template-columns:1fr}}
.ctls .span{grid-column:1/-1}
.ctl select{grid-column:1/-1;width:100%}
.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:6px 18px}
.cmp{grid-column:1/-1;display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;border-top:1px dashed var(--line);padding-top:8px}
.cmp.show{display:grid}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp output{color:var(--pb)}
.btns{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vals{margin:0}
.vals dd.b{color:var(--pb)}
.vals dt.b{color:var(--pb)}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="stage"><svg id="svg" viewBox="0 0 600 300" role="img" data-i18n-aria="aria.svg" aria-label=""></svg></div>
<div class="legend">
<span><span class="swatch" style="background:var(--pa)"></span><span data-i18n="lg_a"></span></span>
<span><span class="swatch" style="background:var(--ok)"></span><span data-i18n="lg_vx"></span></span>
<span><span class="swatch" style="background:var(--warn)"></span><span data-i18n="lg_vy"></span></span>
<span><span class="swatch" style="background:var(--vres)"></span><span data-i18n="lg_v"></span></span>
</div>
<div class="ctls">
<div class="ctl"><label for="v0a" data-i18n="l_v0"></label><output id="v0aL"></output><input type="range" id="v0a" min="5" max="40" step="1" value="20"></div>
<div class="ctl"><label for="anglea" data-i18n="l_th"></label><output id="angleaL"></output><input type="range" id="anglea" min="1" max="89" step="1" value="45"></div>
<div class="ctl"><label for="h0" data-i18n="l_h0"></label><output id="h0L"></output><input type="range" id="h0" min="0" max="30" step="1" value="0"></div>
<div class="chips span" id="anglePresets"></div>
<div class="ctl"><label for="gSel" data-i18n="l_g"></label><select id="gSel">
<option value="9.8" selected data-i18n="g_earth"></option><option value="1.62" data-i18n="g_moon"></option><option value="3.71" data-i18n="g_mars"></option><option value="24.79" data-i18n="g_jup"></option></select></div>
<div class="ctl"><label for="speedSel" data-i18n="l_speed"></label><select id="speedSel">
<option value="0.4" data-i18n="sp_slow"></option><option value="1" selected data-i18n="sp_norm"></option><option value="2.5" data-i18n="sp_fast"></option></select></div>
<div class="checks">
<label class="check"><input type="checkbox" id="showVectors" checked><span data-i18n="c_vec"></span></label>
<label class="check"><input type="checkbox" id="compareToggle"><span data-i18n="c_cmp"></span></label>
</div>
<div class="cmp" id="compareBlock">
<div class="ctl"><label for="v0b" data-i18n="l_v0b"></label><output id="v0bL"></output><input type="range" id="v0b" min="5" max="40" step="1" value="30"></div>
<div class="ctl"><label for="angleb" data-i18n="l_thb"></label><output id="anglebL"></output><input type="range" id="angleb" min="1" max="89" step="1" value="30"></div>
</div>
<div class="btns"><button class="btn primary" id="btnLaunch" type="button" data-i18n="launch"></button><button class="btn" id="btnReset" type="button" data-i18n="reset"></button></div>
</div>
</div>
<div class="side">
<p class="sh" data-i18n="s_live"></p>
<dl class="vals" id="readout"></dl>
<p class="sh" data-i18n="s_res"></p>
<dl class="vals" id="results"></dl>
<p class="note" data-i18n="note"></p>
</div>
</div>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>
