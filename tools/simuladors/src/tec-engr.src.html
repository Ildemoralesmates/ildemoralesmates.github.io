const W=640,H=400;
const S={mode:'g2',th:0,play:true,cross:false,dash:0};
const CT=$('#ctls'),SL={};
SL.z1=slider(CT,{id:'z1',key:'z1',min:8,max:40,step:1,val:12,on:upd});
SL.z2=slider(CT,{id:'z2',key:'z2',min:8,max:40,step:1,val:24,on:upd});
SL.z3=slider(CT,{id:'z3',key:'z3',min:8,max:40,step:1,val:10,on:upd});
SL.z4=slider(CT,{id:'z4',key:'z4',min:8,max:40,step:1,val:30,on:upd});
SL.d1=slider(CT,{id:'d1',key:'d1',min:20,max:200,step:5,val:60,on:upd});
SL.d2=slider(CT,{id:'d2',key:'d2',min:20,max:200,step:5,val:120,on:upd});
SL.rpm=slider(CT,{id:'rpm',key:'rpm',min:10,max:240,step:10,val:120,on:upd});
SL.par=slider(CT,{id:'par',key:'par',min:1,max:50,step:1,val:5,on:upd});
SL.slope=slider(CT,{id:'slope',key:'b_slope',min:-10,max:12,step:1,val:0,fmtv:v=>(v>0?'+':'')+v+' %',on:upd});
SL.cad=slider(CT,{id:'cad',key:'b_cad',min:40,max:120,step:5,val:80,on:upd});
const SHOW={bici:['slope','cad'],g2:['z1','z2','rpm','par'],g4:['z1','z2','z3','z4','rpm','par'],pol:['d1','d2','rpm','par']};

function params(){
  const g=k=>SL[k].get();
  if(S.mode==='g2')return {i:g('z1')/g('z2'),dir:-1};
  if(S.mode==='g4')return {i:g('z1')*g('z3')/(g('z2')*g('z4')),dir:1};
  return {i:g('d1')/g('d2'),dir:S.cross?-1:1};
}
function f2(x){return fmt(+x.toPrecision(3),x<10?2:x<100?1:0).replace(/,?0+$/,'').replace(/,$/,'');}
function upd(){
  SHOW_all();if(bikeUI()){updBici();return;}
  const P=params(),n1=SL.rpm.get(),M1=SL.par.get();
  SHOW_all();
  const n2=n1*P.i,M2=M1/P.i,pw=M1*n1*TAU/60;
  $('#vI').textContent=f2(P.i);
  $('#vT').textContent=Math.abs(P.i-1)<1e-9?t('t_one'):P.i<1?t('t_red'):t('t_mul');
  $('#vN').textContent=f2(n2)+' rpm';
  $('#vM').textContent=f2(M2)+' N·m';
  $('#vD').textContent=P.dir>0?t('d_same'):t('d_opp');
  $('#vP').textContent=f2(pw)+' W';
  const g=k=>SL[k].get();let fm;
  if(S.mode==='g2')fm=tt('fm_g2',g('z1'),g('z2'),f2(P.i));
  else if(S.mode==='g4')fm=tt('fm_g4',g('z1'),g('z3'),g('z2'),g('z4'),f2(P.i));
  else fm=tt('fm_pol',g('d1'),g('d2'),f2(P.i));
  $('#formula').innerHTML=fm+'<br>'+tt('fm_n',n1,f2(P.i),f2(n2))+'<br>'+tt('fm_m',M1,f2(P.i),f2(M2));
}
function SHOW_all(){Object.keys(SL).forEach(k=>SL[k].el.hidden=!SHOW[S.mode].includes(k));$('#crosswrap').hidden=S.mode!=='pol';}
function setMode(m){S.mode=m;$('#msg').textContent='';$('#guess').value='';upd();}
function buildSeg(){buildBike();TEC.seg($('#modesw'),[{v:'g2',key:'m_g2'},{v:'g4',key:'m_g4'},{v:'pol',key:'m_pol'},{v:'bici',key:'m_bici'}],S.mode,setMode);}
$('#cross').addEventListener('change',e=>{S.cross=e.target.checked;upd();});
$('#play').addEventListener('click',()=>{S.play=!S.play;setPlay();});
function setPlay(){$('#play').textContent=t(S.play?'pause':'play');}
$('#checkg').addEventListener('click',()=>{
  const v=parseNum($('#guess').value),m=$('#msg');
  if(!isFinite(v)||$('#guess').value.trim()===''){m.className='msg bad';m.textContent=t('g_bad');return;}
  const P=params(),r=SL.rpm.get()*P.i;
  if(Math.abs(v-r)<=Math.abs(r)*.02+1e-9){m.className='msg good';m.textContent=tt('g_ok',f2(r));}
  else{m.className='msg bad';m.textContent=tt('g_no',f2(v),f2(r),f2(P.i));}
});

/* ---- dibuix ---- */
const cvo=TEC.cv('#cv',W,H,draw);
function fitLayout(pts){/* pts: [{x,y,r}] en unitats; torna escala i desplaçament */
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p.x-p.r);x1=Math.max(x1,p.x+p.r);y0=Math.min(y0,p.y-p.r);y1=Math.max(y1,p.y+p.r);});
  const sc=Math.min((W-50)/(x1-x0),(H-80)/(y1-y0));
  return {sc,ox:(W-(x1-x0)*sc)/2-x0*sc,oy:(H-(y1-y0)*sc)/2+10-y0*sc};
}
function arrowRot(c,x,y,dir,col){/* ↻ (sentit horari) o ↺ */
  c.font='bold 22px system-ui';c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';c.fillText(dir>0?'↻':'↺',x,y);
}
function draw(o){
  const c=o.ctx,k=C(),P=params(),th=S.th;
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  const g=q=>SL[q].get();
  if(S.mode==='bici'){dBici(c,k,th);return;}
  if(S.mode==='g2'){
    const z1=g('z1'),z2=g('z2'),L=fitLayout([{x:0,y:0,r:z1/2+1},{x:(z1+z2)/2,y:0,r:z2/2+1}]);
    const m=L.sc,x1=L.ox,x2=L.ox+m*(z1+z2)/2,y=L.oy;
    const a2=Math.PI-th*z1/z2;
    TEC.gear(c,x1,y,z1,m,th,k.pa,th);
    TEC.gear(c,x2,y,z2,m,a2+Math.PI/z2,k.pb,a2);
    lab(c,'A · '+z1,x1,y+m*z1/2+m*2.4,k.pa);lab(c,'B · '+z2,x2,y+m*z2/2+m*2.4,k.pb);
    arrowRot(c,x1,y-m*z1/2-m*2.6,1,k.pa);arrowRot(c,x2,y-m*z2/2-m*2.6,-1,k.pb);
  }else if(S.mode==='g4'){
    const z1=g('z1'),z2=g('z2'),z3=g('z3'),z4=g('z4'),phi=0.75,D=(z3+z4)/2;
    const X2=(z1+z2)/2,X4=X2+D*Math.cos(phi),Y4=D*Math.sin(phi);
    const L=fitLayout([{x:0,y:0,r:z1/2+1},{x:X2,y:0,r:z2/2+1},{x:X4,y:Y4,r:z4/2+1}]);
    const m=L.sc,x1=L.ox,x2=L.ox+m*X2,y=L.oy,x4=L.ox+m*X4,y4=L.oy+m*Y4;
    const a2=Math.PI-th*z1/z2;                /* eix de B i C */
    const A2=a2+Math.PI/z2;
    const u=(phi-A2)/(TAU/z3);                 /* dent de C que toca amb D */
    const a4=phi+Math.PI-(TAU/z4)*(-u+.5);
    const th4=a4;                             /* D engranada amb C */
    TEC.gear(c,x1,y,z1,m,th,k.pa,th);
    TEC.gear(c,x2,y,z2,m,A2,k.pb,a2);
    TEC.gear(c,x2,y,z3,m,A2,k.pa,a2,.3);
    TEC.gear(c,x4,y4,z4,m,th4,k.pb,th4);
    TEC.line(c,[[x2-6,y-6],[x2+6,y+6]],k.ink,1);
    lab(c,'A · '+z1,x1,y+m*z1/2+m*2.4,k.pa);lab(c,'B+C · '+z2+'/'+z3,x2,y-m*z2/2-m*1.8,k.ink);lab(c,'D · '+z4,x4,y4+m*z4/2+m*2.4,k.pb);
  }else{
    const d1=g('d1'),d2=g('d2'),Ld=190;
    const r1=d1/2,r2=d2/2,L=fitLayout([{x:0,y:0,r:r1+4},{x:Ld,y:0,r:r2+4}]);
    const m=L.sc,c1=[L.ox,L.oy],c2=[L.ox+Ld*m,L.oy],R1=r1*m,R2=r2*m,Lp=Ld*m;
    const cr=S.cross,nx=cr?(R1+R2)/Lp:(R1-R2)/Lp,ny=Math.sqrt(Math.max(0,1-nx*nx));
    const col=k.muted;c.setLineDash([]);
    c.lineWidth=5;c.strokeStyle=col;c.lineCap='round';c.setLineDash([14,6]);c.lineDashOffset=-S.dash*(S.mode==='pol'?1:0);
    const pt=(cc,r,s,sy)=>[cc[0]+r*s*nx,cc[1]+r*s*sy*ny];
    const ang=(cc,p)=>Math.atan2(p[1]-cc[1],p[0]-cc[0]);
    if(!cr){
      const T1u=pt(c1,R1,1,-1),T2u=pt(c2,R2,1,-1),T1l=pt(c1,R1,1,1),T2l=pt(c2,R2,1,1);
      c.beginPath();c.moveTo(T1u[0],T1u[1]);c.lineTo(T2u[0],T2u[1]);c.arc(c2[0],c2[1],R2,ang(c2,T2u),ang(c2,T2l),false);c.lineTo(T1l[0],T1l[1]);c.arc(c1[0],c1[1],R1,ang(c1,T1l),ang(c1,T1u)+TAU,false);c.stroke();
    }else{
      const T1a=pt(c1,R1,1,-1),T2a=pt(c2,R2,-1,-1),T1b=pt(c1,R1,1,1),T2b=pt(c2,R2,-1,1);
      /* T2a és el punt inferior de B perquè -(-ny)=+ny */
      c.beginPath();c.moveTo(T1a[0],T1a[1]);c.lineTo(T2a[0],T2a[1]);c.arc(c2[0],c2[1],R2,ang(c2,T2a),ang(c2,T2b),true);c.lineTo(T1b[0],T1b[1]);c.arc(c1[0],c1[1],R1,ang(c1,T1b),ang(c1,T1a)+TAU,false);c.stroke();
    }
    c.setLineDash([]);
    const a1=th,a2=th*(r1/r2)*(cr?-1:1);
    pulley(c,c1,R1,a1,k.pa);pulley(c,c2,R2,a2,k.pb);
    lab(c,'A · Ø'+d1,c1[0],c1[1]+R1+22,k.pa);lab(c,'B · Ø'+d2,c2[0],c2[1]+R2+22,k.pb);
    arrowRot(c,c1[0],c1[1]-R1-20,1,k.pa);arrowRot(c,c2[0],c2[1]-R2-20,cr?-1:1,k.pb);
  }
  const n2=SL.rpm.get()*P.i;
  lab(c,'n₁ = '+SL.rpm.get()+' rpm',90,22,k.pa);lab(c,'n₂ = '+f2(n2)+' rpm',W-100,22,k.pb);
}
function lab(c,s,x,y,col){TEC.txt(c,s,x,y,{font:'bold 14px system-ui',col});}
function pulley(c,cc,R,ang,col){
  c.beginPath();c.arc(cc[0],cc[1],R,0,TAU);c.fillStyle=C().panel;c.fill();c.globalAlpha=.2;c.fillStyle=col;c.fill();c.globalAlpha=1;c.strokeStyle=col;c.lineWidth=2.5;c.stroke();
  for(let j=0;j<3;j++){const a=ang+j*TAU/3;TEC.line(c,[[cc[0],cc[1]],[cc[0]+R*.82*Math.cos(a),cc[1]+R*.82*Math.sin(a)]],col,3);}
  c.beginPath();c.arc(cc[0],cc[1],Math.max(4,R*.12),0,TAU);c.fillStyle=col;c.fill();
  const mx=cc[0]+R*.82*Math.cos(ang),my=cc[1]+R*.82*Math.sin(ang);c.beginPath();c.arc(mx,my,Math.max(5,R*.09),0,TAU);c.fillStyle=col;c.fill();c.lineWidth=2;c.strokeStyle=C().panel;c.stroke();
}

/* ---- Mode bicicleta ---- */
const PL=[28,38,48],PN=[11,13,15,18,21,24,28,32];
const BK={D:0.67,CR:0.1725,M:80,G:9.81,CRR:0.006,CDA:0.4,RHO:1.2,PSUS:150,CADOPT:85};
S.pl=1;S.pn=3;
function resF(v,sl){const th=Math.atan(sl/100);return BK.M*BK.G*(Math.sin(th)+BK.CRR*Math.cos(th))+0.5*BK.RHO*BK.CDA*v*v;}
function bikeUI(){const b=S.mode==='bici';$('#bike').hidden=!b;$('#predictbox').hidden=b;$('#outh').hidden=b;$('#kvmain').hidden=b;$('#formula').hidden=b;$('#msg').hidden=b;return b;}
function mkseg(host,vals,cur,on){host.innerHTML='';vals.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.textContent=v;b.setAttribute('aria-pressed',String(i===cur));b.onclick=()=>on(i);host.appendChild(b);});}
function buildBike(){
  mkseg($('#platsw'),PL,S.pl,i=>{S.pl=i;upd();});
  mkseg($('#pinsw'),PN,S.pn,i=>{S.pn=i;upd();});
  const sl=SL.slope.get(),cur=sl===0?'f':sl===8?'u':sl===-6?'d':'';
  TEC.seg($('#scensw'),[{v:'f',key:'sc_flat'},{v:'u',key:'sc_up'},{v:'d',key:'sc_down'}],cur,v=>{SL.slope.set(v==='f'?0:v==='u'?8:-6);if(v==='u'){S.pl=0;S.pn=7;SL.cad.set(70);}else if(v==='d'){S.pl=2;S.pn=1;SL.cad.set(80);}else{S.pl=1;S.pn=3;SL.cad.set(80);}buildBike();upd();});
}
function recommend(sl){
  const Pt=BK.PSUS;let lo=0.3,hi=14,vs;
  if(resF(hi,sl)*hi<=Pt&&resF(hi,sl)<=0)return {down:true,pl:2,pn:0};
  if(resF(hi,sl)*hi<=Pt)vs=hi;else{for(let k=0;k<50;k++){const m=(lo+hi)/2;if(resF(m,sl)*m>Pt)hi=m;else lo=m;}vs=lo;}
  let best=null;
  PL.forEach((z1,a)=>PN.forEach((z2,b)=>{const i=z1/z2,cad=vs*60/(i*Math.PI*BK.D),d=Math.abs(cad-BK.CADOPT);if(!best||d<best.d)best={pl:a,pn:b,d,cad,v:vs};}));
  return best;
}
function updBici(){
  const z1=PL[S.pl],z2=PN[S.pn],i=z1/z2,cad=SL.cad.get(),sl=SL.slope.get();
  const dev=i*Math.PI*BK.D,v=cad*dev/60,F=resF(v,sl),P=Math.max(0,F*v),Fp=F>0?F*i*BK.D/2/BK.CR:0;
  const rec=recommend(sl);
  const f1=x=>fmt(x,1),f0=x=>fmt(x,0);
  let st;
  if(F<=0)st='st_free';else if(P<=180)st='st_ok';else if(P<=260)st='st_hard';else st='st_too';
  let cm='';if(cad<60)cm='cd_low';else if(cad>105)cm='cd_high';
  $('#bkv').innerHTML=[['bk_i',f2(i),'hl'],['bk_dev',f1(dev)+' m',''],['bk_v',f1(v*3.6)+' km/h','hb'],['bk_Fp',f0(Fp)+' N',''],['bk_P',f0(P)+' W','hb']].map(r=>'<dt>'+t(r[0])+'</dt><dd class="'+r[2]+'">'+r[1]+'</dd>').join('');
  const recTxt=rec.down?t('bk_rec_down'):tt('bk_rec',PL[rec.pl],PN[rec.pn],f2(PL[rec.pl]/PN[rec.pn]),f0(rec.cad));
  const m=$('#bmsg');m.className='msg '+(st==='st_too'||cm?'bad':st==='st_ok'||st==='st_free'?'good':'');
  m.innerHTML=t(st+'_m')+(cm?' '+t(cm):'')+'<br>'+recTxt;
  $('#bform').innerHTML=tt('bf1',z1,z2,f2(i))+'<br>'+tt('bf2',f2(i),f1(dev))+'<br>'+tt('bf3',cad,f1(dev),f1(v*3.6));
  const sl2=SL.slope.get(),cur=sl2===0?'f':sl2===8?'u':sl2===-6?'d':'';$$('#scensw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===cur)));
  $$('#platsw button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===S.pl)));$$('#pinsw button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===S.pn)));
}
function dBici(c,k,th){
  const z1=PL[S.pl],z2=PN[S.pn],i=z1/z2,mm=2.5,c1=[130,128],c2=[480,128];
  const cad=SL.cad.get(),sl=SL.slope.get(),v=cad*i*Math.PI*BK.D/60;
  /* plats (davant) */
  PL.forEach((z,a)=>{if(a!==S.pl){c.beginPath();c.arc(c1[0],c1[1],z*mm/2,0,TAU);c.strokeStyle=k.muted;c.globalAlpha=.35;c.lineWidth=1.5;c.setLineDash([4,4]);c.stroke();c.setLineDash([]);c.globalAlpha=1;}});
  PN.forEach((z,b)=>{if(b!==S.pn){c.beginPath();c.arc(c2[0],c2[1],z*mm/2,0,TAU);c.strokeStyle=k.muted;c.globalAlpha=.35;c.lineWidth=1.5;c.setLineDash([3,3]);c.stroke();c.setLineDash([]);c.globalAlpha=1;}});
  const R1=z1*mm/2,R2=z2*mm/2,Ld=c2[0]-c1[0];
  /* cadena: tangents exteriors */
  const nx=(R1-R2)/Ld,ny=Math.sqrt(1-nx*nx);
  const T1u=[c1[0]+R1*nx,c1[1]-R1*ny],T2u=[c2[0]+R2*nx,c2[1]-R2*ny],T1l=[c1[0]+R1*nx,c1[1]+R1*ny],T2l=[c2[0]+R2*nx,c2[1]+R2*ny];
  c.save();c.lineWidth=5;c.strokeStyle=k.muted;c.setLineDash([9,5]);c.lineDashOffset=-S.dash;c.lineCap='round';
  c.beginPath();c.moveTo(T1u[0],T1u[1]);c.lineTo(T2u[0],T2u[1]);c.stroke();
  c.lineDashOffset=S.dash;c.beginPath();c.moveTo(T1l[0],T1l[1]);c.lineTo(T2l[0],T2l[1]);c.stroke();c.restore();
  TEC.gear(c,c1[0],c1[1],z1,mm,th,k.pa,th);
  TEC.gear(c,c2[0],c2[1],z2,mm,i*th,k.pb,i*th);
  /* biela i pedal */
  const ex=c1[0]+Math.cos(th)*R1*.92,ey=c1[1]+Math.sin(th)*R1*.92;
  TEC.line(c,[c1,[ex,ey]],k.ink,5);c.fillStyle=k.ink;c.fillRect(ex-9,ey-3,18,6);
  TEC.txt(c,t('b_plato')+' · '+z1,c1[0],c1[1]+78,{font:'bold 14px system-ui',col:k.pa});
  TEC.txt(c,t('b_pinyo')+' · '+z2,c2[0],c2[1]+60,{font:'bold 14px system-ui',col:k.pb});
  TEC.txt(c,'i = '+z1+' / '+z2+' = '+f2(i),W/2,26,{font:'bold 16px system-ui'});
  TEC.txt(c,f2(i)+' '+t('b_turns'),W/2,50,{font:'13px system-ui',col:k.muted});
  /* escena: pendent */
  const ang=Math.atan(sl/100)*2.2,gx=W/2,gy=352;
  c.save();c.translate(gx,gy);c.rotate(-ang);
  c.beginPath();c.moveTo(-520,0);c.lineTo(520,0);c.strokeStyle=k.ink;c.lineWidth=3;c.stroke();
  c.setLineDash([14,18]);c.lineDashOffset=S.gd||0;c.beginPath();c.moveTo(-520,10);c.lineTo(520,10);c.strokeStyle=k.muted;c.lineWidth=2;c.stroke();c.setLineDash([]);
  const wr=22,wa=i*th*0.35;
  [[-45,-wr],[45,-wr]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,wr,0,TAU);c.strokeStyle=k.ink;c.lineWidth=3;c.stroke();for(let j=0;j<4;j++){const a=wa+j*Math.PI/2;TEC.line(c,[[x,y],[x+wr*Math.cos(a),y+wr*Math.sin(a)]],k.muted,1.5);}});
  const A=[-45,-wr],B=[45,-wr],BB=[-8,-wr],SE=[-24,-66],HD=[34,-64];
  TEC.line(c,[A,BB,SE,A],k.pa,3);TEC.line(c,[SE,HD,BB],k.pa,3);TEC.line(c,[HD,B],k.pa,3);
  TEC.line(c,[SE,[0,-90],[8,-96]],k.ink,5);c.beginPath();c.arc(14,-106,7,0,TAU);c.fillStyle=k.ink;c.fill();
  TEC.line(c,[[0,-90],[34,-72]],k.ink,3);
  c.restore();
  TEC.txt(c,(sl>0?'+':'')+sl+' %',gx+150,gy-60-sl*2,{font:'bold 15px system-ui',col:sl>0?k.warn:sl<0?k.ok:k.muted});
  TEC.txt(c,fmt(v*3.6,1)+' km/h · '+cad+' rpm',gx-170,gy-70,{font:'bold 14px system-ui',col:k.ink,al:'left'});
}
TEC.loop(dt=>{
  if(S.play){const w=(S.mode==='bici'?SL.cad.get():SL.rpm.get())/60*TAU*0.22;S.th+=REDUCE?0:w*dt;S.dash+=REDUCE?0:w*dt*18;S.gd=(S.gd||0)+(REDUCE?0:(S.mode==='bici'?-SL.cad.get()*(PL[S.pl]/PN[S.pn])*dt*1.2:0));}
  draw(cvo);
});

   chk:([z])=>z===40?null:{k:'m3_f',p:[z,fmt(100/(40*z),4)]}},
  {id:'m4',f:[{l:'l_m',u:'m'}],sim:()=>ldb(0,1,5,80),ok:()=>({k:'m4_ok'}),
   chk:([v])=>Math.abs(v-4.2)<=.15?null:{k:'m4_f'}}
 ],
 S:[

  {id:'s3',ans:'S',sim:()=>ld('g2',{z1:12,z2:36,rpm:120})}
 ],
 E:[{id:'e1',who:1,sim:()=>ld('g2',{z1:12,z2:36,rpm:120})}]
});
