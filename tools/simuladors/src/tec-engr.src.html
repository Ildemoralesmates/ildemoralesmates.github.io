const W=640,H=400;
const S={mode:'g2',th:0,play:true,cross:false,dash:0};
const CT=$('#ctls'),SL={};
SL.z1=slider(CT,{id:'z1',key:'z1',min:8,max:40,step:1,val:12,on:upd});
SL.z2=slider(CT,{id:'z2',key:'z2',min:8,max:40,step:1,val:24,on:upd});
SL.z3=slider(CT,{id:'z3',key:'z3',min:8,max:40,step:1,val:10,on:upd});
SL.z4=slider(CT,{id:'z4',key:'z4',min:8,max:40,step:1,val:30,on:upd});
SL.d1=slider(CT,{id:'d1',key:'d1',min:20,max:200,step:5,val:60,on:upd});
SL.d2=slider(CT,{id:'d2',key:'d2',min:20,max:200,step:5,val:120,on:upd});
SL.rpm=slider(CT,{id:'rpm',key:'rpm',min:10,max:240,step:10,val:120,on:upd});
SL.par=slider(CT,{id:'par',key:'par',min:1,max:50,step:1,val:5,on:upd});
const SHOW={g2:['z1','z2','rpm','par'],g4:['z1','z2','z3','z4','rpm','par'],pol:['d1','d2','rpm','par']};

function params(){
  const g=k=>SL[k].get();
  if(S.mode==='g2')return {i:g('z1')/g('z2'),dir:-1};
  if(S.mode==='g4')return {i:g('z1')*g('z3')/(g('z2')*g('z4')),dir:1};
  return {i:g('d1')/g('d2'),dir:S.cross?-1:1};
}
function f2(x){return fmt(+x.toPrecision(3),x<10?2:x<100?1:0).replace(/,?0+$/,'').replace(/,$/,'');}
function upd(){
  const P=params(),n1=SL.rpm.get(),M1=SL.par.get();
  SHOW_all();
  const n2=n1*P.i,M2=M1/P.i,pw=M1*n1*TAU/60;
  $('#vI').textContent=f2(P.i);
  $('#vT').textContent=Math.abs(P.i-1)<1e-9?t('t_one'):P.i<1?t('t_red'):t('t_mul');
  $('#vN').textContent=f2(n2)+' rpm';
  $('#vM').textContent=f2(M2)+' N·m';
  $('#vD').textContent=P.dir>0?t('d_same'):t('d_opp');
  $('#vP').textContent=f2(pw)+' W';
  const g=k=>SL[k].get();let fm;
  if(S.mode==='g2')fm=tt('fm_g2',g('z1'),g('z2'),f2(P.i));
  else if(S.mode==='g4')fm=tt('fm_g4',g('z1'),g('z3'),g('z2'),g('z4'),f2(P.i));
  else fm=tt('fm_pol',g('d1'),g('d2'),f2(P.i));
  $('#formula').innerHTML=fm+'<br>'+tt('fm_n',n1,f2(P.i),f2(n2))+'<br>'+tt('fm_m',M1,f2(P.i),f2(M2));
}
function SHOW_all(){Object.keys(SL).forEach(k=>SL[k].el.hidden=!SHOW[S.mode].includes(k));$('#crosswrap').hidden=S.mode!=='pol';}
function setMode(m){S.mode=m;$('#msg').textContent='';$('#guess').value='';upd();}
function buildSeg(){TEC.seg($('#modesw'),[{v:'g2',key:'m_g2'},{v:'g4',key:'m_g4'},{v:'pol',key:'m_pol'}],S.mode,setMode);}
$('#cross').addEventListener('change',e=>{S.cross=e.target.checked;upd();});
$('#play').addEventListener('click',()=>{S.play=!S.play;setPlay();});
function setPlay(){$('#play').textContent=t(S.play?'pause':'play');}
$('#checkg').addEventListener('click',()=>{
  const v=parseNum($('#guess').value),m=$('#msg');
  if(!isFinite(v)||$('#guess').value.trim()===''){m.className='msg bad';m.textContent=t('g_bad');return;}
  const P=params(),r=SL.rpm.get()*P.i;
  if(Math.abs(v-r)<=Math.abs(r)*.02+1e-9){m.className='msg good';m.textContent=tt('g_ok',f2(r));}
  else{m.className='msg bad';m.textContent=tt('g_no',f2(v),f2(r),f2(P.i));}
});

/* ---- dibuix ---- */
const cvo=TEC.cv('#cv',W,H,draw);
function fitLayout(pts){/* pts: [{x,y,r}] en unitats; torna escala i desplaçament */
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p.x-p.r);x1=Math.max(x1,p.x+p.r);y0=Math.min(y0,p.y-p.r);y1=Math.max(y1,p.y+p.r);});
  const sc=Math.min((W-50)/(x1-x0),(H-80)/(y1-y0));
  return {sc,ox:(W-(x1-x0)*sc)/2-x0*sc,oy:(H-(y1-y0)*sc)/2+10-y0*sc};
}
function arrowRot(c,x,y,dir,col){/* ↻ (sentit horari) o ↺ */
  c.font='bold 22px system-ui';c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';c.fillText(dir>0?'↻':'↺',x,y);
}
function draw(o){
  const c=o.ctx,k=C(),P=params(),th=S.th;
  c.fillStyle=k.stage;c.fillRect(0,0,W,H);
  const g=q=>SL[q].get();
  if(S.mode==='g2'){
    const z1=g('z1'),z2=g('z2'),L=fitLayout([{x:0,y:0,r:z1/2+1},{x:(z1+z2)/2,y:0,r:z2/2+1}]);
    const m=L.sc,x1=L.ox,x2=L.ox+m*(z1+z2)/2,y=L.oy;
    const a2=Math.PI-th*z1/z2;
    TEC.gear(c,x1,y,z1,m,th,k.pa,th);
    TEC.gear(c,x2,y,z2,m,a2+Math.PI/z2,k.pb,a2);
    lab(c,'A · '+z1,x1,y+m*z1/2+m*2.4,k.pa);lab(c,'B · '+z2,x2,y+m*z2/2+m*2.4,k.pb);
    arrowRot(c,x1,y-m*z1/2-m*2.6,1,k.pa);arrowRot(c,x2,y-m*z2/2-m*2.6,-1,k.pb);
  }else if(S.mode==='g4'){
    const z1=g('z1'),z2=g('z2'),z3=g('z3'),z4=g('z4'),phi=0.75,D=(z3+z4)/2;
    const X2=(z1+z2)/2,X4=X2+D*Math.cos(phi),Y4=D*Math.sin(phi);
    const L=fitLayout([{x:0,y:0,r:z1/2+1},{x:X2,y:0,r:z2/2+1},{x:X4,y:Y4,r:z4/2+1}]);
    const m=L.sc,x1=L.ox,x2=L.ox+m*X2,y=L.oy,x4=L.ox+m*X4,y4=L.oy+m*Y4;
    const a2=Math.PI-th*z1/z2;                /* eix de B i C */
    const A2=a2+Math.PI/z2;
    const u=(phi-A2)/(TAU/z3);                 /* dent de C que toca amb D */
    const a4=phi+Math.PI-(TAU/z4)*(-u+.5);
    const th4=a4;                             /* D engranada amb C */
    TEC.gear(c,x1,y,z1,m,th,k.pa,th);
    TEC.gear(c,x2,y,z2,m,A2,k.pb,a2);
    TEC.gear(c,x2,y,z3,m,A2,k.pa,a2,.3);
    TEC.gear(c,x4,y4,z4,m,th4,k.pb,th4);
    TEC.line(c,[[x2-6,y-6],[x2+6,y+6]],k.ink,1);
    lab(c,'A · '+z1,x1,y+m*z1/2+m*2.4,k.pa);lab(c,'B+C · '+z2+'/'+z3,x2,y-m*z2/2-m*1.8,k.ink);lab(c,'D · '+z4,x4,y4+m*z4/2+m*2.4,k.pb);
  }else{
    const d1=g('d1'),d2=g('d2'),Ld=190;
    const r1=d1/2,r2=d2/2,L=fitLayout([{x:0,y:0,r:r1+4},{x:Ld,y:0,r:r2+4}]);
    const m=L.sc,c1=[L.ox,L.oy],c2=[L.ox+Ld*m,L.oy],R1=r1*m,R2=r2*m,Lp=Ld*m;
    const cr=S.cross,nx=cr?(R1+R2)/Lp:(R1-R2)/Lp,ny=Math.sqrt(Math.max(0,1-nx*nx));
    const col=k.muted;c.setLineDash([]);
    c.lineWidth=5;c.strokeStyle=col;c.lineCap='round';c.setLineDash([14,6]);c.lineDashOffset=-S.dash*(S.mode==='pol'?1:0);
    const pt=(cc,r,s,sy)=>[cc[0]+r*s*nx,cc[1]+r*s*sy*ny];
    const ang=(cc,p)=>Math.atan2(p[1]-cc[1],p[0]-cc[0]);
    if(!cr){
      const T1u=pt(c1,R1,1,-1),T2u=pt(c2,R2,1,-1),T1l=pt(c1,R1,1,1),T2l=pt(c2,R2,1,1);
      c.beginPath();c.moveTo(T1u[0],T1u[1]);c.lineTo(T2u[0],T2u[1]);c.arc(c2[0],c2[1],R2,ang(c2,T2u),ang(c2,T2l),false);c.lineTo(T1l[0],T1l[1]);c.arc(c1[0],c1[1],R1,ang(c1,T1l),ang(c1,T1u)+TAU,false);c.stroke();
    }else{
      const T1a=pt(c1,R1,1,-1),T2a=pt(c2,R2,-1,-1),T1b=pt(c1,R1,1,1),T2b=pt(c2,R2,-1,1);
      /* T2a és el punt inferior de B perquè -(-ny)=+ny */
      c.beginPath();c.moveTo(T1a[0],T1a[1]);c.lineTo(T2a[0],T2a[1]);c.arc(c2[0],c2[1],R2,ang(c2,T2a),ang(c2,T2b),true);c.lineTo(T1b[0],T1b[1]);c.arc(c1[0],c1[1],R1,ang(c1,T1b),ang(c1,T1a)+TAU,false);c.stroke();
    }
    c.setLineDash([]);
    const a1=th,a2=th*(r1/r2)*(cr?-1:1);
    pulley(c,c1,R1,a1,k.pa);pulley(c,c2,R2,a2,k.pb);
    lab(c,'A · Ø'+d1,c1[0],c1[1]+R1+22,k.pa);lab(c,'B · Ø'+d2,c2[0],c2[1]+R2+22,k.pb);
    arrowRot(c,c1[0],c1[1]-R1-20,1,k.pa);arrowRot(c,c2[0],c2[1]-R2-20,cr?-1:1,k.pb);
  }
  const n2=SL.rpm.get()*P.i;
  lab(c,'n₁ = '+SL.rpm.get()+' rpm',90,22,k.pa);lab(c,'n₂ = '+f2(n2)+' rpm',W-100,22,k.pb);
}
function lab(c,s,x,y,col){TEC.txt(c,s,x,y,{font:'bold 14px system-ui',col});}
function pulley(c,cc,R,ang,col){
  c.beginPath();c.arc(cc[0],cc[1],R,0,TAU);c.fillStyle=C().panel;c.fill();c.globalAlpha=.2;c.fillStyle=col;c.fill();c.globalAlpha=1;c.strokeStyle=col;c.lineWidth=2.5;c.stroke();
  for(let j=0;j<3;j++){const a=ang+j*TAU/3;TEC.line(c,[[cc[0],cc[1]],[cc[0]+R*.82*Math.cos(a),cc[1]+R*.82*Math.sin(a)]],col,3);}
  c.beginPath();c.arc(cc[0],cc[1],Math.max(4,R*.12),0,TAU);c.fillStyle=col;c.fill();
  const mx=cc[0]+R*.82*Math.cos(ang),my=cc[1]+R*.82*Math.sin(ang);c.beginPath();c.arc(mx,my,Math.max(5,R*.09),0,TAU);c.fillStyle=col;c.fill();c.lineWidth=2;c.strokeStyle=C().panel;c.stroke();
}
TEC.loop(dt=>{
  if(S.play){const w=SL.rpm.get()/60*TAU*0.22;S.th+=REDUCE?0:w*dt;S.dash+=REDUCE?0:w*dt*18;}
  draw(cvo);
});

/* ---- Raona-ho ---- */
const ld=(m,o)=>{S.mode=m;S.cross=!!o.cross;$('#cross').checked=S.cross;
  Object.keys(o).forEach(k=>{if(SL[k])SL[k].set(o[k]);});$('#msg').textContent='';$('#guess').value='';buildSeg();upd();};
const cl=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));
RZ.init({
 sim:()=>{},
 M:[
  {id:'m1',f:[{l:'l_z'}],sim:([z])=>ld('g2',{z1:12,z2:cl(z,8,40),rpm:120}),ok:()=>({k:'m1_ok'}),
   chk:([z])=>z===36?null:{k:'m1_f',p:[z,fmt(120*12/z,1)]}},
  {id:'m2',f:[{l:'l_d',u:'mm'}],sim:([d])=>ld('pol',{d1:60,d2:cl(d/5,4,40)*5,rpm:120}),ok:()=>({k:'m2_ok'}),
   chk:([d])=>d===20?null:{k:'m2_f',p:[d,fmt(120*60/d,1)]}},
  {id:'m3',f:[{l:'l_z'}],sim:([z])=>ld('g4',{z1:10,z2:40,z3:10,z4:cl(z,8,40),rpm:240}),ok:()=>({k:'m3_ok'}),
   chk:([z])=>z===40?null:{k:'m3_f',p:[z,fmt(100/(40*z),4)]}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>ld('g2',{z1:12,z2:24,rpm:120})},
  {id:'s2',ans:'M',sim:()=>ld('g2',{z1:16,z2:16,rpm:60})},
  {id:'s3',ans:'S',sim:()=>ld('g2',{z1:12,z2:36,rpm:120})}
 ],
 E:[{id:'e1',who:1,sim:()=>ld('g2',{z1:12,z2:36,rpm:120})}]
});

const QDATA=[{"id":"q1","lvl":"all","type":"num","num":30,"tol":0,"u":1},{"id":"q2","lvl":"all","type":"mc","n":4,"ans":1},{"id":"q3","lvl":"all","type":"mc","n":4,"ans":0},{"id":"q4","lvl":"basic","type":"mc","n":4,"ans":1},{"id":"q6","lvl":"basic","type":"num","num":100,"tol":0,"u":1},{"id":"q5","lvl":"adv","type":"num","num":100,"tol":0,"u":1}];
App.hooks.push(()=>{upd();setPlay();buildSeg();});
initQuiz(QDATA);
initLang();applyLang();
</script>
