<title>Puzle del mapa d'Espanya</title>
<meta name="description" content="Puzle interactiu del mapa d'Espanya: arrossega les comunitats autònomes o les 50 províncies (més Ceuta i Melilla) fins al seu lloc, amb peces o amb noms, pistes i cronòmetre. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d'altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
:root{--sea:#d6e6f2;--ctx:#e6e3dc;--ctxl:#c9c4b8;--slot:#f6f4ef;--slotl:#9aa3b3;--dock:#ffffffd9;--coast:#5d6b82}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--sea:#0c1a2b;--ctx:#161c28;--ctxl:#2b3446;--slot:#2a3550;--slotl:#5f6b84;--dock:#121929e6;--coast:#8a95ac}}
#map{display:block;width:100%;height:auto;max-height:min(74vh,600px);margin-inline:auto;border-radius:8px;user-select:none;-webkit-user-select:none}
#map .sea{fill:var(--sea)}
#map .ctx{fill:var(--ctx);stroke:var(--ctxl);stroke-width:1}
#map .ins{fill:var(--sea);stroke:var(--coast);stroke-width:1.2}
#map .slot{fill:var(--slot);cursor:pointer;transition:fill .2s}
#map .slot.other{fill:var(--ctx);cursor:default}
#map .slot.sel:hover{fill:var(--chip)}
#map .bd{fill:none;stroke:var(--slotl);stroke-width:1;stroke-linejoin:round;pointer-events:none}
#map .coast{fill:none;stroke:var(--coast);stroke-width:1.4;stroke-linejoin:round;pointer-events:none}
#map .placed{stroke:var(--panel);stroke-width:.8;stroke-linejoin:round;pointer-events:none}
#map .pl-in{animation:pop .45s ease-out}
@keyframes pop{0%{opacity:.2}100%{opacity:1}}
#map .lbl{font:600 20px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
#map .lbl.p{font-size:15.5px}
#map .dock{fill:var(--dock);stroke:var(--line);stroke-width:1.2}
#map .dockt{font:700 17px var(--f-body);fill:var(--muted);letter-spacing:.08em}
#map .piece{cursor:grab;touch-action:none}
#map .piece:focus{outline:none}
#map .piece:focus-visible .pc,#map .piece.on .pc{stroke:var(--pa);stroke-width:3}
#map .piece:focus-visible .chipr,#map .piece.on .chipr{stroke:var(--pa);stroke-width:3}
#map .pc{stroke:var(--ink);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#map .pn{font:600 16px var(--f-body);fill:var(--ink);text-anchor:middle;pointer-events:none}
#map .chipr{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
#map .chipt{font:600 20px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
#map .pin{fill:var(--pb);stroke:var(--panel);stroke-width:2}
#map .halo{fill:none;stroke:var(--pb);stroke-width:1.6;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#map .dragging{cursor:grabbing;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#map .flash{animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{from{fill:var(--slot)}to{fill:var(--pb)}}
#map .hl{fill:var(--pb);fill-opacity:.35;stroke:var(--pb);stroke-width:2.5;stroke-linejoin:round;pointer-events:none}
#map .hl.b{fill:var(--pa);stroke:var(--pa)}
@media (prefers-reduced-motion: reduce){#map .flash{animation:none;fill:var(--pb)}#map .pl-in{animation:none}}
.side .stats{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin:0;font-size:14px}
.side .stats dd{font-weight:700}
.side .msg{margin:0;font-size:14.5px;min-height:1.4em}
.side .msg.good{color:var(--ok);font-weight:600}
.side .msg.bad{color:var(--warn);font-weight:600}
.side .lbl2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.side select{width:100%}
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.fin{border-left:4px solid var(--ok);background:var(--chip);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink);margin:0}
</style>
<!--@GC@-->
</head>

/* ===== Puzle del mapa d'Espanya ===== */
const NS='http://www.w3.org/2000/svg', svg=$('#map');
const [,,VW,VH]=GEO.vb, DK=GEO.dock, IN=GEO.ins;
svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
const HUE={GA:205,AS:150,CB:95,PV:350,NC:28,RI:300,AR:48,CT:8,CL:262,MD:330,CM:72,VC:180,EX:120,AN:105,MC:20,IB:225,CN:40,CE:280,ML:280};
const COMMS=Object.keys(GEO.comm);
const el=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;};
const G={};['sea','ctx','ins','slots','bd','placed','lbl','hl','dock','drag'].forEach(n=>{G[n]=el('g',{id:'g-'+n},svg);});
el('rect',{x:0,y:0,width:VW,height:VH,class:'sea'},G.sea);
el('path',{d:GEO.ctx,class:'ctx'},G.ctx);
el('rect',{x:IN[0],y:IN[1],width:IN[2],height:IN[3],rx:6,class:'ins'},G.ins);
el('rect',{x:DK[0],y:DK[1],width:DK[2],height:DK[3],rx:10,class:'dock'},G.dock);
const dockT=el('text',{x:DK[0]+12,y:DK[1]+22,class:'dockt'},G.dock);
const dockN=el('text',{x:DK[0]+DK[2]-12,y:DK[1]+22,class:'dockt','text-anchor':'end'},G.dock);
const gItems=el('g',{},G.dock);

let LV='comm',MODE='shape',FILT='all',SHOWB=true,SHOWN=true;
let ids=[],queue=[],placed=new Set(),tried=new Set(),errors=0,t0=null,tEnd=null,sel=null,lastMsg=null,drag=null;
const geo=id=>LV==='comm'?GEO.comm[id]:GEO.prov[id];
const commOf=id=>LV==='comm'?id:GEO.prov[id].c;
const nm=id=>t((LV==='comm'?'c.':'p.')+id);
const lblName=id=>LV==='comm'&&I18N[LANG]['cs.'+id]?t('cs.'+id):nm(id);
function color(id){
  const c=commOf(id),h=HUE[c],dk=C().dark;
  if(LV==='comm') return 'hsl('+h+' '+(dk?42:55)+'% '+(dk?38:72)+'%)';
  const ps=GEO.comm[c].p,i=ps.indexOf(id),n=ps.length,dl=n>1?(i/(n-1)-.5)*16:0;
  return 'hsl('+h+' '+(dk?42:55)+'% '+((dk?38:72)+dl)+'%)';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

/* ---------- mapa: forats per omplir ---------- */
function drawSlots(){
  G.slots.innerHTML='';G.bd.innerHTML='';
  if(LV==='comm') COMMS.forEach(c=>el('path',{d:GEO.comm[c].d,class:'slot sel','data-id':c},G.slots));
  else Object.keys(GEO.prov).forEach(p=>el('path',{d:GEO.prov[p].d,class:'slot '+(ids.includes(p)?'sel':'other'),'data-id':ids.includes(p)?p:''},G.slots));
  if(SHOWB) el('path',{d:LV==='comm'?GEO.bComm:GEO.bProv,class:'bd'},G.bd);
  else if(LV==='prov'&&FILT!=='all') el('path',{d:GEO.comm[FILT].d,class:'bd'},G.bd);
  el('path',{d:GEO.land,class:'coast'},G.bd);
  el('path',{d:GEO.bNat,class:'coast'},G.bd);
}
function drawPlaced(anim){
  G.placed.innerHTML='';G.lbl.innerHTML='';
  placed.forEach(id=>{
    const g=geo(id);
    el('path',{d:g.d,class:'placed'+(anim===id?' pl-in':''),fill:color(id)},G.placed);
    if(SHOWN){const tx=el('text',{x:g.lp[0],y:g.lp[1],class:'lbl'+(LV==='prov'?' p':'')},G.lbl);tx.textContent=lblName(id);
      if(id==='CE'||id==='ML'){tx.setAttribute('y',g.lp[1]-(id==='CE'?14:-14));}}
  });
}
/* ---------- safata ---------- */
const NSLOT=6;
function cells(){
  const top=DK[1]+32,cols=2,rows=MODE==='shape'?2:4;
  const cw=(DK[2]-16)/cols,ch=(DK[3]-top+DK[1]-8)/rows,out=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out.push([DK[0]+8+cw*(c+.5),top+ch*(r+.5),cw,ch]);
  return out;
}
function dockFit(id,cell){
  const [x,y,w,h]=geo(id).bb,[cx,cy,cw,ch]=cell,ext=SHOWN?24:6;
  const s=Math.min((cw-12)/w,(ch-ext-8)/h,3.2);
  return {s,tx:cx-(x+w/2)*s,ty:cy-ext/2-(y+h/2)*s+2,cx,cy,ch};
}
function setTf(g,tx,ty,s){g.setAttribute('transform','translate('+tx.toFixed(1)+' '+ty.toFixed(1)+') scale('+s.toFixed(3)+')');}
function drawDock(){
  gItems.innerHTML='';G.drag.innerHTML='';
  dockT.textContent=t(MODE==='shape'?'tray':'tray_n');
  dockN.textContent=queue.length?tt('left',queue.length):'';
  const cs=cells();
  queue.slice(0,cs.length).forEach((id,i)=>{
    const g=el('g',{class:'piece'+(sel===id?' on':''),tabindex:0,role:'button','data-id':id,'aria-label':nm(id)},gItems);
    g._cell=cs[i];
    if(MODE==='shape'){
      const f=dockFit(id,cs[i]),inner=el('g',{},g);
      el('path',{d:geo(id).d,class:'pc',fill:color(id)},inner);
      const [,,w,h]=geo(id).bb;
      if(Math.max(w,h)<26){const [x,y]=geo(id).bb;el('circle',{cx:x+w/2,cy:y+h/2,r:Math.max(w,h)/2+7,class:'halo'},inner);}
      setTf(inner,f.tx,f.ty,f.s);g._inner=inner;g._f=f;
      if(SHOWN){const tx=el('text',{x:f.cx,y:f.cy+f.ch/2-9,class:'pn'},g);tx.textContent=nm(id);}
      el('rect',{x:f.cx-cs[i][2]/2+4,y:f.cy-f.ch/2+2,width:cs[i][2]-8,height:f.ch-4,fill:'transparent'},g).style.pointerEvents='all';
    }else{
      const [cx,cy,cw]=cs[i],txt=nm(id),fs=txt.length>17?15:txt.length>12?17.5:20;
      const inner=el('g',{},g);
      const wv=Math.min(cw-10,txt.length*fs*.56+24);
      el('rect',{x:-wv/2,y:-19,width:wv,height:38,rx:19,class:'chipr'},inner);
      const tx=el('text',{x:0,y:0,class:'chipt'},inner);tx.textContent=txt;tx.style.fontSize=fs+'px';
      el('circle',{cx:0,cy:26,r:5.5,class:'pin'},inner);
      setTf(inner,cx,cy-6,1);g._inner=inner;g._home=[cx,cy-6];
    }
    g.addEventListener('pointerdown',ev=>startDrag(ev,g,id));
    g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose(id);}});
  });
}
function updStats(){
  const n=ids.length,p=placed.size,first=[...placed].filter(i=>!tried.has(i)).length;
  $('#stP').textContent=p+' / '+n;$('#stF').textContent=first;$('#stE').textContent=errors;
  $('#progb').style.width=(n?100*p/n:0)+'%';
  $('#stT').textContent=fmtT(t0?((tEnd||Date.now())-t0):0);
}
setInterval(()=>{if(t0&&!tEnd)updStats();},1000);
function say(k,args,cls){lastMsg={k,args,cls};renderMsg();}
function renderMsg(){
  const m=$('#msg');if(!lastMsg){m.textContent='';m.className='msg';return;}
  const a=(lastMsg.args||[]).map(x=>typeof x==='function'?x():x);
  m.innerHTML=tt(lastMsg.k,...a);m.className='msg'+(lastMsg.cls?' '+lastMsg.cls:'');
}
/* ---------- joc ---------- */
function newGame(){
  ids=LV==='comm'?COMMS.slice():Object.keys(GEO.prov).filter(p=>FILT==='all'||GEO.prov[p].c===FILT);
  queue=shuffle(ids.slice());placed=new Set();tried=new Set();errors=0;t0=null;tEnd=null;sel=null;lastMsg=null;
  clearHl();drawSlots();drawPlaced();drawDock();updStats();renderMsg();
}
function begin(){if(!t0)t0=Date.now();}
function place(id,auto){
  placed.add(id);queue=queue.filter(q=>q!==id);if(sel===id)sel=null;
  if(auto)tried.add(id);
  drawPlaced(id);drawDock();
  const name=()=>nm(id);
  if(auto)say('auto',[name]);else say(tried.has(id)?'ok':'ok_first',[name],'good');
  if(!queue.length){tEnd=Date.now();const first=[...placed].filter(i=>!tried.has(i)).length;
    say('done',[ids.length,fmtT(tEnd-(t0||tEnd)),first,errors],'good');}
  updStats();
}
function miss(id,on){
  errors++;tried.add(id);
  if(on&&on!==id) say('ko_on',[()=>nm(id),()=>nm(on)],'bad'); else say('ko_near',[()=>nm(id)],'bad');
  updStats();
}
function slotAt(cx,cy){
  const hide=G.drag.style.pointerEvents;G.drag.style.pointerEvents='none';
  const e=document.elementFromPoint(cx,cy);G.drag.style.pointerEvents=hide;
  return e&&e.classList&&e.classList.contains('sel')&&e.dataset.id?e.dataset.id:null;
}
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:cx,y:cy};}
function toScreen(x,y){const p=svg.createSVGPoint();p.x=x;p.y=y;const m=svg.getScreenCTM();return m?p.matrixTransform(m):{x,y};}
const inDock=p=>p.x>=DK[0]&&p.x<=DK[0]+DK[2]&&p.y>=DK[1]&&p.y<=DK[1]+DK[3];
function nearSmall(id,p){const [x,y,w,h]=geo(id).bb;return Math.max(w,h)<26&&Math.hypot(p.x-(x+w/2),p.y-(y+h/2))<22;}

function startDrag(ev,g,id){
  if(ev.button>0)return;ev.preventDefault();clearHl();begin();
  const p=toSvg(ev.clientX,ev.clientY);
  drag={g,id,x0:ev.clientX,y0:ev.clientY,moved:false,pid:ev.pointerId,p};
}
/* els esdeveniments es lligen a window: en moure la peça a la capa superior el navegador perdria la captura */
window.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.pid){e.preventDefault();moveDrag(e);}},{passive:false});
window.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pid)endDrag(e);});
window.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid){drag=null;drawDock();}});
function moveDrag(e){
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<5)return;
    drag.moved=true;G.drag.appendChild(drag.g);drag.g.classList.add('dragging');
    const pn=drag.g.querySelector('.pn');if(pn)pn.remove();}
  const p=toSvg(e.clientX,e.clientY);drag.p=p;
  if(MODE==='shape'){const [x,y,w,h]=geo(drag.id).bb;setTf(drag.g._inner,p.x-(x+w/2),p.y-(y+h/2),1);}
  else setTf(drag.g._inner,p.x,p.y-26,1);
}
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){choose(d.id);return;}
  const p=toSvg(e.clientX,e.clientY);
  if(inDock(p)){drawDock();return;}
  if(MODE==='shape'){
    const [x,y,w,h]=geo(d.id).bb,off=Math.hypot(p.x-(x+w/2),p.y-(y+h/2)),tol=clamp(.16*Math.max(w,h),13,34);
    if(off<=tol){place(d.id);return;}
    const sc=toScreen(p.x,p.y),on=slotAt(sc.x,sc.y);
    if(on===null){say('ko_sea',[],'bad');drawDock();return;}
    miss(d.id,on);drawDock();
  }else{
    const on=slotAt(e.clientX,e.clientY);
    if(on===d.id||nearSmall(d.id,p)){place(d.id);return;}
    if(on===null){say('ko_sea',[],'bad');drawDock();return;}
    miss(d.id,on);drawDock();
  }
}
function choose(id){sel=sel===id?null:id;drawDock();if(sel)say('pick',[()=>nm(sel)]);}
svg.addEventListener('click',e=>{
  const s=e.target.closest&&e.target.closest('.slot.sel');clearHl();
  if(!s||!sel||placed.has(s.dataset.id))return;begin();
  const id=sel;if(s.dataset.id===id)place(id);else{miss(id,s.dataset.id);}
});
function current(){return sel||queue[0];}
$('#bHint').onclick=()=>{
  const id=current();if(!id)return;begin();clearHl();
  const s=G.slots.querySelector('[data-id="'+id+'"]');if(!s)return;
  s.classList.remove('flash');void s.getBBox();s.classList.add('flash');tried.add(id);
  setTimeout(()=>s.classList.remove('flash'),2200);
  say('hint',[()=>nm(id)]);updStats();
};
$('#bNext').onclick=()=>{const id=current();if(!id)return;begin();clearHl();place(id,true);};
$('#bNew').onclick=newGame;
/* ---------- controls ---------- */
function seg(sel_,cur,on){$$(sel_+' button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.v===cur));b.onclick=()=>{on(b.dataset.v);$$(sel_+' button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};});}
seg('#lvsw',LV,v=>{LV=v;$('#filtbox').hidden=v!=='prov';newGame();});
seg('#mdsw',MODE,v=>{MODE=v;sel=null;drawDock();});
$('#cbB').onchange=e=>{SHOWB=e.target.checked;drawSlots();};
$('#cbN').onchange=e=>{SHOWN=e.target.checked;drawPlaced();drawDock();};
function fillFilt(){
  const s=$('#filt'),v=FILT;
  s.innerHTML='<option value="all">'+t('f_all')+'</option>'+COMMS.filter(c=>GEO.comm[c].p.length>1).sort((a,b)=>t('c.'+a).localeCompare(t('c.'+b),LANG)).map(c=>'<option value="'+c+'">'+t('c.'+c)+' ('+GEO.comm[c].p.length+')</option>').join('');
  s.value=v;
}
$('#filt').onchange=e=>{FILT=e.target.value;newGame();};
/* ---------- marques per a «Raona-ho» ---------- */
function clearHl(){G.hl.innerHTML='';}
function hl(spec){
  clearHl();
  (spec.c||[]).forEach(c=>el('path',{d:GEO.comm[c].d,class:'hl'},G.hl));
  (spec.p||[]).forEach(p=>el('path',{d:GEO.prov[p].d,class:'hl'},G.hl));
  (spec.b||[]).forEach(c=>el('path',{d:(GEO.comm[c]||GEO.prov[c]).d,class:'hl b'},G.hl));
  const lab=(spec.c||[]).map(c=>[GEO.comm[c],'c.'+c]).concat((spec.p||[]).map(p=>[GEO.prov[p],'p.'+p]),(spec.b||[]).map(c=>[GEO.comm[c]||GEO.prov[c],(GEO.comm[c]?'c.':'p.')+c]));
  lab.forEach(([g,k])=>{const tx=el('text',{x:g.lp[0],y:g.lp[1],class:'lbl'},G.hl);tx.textContent=t(k);});
  say('hl_note',[]);RZ.show(svg);
}
document.addEventListener('langchange',()=>{fillFilt();drawPlaced();drawDock();renderMsg();updStats();});
document.addEventListener('themechange',()=>{drawPlaced();drawDock();});
/* ===== Raona-ho ===== */
const NB=(()=>{const P=GEO.prov,o={};for(const p in GEO.adj)GEO.adj[p].forEach(q=>{const a=P[p].c,b=P[q].c;if(a!==b)(o[a]=o[a]||new Set()).add(b);});return o;})();
const isN=(v,n)=>Math.abs(v-n)<1e-9;
const bad=v=>({k:'m_no',p:()=>[nf(v,2)]});
RZ.init({
 F:{n:{l:'l_n'},np:{l:'l_np'},nc:{l:'l_nc'}},
 sim:null,
 M:[
  {id:'m1',f:['n'],ok:()=>({k:'m1_ok'}),sim:()=>hl({p:GEO.comm.CL.p}),
   chk:([v])=>isN(v,9)?null:isN(v,8)?{k:'m1_8'}:bad(v)},
  {id:'m2',f:['n'],ok:()=>({k:'m2_ok'}),sim:()=>hl({c:COMMS.filter(c=>GEO.comm[c].p.length===1&&c!=='CE'&&c!=='ML')}),
   chk:([v])=>isN(v,7)?null:isN(v,9)?{k:'m2_9'}:v<7&&v>=4?{k:'m2_lo'}:bad(v)},
  {id:'m3',f:['n'],ok:()=>({k:'m3_ok'}),sim:()=>hl({b:['CL'],c:[...NB.CL]}),
   chk:([v])=>isN(v,9)?null:isN(v,10)?{k:'m3_10'}:bad(v)},
  {id:'m4',f:['n'],ok:()=>({k:'m4_ok'}),sim:()=>hl({b:['V'],p:GEO.adj.V}),
   chk:([v])=>isN(v,5)?null:isN(v,6)?{k:'m4_6'}:bad(v)}
 ],
 S:[
  {id:'s1',ans:'D',f:['np'],sim:()=>hl({c:['MD','MC','AS']}),cx:([v])=>isN(v,1)?null:{k:'s1_cx'}},
  {id:'s2',ans:'D',f:['nc'],sim:()=>hl({c:['IB','CN']}),cx:([v])=>isN(v,0)?null:{k:'s2_cx'}},
  {id:'s3',ans:'S',sim:()=>hl({b:['M'],p:GEO.adj.M})},
  {id:'s4',ans:'M',sim:()=>hl({b:['BU','Z'],p:[...new Set(GEO.adj.BU.concat(GEO.adj.Z))]})}
 ],
 E:[{id:'e1',who:1,sim:()=>hl({c:['CE','ML']})},{id:'e2',who:0,sim:()=>hl({c:['CE','ML']})},{id:'e3',who:1,sim:()=>hl({c:['CN']})}],
 D:[
  {id:'d1',f:['n'],ok:()=>({k:'d1_ok'}),sim:()=>hl({b:['V','M'],p:['CU']}),
   chk:([v])=>isN(v,1)?null:isN(v,0)?{k:'d1_0'}:v>=2?{k:'d1_2'}:bad(v)},
  {id:'d2',f:['n'],ok:()=>({k:'d2_ok'}),sim:()=>hl({b:['PV','AN'],c:['CL','EX']}),
   chk:([v])=>isN(v,2)?null:isN(v,1)?{k:'d2_1'}:v>=3?{k:'d2_3'}:bad(v)},
  {id:'d3',chips:{vals:[5,7,8,9]},ok:()=>({k:'d3_ok'}),sim:()=>hl({p:GEO.comm.AN.p}),
   chk:([p])=>isN(p,8)?null:{k:'d3_no'}}
 ]
});
initQuiz([]);
fillFilt();newGame();
initLang();applyLang();
</script>
