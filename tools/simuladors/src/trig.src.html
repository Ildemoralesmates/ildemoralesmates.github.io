<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circumferència goniomètrica - Raons trigonomètriques (4t ESO)</title>
<meta name="description" content="Circumferència goniomètrica interactiva: mou un punt i mira com canvien el sinus, el cosinus i la tangent. Taules d'angles notables amb valors exactes (radicals), gràfica i test. Amb activitats per a raonar. Per a 4t ESO.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
:root{--sin:#d62839;--cos:#1769c4;--tan:#139a4b;--ang:#6a3fd1}
#circle,#graph{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border-radius:10px}
#circle{max-width:640px;margin:0 auto;cursor:crosshair}
.halo{paint-order:stroke;stroke:#fff;stroke-width:.04;stroke-linejoin:round}
.hint{font-size:13px;color:var(--muted);margin:0}
.muted{color:var(--muted);font-size:13px}
.ctlrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctlrow label{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.ctlrow input[type=range]{flex:1;min-width:150px;accent-color:var(--ang)}
input[type=number]{width:88px;padding:5px 7px;font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
select{padding:5px;border-radius:7px;border:1px solid var(--line);font:inherit;font-size:13px;background:var(--panel);color:var(--ink)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px}
.legend{display:flex;gap:14px;font-weight:700;font-size:14px}
.rr{display:grid;grid-template-columns:64px 92px 1fr;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:16px}
.rr:last-of-type{border-bottom:0}
.rr .lab{font-weight:700}
.rr.s .lab{color:var(--sin)}.rr.c .lab{color:var(--cos)}.rr.t .lab{color:var(--tan)}
.rr .dec{font-variant-numeric:tabular-nums}
.bigang{font-size:19px;font-weight:700;color:var(--ang);margin-bottom:2px}
.tpill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;margin:2px 0}
.tpill.ok{border-color:var(--ok);color:var(--ok)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 2px;font-size:.95em}
.frac .n{border-bottom:1.5px solid currentColor;padding:0 3px 1px}
.frac .d{padding:1px 3px 0}
.sq{white-space:nowrap}
.sq .rd{border-top:1.5px solid currentColor;padding:0 1px;margin-left:1px}
.tval{white-space:nowrap}
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;width:100%;min-width:520px}
.tw th,.tw td{border:1px solid var(--line);padding:5px 8px;text-align:center;font-size:15px}
.tw th{background:var(--chip);font-size:13px}
.tw th small{font-weight:400;color:var(--muted)}
.tw td.clk,.tw tr.clk{cursor:pointer}
.tw td.clk:hover,.tw tr.clk:hover td{background:var(--chip)}
.tw .cur{background:color-mix(in srgb,var(--ang) 22%,transparent)!important;font-weight:700}
.tw tr.qh td{background:var(--chip);text-align:left;font-weight:600;font-size:13px;cursor:default}
.qline{font-size:18px;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px}
.topt{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;font-size:19px;cursor:pointer;min-height:54px;color:var(--ink)}
.topt:hover:not([disabled]){border-color:var(--ang)}
.topt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.topt.bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.fb{padding:10px 12px;border-radius:10px;background:var(--stage);margin:8px 0}
.fb p{margin:3px 0}
.trow{display:flex;gap:8px;margin:8px 0}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<div class="simgrid">
<div class="simcv"><svg id="circle" viewBox="-1.62 -1.62 3.24 3.24" role="img" data-i18n-aria="aria.circle" aria-label=""></svg></div>
<div class="side">
<div class="seg" role="group" data-i18n-aria="aria.unit" aria-label="">
<button id="uDeg" type="button" aria-pressed="true" data-i18n="unitDeg"></button>
<button id="uRad" type="button" aria-pressed="false" data-i18n="unitRad"></button>
</div>
<fieldset>
<legend data-i18n="ctrlTitle"></legend>
<p class="hint" data-i18n="ctrlHint"></p>
<div class="ctlrow">
<label><b data-i18n="angleLbl"></b></label>
<input type="range" id="slider" min="0" max="360" step="1" value="30">
<input type="number" id="angleInput" step="1"> <span id="angleUnit"></span>
</div>
<div class="ctlrow">
<button class="btn primary" type="button" id="play"></button>
<label><span data-i18n="speed"></span>
<select id="speed">
<option value="15" data-i18n="slow"></option>
<option value="40" selected data-i18n="mid"></option>
<option value="90" data-i18n="fast"></option>
</select></label>
</div>
<div class="ctlrow">
<label><input type="checkbox" id="magnet" checked> <span data-i18n="magnet"></span></label>
<label><input type="checkbox" id="pauseN" checked> <span data-i18n="pauseN"></span></label>
</div>
<div class="ctlrow">
<b data-i18n="showLbl"></b>
<label><input type="checkbox" id="shSin" checked><span class="dot" style="background:var(--sin)"></span><span data-i18n="fnSin"></span></label>
<label><input type="checkbox" id="shCos" checked><span class="dot" style="background:var(--cos)"></span><span data-i18n="fnCos"></span></label>
<label><input type="checkbox" id="shTan" checked><span class="dot" style="background:var(--tan)"></span><span data-i18n="fnTan"></span></label>
</div>
<div><b data-i18n="quickTitle"></b></div>
<div class="chips" id="quick"></div>
</fieldset>
<fieldset>
<legend data-i18n="readTitle"></legend>
<div id="readout"></div>
</fieldset>
<fieldset>
<legend data-i18n="graphTitle"></legend>
<div class="legend"><span style="color:var(--sin)" data-i18n="fnSin"></span><span style="color:var(--cos)" data-i18n="fnCos"></span></div>
<svg id="graph" viewBox="0 0 440 230" role="img" data-i18n-aria="aria.graph" aria-label=""></svg>
<p class="hint" data-i18n="graphHint"></p>
</fieldset>
</div>
</div>
<div class="idea" data-i18n-html="idea"></div>
</section>

<section class="card">
<h2 data-i18n="tabATitle"></h2>
<p class="hint" data-i18n="tabAHint"></p>
<div class="tw" id="tabA"></div>
<p class="muted" data-i18n="relNote"></p>
</section>

<section class="card">
<h2 data-i18n="tabBTitle"></h2>
<p class="hint" data-i18n="tabBHint"></p>
<div class="tw" id="tabB"></div>
</section>

<section class="card">
<h2 data-i18n="testTitle"></h2>
<div id="testBox"></div>
</section>

<!--@RAONA@-->

  </main>
  <!--@FOOTER@-->
</div>

/* ---------- Mini test ---------- */
const TS={q:null,done:false,chosen:null,right:0,total:0};
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newQuestion(){
  const d=NOT[Math.floor(Math.random()*NOT.length)];
  const fn=['sin','cos','tan'][Math.floor(Math.random()*3)];
  const cor=exact(fn,d);
  const key=v=>v.sign+v.mag;
  const norm=v=>{ if(v.mag==='0'||v.mag==='nd') v.sign='+'; return v; };
  const opts=[cor]; const seen=new Set([key(cor)]);
  const add=v=>{ v=norm(v); const k=key(v); if(!seen.has(k)&&opts.length<4){ seen.add(k); opts.push(v); } };
  const {q,ref}=quadOf(d);
  if(cor.mag!=='0'&&cor.mag!=='nd') add({sign:cor.sign==='+'?'-':'+',mag:cor.mag});
  const dm = fn==='tan' ? REF[90-ref].tan : (fn==='sin' ? REF[ref].cos : REF[ref].sin);
  add({sign:cor.sign,mag:dm});
  const pool = fn==='tan' ? ['0','√3/3','1','√3','nd'] : ['0','1/2','√2/2','√3/2','1'];
  let guard=0;
  while(opts.length<4 && guard++<100){
    add({sign:Math.random()<.5?'+':'-',mag:pool[Math.floor(Math.random()*pool.length)]});
  }
  TS.q={d:d,fn:fn,opts:shuffle(opts),key:key(cor)};
  TS.done=false; TS.chosen=null;
}
function explain(fn,d){
  const fnN=t(fn+'N');
  const A=angleHTML(d,ST.unit);
  const {q,ref}=quadOf(d);
  const val=valHTML(exact(fn,d));
  if(d%90===0){
    const c=valHTML(exact('cos',d)), s=valHTML(exact('sin',d));
    let h='<p>'+tt('onAxis',A,c,s)+'</p>';
    if(fn==='cos') h+='<p>'+t('abscissa')+': '+val+'</p>';
    else if(fn==='sin') h+='<p>'+t('ordinate')+': '+val+'</p>';
    else h+='<p>'+(exact('cos',d).mag==='0'?t('tanAxisND'):tt('tanAxis',c))+'</p>';
    return h;
  }
  const refA=angleHTML(ref,ST.unit);
  let h='<p><b>'+t('redIs')+'</b> '+redLine(d)+'</p>';
  h+='<p>'+(REF[ref][fn]==='nd'?tt('tanRefND',refA):tt('refVal',fnN,refA,magHTML(REF[ref][fn])))+'</p>';
  h+='<p>'+tt('signIs',t('quad'+q),fnN,signSym(SG[q][fn]))+'</p>';
  h+='<p><b>'+tt('result',fnN,A,val)+'</b></p>';
  return h;
}
function renderTest(){
  if(!TS.q) newQuestion();
  const Q=TS.q;
  let h='<div class="qline">'+tt('qText',t(Q.fn+'N'),angleHTML(Q.d,ST.unit))+'</div><div class="opts">';
  Q.opts.forEach(o=>{
    const k=o.sign+o.mag; let cls='topt';
    if(TS.done){ if(k===Q.key) cls+=' good'; else if(k===TS.chosen) cls+=' bad'; }
    h+='<button class="'+cls+'" data-k="'+k+'"'+(TS.done?' disabled':'')+'>'+valHTML(o)+'</button>';
  });
  h+='</div>';
  if(TS.done){
    const okk=TS.chosen===Q.key;
    h+='<div class="fb"><p><b>'+(okk?t('ok'):t('ko'))+'</b></p>'+explain(Q.fn,Q.d)+'</div>';
    h+='<div class="trow"><button class="btn" id="tNext">'+t('next')+'</button><button class="btn" id="tSee">'+t('seeIt')+'</button></div>';
  }
  h+='<div class="muted">'+t('score')+': '+TS.right+' / '+TS.total+'</div>';
  $('#testBox').innerHTML=h;
  document.querySelectorAll('#testBox .topt').forEach(b=>b.addEventListener('click',()=>{
    if(TS.done) return;
    TS.chosen=b.getAttribute('data-k'); TS.done=true; TS.total++;
    if(TS.chosen===Q.key) TS.right++;
    renderTest();
  }));
  const nx=$('#tNext'); if(nx) nx.addEventListener('click',()=>{ newQuestion(); renderTest(); });
  const se=$('#tSee'); if(se) se.addEventListener('click',()=>{ stopPlay(); setAngle(Q.d); ensureCircleVisible(); });
}

function setAngle(a){ ST.angle=a; render(); }
function render(){

function snap(a,forPointer){
  a=Math.round(a);
  if(ST.magnet){ for(const n of NOT){ if(Math.abs(a-n)<=2){ a=n; break; } } }
  if(forPointer&&a>=360&&!ST.magnet) a=0;
  return Math.max(0,Math.min(360,a));
}
let raf=0,lastTs=null,holdUntil=0;
function updPlayBtn(){ $('#play').textContent=ST.playing?t('stop'):t('play'); }
function stopPlay(){ ST.playing=false; cancelAnimationFrame(raf); updPlayBtn(); }
function startPlay(){
  if(ST.playing) return;
  ST.playing=true; lastTs=null; holdUntil=0; updPlayBtn();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function tick(ts){
  if(!ST.playing) return;
  if(lastTs===null) lastTs=ts;
  const dt=Math.min(.1,(ts-lastTs)/1000); lastTs=ts;
  if(ts<holdUntil){ raf=requestAnimationFrame(tick); return; }
  const a=ST.angle; let next=a+ST.speed*dt;
  if(ST.pause){
    const n=NOT.find(x=>x>a+1e-6&&x<=next+1e-9);
    if(n!==undefined){ next=n; holdUntil=ts+1700; }
  }
  if(next>360) next-=360;
  setAngle(next);
  raf=requestAnimationFrame(tick);
}
function svgPoint(el,e){ const p=el.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(el.getScreenCTM().inverse()); }
