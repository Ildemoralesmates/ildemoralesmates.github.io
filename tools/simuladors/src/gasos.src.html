<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lleis dels gasos</title>
<meta name="description" content="Simulador cinètico de gas ideal: lleis de Boyle–Mariotte, Charles i Gay-Lussac amb pressió mesurada a partir dels xocs, gràfiques i taula de mesures.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
.law h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.formula{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.01em}
.pill b{color:var(--ink)}
.rec{display:flex;flex-wrap:wrap;gap:6px}
#tbl td:first-child{font-family:var(--f-num)}
.dim{opacity:.55}
ol.q{margin:0;padding-left:1.2em;color:var(--muted);font-size:14px;display:grid;gap:5px}
ol.q b{color:var(--ink);font-weight:600}
.var-tag{font-size:11px;color:var(--pa);font-weight:700;margin-left:6px}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main class="app">
    <section class="stage-card" data-i18n-aria="aria.sim" aria-label="">
      <div class="bar">
        <button id="play" class="btn primary" type="button"></button>
        <button id="rec" class="btn" type="button" data-i18n="rec"></button>
        <span class="pill" id="varPill"></span>
        <span class="pill sp" id="clock"></span>
      </div>
      <div class="stage"><canvas id="cv" data-i18n-aria="aria.cv" aria-label=""></canvas></div>
    </section>

    <aside class="panel" data-i18n-aria="aria.ctl" aria-label="">
      <fieldset>
        <legend data-i18n="f.law"></legend>
        <div class="seg" id="modes" role="group">
          <button type="button" data-m="boyle">Boyle</button>
          <button type="button" data-m="charles">Charles</button>
          <button type="button" data-m="gay">Gay-Lussac</button>
          <button type="button" data-m="gen" data-i18n="gen"></button>
        </div>
        <p class="note" id="modeHelp"></p>
      </fieldset>
      <fieldset>
        <legend data-i18n="f.par"></legend>
        <div id="ctl" style="display:grid;gap:10px"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="f.show"></legend>
        <label class="check"><input type="checkbox" id="colors" checked> <span data-i18n="colors"></span></label>
      </fieldset>
    </aside>
  </main>

  <section class="cards">
    <article class="card law">
      <h2><small data-i18n="c1.s"></small><span id="lawName"></span></h2>
      <div class="formula" id="formula"></div>
      <p id="lawText"></p>
      <dl>
        <dt data-i18n="d.n"></dt><dd id="dN"></dd>
        <dt data-i18n="d.T"></dt><dd id="dT"></dd>
        <dt data-i18n="d.V"></dt><dd id="dV"></dd>
        <dt data-i18n="d.Pm"></dt><dd id="dPm" class="hl"></dd>
        <dt data-i18n="d.Pt"></dt><dd id="dPt"></dd>
        <dt id="kLab"></dt><dd id="dK" class="hl"></dd>
      </dl>
      <p class="note" data-i18n="c1.note"></p>
    </article>

    <article class="card">
      <h2><small data-i18n="c2.s"></small><span id="plotName"></span></h2>
      <div class="seg" id="plotSeg" style="display:none">
        <button type="button" data-p="pv" aria-pressed="true">P – V</button>
        <button type="button" data-p="pinv">P – 1/V</button>
      </div>
      <div class="plot"><canvas id="plot" data-i18n-aria="c2.aria" aria-label=""></canvas></div>
      <p class="note" data-i18n="c2.note"></p>
    </article>

    <article class="card">
      <h2><small data-i18n="c3.s"></small><span data-i18n="c3.h"></span></h2>
      <p class="note" data-i18n="c3.p"></p>
      <table class="tbl"><thead id="thead"></thead><tbody id="tbl"></tbody></table>
      <div class="rec"><button class="btn" type="button" id="rec2" data-i18n="rec"></button><button class="btn" type="button" id="clearT" data-i18n="clearT"></button></div>
    </article>

    <article class="card">
      <h2><small data-i18n="c4.s"></small><span data-i18n="c4.h"></span></h2>
      <ol class="q" data-i18n-html="c4.l"></ol>
    </article>
  </section>
  <!--@FOOTER@-->
</div>

},

"k.boyle":"P · V","k.charles":"V / T","k.gay":"P / T","k.gen":"P·V / (n·T) = R",
"c1.note":"Gas en 2D, unidades arbitrarias (u.a.). La P medida fluctúa: es lo que pasa de verdad con un número finito de partículas.",

}};
/*@COMMON_JS@*/

var READY=false;
const W=760,H=400;
const cvo=makeCanvas($('#cv'),W,H,()=>{if(READY)draw();}),ctx=cvo.ctx;
const plo=makeCanvas($('#plot'),460,320,()=>{if(READY)drawPlot();}),pc=plo.ctx;

/* ============ modelo ============ */
const KS=48;                 // k_B·T = KS·T  (masa 1, unidades px, s)
const RR=0.48;               // R efectivo en u.a. con n = N/10 y V = área/1000
const X0=30,Y0=64,HC=220,LMIN=100,LMAX=520;
const G={mode:'boyle',T:300,Ts:300,n:6,Lx:300,Lxt:300,Pc:14.4,parts:[],Pm:14.4,imp:0,acc:0,var:'V',recs:[],plot:'pv',colors:true,playing:!REDUCE,time:0};
const V_of=L=>L*HC/1000, L_of=V=>V*1000/HC;
const nPart=()=>G.n*10;
function newPart(){
  const s=Math.sqrt(KS*G.Ts),x=X0+6+Math.random()*(G.Lx-12);
  return {x,y:Y0+6+Math.random()*(HC-12),vx:randn()*s,vy:randn()*s};
}
function syncN(){
  while(G.parts.length<nPart())G.parts.push(newPart());
  if(G.parts.length>nPart())G.parts.length=nPart();
}
function step(dt){
  G.time+=dt;
  /* temperatura de consigna: suavizada */
  G.T=G.Ts;
  /* objetivo del émbolo */
  if(G.mode==='charles'){const L=L_of(G.n*RR*G.T/G.Pc);G.clamped=L<LMIN||L>LMAX;G.Lxt=clamp(L,LMIN,LMAX);}else G.clamped=false;
  const dL=clamp(G.Lxt-G.Lx,-170*dt,170*dt);G.Lx+=dL;const vp=dL/dt;
  const px=X0+G.Lx,r=4;let imp=0;
  for(const p of G.parts){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<X0+r){p.x=X0+r;p.vx=Math.abs(p.vx);}
    if(p.y<Y0+r){p.y=Y0+r;p.vy=Math.abs(p.vy);}
    if(p.y>Y0+HC-r){p.y=Y0+HC-r;p.vy=-Math.abs(p.vy);}
    if(p.x>px-r){p.x=px-r;if(p.vx>vp){imp+=2*(p.vx-vp);p.vx=2*vp-p.vx;}}
  }
  /* termostat (Berendsen) per components: sense col·lisions entre partícules, vx i vy no s'intercanvien energia */
  let kx=0,ky=0;for(const p of G.parts){kx+=p.vx*p.vx;ky+=p.vy*p.vy;}
  const Nn=Math.max(1,G.parts.length),Tcx=kx/(KS*Nn),Tcy=ky/(KS*Nn);
  const lx=Math.sqrt(Math.max(.2,1+(dt/.25)*(G.T/Math.max(Tcx,1)-1))),ly=Math.sqrt(Math.max(.2,1+(dt/.25)*(G.T/Math.max(Tcy,1)-1)));
  for(const p of G.parts){p.vx*=lx;p.vy*=ly;}
  const Tc=(Tcx+Tcy)/2;
  const inst=imp/(dt*HC);
  G.Pm+=(inst-G.Pm)*(1-Math.exp(-dt/1.0));
  G.Tc=Tc;
}
const Vcur=()=>V_of(G.Lx);
const Pth=()=>G.n*RR*G.T/Vcur();

/* ============ dibujo ============ */
function draw(){
  const c=ctx,col=C();
  c.fillStyle=col.stage;c.fillRect(0,0,W,H);
  const px=X0+G.Lx;
  /* calentador */
  const u=clamp((G.T-100)/500,0,1);
  const hr=Math.round(lerp(90,255,u)),hg=Math.round(lerp(150,90,u)),hb=Math.round(lerp(255,40,u));
  const gr=c.createLinearGradient(0,Y0+HC,0,Y0+HC+26);gr.addColorStop(0,'rgba('+hr+','+hg+','+hb+',.85)');gr.addColorStop(1,'rgba('+hr+','+hg+','+hb+',0)');
  c.fillStyle=gr;c.fillRect(X0,Y0+HC+2,G.Lx,26);
  c.strokeStyle='rgb('+hr+','+hg+','+hb+')';c.lineWidth=3;c.beginPath();
  for(let x=X0+6;x<px-4;x+=10){c.lineTo(x,Y0+HC+10+(Math.round((x-X0)/10)%2?5:-1));}
  c.stroke();
  /* recipiente */
  c.fillStyle=col.panel;c.fillRect(X0,Y0,G.Lx,HC);
  c.strokeStyle=col.ink;c.lineWidth=3;c.beginPath();c.moveTo(px,Y0);c.lineTo(X0,Y0);c.lineTo(X0,Y0+HC);c.lineTo(px,Y0+HC);c.stroke();
  /* émbolo */
  c.fillStyle=col.muted;c.fillRect(px-2,Y0-6,9,HC+12);
  c.fillRect(px+7,Y0+HC/2-3,40,6);c.fillStyle=col.ink;rrect(c,px+47,Y0+HC/2-14,9,28,3);c.fill();
  /* partículas */
  const s=Math.sqrt(KS*G.Ts);
  for(const p of G.parts){
    if(G.colors){const v=Math.hypot(p.vx,p.vy)/(2.2*s);c.fillStyle='hsl('+Math.round(220*(1-clamp(v,0,1)))+',78%,'+(col.dark?62:50)+'%)';}
    else c.fillStyle=col.pa;
    c.beginPath();c.arc(p.x,p.y,4,0,TAU);c.fill();
  }
  /* manómetro */
  const gx=692,gy=130,gr0=50,Pmax=60,fr=clamp(G.Pm/Pmax,0,1);
  c.lineWidth=7;c.strokeStyle=col.line;c.beginPath();c.arc(gx,gy,gr0,Math.PI,TAU);c.stroke();
  c.strokeStyle=col.pa;c.beginPath();c.arc(gx,gy,gr0,Math.PI,Math.PI+fr*Math.PI);c.stroke();
  c.lineWidth=1;c.strokeStyle=col.muted;
  for(let i=0;i<=6;i++){const a=Math.PI+i/6*Math.PI;c.beginPath();c.moveTo(gx+(gr0-12)*Math.cos(a),gy+(gr0-12)*Math.sin(a));c.lineTo(gx+(gr0-18)*Math.cos(a),gy+(gr0-18)*Math.sin(a));c.stroke();}
  const a=Math.PI+fr*Math.PI;c.strokeStyle=col.ink;c.lineWidth=2.2;c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+(gr0-14)*Math.cos(a),gy+(gr0-14)*Math.sin(a));c.stroke();
  c.fillStyle=col.ink;c.beginPath();c.arc(gx,gy,4,0,TAU);c.fill();
  c.textAlign='center';c.font='600 14px ui-monospace,Menlo,monospace';c.fillText('P = '+fmt(G.Pm,1),gx,gy+24);
  c.font='11px system-ui';c.fillStyle=col.muted;c.fillText('u.a.',gx,gy+38);
  /* termómetro */
  const tx=700,ty0=250,ty1=380;
  c.strokeStyle=col.muted;c.lineWidth=1.5;rrect(c,tx-6,ty0,12,ty1-ty0,6);c.stroke();
  const th=(ty1-ty0-6)*clamp(G.T/650,0,1);
  c.fillStyle='rgb('+hr+','+hg+','+hb+')';rrect(c,tx-3,ty1-3-th,6,th,3);c.fill();
  c.fillStyle=col.ink;c.font='600 13px ui-monospace,Menlo,monospace';c.textAlign='right';c.fillText(Math.round(G.T)+' K',tx-14,ty0+20);
  c.fillStyle=col.muted;c.font='11px system-ui';c.fillText(fmt(G.T-273.15,0)+' °C',tx-14,ty0+36);
  /* cotas */
  c.strokeStyle=col.muted;c.lineWidth=1;c.beginPath();c.moveTo(X0,Y0-18);c.lineTo(px,Y0-18);c.moveTo(X0,Y0-23);c.lineTo(X0,Y0-13);c.moveTo(px,Y0-23);c.lineTo(px,Y0-13);c.stroke();
  c.fillStyle=col.ink;c.textAlign='center';c.font='600 13px ui-monospace,Menlo,monospace';c.fillText('V = '+fmt(Vcur(),1)+' u.a.',(X0+px)/2,Y0-26);
  c.fillStyle=col.muted;c.font='11px system-ui';c.textAlign='left';c.fillText('n = '+G.n+' mol',X0,H-10);
}
function drawPlot(){
  const c=pc,W2=460,H2=320,col=C(),m={l:52,r:14,t:16,b:40};
  c.fillStyle=col.panel;c.fillRect(0,0,W2,H2);
  const md=G.mode,law=(md==='gen')?'boyle':md;
  let xs,ys,xl,yl,xf,curve,pts,live,xmin=0;
  const n=G.n,T=G.T,Vc=Vcur();
  if(law==='boyle'){
    const inv=G.plot==='pinv';
    const Pmax=Math.max(10,1.15*n*RR*T/22);
    xs=inv?[0,50]:[0,130];ys=[0,Pmax];xl=inv?'1000 / V':'V (u.a.)';yl='P (u.a.)';
    const f=V=>n*RR*T/V;
    if(inv){curve=[[0,0],[50,n*RR*T*50/1000]];}else{curve=[];for(let V=22;V<=125;V+=1.5)curve.push([V,f(V)]);}
    pts=G.recs.map(r=>[inv?1000/r.V:r.V,r.P]);live=[inv?1000/Vc:Vc,G.Pm];
  }else if(law==='charles'){
    xs=[0,650];ys=[0,130];xl='T (K)';yl='V (u.a.)';
    curve=[[0,0],[650,n*RR*650/G.Pc]];pts=G.recs.map(r=>[r.T,r.V]);live=[T,Vc];
  }else{
    xs=[0,650];ys=[0,Math.max(10,1.15*n*RR*650/Vc)];xl='T (K)';yl='P (u.a.)';
    curve=[[0,0],[650,n*RR*650/Vc]];pts=G.recs.map(r=>[r.T,r.P]);live=[T,G.Pm];
  }
  const X=x=>m.l+(x-xs[0])/(xs[1]-xs[0])*(W2-m.l-m.r),Y=y=>H2-m.b-(y-ys[0])/(ys[1]-ys[0])*(H2-m.t-m.b);
  /* ejes y rejilla */
  c.strokeStyle=col.line;c.lineWidth=1;c.fillStyle=col.muted;c.font='11px ui-monospace,Menlo,monospace';
  const tick=(a,b)=>{const raw=(b-a)/5,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,s=f<1.5?1:f<3?2:f<7?5:10;return s*p;};
  const tx=tick(xs[0],xs[1]),ty=tick(ys[0],ys[1]);
  c.textAlign='center';for(let x=xs[0];x<=xs[1]+1e-9;x+=tx){c.beginPath();c.moveTo(X(x),m.t);c.lineTo(X(x),H2-m.b);c.stroke();c.fillText(Math.round(x*10)/10,X(x),H2-m.b+14);}
  c.textAlign='right';for(let y=ys[0];y<=ys[1]+1e-9;y+=ty){c.beginPath();c.moveTo(m.l,Y(y));c.lineTo(W2-m.r,Y(y));c.stroke();c.fillText(Math.round(y*10)/10,m.l-6,Y(y)+4);}
  c.strokeStyle=col.ink;c.lineWidth=1.6;c.beginPath();c.moveTo(m.l,m.t);c.lineTo(m.l,H2-m.b);c.lineTo(W2-m.r,H2-m.b);c.stroke();
  c.fillStyle=col.ink;c.font='12px system-ui';c.textAlign='center';c.fillText(xl,(m.l+W2-m.r)/2,H2-6);
  c.save();c.translate(13,(m.t+H2-m.b)/2);c.rotate(-Math.PI/2);c.fillText(yl,0,0);c.restore();
  /* curva teórica */
  c.save();c.beginPath();c.rect(m.l,m.t,W2-m.l-m.r,H2-m.t-m.b);c.clip();
  c.strokeStyle=col.muted;c.lineWidth=2;c.beginPath();curve.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1])));c.stroke();
  pts.forEach(p=>{c.fillStyle=col.pb;c.beginPath();c.arc(X(p[0]),Y(p[1]),5,0,TAU);c.fill();});
  c.fillStyle=col.pa;c.strokeStyle=col.panel;c.lineWidth=2;c.beginPath();c.arc(X(live[0]),Y(live[1]),6.5,0,TAU);c.fill();c.stroke();
  c.restore();
}
/* ============ interfaz ============ */
const host=$('#ctl'),S={};
S.T=slider(host,{id:'sT',key:'sT',min:100,max:600,step:5,val:300,fmtv:v=>v+' K',on:v=>{G.Ts=v;}});
S.V=slider(host,{id:'sV',key:'sV',min:22,max:114,step:1,val:60,fmtv:v=>fmt(v,0)+' u.a.',on:v=>{G.Lxt=L_of(v);}});
S.n=slider(host,{id:'sn',key:'sn',min:2,max:15,step:1,val:6,fmtv:v=>v+' mol',on:v=>{G.n=v;syncN();}});
S.P=slider(host,{id:'sP',key:'sP',min:6,max:40,step:.5,val:14.4,fmtv:v=>fmt(v,1)+' u.a.',on:v=>{G.Pc=v;}});
const VARS={boyle:'V',charles:'T',gay:'T',gen:''};
function setMode(m){
  G.mode=m;G.recs=[];
  if(m==='charles'){G.Pc=clamp(G.n*RR*G.Ts/Vcur(),6,40);S.P.set(G.Pc);}
  $$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));
  S.V.disable(m==='charles');S.P.el.style.display=m==='charles'?'':'none';
  if(m!=='charles'){S.V.set(clamp(Math.round(Vcur()),22,114));G.Lxt=L_of(+S.V.inp.value);}
  $('#plotSeg').style.display=(m==='boyle'||m==='gen')?'':'none';
  renderStatic();
}
function renderStatic(){
  const m=G.mode;
  $('#modeHelp').textContent=t('help.'+m);
  $('#lawName').textContent=t(m+'.n');$('#formula').textContent=t(m+'.f');$('#lawText').textContent=t(m+'.t');
  $('#kLab').textContent=t('k.'+m);
  const vn={boyle:'V',charles:'T',gay:'T',gen:'n, T, V'}[m];$('#varPill').innerHTML=t('var',{v:'<b>'+vn+'</b>'});
  const head={boyle:['V','P','P·V'],charles:['T (K)','V','V/T'],gay:['T (K)','P','P/T'],gen:['n','T (K)','V','P','P·V/(n·T)']}[m];
  $('#thead').innerHTML='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  $('#plotName').textContent=({boyle:'P – V',charles:'V – T',gay:'P – T',gen:'P – V'})[m];
  $('#play').textContent=G.playing?t('play'):t('resume');
  renderTable();
}
function renderTable(){
  const m=G.mode;
  $('#tbl').innerHTML=G.recs.slice(-8).reverse().map(r=>{
    const f=(x,d)=>fmt(x,d);
    const cells={boyle:[f(r.V,1),f(r.P,1),f(r.P*r.V,0)],charles:[f(r.T,0),f(r.V,1),f(r.V/r.T,4)],gay:[f(r.T,0),f(r.P,1),f(r.P/r.T,4)],gen:[r.n,f(r.T,0),f(r.V,1),f(r.P,1),f(r.P*r.V/(r.n*r.T),3)]}[m];
    return '<tr>'+cells.map(x=>'<td>'+x+'</td>').join('')+'</tr>';
  }).join('');
}
function renderLive(){
  const V=Vcur(),P=G.Pm;
  $('#dN').textContent=G.n+' mol';$('#dT').textContent=Math.round(G.T)+' K ('+fmt(G.T-273.15,0)+' °C)';
  $('#dV').textContent=fmt(V,1)+' u.a.';$('#dPm').textContent=fmt(P,1)+' u.a.';$('#dPt').textContent=fmt(Pth(),1)+' u.a.';
  const k={boyle:P*V,charles:V/G.T,gay:P/G.T,gen:P*V/(G.n*G.T)}[G.mode];
  $('#dK').textContent=fmt(k,G.mode==='boyle'?0:G.mode==='gen'?3:4);
  $('#clock').textContent=G.clamped?t('limit'):t('d.Pm')+': '+fmt(P,1);
}
function record(){
  G.recs.push({n:G.n,T:G.T,V:Vcur(),P:G.Pm});if(G.recs.length>40)G.recs.shift();renderTable();
}
$('#rec').addEventListener('click',record);$('#rec2').addEventListener('click',record);
$('#clearT').addEventListener('click',()=>{G.recs=[];renderTable();});
$('#play').addEventListener('click',()=>{G.playing=!G.playing;$('#play').textContent=G.playing?t('play'):t('resume');});
$$('#modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
$$('#plotSeg button').forEach(b=>b.addEventListener('click',()=>{G.plot=b.dataset.p;$$('#plotSeg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawPlot();}));
$('#colors').addEventListener('change',e=>{G.colors=e.target.checked;});
document.addEventListener('langchange',()=>{Object.values(S).forEach(s=>s.refresh());renderStatic();});
document.addEventListener('themechange',()=>{draw();drawPlot();});

let last=performance.now(),pl=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(G.playing&&dt>0){step(dt);}
  draw();
  pl+=dt;if(pl>.1){pl=0;drawPlot();renderLive();}
  requestAnimationFrame(frame);
}
syncN();
G.Lxt=G.Lx=L_of(60);
READY=true;
initLang();applyLang();
setMode('boyle');
requestAnimationFrame(frame);
window.__g={G,step,Vcur,Pth,setMode,S,record};
</script>
