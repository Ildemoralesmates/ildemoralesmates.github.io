<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraccions amb barres</title>
<meta name="description" content="Totes les barres tenen la mateixa longitud per unitat, així es poden comparar a ull: fraccions equivalents, comparar i sumar. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d'altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
.fr{display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin-inline:3px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.fr>span{padding-inline:5px}
.fr>span:first-child{border-bottom:2px solid currentColor}
.barsbox{display:grid;gap:14px;background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:14px}
.brow{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr);gap:14px;align-items:center}
.brow .cap{font-size:18px;text-align:center}
.brow .cap small{display:block;font:500 12px var(--f-num);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.bar{display:block;width:100%;height:auto}
.bar .fa{fill:var(--pa);fill-opacity:.85}
.bar .fb{fill:var(--pb);fill-opacity:.9}
.bar .tk{stroke:var(--ink);stroke-opacity:.35;stroke-width:1}
.bar .tk.w{stroke-opacity:.95;stroke-width:2}
.bar .out{fill:none;stroke:var(--ink);stroke-width:2}
.ta{color:var(--pa);font-weight:700}.tb{color:var(--pb);font-weight:700}
.read{display:grid;gap:8px;font-size:15px}
.read .eq{margin:0;font-family:var(--f-num);font-size:15px;color:var(--ink)}
.read .big{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.2}
.read .steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:18px}
@media (max-width:480px){.brow{grid-template-columns:minmax(0,1fr)}.brow .cap{text-align:left}}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<h2 data-i18n="sim_title"></h2>
<p data-i18n-html="story"></p>
<div class="simgrid">
<div class="simcv"><div class="barsbox" id="bars"></div></div>
<div class="side">
<div class="seg" id="modes" role="group" data-i18n-aria="aria.mode" aria-label="">
<button type="button" data-m="eq" aria-pressed="true" data-i18n="m_eq"></button>
<button type="button" data-m="cmp" aria-pressed="false" data-i18n="m_cmp"></button>
<button type="button" data-m="sum" aria-pressed="false" data-i18n="m_sum"></button>
</div>
<fieldset id="gA"><legend class="ta" data-i18n="gA"></legend></fieldset>
<fieldset id="gB" hidden><legend class="tb" data-i18n="gB"></legend></fieldset>
<fieldset id="gK"><legend data-i18n="gK"></legend></fieldset>
<div class="read" id="out" aria-live="polite"></div>
</div>
</div>
<div class="idea" data-i18n-html="idea"></div>
</section>

<!--@RAONA@-->

  </main>
  <!--@FOOTER@-->
</div>

/*@COMMON_JS@*/
/*@QUIZ_JS@*/
/*@RAONA_JS@*/
/* ===== Fraccions amb barres ===== */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const fr=(n,d)=>'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
const S={};
const mk=(grp,pre,key,min,max,val)=>slider($(grp),{id:pre,key:key,min:min,max:max,step:1,val:val,on:render});
S.an=mk('#gA','an','l_num',0,12,2);S.ad=mk('#gA','ad','l_den',1,12,3);
S.bn=mk('#gB','bn','l_num',0,12,3);S.bd=mk('#gB','bd','l_den',1,12,4);
S.k=mk('#gK','kk','l_k',1,6,2);
const bars=$('#bars'),out=$('#out');
let mode='eq';
function bar(ticks,fills,wholes){
  const W=300*wholes,H=44,minor=ticks*wholes<=48;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="bar" role="img" aria-label="'+t('aria.bar')+'">';
  fills.forEach(q=>{s+='<rect x="'+(q.s*300)+'" y="0" width="'+(q.l*300)+'" height="'+H+'" class="'+q.c+'"/>';});
  for(let i=1;i<ticks*wholes;i++){
    const w=i%ticks===0;
    if(!w&&!minor)continue;
    const x=i/ticks*300;
    s+='<line x1="'+x+'" x2="'+x+'" y1="0" y2="'+H+'" class="'+(w?'tk w':'tk')+'"/>';
  }
  for(let w=0;w<wholes;w++)s+='<rect x="'+(w*300+1)+'" y="1" width="298" height="'+(H-2)+'" class="out"/>';
  return s+'</svg>';
}
const row=(cap,svg,label)=>'<div class="brow"><div class="cap">'+(label?'<small>'+label+'</small>':'')+cap+'</div>'+svg+'</div>';
const kMax=d=>Math.max(1,Math.min(6,Math.floor(48/d)));
function clampNums(){
  S.an.inp.max=S.ad.get();if(S.an.get()>S.ad.get())S.an.set(S.ad.get());
  S.bn.inp.max=S.bd.get();if(S.bn.get()>S.bd.get())S.bn.set(S.bd.get());
  const km=kMax(S.ad.get());S.k.inp.max=km;if(S.k.get()>km)S.k.set(km);
  Object.keys(S).forEach(key=>S[key].refresh());
}
function render(){
  clampNums();
  const an=S.an.get(),ad=S.ad.get(),bn=S.bn.get(),bd=S.bd.get(),k=S.k.get();
  let b='',o='';
  if(mode==='eq'){
    const g=gcd(an,ad),simp=an===0?'0':(ad/g===1?String(an/g):fr(an/g,ad/g));
    b=row(fr(an,ad),bar(ad,[{s:0,l:an/ad,c:'fa'}],1),t('orig'))+row(fr(an*k,ad*k),bar(ad*k,[{s:0,l:an/ad,c:'fa'}],1),t('equiv'));
    o='<div class="steps">'+fr(an,ad)+' = '+fr(an+' × '+k,ad+' × '+k)+' = '+fr(an*k,ad*k)+'</div>'+
      '<p class="note">'+t('eq_note')+'</p>'+
      '<p class="eq">'+tt('eq_irr',(g>1||an===0)?simp:t('eq_already'))+'</p>'+
      '<p class="eq">'+tt('eq_dec',nf(an/ad,3))+'</p>';
  }else if(mode==='cmp'){
    const x=an*bd,y=bn*ad,sym=x>y?'&gt;':(x<y?'&lt;':'=');
    b=row(fr(an,ad),bar(ad,[{s:0,l:an/ad,c:'fa'}],1),t('cA'))+row(fr(bn,bd),bar(bd,[{s:0,l:bn/bd,c:'fb'}],1),t('cB'));
    o='<div class="big">'+fr(an,ad)+' '+sym+' '+fr(bn,bd)+'</div>'+
      '<p class="eq">'+nf(an/ad,3)+' '+sym+' '+nf(bn/bd,3)+'</p>'+
      '<p class="eq">'+tt('cmp_cross',an,bd,x,sym,bn,ad,y)+'</p>'+
      '<p class="note">'+t(x===y?'cmp_eq':(x>y?'cmp_A':'cmp_B'))+'</p>';
  }else{
    const m=lcm(ad,bd),na=an*m/ad,nb=bn*m/bd,ns=na+nb,g=gcd(ns,m);
    b=row(fr(an,ad),bar(ad,[{s:0,l:an/ad,c:'fa'}],2),t('cA'))+
      row(fr(bn,bd),bar(bd,[{s:0,l:bn/bd,c:'fb'}],2),t('cB'))+
      row(fr(ns,m),bar(m,[{s:0,l:na/m,c:'fa'},{s:na/m,l:nb/m,c:'fb'}],2),t('cAB'));
    const q=Math.floor(ns/m),r=ns-q*m,g2=gcd(r,m);
    let simp='';
    if(g>1)simp=' = '+(ns/g%(m/g)===0?String(ns/m):fr(ns/g,m/g));
    const mixed=(q>=1&&r>0)?' = '+q+' '+fr(r/g2,m/g2):'';
    o='<p class="eq">'+tt('sum_den',ad,bd,m)+'</p>'+
      '<div class="steps">'+fr(an,ad)+' + '+fr(bn,bd)+' = '+fr(na,m)+' + '+fr(nb,m)+' = '+fr(ns,m)+simp+mixed+'</div>'+
      '<p class="note">'+t('sum_note')+'</p>';
  }
  bars.innerHTML=b;out.innerHTML=o;
  $('#gB').hidden=mode==='eq';$('#gK').hidden=mode!=='eq';
}
$$('#modes button').forEach(bt=>bt.addEventListener('click',()=>{setMode(bt.dataset.m);}));
function setMode(m){mode=m;$$('#modes button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===m)));render();}
App.hooks.push(render);
/* ===== Raona-ho ===== */
function load(m,an,ad,bn,bd,kv){
  ad=clamp(Math.round(ad||1),1,12);bd=clamp(Math.round(bd||1),1,12);
  an=clamp(Math.round(an||0),0,ad);bn=clamp(Math.round(bn||0),0,bd);
  kv=clamp(Math.round(kv||1),1,kMax(ad));
  S.an.inp.max=ad;S.bn.inp.max=bd;S.k.inp.max=kMax(ad);
  S.ad.set(ad);S.bd.set(bd);S.an.set(an);S.bn.set(bn);S.k.set(kv);
  setMode(m);RZ.show($('#bars'));
}
const isI=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;
const RNG={k:'rng'};
RZ.init({
 F:{n:{l:'f_n'},a:{l:'f_a'},b:{l:'f_b'}},
 sim:v=>load(...v),
 M:[
  {id:'m1',f:['n'],sim:()=>load('eq',2,3,3,4,4),ok:()=>({k:'m1_ok'}),
   chk:([n])=>!isI(n,0,24)?RNG:n===8?null:n===11?{k:'m1_add'}:{k:'m1_f',p:()=>[n,nf(n/12,2)]}},
  {id:'m2',f:['n'],sim:([n])=>load('cmp',n,7,1,2),ok:([n])=>({k:'m2_ok',p:()=>[n,nf(n/7,2)]}),
   chk:([n])=>!isI(n,0,7)?RNG:n<=3?{k:'m2_lo',p:()=>[n,nf(n/7,2)]}:n>=6?{k:'m2_hi',p:()=>[n,nf(n/7,2)]}:null},
  {id:'m3',f:['a','b'],sim:([a,b])=>load('sum',1,a,1,b),ok:([a,b])=>({k:'m3_ok',p:[a,b]}),
   chk:([a,b])=>!(isI(a,3,12)&&isI(b,3,12))?RNG:a===b?{k:'m3_same'}:lcm(a,b)!==12?{k:'m3_f',p:[a,b,lcm(a,b)]}:null},
  {id:'m4',f:['n'],sim:([n])=>load('cmp',n,12,5,6),ok:()=>({k:'m4_ok'}),
   chk:([n])=>!isI(n,0,12)?RNG:n===11?null:n===10?{k:'m4_eq'}:n>=12?{k:'m4_one',p:[n]}:{k:'m4_f',p:()=>[n,nf(n/12,2)]}}
 ],
 S:[
  {id:'s1',ans:'S',sim:()=>load('eq',2,3,3,4,3)},
  {id:'s2',ans:'D',f:['n','d'],cxsim:([n,d])=>load('cmp',n,d,n+1,d+1),
   cx:([n,d])=>!(isI(d,1,11)&&isI(n,0,d))?RNG:n===d?{k:'s2_cx_no',p:[n,n+1]}:null,
   sim:()=>load('cmp',1,2,2,3)},
  {id:'s3',ans:'M',sim:()=>load('cmp',1,3,1,4)},
  {id:'s4',ans:'S',sim:()=>load('sum',1,4,1,6)},
  {id:'s5',ans:'M',sim:()=>load('cmp',2,3,2,6)},
  {id:'s6',ans:'S',sim:()=>load('cmp',3,8,5,8)}
 ],
 E:[{id:'e1',who:1,args:['cmp',3,5,5,9]},{id:'e2',who:3,args:['sum',1,2,1,3]},{id:'e3',who:1,args:['eq',2,3,3,4,2]},{id:'e4',who:2,args:['eq',3,4,3,4,2]}],
 D:[
  {id:'d1',chips:{vals:[1,2],fmt:x=>t('d1.p'+x)},f:[{l:'f_dif',u:'/40'}],sim:()=>load('cmp',3,5,5,8),ok:()=>({k:'d1_ok'}),
   chk:([p,n])=>p!==2?{k:'d1_who'}:n!==1?{k:'d1_n'}:null},
  {id:'d2',f:[{l:'d2.l0'},{l:'d2.l1'}],sim:()=>load('sum',2,3,1,4),ok:()=>({k:'d2_ok'}),
   chk:([j,m])=>j!==8?{k:'d2_j'}:m!==3?{k:'d2_m'}:null},
  {id:'d3',chips:{vals:[6,8,12,24]},sim:()=>load('sum',1,3,1,4),ok:()=>({k:'d3_ok'}),
   chk:([p])=>p===12?null:p===24?{k:'d3_big',p:[p]}:{k:'d3_no',p:[p]}}
 ]
});
initQuiz([]);
render();
initLang();applyLang();
</script>
