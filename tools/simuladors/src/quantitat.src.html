"s4_ord":"La primera fracció ha de ser més gran que la segona.",
"s4_no":"Els {0}/{1} de {2} són {3} i els {4}/{5} de {6} són {7}: ací la fracció més gran sí que dona més.",
"s5.q":"«Els 2/3 de 30 i els 3/2 de 30 són el mateix.»",
"s5.h":"Calcula'ls: 30 : 3 × 2 i 30 : 2 × 3.",
"s5.e":"Mai: 2/3 de 30 = 20 (menys que 30) i 3/2 de 30 = 45 (més que 30). Girar la fracció canvia completament el resultat.",
"e1.ctx":"Calculeu els <b>3/5 de 40</b>.",
"e1.n0":"Marta","e1.n1":"Pau",
"e1.s0":"40 : 3 = 13,33 i × 5 = 66,7.",
"e1.s1":"40 : 5 = 8 i × 3 = 24.",
"e1.w0":"Marta ha dividit entre el numerador i ha multiplicat pel denominador: al revés. Es talla en 5 trossos (denominador) i se'n prenen 3. A més, 66,7 és més que 40 i els 3/5 d'una cosa no poden ser més que la cosa.",
"e1.w1":"Marta té raó: sempre es divideix pel nombre més menut.",
"e1.w2":"Cap dels dos: els 3/5 de 40 són 40 − 3 − 5 = 32.",
"e1.frame":"Marta, 66,7 no pot ser el resultat perquè…",
"e1.model":"Marta, has dividit entre 3 i multiplicat per 5, i és al revés: el denominador 5 diu en quants trossos es talla el 40 (40 : 5 = 8) i el numerador 3 quants en prenem (3 × 8 = 24). Fixa't que 66,7 és més que 40, i els 3/5 d'una cosa sempre són menys que la cosa.",
"e2.ctx":"Els <b>2/3</b> d'un nombre són <b>18</b>. Quin és el nombre?",
"e2.n0":"Àlex","e2.n1":"Laia",
"e2.s0":"18 × 2/3 = 12.",
"e2.s1":"18 : 2 = 9 cada tros, i 9 × 3 = 27.",
"e2.w0":"Àlex ha calculat els 2/3 de 18, però 18 ja és la part. Si 2 trossos valen 18, un tros val 9 i els 3 trossos del total valen 27. Comprovació: els 2/3 de 27 són 18.",
"e2.w1":"Laia s'equivoca: per a trobar el nombre sempre es multiplica per la fracció.",
"e2.w2":"Els dos tenen raó: 12 i 27 són les dues solucions.",
"e2.frame":"Àlex, 12 no pot ser el nombre perquè…",
"e2.model":"Àlex, has calculat els 2/3 de 18, però 18 no és el total: és la part. Si 2 trossos valen 18, un tros val 9 i el total, que té 3 trossos, val 27. A més, el total ha de ser més gran que la part, i 12 és menor que 18.",
"e3.ctx":"De <b>24 ous</b> n'han gastat <b>9</b>. Quina fracció dels ous <b>queda</b>?",
"e3.n0":"Joan","e3.n1":"Rita",
"e3.s0":"9/24 = 3/8.",
"e3.s1":"15/24 = 5/8.",
"e3.w0":"Joan ha calculat la fracció gastada, no la que queda. Queden 24 − 9 = 15 ous, i 15/24 = 5/8. Les dues fraccions sumen 1: 3/8 + 5/8 = 1.",
"e3.w1":"Joan té raó: la fracció es fa sempre amb el nombre que diu l'enunciat.",
"e3.w2":"Cap dels dos: la fracció que queda és 24/9.",
"e3.frame":"Joan, 3/8 no és la fracció que queda perquè…",
"e3.model":"Joan, 3/8 és la fracció dels ous gastats (9 de 24). La pregunta demana els que queden: 24 − 9 = 15, i 15/24 = 5/8. Pots comprovar-ho: 3/8 + 5/8 = 1, les dues parts formen la dotzena i mitja sencera.",

"title":"Fracción de una cantidad: la parte, el total y qué fracción es",

"lede":"Una cinta cortada en trozos iguales resuelve los tres problemas: cuánto vale la parte, cuánto vale el total y qué fracción es una cantidad de la otra. Predice antes de mirar.",

"tk_dec":"Fracción no exacta: los trozos no son enteros. Prueba con un total múltiplo del denominador.",
"p0.title":"La cinta: el total",
"p0.text":"<p>Dibujamos la cantidad total como una <b>cinta</b>. Queremos calcular una <b>fracción</b> de esa cantidad: por ejemplo, los 3/5 de 40. El denominador dice en cuántos trozos iguales cortamos la cinta; el numerador, cuántos tomamos.</p>",
"p0.q":"Para calcular los 3/5 de 40, cada trozo de la cinta vale…",
"p0.o0":"40 : 5 = 8","p0.o1":"40 : 3","p0.o2":"40 × 3 = 120",
"p0.why":"El denominador 5 dice que la cinta se corta en 5 trozos iguales, y 40 : 5 = 8 es lo que vale cada uno.",
"p1.title":"Cortamos en trozos iguales",
"p1.text":"<p>El denominador corta la cinta en trozos iguales. Dividimos el total entre el denominador y ya sabemos <b>cuánto vale cada trozo</b>.</p>",
"p1.q":"Si el total es 40 y cortamos en 5 trozos, ¿cuánto valen 2 trozos?",
"p1.o0":"8","p1.o1":"16","p1.o2":"2",
"p1.why":"Cada trozo vale 8, y dos trozos son 2 × 8 = 16.",
"p2.title":"Tomamos los trozos del numerador",
"p2.text":"<p>El numerador dice cuántos trozos tomamos. Multiplicamos el valor de un trozo por el numerador y tenemos <b>la parte</b>.</p>",
"p2.q":"¿Los 3/5 de 40 son más o menos que 40?",
"p2.o0":"Más: hemos multiplicado por 3","p2.o1":"Menos: tomamos 3 trozos de 5","p2.o2":"Igual",
"p2.why":"Tomamos solo 3 de los 5 trozos, así que nos quedamos con menos que el total: 24 < 40.",
"p3.title":"Las dos maneras",
"p3.text":"<p>Dividir entre el denominador y después multiplicar por el numerador es lo mismo que multiplicar primero y dividir después: <b>la fracción de una cantidad es la cantidad multiplicada por la fracción</b>.</p>",
"p3.tq":"¿Se pueden calcular los 3/5 de 37? ¿Y los 2/3 de 37? ¿Qué pasa con los trozos?",
"p3.th":"Se pueden calcular (37 · 3/5 = 22,2), pero los trozos ya no son números enteros. Cuando la cantidad es un número de cosas (alumnos, caramelos), el total tiene que ser múltiplo del denominador.",
"t0.title":"El problema inverso: sabemos la parte",
"t0.text":"<p>Ahora conocemos la <b>parte</b> y la <b>fracción</b>, y queremos el <b>total</b>. Por ejemplo: los 3/5 de una clase son 24 alumnos; ¿cuántos son en total? En la cinta, los trozos pintados valen 24 y el total es la incógnita.</p>",
"t0.q":"Si 3 trozos valen 24, un trozo vale…",
"t0.o0":"24 : 3 = 8","t0.o1":"24 × 3 = 72","t0.o2":"24 : 5",
"t0.why":"Los 3 trozos pintados se reparten 24: cada uno vale 24 : 3 = 8.",
"t1.title":"Cuánto vale un trozo",
"t1.text":"<p>La parte cubre tantos trozos como dice el <b>numerador</b>. Dividimos la parte entre el numerador y ya sabemos <b>cuánto vale un trozo</b>.</p>",
"t1.q":"Si un trozo vale 8 y la cinta tiene 5 trozos, el total es…",
"t1.o0":"8 × 5 = 40","t1.o1":"8 × 3 = 24","t1.o2":"8 + 5 = 13",
"t1.why":"El total son todos los trozos del denominador: 5 trozos de 8 son 40.",
"t2.title":"Todos los trozos",
"t2.text":"<p>El total tiene tantos trozos como dice el <b>denominador</b>. Multiplicamos el valor de un trozo por el denominador y tenemos <b>el total</b>.</p>",
"t2.q":"Si los 3/5 de una cantidad son 24, ¿el total es más o menos que 24?",
"t2.o0":"Más: 24 solo es una parte","t2.o1":"Menos","t2.o2":"Igual",
"t2.why":"24 son 3 trozos de 5. El total tiene los 5 trozos, así que es mayor: 40.",
"t3.title":"Comprobamos y generalizamos",
"t3.text":"<p>Comprobación: calculamos la fracción del total que hemos hallado y tiene que dar la parte. En general, <b>hallar el total es dividir la parte entre la fracción</b>, que es multiplicar por la fracción inversa.</p>",
"t3.tq":"Si los 3/5 son 24, ¿cuánto valen los 2/5 que faltan? ¿Cómo lo hallarías sin calcular el total?",
"t3.th":"Un trozo vale 8, así que los 2/5 son 16. También: el total es 40 y 40 − 24 = 16.",
"f0.title":"Inicial y final",
"f0.text":"<p>Ahora conocemos dos cantidades: la <b>inicial</b> (todo lo que había) y la <b>final</b> (lo que queda, o lo que hay ahora). Queremos saber <b>qué fracción de la inicial es la final</b>. Por ejemplo: de 40 caramelos quedan 25.</p>",
"f0.q":"De 40 caramelos quedan 25. La fracción que queda es…",
"f0.o0":"25/40","f0.o1":"40/25","f0.o2":"40 − 25 = 15",
"f0.why":"La fracción es lo que hay (25) dividido entre el total de partida (40). 15 es lo que se ha ido, no una fracción.",
"f1.title":"Trozos iguales que encajan",
"f1.text":"<p>Para verlo con trozos buscamos el <b>mcd</b> de las dos cantidades: es el trozo más grande que cabe un número exacto de veces en las dos. Contamos cuántos trozos tiene la cinta y cuántos ocupa la final.</p>",
"f1.q":"Con 40 y 25, el trozo más grande que encaja en las dos vale…",
"f1.o0":"5","f1.o1":"1","f1.o2":"25",
"f1.why":"mcd(40, 25) = 5: la cinta tiene 8 trozos de 5 y la final ocupa 5. Con trozos de 1 también encaja, pero la fracción queda sin simplificar.",
"f2.title":"La fracción y lo que falta",
"f2.text":"<p>La fracción es <b>final / inicial</b>, y con los trozos ya sale simplificada. La fracción que se ha ido es <b>lo que falta hasta 1</b>: las dos suman la cinta entera.</p>",
"f2.q":"Si quedan 5/8, la fracción que se ha ido es…",
"f2.o0":"3/8","f2.o1":"5/8","f2.o2":"8/5",
"f2.why":"Queda 5/8 y se han ido los otros 3 trozos de 8: 5/8 + 3/8 = 8/8 = 1.",
"f3.title":"¿Y si la final es mayor?",
"f3.text":"<p>Si la cantidad final es <b>mayor</b> que la inicial, la fracción pasa de 1 (la cinta final es más larga que la inicial). Pruébalo con el caso 30 → 36 o escribe una final mayor que la inicial.</p>",
"f3.tq":"De 30 € pasamos a 36 €. ¿Qué fracción de la inicial es la final? ¿Y qué fracción ha aumentado?",
"f3.th":"36/30 = 6/5: la final es 6/5 de la inicial, es decir, ha aumentado 1/5 (6 €, que es la quinta parte de 30).",

/* ===== càlcul ===== */
const g2=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const r=a%b;a=b;b=r;}return a;};
const fs=(n,d)=>{const g=g2(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d;};
const fr=(n,d,cls)=>'<span class="fr'+(cls?' '+cls:'')+'"><i>'+n+'</i><i>'+d+'</i></span>';
const num=x=>Number.isInteger(x)?String(x):nf(x,2);
let S={mode:'P',Q:40,n:3,d:5,P:24},V={};
function derive(){
  const {mode,Q,n,d,P}=S;
  if(mode==='P'){const each=Q/d,part=each*n;V={each,part,exact:Number.isInteger(each)};}
  else if(mode==='T'){const each=P/n,tot=each*d;V={each,tot,exact:Number.isInteger(each)};}
  else{const g=g2(Q,P)||1;V={g,pq:Q/g,pp:P/g,over:P>Q};}
}

/* ===== controls ===== */
function fillSel(sel,from,to,keep){
  sel.innerHTML='';
  for(let k=from;k<=to;k++){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}
  sel.value=clamp(keep,from,to);
}
function syncControls(){
  fillSel($('#d'),2,12,S.d);fillSel($('#n'),1,S.d,S.n);
  $('#Q').value=S.Q;$('#P').value=S.P;
  $$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===S.mode)));
  const m=S.mode;
  $('#wQ').hidden=m==='T';$('#wP').hidden=m==='P';$('#wF').hidden=m==='F';
  $('#wQ span').textContent=t(m==='F'?'l_Qi':'l_Q');$('#wP span').textContent=t(m==='F'?'l_Pf':'l_P');
}
function readControls(from){
  S.d=+$('#d').value;
  if(from==='d')fillSel($('#n'),1,S.d,+$('#n').value);
  S.n=+$('#n').value;
  S.Q=clamp(Math.round(+$('#Q').value)||1,1,1000);S.P=clamp(Math.round(+$('#P').value)||0,0,3000);
  if(S.mode==='F'&&S.P>3*S.Q)S.P=3*S.Q;
  derive();syncControls();paint();
}
function setCase(mode,Q,n,d,P){
  d=clamp(Math.round(d),2,12);
  const chg=mode!==S.mode;
  S={mode,Q:clamp(Math.round(Q),1,1000),n:clamp(Math.round(n),1,d),d,P:clamp(Math.round(P),0,3000)};
  if(mode==='F'&&S.P>3*S.Q)S.P=3*S.Q;
  derive();syncControls();
  if(chg)setSteps();else paint();
}
const PRE={P:[[40,3,5],[24,2,3],[100,3,4],[200,5,8]],T:[[3,5,24],[2,7,18],[3,4,36],[5,6,250]],F:[[40,25],[24,9],[60,45],[30,36]]};
function buildPresets(){
  const h=$('#presets');h.innerHTML='';
  PRE[S.mode].forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';
    if(S.mode==='P'){b.textContent=p[1]+'/'+p[2]+' '+t('cv_of_')+' '+p[0];b.onclick=()=>setCase('P',p[0],p[1],p[2],S.P);}
    else if(S.mode==='T'){b.textContent=p[0]+'/'+p[1]+' → '+p[2];b.onclick=()=>setCase('T',S.Q,p[0],p[1],p[2]);}
    else{b.textContent=p[0]+' → '+p[1];b.onclick=()=>setCase('F',p[0],S.n,S.d,p[1]);}
    h.appendChild(b);});
}

function ticketHTML(i){
  const {mode,Q,n,d,P}=S;
  let h='';
  if(mode==='P'){
    const {each,part,exact}=V;
    h+='<div class="eq">'+fr(n,d,'cA')+' '+t('cv_of_')+' <b class="cA">'+Q+'</b>'+(i>=2?' = <b class="cG">'+num(part)+'</b>':' = ?')+'</div>';
    if(i===0)h+='<p>'+tt('tk_frac',n,d)+'</p>';
    if(i>=1)h+='<p>'+tt('tk_cut',d,Q,num(each))+'</p>';
    if(i>=2)h+='<p>'+tt('tk_take',n,num(each),num(part))+'</p>';
    if(i===3)h+='<div class="eq">'+Q+' : '+d+' × '+n+' = '+Q+' × '+n+' : '+d+' = <b class="cG">'+num(part)+'</b></div><p class="note">'+t('tk_both')+'</p>';
    if(!exact)h+='<p class="note cW">'+t('tk_dec')+'</p>';
  }else if(mode==='T'){
    const {each,tot}=V;
    h+='<div class="eq">'+fr(n,d,'cA')+' '+t('cv_of_')+' '+(i>=2?'<b class="cG">'+num(tot)+'</b>':'?')+' = <b class="cB">'+P+'</b></div>';
    if(i===0)h+='<p>'+tt('tk_know',n,P,d)+'</p>';
    if(i>=1)h+='<p>'+tt('tk_one',n,P,num(each))+'</p>';
    if(i>=2)h+='<p>'+tt('tk_all',d,num(each),num(tot))+'</p>';
    if(i===3)h+='<p>'+tt('tk_check',n,d,num(tot),num(tot/d*n))+'</p><p class="note">'+tt('tk_inv_note',P,n,d)+'</p>';
  }else{
    const {g,pq,pp,over}=V;
    h+='<div class="eq"><b class="cA">'+Q+'</b> → <b class="cB">'+P+'</b>'+(i>=2?' : '+fr(P,Q)+(g>1?' = '+fr(pp,pq,'cG'):'')+'':'')+'</div>';
    if(i===0)h+='<p>'+tt('tk_if',Q,P)+'</p>';
    if(i>=1)h+='<p>'+(g>1?tt('tk_gcd',Q,P,g,pq,pp):tt('tk_gcd1',Q,P))+'</p>';
    if(i>=2){
      h+='<p>'+t('tk_fr')+' '+fr(P,Q)+(g>1?' = '+fr(P+' ÷ '+g,Q+' ÷ '+g)+' = '+fr(pp,pq,'cG'):'')+(pq===1?' = <b class="cG">'+pp+'</b>':'')+'</p>';
      if(!over)h+='<p>'+t('tk_rest')+' 1 − '+fr(pp,pq)+' = '+fr(pq-pp,pq,'cW')+'</p>';
      else h+='<p>'+t('tk_rest1')+' '+fr(pp,pq)+' − 1 = '+fr(pp-pq,pq,'cW')+'</p>';
    }
  }
  return h;
}

/* ===== dibuix ===== */
const W=640,H=250;
const cv=$('#cv'),ctx=cv.getContext('2d');
function fitCv(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*dpr*H/W);const sc=cv.width/W;ctx.setTransform(sc,0,0,sc,0,0);}
cv.style.aspectRatio=W+'/'+H;new ResizeObserver(fitCv).observe(cv);fitCv();
const ease=x=>x*x*(3-2*x);
const FM='ui-monospace,Menlo,Consolas,monospace';
let ph=0,target=0;
function txt(x,s,px,py,col,size,al){x.font='700 '+(size||18)+'px '+FM;x.fillStyle=col;x.textAlign=al||'left';x.fillText(s,px,py);}
function brace(x,x1,x2,y,col,down){x.strokeStyle=col;x.lineWidth=2;x.beginPath();const s=down?1:-1;x.moveTo(x1,y);x.lineTo(x1,y+7*s);x.lineTo(x2,y+7*s);x.lineTo(x2,y);x.stroke();}
function draw(){
  const c=C(),x=ctx;x.clearRect(0,0,W,H);
  const {mode,Q,n,d,P}=S;
  const X0=40,LW=560,BH=60,Y=92;
  const e1=ease(clamp(ph,0,1)),e2=ease(clamp(ph-1,0,1)),e3=ease(clamp(ph-2,0,1));
  const frame=(w)=>{x.fillStyle=c.panel;x.fillRect(X0,Y,w,BH);x.strokeStyle=c.ink;x.lineWidth=2;x.strokeRect(X0,Y,w,BH);};
  const cuts=(k,w,al,lw)=>{if(k>80)return;x.strokeStyle=c.ink;x.lineWidth=lw||1.5;x.globalAlpha=al;for(let i=1;i<k;i++){x.beginPath();x.moveTo(X0+w*i/k,Y);x.lineTo(X0+w*i/k,Y+BH);x.stroke();}x.globalAlpha=1;};
  if(mode==='P'){
    const {each,part}=V,pw=LW/d;
    frame(LW);
    txt(x,String(Q),X0+LW/2,Y-14,c.pa,20,'center');brace(x,X0,X0+LW,Y-6,c.pa,false);
    if(e2>0){x.globalAlpha=.9*e2;x.fillStyle=c.pb;x.fillRect(X0,Y,pw*n*e2,BH);x.globalAlpha=1;}
    cuts(d,LW,e1,1.5);
    if(e1>.5&&d<=12)for(let i=0;i<d;i++)txt(x,num(each),X0+pw*(i+.5),Y+BH/2+6,i<n&&e2>.5?c.panel:c.muted,d>8?13:15,'center');
    if(e1>.5)txt(x,tt('cv_each',num(each)),X0+LW,Y+BH+22,c.muted,14,'right');
    if(e2>.5){brace(x,X0,X0+pw*n,Y+BH+6,c.pb,true);txt(x,n+'/'+d+' = '+num(part),X0+pw*n/2,Y+BH+36,c.pb,20,'center');}
  }else if(mode==='T'){
    const {each,tot}=V,pw=LW/d;
    frame(LW);
    x.globalAlpha=.9;x.fillStyle=c.pb;x.fillRect(X0,Y,pw*n,BH);x.globalAlpha=1;
    cuts(d,LW,.9,1.5);
    brace(x,X0,X0+pw*n,Y+BH+6,c.pb,true);txt(x,n+'/'+d+' = '+P,X0+pw*n/2,Y+BH+36,c.pb,20,'center');
    if(e1>.5)for(let i=0;i<d;i++){const on=i<n||e2>.5;if(on)txt(x,num(each),X0+pw*(i+.5),Y+BH/2+6,i<n?c.panel:c.ink,d>8?13:15,'center');}
    if(e1>.5)txt(x,tt('cv_each',num(each)),X0+LW,Y+BH+22,c.muted,14,'right');
    brace(x,X0,X0+LW,Y-6,c.pa,false);
    txt(x,e2>.5?String(num(tot)):'?',X0+LW/2,Y-14,e2>.5?c.ok:c.muted,22,'center');
  }else{
    const {g,pq,pp,over}=V,mx=Math.max(Q,P),sc=LW/mx,wq=Q*sc,wp=P*sc;
    frame(wq);
    if(over){x.setLineDash([5,4]);x.strokeStyle=c.pb;x.strokeRect(X0+wq,Y,wp-wq,BH);x.setLineDash([]);}
    x.globalAlpha=.9;x.fillStyle=c.pb;x.fillRect(X0,Y,wp*e1,BH);x.globalAlpha=1;
    const k=Math.round(mx/g);
    if(e2>0)cuts(k,mx*sc,.9*e2,1.5);
    if(e2>.5&&k<=24)for(let i=0;i<k;i++)txt(x,String(g),X0+sc*g*(i+.5),Y+BH/2+6,i<pp?c.panel:c.ink,k>12?12:15,'center');
    brace(x,X0,X0+wq,Y-6,c.pa,false);txt(x,tt('cv_ini',Q),X0+wq/2,Y-14,c.pa,18,'center');
    if(e1>.5){brace(x,X0,X0+wp,Y+BH+6,c.pb,true);txt(x,tt('cv_fin',P)+(e3>.5?'  = '+fs(P,Q):''),X0+wp/2,Y+BH+36,e3>.5?c.ok:c.pb,18,'center');}
    if(e3>.5&&P!==Q){const a=Math.min(wq,wp),b=Math.max(wq,wp);brace(x,X0+a,X0+b,Y+BH+6,c.warn,true);
      txt(x,(over?tt('cv_more',fs(P-Q,Q)):tt('cv_gone',fs(Q-P,Q))),X0+(a+b)/2,Y+BH+36+(b-a<70?22:0),c.warn,15,'center');}
  }
}
function loop(){
  if(ph!==target){const dd=target-ph;ph=REDUCE||Math.abs(dd)<.002?target:ph+Math.sign(dd)*Math.min(Math.abs(dd),.035);}
  draw();requestAnimationFrame(loop);
}

   chk:([n,d])=>!okF(n,d)?RNG:(60*n===45*d?null:{k:'m2_f',p:[n,d,num(60*n/d)]})},
  {id:'m3',f:['l_n'],sim:([k])=>load('F',40,5,8,40-k),ok:()=>({k:'m3_ok'}),
   chk:([k])=>!(isI(k)&&k>=0&&k<=40)?RNG:k!==15?{k:'m3_f',p:[k,40-k]}:null},
  {id:'m4',f:['l_tot'],sim:([Q])=>load('P',Q,5,6,0),ok:([Q])=>({k:'m4_ok',p:[Q]}),
   chk:([Q])=>!(isI(Q)&&Q>=1&&Q<=100)?RNG:Q%12!==0?{k:'m4_f',p:[Q]}:null}
 ],
 S:[
  {id:'s1',ans:'D',f:['l_num','l_den','l_tot'],cxsim:([n,d,Q])=>load('P',Q,Math.min(n,d),d,0),sim:()=>load('P',40,3,5,0),
   cx:([n,d,Q])=>!(isI(n)&&isI(d)&&isI(Q)&&d>=1&&n>=1&&Q>=1)?{k:'s1_cx'}:(n>=d?null:{k:'s1_no',p:[n,d,Q,num(Q*n/d)]})},
  {id:'s2',ans:'S',sim:()=>load('T',40,3,5,24)},
  {id:'s3',ans:'S',sim:()=>load('F',40,3,5,25)},
  {id:'s4',ans:'D',f:['l_a','l_b','l_c','l_d','l_Q1','l_Q2'],cxsim:([a,b,c,d,q1,q2])=>load('P',q2,c,d,0),sim:()=>load('P',20,3,4,0),
   cx:([a,b,c,d,q1,q2])=>!(okF(a,b)&&okF(c,d)&&isI(q1)&&isI(q2)&&q1>=1&&q2>=1)?{k:'s4_cx'}:(a*d<=c*b?{k:'s4_ord'}:(q1*a/b<q2*c/d?null:{k:'s4_no',p:[a,b,q1,num(q1*a/b),c,d,q2,num(q2*c/d)]}))},
  {id:'s5',ans:'M',sim:()=>load('P',30,2,3,0)}
 ],
 E:[{id:'e1',who:1,args:['P',40,3,5,0,2]},{id:'e2',who:1,args:['T',0,2,3,18,2]},{id:'e3',who:1,args:['F',24,0,0,15,2]}],
 D:[
  {id:'d1',f:['d1.l0','d1.l1'],sim:()=>load('P',240,1,4,0,2),ok:()=>({k:'d1_ok'}),
   chk:([r,p])=>r!==60?{k:'d1_r'}:p!==180?{k:'d1_p'}:null},
  {id:'d2',f:['d2.l0','d2.l1'],sim:()=>load('T',0,3,5,600,2),ok:()=>({k:'d2_ok'}),
   chk:([cap,f])=>cap!==1000?{k:'d2_c'}:f!==400?{k:'d2_f'}:null},
  {id:'d3',f:['d3.l0','d3.l1','d3.l2'],sim:()=>load('F',30,0,0,18,2),ok:()=>({k:'d3_ok'}),
   chk:([g,n,d])=>g!==18?{k:'d3_n'}:!(isI(n)&&isI(d)&&d>0&&n*5===3*d)?{k:'d3_f'}:null}
 ]
});
['ca','es'].forEach(l=>{I18N[l].l_a='a';I18N[l].l_b='b';I18N[l].l_c='c';I18N[l].l_d='d';I18N[l].l_Q1=l==='ca'?'Quantitat 1':'Cantidad 1';I18N[l].l_Q2=l==='ca'?'Quantitat 2':'Cantidad 2';});
/* ===== un context, tres preguntes ===== */
const CTX=[
 {id:'c1',Q:30,n:2,d:5,P:12,fin:12},
 {id:'c2',Q:1000,n:3,d:5,P:600,fin:600},
 {id:'c3',Q:80,n:1,d:4,P:20,fin:60},
 {id:'c4',Q:120,n:3,d:4,P:90,fin:90},
 {id:'c5',Q:240,n:5,d:8,P:150,fin:150}
];
const CX={i:0,k:'P',v:{},st:{}};
function cxRender(){
  const c=CTX[CX.i],k=CX.k,key=c.id+k,st=CX.st[key];
  $$('#cxtabs button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===CX.i)));
  let h='<div class="ask">'+['P','T','F'].map(q=>'<button class="opt" type="button" data-k="'+q+'" aria-pressed="'+(q===k)+'">'+t('cx_'+q)+'</button>').join('')+'</div>';
  h+='<p class="enun">'+t(c.id+'.'+k)+'</p><div class="row">';
  const v=CX.v[key]||['',''];
  if(k==='F')h+='<label class="pairin">'+t('cx_fin')+' <input type="text" inputmode="numeric" data-i="0" value="'+v[0]+'" aria-label="'+t('l_num')+'"> / <input type="text" inputmode="numeric" data-i="1" value="'+v[1]+'" aria-label="'+t('l_den')+'"></label>';
  else h+='<label class="pairin"><input type="text" inputmode="decimal" data-i="0" value="'+v[0]+'" aria-label="'+t('ans_ph')+'"></label>';
  h+='<button class="btn primary" type="button" data-act="chk">'+t('check')+'</button><button class="btn" type="button" data-act="sim">'+t('to_sim')+'</button></div>';
  if(st)h+='<p class="msg '+(st.ok?'good':'bad')+'">'+(st.ok?t('cx_ok')+' '+t(c.id+'.e'+k):t('cx_ko')+' '+t('cx_h'+k))+'</p>';
  const box=$('#cxtask');box.className='task'+(st&&st.ok?' done':'');box.innerHTML=h;
  $$('.ask .opt',box).forEach(b=>b.onclick=()=>{CX.k=b.dataset.k;cxRender();});
  const ins=$$('input[data-i]',box);ins.forEach(i=>{i.oninput=()=>{CX.v[key]=ins.map(x=>x.value);};i.onkeydown=e=>{if(e.key==='Enter')go();};});
  const go=()=>{const a=ins.map(x=>parseNum(x.value));let ok;
    if(k==='P')ok=a[0]===c.P;else if(k==='T')ok=a[0]===c.Q;else ok=isI(a[0])&&isI(a[1])&&a[1]>0&&a[0]*c.Q===c.P*a[1];
    if(a.some(x=>!isFinite(x))){CX.st[key]={ok:false};}else CX.st[key]={ok};cxRender();};
  $('[data-act=chk]',box).onclick=go;
  $('[data-act=sim]',box).onclick=()=>{if(k==='P')load('P',c.Q,c.n,c.d,0);else if(k==='T')load('T',0,c.n,c.d,c.P);else load('F',c.Q,0,0,c.fin);};
}
function cxInit(){
  const tb=$('#cxtabs');tb.innerHTML='';
  CTX.forEach((c,j)=>{const b=document.createElement('button');b.type='button';b.textContent=t(c.id+'.n');b.onclick=()=>{CX.i=j;cxRender();};tb.appendChild(b);});
  cxRender();
}
App.hooks.push(cxInit);
const QDATA=[
 {"id":"r1","lvl":"all","type":"num","num":24,"tol":0},
 {"id":"r2","lvl":"all","type":"num","num":27,"tol":0},
 {"id":"r3","lvl":"all","type":"mc","n":4,"ans":0},
 {"id":"r4","lvl":"all","type":"num","num":40,"tol":0},
 {"id":"r5","lvl":"all","type":"mc","n":4,"ans":1},
 {"id":"r6","lvl":"all","type":"mc","n":4,"ans":0},
 {"id":"r7","lvl":"all","type":"num","num":21,"tol":0}
];
initQuiz(QDATA);
initLang();
$$('#modes button').forEach(b=>b.addEventListener('click',()=>{if(S.mode!==b.dataset.m){S.mode=b.dataset.m;derive();syncControls();setSteps();}}));
$('#n').addEventListener('change',()=>readControls());
$('#d').addEventListener('change',()=>readControls('d'));
['Q','P'].forEach(id=>$('#'+id).addEventListener('change',()=>readControls()));
derive();syncControls();applyLang();
document.addEventListener('langchange',()=>{syncControls();buildPresets();paint();});
document.addEventListener('themechange',draw);
setSteps();
requestAnimationFrame(loop);
</script>
