<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lleis de Kepler</title>
<meta name="description" content="Simulador interactiu de les tres lleis de Kepler: òrbites el·líptiques, àrees iguals en temps iguals i la relació T²/a³. Amb activitats per a raonar: missions, afirmacions per a desmuntar i errors d’altres.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@RAONA_CSS@*/
:root{--sun:#d79700;--orbit:#7d879d;--secA:rgba(35,80,200,.09);--secB:rgba(35,80,200,.19);--secNow:rgba(35,80,200,.42);--secEdge:rgba(35,80,200,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sun:#ffc93a;--orbit:#6f7b95;--secA:rgba(118,162,255,.08);--secB:rgba(118,162,255,.17);--secNow:rgba(118,162,255,.40);--secEdge:rgba(118,162,255,.25)}}
.ctls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.ctls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.ctls{grid-template-columns:1fr}}
.ctls fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;align-content:start}
.ctls fieldset:first-child{border-top:1px solid var(--line)}
.ctls legend{float:none;width:auto;padding:0 4px}
.ctls legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:6px 18px;padding:0 4px}
.kc{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem 2.4rem;align-items:center;gap:3px 8px}
.kc label{grid-column:1/-1;font-size:13px}
.kc input[type=range]{width:100%;accent-color:var(--pa);margin:0}
.kc input[type=number]{width:100%;font-family:var(--f-num);font-size:12.5px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--stage);color:var(--ink)}
.kc .unit{font-size:12px;color:var(--muted)}
.kc.b input[type=range]{accent-color:var(--pb)}
.off{opacity:.45}
.simcv .bar{padding:0;border:0}
.legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot.a{background:var(--pa)} .dot.b{background:var(--pb);margin-left:8px}
.clock{margin-left:auto;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.side h3{margin:2px 0 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side dl{font-size:13.5px;gap:3px 10px}
.side .tbl{font-size:13px}
.tbl tr.b td{color:var(--pb)}
.plot canvas{aspect-ratio:560/300}
</style>
<!--@GC@-->
</head>

<div class="page">

    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="simgrid">
<div class="simcv">
<div class="bar">
<button id="play" class="btn primary" type="button" data-i18n="pause"></button>
<button id="reset" class="btn" type="button" data-i18n="reset"></button>
<span class="legend"><i class="dot a"></i><span data-i18n="plA"></span><span id="legB"><i class="dot b"></i><span data-i18n="plB"></span></span></span>
<span class="clock" id="clock"></span>
</div>

<div class="ctls">
<fieldset><legend><span class="sw" style="background:var(--pa)"></span><span data-i18n="plA"></span></legend>
<div class="chips" id="presets"></div>
<div id="ctlA" style="display:grid;gap:8px"></div></fieldset>
<fieldset><legend><span class="sw" style="background:var(--pb)"></span><span data-i18n="fsB"></span></legend>
<label class="check"><input type="checkbox" id="showB" checked><span data-i18n="showB"></span></label>
<div id="ctlB" style="display:grid;gap:8px"></div></fieldset>
<fieldset><legend data-i18n="fsS"></legend>
<div id="ctlS" style="display:grid;gap:8px"></div></fieldset>
<div class="checks">
<label class="check"><input type="checkbox" id="l1" checked><span data-i18n="c_l1"></span></label>
<label class="check"><input type="checkbox" id="l2" checked><span data-i18n="c_l2"></span></label>
<label class="check"><input type="checkbox" id="vel" checked><span data-i18n="c_vel"></span></label>
</div>
</div>
</div>
<div class="side">
<h3 data-i18n="h_l1"></h3>
<dl>
<dt data-i18n="o_r"></dt><dd id="o-r"></dd>
<dt data-i18n="o_r2"></dt><dd id="o-r2"></dd>
<dt data-i18n="o_sum"></dt><dd id="o-sum" class="hl"></dd>
<dt data-i18n="o_2a"></dt><dd id="o-2a"></dd>
<dt data-i18n="o_rp"></dt><dd id="o-rp"></dd>
<dt data-i18n="o_ra"></dt><dd id="o-ra"></dd>
</dl>
<h3 data-i18n="h_l2"></h3>
<dl>
<dt data-i18n="o_dt"></dt><dd id="o-dt"></dd>
<dt data-i18n="o_area"></dt><dd id="o-area"></dd>
<dt data-i18n="o_v"></dt><dd id="o-v" class="hl"></dd>
<dt data-i18n="o_vp"></dt><dd id="o-vp"></dd>
<dt data-i18n="o_va"></dt><dd id="o-va"></dd>
<dt data-i18n-html="o_ratio"></dt><dd id="o-ratio"></dd>
</dl>
<h3 data-i18n="h_l3"></h3>
<table class="tbl">
<thead><tr><th></th><th data-i18n="th_a"></th><th data-i18n="th_T"></th><th data-i18n="th_k"></th></tr></thead>
<tbody>
<tr><td data-i18n="plA"></td><td id="t-aA"></td><td id="t-TA"></td><td id="t-kA"></td></tr>
<tr class="b" id="rowB"><td data-i18n="plB"></td><td id="t-aB"></td><td id="t-TB"></td><td id="t-kB"></td></tr>
</tbody>
</table>
<p class="note" data-i18n-html="note_class"></p>
</div>
</div>
</section>

<section class="cards">
<article class="card"><h2><small data-i18n="law1_k"></small><span data-i18n="law1_t"></span></h2><p data-i18n-html="law1_p"></p></article>
<article class="card"><h2><small data-i18n="law2_k"></small><span data-i18n="law2_t"></span></h2><p data-i18n-html="law2_p"></p></article>
<article class="card"><h2><small data-i18n="law3_k"></small><span data-i18n="law3_t"></span></h2><p data-i18n-html="law3_p"></p>
<div class="seg" role="group" data-i18n-aria="p_aria" aria-label="">
<button type="button" id="pLog" aria-pressed="true" data-i18n="p_log"></button>
<button type="button" id="pLin" aria-pressed="false" data-i18n="p_lin"></button>
</div>
<div class="plot"><canvas id="pv" role="img" data-i18n-aria="aria.pv" aria-label=""></canvas></div>
<p class="note" data-i18n="note_pl"></p></article>
</section>

<!--@RAONA@-->
  </main>
  <!--@FOOTER@-->
</div>

function solveE(M,e){
  let E=e<0.8?M:Math.PI;
  for(let i=0;i<40;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-12)break;}

      ctx.closePath();ctx.fillStyle=col;ctx.fill();};
    for(let i=0;i<N;i++)sector(i*d,(i+1)*d,i%2?K.secB:K.secA);
    sector(k*d,A.m,K.secNow);
    ctx.strokeStyle=K.secEdge;ctx.lineWidth=1;
    for(let i=0;i<N;i++){const q=pos(A,i*d);ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(q.x),Y(q.y));ctx.stroke();}
  }
  for(const p of ps){const b=p.a*Math.sqrt(1-p.e*p.e);
    ctx.beginPath();ctx.ellipse(X(-p.a*p.e),OY,p.a*S,b*S,0,0,TAU);
    ctx.strokeStyle=p===A?K.pa:K.pb;ctx.globalAlpha=p===A?0.9:0.7;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
  const qA=pos(A,A.m);
  if(state.show.l1){
    const fx=-2*A.a*A.e;
    ctx.setLineDash([4,5]);ctx.strokeStyle=K.orbit;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(X(-A.a*(1+A.e)),OY);ctx.lineTo(X(A.a*(1-A.e)),OY);ctx.stroke();ctx.setLineDash([]);
    ctx.lineWidth=1.8;ctx.strokeStyle=K.ink;ctx.globalAlpha=.55;
    ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(qA.x),Y(qA.y));ctx.moveTo(X(fx),OY);ctx.lineTo(X(qA.x),Y(qA.y));ctx.stroke();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(X(fx),OY,5,0,TAU);ctx.fillStyle=K.stage;ctx.fill();ctx.strokeStyle=K.ink;ctx.lineWidth=1.8;ctx.stroke();
    label(ctx,'F′',X(fx),OY+19,K.muted,'center');
    label(ctx,'F',X(0),OY+22,K.muted,'center');
    label(ctx,'r',X(qA.x/2)+10,Y(qA.y/2)-10,K.ink);
    label(ctx,'r′',(X(fx)+X(qA.x))/2+10,(OY+Y(qA.y))/2-10,K.ink);
    if(A.e>0.02){
      label(ctx,t('perih'),X(A.a*(1-A.e))+8,OY-13,K.muted);
      label(ctx,t('afel'),X(-A.a*(1+A.e))-8,OY-13,K.muted,'right');
    }
  }
  const sx=X(0),sy=Y(0),gr=ctx.createRadialGradient(sx,sy,0,sx,sy,28);
  gr.addColorStop(0,K.sun);gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=.45;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(sx,sy,28,0,TAU);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=K.sun;ctx.beginPath();ctx.arc(sx,sy,10,0,TAU);ctx.fill();
  for(const p of ps){
    const q=p===A?qA:pos(p,p.m),col=p===A?K.pa:K.pb,px=X(q.x),py=Y(q.y);
    if(state.show.vel){const vp=speedAt(p,p.a*(1-p.e)),L=0.35*p.a*S/vp;arrow(ctx,px,py,px+q.vx*L,py-q.vy*L,col);}
    ctx.beginPath();ctx.arc(px,py,8,0,TAU);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=K.stage;ctx.stroke();
    label(ctx,p===A?'A':'B',px+12,py+15,col,'left',17);
  }
  const sc=niceStep(100/S);
  ctx.strokeStyle=K.muted;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(18,h-20);ctx.lineTo(18+sc*S,h-20);
  ctx.moveTo(18,h-25);ctx.lineTo(18,h-15);ctx.moveTo(18+sc*S,h-25);ctx.lineTo(18+sc*S,h-15);ctx.stroke();
  label(ctx,fmtTick(sc)+' UA',18+sc*S+8,h-20,K.muted);
}

/* ---------- 3a llei ---------- */
function drawPlot(){
  const w=PW,h=PH,g=pctx;
  g.fillStyle=K.panel;g.fillRect(0,0,w,h);
  const L=58,R=12,T=10,Bm=44,pw=w-L-R,ph=h-T-Bm;
  const ps=[[A,K.pa,'A']];if(state.show.b)ps.push([B,K.pb,'B']);
  g.font='14px '+K['f-body'];g.lineWidth=1;
  let px,py,xs=[],ys=[],xl,yl,line,P,inRange=null;
  if(state.plot==='log'){
    const x0=-1,x1=2,y0=-2,y1=4;
    px=a=>L+(Math.log10(a)-x0)/(x1-x0)*pw;py=tt_=>T+(y1-Math.log10(tt_))/(y1-y0)*ph;
    for(let i=x0;i<=x1;i++)xs.push([Math.pow(10,i),['0,1','1','10','100'][i-x0]]);
    for(let i=y0;i<=y1;i++)ys.push([Math.pow(10,i),['0,01','0,1','1','10','100','1000','10⁴'][i-y0]]);
    xl=t('ax_a');yl=t('ax_T');
    line=M=>{const pts=[];for(let i=0;i<=40;i++){const a=Math.pow(10,x0+(x1-x0)*i/40);pts.push([px(a),py(Math.pow(a,1.5)/Math.sqrt(M))]);}return pts;};
    P=(a,M)=>[px(a),py(Math.pow(a,1.5)/Math.sqrt(M))];
  }else{
    let mx=1.5;for(const [p] of ps)mx=Math.max(mx,1.15*p.a**3);
    const st=niceStep(mx/4);mx=Math.ceil(mx/st)*st;
    let my=mx*Math.max(1,1/state.M);const sty=niceStep(my/4);my=Math.ceil(my/sty)*sty;
    px=x=>L+x/mx*pw;py=y=>T+(1-y/my)*ph;
    for(let v=0;v<=mx+1e-9;v+=st)xs.push([v,fmtTick(v)]);
    for(let v=0;v<=my+1e-9;v+=sty)ys.push([v,fmtTick(v)]);
    xl=t('ax_a3');yl=t('ax_T2');
    line=M=>[[px(0),py(0)],[px(mx),py(mx/M)]];
    P=(a,M)=>[px(a**3),py(a**3/M)];
    inRange=a=>a**3<=mx;
  }
  g.strokeStyle=K.line;g.fillStyle=K.muted;
  for(const [v,tx] of xs){const x=px(v);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.textAlign='center';g.textBaseline='top';g.fillText(tx,x,T+ph+5);}
  for(const [v,tx] of ys){const y=py(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.textAlign='right';g.textBaseline='middle';g.fillText(tx,L-6,y);}
  g.textAlign='center';g.textBaseline='bottom';g.fillText(xl,L+pw/2,h-1);
  g.save();g.translate(13,T+ph/2);g.rotate(-Math.PI/2);g.textBaseline='middle';g.fillText(yl,0,0);g.restore();
  g.save();g.beginPath();g.rect(L,T,pw,ph);g.clip();
  const drawLine=(pts,col,dash)=>{g.setLineDash(dash);g.strokeStyle=col;g.lineWidth=2;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.setLineDash([]);};
  if(Math.abs(state.M-1)>1e-6)drawLine(line(1),K.muted,[4,4]);
  drawLine(line(state.M),K.ink,[]);
  for(const [n,a] of SOLAR){if(inRange&&!inRange(a))continue;const [x,y]=P(a,1);
    g.fillStyle=K.muted;g.beginPath();g.arc(x,y,3.5,0,TAU);g.fill();g.textAlign='left';g.textBaseline='bottom';g.fillText(n,x+5,y-2);}
  for(const [p,col,n] of ps){const [x,y]=P(p.a,state.M);
    g.fillStyle=col;g.beginPath();g.arc(x,y,6.5,0,TAU);g.fill();g.strokeStyle=K.panel;g.lineWidth=1.5;g.stroke();
    g.font='bold 15px '+K['f-body'];g.textAlign='right';g.textBaseline='top';g.fillText(n,x-7,y+4);g.font='14px '+K['f-body'];}
  g.restore();
}

/* ---------- lectures ---------- */
let out={};
function put(id,v){if(out[id]!==v){out[id]=v;G(id).textContent=v;}}
function readouts(){
  const q=pos(A,A.m),fx=-2*A.a*A.e,r2=Math.hypot(q.x-fx,q.y),b=A.a*Math.sqrt(1-A.e*A.e),T=period(A.a);
  const rp=A.a*(1-A.e),ra=A.a*(1+A.e),U=' '+t('u_yr');
  put('o-r',fmt(q.r,3)+' UA');put('o-r2',fmt(r2,3)+' UA');put('o-sum',fmt(q.r+r2,3)+' UA');put('o-2a',fmt(2*A.a,3)+' UA');
  put('o-rp',fmt(rp,3)+' UA');put('o-ra',fmt(ra,3)+' UA');
  const dtS=T/state.N;put('o-dt',dtS<1?fmt(dtS*DAY,1)+' '+t('u_d'):fmt(dtS,2)+U);
  put('o-area',fmt(Math.PI*A.a*b/state.N,4)+' UA²');
  put('o-v',fmt(speedAt(A,q.r)*KMS,1)+' km/s');put('o-vp',fmt(speedAt(A,rp)*KMS,1)+' km/s');put('o-va',fmt(speedAt(A,ra)*KMS,1)+' km/s');
  put('o-ratio',fmt(ra/rp,2));
  put('t-aA',fmt(A.a,3));put('t-TA',fmt(T,3));put('t-kA',fmt(T*T/A.a**3,3));
  const TB=period(B.a);put('t-aB',fmt(B.a,3));put('t-TB',fmt(TB,3));put('t-kB',fmt(TB*TB/B.a**3,3));
  put('clock',t('clock',{0:fmt(state.t,2)}));
}

/* ---------- bucle ---------- */
let last=performance.now(),tick=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state.playing){const dy=dt*state.speed;state.t+=dy;
    for(const p of [A,B])p.m=(p.m+TAU*dy/period(p.a))%TAU;}
  if(tick++%30===0)colors();
  draw();drawPlot();readouts();
  requestAnimationFrame(frame);
}
colors();syncB();
document.addEventListener('themechange',colors);
try{new MutationObserver(colors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
App.hooks.push(()=>{setPlay();out={};});

/* ===== Raona-ho ===== */
function load(o){
  o=o||{};
  A.a=clamp(o.a||1.5,.2,50);A.e=clamp(o.e||0,0,.97);A.m=0;
  const hasB=!!o.b;
  if(hasB){B.a=clamp(o.b.a,.2,50);B.e=clamp(o.b.e||0,0,.97);B.m=0;}
  state.show.b=hasB;G('showB').checked=hasB;
  state.show.l1=state.show.l2=state.show.vel=true;['l1','l2','vel'].forEach(k=>{G(k).checked=true;});
  state.M=clamp(o.M||1,.1,5);state.t=0;
  aA.set(A.a);eA.set(A.e);aB.set(B.a);eB.set(B.e);mS.set(state.M);
  state.speed=clamp(period(A.a)/6,.01,50);sp.set(state.speed);
  state.playing=!!o.run;setPlay();syncB();view.s=0;
  RZ.show(G('cv'));
}

 sim:([o])=>load(o),
 M:[

  {id:'m2',f:[{l:'f_M',u:'M☉'}],sim:([m])=>load({a:1,e:0,M:m||1,run:true}),ok:()=>({k:'m2_ok'}),
   chk:([m])=>!okM(m)?{k:'rng'}:Math.abs(m-4)<.005?null:{k:m<4?'m2_poc':'m2_mes',p:[fn(m,2),fn(1/Math.sqrt(m),2)]}},
  {id:'m3',f:[FE],sim:([e])=>load({a:2,e:e||0}),ok:()=>({k:'m3_ok'}),
   chk:([e])=>!okE(e)?{k:'rng'}:Math.abs(e-.75)<.0005?null:{k:'m3_f',p:[fe(e),fn(2*(1-e),3),fn(2*(1+e),3)]}},
  {id:'m4',f:[FE],sim:([e])=>load({a:2,e:e||0,run:true}),ok:()=>({k:'m4_ok'}),
   chk:([e])=>!okE(e)?{k:'rng'}:Math.abs(e-.5)<.0005?null:{k:'m4_f',p:[fe(e),fn((1+e)/(1-e),2)]}}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>load({a:1.5,e:.7,run:true})},
  {id:'s2',ans:'S',sim:()=>load({a:1.5,e:.7,b:{a:4,e:.1},run:true})},
  {id:'s3',ans:'D',f:[{l:'f_eB'}],sim:()=>load({a:2,e:.2,b:{a:2,e:.2}}),
   cxsim:([e])=>load({a:2,e:.2,b:{a:2,e:okE(e)?e:.2},run:true}),
   cxok:([e])=>({k:'s3_cx',p:[fe(e),fn(Math.pow(2,1.5),2)]}),
   cx:([e])=>!okE(e)?{k:'rng'}:Math.abs(e-.2)<.1?{k:'s3_cx_igual',p:[fe(e)]}:null},
  {id:'s4',ans:'M',sim:()=>load({a:2,e:.05,b:{a:2,e:.8},run:true})},
  {id:'s5',ans:'S',sim:()=>load({a:1,e:.2,b:{a:4,e:.2},run:true})},
  {id:'s6',ans:'D',f:[{l:'f_M',u:'M☉'}],sim:()=>load({a:1,e:0,M:1,run:true}),
   cxsim:([m])=>load({a:1,e:0,M:okM(m)?m:1,run:true}),
   cxok:([m])=>({k:'s6_cx',p:[fn(m,2),fn(1/Math.sqrt(m),2)]}),
   cx:([m])=>!okM(m)?{k:'rng'}:Math.abs(m-1)<.05?{k:'s6_cx_sol'}:null}
 ],
 E:[{id:'e1',who:1,args:[{a:1,e:.1,b:{a:4,e:.1},run:true}]},
    {id:'e2',who:0,args:[{a:1.5,e:.7,run:true}]},
    {id:'e3',who:3,args:[{a:1,e:0,M:4,run:true}]}],
 D:[
  {id:'d1',chips:{vals:[.25,.5,1,2],fmt:x=>fn(x,2)+' M☉'},f:[{l:'d1.l0',u:'UA/any'}],
   sim:([p])=>load({a:1,e:0,M:p||.25,run:true}),ok:()=>({k:'d1_ok'}),
   chk:([p,v])=>p!==.25?{k:'d1_f',p:[fn(p,2),fn(1/Math.sqrt(p),2)]}:Math.abs(v-Math.PI)>.05?{k:'d1_v'}:null},
  {id:'d2',chips:{vals:[3,5.5,8,10.5],fmt:x=>fn(x,2)+' UA'},f:[{l:'d2.l0',u:'anys'}],
   sim:([p])=>load({a:p||5.5,e:p?1-.5/p:10/11,run:true}),ok:()=>({k:'d2_ok'}),
   chk:([p,T])=>p!==5.5?{k:'d2_f',p:[fn(p,2),fn(2*p,2)]}:Math.abs(T-12.9)>.15?{k:'d2_T'}:null}
 ]
});
initQuiz([]);
initLang();applyLang();
requestAnimationFrame(frame);
