/* ===== Escala de Richter ===== */

const REAL=[
 {n:{va:`Lorca 2011`,es:`Lorca 2011`},m:5.1},
 {n:{va:`L’Aquila 2009`,es:`L’Aquila 2009`},m:6.3},
 {n:{va:`Haití 2010`,es:`Haití 2010`},m:7.0},
 {n:{va:`Turquia–Síria 2023`,es:`Turquía–Siria 2023`},m:7.8},
 {n:{va:`Tohoku (Japó) 2011`,es:`Tohoku (Japón) 2011`},m:9.1},
 {n:{va:`Xile 1960`,es:`Chile 1960`},m:9.5}
];
const HIRO=6.28e13;
const fmtD=x=>nf(x,2);
const E=m=>Math.pow(10,1.5*m+4.8);
const mA=$('#mA'),mB=$('#mB'),sc=fitCanvas($('#seis'),900,340),sq=fitCanvas($('#sq'),300,283);

function fillPresets(){['preA','preB'].forEach(id=>{const s=$('#'+id);const cur=s.value;
  s.innerHTML='<option value="">'+t('custom')+'</option>'+REAL.map((r,i)=>'<option value="'+i+'">'+L(r.n)+' · '+nf(r.m,1)+'</option>').join('');s.value=cur;});}
['A','B'].forEach(k=>{const s=$('#pre'+k),m=k==='A'?mA:mB;
  s.onchange=()=>{if(s.value!==''){m.value=REAL[+s.value].m;upd();}};
  m.addEventListener('input',()=>{s.value='';upd();});});

function upd(){
  const a=+mA.value,b=+mB.value;
  $('#mAv').textContent=nf(a,1);$('#mBv').textContent=nf(b,1);
  const d=Math.round(Math.abs(b-a)*10)/10,strong=b>=a?'B':'A',weak=b>=a?'A':'B';
  const amp=Math.pow(10,d),en=Math.pow(10,1.5*d);
  $('#cmp').innerHTML=d<0.05?t('same'):tt('cmp',strong,weak,fmtN(amp),fmtN(en));
  $('#sAmp').innerHTML='×'+fmtN(amp);$('#sEn').innerHTML='×'+fmtN(en);
  $('#sEA').innerHTML=fmtN(E(a))+' J';$('#sEB').innerHTML=fmtN(E(b))+' J';
  $('#sHA').innerHTML=fmtN(E(a)/HIRO);$('#sHB').innerHTML=fmtN(E(b)/HIRO);
  $('#advcalc').innerHTML=tt('advcalc',nf(d,1),fmtN(amp),fmtN(en));
}
App.hooks.push(()=>{fillPresets();upd();});

/* --- animación --- */
let t0=-99,head=0;const NS=450,bA=new Float32Array(NS),bB=new Float32Array(NS);
$('#shake').onclick=()=>{t0=performance.now()/1000;};
const env=tt=>tt<0.2?0:tt<1.0?0.22:tt<1.4?0.22+0.78*(tt-1.0)/0.4:Math.exp(-(tt-1.4)/2.2);

function trace(buf,cy,amp,color){
  sc.beginPath();
  for(let i=0;i<NS;i++){const v=buf[(head+i)%NS];const x=i*900/(NS-1);const y=cy-v*amp-(Math.random()-.5)*1.2;i?sc.lineTo(x,y):sc.moveTo(x,y);}
  sc.strokeStyle=color;sc.lineWidth=1.6;sc.stroke();
}
function draw(e){
  const a=+mA.value,b=+mB.value,mx=Math.max(a,b),ink=css('--ink'),mut=css('--mut'),c1=css('--acc'),c2=css('--acc2'),cv=css('--cv');
  sc.fillStyle=cv;sc.fillRect(0,0,900,340);
  [85,255].forEach(y=>{sc.strokeStyle=mut;sc.globalAlpha=.3;sc.beginPath();sc.moveTo(0,y);sc.lineTo(900,y);sc.stroke();sc.globalAlpha=1;});
  trace(bA,85,62*Math.pow(10,a-mx),c1);trace(bB,255,62*Math.pow(10,b-mx),c2);
  sc.fillStyle=ink;sc.font='bold 15px system-ui';
  sc.fillText('A · M '+nf(a,1),10,22);sc.fillText('B · M '+nf(b,1),10,192);
  /* cuadrados de energía */
  sq.fillStyle=cv;sq.fillRect(0,0,300,283);
  const d=Math.abs(b-a),big=130,small=big*Math.pow(10,-0.75*d);
  const sA=a>=b?big:small,sB=b>=a?big:small,j=e*3;
  sq.fillStyle=c1;sq.fillRect(10+(Math.random()-.5)*j,255-sA+(Math.random()-.5)*j,sA,sA);
  sq.fillStyle=c2;sq.fillRect(160+(Math.random()-.5)*j,255-sB+(Math.random()-.5)*j,sB,sB);
  sq.fillStyle=ink;sq.font='bold 15px system-ui';sq.fillText('A',10,277);sq.fillText('B',160,277);
}
function loop(){
  const now=performance.now()/1000,e=env(now-t0);
  bA[head]=e*(0.6*Math.sin(now*43)+0.35*Math.sin(now*97+1)+0.55*(Math.random()-.5));
  bB[head]=e*(0.6*Math.sin(now*39+2)+0.35*Math.sin(now*89)+0.55*(Math.random()-.5));
  head=(head+1)%NS;draw(e);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== Raona-ho ===== */
function load(a,b){if(a!=null)mA.value=a;if(b!=null)mB.value=b;$('#preA').value='';$('#preB').value='';upd();$('#shake').click();RZ.show($('#seis'));}
const rg=f=>(v,r)=>v.every(x=>x>=1&&x<=9.5)?f(v,r):{k:'rng'};
const dM=(a,b)=>Math.round((b-a)*10)/10;
const ampR=d=>fmtN(Math.pow(10,d)), enR=d=>fmtN(Math.pow(10,1.5*d));

  {id:'m2',f:['a','b'],sim:([a,b])=>load(a,b),ok:()=>({k:'m2_ok'}),
   chk:rg(([a,b])=>dM(a,b)===2?null:{k:'m2_f',p:[fmtD(a),fmtD(b),ampR(b-a),enR(b-a)]})},
  {id:'m3',f:['b'],sim:([b])=>load(7,b),ok:()=>({k:'m3_ok'}),
   chk:rg(([b])=>Math.abs(b-6.8)<=0.06?null:{k:'m3_f',p:[fmtD(b),enR(b-7)]})},
  {id:'m4',f:['m'],sim:([b])=>load(null,b),ok:()=>({k:'m4_ok'}),
   chk:rg(([b])=>Math.abs(b-8)<=0.1?null:{k:'m4_f',p:[fmtD(b),fmtN(E(b)/HIRO)]})}
 ],
 S:[
  {id:'s1',ans:'M',sim:()=>load(4,8)},
  {id:'s2',ans:'S',sim:()=>load(3,4)},
  {id:'s3',ans:'M',sim:()=>load(5,6)},
  {id:'s4',ans:'S',sim:()=>load(4,6)},
  {id:'s5',ans:'D',f:['a','b'],cxsim:([a,b])=>load(a,b),
   cxok:([a,b])=>({k:'s5.cx',p:[fmtD(a),fmtD(b),ampR(b-a)]}),
   cx:rg(([a,b])=>b-a<=1e-9?{k:'s_ord'}:b-a<1-1e-9?null:{k:'s_cx_no',p:[fmtD(a),fmtD(b),ampR(b-a)]})},
  {id:'s6',ans:'M',sim:()=>load(6,6.2)}
 ],
 E:[{id:'e1',who:1,args:[6,7]},{id:'e2',who:0,args:[4,8]},{id:'e3',who:3,args:[5,7]}],
 D:[
  {id:'d1',chips:{vals:[6.3,7,7.8,9.1],fmt:x=>L(REAL.find(r=>r.m===x).n)+' · '+nf(x,1)},sim:([p])=>load(5.1,p),ok:()=>({k:'d1_ok'}),
   chk:([p])=>p===7?null:{k:'d1_no',p:()=>[L(REAL.find(r=>r.m===p).n),enR(p-5.1)]}},
  {id:'d2',f:[{l:'d2.l0'}],sim:()=>load(6,8),ok:()=>({k:'d2_ok'}),
   chk:([n])=>n>=0.8&&n<=1.2?null:{k:'d2_f'}},
  {id:'d3',f:[{l:'d3.l0'}],sim:([b])=>load(2,b),ok:()=>({k:'d3_ok'}),
   chk:([b])=>b>=100?{k:'d3_add'}:Math.abs(b-5)<=0.05?null:{k:'d3_f',p:[fmtD(b),ampR(b-2)]}}
 ]
});

initQuiz(QDATA);
initLang();applyLang();
