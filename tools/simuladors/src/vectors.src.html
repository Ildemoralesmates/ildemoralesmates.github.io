<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratori de vectors 3D</title>
<meta name="description" content="Vectors per a 2n de Batxillerat: comença en el pla amb una base no ortogonal (coordenades d'un vector en una base) i passa a l'espai; gira l'escena 3D i construeix pas a pas la combinació lineal (base i dependència lineal), el producte escalar (angle i projecció), el vectorial (àrea i regla de la mà dreta) i el mixt (volum del paral·lelepípede). Amb activitats per a raonar i test autocorregit.">
<meta name="author" content="Ilde">
<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
:root{--l3:#8a3bb4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--l3:#c78bf3}}
.simcv canvas{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--stage);touch-action:none;cursor:grab}
.simcv canvas:active{cursor:grabbing}
.simcv canvas:focus-visible{outline:2px solid var(--pa);outline-offset:2px}
.lbl{font-size:13.5px;color:var(--muted)}
.vt{border-collapse:collapse;font-size:14px;justify-self:start}
.vt th{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px 3px;text-align:center}
.vt td{padding:1px 3px}
.vt td:first-child{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:18px;padding-right:8px}
.vt input{font:inherit;font-family:var(--f-num);font-size:14px;width:4.2em;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-align:right}
.ca{color:var(--pa)}.cb{color:var(--pb)}.cc{color:var(--ok)}.cd{color:var(--l3)}.cw{color:var(--warn)}
.sh{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cap{margin:0;font-size:14.5px;color:var(--ink);line-height:1.45}
.ticket{font-family:var(--f-num);font-size:13.5px;line-height:1.75;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px 11px;color:var(--ink);overflow-x:auto}
.ticket:empty{display:none}
.ticket b{font-weight:700}
.ticket .txt{font-family:var(--f-body);font-size:13.5px;line-height:1.45;display:block;margin:1px 0 3px}
.ticket i{font-family:var(--f-display);font-weight:700}
.det{display:inline-grid;grid-template-columns:repeat(3,auto);gap:0 .75em;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:0 .45em;vertical-align:middle;text-align:right;line-height:1.35;margin:2px 0}
.predq{display:grid;gap:6px;background:var(--panel);border:1px solid var(--pa);border-radius:8px;padding:8px 10px}
.predq p{margin:0;font-size:14px;color:var(--ink);font-weight:600}
.predq .msg{font-weight:600;font-size:13.5px}
.predq .msg.good{color:var(--ok)}.predq .msg.bad{color:var(--warn)}
.coefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px}
.coefs .sh{grid-column:1/-1}
.coefs .ctl label{font-size:12.5px}
.coefs[hidden]{display:none}
.tabs button{font-size:14px}
.vt.two .cz{display:none}
.ci{color:var(--ink)}
.check[hidden]{display:none}
.ticket sub{font-size:.75em}
</style>
<!--@GC@-->
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="topr">
      <!--@LANGSW@-->
      <p class="lede" data-i18n="lede"></p>
    </div>
  </header>

  <main style="display:grid;gap:16px">
<section class="card">
<div class="row"><div class="seg tabs" id="modesw" role="group" data-i18n-aria="aria.mode" aria-label=""><button type="button" data-m="intro" aria-pressed="true" data-i18n="mode_intro"></button><button type="button" data-m="comb" aria-pressed="false" data-i18n="mode_comb"></button><button type="button" data-m="dot" aria-pressed="false" data-i18n="mode_dot"></button><button type="button" data-m="cross" aria-pressed="false" data-i18n="mode_cross"></button><button type="button" data-m="mix" aria-pressed="false" data-i18n="mode_mix"></button></div>
<span class="lbl" data-i18n="presets"></span><div class="chips" id="presets"></div></div>
<div class="simgrid">
<div class="simcv">
<canvas id="cv" tabindex="0" role="img" data-i18n-aria="aria.cv" aria-label=""></canvas>
<div class="row"><button class="btn primary" id="next" type="button"></button><button class="btn" id="all" type="button" data-i18n="btn_all"></button><button class="btn" id="restart" type="button" data-i18n="btn_restart"></button><button class="btn" id="swap" type="button" data-i18n="btn_swap" hidden></button><label class="check"><input type="checkbox" id="auto"><span data-i18n="c_auto"></span></label><label class="check"><input type="checkbox" id="ref" checked><span data-i18n="c_ref"></span></label><button class="btn" id="view" type="button" data-i18n="btn_view"></button></div>
</div>
<div class="side">
<p class="sh" data-i18n="s_vecs"></p>
<table class="vt">
<thead><tr><th></th><th>x</th><th>y</th><th class="cz">z</th></tr></thead>
<tbody>
<tr id="rowu"><td class="ca">u</td><td><input type="number" step="0.5" min="-9" max="9" id="u0" aria-label="u₁"></td><td><input type="number" step="0.5" min="-9" max="9" id="u1" aria-label="u₂"></td><td class="cz"><input type="number" step="0.5" min="-9" max="9" id="u2" aria-label="u₃"></td></tr>
<tr id="rowv"><td class="cb">v</td><td><input type="number" step="0.5" min="-9" max="9" id="v0" aria-label="v₁"></td><td><input type="number" step="0.5" min="-9" max="9" id="v1" aria-label="v₂"></td><td class="cz"><input type="number" step="0.5" min="-9" max="9" id="v2" aria-label="v₃"></td></tr>
<tr id="roww"><td class="cc">w</td><td><input type="number" step="0.5" min="-9" max="9" id="w0" aria-label="w₁"></td><td><input type="number" step="0.5" min="-9" max="9" id="w1" aria-label="w₂"></td><td class="cz"><input type="number" step="0.5" min="-9" max="9" id="w2" aria-label="w₃"></td></tr>
<tr id="rowr" hidden><td class="ci">r</td><td><input type="number" step="0.5" min="-9" max="9" id="r0" aria-label="r₁"></td><td><input type="number" step="0.5" min="-9" max="9" id="r1" aria-label="r₂"></td><td class="cz"></td></tr>
</tbody>
</table>
<div class="coefs" id="coefs"></div>
<p class="sh" id="stepn"></p>
<p class="cap" id="cap" aria-live="polite"></p>
<div id="pred"></div>
<div class="ticket" id="calc"></div>
</div>
</div>
<div class="idea" id="idea_intro" data-i18n-html="idea_intro"></div>
<div class="idea" id="idea_comb" data-i18n-html="idea_comb" hidden></div>
<div class="idea" id="idea_dot" data-i18n-html="idea_dot" hidden></div>
<div class="idea" id="idea_cross" data-i18n-html="idea_cross" hidden></div>
<div class="idea" id="idea_mix" data-i18n-html="idea_mix" hidden></div>
</section>

<!--@RAONA@-->

<!--@QUIZ@-->
  </main>
  <!--@FOOTER@-->
</div>

"pc_area":"Àrea","pc_h":"Altura h","fn_sin":"sin",
"ps_c1":"Base canònica i, j, k","ps_c2":"Base no ortogonal","ps_c3":"Coplanaris: w = u + v","ps_c4":"Dos paral·lels",
"ps_d1":"Angle agut","ps_d2":"Perpendiculars","ps_d3":"Angle obtús","ps_d4":"Paral·lels",
"ps_x1":"i × j","ps_x2":"Cas general","ps_x3":"Gairebé paral·lels","ps_x4":"Paral·lels",
"ps_m1":"Cub unitat","ps_m2":"Cas general","ps_m3":"Orientació negativa","ps_m4":"Coplanaris",
"idea_comb":"<b>La idea:</b> tres vectors de ℝ³ formen una base quan cap d'ells és combinació lineal dels altres. Per a comprovar-ho n'hi ha prou amb el determinant: det(<b>u</b>, <b>v</b>, <b>w</b>) ≠ 0. Si val 0, el rang és 2 o menys i les combinacions no ixen d'un pla (o d'una recta), per molt que canvies a, b i c.",
"idea_dot":"<b>La idea:</b> <b>u</b>·<b>v</b> = |<b>u</b>|·|<b>v</b>|·cos θ mesura quant «empeny» <b>u</b> en la direcció de <b>v</b>. En Física és el treball, W = <b>F</b>·<b>d</b>. El signe diu si l'angle és agut, recte o obtús, i <b>u</b>·<b>v</b> = 0 és la condició de perpendicularitat.",
"idea_cross":"<b>La idea:</b> <b>u</b>×<b>v</b> és l'únic vector perpendicular a <b>u</b> i a <b>v</b> que té per mòdul l'àrea del paral·lelogram i segueix la regla de la mà dreta. En Física apareix en el moment d'una força, <b>M</b> = <b>r</b>×<b>F</b>, i en la força de Lorentz, <b>F</b> = q·<b>v</b>×<b>B</b>.",
"idea_mix":"<b>La idea:</b> [<b>u</b>, <b>v</b>, <b>w</b>] = (<b>u</b>×<b>v</b>)·<b>w</b> = det(<b>u</b>, <b>v</b>, <b>w</b>). En valor absolut és el volum del paral·lelepípede; el tetraedre amb les mateixes arestes en té la sisena part. Si val 0, els vectors són coplanaris: és la mateixa condició que en la combinació lineal.",
"f_m":"m =","f_area":"Àrea =","f_k":"k =","f_vol":"V =","f_a":"a =","f_b":"b =","f_c":"c =",
"m1.q":"Troba <b>m</b> perquè <b>u</b> = (1, 2, m) i <b>v</b> = (3, −1, 2) siguen <b>perpendiculars</b>.",
"m1_f":"Amb m = {0}, <b>u</b>·<b>v</b> = {1} ≠ 0: no són perpendiculars.",
"m1_ok":"✔ Missió complida! <b>u</b>·<b>v</b> = 3 − 2 + 2m = 0, per tant m = −1/2.",
"m1.more":"Hi ha algun valor de m que faça <b>u</b> i <b>v</b> paral·lels? Per què?",
"m2.q":"Calcula l'<b>àrea del triangle</b> de vèrtexs A(1, 0, 0), B(0, 2, 0) i C(0, 0, 3).",
"m2_par":"{0} és l'àrea del paral·lelogram de <b>AB</b> i <b>AC</b>. El triangle n'és la meitat.",
"m2_f":"{0} no és l'àrea. Calcula |<b>AB</b> × <b>AC</b>| i pensa quina part n'és el triangle.",
"m2_ok":"✔ Missió complida! <b>AB</b> × <b>AC</b> = (6, 3, 2), de mòdul 7: l'àrea del triangle és 7/2 = 3,5.",
"m2.more":"Amb el vector (6, 3, 2), quina és l'equació del pla que passa per A, B i C?",
"m3.q":"Troba <b>k</b> perquè <b>u</b> = (1, 1, 0), <b>v</b> = (0, 1, 1) i <b>w</b> = (1, k, 1) siguen <b>linealment dependents</b>.",
"m3_f":"Amb k = {0}, det(<b>u</b>, <b>v</b>, <b>w</b>) = {1} ≠ 0: encara formen una base.",
"m3_ok":"✔ Missió complida! det(<b>u</b>, <b>v</b>, <b>w</b>) = 2 − k = 0, per tant k = 2. Aleshores <b>w</b> = <b>u</b> + <b>v</b>.",
"m3.more":"Amb k = 2, escriu <b>w</b> com a combinació lineal de <b>u</b> i <b>v</b>. Es pot escriure <b>u</b> com a combinació de <b>v</b> i <b>w</b>?",
"m4.q":"Calcula el <b>volum del tetraedre</b> que té per arestes <b>u</b> = (1, 0, 2), <b>v</b> = (2, 1, 0) i <b>w</b> = (0, 3, 1) des d'un mateix vèrtex.",
"m4_par":"{0} és el volum del paral·lelepípede. El tetraedre n'és la sisena part.",
"m4_f":"{0} no és el volum del tetraedre. Calcula |[<b>u</b>, <b>v</b>, <b>w</b>]| i divideix com toca.",
"m4_ok":"✔ Missió complida! [<b>u</b>, <b>v</b>, <b>w</b>] = 13, per tant V = 13/6 ≈ 2,17.",
"m4.more":"Per què el tetraedre és la sisena part i no la meitat ni la tercera part? (Pista: piràmide = base · altura / 3, i la base és la meitat del paral·lelogram.)",
"m5.q":"Amb <b>u</b> = (1, 1, 0), <b>v</b> = (0, 1, 1) i <b>w</b> = (1, 0, 1), troba <b>a</b>, <b>b</b> i <b>c</b> perquè a·<b>u</b> + b·<b>v</b> + c·<b>w</b> = (3, 4, 5).",
"m5_f":"Amb aquests coeficients arribes a {0}, no a (3, 4, 5).",
"m5_ok":"✔ Missió complida! a = 1, b = 3, c = 2: són les coordenades de (3, 4, 5) en la base {<b>u</b>, <b>v</b>, <b>w</b>}.",
"m5.more":"Per què la solució és única? Què passaria si <b>w</b> fóra (1, 2, 1)?",
"s1.q":"El producte vectorial <b>u</b>×<b>v</b> és perpendicular a <b>u</b> i a <b>v</b>.",
"s1.h":"Calcula (<b>u</b>×<b>v</b>)·<b>u</b> per a un cas qualsevol.",
"s1.e":"Sempre: (<b>u</b>×<b>v</b>)·<b>u</b> = det(<b>u</b>, <b>v</b>, <b>u</b>) = 0, perquè té dues files iguals; igual amb <b>v</b>. Si <b>u</b> ∥ <b>v</b>, <b>u</b>×<b>v</b> = <b>0</b>, que és perpendicular a tot.",
"s2.q":"Si <b>u</b>×<b>v</b> = <b>0</b>, aleshores <b>u</b> = <b>0</b> o <b>v</b> = <b>0</b>.",
"s2.h":"Prova amb dos vectors paral·lels.",
"s2.e":"De vegades: <b>u</b>×<b>v</b> = <b>0</b> sempre que <b>u</b> i <b>v</b> són paral·lels, encara que cap siga zero (sin θ = 0).",
"s2.l0":"u = (1, 2, 3) i v = (",
"s2_zero":"Amb <b>v</b> = <b>0</b> sí que es compleix. Busca un <b>v</b> diferent de zero.",
"s2_no":"<b>u</b>×<b>v</b> = {0} ≠ <b>0</b>. Busca un <b>v</b> paral·lel a <b>u</b>.",
"s2_cx":"✔ <b>u</b>×<b>v</b> = <b>0</b> amb <b>v</b> = {0} ≠ <b>0</b>: són paral·lels.",
"s3.q":"Si <b>u</b>·<b>v</b> = 0, aleshores <b>u</b> = <b>0</b> o <b>v</b> = <b>0</b>.",
"s3.h":"Pensa en dos vectors perpendiculars.",
"s3.e":"De vegades: <b>u</b>·<b>v</b> = 0 també quan <b>u</b> i <b>v</b> són perpendiculars (cos 90° = 0). És justament la condició de perpendicularitat.",
"s3.l0":"v = (1, 2, 2) i u = (",
"s3_zero":"Amb <b>u</b> = <b>0</b> sí que es compleix. Busca un <b>u</b> diferent de zero.",
"s3_no":"<b>u</b>·<b>v</b> = {0} ≠ 0. Busca un <b>u</b> perpendicular a <b>v</b>.",
"s3_cx":"✔ <b>u</b> = {0} ≠ <b>0</b> i <b>u</b>·<b>v</b> = 0: són perpendiculars.",
"s4.q":"Tres vectors de ℝ³ entre els quals no n'hi ha dos de paral·lels formen una base.",
"s4.h":"Busca tres vectors en un mateix pla, per exemple el pla XY.",
"s4.e":"De vegades: poden ser coplanaris sense ser paral·lels dos a dos, i aleshores det(<b>u</b>, <b>v</b>, <b>w</b>) = 0. Cal comprovar el determinant, no les parelles.",
"s4.l0":"u = (1, 0, 0), v = (0, 1, 0) i w = (",
"s4_par":"Aquest <b>w</b> és paral·lel a <b>u</b> o a <b>v</b> (o és zero). Busca'n un que no ho siga.",
"s4_base":"Amb <b>w</b> = {0}, det(<b>u</b>, <b>v</b>, <b>w</b>) = {1} ≠ 0: sí que formen una base.",
"s4_cx":"✔ <b>w</b> = {0} no és paral·lel ni a <b>u</b> ni a <b>v</b>, però det = 0: són coplanaris i no formen base.",
"s5.q":"Si [<b>u</b>, <b>v</b>, <b>w</b>] &lt; 0, el volum del paral·lelepípede és negatiu.",
"s5.h":"Un volum pot ser negatiu?",
"s5.e":"Mai: el volum és |[<b>u</b>, <b>v</b>, <b>w</b>]|. El signe només indica l'orientació: si <b>w</b> queda al costat de <b>u</b>×<b>v</b> o al contrari.",
"s6.q":"Si <b>u</b>·<b>v</b> &lt; 0, l'angle entre <b>u</b> i <b>v</b> és obtús.",
"s6.h":"Mira el signe de cos θ.",
"s6.e":"Sempre: <b>u</b>·<b>v</b> = |<b>u</b>|·|<b>v</b>|·cos θ i els mòduls són positius, així que el signe de <b>u</b>·<b>v</b> és el de cos θ, que és negatiu si 90° &lt; θ ≤ 180°.",
"e1.ctx":"Amb <b>u</b> = (1, 0, 0) i <b>v</b> = (0, 1, 0), dos alumnes calculen <b>v</b>×<b>u</b>.",
"e1.n0":"Marta","e1.n1":"Joan",
"e1.s0":"<b>v</b>×<b>u</b> = (0, 0, 1), igual que <b>u</b>×<b>v</b>: l'ordre no importa.",
"e1.s1":"<b>v</b>×<b>u</b> = (0, 0, −1): en canviar l'ordre, el vector apunta cap a l'altre costat.",
"e1.w0":"<b>v</b>×<b>u</b> = −(<b>u</b>×<b>v</b>): en intercanviar dues files del determinant canvia el signe, i la regla de la mà dreta gira al revés.",
"e1.w1":"Perquè el producte vectorial sempre dona la component z negativa.",
"e1.w2":"Perquè el mòdul de <b>v</b>×<b>u</b> és diferent del mòdul de <b>u</b>×<b>v</b>.",
"e1.frame":"Marta, l'ordre sí que importa perquè…",
"e1.model":"Marta, el mòdul és el mateix (l'àrea no canvia), però el sentit no: si gires de <b>v</b> cap a <b>u</b>, el polze de la mà dreta apunta cap avall. Amb el determinant, intercanviar les files de <b>u</b> i <b>v</b> canvia el signe: <b>v</b>×<b>u</b> = −(<b>u</b>×<b>v</b>) = (0, 0, −1).",
"e2.ctx":"Calculen <b>u</b>·<b>v</b> amb <b>u</b> = (2, −1, 3) i <b>v</b> = (1, 4, 1).",
"e2.n0":"Pau","e2.n1":"Aina",
"e2.s0":"<b>u</b>·<b>v</b> = (2, −4, 3): es multipliquen les components una a una.",
"e2.s1":"<b>u</b>·<b>v</b> = 2 − 4 + 3 = 1.",
"e2.w0":"El producte escalar és un nombre: la suma dels productes de les components, 2·1 + (−1)·4 + 3·1 = 1.",
"e2.w1":"Perquè el resultat del producte escalar sempre ha de ser positiu.",
"e2.w2":"Perquè per a multiplicar vectors primer cal calcular-ne els mòduls.",
"e2.frame":"Pau, has trobat els productes bé, però et falta…",
"e2.model":"Pau, els productes 2, −4 i 3 són correctes, però el producte escalar no és un vector: cal sumar-los. <b>u</b>·<b>v</b> = 2 + (−4) + 3 = 1. Com és positiu, l'angle entre <b>u</b> i <b>v</b> és agut.",
"e3.ctx":"Amb <b>u</b> = (1, 2, 3), <b>v</b> = (2, 4, 6) i <b>w</b> = (0, 1, 5), es discuteix el volum del paral·lelepípede.",
"e3.n0":"Clara","e3.n1":"Marc",
"e3.s0":"El volum és 0 perquè <b>v</b> = 2<b>u</b>: els tres vectors queden en un pla.",
"e3.s1":"El determinant ix 0, però el volum no pot ser 0 perquè <b>w</b> no és paral·lel ni a <b>u</b> ni a <b>v</b>.",
"e3.w0":"Si <b>v</b> = 2<b>u</b>, els tres vectors són linealment dependents i caben en un pla: el paral·lelepípede s'aplana i V = |[<b>u</b>, <b>v</b>, <b>w</b>]| = 0, encara que <b>w</b> no siga paral·lel a cap.",
"e3.w1":"Perquè <b>w</b> té una component igual a zero.",
"e3.w2":"Perquè el volum sempre és 0 quan algun vector té components grans.",
"e3.frame":"Marc, encara que w no siga paral·lel a cap, el volum és 0 perquè…",
"e3.model":"Marc, ací la base ja està aplanada: <b>u</b> i <b>v</b> són paral·lels, així que <b>u</b>×<b>v</b> = <b>0</b> i l'àrea de la base és 0. Siga quin siga <b>w</b>, el volum és base per altura = 0. El volum coincideix sempre amb |det|: no hi ha cap contradicció.",
"e4.ctx":"Amb <b>u</b> = (1, 1, 0) i <b>v</b> = (0, 1, 1), calculen l'angle que formen.",
"e4.n0":"Jordi","e4.n1":"Laia",
"e4.s0":"cos θ = <b>u</b>·<b>v</b> = 1, per tant θ = 0°: són paral·lels.",
"e4.s1":"cos θ = 1/(√2·√2) = 1/2, per tant θ = 60°.",
"e4.w0":"cos θ = <b>u</b>·<b>v</b> / (|<b>u</b>|·|<b>v</b>|): cal dividir pels mòduls, que ací no valen 1 (|<b>u</b>| = |<b>v</b>| = √2).",
"e4.w1":"Perquè l'angle entre dos vectors de l'espai sempre és de 60°.",
"e4.w2":"Perquè el producte escalar sempre s'ha de dividir entre 2.",
"e4.frame":"Jordi, u·v = 1 no vol dir θ = 0° perquè…",
"e4.model":"Jordi, <b>u</b>·<b>v</b> = |<b>u</b>|·|<b>v</b>|·cos θ. Només si els dos vectors són unitaris coincideix amb cos θ. Ací |<b>u</b>| = |<b>v</b>| = √2, així que cos θ = 1/2 i θ = 60°. A més, (1, 1, 0) i (0, 1, 1) no són proporcionals: no poden ser paral·lels.",
"d1.q":"Cal arrossegar una caixa en la direcció <b>d</b> = (2, 1, 2) m. Tres companys hi fan forces del mateix mòdul, 3 N: A = (3, 0, 0), B = (0, 0, 3) i C = (2, −1, 2). Tria qui fa <b>més treball</b> i digues quant (J).",
"d1.lc":"Força:","d1.l0":"W =",
"d1_p":"La força {0} fa un treball de {1} J: n'hi ha una que en fa més.",
"d1_w":"Revisa el treball: W = <b>F</b>·<b>d</b>.",
"d1_ok":"✔ Ben decidit! W = <b>C</b>·<b>d</b> = 4 − 1 + 4 = 7 J (A i B en fan 6 J). Amb el mateix mòdul, fa més treball la força més alineada amb el desplaçament.",
"d1.more":"Quina força de mòdul 3 N faria el treball màxim? Quant valdria? (Pista: |<b>d</b>| = 3.)",
"d2.q":"Dues parts d'una teulada són triangles amb un vèrtex a l'origen: la 1 té <b>AB</b> = (4, 0, 0) i <b>AC</b> = (0, 3, 0) m; la 2, inclinada, té <b>AB</b> = (4, 0, 3) i <b>AC</b> = (0, 3, 0) m. Tria la que necessita <b>més teules</b> i digues la seua àrea (m²).",
"d2.lc":"Part:","d2.l0":"Àrea =",
"d2_p":"La part 1 fa 4·3/2 = 6 m². Mira bé l'altra: la inclinació també compta.",
"d2_a":"Revisa l'àrea: és la meitat de |<b>AB</b> × <b>AC</b>|.",
"d2_ok":"✔ Ben decidit! <b>AB</b> × <b>AC</b> = (−9, 0, 12), de mòdul 15: la part inclinada fa 7,5 m², més que els 6 m² de la plana, encara que des de dalt semblen iguals.",
"d2.more":"Des de dalt (projectades en el pla XY), les dues parts semblen iguals. Quin és el cosinus de l'angle entre totes dues normals? Compara'l amb 6/7,5.",
"d3.q":"Per a afluixar una femella pots usar la clau A, amb <b>r</b> = (0,3, 0, 0) m i <b>F</b> = (0, 20, 0) N, o la clau B, més llarga, amb <b>r</b> = (0,4, 0, 0) m i <b>F</b> = (0, 10, 10) N. Tria la que fa <b>més moment</b> i digues |<b>M</b>| (N·m).",
"d3.lc":"Clau:","d3.l0":"|M| =",
"d3_p":"Amb la clau B, <b>M</b> = <b>r</b>×<b>F</b> = (0, −4, 4), de mòdul 4√2 ≈ 5,66 N·m: és menor.",
"d3_m":"Revisa |<b>M</b>| = |<b>r</b> × <b>F</b>|.",
"d3_ok":"✔ Ben decidit! <b>M</b> = <b>r</b>×<b>F</b> = (0, 0, 6): 6 N·m amb la clau A, contra 5,66 N·m amb la B. La B és més llarga, però la component de la força paral·lela a l'eix del cargol no fa girar.",
"d3.more":"Amb la clau B i una força de 10√2 N, en quina direcció l'hauries d'aplicar perquè el moment fóra màxim? Quant valdria?",
"r1.q":"Quin és el mòdul de <b>u</b> = (1, 2, −2)?","r1.u":"",
"r1.e":"|<b>u</b>| = √(1 + 4 + 4) = √9 = 3.",
"r2.q":"Calcula <b>u</b>·<b>v</b> amb <b>u</b> = (1, 0, 2) i <b>v</b> = (3, −1, 1).","r2.u":"",
"r2.e":"1·3 + 0·(−1) + 2·1 = 5.",
"r3.q":"Si <b>u</b>×<b>v</b> = <b>0</b> amb <b>u</b> ≠ <b>0</b> i <b>v</b> ≠ <b>0</b>, aleshores…",
"r3.o0":"<b>u</b> i <b>v</b> són paral·lels","r3.o1":"<b>u</b> i <b>v</b> són perpendiculars","r3.o2":"<b>u</b> = <b>v</b>","r3.o3":"<b>u</b> i <b>v</b> formen una base del pla",
"r3.e":"|<b>u</b>×<b>v</b>| = |<b>u</b>|·|<b>v</b>|·sin θ = 0 amb mòduls no nuls obliga sin θ = 0: θ = 0° o 180°.",
"r4.q":"[<b>u</b>, <b>v</b>, <b>w</b>] = 0 vol dir que…",
"r4.o0":"<b>u</b>, <b>v</b> i <b>w</b> són coplanaris","r4.o1":"<b>u</b>, <b>v</b> i <b>w</b> són perpendiculars dos a dos","r4.o2":"algun dels tres és el vector zero","r4.o3":"<b>u</b>, <b>v</b> i <b>w</b> formen una base",
"r4.e":"El volum del paral·lelepípede és 0: els tres vectors estan en un pla (són linealment dependents). Que algun siga zero és només un cas particular.",
"r5.q":"Àrea del paral·lelogram de costats <b>u</b> = (1, 0, 0) i <b>v</b> = (1, 2, 0).","r5.u":"",
"r5.e":"<b>u</b>×<b>v</b> = (0, 0, 2), de mòdul 2.",
"r6.q":"Quant val (<b>i</b>×<b>j</b>)·<b>k</b>?",
"r6.o0":"1","r6.o1":"0","r6.o2":"−1","r6.o3":"el vector <b>k</b>",
"r6.e":"<b>i</b>×<b>j</b> = <b>k</b> i <b>k</b>·<b>k</b> = 1: és el volum (amb signe positiu) del cub unitat."

"intro_0":"Un vector del plano es una flecha: tiene módulo, dirección y sentido. Arrastra la punta de <b>r</b> o escribe sus componentes.",
"intro_1":"Base canónica {<b>i</b>, <b>j</b>}: <b>r</b> = x·<b>i</b> + y·<b>j</b>. Las componentes (x, y) dicen cuánto avanzamos en horizontal y cuánto en vertical.",
"intro_2":"Ahora tomamos otra base, {<b>u</b>, <b>v</b>}, que no es ortogonal. La cuadrícula se tuerce: sus líneas son paralelas a <b>u</b> y a <b>v</b>. También puedes arrastrar las puntas de <b>u</b> y de <b>v</b>.",
"intro_3":"Por la punta de <b>r</b> trazamos paralelas a <b>u</b> y a <b>v</b>: el paralelogramo descompone <b>r</b> en a·<b>u</b> + b·<b>v</b>.",
"intro_4":"Las coordenadas de <b>r</b> en la base B = {<b>u</b>, <b>v</b>} son (a, b). El vector es el mismo, pero los números cambian con la base. Se calculan resolviendo un sistema 2×2, que tiene solución única cuando det(<b>u</b>, <b>v</b>) ≠ 0.",
"pr_intro":"Predice: ¿de cuántas maneras se puede escribir <b>r</b> como a·<b>u</b> + b·<b>v</b>?","pr_intro.o0":"De una sola","pr_intro.o1":"De ninguna","pr_intro.o2":"De infinitas",
"pc_i_can":"En la base canónica, las coordenadas coinciden con las componentes.",
"pc_i_base":"≠ 0 → <b>u</b> y <b>v</b> no son paralelos: forman una <b>base</b> del plano.",
"pc_i_nob":"= 0 → <b>u</b> y <b>v</b> son paralelos: <b>no</b> forman base. Todas las combinaciones a·<b>u</b> + b·<b>v</b> quedan en una recta.",
"pc_i_sys":"Hay que resolver el sistema:",
"pc_i_coord":"Coordenadas en B:",
"pc_i_same":"El mismo vector con números distintos: (x, y) en {<b>i</b>, <b>j</b>} y (a, b) en {<b>u</b>, <b>v</b>}.",
"pc_i_inf":"<b>r</b> está en la recta de <b>u</b> y <b>v</b>: se puede escribir de infinitas maneras (sistema compatible indeterminado).",
"pc_i_none":"<b>r</b> no está en la recta de <b>u</b> y <b>v</b>: no se puede escribir como combinación (sistema incompatible).",
"ps_i1":"Base canónica i, j","ps_i2":"Base no ortogonal","ps_i3":"Una coordenada negativa","ps_i4":"Paralelos: no es base",
"idea_intro":"<b>La idea:</b> dos vectores no paralelos {<b>u</b>, <b>v</b>} forman una base del plano: cada vector se escribe de una única manera como <b>r</b> = a·<b>u</b> + b·<b>v</b>. Los números (a, b) son las coordenadas de <b>r</b> en esa base y dependen de la base elegida; las componentes (x, y) solo son las coordenadas en la base canónica {<b>i</b>, <b>j</b>}. La base no tiene que ser ortogonal. En ℝ³ pasa lo mismo con tres vectores, y la condición es det(<b>u</b>, <b>v</b>, <b>w</b>) ≠ 0.",
"m0.q":"Con la base <b>u</b> = (1, 1), <b>v</b> = (−1, 1), halla las coordenadas <b>a</b> y <b>b</b> de <b>r</b> = (1, 5): a·<b>u</b> + b·<b>v</b> = <b>r</b>.",
"m0_f":"Con esos valores, a·<b>u</b> + b·<b>v</b> = {0}, no (1, 5).",
"m0_ok":"✔ ¡Misión cumplida! 3·<b>u</b> + 2·<b>v</b> = (3 − 2, 3 + 2) = (1, 5): en la base {<b>u</b>, <b>v</b>}, <b>r</b> tiene coordenadas (3, 2).",
"m0.more":"Si <b>r</b> = (x, y), ¿cuáles son sus coordenadas en esta base? Escribe a y b en función de x e y.",
"s0.q":"Dos vectores del plano que no son paralelos forman una base de ℝ².",
"s0.h":"Piensa en det(<b>u</b>, <b>v</b>) y en el sistema a·<b>u</b> + b·<b>v</b> = <b>r</b>.",
"s0.e":"Siempre: si no son paralelos, det(<b>u</b>, <b>v</b>) ≠ 0 y el sistema a·<b>u</b> + b·<b>v</b> = <b>r</b> tiene solución única para cualquier <b>r</b>. No hace falta que sean perpendiculares ni unitarios.",
"e0.ctx":"Con la base <b>u</b> = (1, 0), <b>v</b> = (1, 1), buscan las coordenadas de <b>r</b> = (3, 2).",
"e0.n0":"Núria","e0.n1":"Pere",
"e0.s0":"Son (3, 2): las coordenadas siempre coinciden con las componentes.",
"e0.s1":"Son (1, 2): 1·<b>u</b> + 2·<b>v</b> = (1, 0) + (2, 2) = (3, 2).",
"e0.w0":"Las coordenadas dependen de la base: hay que hallar a y b con a·<b>u</b> + b·<b>v</b> = <b>r</b>, y aquí 3·<b>u</b> + 2·<b>v</b> = (5, 2) ≠ <b>r</b>.",
"e0.w1":"Porque las coordenadas siempre son más pequeñas que las componentes.",
"e0.w2":"Porque en una base no ortogonal siempre se resta 2 a la primera componente.",
"e0.frame":"Núria, (3, 2) no son las coordenadas en {u, v} porque…",
"e0.model":"Núria, (3, 2) son las coordenadas en la base canónica {<b>i</b>, <b>j</b>}. En la base {<b>u</b>, <b>v</b>} hay que comprobarlo: 3·<b>u</b> + 2·<b>v</b> = (3, 0) + (2, 2) = (5, 2), que no es <b>r</b>. De (a + b, b) = (3, 2) sale b = 2 y a = 1: las coordenadas son (1, 2).",
"r0.q":"¿Cuáles son las coordenadas de <b>r</b> = (3, 1) en la base <b>u</b> = (1, 0), <b>v</b> = (1, 1)?",
"r0.o0":"(2, 1)","r0.o1":"(3, 1)","r0.o2":"(4, 1)","r0.o3":"(1, 2)",
"r0.e":"a·(1, 0) + b·(1, 1) = (a + b, b) = (3, 1): b = 1 y a = 2.",

"comb_0":"Tres vectores <b>u</b>, <b>v</b> y <b>w</b> salen del origen. Elige los coeficientes a, b y c y avanza paso a paso para construir a·<b>u</b> + b·<b>v</b> + c·<b>w</b>.",
"comb_1":"Primero, a·<b>u</b>: el vector <b>u</b> multiplicado por a. Si a &lt; 0, cambia de sentido.",
"comb_2":"A continuación de la punta de a·<b>u</b> ponemos b·<b>v</b>. La suma es la diagonal del paralelogramo (discontinuo).",
"comb_3":"Y a continuación, c·<b>w</b>. Donde acaba la cadena está la combinación lineal <b>r</b> = a·<b>u</b> + b·<b>v</b> + c·<b>w</b>.",
"comb_4":"La pregunta importante: con estos tres vectores, ¿podemos llegar a cualquier punto del espacio? Si det(<b>u</b>, <b>v</b>, <b>w</b>) ≠ 0, sí: forman una base. Si vale 0, ninguna combinación sale de su plano (o de su recta).",
"dot_0":"Dos vectores, <b>u</b> y <b>v</b>, desde el origen.",
"dot_1":"El ángulo θ entre <b>u</b> y <b>v</b>, medido en el plano que forman (0° ≤ θ ≤ 180°).",
"dot_2":"Desde la punta de <b>u</b> bajamos la perpendicular a la recta de <b>v</b>.",
"dot_3":"El pie de la perpendicular marca la «sombra» de <b>u</b> sobre <b>v</b>: la proyección, |<b>u</b>|·cos θ. Tiene signo: es negativa si la sombra cae en el lado contrario de <b>v</b>.",
"dot_4":"El producto escalar es la sombra por la longitud de <b>v</b>: <b>u</b>·<b>v</b> = |<b>u</b>|·|<b>v</b>|·cos θ. En componentes, <b>u</b>·<b>v</b> = u₁v₁ + u₂v₂ + u₃v₃: un número, no un vector.",
"cross_0":"Dos vectores, <b>u</b> y <b>v</b>, desde el origen.",
"cross_1":"Forman un paralelogramo. Su área es base por altura: |<b>u</b>|·|<b>v</b>|·sen θ.",
"cross_2":"<b>u</b>×<b>v</b> es un vector perpendicular a <b>u</b> y a <b>v</b> con módulo igual al área del paralelogramo. El sentido lo da la regla de la mano derecha: los dedos giran de <b>u</b> hacia <b>v</b> (flecha curva) y el pulgar marca <b>u</b>×<b>v</b>.",
"cross_3":"Si intercambiamos el orden, el giro va de <b>v</b> hacia <b>u</b> y el vector apunta al lado contrario: <b>v</b>×<b>u</b> = −(<b>u</b>×<b>v</b>). El producto vectorial no es conmutativo.",
"mix_0":"Tres vectores <b>u</b>, <b>v</b> y <b>w</b>: las aristas de un paralelepípedo.",
"mix_1":"La base es el paralelogramo de <b>u</b> y <b>v</b>. Área de la base: |<b>u</b>×<b>v</b>|.",
"mix_2":"<b>u</b>×<b>v</b> es perpendicular a la base: marca la dirección de la altura.",
"mix_3":"La altura h es la proyección de <b>w</b> sobre la dirección de <b>u</b>×<b>v</b>: h = |<b>w</b>·(<b>u</b>×<b>v</b>)| / |<b>u</b>×<b>v</b>|.",
"mix_4":"Volumen = área de la base × altura = |(<b>u</b>×<b>v</b>)·<b>w</b>|. Ese número con signo es el producto mixto [<b>u</b>, <b>v</b>, <b>w</b>] = det(<b>u</b>, <b>v</b>, <b>w</b>). Si vale 0, el paralelepípedo se aplana: los vectores son coplanarios.",

"idea_comb":"<b>La idea:</b> tres vectores de ℝ³ forman una base cuando ninguno de ellos es combinación lineal de los otros. Para comprobarlo basta con el determinante: det(<b>u</b>, <b>v</b>, <b>w</b>) ≠ 0. Si vale 0, el rango es 2 o menos y las combinaciones no salen de un plano (o de una recta), por mucho que cambies a, b y c.",
"idea_dot":"<b>La idea:</b> <b>u</b>·<b>v</b> = |<b>u</b>|·|<b>v</b>|·cos θ mide cuánto «empuja» <b>u</b> en la dirección de <b>v</b>. En Física es el trabajo, W = <b>F</b>·<b>d</b>. El signo dice si el ángulo es agudo, recto u obtuso, y <b>u</b>·<b>v</b> = 0 es la condición de perpendicularidad.",
"idea_cross":"<b>La idea:</b> <b>u</b>×<b>v</b> es el único vector perpendicular a <b>u</b> y a <b>v</b> que tiene por módulo el área del paralelogramo y sigue la regla de la mano derecha. En Física aparece en el momento de una fuerza, <b>M</b> = <b>r</b>×<b>F</b>, y en la fuerza de Lorentz, <b>F</b> = q·<b>v</b>×<b>B</b>.",
"idea_mix":"<b>La idea:</b> [<b>u</b>, <b>v</b>, <b>w</b>] = (<b>u</b>×<b>v</b>)·<b>w</b> = det(<b>u</b>, <b>v</b>, <b>w</b>). En valor absoluto es el volumen del paralelepípedo; el tetraedro con las mismas aristas tiene la sexta parte. Si vale 0, los vectores son coplanarios: es la misma condición que en la combinación lineal.",
