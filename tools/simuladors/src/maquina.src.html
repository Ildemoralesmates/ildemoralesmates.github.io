<title>Màquina d'expressions: valor numèric i regles</title>
<meta name="description" content="Màquina d'expressions per a 2n d'ESO: encadena operacions i mira com es construeix l'expressió algebraica i com es calcula el valor numèric pas a pas. O endevina la regla secreta d'una màquina provant entrades. Amb activitats per a raonar.">

<style>
/*@COMMON_CSS@*/
/*@QUIZ_CSS@*/
/*@RAONA_CSS@*/
#svg{display:block;width:100%;height:auto}
#svg .pipe{stroke:var(--muted);stroke-width:8;stroke-linecap:round}
#svg .box rect{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
#svg .box text{fill:var(--ink);font:700 22px var(--f-num);text-anchor:middle;dominant-baseline:central}
#svg .box.hid rect{fill:var(--chip)}
#svg .io circle{fill:var(--panel);stroke:var(--pa);stroke-width:3}
#svg .io.out circle{stroke:var(--pb)}
#svg .io text{fill:var(--ink);font-family:var(--f-num);font-weight:700;text-anchor:middle;dominant-baseline:central}
#svg .io.pulse circle{animation:pulse .6s ease 2}
#svg .cap{fill:var(--muted);font:600 12px var(--f-body);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}
#svg .pill rect{fill:var(--chip);stroke:var(--line)}
#svg .pill text{fill:var(--ink);font:700 14px var(--f-num);text-anchor:middle;dominant-baseline:central}
#svg .ex{fill:var(--pa);font-family:var(--f-num);font-weight:600;text-anchor:middle}
#svg .ball circle{fill:var(--pa);stroke:var(--ink);stroke-width:1.5}
#svg .ball text{fill:var(--panel);font:700 14px var(--f-num);text-anchor:middle;dominant-baseline:central}
#svg .gearc{fill:none;stroke:var(--muted);stroke-width:8;stroke-dasharray:5.6 3.4}
#svg .gearh{fill:var(--muted)}
#svg .spin{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{stroke-width:7}}
@media (prefers-reduced-motion: reduce){#svg .spin,#svg .io.pulse circle{animation:none}}
.eqbig{font:700 clamp(1.25rem,3vw,1.75rem)/1.25 var(--f-num);letter-spacing:-.01em;overflow-wrap:anywhere}
.read{display:grid;gap:6px;font-size:15px}
.read p{margin:0}
.lbl{font-size:13px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:3px;font:500 14.5px/1.35 var(--f-num);overflow-wrap:anywhere}
.steps li:not(:first-child)::before{content:"= ";color:var(--muted)}
.steps li:last-child{font-weight:700}
.red{font:600 14.5px var(--f-num)}
#msg p{margin:0}
#msg .ok{color:var(--ok);font-weight:700}
#msg .bad{color:var(--warn);font-weight:700}
#msg .tip{color:var(--ink);font-size:14px}
.inrow .btn{font-family:var(--f-body)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{margin:4px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.stp button{font:700 15px var(--f-num);border:0;background:var(--chip);color:var(--ink);width:30px;height:30px;cursor:pointer}
.stp button:disabled{opacity:.4;cursor:default}
.stp output{min-width:2em;text-align:center;font:700 15px var(--f-num)}
.opseg button{font-family:var(--f-num);font-weight:700;min-width:44px}
.xin,.gin{font:600 15px var(--f-num);width:5em;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.gin.wide{width:10em}
.inrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 15px var(--f-num)}
.chips .chip{font-family:var(--f-num)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toolbar .sub{margin:0}
.gtab{border-collapse:collapse;font:600 14px var(--f-num);min-width:12em}
.gtab td,.gtab th{border:1px solid var(--line);padding:3px 10px;text-align:center}
.gtab th{color:var(--muted);background:var(--chip);font-weight:600}
.gtab td.dl{color:var(--pb)}
.gtab tr.last td{background:var(--chip)}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const r=a%b;a=b;b=r;}return a||1;}
class Q{constructor(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d;}const g=gcd(n,d);this.n=n/g;this.d=d/g;}
  static of(v){return v instanceof Q?v:Number.isInteger(v)?new Q(v,1):new Q(Math.round(v*1000),1000);}
  add(o){return new Q(this.n*o.d+o.n*this.d,this.d*o.d);} sub(o){return new Q(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){return new Q(this.n*o.n,this.d*o.d);} div(o){return new Q(this.n*o.d,this.d*o.n);}
  get z(){return this.n===0;} num(){return this.n/this.d;}}
const Q0=new Q(0);
function qs(v){const a=Math.abs(v.n);let s;
  if(v.d===1)s=String(a);
  else{let d=v.d;while(d%2===0)d/=2;while(d%5===0)d/=5;const x=a/v.d;s=(d===1&&String(x).length<=8)?String(x).replace('.',','):a+'/'+v.d;}
  return (v.n<0?'−':'')+s;}
const kStr=k=>qs(Q.of(k));
function ap(op,v){const K=Q.of(op.k||0);switch(op.o){case '+':return v.add(K);case '-':return v.sub(K);case '*':return v.mul(K);case '/':return v.div(K);default:return v.mul(v);}}
const chainVals=(x,ops)=>{const r=[x];ops.forEach(o=>r.push(ap(o,r[r.length-1])));return r;};
function step(c,op){const k=kStr(op.k),hasX=c.s.indexOf('x')>=0;
  switch(op.o){
  case '+':return {s:c.s+' + '+k,t:'sum'};
  case '-':return {s:c.s+' − '+k,t:'sum'};
  case '*':
    if(c.t==='x')return {s:(k==='1'?'1·':k)+'x',t:'prod'};
    if(c.t==='pow'&&c.s[0]==='x')return {s:k+c.s,t:'prod'};
    if(c.t==='num')return {s:k+'·'+c.s,t:'prod'};
    if(c.t==='neg'||c.t==='fr')return {s:k+'·('+c.s+')',t:'prod'};
    if(c.t==='sum')return {s:hasX?k+'('+c.s+')':k+'·('+c.s+')',t:'prod'};
    if(c.t==='pow')return {s:(hasX&&c.s[0]==='('?k:k+'·')+c.s,t:'prod'};
    return {s:k+'·'+c.s,t:'prod'};
  case '/':
    if(c.t==='sum'||c.t==='neg'||c.t==='fr')return {s:'('+c.s+')/'+k,t:'fr'};
    return {s:c.s+'/'+k,t:'fr'};
  default:
    if(c.t==='x'||c.t==='num')return {s:c.s+'²',t:'pow'};
    return {s:'('+c.s+')²',t:'pow'};
  }}
const atomX={s:'x',t:'x'};
function atomV(v){const s=qs(v);return {s:s,t:v.n<0?'neg':(s.indexOf('/')>=0?'fr':'num')};}

function pap(op,p){const K=Q.of(op.k||0);switch(op.o){
  case '+':{const r=p.slice();r[0]=r[0].add(K);return r;}
  case '-':{const r=p.slice();r[0]=r[0].sub(K);return r;}
  case '*':return p.map(c=>c.mul(K));

const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';

  (function fr(now){const p=Math.min(1,(now-t0)/dur),x=X0+(X1-X0)*p;let k=0;while(k<centers.length&&x>centers[k])k++;
    const v=qs(vals[Math.min(k,vals.length-1)]);

    if(p<1)anim=requestAnimationFrame(fr);
    else{g.innerHTML='';gears.forEach(e=>e.classList.remove('spin'));const o=$('#io-out');if(o)o.classList.add('pulse');if(onEnd)onEnd();}})(t0);
}
function panelBuild(){
  const n=B.ops.length,e=ruleStr(B.ops),r=pstr(polyOf(B.ops)),vals=chainVals(Q.of(B.x),B.ops);

  redEl.textContent=r.replace(/\s/g,'')!==e.replace(/\s/g,'')?tt('red',r):'';
  sublEl.textContent=tt('subl',qs(Q.of(B.x)));
  const lines=[];for(let i=0;i<=n;i++){const L=i===n?qs(vals[n]):buildStr(atomV(vals[i]),B.ops.slice(i));if(!lines.length||lines[lines.length-1]!==L)lines.push(L);}
  stepsEl.innerHTML=lines.map(l=>'<li>'+l+'</li>').join('');
  const sq=B.ops.filter(o=>o.o==='^').length;
  $('#addBox').disabled=n>=4||(B.o==='^'&&sq>=2);$('#popBox').disabled=!n;$('#clrBox').disabled=!n;
  $$('#opsel button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.o===B.o)));
  $('#kbox').hidden=B.o==='^';$('#kout').textContent=B.k;$('#km').disabled=B.k<=1;$('#kp').disabled=B.k>=9;
  if($('#xin')!==document.activeElement)$('#xin').value=qs(Q.of(B.x));
  let m='';if(!n)m='<p class="tip">'+t('empty_b')+'</p>';else if(n>=4)m='<p class="tip">'+t('max')+'</p>';else if(B.o==='^'&&sq>=2)m='<p class="tip">'+t('max2')+'</p>';
  if(B.xbad)m='<p class="bad">'+t('xbad')+'</p>';
  msg.innerHTML=m;snote.textContent=t('snote_b');
  $$('#preB .chip').forEach((c,i)=>c.setAttribute('aria-pressed',String(i===B.pre)));
}
function panelGuess(){
  eqEl.textContent='y = '+(G.revealed?ruleStr(G.ops):'?');
  const r=pstr(polyOf(G.ops)),e=ruleStr(G.ops);
  redEl.textContent=G.revealed&&r.replace(/\s/g,'')!==e.replace(/\s/g,'')?tt('red',r):'';
  sublEl.textContent='';stepsEl.innerHTML='';
  let rows=G.entries.slice();if(G.diff)rows.sort((a,b)=>a.x.num()-b.x.num());else rows=rows.slice(-8);
  let h='';
  if(rows.length){h='<tr><th>'+t('th_x')+'</th><th>'+t('th_y')+'</th>'+(G.diff?'<th>'+t('th_d')+'</th>':'')+'</tr>';
    rows.forEach((r,i)=>{let d='';if(G.diff){if(i){const dx=r.x.sub(rows[i-1].x);d=dx.n===1&&dx.d===1?(()=>{const dy=r.y.sub(rows[i-1].y);return (dy.n>=0?'+':'')+qs(dy);})():'—';}d='<td class="dl">'+d+'</td>';}
      h+='<tr'+(r===G.last&&!G.diff?' class="last"':'')+'><td>'+qs(r.x)+'</td><td>'+qs(r.y)+'</td>'+d+'</tr>';});}
  $('#gtab').innerHTML=h;$('#gdiff').checked=G.diff;
  $$('#lvl button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===G.lvl)));
  const M=G.msg;msg.innerHTML=M?'<p class="'+(M.c||'tip')+'">'+tt(M.k,...(M.p||[]))+'</p>':'<p class="tip">'+t('g_start')+'</p>';
  snote.textContent=t('snote_g');$('#gRev').disabled=G.revealed;
}

const rnd=n=>Math.floor(Math.random()*n);
function genRule(lvl){
  const a=2+rnd(4),b=1+rnd(7);
  if(lvl==='easy')return [[{o:'*',k:a},{o:'+',k:b}],[{o:'*',k:a},{o:'-',k:b}],[{o:'*',k:a}],[{o:'+',k:b}],[{o:'*',k:a},{o:'+',k:b}]][rnd(5)];
  return [[{o:'+',k:b},{o:'*',k:a}],[{o:'-',k:b},{o:'*',k:a}],[{o:'^'},{o:'+',k:b}],[{o:'^'},{o:'*',k:a}],[{o:'^'},{o:'-',k:b}],[{o:'*',k:a},{o:'^'}],[{o:'^'},{o:'*',k:2},{o:'+',k:b}]][rnd(7)];
}
function newRule(){let r;do{r=genRule(G.lvl);}while(G.ops.length&&ruleStr(r)===ruleStr(G.ops));G.ops=r;G.entries=[];G.revealed=false;G.msg=null;G.last=null;$('#gguess').value='';render();}
function feed(v,silent){const x=Q.of(v),y=chainVals(x,G.ops).pop();G.entries=G.entries.filter(e=>!(e.x.n===x.n&&e.x.d===x.d));const e={x:x,y:y};G.entries.push(e);G.last=e;
  if(silent)return;G.msg=null;const prev=G.entries.length>1?G.entries[G.entries.length-2]:null;
  const done=()=>{render();};

function parseExpr(src){
  const s=src.toLowerCase().replace(/\s+/g,'').replace(/^y=/,'').replace(/[−–]/g,'-').replace(/[·×]/g,'*').replace(/:/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/,/g,'.').replace(/n/g,'x');
  if(!s)return null;let i=0;const pk=()=>s[i];
  const num=()=>{const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)return null;i+=m[0].length;return parseFloat(m[0]);};
  function prim(){const c=pk();if(c==='('){i++;const e=expr();if(pk()!==')')throw 0;i++;return e;}if(c==='x'){i++;return x=>x;}const v=num();if(v===null)throw 0;return ()=>v;}
  function pow(){const b=prim();if(pk()==='^'){i++;const e=num();if(e===null||!Number.isInteger(e)||e>6)throw 0;return x=>Math.pow(b(x),e);}return b;}
  function un(){if(pk()==='-'){i++;const u=un();return x=>-u(x);}if(pk()==='+'){i++;return un();}return pow();}
  function term(){let a=un();for(;;){const c=pk();
    if(c==='*'||c==='/'){i++;const b=un(),A=a;a=c==='*'?x=>A(x)*b(x):x=>A(x)/b(x);}
    else if(c==='x'||c==='('||(c!==undefined&&/\d/.test(c))){const b=pow(),A=a;a=x=>A(x)*b(x);}
    else break;}return a;}
  function expr(){let a=term();while(pk()==='+'||pk()==='-'){const c=s[i++],b=term(),A=a;a=c==='+'?x=>A(x)+b(x):x=>A(x)-b(x);}return a;}
  try{const f=expr();return i===s.length?f:null;}catch(e){return null;}
}
const same=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
const fy=y=>Math.abs(y-Math.round(y))<1e-9?String(Math.round(y)).replace('-','−'):nf(y,3).replace('-','−');
function checkGuess(){
  const f=parseExpr($('#gguess').value);

  for(const x of [-3,-2,-1,0,1,2,3,4,5,10,0.5,-0.5]){const yr=chainVals(Q.of(x),G.ops).pop(),yu=f(x);
    if(!same(yu,yr.num())){G.msg={k:'g_bad2',p:[qs(Q.of(x)),qs(yr),fy(yu)],c:'bad'};panelGuess();return;}}
  G.revealed=true;G.msg={k:'g_ok',p:[ruleStr(G.ops)],c:'ok'};render();
}

 ],
