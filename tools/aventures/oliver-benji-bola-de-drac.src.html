<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver i Benji × Bola de Drac: El torneig de les set boles</title>
<meta name="description" content="El torneig de les set boles / El torneo de las siete bolas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ec; --ink:#241a12; --card:#fffdf8; --muted:#6b5a4a; --line:#e5d8c3;
  --accent:#6b44a8; --on-accent:#ffffff; --danger:#a3361f;
  --font-title:"Grandstander","Trebuchet MS",system-ui,sans-serif;
  --font-read:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --font-dial:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16110c; --ink:#f3e9d8; --card:#211a13; --muted:#b8a78f; --line:#3a2e22; --danger:#ff9b85;
  }
}
:root[data-theme="dark"]{
  --bg:#16110c; --ink:#f3e9d8; --card:#211a13; --muted:#b8a78f; --line:#3a2e22; --danger:#ff9b85;
}
body[data-era="estadi"]{--accent:#1f7a4a}
body[data-era="illa"]{--accent:#a35a12}
body[data-era="cel"]{--accent:#2563a8}
body[data-era="casa"]{--accent:#6b44a8}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-read);line-height:1.55;transition:background .3s}
.top{max-width:42rem;margin:0 auto;padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.brand{font-family:var(--font-title);font-weight:800;color:var(--accent);font-size:1.05rem}
.tools{display:flex;gap:.4rem;align-items:center}
.pill{font-family:var(--font-title);font-weight:700;font-size:.9rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .8rem;cursor:pointer;min-height:2.4rem}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:42rem;margin:0 auto;padding:0 1rem 3rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:1.2rem;padding:1.1rem 1.1rem 1.3rem;box-shadow:0 2px 0 var(--line)}
.plate{display:flex;gap:.8rem;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:.7rem;margin-bottom:.8rem}
.plate svg{flex:0 0 auto;width:5.5rem;height:3.4rem;color:var(--accent)}
.plate .pn{font-family:var(--font-title);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.2}
.hud{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin:.2rem 0 1rem;font-size:.95rem}
.hud .grp{display:flex;align-items:center;gap:.4rem}
.hud .lbl{font-family:var(--font-title);font-weight:700;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
.hud svg{width:1.7rem;height:1.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.9rem;border:2px solid var(--line);border-radius:999px;padding:.1rem .6rem;background:var(--bg)}
.chip.empty{color:var(--muted);border-style:dashed}
.txt p{font-size:1.2rem;margin:.7rem 0}
.txt p.dlg{padding-left:.9rem;border-left:4px solid var(--accent)}
.txt p.riddle{font-family:var(--font-title);font-weight:700;background:color-mix(in srgb,var(--accent) 14%,var(--card));border-radius:.8rem;padding:.7rem .9rem}
.txt p.hint{color:var(--muted);font-style:italic;font-size:1.05rem}
.choices{display:flex;flex-direction:column;gap:.7rem;margin-top:1.2rem}
.btn{font-family:var(--font-title);font-weight:700;font-size:1.15rem;line-height:1.3;text-align:left;border:3px solid var(--accent);background:var(--card);color:var(--ink);border-radius:1rem;padding:.8rem 1rem;min-height:3.4rem;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.btn:active{transform:scale(.985)}
.btn.main{background:var(--accent);color:var(--on-accent);text-align:center}
.btn.main:hover{background:var(--accent);filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);font-size:1rem;min-height:2.8rem;font-weight:500;text-align:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.undo{margin-top:1rem;text-align:center}
h1{font-family:var(--font-title);font-weight:800;font-size:2rem;line-height:1.1;margin:.2rem 0 .3rem;color:var(--accent)}
h2{font-family:var(--font-title);font-weight:800;font-size:1.6rem;line-height:1.15;margin:.2rem 0 .6rem;color:var(--accent)}
.sub{font-family:var(--font-title);font-size:1.2rem;color:var(--muted);margin:.1rem 0 1rem}
.intro ul{padding-left:1.2rem;font-size:1.1rem}
.intro li{margin:.4rem 0}
.intro label{display:block;font-family:var(--font-title);font-weight:700;font-size:1.1rem;margin:1.1rem 0 .4rem}
.intro input{width:100%;font:inherit;font-size:1.3rem;padding:.7rem .9rem;border:3px solid var(--line);border-radius:.9rem;background:var(--bg);color:var(--ink)}
.intro input:focus{border-color:var(--accent)}
.err{color:var(--danger);font-weight:700;margin:.5rem 0 0}
.counter{margin-top:1rem;text-align:center;color:var(--muted);font-family:var(--font-dial);font-size:.95rem}
.endnote{font-family:var(--font-dial);color:var(--muted);margin-top:1rem;font-size:.95rem}
#plof{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:color-mix(in srgb,var(--accent) 88%,#000);color:#fff;text-align:center;padding:1rem}
#plof .big{font-family:var(--font-title);font-weight:800;font-size:3.4rem;animation:pop .5s ease-out both}
#plof svg{width:6rem;height:6rem;animation:spin 1.4s linear infinite}
#plof .dial{font-family:var(--font-dial);font-size:1.15rem;border:2px solid #fff;border-radius:.6rem;padding:.4rem .9rem}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  #plof svg,#plof .big{animation:none}
  .btn{transition:none}
}
@media (max-width:30rem){
  h1{font-size:1.7rem}
  .plate svg{width:4.4rem}
}
</style>
</head>
<body data-era="casa">
<header class="top">
  <div class="brand" id="brand">TÍTULO</div>
  <div class="tools">
    <button class="pill" id="lang-ca" aria-pressed="true" type="button">VAL</button>
    <button class="pill" id="lang-es" aria-pressed="false" type="button">CAS</button>
    <button class="pill" id="restart" type="button" aria-label="Començar de nou">↻</button>
  </div>
</header>
<main id="app"></main>
<div id="plof" hidden role="status" aria-live="polite">
  <div class="big">¡PLOF!</div>
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="36" fill="none" stroke="#fff" stroke-width="7"/><path d="M50 14 L50 30 M50 70 L50 86 M14 50 L30 50 M70 50 L86 50" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="6" fill="#fff"/></svg>
  <div class="dial" id="plof-dial"></div>
</div>

<script>
/* ============ DADES ============ */
const KEY = 'oliver-benji-bola-de-drac-v1';
const x = (ca, es) => ({ ca: ca, es: es });

const TITLE = x(`Oliver i Benji × Bola de Drac`, `Oliver y Benji × Bola de Dragón`);
const DESC  = x(`El torneig de les set boles`, `El torneo de las siete bolas`);
const TITLE_FULL = x(`Oliver i Benji × Bola de Drac: El torneig de les set boles`, `Oliver y Benji × Bola de Dragón: El torneo de las siete bolas`);

const ON = {
  guants: x(`els guants de porter`, `los guantes de portero`),
  xiulet: x(`el xiulet d'àrbitre`, `el silbato de árbitro`),
  radar: x(`el radar de Bulma`, `el radar de Bulma`)
};
const OCHIP = {
  guants: x(`Guants de porter`, `Guantes de portero`),
  xiulet: x(`Xiulet d'àrbitre`, `Silbato de árbitro`),
  radar: x(`Radar de Bulma`, `Radar de Bulma`)
};
const OB = k => ON[k] || x(`l'objecte`, `el objeto`);
const ERA = {
  casa:   { ch: false, n: x(`Pròleg · La teua habitació`, `Prólogo · Tu habitación`) },
  estadi: { ch: true,  n: x(`Capítol 1 · L'estadi de la primera bola`, `Capítulo 1 · El estadio de la primera bola`) },
  illa:   { ch: true,  n: x(`Capítol 2 · L'illa del volcà`, `Capítulo 2 · La isla del volcán`) },
  cel:    { ch: true,  n: x(`Capítol 3 · L'estadi del cel`, `Capítulo 3 · El estadio del cielo`) }
};

const ALL_ENDINGS = ['fin_tele', 'fin_arbitre', 'fin_cranc', 'fin_mans', 'fin_gel', 'fin_propia', 'fin_nuvol'];   // todos los finales salvo 'bo' y 'heroi'
const TOTAL_FINALS = ALL_ENDINGS.length + 2;

const U = {
  start: x(`Començar l'aventura`, `Empezar la aventura`),
  nameQ: x(`Com et diuen?`, `¿Cómo te llamas?`),
  nameErr: x(`Escriu el teu nom per a començar.`, `Escribe tu nombre para empezar.`),
  namePh: x(`El teu nom`, `Tu nombre`),
  pieces: x(`Boles del Drac`, `Bolas del Dragón`),
  pack: x(`Motxilla`, `Mochila`),
  empty: x(`buida`, `vacía`),
  undo: x(`↶ Tornar a la decisió anterior`, `↶ Volver a la decisión anterior`),
  backLast: x(`Tornar a l'última decisió`, `Volver a la última decisión`),
  again: x(`Començar de nou`, `Empezar de nuevo`),
  playAgain: x(`Tornar a jugar`, `Jugar otra vez`),
  restartAsk: x(`Toca de nou per a reiniciar`, `Toca de nuevo para reiniciar`),
  restartLbl: x(`Començar de nou`, `Empezar de nuevo`),
  finalsCount: (n) => x(`Finals descoberts: ${n} de ${TOTAL_FINALS}`, `Finales descubiertos: ${n} de ${TOTAL_FINALS}`),
  newEnd: x(`Final descobert!`, `¡Final descubierto!`),
  cV: x(`Carta Veloç`, `Carta Veloz`),
  cT: x(`Carta Tècnica`, `Carta Técnica`),
  cF: x(`Carta Força`, `Carta Fuerza`)
};

const S = {

intro: { era: 'casa', text: [], choices: [] },

/* ---------- PRÒLEG ---------- */
pro: { era: 'casa',
  text: [
    x(`Fa estona que és de nit i la casa està en silenci. De sobte, la pilota nova que has deixat a l'armari bota soleta pel terra. Ploc, ploc, ploc.`,
      `Hace rato que es de noche y la casa está en silencio. De pronto, el balón nuevo que dejaste en el armario bota solo por el suelo. Ploc, ploc, ploc.`),
    x(`>—Psst! Em dic Pipo i sí, parle. No, no t'ho has imaginat —diu la pilota—. Necessite ajuda amb un partit. Un partit molt, molt important.`,
      `>—¡Psst! Me llamo Pipo y sí, hablo. No, no te lo has imaginado —dice el balón—. Necesito ayuda con un partido. Un partido muy, muy importante.`),
    x(`Dins de l'armari s'obri un cercle de llum que gira com una rentadora. Fa olor de gespa acabada de tallar.`,
      `Dentro del armario se abre un círculo de luz que gira como una lavadora. Huele a césped recién cortado.`)
  ],
  choices: [
    { t: x(`Preguntar-li de quin partit parla`, `Preguntarle de qué partido habla`), go: 'pro2' },
    { t: x(`Tapar-te amb la manta i anar a vore la tele`, `Taparte con la manta e ir a ver la tele`), go: 'fin_tele' }
  ] },

pro2: { era: 'casa',
  text: [
    x(`>—Hi ha un torneig que només es juga una vegada cada cent anys: el Torneig de les Set Boles. Qui guanya la final li pot demanar un desig al drac Shenron —explica Pipo.`,
      `>—Hay un torneo que solo se juega una vez cada cien años: el Torneo de las Siete Bolas. Quien gana la final le puede pedir un deseo al dragón Shenron —explica Pipo.`),
    x(`>—Però Freezer vol les boles per a ell i juga amb trampes. Oliver i Benji et necessiten, {nom}. (Oliver és el davanter: el que xuta i marca els gols. Benji és el porter: el que els para.)`,
      `>—Pero Freezer quiere las bolas para él y juega con trampas. Oliver y Benji te necesitan, {nom}. (Oliver es el delantero: el que chuta y marca los goles. Benji es el portero: el que los para.)`),
    x(`>—I una cosa més: allà els duels es resolen amb cartes. N'hi ha de tres tipus: Veloç, Tècnica i Força. La Veloç guanya a la Força, la Força guanya a la Tècnica i la Tècnica guanya a la Veloç. Si es juga el mateix tipus, és empat.`,
      `>—Y otra cosa: allí los duelos se resuelven con cartas. Las hay de tres tipos: Veloz, Técnica y Fuerza. La Veloz gana a la Fuerza, la Fuerza gana a la Técnica y la Técnica gana a la Veloz. Si se juega el mismo tipo, es empate.`),
    x(`Només pots dur UN objecte, perquè la motxilla és xicoteta. Tria bé: no tots serviran en el mateix lloc.`,
      `Solo puedes llevar UN objeto, porque la mochila es pequeña. Elige bien: no todos servirán en el mismo sitio.`)
  ],
  choices: [
    { t: x(`Els guants de porter (aguanten el que cremi)`, `Los guantes de portero (aguantan lo que queme)`), go: 'c1_arribada', set: s => { s.obj = 'guants'; } },
    { t: x(`El xiulet d'àrbitre (fa por a qui fa trampes)`, `El silbato de árbitro (asusta a quien hace trampas)`), go: 'c1_arribada', set: s => { s.obj = 'xiulet'; } },
    { t: x(`El radar de Bulma (xiula quan hi ha una bola prop)`, `El radar de Bulma (pita cuando hay una bola cerca)`), go: 'c1_arribada', set: s => { s.obj = 'radar'; } }
  ] },

/* ---------- CAPÍTOL 1 · ESTADI ---------- */
c1_arribada: { era: 'estadi',
  text: [
    x(`PLOF! Aterres de peus sobre la gespa d'un estadi enorme. Les graderies estan buides i el sol cau de ple.`,
      `¡PLOF! Aterrizas de pie sobre el césped de un estadio enorme. Las gradas están vacías y el sol cae de lleno.`),
    x(`>—Per fi! Ei, {nom}! Jo soc Oliver. Ell és Benji —diu un xic amb una pilota sota el braç—. La primera Bola del Drac s'ha amagat ací mateix, però algú ha posat trampes pel camp.`,
      `>—¡Por fin! ¡Eh, {nom}! Yo soy Oliver. Él es Benji —dice un chico con un balón bajo el brazo—. La primera Bola del Dragón se ha escondido aquí mismo, pero alguien ha puesto trampas por el campo.`),
    x(`A uns passos, Krilin intenta recollir un munt de cartes que se li han escampat per terra. Al fons, la graderia està molt fosca.`,
      `A unos pasos, Krilin intenta recoger un montón de cartas que se le han esparcido por el suelo. Al fondo, la grada está muy oscura.`)
  ],
  choices: [
    { t: x(`Ajudar Krilin a recollir les cartes`, `Ayudar a Krilin a recoger las cartas`), go: 'c1_krilin' },
    { t: x(`Anar directament a la porteria de Benji`, `Ir directamente a la portería de Benji`), go: 'c1_porteria' },
    { t: x(`Pujar a la graderia fosca a vore què passa`, `Subir a la grada oscura a ver qué pasa`), go: 'c1_graderia' }
  ] },

c1_krilin: { era: 'estadi',
  onEnter: s => { s.krilin = 1; },
  text: [
    x(`Entre els dos arreplegueu les cartes una per una, sense deixar-ne cap sota la gespa.`,
      `Entre los dos recogéis las cartas una a una, sin dejar ninguna bajo el césped.`),
    x(`>—Gràcies, de veres! Si algun dia necessites ajuda, ací em tens —diu Krilin—. I una pista: la bola s'amaga on acaba tot el que xuta Oliver. Un lloc amb xarxa, però sense peixos.`,
      `>—¡Gracias, de verdad! Si algún día necesitas ayuda, aquí me tienes —dice Krilin—. Y una pista: la bola se esconde donde acaba todo lo que chuta Oliver. Un sitio con red, pero sin peces.`)
  ],
  choices: [
    { t: x(`Anar a la porteria`, `Ir a la portería`), go: 'c1_porteria' }
  ] },

c1_graderia: { era: 'estadi',
  text: [
    x(`Puges els graons a poc a poc. Tot fa olor de ferro fred. Darrere d'una columna hi ha un àrbitre amb la cara tapada que remena una bola daurada.`,
      `Subes los escalones poco a poco. Todo huele a hierro frío. Detrás de una columna hay un árbitro con la cara tapada que manosea una bola dorada.`),
    x(`!Un àrbitre que no vol que el vegen... això no és normal.`,
      `!Un árbitro que no quiere que lo vean... eso no es normal.`)
  ],
  choices: [
    { t: x(`Tocar el xiulet amb totes les forces`, `Tocar el silbato con todas tus fuerzas`), if: s => s.obj === 'xiulet', go: 'c1_xiulet' },
    { t: x(`Tornar al camp a poc a poc, sense fer soroll`, `Volver al campo poco a poco, sin hacer ruido`), go: 'c1_porteria' },
    { t: x(`Cridar-li que t'ensenye la bola`, `Gritarle que te enseñe la bola`), go: 'fin_arbitre' }
  ] },

c1_xiulet: { era: 'estadi',
  onEnter: s => { s.cF = 1; },
  text: [
    x(`PIIIIIII! El xiulet sona tan fort que l'àrbitre fals bota de l'ensurt i fuig escales avall.`,
      `¡PIIIIIII! El silbato suena tan fuerte que el árbitro falso salta del susto y huye escaleras abajo.`),
    x(`Amb les presses, deixa caure una carta daurada. Dins hi ha un puny gegant: és una carta Força.`,
      `Con las prisas, deja caer una carta dorada. Dentro hay un puño gigante: es una carta Fuerza.`)
  ],
  choices: [
    { t: x(`Baixar corrents a la porteria`, `Bajar corriendo a la portería`), go: 'c1_porteria' }
  ] },

c1_porteria: { era: 'estadi',
  text: s => [
    x(`>—Soc Benji. Les boles s'amaguen allà on un xut acaba en gol —diu el porter, seriós.`,
      `>—Soy Benji. Las bolas se esconden allí donde un chut acaba en gol —dice el portero, serio.`),
    x(`?Tinc dos pals i un travesser. Tinc xarxa, però no pesque. Si algú xuta fort, m'ompli de festa. Què soc?`,
      `?Tengo dos palos y un larguero. Tengo red, pero no pesco. Si alguien chuta fuerte, me lleno de fiesta. ¿Qué soy?`),
    s.krilin ? x(`!Krilin ja t'ho havia dit: un lloc amb xarxa i sense peixos.`, `!Krilin ya te lo había dicho: un sitio con red y sin peces.`)
             : x(`!Pensa: què hi ha sempre darrere de Benji?`, `!Piensa: ¿qué hay siempre detrás de Benji?`)
  ],
  choices: [
    { t: x(`La porteria`, `La portería`), go: 'c1_bola', set: s => { s.cT = 1; } },
    { t: x(`Una xarxa de pesca`, `Una red de pesca`), go: 'c1_error' },
    { t: x(`Una tenda de campanya`, `Una tienda de campaña`), go: 'c1_error' }
  ] },

c1_error: { era: 'estadi',
  text: [
    x(`>—Mmm, no. Una xarxa de pesca? Ací no hi ha peixos! —riu Benji—. Pensa-ho un altre cop.`,
      `>—Mmm, no. ¿Una red de pesca? ¡Aquí no hay peces! —se ríe Benji—. Piénsalo otra vez.`)
  ],
  choices: [
    { t: x(`Tornar a pensar-ho`, `Volver a pensarlo`), go: 'c1_porteria' }
  ] },

c1_bola: { era: 'estadi',
  onEnter: s => { s.f1 = 1; },
  text: [
    x(`Entre la xarxa de la porteria brilla una bola taronja amb una estrella roja: la primera Bola del Drac! Oliver us dóna una palmada a l'esquena a Benji i a tu.`,
      `Entre la red de la portería brilla una bola naranja con una estrella roja: ¡la primera Bola del Dragón! Oliver os da una palmada en la espalda a Benji y a ti.`),
    x(`Però quan la tens a les mans, els llums de l'estadi s'apaguen d'un colp.`,
      `Pero cuando la tienes en las manos, las luces del estadio se apagan de golpe.`),
    x(`>—Quina llàstima... Jo també la volia —diu una veu gelada.`,
      `>—Qué lástima... Yo también la quería —dice una voz helada.`)
  ],
  choices: [
    { t: x(`Girar-te cap a la veu`, `Girarte hacia la voz`), go: 'c1_duel' }
  ] },

c1_duel: { era: 'estadi',
  text: [
    x(`Un soldat de Freezer apareix entre les ombres, amb una carta que brilla com una espelma: una carta Veloç.`,
      `Un soldado de Freezer aparece entre las sombras, con una carta que brilla como una vela: una carta Veloz.`),
    x(`>—Duel de cartes! Si guanyes, et quedes la bola. Si perds, me l'enduc —diu el soldat.`,
      `>—¡Duelo de cartas! Si ganas, te quedas la bola. Si pierdes, me la llevo —dice el soldado.`),
    x(`!Recorda: la Tècnica guanya a la Veloç.`, `!Recuerda: la Técnica gana a la Veloz.`)
  ],
  choices: [
    { t: x(`Jugar la carta Tècnica`, `Jugar la carta Técnica`), if: s => s.cT, go: 'c1_guany' },
    { t: x(`Jugar la carta Força`, `Jugar la carta Fuerza`), if: s => s.cF, go: 'c1_perd' },
    { t: x(`Cridar Oliver perquè t'ajude`, `Llamar a Oliver para que te ayude`), go: 'c1_perd' }
  ] },

  choices: [

c2_entrepa: { era: 'illa',
  onEnter: s => { s.goku = 1; s.cV = 1; },

/* ============ MOTOR ============ */
function initState() {
  return { nom: '', obj: null, pagat: null, en: 5, f1: 0, f2: 0, f3: 0,
           cT: 0, cF: 0, cV: 0, krilin: 0, goku: 0, vegeta: 0, perla: 0, retornat: 0, pipoEnfadat: 0 };
}
const st = { scene: 'intro', s: initState(), hist: [], found: {}, lang: 'ca', era: 'casa' };
let locked = false;
let restartArmed = false;
let restartTimer = null;

function T(v) { return (v && typeof v === 'object') ? v[st.lang] : v; }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function hn(text) {
  let t = esc(text);
  t = t.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, function (m, a, b) { return st.s.gen === 'f' ? b : a; });
  t = t.replace(/\{nom\}/g, '<b>' + esc(String(st.s.nom || '').toUpperCase()) + '</b>');
  t = t.replace(/\b(Pipo|Oliver|Benji|Goku|Vegeta|Krilin|Freezer|Shenron)\b/g, function (m) { return '<b>' + m.toUpperCase() + '</b>'; });
  return t;
}

function foundCount() {
  let n = 0;
  ALL_ENDINGS.forEach(function (k) { if (st.found[k]) n++; });
  if (st.found.bo) n++;
  if (st.found.heroi) n++;
  return n;
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ scene: st.scene, s: st.s, hist: st.hist.slice(-40), found: st.found, lang: st.lang, era: st.era }));
  } catch (e) { /* sense emmagatzematge */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.lang === 'ca' || d.lang === 'es') st.lang = d.lang;
    if (d.found && typeof d.found === 'object') st.found = d.found;
    if (d.scene && S[d.scene]) {
      st.scene = d.scene;
      st.s = Object.assign(initState(), d.s || {});
      st.hist = Array.isArray(d.hist) ? d.hist : [];
      st.era = d.era || (S[d.scene].era || 'casa');
    }
  } catch (e) { /* res */ }
}

function plateSVG(era) {
  const a = 'currentColor';
  if (era === 'estadi') {
    return '<svg viewBox="0 0 110 68" aria-hidden="true"><rect x="4" y="54" width="102" height="6" fill="' + a + '" opacity=".5"/><circle cx="84" cy="44" r="8" fill="' + a + '" opacity=".9"/><path d="M12 54 V18 H50 V54" fill="none" stroke="' + a + '" stroke-width="4"/><path d="M21 18 V54 M30 18 V54 M39 18 V54 M12 28 H50 M12 38 H50 M12 48 H50" fill="none" stroke="' + a + '" stroke-width="1.5" opacity=".5"/></svg>';
  }
  if (era === 'illa') {
    return '<svg viewBox="0 0 110 68" aria-hidden="true"><circle cx="90" cy="16" r="9" fill="' + a + '" opacity=".7"/><path d="M18 60 q27-20 54 0 z" fill="' + a + '" opacity=".6"/><rect x="43" y="22" width="4" height="32" fill="' + a + '" opacity=".9"/><path d="M45 24 q-18-10-26 4 q14-6 26-4 M45 24 q18-10 26 4 q-14-6-26-4 M45 24 q-6-16-20-14 q16 0 20 14 M45 24 q6-16 20-14 q-16 0-20 14" fill="' + a + '" opacity=".85"/><path d="M4 64 q8-6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="' + a + '" stroke-width="3"/></svg>';
  }
  if (era === 'cel') {
    return '<svg viewBox="0 0 110 68" aria-hidden="true"><g fill="' + a + '"><ellipse cx="30" cy="54" rx="24" ry="10" opacity=".5"/><ellipse cx="80" cy="58" rx="26" ry="9" opacity=".5"/><path d="M30 40 h50 l-6 12 h-38 z" opacity=".85"/><rect x="38" y="26" width="34" height="14" rx="3" opacity=".6"/><circle cx="94" cy="14" r="6" opacity=".6"/></g></svg>';
  }
  return '<svg viewBox="0 0 110 68" aria-hidden="true"><g fill="' + a + '"><path d="M10 34 L55 6 L100 34 Z" opacity=".85"/><rect x="20" y="34" width="70" height="28" opacity=".5"/><rect x="48" y="44" width="14" height="18" opacity=".9"/><rect x="26" y="40" width="12" height="12" opacity=".9"/><rect x="72" y="40" width="12" height="12" opacity=".9"/></g></svg>';
}

function slotSVG(kind, on) {
  const a = 'currentColor';
  const fill = on ? a : 'none';
  const props = 'stroke="' + a + '" stroke-width="3"' + (on ? '' : ' stroke-dasharray="4 3" opacity=".5"');
  let shape;
  if (kind === 1) shape = '<circle cx="16" cy="16" r="10" fill="' + fill + '" ' + props + '/>';
  else if (kind === 2) shape = '<circle cx="16" cy="16" r="10" fill="none" ' + props + '/><circle cx="16" cy="16" r="4" fill="' + fill + '"/>';
  else shape = '<rect x="12" y="3" width="8" height="26" rx="3" fill="' + fill + '" ' + props + '/>';
  return '<svg viewBox="0 0 32 32" aria-hidden="true">' + shape + '</svg>';
}

function hudHTML() {
  const s = st.s;
  const chips = [];
  if (s.obj) chips.push('<span class="chip">' + esc(T(OCHIP[s.obj])) + '</span>');
  if (s.cV) chips.push('<span class="chip">' + esc(T(U.cV)) + '</span>');
  if (s.cT) chips.push('<span class="chip">' + esc(T(U.cT)) + '</span>');
  if (s.cF) chips.push('<span class="chip">' + esc(T(U.cF)) + '</span>');
  if (!chips.length) chips.push('<span class="chip empty">' + esc(T(U.empty)) + '</span>');
  return '<div class="hud">' +
    '<div class="grp"><span class="lbl">' + esc(T(U.pieces)) + '</span>' + slotSVG(1, s.f1) + slotSVG(2, s.f2) + slotSVG(3, s.f3) + '</div>' +
    '<div class="grp"><span class="lbl">' + esc(T(U.pack)) + '</span><span class="chips">' + chips.join('') + '</span></div>' +
    '</div>';
}

function textHTML(arr) {
  return arr.map(function (item) {
    let line = T(item);
    let cls = '';
    const c = line.charAt(0);
    if (c === '>') { cls = 'dlg'; line = line.slice(1); }
    else if (c === '?') { cls = 'riddle'; line = line.slice(1); }
    else if (c === '!') { cls = 'hint'; line = line.slice(1); }
    return '<p' + (cls ? ' class="' + cls + '"' : '') + '>' + hn(line) + '</p>';
  }).join('');
}

    '<label for="nom">' + esc(T(U.nameQ)) + '</label>' +
    '<input id="nom" type="text" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="' + esc(T(U.namePh)) + '">' +
    '<p class="err" id="nom-err" hidden>' + esc(T(U.nameErr)) + '</p>' +

  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });

function render() {
  const app = document.getElementById('app');
  const sc = S[st.scene];
  document.body.dataset.era = st.era;
  document.documentElement.lang = st.lang === 'es' ? 'es' : 'ca';
  document.title = T(TITLE_FULL);
  document.getElementById('brand').textContent = T(TITLE);
  document.getElementById('lang-ca').setAttribute('aria-pressed', String(st.lang === 'ca'));
  document.getElementById('lang-es').setAttribute('aria-pressed', String(st.lang === 'es'));
  document.getElementById('restart').setAttribute('aria-label', T(U.restartLbl));
  if (st.scene === 'intro') { renderIntro(); window.scrollTo(0, 0); return; }

  const tx = typeof sc.text === 'function' ? sc.text(st.s) : sc.text;
  let html = '<section class="card">';
  if (ERA[sc.era] && !sc.ending) {
    html += '<div class="plate">' + plateSVG(sc.era) + '<div class="pn">' + esc(T(ERA[sc.era].n)) + '</div></div>';
  }
  if (!sc.ending) html += hudHTML();
  if (sc.ending) html += '<h2>' + esc(T(sc.title)) + '</h2>';
  html += '<div class="txt">' + textHTML(tx) + '</div>';

  if (sc.ending) {
    html += '<p class="endnote">' + esc(T(U.newEnd)) + ' · ' + esc(T(U.finalsCount(foundCount()))) + '</p>';
    html += '<div class="choices">';
    if (sc.ending === 'bo' || sc.ending === 'heroi') {
      html += '<button class="btn main" data-act="again" type="button">' + esc(T(U.playAgain)) + '</button>';
    } else {
      html += '<button class="btn main" data-act="undo" type="button">' + esc(T(U.backLast)) + '</button>';
      html += '<button class="btn ghost" data-act="again" type="button">' + esc(T(U.again)) + '</button>';
    }
    html += '</div>';
  } else {
    const ch = sc.choices.filter(function (c) { return !c.if || c.if(st.s); });
    html += '<div class="choices">';
    ch.forEach(function (c, i) {
      const label = typeof c.t === 'function' ? c.t(st.s) : c.t;
      html += '<button class="btn" data-i="' + i + '" type="button">' + hn(T(label)) + '</button>';
    });
    html += '</div>';
    if (st.hist.length) html += '<div class="undo"><button class="btn ghost" data-act="undo" type="button">' + esc(T(U.undo)) + '</button></div>';
    app.innerHTML = html + '</section>';
    app.querySelectorAll('button[data-i]').forEach(function (b) {
      b.addEventListener('click', function () { choose(ch[Number(b.dataset.i)]); });
    });
    bindActs(app);
    window.scrollTo(0, 0);
    return;
  }
  app.innerHTML = html + '</section>';
  bindActs(app);
  window.scrollTo(0, 0);
}

function bindActs(app) {
  app.querySelectorAll('button[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.act === 'undo') undo();
      else resetGame();
    });
  });
}

function choose(c) {
  if (locked) return;
  st.hist.push({ scene: st.scene, s: clone(st.s), era: st.era });
  if (st.hist.length > 80) st.hist.shift();
  if (c.set) c.set(st.s);
  const target = typeof c.go === 'function' ? c.go(st.s) : c.go;
  enter(target);
}

function enter(id) {
  const prevEra = st.era;
  let sc = S[id];
  st.scene = id;
  if (sc.onEnter) sc.onEnter(st.s);
  if (st.s.en <= 0 && !sc.ending && id !== 'intro' && S.sabata) { id = 'sabata'; sc = S[id]; st.scene = id; }
  if (sc.era) st.era = sc.era;
  if (sc.ending) st.found[sc.ending] = 1;
  render();
  save();
  if (!sc.ending && sc.era && sc.era !== prevEra && ERA[sc.era] && ERA[sc.era].ch) plof(sc.era);
}

function undo() {
  if (locked) return;
  const h = st.hist.pop();
  if (!h) { resetGame(); return; }
  st.scene = h.scene;
  st.s = Object.assign(initState(), h.s);
  st.era = h.era || (S[h.scene].era || st.era);
  render();
  save();
}

function resetGame() {
  st.s = initState();
  st.hist = [];
  st.scene = 'intro';
  st.era = 'casa';
  render();
  save();
}

function plof(eraKey) {
  const el = document.getElementById('plof');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('plof-dial').textContent = T(ERA[eraKey].n);
  locked = true;
  el.hidden = false;
  setTimeout(function () { el.hidden = true; locked = false; }, reduced ? 500 : 1400);
}

function setLang(l) {
  st.lang = l;
  render();
  save();
}

document.getElementById('lang-ca').addEventListener('click', function () { setLang('ca'); });
document.getElementById('lang-es').addEventListener('click', function () { setLang('es'); });
document.getElementById('restart').addEventListener('click', function () {
  const b = document.getElementById('restart');
  if (!restartArmed) {
    restartArmed = true;
    b.textContent = T(U.restartAsk);
    restartTimer = setTimeout(function () { restartArmed = false; b.textContent = '↻'; }, 2500);
  } else {
    clearTimeout(restartTimer);
    restartArmed = false;
    b.textContent = '↻';
    resetGame();
  }
});

load();
render();
</script>
