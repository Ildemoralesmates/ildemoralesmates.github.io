<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missió Zèfir: Aventura als tres planetes</title>
<meta name="description" content="Aventura als tres planetes / Aventura en los tres planetas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ec; --ink:#241a12; --card:#fffdf8; --muted:#6b5a4a; --line:#e5d8c3;
  --accent:#6b44a8; --on-accent:#ffffff; --danger:#a3361f;
  --font-title:"Grandstander","Trebuchet MS",system-ui,sans-serif;
  --font-read:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --font-dial:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16110c; --ink:#f3e9d8; --card:#211a13; --muted:#b8a78f; --line:#3a2e22; --danger:#ff9b85;
  }
}
:root[data-theme="dark"]{
  --bg:#16110c; --ink:#f3e9d8; --card:#211a13; --muted:#b8a78f; --line:#3a2e22; --danger:#ff9b85;
}
body[data-era="nau"]{--accent:#6b44a8}
body[data-era="glacia"]{--accent:#1f6f9a}
body[data-era="fongaria"]{--accent:#1f7a4a}
body[data-era="estacio"]{--accent:#a35a12}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-read);line-height:1.55;transition:background .3s}
.top{max-width:42rem;margin:0 auto;padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--font-title);font-weight:800;color:var(--accent);font-size:1.05rem}
.tools{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--font-title);font-weight:700;font-size:.9rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.35rem .8rem;cursor:pointer;min-height:2.4rem}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:42rem;margin:0 auto;padding:0 1rem 3rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:1.2rem;padding:1.1rem 1.1rem 1.3rem;box-shadow:0 2px 0 var(--line)}
.plate{display:flex;gap:.8rem;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:.7rem;margin-bottom:.8rem}
.plate svg{flex:0 0 auto;width:5.5rem;height:3.4rem;color:var(--accent)}
.plate .pn{font-family:var(--font-title);font-weight:800;color:var(--accent);font-size:1.1rem;line-height:1.2}
.hud{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin:.2rem 0 1rem;font-size:.95rem}
.hud .grp{display:flex;align-items:center;gap:.4rem}
.hud .lbl{font-family:var(--font-title);font-weight:700;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
.hud svg{width:1.7rem;height:1.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.9rem;border:2px solid var(--line);border-radius:999px;padding:.1rem .6rem;background:var(--bg)}
.chip.empty{color:var(--muted);border-style:dashed}
.txt p{font-size:1.2rem;margin:.7rem 0}
.txt p.dlg{padding-left:.9rem;border-left:4px solid var(--accent)}
.txt p.riddle{font-family:var(--font-title);font-weight:700;background:color-mix(in srgb,var(--accent) 14%,var(--card));border-radius:.8rem;padding:.7rem .9rem}
.txt p.hint{color:var(--muted);font-style:italic;font-size:1.05rem}
.gl{text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:.2em}
.dieWrap{display:flex;justify-content:center;margin:.2rem 0 .6rem;color:var(--accent)}
.die{width:5.5rem;height:5.5rem;animation:roll .7s ease-out both}
@keyframes roll{0%{transform:rotate(-220deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.glos dt{font-family:var(--font-title);font-weight:800;color:var(--accent);margin-top:.9rem;font-size:1.15rem}
.glos dd{margin:.1rem 0 0;font-size:1.1rem}
.choices{display:flex;flex-direction:column;gap:.7rem;margin-top:1.2rem}
.btn{font-family:var(--font-title);font-weight:700;font-size:1.15rem;line-height:1.3;text-align:left;border:3px solid var(--accent);background:var(--card);color:var(--ink);border-radius:1rem;padding:.8rem 1rem;min-height:3.4rem;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.btn:active{transform:scale(.985)}
.btn.main{background:var(--accent);color:var(--on-accent);text-align:center}
.btn.main:hover{background:var(--accent);filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);font-size:1rem;min-height:2.8rem;font-weight:500;text-align:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.undo{margin-top:1rem;text-align:center}
h1{font-family:var(--font-title);font-weight:800;font-size:2rem;line-height:1.1;margin:.2rem 0 .3rem;color:var(--accent)}
h2{font-family:var(--font-title);font-weight:800;font-size:1.6rem;line-height:1.15;margin:.2rem 0 .6rem;color:var(--accent)}
.sub{font-family:var(--font-title);font-size:1.2rem;color:var(--muted);margin:.1rem 0 1rem}
.intro ul{padding-left:1.2rem;font-size:1.1rem}
.intro li{margin:.4rem 0}
.intro label{display:block;font-family:var(--font-title);font-weight:700;font-size:1.1rem;margin:1.1rem 0 .4rem}
.intro input{width:100%;font:inherit;font-size:1.3rem;padding:.7rem .9rem;border:3px solid var(--line);border-radius:.9rem;background:var(--bg);color:var(--ink)}
.intro input:focus{border-color:var(--accent)}
.err{color:var(--danger);font-weight:700;margin:.5rem 0 0}
.counter{margin-top:1rem;text-align:center;color:var(--muted);font-family:var(--font-dial);font-size:.95rem}
.endnote{font-family:var(--font-dial);color:var(--muted);margin-top:1rem;font-size:.95rem}
#plof{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:color-mix(in srgb,var(--accent) 88%,#000);color:#fff;text-align:center;padding:1rem}
#plof .big{font-family:var(--font-title);font-weight:800;font-size:3.4rem;animation:pop .5s ease-out both}
#plof svg{width:6rem;height:6rem;animation:spin 1.4s linear infinite}
#plof .dial{font-family:var(--font-dial);font-size:1.15rem;border:2px solid #fff;border-radius:.6rem;padding:.4rem .9rem}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  #plof svg,#plof .big,.die{animation:none}
  .btn{transition:none}
}
@media (max-width:30rem){
  h1{font-size:1.7rem}
  .plate svg{width:4.4rem}
}
</style>
</head>
<body data-era="nau">
<header class="top">
  <div class="brand" id="brand">Missió Zèfir</div>
  <div class="tools">
    <button class="pill" id="glos" type="button" aria-pressed="false">Paraules</button>
    <button class="pill" id="lang-ca" aria-pressed="true" type="button">VAL</button>
    <button class="pill" id="lang-es" aria-pressed="false" type="button">CAS</button>
    <button class="pill" id="restart" type="button" aria-label="Començar de nou">↻</button>
  </div>
</header>
<main id="app"></main>
<div id="plof" hidden role="status" aria-live="polite">
  <div class="big">¡PLOF!</div>
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="45" cy="45" r="30" fill="none" stroke="#fff" stroke-width="7"/><line x1="67" y1="67" x2="92" y2="92" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="45" cy="45" r="4" fill="#fff"/></svg>
  <div class="dial" id="plof-dial"></div>
</div>

<script>
/* ============ DADES ============ */
const KEY = 'mision-zefir-tres-planetas-v1';
const x = (ca, es) => ({ ca: ca, es: es });
const num = (v) => x(String(v), String(v));

const TITLE = x(`Missió Zèfir`, `Misión Céfiro`);
const DESC  = x(`Aventura als tres planetes`, `Aventura en los tres planetas`);
const TITLE_FULL = x(`Missió Zèfir: Aventura als tres planetes`, `Misión Céfiro: Aventura en los tres planetas`);

const ON = {
  imant: x(`la carta Imant`, `la carta Imán`),
  tradu: x(`la carta Traductor`, `la carta Traductor`),
  escut: x(`la carta Escut`, `la carta Escudo`)
};
const OCHIP = {
  imant: x(`Carta Imant`, `Carta Imán`),
  tradu: x(`Carta Traductor`, `Carta Traductor`),
  escut: x(`Carta Escut`, `Carta Escudo`)
};
const ERA = {
  nau:      { ch: false, n: x(`Pròleg · La nau Zèfir`, `Prólogo · La nave Céfiro`) },
  glacia:   { ch: true,  n: x(`Capítol 1 · Glàcia, el planeta de gel`, `Capítulo 1 · Glacia, el planeta de hielo`) },
  fongaria: { ch: true,  n: x(`Capítol 2 · Fongària, el bosc de bolets`, `Capítulo 2 · Fongaria, el bosque de setas`) },
  estacio:  { ch: true,  n: x(`Capítol 3 · L'Estació Rellotge`, `Capítulo 3 · La Estación Reloj`) }
};

const ALL_ENDINGS = ['fin_sesta', 'fin_gel', 'fin_melassa', 'fin_bolet', 'fin_flama', 'fin_bucle'];   // todos los finales salvo 'bo' y 'heroi'
const TOTAL_FINALS = ALL_ENDINGS.length + 2;

const GLOS = [
  { ca: { t: `asteroide`, re: `asteroides?`, d: `Roca gran que viatja per l'espai.` },
    es: { t: `asteroide`, re: `asteroides?`, d: `Roca grande que viaja por el espacio.` } },
  { ca: { t: `nucli`, re: `nucli`, d: `La part central i més important d'una cosa.` },
    es: { t: `núcleo`, re: `núcleo`, d: `La parte central y más importante de algo.` } },
  { ca: { t: `òrbita`, re: `òrbita`, d: `Camí corbat que fa una nau o un astre al voltant d'un planeta o d'una estrella.` },
    es: { t: `órbita`, re: `órbitas?`, d: `Camino curvo que sigue una nave o un astro alrededor de un planeta o de una estrella.` } },
  { ca: { t: `glacera`, re: `glacer(?:a|es)`, d: `Riu enorme de gel que es mou molt a poc a poc.` },
    es: { t: `glaciar`, re: `glaciar(?:es)?`, d: `Río enorme de hielo que se mueve muy despacio.` } },
  { ca: { t: `múltiple`, re: `múltiples?`, d: `Nombre que ix de la taula d'un altre: 6, 12, 18... són múltiples de 6.` },
    es: { t: `múltiplo`, re: `múltiplos?`, d: `Número que sale de la tabla de otro: 6, 12, 18... son múltiplos de 6.` } },
  { ca: { t: `bioluminescent`, re: `bioluminescents?`, d: `Que fa llum pròpia, com les cuques de llum.`},
    es: { t: `bioluminiscente`, re: `bioluminiscentes?`, d: `Que produce luz propia, como las luciérnagas.` } },
  { ca: { t: `espora`, re: `espor(?:a|es)`, d: `Gra menut amb què es reprodueixen els bolets.` },
    es: { t: `espora`, re: `esporas?`, d: `Grano diminuto con el que se reproducen las setas.` } },
  { ca: { t: `peatge`, re: `peatge`, d: `Pagament per a poder passar per un camí.` },
    es: { t: `peaje`, re: `peaje`, d: `Pago por poder pasar por un camino.` } },
  { ca: { t: `perímetre`, re: `perímetre`, d: `Mesura del voltant d'una figura: la suma de tots els seus costats.` },
    es: { t: `perímetro`, re: `perímetro`, d: `Medida del contorno de una figura: la suma de todos sus lados.` } },
  { ca: { t: `reactor`, re: `reactor`, d: `Màquina que produeix l'energia d'una nau o d'una estació.` },
    es: { t: `reactor`, re: `reactor`, d: `Máquina que produce la energía de una nave o de una estación.` } }
];

const U = {
  start: x(`Començar l'aventura`, `Empezar la aventura`),
  nameQ: x(`Com et diuen?`, `¿Cómo te llamas?`),
  nameErr: x(`Escriu el teu nom per a començar.`, `Escribe tu nombre para empezar.`),
  namePh: x(`El teu nom`, `Tu nombre`),
  pieces: x(`Peces del motor`, `Piezas del motor`),
  pack: x(`Motxilla`, `Mochila`),
  empty: x(`buida`, `vacía`),
  undo: x(`↶ Tornar a la decisió anterior`, `↶ Volver a la decisión anterior`),
  backLast: x(`Tornar a l'última decisió`, `Volver a la última decisión`),
  again: x(`Començar de nou`, `Empezar de nuevo`),
  playAgain: x(`Tornar a jugar`, `Jugar otra vez`),
  restartAsk: x(`Toca de nou per a reiniciar`, `Toca de nuevo para reiniciar`),
  restartLbl: x(`Començar de nou`, `Empezar de nuevo`),
  finalsCount: (n) => x(`Finals descoberts: ${n} de ${TOTAL_FINALS}`, `Finales descubiertos: ${n} de ${TOTAL_FINALS}`),
  newEnd: x(`Final descobert!`, `¡Final descubierto!`),
  glosBtn: x(`Paraules`, `Palabras`),
  glosTitle: x(`Paraules noves`, `Palabras nuevas`),
  glosBack: x(`Tornar a l'aventura`, `Volver a la aventura`),
  dieLbl: x(`Dau`, `Dado`)
};

/* Pistes de les proves de càlcul (es mostren si falles; no bloquegen) */
const OOPS = {
  m6: x(`Pista: els múltiples de 6 són els de la taula del 6: 6, 12, 18, 24, 30. Ni el 16 ni el 20 hi són.`,
        `Pista: los múltiplos de 6 son los de la tabla del 6: 6, 12, 18, 24, 30. Ni el 16 ni el 20 están.`),
  m56: x(`Pista: 8 files de 7 és 8 × 7. Prova amb 7 × 10 − 7 × 2.`,
         `Pista: 8 filas de 7 es 8 × 7. Prueba con 7 × 10 − 7 × 2.`),
  m185: x(`Pista: suma primer les unitats: 8 + 7 = 15. Escrius 5 i te'n portes 1; després, les desenes.`,
          `Pista: suma primero las unidades: 8 + 7 = 15. Escribes 5 y te llevas 1; después, las decenas.`),
  m25: x(`Pista: primer calcula 5 × 9 = 45, i després resta els 20 que s'han venut.`,
         `Pista: primero calcula 5 × 9 = 45, y después resta los 20 que se han vendido.`),
  m36: x(`Pista: 3 cordes de 12 nusos és 3 × 12. Pensa en 3 × 10 i 3 × 2.`,
         `Pista: 3 cuerdas de 12 nudos es 3 × 12. Piensa en 3 × 10 y 3 × 2.`),
  m30: x(`Pista: el perímetre és la suma de tots els costats: 9 + 6 + 9 + 6.`,
         `Pista: el perímetro es la suma de todos los lados: 9 + 6 + 9 + 6.`),
  mhora: x(`Pista: de les 3:45 a les 4:00 passen 15 minuts. Encara et falten 40 − 15 minuts.`,
           `Pista: de las 3:45 a las 4:00 pasan 15 minutos. Todavía te faltan 40 − 15 minutos.`),
  mflames: x(`Pista: compta de 12 en 12 fins arribar al 60: 12, 24, 36...`,
             `Pista: cuenta de 12 en 12 hasta llegar al 60: 12, 24, 36...`),
  mpalpes: x(`Pista: a cada pas se sumen 7 més: 7, 14, 21, i després...`,
             `Pista: en cada paso se suman 7 más: 7, 14, 21, y después...`),
  mhora2: x(`Pista: les 9:00 més una hora són les 10:00. Falta només mitja hora.`,
            `Pista: las 9:00 más una hora son las 10:00. Falta solo media hora.`),
  m100: x(`Pista: repartir 100 entre 4 és dividir 100 ÷ 4. Quin nombre repetit quatre vegades fa 100?`,
          `Pista: repartir 100 entre 4 es dividir 100 ÷ 4. ¿Qué número repetido cuatro veces da 100?`)
};
const bad = (k, back) => (s => { s.oops = k; s.back = back; });
function lliure(s) {
  s.llum = 1;
  if (s.pagat) { s.obj = s.pagat; s.pagat = null; s.retornat = 1; }
}

const S = {

intro: { era: 'nau', text: [], choices: [] },

/* ---------- PRÒLEG ---------- */
pro: { era: 'nau',
  text: [
    x(`La nau ZÈFIR viatja en silenci entre les estrelles. De sobte, ¡BRRRUM! Un asteroide enorme passa tan prop del casc que tota la nau tremola.`,
      `La nave CÉFIRO viaja en silencio entre las estrellas. De repente, ¡BRRRUM! Un asteroide enorme pasa tan cerca del casco que toda la nave tiembla.`),
    x(`Quan s'acaba el terrabastall, el nucli del motor estel·lar s'ha trencat en tres peces. Les tres han eixit disparades cap a tres planetes diferents. Sense motor, la nau només pot donar voltes i voltes en una òrbita.`,
      `Cuando termina el estruendo, el núcleo del motor estelar se ha roto en tres piezas. Las tres han salido disparadas hacia tres planetas distintos. Sin motor, la nave solo puede dar vueltas y vueltas en una órbita.`),
    x(`{nom}, l'alarma roja parpelleja. Alguna cosa es belluga darrere d'una caixa de càrrega.`,
      `{nom}, la alarma roja parpadea. Algo se mueve detrás de una caja de carga.`),
    x(`>—Ai, ai, ai! Qui la fa, l'espera... però si jo no he fet res! —diu una veueta.`,
      `>—¡Ay, ay, ay! Quien la hace, la paga... ¡pero si yo no he hecho nada! —dice una vocecita.`),
    x(`Té tres ulls, dues antenes i un cinturó ple de butxaques. És ZUMET, un alienígena menut que es va colar a la bodega perquè allà hi havia galetes.`,
      `Tiene tres ojos, dos antenas y un cinturón lleno de bolsillos. Es ZUMET, un alienígena pequeñito que se coló en la bodega porque allí había galletas.`),
    x(`>—Sóc Zumet! Qui té un amic, té un tresor, i tu acabes de guanyar un tresor.`,
      `>—¡Soy Zumet! Quien tiene un amigo, tiene un tesoro, y tú acabas de ganar un tesoro.`),
    x(`Zumet sap moltes coses, però només parla en refranys. Al costat hi ha una caixa amb tres cartes d'eina i una butaca molt còmoda que sembla dir-te: «Seu un poquet, ja ho arreglarà algú».`,
      `Zumet sabe muchas cosas, pero solo habla en refranes. Al lado hay una caja con tres cartas de herramienta y una butaca muy cómoda que parece decirte: «Siéntate un ratito, ya lo arreglará alguien».`)
  ],
  choices: [
    { t: x(`Obrir la caixa de cartes`, `Abrir la caja de cartas`), go: 'cartes' },
    { t: x(`Fer una becaineta a la butaca`, `Echar una cabezadita en la butaca`), go: 'fin_sesta' }
  ] },

cartes: { era: 'nau',
  text: [
    x(`Dins de la caixa hi ha tres cartes brillants. Només en pots portar una. Tria bé!`,
      `Dentro de la caja hay tres cartas brillantes. Solo puedes llevarte una. ¡Elige bien!`),
    x(`CARTA IMANT: atrau tot el que és de metall, de lluny i amb molta força.`,
      `CARTA IMÁN: atrae todo lo que es de metal, desde lejos y con mucha fuerza.`),
    x(`CARTA TRADUCTOR: entén qualsevol idioma, fins i tot el dels bolets.`,
      `CARTA TRADUCTOR: entiende cualquier idioma, incluso el de las setas.`),
    x(`CARTA ESCUT: crea un camp de força que aguanta la calor i els colps.`,
      `CARTA ESCUDO: crea un campo de fuerza que aguanta el calor y los golpes.`),
    x(`>—Cada cosa al seu temps, i cada carta al seu planeta —diu Zumet, tocant-se el nas amb una antena.`,
      `>—Cada cosa a su tiempo, y cada carta en su planeta —dice Zumet, tocándose la nariz con una antena.`)
  ],
  choices: [
    { t: x(`Agafar la carta Imant`, `Coger la carta Imán`), go: 'c1_arribada', set: s => { s.obj = 'imant'; } },
    { t: x(`Agafar la carta Traductor`, `Coger la carta Traductor`), go: 'c1_arribada', set: s => { s.obj = 'tradu'; } },
    { t: x(`Agafar la carta Escut`, `Coger la carta Escudo`), go: 'c1_arribada', set: s => { s.obj = 'escut'; } }
  ] },

/* ---------- CAPÍTOL 1 · GLÀCIA ---------- */
c1_arribada: { era: 'glacia',
  text: [
    x(`¡PLOF! La nau aterra a GLÀCIA, un planeta cobert de gel blau. Fa tant de fred que l'alé es converteix en núvols menuts.`,
      `¡PLOF! La nave aterriza en GLACIA, un planeta cubierto de hielo azul. Hace tanto frío que el aliento se convierte en nubecitas.`),
    x(`Lluny hi ha una glacera immensa, com un riu de gel que no es mou. Més avall, un llac gelat brilla davall dos sols.`,
      `A lo lejos hay un glaciar inmenso, como un río de hielo que no se mueve. Más abajo, un lago helado brilla bajo dos soles.`),
    x(`>—A poc a poc s'anirà lluny, però els peus em tremolen més de pressa —diu Zumet, saltant d'una cama a l'altra.`,
      `>—Despacio se va lejos, pero los pies me tiemblan más deprisa —dice Zumet, saltando de una pierna a otra.`),
    x(`El detector de la nau marca que la primera peça està dins d'una cova de gel, al fons de la vall. Hi ha dos camins.`,
      `El detector de la nave marca que la primera pieza está dentro de una cueva de hielo, al fondo del valle. Hay dos caminos.`)
  ],
  choices: [
    { t: x(`Pujar per la glacera`, `Subir por el glaciar`), go: 'c1_glacera' },
    { t: x(`Creuar el llac gelat`, `Cruzar el lago helado`), go: 'c1_llac' }

function T(v) { return (v && typeof v === 'object') ? v[st.lang] : v; }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function glossHL(t) {
  GLOS.forEach(function (g) {
    const re = new RegExp('(?<![\\p{L}])(' + g[st.lang].re + ')(?![\\p{L}])', 'giu');
    t = t.replace(re, '<span class="gl">$1</span>');
  });
  return t;
}

  let t = esc(text);
  t = t.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, function (m, a, b) { return st.s.gen === 'f' ? b : a; });
  t = t.replace(/\{nom\}/g, '<b>' + esc(String(st.s.nom || '').toUpperCase()) + '</b>');
  t = t.replace(/(?<![\p{L}])(Zumet|Floc|Rovelló|Lluerna|Tictac)(?![\p{L}])/gu, function (m) { return '<b>' + m.toUpperCase() + '</b>'; });
  return glossHL(t);
}

function foundCount() {
  let n = 0;
  ALL_ENDINGS.forEach(function (k) { if (st.found[k]) n++; });
  if (st.found.bo) n++;
  if (st.found.heroi) n++;
  return n;
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ scene: st.scene, s: st.s, hist: st.hist.slice(-40), found: st.found, lang: st.lang, era: st.era }));
  } catch (e) { /* sense emmagatzematge */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.lang === 'ca' || d.lang === 'es') st.lang = d.lang;
    if (d.found && typeof d.found === 'object') st.found = d.found;
    if (d.scene && S[d.scene]) {
      st.scene = d.scene;
      st.s = Object.assign(initState(), d.s || {});
      st.hist = Array.isArray(d.hist) ? d.hist : [];
      st.era = (d.era && ERA[d.era]) ? d.era : (S[d.scene].era || 'nau');
    }
  } catch (e) { /* res */ }
}

function plateSVG(era) {
  const a = 'currentColor';
  if (era === 'glacia') {
    return '<svg viewBox="0 0 110 68" aria-hidden="true"><g fill="' + a + '"><path d="M4 62 L28 22 L42 46 L58 14 L84 62 Z" opacity=".85"/><path d="M58 14 L50 30 L58 26 L64 32 Z" fill="var(--card)" opacity=".9"/><path d="M84 62 L96 38 L106 62 Z" opacity=".55"/><circle cx="14" cy="12" r="3" opacity=".6"/><circle cx="96" cy="14" r="2" opacity=".6"/></g><rect x="2" y="62" width="106" height="4" fill="' + a + '"/></svg>';
  }
  if (era === 'fongaria') {
    return '<svg viewBox="0 0 110 68" aria-hidden="true"><g fill="' + a + '"><path d="M14 42 Q34 10 54 42 Z" opacity=".9"/><rect x="30" y="42" width="8" height="20" opacity=".6"/><path d="M60 52 Q76 26 92 52 Z" opacity=".75"/><rect x="72" y="52" width="6" height="10" opacity=".6"/><circle cx="30" cy="30" r="3" fill="var(--card)"/><circle cx="42" cy="26" r="2.4" fill="var(--card)"/><circle cx="78" cy="42" r="2.2" fill="var(--card)"/></g><rect x="2" y="62" width="106" height="4" fill="' + a + '"/></svg>';
  }
  if (era === 'estacio') {
    return '<svg viewBox="0 0 110 68" aria-hidden="true"><g fill="none" stroke="' + a + '" stroke-linecap="round"><circle cx="55" cy="34" r="22" stroke-width="5"/><path d="M55 34 L55 20 M55 34 L66 40" stroke-width="4"/><ellipse cx="55" cy="34" rx="46" ry="12" stroke-width="3" opacity=".5" transform="rotate(-18 55 34)"/></g></svg>';
  }
  return '<svg viewBox="0 0 110 68" aria-hidden="true"><g fill="' + a + '"><path d="M55 4 C70 16 72 34 66 48 L44 48 C38 34 40 16 55 4 Z" opacity=".9"/><circle cx="55" cy="26" r="6" fill="var(--card)"/><path d="M44 40 L30 56 L44 52 Z" opacity=".7"/><path d="M66 40 L80 56 L66 52 Z" opacity=".7"/><path d="M48 52 L55 66 L62 52 Z" opacity=".45"/><circle cx="14" cy="14" r="2"/><circle cx="96" cy="20" r="2"/><circle cx="90" cy="54" r="1.6"/><circle cx="18" cy="48" r="1.6"/></g></svg>';
}

function slotSVG(kind, on) {
  const a = 'currentColor';
  const fill = on ? a : 'none';
  const props = 'stroke="' + a + '" stroke-width="3"' + (on ? '' : ' stroke-dasharray="4 3" opacity=".5"');
  let shape;
  if (kind === 1) shape = '<circle cx="16" cy="16" r="10" fill="' + fill + '" ' + props + '/>';
  else if (kind === 2) shape = '<circle cx="16" cy="16" r="10" fill="none" ' + props + '/><circle cx="16" cy="16" r="4" fill="' + fill + '"/>';
  else shape = '<rect x="12" y="3" width="8" height="26" rx="3" fill="' + fill + '" ' + props + '/>';
  return '<svg viewBox="0 0 32 32" aria-hidden="true">' + shape + '</svg>';
}

function dieHTML(n) {
  const P = {
    1: [[50, 50]],
    2: [[28, 28], [72, 72]],
    3: [[28, 28], [50, 50], [72, 72]],
    4: [[28, 28], [72, 28], [28, 72], [72, 72]],
    5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]],
    6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]]
  }[n] || [];
  return '<div class="dieWrap" role="img" aria-label="' + esc(T(U.dieLbl)) + ' ' + n + '"><svg class="die" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="16" fill="var(--card)" stroke="currentColor" stroke-width="5"/>' +
    P.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="8" fill="currentColor"/>'; }).join('') + '</svg></div>';
}

function hudHTML() {
  const s = st.s;
  const chips = [];
  if (s.obj) chips.push('<span class="chip">' + esc(T(OCHIP[s.obj])) + '</span>');
  if (s.floc) chips.push('<span class="chip">Floc</span>');
  if (s.llum) chips.push('<span class="chip">Lluerna</span>');
  if (s.rell) chips.push('<span class="chip">Tictac</span>');
  if (!chips.length) chips.push('<span class="chip empty">' + esc(T(U.empty)) + '</span>');
  return '<div class="hud">' +
    '<div class="grp"><span class="lbl">' + esc(T(U.pieces)) + '</span>' + slotSVG(1, s.f1) + slotSVG(2, s.f2) + slotSVG(3, s.f3) + '</div>' +
    '<div class="grp"><span class="lbl">' + esc(T(U.pack)) + '</span><span class="chips">' + chips.join('') + '</span></div>' +
    '</div>';
}

function textHTML(arr) {
  return arr.map(function (item) {
    let line = T(item);
    let cls = '';
    const c = line.charAt(0);
    if (c === '>') { cls = 'dlg'; line = line.slice(1); }
    else if (c === '?') { cls = 'riddle'; line = line.slice(1); }
    else if (c === '!') { cls = 'hint'; line = line.slice(1); }
    return '<p' + (cls ? ' class="' + cls + '"' : '') + '>' + hn(line) + '</p>';
  }).join('');
}

function renderIntro() {
  const app = document.getElementById('app');
  const l = st.lang;
  const body = {
    ca: {
      hola: `Hola! Ací decideixes tu què passa. Al final de cada escena triaràs què fer, i la història canviarà segons el que triïs.`,
      li: [
        `<b>Peces del motor:</b> n'hi ha tres i les has de trobar totes. Les veuràs a dalt de cada pantalla.`,
        `<b>Motxilla:</b> ací es guarden la carta d'eina que triaràs a l'inici i els amics que faces pel camí. Algunes cartes obrin camins.`,
        `<b>Dau:</b> de tant en tant tiraràs un dau. Si la tirada és baixa, el camí es complica, però això no et fa perdre.`,
        `<b>Càlcul:</b> hi ha moltes proves de matemàtiques. Si falles, rebràs una pista i ho podràs tornar a provar.`,
        `<b>Paraules noves:</b> les paraules amb puntets per baix s'expliquen al botó «Paraules», dalt a la dreta.`,
        `<b>Finals:</b> hi ha ${TOTAL_FINALS} finals diferents. A veure quants descobreixes!`,
        `Sempre pots tornar a l'última decisió amb el botó ↶.`
      ]
    },
    es: {
      hola: `¡Hola! Aquí decides tú qué pasa. Al final de cada escena elegirás qué hacer, y la historia cambiará según lo que elijas.`,
      li: [
        `<b>Piezas del motor:</b> hay tres y tienes que encontrarlas todas. Las verás arriba en cada pantalla.`,
        `<b>Mochila:</b> aquí se guardan la carta de herramienta que elegirás al principio y los amigos que hagas por el camino. Algunas cartas abren caminos.`,
        `<b>Dado:</b> de vez en cuando tirarás un dado. Si sale un número bajo, el camino se complica, pero eso no te hace perder.`,
        `<b>Cálculo:</b> hay muchas pruebas de matemáticas. Si fallas, recibirás una pista y podrás volver a intentarlo.`,
        `<b>Palabras nuevas:</b> las palabras con puntitos por debajo se explican en el botón «Palabras», arriba a la derecha.`,
        `<b>Finales:</b> hay ${TOTAL_FINALS} finales distintos. ¡A ver cuántos descubres!`,
        `Siempre puedes volver a la última decisión con el botón ↶.`
      ]
    }
  }[l];
  app.innerHTML =
    '<section class="card intro">' +
    '<h1>' + esc(T(TITLE)) + '</h1>' +
    '<p class="sub">' + esc(T(DESC)) + '</p>' +
    '<p style="font-size:1.15rem">' + body.hola + '</p>' +
    '<ul>' + body.li.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
    '<label for="nom">' + esc(T(U.nameQ)) + '</label>' +
    '<input id="nom" type="text" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="' + esc(T(U.namePh)) + '">' +
    '<p class="err" id="nom-err" hidden>' + esc(T(U.nameErr)) + '</p>' +
    '<div class="choices"><button class="btn main" id="go-start" type="button">' + esc(T(U.start)) + '</button></div>' +
    '<p class="counter">' + esc(T(U.finalsCount(foundCount()))) + '</p>' +
    '</section>';
  const input = document.getElementById('nom');
  const err = document.getElementById('nom-err');
  function go() {
    const v = input.value.replace(/[<>&"'`{}|]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20);
    if (!v) { err.hidden = false; input.focus(); return; }
    st.s = initState();
    st.s.nom = v;
    st.hist = [];
    enter('pro');
  }
  document.getElementById('go-start').addEventListener('click', go);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  input.addEventListener('input', function () { err.hidden = true; });
}

function renderGlos() {
  const app = document.getElementById('app');
  app.innerHTML = '<section class="card"><h2>' + esc(T(U.glosTitle)) + '</h2><dl class="glos">' +
    GLOS.map(function (g) { return '<dt>' + esc(g[st.lang].t) + '</dt><dd>' + esc(g[st.lang].d) + '</dd>'; }).join('') +
    '</dl><div class="choices"><button class="btn main" id="glos-close" type="button">' + esc(T(U.glosBack)) + '</button></div></section>';
  document.getElementById('glos-close').addEventListener('click', function () { st.glos = false; render(); });
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById('app');
  const sc = S[st.scene];
  document.body.dataset.era = st.era;
  document.documentElement.lang = st.lang === 'es' ? 'es' : 'ca';
  document.title = T(TITLE_FULL);
  document.getElementById('brand').textContent = T(TITLE);
  document.getElementById('lang-ca').setAttribute('aria-pressed', String(st.lang === 'ca'));
  document.getElementById('lang-es').setAttribute('aria-pressed', String(st.lang === 'es'));
  document.getElementById('restart').setAttribute('aria-label', T(U.restartLbl));
  const gb = document.getElementById('glos');
  gb.textContent = T(U.glosBtn);
  gb.setAttribute('aria-pressed', String(st.glos));
  if (st.glos) { renderGlos(); return; }
  if (st.scene === 'intro') { renderIntro(); window.scrollTo(0, 0); return; }

  const tx = typeof sc.text === 'function' ? sc.text(st.s) : sc.text;
  let html = '<section class="card">';
  if (ERA[sc.era] && !sc.ending) {
    html += '<div class="plate">' + plateSVG(sc.era) + '<div class="pn">' + esc(T(ERA[sc.era].n)) + '</div></div>';
  }
  if (!sc.ending) html += hudHTML();
  if (sc.ending) html += '<h2>' + esc(T(sc.title)) + '</h2>';
  if (sc.die && st.s.dado) html += dieHTML(st.s.dado);
  html += '<div class="txt">' + textHTML(tx) + '</div>';

  if (sc.ending) {
    html += '<p class="endnote">' + esc(T(U.newEnd)) + ' · ' + esc(T(U.finalsCount(foundCount()))) + '</p>';
    html += '<div class="choices">';
    if (sc.ending === 'bo' || sc.ending === 'heroi') {
      html += '<button class="btn main" data-act="again" type="button">' + esc(T(U.playAgain)) + '</button>';
    } else {
      html += '<button class="btn main" data-act="undo" type="button">' + esc(T(U.backLast)) + '</button>';
      html += '<button class="btn ghost" data-act="again" type="button">' + esc(T(U.again)) + '</button>';
    }
    html += '</div>';
  } else {
    const ch = sc.choices.filter(function (c) { return !c.if || c.if(st.s); });
    html += '<div class="choices">';
    ch.forEach(function (c, i) {
      const label = typeof c.t === 'function' ? c.t(st.s) : c.t;
      html += '<button class="btn" data-i="' + i + '" type="button">' + hn(T(label)) + '</button>';
    });
    html += '</div>';
    if (st.hist.length) html += '<div class="undo"><button class="btn ghost" data-act="undo" type="button">' + esc(T(U.undo)) + '</button></div>';
    app.innerHTML = html + '</section>';
    app.querySelectorAll('button[data-i]').forEach(function (b) {
      b.addEventListener('click', function () { choose(ch[Number(b.dataset.i)]); });
    });
    bindActs(app);
    window.scrollTo(0, 0);
    return;
  }
  app.innerHTML = html + '</section>';
  bindActs(app);
  window.scrollTo(0, 0);
}

function bindActs(app) {
  app.querySelectorAll('button[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.act === 'undo') undo();
      else resetGame();
    });
  });
}

function choose(c) {
  if (locked) return;
  st.hist.push({ scene: st.scene, s: clone(st.s), era: st.era });
  if (st.hist.length > 80) st.hist.shift();
  if (c.roll) st.s.dado = 1 + Math.floor(Math.random() * 6);
  if (c.set) c.set(st.s);
  const target = typeof c.go === 'function' ? c.go(st.s) : c.go;
  enter(target);
}

function enter(id) {
  const prevEra = st.era;
  const sc = S[id];
  st.scene = id;
  if (sc.onEnter) sc.onEnter(st.s);
  if (sc.era) st.era = sc.era;
  if (sc.ending) st.found[sc.ending] = 1;
  render();
  save();
  if (!sc.ending && sc.era && sc.era !== prevEra && ERA[sc.era] && ERA[sc.era].ch) plof(sc.era);
}

function undo() {
  if (locked) return;
  const h = st.hist.pop();
  if (!h) { resetGame(); return; }
  st.scene = h.scene;
  st.s = Object.assign(initState(), h.s);
  st.era = h.era || (S[h.scene].era || st.era);
  render();
  save();
}

function resetGame() {
  st.s = initState();
  st.hist = [];
  st.scene = 'intro';
  st.era = 'nau';
  st.glos = false;
  render();
  save();
}

function plof(eraKey) {
  const el = document.getElementById('plof');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('plof-dial').textContent = T(ERA[eraKey].n);
  locked = true;
  el.hidden = false;
  setTimeout(function () { el.hidden = true; locked = false; }, reduced ? 500 : 1400);
}

function setLang(l) {
  st.lang = l;
  render();
  save();
}

document.getElementById('lang-ca').addEventListener('click', function () { setLang('ca'); });
document.getElementById('lang-es').addEventListener('click', function () { setLang('es'); });
document.getElementById('glos').addEventListener('click', function () { st.glos = !st.glos; render(); });
document.getElementById('restart').addEventListener('click', function () {
  const b = document.getElementById('restart');
  if (!restartArmed) {
    restartArmed = true;
    b.textContent = T(U.restartAsk);
    restartTimer = setTimeout(function () { restartArmed = false; b.textContent = '↻'; }, 2500);
  } else {
    clearTimeout(restartTimer);
    restartArmed = false;
    b.textContent = '↻';
    resetGame();
  }
});

load();
render();
</script>
</body>
</html>
