<section class="card">
<div class="row topbar">
  <div class="seg" role="group" aria-label="Mode">
    <button id="modeExp" aria-pressed="true">{{mode_explore}}</button>
    <button id="modeChal" aria-pressed="false">{{mode_challenge}}</button>
  </div>
  <span id="solWrap"><label for="solSel">{{lbl_solute}}:</label> <select id="solSel"></select></span>
  <span id="chalInfo" class="chalinfo" hidden><b id="chalProg"></b> · <span id="chalHints"></span> · <span id="chalPts"></span></span>
</div>

<div id="taskBox" class="idea" hidden>
  <b id="taskTitle"></b>
  <p id="taskText" style="margin:4px 0 8px"></p>
  <div class="row">
    <button class="btn" id="btnCheck">{{btn_check}}</button>
    <button class="btn ghost sm" id="btnHint">{{btn_hint}}</button>
    <button class="btn" id="btnNext" hidden>{{btn_next}}</button>
  </div>
  <div id="taskFb" class="fb" role="status" aria-live="polite"></div>
  <div id="hintBox" class="note" hidden></div>
</div>
<div id="endCard" class="idea ok" hidden>
  <h2 id="endTitle" style="margin:0 0 4px"></h2>
  <p id="endText" style="margin:0 0 8px"></p>
  <button class="btn" id="btnRestart">{{btn_restart}}</button>
</div>

<div class="gridW">
  <div>
    <canvas id="beaker" role="img" aria-label="{{h1}}"></canvas>
    <div class="ctrl"><label for="vol">{{lbl_volume}}: <b id="volOut"></b></label>
      <input type="range" id="vol" min="50" max="500" step="10" value="250"></div>
    <div class="ctrl"><label for="temp">{{lbl_temp}}: <b id="tempOut"></b></label>
      <input type="range" id="temp" min="0" max="100" step="1" value="20"></div>
    <div class="ctrl"><label for="mass">{{lbl_mass}}: <b id="massOut"></b></label>
      <input type="range" id="mass" min="0" max="500" step="0.5" value="0">
      <div class="row">
        <input type="number" id="massNum" min="0" max="3000" step="0.1" value="0" aria-label="{{lbl_mass}} (g)" style="width:100px"> <span class="mut">g</span>
        <button class="btn ghost sm" id="bSub1">{{btn_sub1}}</button>
        <button class="btn ghost sm" id="bAdd1">{{btn_add1}}</button>
        <button class="btn ghost sm" id="bAdd10">{{btn_add10}}</button>
        <button class="btn ghost sm" id="bEmpty">{{btn_empty}}</button>
      </div>
    </div>
  </div>
  <div>
    <h2>{{lens_title}}</h2>
    <canvas id="lens" role="img" aria-label="{{lens_title}}"></canvas>
    <p class="note" style="margin-top:4px">{{lens_note}}</p>
    <h2 style="margin-top:12px">{{sol_title}}</h2>
    <canvas id="solc" role="img" aria-label="{{sol_title}}"></canvas>
    <p class="note" id="solInfo" style="margin-top:4px"></p>
  </div>
</div>

<div id="satMsg" class="idea" role="status" aria-live="polite"></div>
<div class="stats">
  <div class="stat"><span class="k">{{r_gL}}</span><span class="v" id="rG"></span></div>
  <div class="stat"><span class="k">{{r_pct}}</span><span class="v" id="rP"></span></div>
  <div class="stat"><span class="k">{{r_mol}}</span><span class="v" id="rM"></span></div>
</div>
<h3>{{calc_title}}</h3>
<div class="calc mono">
  <div id="cG"></div><div id="cP"></div><div id="cM"></div>
</div>
<p class="note">{{note}}</p>
</section>
