<section class="card">
<div class="row topbar">
  <div class="seg" id="tabs" role="group" aria-label="{{h1}}">
    <button data-t="filt" aria-pressed="true">{{tab_filt}}</button>
    <button data-t="dec" aria-pressed="false">{{tab_dec}}</button>
    <button data-t="dist" aria-pressed="false">{{tab_dist}}</button>
    <button data-t="chrom" aria-pressed="false">{{tab_chrom}}</button>
  </div>
  <span class="mixwrap"><span class="mut">{{lbl_mixture}}:</span>
    <span class="seg" id="mixSeg" role="group" aria-label="{{lbl_mixture}}"><button id="mix0" aria-pressed="true"></button><button id="mix1" aria-pressed="false"></button></span>
  </span>
</div>
<p class="idea" id="principle"></p>

<div class="gw2">
  <div><canvas id="scene" role="img" aria-label="{{h1}}"></canvas></div>
  <div><canvas id="panel" role="img" aria-label="{{h1}}"></canvas></div>
</div>

<div class="ctrl">
  <label for="tl">{{lbl_timeline}}: <b id="stepOut"></b></label>
  <input type="range" id="tl" min="0" max="1000" step="1" value="0">
</div>
<div class="row">
  <button class="btn ghost" id="bPrev">{{btn_prev}}</button>
  <button class="btn" id="bPlay">{{btn_play}}</button>
  <button class="btn ghost" id="bNext">{{btn_next}}</button>
  <button class="btn ghost sm" id="bReset">{{btn_reset}}</button>
</div>

<h3>{{steps_title}}</h3>
<ol id="steps" class="stepsl"></ol>
<div id="result" class="idea ok" hidden></div>
<p class="note">{{note}}</p>
</section>
