<section class="card">
<div class="row topbar">
  <span><label for="subSel">{{lbl_substance}}:</label> <select id="subSel"><option value="water">{{sub_water}}</option><option value="ethanol">{{sub_ethanol}}</option><option value="acetone">{{sub_acetone}}</option><option value="nitrogen">{{sub_nitrogen}}</option><option value="iron">{{sub_iron}}</option></select></span>
  <div class="seg" role="group" aria-label="{{lbl_temp}}">
    <button id="btnCool" aria-pressed="false">{{btn_cool}}</button>
    <button id="btnPause" aria-pressed="true">{{btn_pause}}</button>
    <button id="btnHeat" aria-pressed="false">{{btn_heat}}</button>
  </div>
  <span class="spd"><label for="speed">{{lbl_speed}}</label> <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"> <output id="speedOut">1×</output></span>
  <button class="btn ghost sm" id="btnReset">{{btn_reset}}</button>
</div>

<div class="ctrl">
  <label for="tslider">{{lbl_temp}}: <b id="tOut"></b></label>
  <input type="range" id="tslider" min="-30" max="130" step="1" value="0">
  <p class="note" style="margin-top:2px">{{temp_hint}}</p>
</div>

<div class="gridW">
  <div>
    <h2>{{particles_title}}</h2>
    <canvas id="box" role="img" aria-label="{{particles_title}}"></canvas>
    <label class="chk"><input type="checkbox" id="chkVel"> {{chk_vel}}</label>
  </div>
  <div>
    <h2>{{graph_title}}</h2>
    <canvas id="graph" tabindex="0" role="slider" aria-label="{{graph_title}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
<div class="stats">
  <div class="stat"><span class="k">{{st_temp}}</span><span class="v" id="sT"></span></div>
  <div class="stat"><span class="k">{{st_state}}</span><span class="v" id="sS"></span></div>
  <div class="stat"><span class="k">{{st_energy}}</span><span class="v" id="sE"></span></div>
</div>
<div id="cap" class="idea" aria-live="polite"></div>
  </div>
</div>


<h3>{{q_title}}</h3>
<ul class="qs"><li>{{q1}}</li><li>{{q2}}</li><li>{{q3}}</li></ul>
<p class="note">{{note}}</p>
</section>
