<section class="card">
<div class="row topbar">
  <div class="seg" role="group" aria-label="Mode">
    <button id="modeExp" aria-pressed="true">{{mode_explore}}</button>
    <button id="modeChal" aria-pressed="false">{{mode_challenge}}</button>
  </div>
  <span id="exploreSel"><label for="rxSel">{{lbl_reaction}}:</label> <select id="rxSel"></select></span>
  <span id="chalInfo" class="chalinfo" hidden>
    <b id="chalProg"></b> · <span id="chalHints"></span> · <span id="chalPts"></span>
  </span>
</div>

<div class="gridW">
  <div>
    <canvas id="bal" aria-label="{{h1}}" role="img"></canvas>
    <div id="eq" class="eq" aria-live="polite"></div>
    <div id="legend" class="legend" aria-label="{{legend_title}}"></div>
  </div>
  <div>
    <h2>{{coef_title}}</h2>
    <div id="steppers" class="steppers"></div>
    <div class="row">
      <button class="btn ghost sm" id="btnReset">{{btn_reset}}</button>
      <button class="btn ghost sm" id="btnHint" hidden>{{btn_hint}}</button>
    </div>
    <h2 style="margin-top:14px">{{atoms_title}}</h2>
    <table class="atoms" id="atoms">
      <thead><tr><th>{{th_element}}</th><th>{{th_left}}</th><th>{{th_right}}</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="status" class="idea" role="status" aria-live="polite"></div>
    <div id="hintBox" class="idea" hidden></div>
    <div class="row">
      <button class="btn" id="btnNext" hidden>{{btn_next}}</button>
    </div>
  </div>
</div>

<div id="endCard" class="idea ok" hidden>
  <h2 id="endTitle" style="margin:0 0 4px"></h2>
  <p id="endText" style="margin:0 0 8px"></p>
  <button class="btn" id="btnRestart">{{btn_restart}}</button>
</div>

<div class="idea">{{rule}}</div>
<p class="note">{{note}}</p>
</section>
