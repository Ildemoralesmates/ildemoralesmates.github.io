<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#0d1117;--fg:#c9d1d9;--accent:#58a6ff;--accent2:#f0883e;
  --card:#161b22;--border:#30363d;--btn:#238636;--btn-hover:#2ea043;
  --bad:#da3633;--good:#3fb950;--hero:#d2a8ff;
  --pyros:#f97316;--glacius:#38bdf8;--umbra:#a78bfa;
  --font-title:'Grandstander',cursive;--font-body:'Atkinson Hyperlegible',sans-serif;--font-mono:'Courier Prime',monospace;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f6f8fa;--fg:#1f2328;--card:#fff;--border:#d0d7de;
    --accent:#0969da;--accent2:#bf8700;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f8fa;--fg:#1f2328;--card:#fff;--border:#d0d7de;
  --accent:#0969da;--accent2:#bf8700;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d1117;--fg:#c9d1d9;--card:#161b22;--border:#30363d;
  --accent:#58a6ff;--accent2:#f0883e;
  color-scheme:dark;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--fg);background:var(--bg);line-height:1.6;min-height:100dvh;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  margin:0}
#app{max-width:42rem;margin:0 auto;padding-block:1rem}
header{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);margin-bottom:1rem}
header h1{font-family:var(--font-title);font-size:1.2rem;color:var(--accent)}
#hdr-btns{display:flex;gap:.5rem;align-items:center}
#hdr-btns button{font-family:var(--font-body);font-size:.75rem;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:.4rem;padding:.25rem .5rem;cursor:pointer}
#hdr-btns button.lang-active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chapter-plate{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1rem;margin-bottom:1rem;text-align:center}
.chapter-plate h2{font-family:var(--font-title);font-size:1.4rem;color:var(--accent);margin-bottom:.25rem}
.chapter-plate .sub{font-size:.85rem;opacity:.7}
#objectives{display:flex;gap:.5rem;justify-content:center;margin:1rem 0}
.obj-slot{width:2.5rem;height:2.5rem;border:2px dashed var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:all .3s}
.obj-slot.found{border-style:solid;border-color:var(--good);background:var(--good);color:#fff}
#backpack{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.chip{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:.2rem .6rem;font-size:.8rem;display:inline-flex;align-items:center;gap:.3rem}
.chip .icon{font-size:1rem}
#story{font-size:1.2rem;margin-bottom:1.5rem}
#story p{margin-bottom:.8rem}
#story .dialogue{padding-left:1rem;border-left:3px solid var(--accent);margin:.6rem 0;font-style:italic}
#story .hint{background:var(--card);border-left:3px solid var(--accent2);padding:.5rem .8rem;border-radius:0 .4rem .4rem 0;margin:.6rem 0;font-size:1rem}
#story .riddle{background:var(--card);border:2px dashed var(--accent);padding:.8rem;border-radius:.5rem;margin:.8rem 0;text-align:center;font-family:var(--font-title);font-size:1.1rem}
#choices{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.5rem}
#choices button{font-family:var(--font-title);font-size:1.05rem;padding:.8rem 1.2rem;border:2px solid var(--accent);border-radius:.6rem;background:var(--card);color:var(--fg);cursor:pointer;text-align:left;transition:transform .1s,background .2s;-webkit-tap-highlight-color:transparent}
#choices button:hover,#choices button:focus{background:var(--accent);color:#fff;transform:scale(1.02)}
#choices button.alt{border-color:var(--accent2);font-size:.95rem;opacity:.85}
#ending-box{text-align:center;padding:1.5rem;background:var(--card);border-radius:.75rem;border:2px solid var(--border);margin-bottom:1rem}
#ending-box h2{font-family:var(--font-title);font-size:1.5rem;margin-bottom:.5rem}
#ending-box.bad h2{color:var(--bad)}
#ending-box.good h2{color:var(--good)}
#ending-box.hero h2{color:var(--hero)}
#ending-box p{margin:.5rem 0}
#ending-btns{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
#ending-btns button{font-family:var(--font-title);padding:.7rem;border-radius:.5rem;border:none;cursor:pointer;font-size:1rem}
.btn-undo{background:var(--accent);color:#fff}
.btn-restart{background:var(--border);color:var(--fg)}
.btn-hero{background:var(--hero);color:#000}
#endings-counter{text-align:center;font-size:.85rem;opacity:.7;margin-top:.5rem}
#map-container{margin:1rem 0}
#map-container svg{width:100%;max-width:20rem;margin:0 auto;display:block}
.map-planet{transition:fill .5s}
#intro-screen{text-align:center;padding:2rem 0}
#intro-screen h1{font-family:var(--font-title);font-size:2rem;color:var(--accent);margin-bottom:.5rem}
#intro-screen .subtitle{font-size:1rem;opacity:.7;margin-bottom:1.5rem}
#intro-screen .mechanics{text-align:left;background:var(--card);border-radius:.5rem;padding:1rem;margin:1rem 0;font-size:.95rem;line-height:1.5}
#intro-screen .mechanics li{margin:.3rem 0;list-style:none;padding-left:1.5rem;position:relative}
#intro-screen .mechanics li::before{content:'✦';position:absolute;left:0;color:var(--accent)}
#intro-screen input[type=text]{font-family:var(--font-body);font-size:1.1rem;padding:.6rem 1rem;border:2px solid var(--accent);border-radius:.5rem;background:var(--bg);color:var(--fg);width:100%;max-width:16rem;text-align:center;margin:.8rem 0}
#intro-screen .start-btn{font-family:var(--font-title);font-size:1.3rem;padding:.8rem 2rem;border:none;border-radius:.6rem;background:var(--btn);color:#fff;cursor:pointer;margin-top:1rem;transition:background .2s}
#intro-screen .start-btn:hover{background:var(--btn-hover)}
#transition{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;pointer-events:all}
#transition .plof{font-family:var(--font-title);font-size:3rem;color:var(--accent);animation:plofPulse .7s ease-in-out}
#transition .chapter-name{font-family:var(--font-title);font-size:1.5rem;color:var(--fg);margin-top:.5rem;opacity:0;animation:fadeUp .5s .4s forwards}
@keyframes plofPulse{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){
  #transition .plof,#transition .chapter-name{animation:none;opacity:1;transform:none}
}
#dice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;pointer-events:all}
#dice-overlay .dice-box{width:5rem;height:5rem;background:var(--card);border:3px solid var(--accent);border-radius:.8rem;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:3rem;font-weight:700;color:var(--accent);animation:diceShake .6s ease-out}
#dice-overlay .dice-result-text{font-family:var(--font-title);font-size:1.2rem;color:var(--fg);margin-top:1rem;opacity:0;animation:fadeUp .4s .7s forwards}
@keyframes diceShake{0%{transform:rotate(0)}20%{transform:rotate(15deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
@keyframes lumiGlow{0%,100%{filter:drop-shadow(0 0 4px var(--accent))}50%{filter:drop-shadow(0 0 12px var(--accent))}}
.lumi-icon{animation:lumiGlow 2s infinite;display:inline-block}
#confirm-restart{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:.6rem 1.2rem;border-radius:.5rem;font-family:var(--font-title);font-size:.9rem;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style>
<script data-goatcounter="https://ildemoralesmates.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div id="app">
  <div id="intro-screen">
    <h1>🚀 <span id="intro-title"></span></h1>
    <p class="subtitle" id="intro-sub"></p>
    <div class="mechanics">
      <ul id="intro-rules"></ul>
    </div>
    <label id="intro-name-label" style="display:block;margin-top:1rem;font-family:var(--font-title)"></label>
    <input type="text" id="name-input" maxlength="20" autofocus>
    <br>
    <button class="start-btn" onclick="startGame()" id="intro-start-btn"></button>
  </div>
  <div id="game-screen" hidden>
    <header>
      <h1>🚀 <span id="hdr-title"></span></h1>
      <div id="hdr-btns">
        <button id="btn-val" onclick="setLang('ca')">VAL</button>
        <button id="btn-cas" onclick="setLang('es')">CAS</button>
        <button onclick="toggleMap()">🗺️</button>
        <button id="restart-btn" onclick="handleRestart()">↺</button>
      </div>
    </header>
    <div id="map-container" hidden></div>
    <div class="chapter-plate" id="chapter-plate" hidden></div>
    <div id="objectives"></div>
    <div id="backpack"></div>
    <div id="story"></div>
    <div id="choices"></div>
    <div id="ending-box" hidden></div>
    <div id="endings-counter"></div>
  </div>
</div>
<div id="transition" hidden></div>
<div id="dice-overlay" hidden></div>
<div id="confirm-restart" hidden></div>

<script>
/* ===== BILINGÜE ===== */
const x = (ca, es) => ({ca, es});
let lang = 'ca';
function T(v){ return (v && typeof v === 'object' && ('ca' in v)) ? v[lang] : v; }

const TITLE = x("L'Última Senyal", "La Última Señal");
const DESC  = x("Una aventura en l'espai", "Una aventura en el espacio");
const TITLE_FULL = x("L'Última Senyal: Una aventura en l'espai", "La Última Señal: Una aventura en el espacio");

/* ===== UI STRINGS ===== */
const UI = {
  nameQ: x("Com et diuen?", "¿Cómo te llamas?"),
  namePh: x("Escriu el teu nom", "Escribe tu nombre"),
  start: x("Començar l'aventura", "Comenzar la aventura"),
  mochila: x("Motxilla:", "Mochila:"),
  linterna: x("🔦 Llanterna estel·lar", "🔦 Linterna estelar"),
  bocadillo: x("🥪 Entrepà", "🥪 Bocadillo"),
  diente: x("🦷 Dent de gel", "🦷 Diente de hielo"),
  finales: (n,t) => x(`Finals descoberts: ${n} de ${t}`, `Finales descubiertos: ${n} de ${t}`),
  undo: x("↩ Tornar a l'última decisió", "↩ Volver a la última decisión"),
  restart: x("🔄 Començar de nou", "🔄 Empezar de nuevo"),
  playAgain: x("🔄 Tornar a jugar", "🔄 Volver a jugar"),
  heroPlay: x("🌟 Tornar a jugar", "🌟 Volver a jugar"),
  confirmRestart: x("Toca de nou per a reiniciar", "Toca otra vez para empezar de nuevo"),
  diceDefault: (n) => x(`Has tret un ${n}`, `Has sacado un ${n}`),
  rules: x(
    [
      "Explora tres planetes i troba els <b>3 cristalls de freqüència</b> per a desxifrar un senyal misteriós.",
      "Guarda objectes a la teua <b>Motxilla</b>: alguns obrin camins que uns altres no.",
      "De vegades hauràs de llançar un <b>dau</b> per a decidir la teua sort.",
      "Descobreix el <b>mapa estel·lar</b> a mesura que avances.",
      "Hi ha <b>9 finals</b> diferents. Sempre pots tornar a l'última decisió.",
    ],
    [
      "Explora tres planetas y encuentra los <b>3 cristales de frecuencia</b> para descifrar una señal misteriosa.",
      "Guarda objetos en tu <b>Mochila</b>: algunos abren caminos que otros no.",
      "A veces tendrás que lanzar un <b>dado</b> para decidir tu suerte.",
      "Descubre el <b>mapa estelar</b> a medida que avances.",
      "Hay <b>9 finales</b> diferentes. Siempre puedes volver a la última decisión.",
    ]
  ),
};

const ERA_NAMES = {
  dino:    x('🌋 Planeta Pyros',    '🌋 Planeta Pyros'),
  hielo:   x('❄️ Planeta Glacius',  '❄️ Planeta Glacius'),
  sombra:  x('🌑 Planeta Umbra',    '🌑 Planeta Umbra'),
  tierra:  x('🏠 Casa',             '🏠 Casa'),
  espacio: x('🚀 Espai profund',    '🚀 Espacio profundo'),
};
const MAP_LABELS = {
  tierra: x('Terra','Tierra'), pyros: x('Pyros','Pyros'),
  glacius: x('Glacius','Glacius'), umbra: x('Umbra','Umbra'),
};

/* ===== STATE & ENGINE ===== */
const SAVE_KEY = 'ultimaSenal_v2';
const ALL_ENDINGS = ['tele','lava','hielo','perdido','sombras','circo','piratas','bueno','heroe'];
let s = {};
let hist = [];
let discoveredEndings = new Set();
let restartPending = false;
let transitioning = false;

function cleanName(n){return n.replace(/[<>&"']/g,'')}
function defaultState(){
  return {scene:'prologo',nom:'',linterna:false,bocadillo:false,
    trici:false,julia:false,gears:0,pagado:false,retornado:false,
    lastDice:0,visitated:['tierra']}
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l === 'es' ? 'es' : 'ca';
  document.title = T(TITLE_FULL);
  document.getElementById('btn-val').className = l==='ca' ? 'lang-active' : '';
  document.getElementById('btn-cas').className = l==='es' ? 'lang-active' : '';
  document.getElementById('hdr-title').textContent = T(TITLE);
  if(!document.getElementById('game-screen').hidden) renderScene();
  else renderIntro();
  saveGame();
}

function renderIntro(){
  document.getElementById('intro-title').textContent = T(TITLE);
  document.getElementById('intro-sub').textContent = T(DESC);
  document.getElementById('intro-name-label').textContent = T(UI.nameQ);
  document.getElementById('name-input').placeholder = T(UI.namePh);
  document.getElementById('intro-start-btn').textContent = T(UI.start);
  const rules = T(UI.rules);
  document.getElementById('intro-rules').innerHTML = rules.map(r => `<li>${r}</li>`).join('');
  document.getElementById('endings-counter').textContent = T(UI.finales(discoveredEndings.size, ALL_ENDINGS.length));
}

function startGame(){
  let raw = document.getElementById('name-input').value.trim();
  raw = cleanName(raw);
  if(!raw) return;
  s = defaultState();
  s.nom = raw;
  hist = [];
  document.getElementById('intro-screen').hidden = true;
  document.getElementById('game-screen').hidden = false;
  renderScene();
  saveGame();
}

function hn(text){
  text = text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, (m,masc,fem) => s.gen==='f'?fem:masc);
  text = text.replace(/\{nom\}/g, `<b>${(s.nom||'').toUpperCase()}</b>`);
  text = text.replace(/\bLumi\b/g,'<b>LUMI</b>');
  return text;
}

function renderText(lines){
  return lines.map(raw => {
    let l = T(raw);
    if(l.startsWith('>')) return `<p class="dialogue">${hn(l.slice(1))}</p>`;
    if(l.startsWith('?')) return `<div class="riddle">${hn(l.slice(1))}</div>`;
    if(l.startsWith('!')) return `<div class="hint">${hn(l.slice(1))}</div>`;
    return `<p>${hn(l)}</p>`;
  }).join('');
}

function renderScene(){
  const sc = S[s.scene];
  if(!sc){console.error('Missing scene:',s.scene);return}
  const plate = document.getElementById('chapter-plate');
  if(sc.era && ERA_NAMES[sc.era]){
    plate.hidden = false;
    plate.innerHTML = `<h2>${T(ERA_NAMES[sc.era])}</h2>`;
    document.documentElement.setAttribute('data-era',sc.era);
  } else { plate.hidden = true; }
  const objEl = document.getElementById('objectives');
  objEl.innerHTML = [0,1,2].map(i =>
    `<div class="obj-slot ${s.gears>i?'found':''}">${s.gears>i?'💎':'◇'}</div>`
  ).join('');
  const bp = document.getElementById('backpack');
  let chips = [];
  if(s.linterna) chips.push(`<span class="chip">${T(UI.linterna)}</span>`);
  if(s.bocadillo) chips.push(`<span class="chip">${T(UI.bocadillo)}</span>`);
  if(s.diente) chips.push(`<span class="chip">${T(UI.diente)}</span>`);
  bp.innerHTML = chips.length ? `<b>${T(UI.mochila)}</b> ${chips.join('')}` : '';
  const lines = typeof sc.text === 'function' ? sc.text(s) : sc.text;
  document.getElementById('story').innerHTML = renderText(lines);
  const choicesEl = document.getElementById('choices');
  const endBox = document.getElementById('ending-box');
  if(sc.ending){
    choicesEl.innerHTML = '';
    const endType = typeof sc.ending === 'function' ? sc.ending(s) : sc.ending;
    const title = typeof sc.title === 'function' ? sc.title(s) : T(sc.title);
    endBox.hidden = false;
    endBox.className = endType==='bad'?'bad':endType==='bueno'?'good':'hero';
    let btns = '';
    if(endType==='bad'){
      btns = `<button class="btn-undo" onclick="undo()">${T(UI.undo)}</button>
              <button class="btn-restart" onclick="fullRestart()">${T(UI.restart)}</button>`;
    } else if(endType==='heroe'){
      btns = `<button class="btn-hero" onclick="fullRestart()">${T(UI.heroPlay)}</button>`;
    } else {
      btns = `<button class="btn-undo" onclick="fullRestart()">${T(UI.playAgain)}</button>`;
    }
    endBox.innerHTML = `<h2>${endType==='bad'?'💥':'🌟'} ${title}</h2><div id="ending-btns">${btns}</div>`;
    const sceneToEnding = {
      fin_tele:'tele',fin_lava:'lava',fin_hielo:'hielo',fin_perdido:'perdido',
      fin_sombras:'sombras',fin_circo:'circo',fin_piratas:'piratas',
      final_bueno:'bueno',final_heroe:'heroe'
    };
    if(sceneToEnding[s.scene]) discoveredEndings.add(sceneToEnding[s.scene]);
    saveGame();
  } else {
    endBox.hidden = true;
    const choices = sc.choices.filter(c => !c.if || c.if(s));
    choicesEl.innerHTML = choices.map((c,i) =>
      `<button class="${c.alt?'alt':''}" onclick="choose(${i})">${hn(T(c.t))}</button>`
    ).join('');
  }
  document.getElementById('endings-counter').textContent = T(UI.finales(discoveredEndings.size, ALL_ENDINGS.length));
  renderMap();
  window.scrollTo({top:0});
}

function choose(idx){
  if(transitioning) return;
  const sc = S[s.scene];
  const avail = sc.choices.filter(c => !c.if || c.if(s));
  const c = avail[idx];
  if(!c) return;
  hist.push({scene:s.scene, s:JSON.parse(JSON.stringify(s))});
  if(c.set) c.set(s);
  if(c.dice){ s.lastDice = Math.ceil(Math.random()*6); }
  const nextScene = typeof c.go === 'function' ? c.go(s) : c.go;
  const nextSc = S[nextScene];
  if(nextSc && nextSc.onEnter){
    if(!s['_entered_'+nextScene]){ nextSc.onEnter(s); s['_entered_'+nextScene] = true; }
  }
  s.scene = nextScene;
  const prevEra = sc.era;
  const newEra = nextSc ? nextSc.era : null;
  if(c.dice){
    const dtxt = c.diceText ? T(c.diceText(s)) : T(UI.diceDefault(s.lastDice));
    showDice(s.lastDice, dtxt, () => {
      if(newEra && newEra !== prevEra && !sc.ending){
        showTransition(nextSc, () => { renderScene(); saveGame(); });
      } else { renderScene(); saveGame(); }
    });
  } else if(newEra && newEra !== prevEra && !sc.ending){
    showTransition(nextSc, () => { renderScene(); saveGame(); });
  } else { renderScene(); saveGame(); }
}

function undo(){
  if(hist.length === 0) return;
  const snap = hist.pop();
  s = snap.s; s.scene = snap.scene;
  renderScene(); saveGame();
}

function showTransition(sc, cb){
  transitioning = true;
  const el = document.getElementById('transition');
  const name = sc.era && ERA_NAMES[sc.era] ? T(ERA_NAMES[sc.era]) : '';
  el.innerHTML = `<div class="plof">¡WHOOSH!</div><div class="chapter-name">${name}</div>`;
  el.hidden = false;
  setTimeout(()=>{el.hidden=true;transitioning=false;cb();},1400);
}

function showDice(result, text, cb){
  transitioning = true;
  const el = document.getElementById('dice-overlay');
  el.innerHTML = `<div class="dice-box">${result}</div><div class="dice-result-text">${text}</div>`;
  el.hidden = false;
  setTimeout(()=>{el.hidden=true;transitioning=false;cb();},1800);
}

function toggleMap(){
  const mc = document.getElementById('map-container');
  mc.hidden = !mc.hidden;
  if(!mc.hidden) renderMap();
}

function renderMap(){
  const mc = document.getElementById('map-container');
  const v = s.visitated || [];
  const planets = [
    {id:'tierra',cx:100,cy:180,r:14,color:v.includes('tierra')?'#58a6ff':'#555'},
    {id:'pyros',cx:40,cy:60,r:12,color:v.includes('pyros')?'#f97316':'#555'},
    {id:'glacius',cx:160,cy:40,r:12,color:v.includes('glacius')?'#38bdf8':'#555'},
    {id:'umbra',cx:100,cy:15,r:12,color:v.includes('umbra')?'#a78bfa':'#555'},
  ];
  let svg = `<svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" style="background:transparent">`;
  for(let i=0;i<25;i++){
    const xp=Math.random()*200,yp=Math.random()*210,r=Math.random()*1.2+.3;
    svg+=`<circle cx="${xp.toFixed(1)}" cy="${yp.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--fg)" opacity=".3"/>`;
  }
  svg+=`<line x1="100" y1="180" x2="40" y2="60" stroke="var(--border)" stroke-width="1" stroke-dasharray="4"/>`;
  svg+=`<line x1="40" y1="60" x2="160" y2="40" stroke="var(--border)" stroke-width="1" stroke-dasharray="4"/>`;
  svg+=`<line x1="160" y1="40" x2="100" y2="15" stroke="var(--border)" stroke-width="1" stroke-dasharray="4"/>`;
  svg+=`<line x1="100" y1="180" x2="160" y2="40" stroke="var(--border)" stroke-width="1" stroke-dasharray="4" opacity=".4"/>`;
  for(const p of planets){
    svg+=`<circle cx="${p.cx}" cy="${p.cy}" r="${p.r}" fill="${p.color}" class="map-planet"/>`;
    svg+=`<text x="${p.cx}" y="${p.cy+p.r+12}" text-anchor="middle" fill="var(--fg)" font-size="9" font-family="var(--font-body)">${T(MAP_LABELS[p.id])}</text>`;
  }
  const cur = planets.find(p => {
    if(s.scene.startsWith('pyros') || s.scene.startsWith('fin_lava')) return p.id==='pyros';
    if(s.scene.startsWith('glacius') || s.scene.startsWith('fin_hielo') || s.scene.startsWith('fin_perdido')) return p.id==='glacius';
    if(s.scene.startsWith('umbra') || s.scene.startsWith('fin_sombras') || s.scene.startsWith('fin_circo')) return p.id==='umbra';
    return p.id==='tierra';
  });
  if(cur){
    svg+=`<circle cx="${cur.cx}" cy="${cur.cy}" r="${cur.r+5}" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".6">
      <animate attributeName="r" from="${cur.r+4}" to="${cur.r+8}" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".6" to=".1" dur="1.5s" repeatCount="indefinite"/>
    </circle>`;
  }
  svg += `</svg>`;
  mc.innerHTML = svg;
}

function handleRestart(){
  if(restartPending){ fullRestart(); return; }
  restartPending = true;
  const cr = document.getElementById('confirm-restart');
  cr.textContent = T(UI.confirmRestart);
  cr.hidden = false;
  setTimeout(()=>{restartPending=false;cr.hidden=true;},2500);
}
function fullRestart(){
  restartPending = false;
  document.getElementById('confirm-restart').hidden = true;
  document.getElementById('game-screen').hidden = true;
  document.getElementById('intro-screen').hidden = false;
  document.getElementById('name-input').value = '';
  hist = [];
  s = defaultState();
  renderIntro();
}

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({s,hist,disc:[...discoveredEndings],lang}));
  }catch(e){}
}
function loadGame(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(d){
      if(d.lang === 'ca' || d.lang === 'es') lang = d.lang;
      if(d.disc) discoveredEndings = new Set(d.disc);
      if(d.s && d.s.scene && S[d.s.scene]){
        s = d.s;
        hist = d.hist || [];
        document.getElementById('intro-screen').hidden = true;
        document.getElementById('game-screen').hidden = false;
        setLang(lang);
        renderScene();
        return true;
      }
    }
  }catch(e){}
  return false;
}

});
